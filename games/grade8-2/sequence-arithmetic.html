r:white;border:0;padding:11px 17px;border-radius:11px;font-weight:700}.smallbtn{font-size:13px;padding:9px 11px}.status{display:grid;grid-template-columns:2fr repeat(4,1fr) auto auto;gap:8px;margin-bottom:13px;align-items:stretch}.stat{padding:10px 9px;text-align:center;border-radius:12px;background:#e9f7f2;color:var(--deep);min-height:62px}.stat small{display:block;color:#6e8490;font-size:12px;margin-bottom:5px}.stat strong{font-size:17px}.bar{height:10px;border-radius:10px;background:#e8eff3;overflow:hidden;margin:5px 0 15px}.bar>div{height:100%;background:linear-gradient(90deg,#168b80,#62cfc0);width:0;transition:width .2s}.question-card{border:2px solid #a1d7ce;border-radius:20px;min-height:265px;background:#fff;padding:25px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.topic{text-align:center;color:#687c87;font-size:15px}.math-question{text-align:center;font-size:clamp(23px,3vw,34px);line-height:1.8;font-weight:700;overflow-wrap:anywhere}.seq{letter-spacing:1px}.question-footer{display:flex;justify-content:flex-end;align-items:center}.scratch{border:1px solid #d19b2d;color:#7d4e00;background:#fff6d7;border-radius:12px;padding:10px 15px;font-weight:700}.answer-panel{margin-top:14px;background:#f5faf8;border:1px solid #dceae5;border-radius:17px;padding:21px;text-align:center}.answer-panel h3{font-size:16px;color:var(--deep);margin:0 0 13px}.inputrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.ans-input{width:min(100%,340px);padding:15px;font-size:24px;text-align:center;border:2px solid #8bc8bd;border-radius:12px;background:white}.ans-input:focus{outline:3px solid #9fe5d9}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:630px;margin:5px auto}.choice{padding:14px 10px;border-radius:12px;border:2px solid #b6d6d0;background:#fff;font-weight:700;min-height:57px}.choice.selected{background:#d3f3eb;border-color:#0d8f80}.actionrow{display:flex;justify-content:center;margin:19px 0 6px;gap:10px;flex-wrap:wrap}.hint{min-height:24px;font-size:13px;color:#6c7f87}.feedback{margin-top:17px;text-align:left;border-radius:14px;padding:17px 20px;line-height:1.85;border:1px solid #aad8c7;background:#f0fbf6}.feedback.wrong{background:#fff5f5;border-color:#efb8c3}.feedback h3{margin:0 0 8px}.steps{margin:10px 0;padding-left:21px}.steps li{margin:5px 0}.resulttop{text-align:center}.scorebig{font-size:52px;font-weight:900;color:var(--main);margin:9px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.resultgrid .stat{padding:18px 6px}.review{margin:12px 0;border:1px solid #dde5e8;border-radius:14px;padding:15px;background:#fafdfc;line-height:1.75}.review.wrong{border-left:4px solid #cb6070}.review.correct{border-left:4px solid #4da996}.review b{display:block}.review .math-question{font-size:20px;text-align:left}.save{margin:10px;color:var(--muted);font-size:14px}.grade{display:inline-block;border-radius:100px;background:#e0f4ec;color:#0d7068;padding:4px 10px;font-size:12px}.warn{color:#b14848}@media(max-width:800px){.status{grid-template-columns:repeat(4,minmax(0,1fr))}.status .stat:first-child{grid-column:span 2}.status button{grid-column:span 2}.resultgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.shell{padding:10px 10px 44px}.panel{padding:14px;border-radius:16px}.modes{grid-template-columns:1fr}.status{gap:5px}.stat{padding:9px 3px}.stat strong{font-size:14px}.question-card{padding:17px 11px}.option-grid{grid-template-columns:1fr 1fr}.math-question{font-size:24px}}

<header class="intro"><h1>🔢 1-1 認識數列與等差數列</h1><p>依照八下習作與《基礎 GO》規劃七種模式｜動態出題、詳解、錯題回顧、共用計算紙</p></header>
<section class="panel" id="menu"><h2>選擇練習模式</h2><div class="modes" id="modeGrid"></div><div class="settings"><button class="primary" id="start">開始挑戰（10 題）</button></div><p class="hint">每個模式固定 10 題，直接挑戰；題目依教材概念隨機產生，成績按模式獨立記錄。</p></section>
<section id="game" class="hidden"><div class="status"><div class="stat"><small>模式</small><strong id="sMode"></strong></div><div class="stat"><small>進度</small><strong id="sCount">1/10</strong></div><div class="stat"><small>答對</small><strong id="sRight">0</strong></div><div class="stat"><small>連擊</small><strong id="sCombo">0</strong></div><div class="stat"><small>時間</small><strong id="sTime">00:00</strong></div><button class="primary smallbtn" id="restart">重新測驗</button><button class="secondary smallbtn" id="reselect">重選模式</button></div><div class="bar"><div id="progress"></div></div><article class="question-card"><div class="topic" id="qTopic">請回答問題</div><div class="math-question" id="qText"></div><div class="question-footer"><button type="button" class="scratch" id="scratch">✏️ 開啟計算紙</button></div></article><section class="answer-panel"><h3 id="answerTitle">請作答</h3><div id="answerUI"></div><p class="hint" id="inputHint">請輸入數字或最簡分數。</p></section><div class="actionrow"><button class="primary" id="submit">送出答案（Enter）</button><button class="primary hidden" id="next">下一題 →</button></div><article id="feedback" class="feedback hidden"></article></section>

</main><script src="../../js/scratchpad.js"></script><script src="../../js/scratchpad-template.js"></script><script src="../../js/math-expression-input.js?v=2.3.0"></script>
<script type="module">
import {saveGameScore} from '../../js/scores.js';
const GAME_ID='sequence-arithmetic';
const MODES=[
{id:'sequenceBasics',name:'數列規律與一般項',desc:'填入缺項、觀察平方與循環規律、認識第 n 項'},
{id:'arithmeticJudge',name:'等差數列的判別',desc:'辨認等差數列、求公差，包含反例與零公差'},
{id:'arithmeticNth',name:'缺項與第 n 項',desc:'等差缺項、指定項、末項、已知數列反推'},
{id:'arithmeticReverse',name:'反推首項、公差與項數',desc:'已知兩項、首末項或公差，反向求未知'},
{id:'arithmeticMean',name:'等差中項',desc:'求等差中項、三項和、由中項反推端點'},
{id:'arithmeticApplication',name:'等差數列應用',desc:'圖形增長、生活情境、首次超過門檻'},
{id:'comprehensive',name:'綜合挑戰',desc:'混合以上六種模式，隨機抽題'}];
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>n<0?`(${n})`:String(n),term=(a,d,k)=>a+(k-1)*d,show=n=>String(n).replace(/-/g,'−'),niceSeq=a=>`<span class="seq">${a.map(show).join('，')}，……</span>`,signed=(a,d,n)=>`${fmt(a)}＋(${n}−1)×${fmt(d)}`,explain=(...x)=>x;
let mode='sequenceBasics',difficulty=2,count=10,questions=[],index=0,records=[],startAt=0,clock=null,done=false,selected=null,widget=null,current=null,answered=false;
function intA(){return ri(-20*difficulty,25*difficulty)}function delta(){let d=ri(-3-3*difficulty,3+3*difficulty);return d===0?pick([-4,4]):d}function question(topic,html,answer,steps,kind='number',choices=null,subtype=''){return {topic,html,answer:String(answer),steps,kind,choices,subtype}};
const G={
sequenceBasics:[
()=>{const a=intA(),d=delta(),pos=ri(3,5),arr=Array.from({length:5},(_,i)=>term(a,d,i+1));const value=arr[pos-1];arr[pos-1]='□';return question('觀察規律，填入缺少的數',niceSeq(arr),' '+value,explain(`觀察相鄰兩項的差：${show(term(a,d,2))}−${show(a)}＝${show(d)}。`,`每一項都比前一項${d>0?'增加':'減少'} ${Math.abs(d)}。`,`第 ${pos} 項＝${show(a)}＋(${pos}−1)×(${show(d)})＝${show(value)}。`),'number',null,'arithMissing')},
()=>{const a=ri(1,7),scale=ri(1,3),n=ri(5,12),arr=Array.from({length:4},(_,i)=>scale*(a+i)*(a+i)),val=scale*(a+n-1)**2;return question('觀察平方數的規律',`${niceSeq(arr)}<div style="font-size:17px;font-weight:500">請求出第 ${n} 項。</div>`,val,explain(`第 1 項＝${scale}×${a}²，第 2 項＝${scale}×${a+1}²。`,`第 n 項是 ${scale}×(${a}+n−1)²。`,`第 ${n} 項＝${scale}×${a+n-1}²＝${val}。`),'number',null,'squarePattern')},
()=>{const a=intA(),d=delta(),n=ri(6,15);return question('已知數列一般項，求指定項',`a<sub>n</sub>＝${show(a)}＋(n−1)×${fmt(d)}<div style="font-size:17px;font-weight:500">求 a<sub>${n}</sub>。</div>`,term(a,d,n),explain('將 n 代入一般項公式。',`a${n}＝${signed(a,d,n)}。`,`計算得 ${show(term(a,d,n))}。`),'number',null,'generalNth')},
()=>{const base=ri(1,7),inc=ri(2,8),n=ri(6,15);return question('規律圖形的一般項',`第 1 圖有 ${base} 根吸管，第 2 圖有 ${base+inc} 根，第 3 圖有 ${base+2*inc} 根。<div style="font-size:17px">第 ${n} 圖有多少根？</div>`,term(base,inc,n),explain(`每增加一個圖形，就多 ${inc} 根。`,`第 n 圖＝${base}＋(n−1)×${inc}。`,`第 ${n} 圖＝${term(base,inc,n)} 根。`),'number',null,'figurePattern')},
()=>{const period=pick([4,5,6]),list=Array.from({length:period},()=>ri(1,9)),n=ri(20,90),idx=(n-1)%period;return question('循環數列的指定位置',`${niceSeq(list.concat(list.slice(0,2)))}（之後每 ${period} 項重複一次）<div style="font-size:17px">第 ${n} 項是多少？</div>`,list[idx],explain(`每 ${period} 項為一個循環。`,`(${n}−1) ÷ ${period} 的餘數是 ${idx}，因此對應循環中的第 ${idx+1} 個位置。`,`答案為 ${list[idx]}。`),'number',null,'cycle')}
],
arithmeticJudge:[
()=>{const a=intA(),d=ri(-8,8),yes=Math.random()<.5,arr=Array.from({length:5},(_,i)=>term(a,d,i+1));if(!yes){const pos=ri(2,4);arr[pos]+=pick([-3,-2,2,3]);}return question('判斷是否為等差數列',`${niceSeq(arr)}<div style="font-size:17px">這是等差數列嗎？</div>`,yes?'是':'否',explain('檢查每兩項之間「後項−前項」是否固定。',`相鄰差依序為：${arr.slice(1).map((v,i)=>show(v-arr[i])).join('，')}。`,yes?`差均為 ${d}，因此是等差數列（公差可以是 0）。`:'各項的差不完全相同，因此不是等差數列。'),'choice',['是','否'],'judge')},
()=>{const a=intA(),d=ri(-10,10),arr=Array.from({length:5},(_,i)=>term(a,d,i+1));return question('求等差數列的公差',`${niceSeq(arr)}<div style="font-size:17px">此等差數列的公差 d＝？</div>`,d,explain('公差的定義是後項減前項。',`d＝${show(arr[1])}−${show(arr[0])}。`,`所以 d＝${show(d)}。`),'number',null,'difference')},
()=>{const a=intA(),d=ri(-7,7),n=ri(5,9),yes=Math.random()<.5,arr=Array.from({length:n},(_,i)=>term(a,d,i+1));if(!yes){const pos=ri(1,n-2);arr[pos]+=ri(2,5);}return question('等差數列的觀念判斷',`${niceSeq(arr.slice(0,6))}<div style="font-size:17px">相鄰兩項的差是否都相同？</div>`,yes?'相同':'不相同',explain('依序計算相鄰項相減。',`相鄰差：${arr.slice(1).map((v,i)=>show(v-arr[i])).join('，')}。`,yes?'所有差相同，所以是等差數列。':'至少有兩個差不同，所以不符合等差數列定義。'),'choice',['相同','不相同'],'differenceJudge')}
],
arithmeticNth:[
()=>{const a=intA(),d=delta(),n=ri(6,24);return question('已知首項、公差求指定項',`a<sub>1</sub>＝${show(a)}，d＝${show(d)}<div style="font-size:18px">求 a<sub>${n}</sub>。</div>`,term(a,d,n),explain('等差數列公式：aₙ＝a₁＋(n−1)d。',`a${n}＝${signed(a,d,n)}。`,`＝${show(term(a,d,n))}。`),'number',null,'nth')},
()=>{const a=intA(),d=delta(),pos=ri(3,7),arr=Array.from({length:7},(_,i)=>term(a,d,i+1));const ans=arr[pos-1];arr[pos-1]='□';return question('等差數列的缺項',niceSeq(arr),ans,explain(`公差 d＝${show(term(a,d,2))}−${show(a)}＝${show(d)}。`,`缺少的是第 ${pos} 項：a${pos}＝${signed(a,d,pos)}。`,`所以應填 ${show(ans)}。`),'number',null,'missing')},
()=>{const a=intA(),d=delta(),n=ri(5,25),last=term(a,d,n);return question('已知首項、末項與項數',`一個等差數列首項為 ${show(a)}，公差為 ${show(d)}，共有 ${n} 項。<div style="font-size:18px">末項是多少？</div>`,last,explain('末項就是 aₙ。',`a${n}＝${signed(a,d,n)}。`,`末項是 ${show(last)}。`),'number',null,'last')}
],
arithmeticReverse:[
()=>{const a=intA(),d=delta(),n=ri(5,19),last=term(a,d,n);return question('已知首末項，求公差',`等差數列有 ${n} 項，首項為 ${show(a)}，末項為 ${show(last)}。<div style="font-size:18px">公差 d＝？</div>`,d,explain(`由 aₙ＝a₁＋(n−1)d。`,`d＝(${show(last)}−${fmt(a)})÷(${n}−1)。`,`算得 d＝${show(d)}。`),'number',null,'reverseD')},
()=>{const a=intA(),d=delta(),n=ri(5,19),last=term(a,d,n);return question('已知第 n 項，求首項',`a<sub>${n}</sub>＝${show(last)}，公差 d＝${show(d)}。<div style="font-size:18px">首項 a<sub>1</sub>＝？</div>`,a,explain('由公式 aₙ＝a₁＋(n−1)d。',`a₁＝${show(last)}−(${n}−1)×${fmt(d)}。`,`所以 a₁＝${show(a)}。`),'number',null,'reverseA')},
()=>{const a=intA(),d=delta(),n=ri(6,30),last=term(a,d,n);return question('已知首末項，求項數',`首項為 ${show(a)}，公差為 ${show(d)}，末項為 ${show(last)}。<div style="font-size:18px">此數列共有幾項？</div>`,n,explain('由 aₙ＝a₁＋(n−1)d，先把末項代入。',`${show(last)}＝${show(a)}＋(n−1)×${fmt(d)}。`,`n＝(${show(last)}−${fmt(a)})÷${fmt(d)}＋1＝${n}。`),'number',null,'reverseN')},
()=>{const a=intA(),d=delta(),m=ri(3,7),n=ri(m+3,m+15),am=term(a,d,m),an=term(a,d,n);return question('已知任兩項，求公差',`a<sub>${m}</sub>＝${show(am)}，a<sub>${n}</sub>＝${show(an)}。<div style="font-size:18px">公差 d＝？</div>`,d,explain(`等差數列的兩項差＝項數差×公差。`,`a${n}−a${m}＝(${n}−${m})d。`,`d＝(${show(an)}−${fmt(am)})÷${n-m}＝${show(d)}。`),'number',null,'twoNth')}
],
arithmeticMean:[
()=>{const mid=intA(),d=delta(),a=mid-d,c=mid+d;return question('求等差中項',`已知 ${show(a)}，□，${show(c)} 成等差數列。<div style="font-size:18px">□＝？</div>`,mid,explain('等差中項＝兩端數的平均。',`中項＝(${show(a)}＋${fmt(c)})÷2。`,`答案＝${show(mid)}。`),'number',null,'mean')},
()=>{const mid=ri(2,35),d=delta(),a=mid-d,c=mid+d;return question('等差中項的應用',`a、b、c 成等差數列，b＝${mid}。<div style="font-size:18px">求 a＋b＋c。</div>`,3*mid,explain('等差中項性質：a＋c＝2b。',`a＋b＋c＝2b＋b＝3b。`,`＝3×${mid}＝${3*mid}。`),'number',null,'meanSum')},
()=>{const a=intA(),d=delta(),c=a+2*d,mid=a+d;return question('已知首尾和一項求另一項',`a、b、c 成等差數列。a＝${show(a)}，b＝${show(mid)}。<div style="font-size:18px">求 c。</div>`,c,explain('三數成等差數列時，b−a＝c−b。',`c＝2b−a＝2×${fmt(mid)}−${fmt(a)}。`,`所以 c＝${show(c)}。`),'number',null,'meanReverse')}
],
arithmeticApplication:[
()=>{const a=ri(4,18),d=ri(2,9),n=ri(6,22),v=term(a,d,n);return question('每週增加固定數量的應用',`某學生第一週背 ${a} 個單字，以後每週都比前一週多 ${d} 個。<div style="font-size:18px">第 ${n} 週背幾個單字？</div>`,v,explain('每週數量形成等差數列。',`首項 a₁＝${a}，公差 d＝${d}。`,`第 ${n} 週＝${a}＋(${n}−1)×${d}＝${v}。`),'number',null,'weekly')},
()=>{const a=ri(3,16),d=ri(2,8),n=ri(6,25),target=term(a,d,n-1),val=term(a,d,n);return question('首次超過門檻',`某工廠第一天完成 ${a} 件作品，以後每天增加 ${d} 件。<div style="font-size:18px">從第幾天開始，每天完成數量<strong>超過 ${target}</strong> 件？</div>`,n,explain(`第 k 天完成 aₖ＝${a}＋(k−1)×${d} 件。`,`解不等式：${a}＋(k−1)×${d}＞${target}。`,`第 ${n-1} 天恰好 ${target} 件，第 ${n} 天 ${val} 件，所以是第 ${n} 天。`),'number',null,'firstExceed')},
()=>{const first=ri(4,14),inc=ri(2,8),n=ri(6,25),v=term(first,inc,n);return question('圖形規律與第 n 圖',`依規律排列圖形：圖一有 ${first} 根小棒，圖二有 ${first+inc} 根，圖三有 ${first+2*inc} 根。<div style="font-size:18px">圖 ${n} 有幾根小棒？</div>`,v,explain(`每增加一個圖形，增加 ${inc} 根小棒。`,`aₙ＝${first}＋(n−1)×${inc}。`,`圖 ${n} 有 ${v} 根。`),'number',null,'sticks')},
()=>{const total=ri(2,30)*3;return question('三個數成等差數列的和',`三人分得的獎金金額成等差數列，總共 ${total} 元。<div style="font-size:18px">中間那人的獎金是多少元？</div>`,total/3,explain('三數成等差數列時，首末兩數和＝2×中項。','三人的總和＝3×中間項。',`中間一人的獎金＝${total}÷3＝${total/3} 元。`),'number',null,'threeSum')}
]};
const used=new Set();let generationCounter=0;
function generate(modeId){const list=modeId==='comprehensive'?Object.values(G).flat():G[modeId];let q;for(let t=0;t<200;t++){const fun=list[(generationCounter+t)%list.length];q=fun();const key=q.topic+'|'+q.html.replace(/<[^>]*>/g,'').replace(/\s+/g,'');if(!used.has(key)){used.add(key);generationCounter+=t+1;return q}}generationCounter++;return q}
function makeQuestions(){used.clear();generationCounter=ri(0,5);questions=Array.from({length:count},()=>generate(mode));}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatClock(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function choose(i){selected=MODES[i].id;document.querySelectorAll('.mode').forEach((e,j)=>e.classList.toggle('active',i===j))}
function setView(id){['menu','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'instant'});if(id!=='game')window.hideGameScratchpadButton?.();}
function confirmLeave(){return done||confirm('目前測驗尚未完成，確定要離開嗎？本次未完成的成績不會儲存。')}
function resetScratch(){try{window.resetGameScratchpad?.()}catch(e){console.warn(e)}}
function initWidget(){widget=null;const mount=$('mathMount'),fallback=$('nativeMount');mount.innerHTML='';fallback.classList.remove('hidden');if(!window.MathExpressionInput)return;try{widget=new window.MathExpressionInput({mountId:'mathMount',placeholder:'輸入整數或分數',allowRadical:false,allowFraction:true,allowPower:false,allowVariable:false,allowPlusMinus:false,validationMode:'numeric-radical',requireSimplifiedFraction:true,requireSimplifiedRadical:false,showPreview:true,autoFocus:false,onChange:()=>{$('inputHint').textContent='請確認答案後按送出。'}});fallback.classList.add('hidden')}catch(e){console.warn('使用一般答案輸入框',e);widget=null;mount.innerHTML=''}}
function readValue(){if(current.kind==='choice')return selectedChoice===null?{error:'請先選擇答案'}:selectedChoice;if(widget){const info=widget.validate?.();if(info&&!info.valid)return {error:info.message||'請輸入有效答案'};let s=(widget.getRawValue?.()??info?.raw??'').trim();if(!s)return {error:'請先輸入答案'};return {value:s}}let s=$('numericAnswer').value.trim();return s?{value:s}:{error:'請先輸入答案'}}
function rat(s){s=String(s).trim().replace(/−/g,'-').replace(/＋/g,'+').replace(/[（）]/g,c=>c==='（'?'(':')').replace(/\s/g,'').replace(/^\((.*)\)$/,'$1');if(/^[-+]?\d+$/.test(s))return Number(s);if(/^[-+]?\d+\/\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return b? a/b:NaN}return NaN}
let selectedChoice=null;
function render(){answered=false;selectedChoice=null;current=questions[index];$('sMode').textContent=MODES.find(m=>m.id===mode).name;$('sCount').textContent=`${index+1} / ${count}`;$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=(records.at(-1)?.combo||0);$('progress').style.width=`${Math.round(index/count*100)}%`;$('qTopic').textContent=current.topic;$('qText').innerHTML=current.html;$('feedback').classList.add('hidden');$('feedback').innerHTML='';$('submit').classList.remove('hidden');$('next').classList.add('hidden');$('inputHint').textContent=current.kind==='choice'?'選擇最符合題意的一項。':'請輸入整數或最簡分數，負數請加負號。';$('answerUI').innerHTML='';if(current.kind==='choice'){$('answerUI').innerHTML='<div class="option-grid">'+current.choices.map(c=>`<button type="button" class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';$('answerUI').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selectedChoice=b.dataset.choice;$('answerUI').querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));});}else{$('answerUI').innerHTML='<div id="mathMount"></div><div id="nativeMount"><input class="ans-input" id="numericAnswer" type="text" inputmode="text" autocomplete="off" placeholder="輸入答案，例如 -3 或 1/2"></div>';initWidget();if(!widget){$('numericAnswer').value='';$('numericAnswer').disabled=false;$('numericAnswer').focus()}}resetScratch();window.hideGameScratchpadButton?.();}
function submit(){if(answered)return;const v=readValue();if(v?.error){$('inputHint').textContent=v.error;return}const actual=current.kind==='choice'?v:v.value;const correct=current.kind==='choice'?actual===current.answer:Number.isFinite(rat(actual))&&Math.abs(rat(actual)-rat(current.answer))<1e-10;if(!correct&&current.kind!=='choice'&&!Number.isFinite(rat(actual))){$('inputHint').textContent='答案格式不正確，請輸入整數或最簡分數。';return}answered=true;const combo=correct?(records.at(-1)?.combo||0)+1:0;records.push({q:current,actual:String(actual),correct,combo});$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=combo;const f=$('feedback');f.className='feedback'+(correct?'':' wrong');f.innerHTML=`<h3>${correct?'✅ 答對了！':'❌ 再釐清這個觀念'}</h3><div>你的答案：<b>${esc(actual)}</b>　正確答案：<b>${esc(current.answer.trim())}</b></div><ol class="steps">${current.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===count-1?'查看測驗結果 →':'下一題 →';if(widget)widget.setDisabled?.(true);else if($('numericAnswer'))$('numericAnswer').disabled=true;}
function next(){if(!answered)return;if(index===count-1){finish();return}index++;render()}
function startGame(){mode=selected||MODES[0].id;count=10;records=[];index=0;done=false;makeQuestions();startAt=Date.now();clearInterval(clock);clock=setInterval(()=>{$('sTime').textContent=formatClock(Math.floor((Date.now()-startAt)/1000))},500);$('sTime').textContent='00:00';setView('game');render()}
async function finish(){done=true;clearInterval(clock);const seconds=Math.round((Date.now()-startAt)/1000),right=records.filter(r=>r.correct).length,wrong=count-right,score=Math.round(100*right/count),maxCombo=Math.max(0,...records.map(r=>r.combo));$('resultScore').textContent=score+' 分';$('resultSummary').textContent=`${MODES.find(m=>m.id===mode).name}｜${count} 題測驗`;$('resultStats').innerHTML=`<div class="stat"><small>答對</small><strong>${right}</strong></div><div class="stat"><small>答錯</small><strong>${wrong}</strong></div><div class="stat"><small>最高連擊</small><strong>${maxCombo}</strong></div><div class="stat"><small>時間</small><strong>${formatClock(seconds)}</strong></div>`;const wrongs=records.map((r,i)=>({...r,num:i+1})).filter(r=>!r.correct);$('reviewList').innerHTML=wrongs.length?wrongs.map(r=>`<div class="review wrong"><b>第 ${r.num} 題｜${esc(r.q.topic)}</b><div class="math-question">${r.q.html}</div><div class="warn">你的答案：${esc(r.actual)}</div><div>正確答案：<b>${esc(r.q.answer.trim())}</b></div><ol class="steps">${r.q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join(''):'<div class="review correct">🎉 全部答對！本次沒有錯題。</div>';$('saveStatus').textContent='☁️ 正在將成績儲存至共用成績系統……';setView('result');try{const res=await saveGameScore({game:GAME_ID,mode,score,correctCount:right,wrongCount:wrong,maxCombo,playTime:seconds});$('saveStatus').textContent=res?.success?'✅ 成績已儲存，可至我的成績與排行榜查看。':'⚠️ 本次結果已顯示，但雲端儲存未成功；請確認登入及遊戲註冊。'}catch(e){console.error(e);$('saveStatus').textContent='⚠️ 雲端儲存失敗，請檢查登入或網路連線。'}}
MODES.forEach((m,i)=>{$('modeGrid').insertAdjacentHTML('beforeend',`<button type="button" class="mode" data-index="${i}"><b>${i+1}. ${m.name}</b><small>${m.desc}</small></button>`)});$('modeGrid').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)choose(Number(b.dataset.index))});choose(0);$('start').onclick=startGame;$('submit').onclick=submit;$('next').onclick=next;$('restart').onclick=()=>{if(confirmLeave())startGame()};$('reselect').onclick=()=>{if(confirmLeave()){done=true;clearInterval(clock);setView('menu')}};$('again').onclick=startGame;$('backMenu').onclick=()=>setView('menu');$('scratch').onclick=()=>window.openGameScratchpad?.();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('game').classList.contains('hidden')){e.preventDefault();if(answered)next();else submit()}});window.addEventListener('beforeunload',e=>{if(!done&&!$('game').classList.contains('hidden')){e.preventDefault();e.returnValue=''}});
</script></body></html>
