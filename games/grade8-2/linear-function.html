r:white;border:0;padding:11px 17px;border-radius:11px;font-weight:700}.smallbtn{font-size:13px;padding:9px 11px}.status{display:grid;grid-template-columns:2fr repeat(4,1fr) auto auto;gap:8px;margin-bottom:13px;align-items:stretch}.stat{padding:10px 9px;text-align:center;border-radius:12px;background:#e9f7f2;color:var(--deep);min-height:62px}.stat small{display:block;color:#6e8490;font-size:12px;margin-bottom:5px}.stat strong{font-size:17px}.bar{height:10px;border-radius:10px;background:#e8eff3;overflow:hidden;margin:5px 0 15px}.bar>div{height:100%;background:linear-gradient(90deg,#168b80,#62cfc0);width:0;transition:width .2s}.question-card{border:2px solid #a1d7ce;border-radius:20px;min-height:265px;background:#fff;padding:25px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.topic{text-align:center;color:#687c87;font-size:15px}.math-question{text-align:center;font-size:clamp(23px,3vw,34px);line-height:1.8;font-weight:700;overflow-wrap:anywhere}.seq{letter-spacing:1px}.question-footer{display:flex;justify-content:flex-end;align-items:center}.scratch{border:1px solid #d19b2d;color:#7d4e00;background:#fff6d7;border-radius:12px;padding:10px 15px;font-weight:700}.answer-panel{margin-top:14px;background:#f5faf8;border:1px solid #dceae5;border-radius:17px;padding:21px;text-align:center}.answer-panel h3{font-size:16px;color:var(--deep);margin:0 0 13px}.inputrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.ans-input{width:min(100%,340px);padding:15px;font-size:24px;text-align:center;border:2px solid #8bc8bd;border-radius:12px;background:white}.ans-input:focus{outline:3px solid #9fe5d9}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:630px;margin:5px auto}.choice{padding:14px 10px;border-radius:12px;border:2px solid #b6d6d0;background:#fff;font-weight:700;min-height:57px}.choice.selected{background:#d3f3eb;border-color:#0d8f80}.actionrow{display:flex;justify-content:center;margin:19px 0 6px;gap:10px;flex-wrap:wrap}.hint{min-height:24px;font-size:13px;color:#6c7f87}.feedback{margin-top:17px;text-align:left;border-radius:14px;padding:17px 20px;line-height:1.85;border:1px solid #aad8c7;background:#f0fbf6}.feedback.wrong{background:#fff5f5;border-color:#efb8c3}.feedback h3{margin:0 0 8px}.steps{margin:10px 0;padding-left:21px}.steps li{margin:5px 0}.resulttop{text-align:center}.scorebig{font-size:52px;font-weight:900;color:var(--main);margin:9px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.resultgrid .stat{padding:18px 6px}.review{margin:12px 0;border:1px solid #dde5e8;border-radius:14px;padding:15px;background:#fafdfc;line-height:1.75}.review.wrong{border-left:4px solid #cb6070}.review.correct{border-left:4px solid #4da996}.review b{display:block}.review .math-question{font-size:20px;text-align:left}.save{margin:10px;color:var(--muted);font-size:14px}.grade{display:inline-block;border-radius:100px;background:#e0f4ec;color:#0d7068;padding:4px 10px;font-size:12px}.warn{color:#b14848}@media(max-width:800px){.status{grid-template-columns:repeat(4,minmax(0,1fr))}.status .stat:first-child{grid-column:span 2}.status button{grid-column:span 2}.resultgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.shell{padding:10px 10px 44px}.panel{padding:14px;border-radius:16px}.modes{grid-template-columns:1fr}.status{gap:5px}.stat{padding:9px 3px}.stat strong{font-size:14px}.question-card{padding:17px 11px}.option-grid{grid-template-columns:1fr 1fr}.math-question{font-size:24px}}

</main><script src="../../js/scratchpad.js"></script><script src="../../js/scratchpad-template.js"></script><script src="../../js/math-expression-input.js?v=2.3.0"></script>
<script type="module">
import {saveGameScore} from '../../js/scores.js';
const GAME_ID='linear-function';
const MODES=[
{id:'functionRelation',name:'函數關係的判別',desc:'對應關係、表格、生活情境與函數定義'},
{id:'functionValue',name:'求函數值',desc:'代入自變數、反求 x 與代入運算'},
{id:'functionEqual',name:'函數值相等與未知係數',desc:'兩個函數值相等、反求未知數與係數'},
{id:'functionType',name:'一次函數與常數函數',desc:'區分函數類型、反求係數與建立關係式'},
{id:'functionGraph',name:'函數圖形與坐標判讀',desc:'讀取直線、斜率方向、截距及坐標'},
{id:'functionTwoPoints',name:'已知兩點求線型函數',desc:'由兩點求斜率、截距與完整函數'},
{id:'functionApplication',name:'函數生活應用與分段圖形',desc:'價格、距離、儲蓄、分段收費'},
{id:'comprehensive',name:'第2章綜合挑戰',desc:'混合前七種教材概念'}
];
const $=id=>document.getElementById(id);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(n).replaceAll('-', '−');
const signed=n=>n<0?`− ${Math.abs(n)}`:`＋ ${n}`;
const fn=(a,b)=>a===0?`y＝${fmt(b)}`:`y＝${a===1?'':a===-1?'−':fmt(a)}x${b===0?'':` ${signed(b)}`}`;
const riNonzero=(a,b)=>{let v=0;while(!v)v=ri(a,b);return v};
const formatClock=sec=>String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
const question=(topic,html,answer,steps,kind='number',choices=null)=>({topic,html,answer:String(answer),steps,kind,choices});
const ask=(topic,html,answer,steps)=>question(topic,html,answer,steps);
function choose(topic,html,correct,distractors,steps){
  const a=[String(correct),...distractors.map(String)].filter((v,i,s)=>s.indexOf(v)===i);
  while(a.length<4)a.push('都不符合（'+a.length+'）');
  return question(topic,html,correct,steps,'choice',a.sort(()=>Math.random()-.5));
}
function relation(xs,ys){return `<table class="rel-table"><tr><th>x</th>${xs.map(x=>`<td>${esc(x)}</td>`).join('')}</tr><tr><th>y</th>${ys.map(y=>`<td>${esc(y)}</td>`).join('')}</tr></table>`}
function graph(a,b,{points=[],markIntercept=false,yMin=-8,yMax=8,xMin=-6,xMax=6}={}){
  // 圖形與數值使用同一組參數；以坐標裁切，避免直線延伸到格線外
  const W=420,H=290,pad=32,x0=pad,y0=pad,gw=W-2*pad,gh=H-2*pad;
  const X=x=>x0+(x-xMin)/(xMax-xMin)*gw;
  const Y=y=>y0+(yMax-y)/(yMax-yMin)*gh;
  let grid='';
  for(let x=xMin;x<=xMax;x++)grid+=`<line x1="${X(x)}" y1="${y0}" x2="${X(x)}" y2="${y0+gh}" stroke="#dce8e9" stroke-width=".8"/>`;
  for(let y=yMin;y<=yMax;y++)grid+=`<line x1="${x0}" y1="${Y(y)}" x2="${x0+gw}" y2="${Y(y)}" stroke="#dce8e9" stroke-width=".8"/>`;
  let axis=`<line x1="${X(0)}" y1="${y0}" x2="${X(0)}" y2="${y0+gh}" stroke="#556775" stroke-width="1.8"/><line x1="${x0}" y1="${Y(0)}" x2="${x0+gw}" y2="${Y(0)}" stroke="#556775" stroke-width="1.8"/>`;
  for(let x=xMin;x<=xMax;x+=2)if(x!==0)axis+=`<text x="${X(x)}" y="${Y(0)+15}" text-anchor="middle" font-size="9" fill="#667988">${x}</text>`;
  for(let y=yMin;y<=yMax;y+=2)if(y!==0)axis+=`<text x="${X(0)-7}" y="${Y(y)+3}" text-anchor="end" font-size="9" fill="#667988">${y}</text>`;
  axis+=`<text x="${x0+gw+4}" y="${Y(0)+3}" font-size="13" fill="#234e5a">x</text><text x="${X(0)+7}" y="${y0-10}" font-size="13" fill="#234e5a">y</text>`;
  const endpoints=[];if(a===0){endpoints.push([xMin,b],[xMax,b])}else{
    [[xMin,a*xMin+b],[xMax,a*xMax+b],[(yMin-b)/a,yMin],[(yMax-b)/a,yMax]].forEach(p=>{if(p[0]>=xMin-1e-8&&p[0]<=xMax+1e-8&&p[1]>=yMin-1e-8&&p[1]<=yMax+1e-8)endpoints.push(p)})
  }
  const line=endpoints.length>=2?`<line x1="${X(endpoints[0][0])}" y1="${Y(endpoints[0][1])}" x2="${X(endpoints[1][0])}" y2="${Y(endpoints[1][1])}" stroke="#0d9488" stroke-width="2.8" stroke-linecap="round"/>`:'';
  let marks='';if(markIntercept&&b>=yMin&&b<=yMax)marks+=`<circle cx="${X(0)}" cy="${Y(b)}" r="4" fill="#e88b27"/>`;
  for(const p of points)if(p[0]>=xMin&&p[0]<=xMax&&p[1]>=yMin&&p[1]<=yMax)marks+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="#2563eb"/><text x="${X(p[0])+7}" y="${Y(p[1])-7}" font-size="11" font-weight="600" fill="#1d4ed8">${esc('('+p.join(',')+')')}</text>`;
  return `<div class="graph-frame"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直角坐標平面上的線型函數圖形"><rect x="${x0}" y="${y0}" width="${gw}" height="${gh}" fill="#fff"/>${grid}${axis}${line}${marks}</svg></div>`;
}
function graphSafe(a,b,extra={}){return graph(a,b,{...extra,yMin:-10,yMax:10,xMin:-6,xMax:6})}
const G={
functionRelation:[
()=>{const a=riNonzero(-5,5),b=ri(-9,9),xs=[-2,0,2,4],ys=xs.map(x=>a*x+b);return choose('表格與函數',`給定下面 x、y 的對應表。${relation(xs,ys)}<div class="qnotes">y 是否為 x 的函數？</div>`,'是',['否','無法判斷','只有 x 為正數時是'],['每個 x 都恰好對應一個 y，因此 y 是 x 的函數。','不同 x 可以對應相同 y，仍符合函數定義。'])},
()=>{const a=ri(1,9),b=ri(1,9),xs=['A','B','C','D'],ys=[a,a,b,a];return choose('一對多的判別',`某商店以售價 x 為輸入、商品名稱 y 為輸出。${relation([a,a,b,a],xs)}<div class="qnotes">y 是 x 的函數嗎？</div>`,'否',['是','當售價大於零時是','需用計算機才知道'],[`當 x＝${a}，同時對應多個不同商品。`,'一個 x 對應超過一個 y，不符合函數的定義。'])},
()=>{const a=ri(2,7),b=ri(1,15);return choose('情境函數關係',`一輛車每小時行駛 ${a*10} 公里，起點距離為 ${b} 公里。令 x 為行駛時間、y 為距離。${'<div class="qnotes">y 是否為 x 的函數？</div>'}`,'是',['否','距離不能表示為函數','必須 x＝0 才成立'],[`y＝${a*10}x＋${b}。`,'每個 x 均有唯一的 y，因此是函數。'])},
()=>{const xs=[1,2,2,3],ys=[3,4,6,7];return choose('同一輸入的多個輸出',`觀察下列表格：${relation(xs,ys)}<div class="qnotes">y 是否為 x 的函數？</div>`,'否',['是','只要數字遞增就是','數值大於零就是'],['x＝2 同時對應 y＝4 與 y＝6。','一個 x 不能同時對應兩個不同的 y。'])}
],
functionValue:[
()=>{let a=riNonzero(-6,6),b=ri(-12,12),x=ri(-7,7),y=a*x+b;return ask('代入求函數值',`已知 ${fn(a,b)}。求 x＝${fmt(x)} 時的函數值 y。`,y,[`把 x＝${x} 代入 ${fn(a,b)}。`,`y＝(${a})×(${x})＋(${b})＝${y}。`])},
()=>{let a=riNonzero(-6,6),b=ri(-10,10),x=ri(-6,6),y=a*x+b;return ask('已知函數值反求自變數',`已知 ${fn(a,b)}。若 y＝${fmt(y)}，求 x。`,x,[`代入得到 ${y}＝${a}x＋(${b})。`,`移項得 ${a}x＝${y-b}。`,`兩邊除以 ${a}，得到 x＝${x}。`])},
()=>{let a=riNonzero(-5,5),b=ri(-9,9),x=ri(-8,8);return ask('常數函數的函數值',`已知常數函數 y＝${fmt(b)}。求 x＝${fmt(x)} 時的函數值。`,b,[`常數函數不受 x 的值影響。`,`所以不論 x＝${x}，y 都等於 ${b}。`])}
],
functionEqual:[
()=>{let a=riNonzero(-4,4),c=riNonzero(-4,4);while(a===c)c=riNonzero(-4,4);let x=ri(-5,5),b=ri(-8,8),d=(a-c)*x+b;return ask('兩個函數值相等',`兩個函數為 ${fn(a,b)} 與 ${fn(c,d)}。若在 x＝m 時函數值相等，求 m。`,x,[`令兩函數相等：${a}m＋(${b})＝${c}m＋(${d})。`,`移項得 (${a-c})m＝${d-b}。`,`因此 m＝${x}。`])},
()=>{let x=riNonzero(-6,6),a=riNonzero(-5,5),b=ri(-9,9),y=a*x+b;return ask('已知函數值求係數',`已知 y＝ax ${signed(b)}，當 x＝${fmt(x)} 時，y＝${fmt(y)}。求 a。`,a,[`將 x＝${x}、y＝${y} 代入。`,`得到 ${y}＝a×(${x})＋(${b})。`,`因此 a＝(${y}－(${b}))÷(${x})＝${a}。`])},
()=>{let a=riNonzero(-5,5),x=riNonzero(-6,6),b=ri(-10,10),y=a*x+b;return ask('已知一點求常數項',`函數 y＝${fmt(a)}x＋b 通過點（${fmt(x)}，${fmt(y)}），求 b。`,b,[`點 (${x},${y}) 在圖形上，代入 x、y。`,`b＝${y}－(${a})×(${x})＝${b}。`])}
],
functionType:[
()=>{let a=riNonzero(-7,7),b=ri(-10,10);return choose('一次函數判別',`已知 ${fn(a,b)}。下列敘述何者正確？`,'它是一次函數',['它是常數函數','它不是線型函數','它的圖形是垂直線'],[`一次函數 y＝ax＋b 要求 a≠0；此題 a＝${a}。`,'因此是一次函數，圖形為非鉛垂直線。'])},
()=>{let b=ri(-10,10);return choose('常數函數判別',`已知 y＝${fmt(b)}。下列何者正確？`,'它是常數函數',['它是一次函數','它不是函數','它的圖形是鉛垂線'],['此式可以寫成 y＝0x＋b，x 的係數為 0。','所以它是常數函數，圖形平行 x 軸。'])},
()=>{let a=riNonzero(-6,6),x=riNonzero(-5,5),y=a*x;return ask('正比型一次函數求係數',`一次函數 y＝ax 通過點（${fmt(x)}，${fmt(y)}）。求 a。`,a,[`因為 ${y}＝a×(${x})。`,`所以 a＝${y}÷(${x})＝${a}。`])},
()=>{let b=ri(-10,10),x=ri(-8,8);return choose('平行 x 軸的函數',`有一線型函數通過點（${fmt(x)}，${fmt(b)}），且圖形平行 x 軸。其函數式為何？`,fn(0,b),[fn(1,b),fn(-1,b),fn(2,b)],['平行 x 軸的直線 y 值固定，故 a＝0。',`通過 (${x},${b})，因此函數是 y＝${b}。`])}
],
functionGraph:[

const used=new Set();let generationCounter=0;
function generate(id){const list=id==='comprehensive'?Object.values(G).flat():G[id];let q;for(let t=0;t<200;t++){const f=list[(generationCounter+t)%list.length];q=f();let key=q.topic+'|'+q.html.replace(/<[^>]*>/g,'').replace(/\s+/g,'');if(!used.has(key)){used.add(key);generationCounter+=t+1;return q}}generationCounter++;return q}
let mode='functionRelation',selected=mode,count=10,questions=[],index=0,records=[],startAt=0,clock=null,done=true,answered=false,current=null,widget=null,selectedChoice=null;
function makeQuestions(){used.clear();generationCounter=ri(0,5);questions=Array.from({length:10},()=>generate(mode))}
function chooseMode(i){selected=MODES[i].id;document.querySelectorAll('.mode').forEach((el,j)=>el.classList.toggle('active',i===j))}
function setView(id){['menu','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'instant'});if(id!=='game')window.hideGameScratchpadButton?.()}
function confirmLeave(){return done||confirm('測驗尚未完成，確定要離開？尚未完成的成績不會儲存。')}
function resetScratch(){try{window.resetGameScratchpad?.()}catch(e){console.warn(e)}}
function initWidget(){widget=null;const mount=$('mathMount'),fallback=$('nativeMount');mount.innerHTML='';fallback.classList.remove('hidden');if(!window.MathExpressionInput)return;try{widget=new window.MathExpressionInput({mountId:'mathMount',placeholder:'輸入數值或分數',allowRadical:false,allowFraction:true,allowPower:false,allowVariable:false,allowPlusMinus:false,validationMode:'numeric-radical',requireSimplifiedFraction:true,requireSimplifiedRadical:false,showPreview:true,autoFocus:false});fallback.classList.add('hidden')}catch(e){console.warn('切換一般輸入欄',e);widget=null;mount.innerHTML=''}}
function readValue(){if(current.kind==='choice')return selectedChoice===null?{error:'請先選擇答案'}:{value:selectedChoice};if(widget){const v=widget.validate?.();if(v&&!v.valid)return {error:v.message||'請輸入有效數值'};const s=String(widget.getRawValue?.()??v?.raw??'').trim();return s?{value:s}:{error:'請輸入答案'}}const s=$('numericAnswer').value.trim();return s?{value:s}:{error:'請輸入答案'}}
function parseNum(value){let s=String(value).trim().replace(/−/g,'-').replace(/[（）]/g,c=>c==='（'?'(':')').replace(/\s/g,'').replace(/^\((.*)\)$/,'$1');if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);if(/^[-+]?\d+\/\d+$/.test(s)){let [n,d]=s.split('/').map(Number);return d?n/d:NaN}return NaN}
function render(){answered=false;selectedChoice=null;current=questions[index];$('sMode').textContent=MODES.find(m=>m.id===mode).name;$('sCount').textContent=`${index+1} / 10`;$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=records.at(-1)?.combo||0;$('progress').style.width=`${index*10}%`;$('qTopic').textContent=current.topic;$('qText').innerHTML=current.html;$('feedback').classList.add('hidden');$('feedback').innerHTML='';$('submit').classList.remove('hidden');$('next').classList.add('hidden');$('inputHint').textContent=current.kind==='choice'?'請選擇一個正確答案。':'請輸入答案後送出。';$('answerUI').innerHTML='';if(current.kind==='choice'){$('answerUI').innerHTML='<div class="option-grid">'+current.choices.map(c=>`<button class="choice" type="button" data-choice="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';$('answerUI').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selectedChoice=b.dataset.choice;$('answerUI').querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',b===x))})}else{$('answerUI').innerHTML='<div id="mathMount"></div><div id="nativeMount"><input class="ans-input" id="numericAnswer" type="text" inputmode="decimal" placeholder="輸入整數或分數，例如 -3"></div>';initWidget();if(!widget)$('numericAnswer').focus()}resetScratch();window.hideGameScratchpadButton?.()}
function submit(){if(answered)return;const v=readValue();if(v.error){$('inputHint').textContent=v.error;return}const actual=v.value;const correct=current.kind==='choice'?actual===current.answer:Number.isFinite(parseNum(actual))&&Math.abs(parseNum(actual)-parseNum(current.answer))<1e-9;if(current.kind!=='choice'&&!Number.isFinite(parseNum(actual))){$('inputHint').textContent='答案格式不正確，請輸入整數或分數。';return}answered=true;const combo=correct?(records.at(-1)?.combo||0)+1:0;records.push({q:current,actual:String(actual),correct,combo});$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=combo;const f=$('feedback');f.className='feedback'+(correct?'':' wrong');f.innerHTML=`<h3>${correct?'✅ 答對了！':'❌ 參考完整詳解'}</h3><div>你的答案：<b>${esc(actual)}</b>　正確答案：<b>${esc(current.answer)}</b></div><ol class="steps">${current.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===9?'查看測驗結果 →':'下一題 →';if(widget)widget.setDisabled?.(true);else if($('numericAnswer'))$('numericAnswer').disabled=true}
function next(){if(!answered)return;if(index===9){finish();return}index++;render()}
function startGame(){mode=selected;records=[];index=0;done=false;makeQuestions();startAt=Date.now();clearInterval(clock);clock=setInterval(()=>{$('sTime').textContent=formatClock(Math.floor((Date.now()-startAt)/1000))},500);$('sTime').textContent='00:00';setView('game');render()}
async function finish(){done=true;clearInterval(clock);const seconds=Math.round((Date.now()-startAt)/1000),right=records.filter(r=>r.correct).length,wrong=10-right,score=right*10,maxCombo=Math.max(0,...records.map(r=>r.combo));$('resultScore').textContent=score+' 分';$('resultSummary').textContent=`${MODES.find(m=>m.id===mode).name}｜10 題測驗`;$('resultStats').innerHTML=`<div class="stat"><small>答對</small><strong>${right}</strong></div><div class="stat"><small>答錯</small><strong>${wrong}</strong></div><div class="stat"><small>最高連擊</small><strong>${maxCombo}</strong></div><div class="stat"><small>時間</small><strong>${formatClock(seconds)}</strong></div>`;const wrongs=records.map((r,i)=>({...r,num:i+1})).filter(r=>!r.correct);$('reviewList').innerHTML=wrongs.length?wrongs.map(r=>`<div class="review wrong"><b>第 ${r.num} 題｜${esc(r.q.topic)}</b><div class="math-question">${r.q.html}</div><div class="warn">你的答案：${esc(r.actual)}</div><div>正確答案：<b>${esc(r.q.answer)}</b></div><ol class="steps">${r.q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join(''):'<div class="review correct">🎉 全部答對！本次沒有錯題。</div>';$('saveStatus').textContent='☁️ 正在儲存成績……';setView('result');try{const s=await saveGameScore({game:GAME_ID,mode,score,correctCount:right,wrongCount:wrong,maxCombo,playTime:seconds});$('saveStatus').textContent=s?.success?'✅ 成績已儲存。':'⚠️ 成績儲存未成功，請檢查登入與遊戲註冊。'}catch(e){console.error(e);$('saveStatus').textContent='⚠️ 儲存失敗，請確認網路或登入狀況。'}}
MODES.forEach((m,i)=>$('modeGrid').insertAdjacentHTML('beforeend',`<button class="mode" data-index="${i}" type="button"><b>${i+1}. ${m.name}</b><small>${m.desc}</small></button>`));$('modeGrid').onclick=e=>{const b=e.target.closest('[data-index]');if(b)chooseMode(Number(b.dataset.index))};chooseMode(0);$('start').onclick=startGame;$('submit').onclick=submit;$('next').onclick=next;$('restart').onclick=()=>{if(confirmLeave())startGame()};$('reselect').onclick=()=>{if(confirmLeave()){done=true;clearInterval(clock);setView('menu')}};$('again').onclick=startGame;$('backMenu').onclick=()=>setView('menu');$('scratch').onclick=()=>window.openGameScratchpad?.();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('game').classList.contains('hidden')){e.preventDefault();if(answered)next();else submit()}});window.addEventListener('beforeunload',e=>{if(!done&&!$('game').classList.contains('hidden')){e.preventDefault();e.returnValue=''}});
</script></body></html>
