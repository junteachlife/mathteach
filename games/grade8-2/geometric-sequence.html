:center;margin:19px 0 6px;gap:10px;flex-wrap:wrap}.hint{min-height:24px;font-size:13px;color:#6c7f87}.feedback{margin-top:17px;text-align:left;border-radius:14px;padding:17px 20px;line-height:1.85;border:1px solid #aad8c7;background:#f0fbf6}.feedback.wrong{background:#fff5f5;border-color:#efb8c3}.feedback h3{margin:0 0 8px}.steps{margin:10px 0;padding-left:21px}.steps li{margin:5px 0}.resulttop{text-align:center}.scorebig{font-size:52px;font-weight:900;color:var(--main);margin:9px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.resultgrid .stat{padding:18px 6px}.review{margin:12px 0;border:1px solid #dde5e8;border-radius:14px;padding:15px;background:#fafdfc;line-height:1.75}.review.wrong{border-left:4px solid #cb6070}.review.correct{border-left:4px solid #4da996}.review b{display:block}.review .math-question{font-size:20px;text-align:left}.save{margin:10px;color:var(--muted);font-size:14px}.grade{display:inline-block;border-radius:100px;background:#e0f4ec;color:#0d7068;padding:4px 10px;font-size:12px}.warn{color:#b14848}@media(max-width:800px){.status{grid-template-columns:repeat(4,minmax(0,1fr))}.status .stat:first-child{grid-column:span 2}.status button{grid-column:span 2}.resultgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.shell{padding:10px 10px 44px}.panel{padding:14px;border-radius:16px}.modes{grid-template-columns:1fr}.status{gap:5px}.stat{padding:9px 3px}.stat strong{font-size:14px}.question-card{padding:17px 11px}.option-grid{grid-template-columns:1fr 1fr}.math-question{font-size:24px}}

<script type="module">
import {saveGameScore} from '../../js/scores.js';
const GAME_ID='geometric-sequence';
const MODES=[
{id:'geometricJudge',name:'等比數列的判別與公比',desc:'判別等比關係、求正負與分數公比'},
{id:'geometricNth',name:'求第 n 項與項數',desc:'依 aₙ＝a₁×rⁿ⁻¹ 求指定項及項數'},
{id:'geometricComplete',name:'缺項與條件反推',desc:'補數列、已知兩項求首項或公比'},
{id:'geometricMean',name:'等比中項',desc:'a、b、c 成等比時 b²＝ac，含正負解'},
{id:'geometricApplication',name:'等比數列的應用',desc:'階梯排列、反覆裁切、倍增與分層圖形'},
{id:'comprehensive',name:'綜合挑戰',desc:'隨機混合前五個主題，固定十題'}
];
const $=id=>document.getElementById(id);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const show=n=>String(n).replace(/-/g,'−');
const fmt=n=>n<0?`(${show(n)})`:String(n);
const term=(a,d,n)=>a+(n-1)*d;
const sum=(a,d,n)=>n*(2*a+(n-1)*d)/2;
const explain=(...x)=>x;
function question(topic,html,answer,steps,kind='number',choices=null,subtype=''){return{topic,html,answer:String(answer),steps,kind,choices,subtype}}
let mode='geometricJudge',difficulty=2,count=10,questions=[],index=0,records=[],startAt=0,clock=null,done=false,selected=null,widget=null,current=null,answered=false;
const randA=()=>ri(-8*difficulty,18*difficulty);
const randD=()=>{let d=ri(-3*difficulty,5*difficulty);return d===0?ri(1,4):d};
const randN=()=>ri(5,8+difficulty*5);
const math=(x)=>`<div style="font-size:21px;margin-top:9px">${x}</div>`;
const sequence=(a,d,n=4)=>Array.from({length:n},(_,i)=>show(term(a,d,i+1))).join('，');
const level='';
// 等比數列：以有理數精確運算，避免浮點誤差或未約分的題目。
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function R(n,d=1){if(!d)throw Error('zero denominator');if(d<0){n=-n;d=-d}let g=gcd(n,d);return[n/g,d/g]}
function mul(a,b){return R(a[0]*b[0],a[1]*b[1])}
function div(a,b){return R(a[0]*b[1],a[1]*b[0])}
function pow(a,k){let p=R(1);for(let i=0;i<k;i++)p=mul(p,a);return p}
function fmtR(a){return a[1]===1?String(a[0]):`${a[0]}/${a[1]}`}
function seqR(a,r,n){return Array.from({length:n},(_,i)=>fmtR(mul(a,pow(r,i))))}
const baseRatios=[R(2),R(3),R(-2),R(-3),R(1,2),R(-1,2),R(1,3),R(-1,3),R(3,2),R(-3,2),R(2,3),R(-2,3)];
const ratioPick=()=>pick(baseRatios);
function specialA(r,n){ // 選擇首項讓所需各項可整除，題目避免極大分母
  const maxPow=Math.max(0,n-1);
  if(r[1]===1)return R(ri(1,8)*pick([-1,1]));
  let q=ri(1,5)*Math.pow(r[1],maxPow);
  return R(q*pick([-1,1]));
}
function printSeq(arr){return arr.join('，')}
function choiceQuestion(topic,html,correct,choices,steps,subtype){
  const distinct=[...new Set([correct,...choices.map(String)])];
  return question(topic,html,correct,steps,'choice',distinct,subtype);
}
const G={
geometricJudge:[
()=>{const r=ratioPick(),a=specialA(r,4),items=seqR(a,r,4);return question('計算公比',`已知等比數列：${printSeq(items)}，……${math('求公比 r。')}`,fmtR(r),explain(`等比數列相鄰兩項的比值必須相等。`,`r＝第2項÷第1項＝(${items[1]})÷(${items[0]})＝${fmtR(r)}。`,`再檢查第3項÷第2項及第4項÷第3項，也都得到 ${fmtR(r)}。`),'number',null,'ratio')},
()=>{const r=ratioPick(),a=specialA(r,4),arr=seqR(a,r,4),bad=Math.random()<0.5; if(bad){let x=R(...(arr[2].split('/').map(Number)));arr[2]=fmtR(R(x[0]+(x[0]>0?1:-1),x[1]));}let valid=!bad;return choiceQuestion('是否為等比數列',`觀察數列：${printSeq(arr)}。${math('它是不是等比數列？')}`,valid?'是':'否',['是','否'],valid?explain('計算各相鄰兩項的「後項÷前項」。',`每一組比值皆為 ${fmtR(r)}，所以是等比數列。`):explain('等比數列要求每兩個相鄰項的比值都相同。','此數列有相鄰比值不同，因此不是等比數列。'),'judge')},
()=>{const r=pick([R(-2),R(-3),R(-1,2),R(-1,3)]),a=specialA(r,5),arr=seqR(a,r,5);return choiceQuestion('正負交替規律',`數列：${printSeq(arr)}。${math('此數列的公比符號為何？')}`,'負數',['正數','負數','零'],explain('當相鄰項正負交替時，後項÷前項為負數。',`本題公比 r＝${fmtR(r)}，因此為負數。`),'sign')},
()=>{const a=ri(2,9),d=ri(2,8),arr=[a,a+d,a+2*d,a+3*d];return choiceQuestion('分辨等差與等比',`觀察數列：${printSeq(arr)}。${math('下列哪一種敘述正確？')}`,'它是等差數列，但不是等比數列',['它是等比數列','它是等差數列，但不是等比數列','兩者都是','兩者都不是'],explain(`各相鄰兩項的差均為 ${d}。`,'但相鄰兩項的比值不固定，所以不是等比數列。'),'distinguish')}
],
geometricNth:[
()=>{const r=ratioPick(),n=ri(4,7),a=specialA(r,n),ans=mul(a,pow(r,n-1));return question('已知首項與公比求第 n 項',`一個等比數列首項 a₁＝${fmtR(a)}，公比 r＝${fmtR(r)}。${math(`求第 ${n} 項 a<sub>${n}</sub>。`)}`,fmtR(ans),explain('等比數列公式：aₙ＝a₁×rⁿ⁻¹。',`a${n}＝(${fmtR(a)})×(${fmtR(r)})^${n-1}。`,`計算後得到 ${fmtR(ans)}。`),'number',null,'nth')},
()=>{const r=pick([R(2),R(3),R(-2),R(-3),R(1,2),R(1,3)]),n=ri(4,7),a=specialA(r,n),ans=mul(a,pow(r,n-1));return question('觀察數列求指定項',`已知等比數列：${printSeq(seqR(a,r,3))}，……。${math(`求第 ${n} 項。`)}`,fmtR(ans),explain(`公比＝第2項÷第1項＝${fmtR(r)}。`,'等比數列公式：aₙ＝a₁×rⁿ⁻¹。',`a${n}＝(${fmtR(a)})×(${fmtR(r)})^${n-1}＝${fmtR(ans)}。`),'number',null,'nthFromSeq')},
()=>{const r=pick([R(2),R(3),R(-2),R(-3),R(1,2),R(1,3)]),n=ri(4,7),a=specialA(r,n),last=mul(a,pow(r,n-1));return question('已知某項反求項數',`一個等比數列的首項為 ${fmtR(a)}，公比為 ${fmtR(r)}。${math(`若某一項為 ${fmtR(last)}，它是第幾項？`)}`,n,explain('設這個數是第 n 項，代入 aₙ＝a₁×rⁿ⁻¹。',`${fmtR(last)}＝(${fmtR(a)})×(${fmtR(r)})^(n−1)。`,`因公比絕對值不等於 1，依次比較等比乘積可求得 n＝${n}。`),'number',null,'findIndex')}
],
geometricComplete:[
()=>{const r=ratioPick(),a=specialA(r,5),arr=seqR(a,r,5),k=ri(1,3),answer=arr[k];arr[k]='□';return question('利用公比補缺項',`填入適當數值，使下列數列成為等比數列：${math(printSeq(arr))}`,answer,explain('相鄰兩項之比應固定。',`本題公比 r＝${fmtR(r)}。`,`每一項＝前一項×公比，因此空格＝${answer}。`),'number',null,'missing')},
()=>{const r=pick([R(2),R(-2),R(3),R(-3),R(1,2),R(-1,2)]),n=ri(3,5),a=specialA(r,n),ak=mul(a,pow(r,n-1));return question('已知第 n 項反求首項',`某等比數列的公比 r＝${fmtR(r)}，第 ${n} 項為 ${fmtR(ak)}。${math('求首項 a₁。')}`,fmtR(a),explain('由 aₙ＝a₁×rⁿ⁻¹，得 a₁＝aₙ÷rⁿ⁻¹。',`a₁＝(${fmtR(ak)})÷(${fmtR(r)})^${n-1}。`,`所以 a₁＝${fmtR(a)}。`),'number',null,'firstReverse')},
()=>{const r=ratioPick(),a=specialA(r,5),arr=seqR(a,r,5);return question('已知相鄰項求公比',`一個等比數列的第 3 項為 ${arr[2]}，第 4 項為 ${arr[3]}。${math('求公比 r。')}`,fmtR(r),explain('公比＝相鄰後項÷前項。',`r＝(${arr[3]})÷(${arr[2]})＝${fmtR(r)}。`),'number',null,'ratioReverse')},
()=>{const a=ri(2,10),r=pick([R(2),R(3),R(-2)]),n=ri(4,6),last=mul(R(a),pow(r,n-1));return question('依據兩項判定缺項',`等比數列的首項為 ${a}，公比為 ${fmtR(r)}。${math(`已知 a<sub>${n}</sub>＝${fmtR(last)}，求 a<sub>${n-1}</sub>。`)}`,fmtR(div(last,r)),explain(`因為 a${n}＝a${n-1}×r。`,`a${n-1}＝(${fmtR(last)})÷(${fmtR(r)})。`,`得到 ${fmtR(div(last,r))}。`),'number',null,'prev')}
],
geometricMean:[
()=>{const a=ri(1,9),r=pick([2,3,4]),c=a*r*r,b=a*r;return choiceQuestion('等比中項的兩個可能值',`已知 ${a}、x、${c} 三數成等比數列。${math('x 可能有哪些值？')}`,`±${b}`,[`±${b}`,`${b}`,`${-b}`,`${a+c}`],explain('若 a、x、c 成等比，則 x²＝ac。',`x²＝${a}×${c}＝${b*b}。`,`所以 x＝${b} 或 ${-b}，即 ±${b}。`),'meanBoth')},
()=>{const a=ri(1,8),r=ri(2,4),c=a*r*r,b=a*r;return question('正等比中項',`已知 ${a}、x、${c} 成等比數列，且 x 為正數。${math('求 x。')}`,b,explain('等比中項滿足 x²＝首項×末項。',`x²＝${a}×${c}＝${b*b}。`,`因為 x>0，因此 x＝${b}。`),'number',null,'meanPositive')},
()=>{const a=ri(1,8),r=ri(2,4),c=a*r*r,b=-a*r;return question('負等比中項',`已知 ${a}、x、${c} 成等比數列，且 x 為負數。${math('求 x。')}`,b,explain('等比中項滿足 x²＝首項×末項。',`x²＝${a}×${c}＝${b*b}。`,`因為 x<0，因此 x＝${b}。`),'number',null,'meanNegative')},
()=>{const a=ri(2,9),r=pick([-3,-2,2,3]),b=a*r,c=a*r*r;return question('等比中項性質反推末項',`已知 ${a}、${b}、x 三數成等比數列。${math('求 x。')}`,c,explain(`公比 r＝${b}÷${a}＝${r}。`,`末項 x＝${b}×(${r})＝${c}。`,`亦可用 ${b}²＝${a}×x 驗算。`),'number',null,'endFromMean')}
],

const used=new Set();let generationCounter=0;
function generate(modeId){const list=modeId==='comprehensive'?Object.values(G).flat():G[modeId];let q;for(let t=0;t<200;t++){const fun=list[(generationCounter+t)%list.length];q=fun();const key=q.topic+'|'+q.html.replace(/<[^>]*>/g,'').replace(/\s+/g,'');if(!used.has(key)){used.add(key);generationCounter+=t+1;return q}}generationCounter++;return q}
function makeQuestions(){used.clear();generationCounter=ri(0,5);questions=Array.from({length:count},()=>generate(mode));}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatClock(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function choose(i){selected=MODES[i].id;document.querySelectorAll('.mode').forEach((e,j)=>e.classList.toggle('active',i===j))}
function setView(id){['menu','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'instant'});if(id!=='game')window.hideGameScratchpadButton?.();}
function confirmLeave(){return done||confirm('目前測驗尚未完成，確定要離開嗎？本次未完成的成績不會儲存。')}
function resetScratch(){try{window.resetGameScratchpad?.()}catch(e){console.warn(e)}}
function initWidget(){widget=null;const mount=$('mathMount'),fallback=$('nativeMount');mount.innerHTML='';fallback.classList.remove('hidden');if(current?.subtype==='weight'||!window.MathExpressionInput)return;try{widget=new window.MathExpressionInput({mountId:'mathMount',placeholder:'輸入整數或分數',allowRadical:false,allowFraction:true,allowPower:false,allowVariable:false,allowPlusMinus:false,validationMode:'numeric-radical',requireSimplifiedFraction:true,requireSimplifiedRadical:false,showPreview:true,autoFocus:false,onChange:()=>{$('inputHint').textContent='請確認答案後按送出。'}});fallback.classList.add('hidden')}catch(e){console.warn('使用一般答案輸入框',e);widget=null;mount.innerHTML=''}}
function readValue(){if(current.kind==='choice')return selectedChoice===null?{error:'請先選擇答案'}:selectedChoice;if(widget){const info=widget.validate?.();if(info&&!info.valid)return {error:info.message||'請輸入有效答案'};let s=(widget.getRawValue?.()??info?.raw??'').trim();if(!s)return {error:'請先輸入答案'};return {value:s}}let s=$('numericAnswer').value.trim();return s?{value:s}:{error:'請先輸入答案'}}
function rat(s){s=String(s).trim().replace(/−/g,'-').replace(/＋/g,'+').replace(/[（）]/g,c=>c==='（'?'(':')').replace(/\s/g,'').replace(/^\((.*)\)$/,'$1');if(/^[-+]?(?:\d+)(?:\.\d+)?$/.test(s))return Number(s);if(/^[-+]?\d+\/\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return b? a/b:NaN}return NaN}
let selectedChoice=null;
function render(){answered=false;selectedChoice=null;current=questions[index];$('sMode').textContent=MODES.find(m=>m.id===mode).name;$('sCount').textContent=`${index+1} / ${count}`;$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=(records.at(-1)?.combo||0);$('progress').style.width=`${Math.round(index/count*100)}%`;$('qTopic').textContent=current.topic;$('qText').innerHTML=current.html;$('feedback').classList.add('hidden');$('feedback').innerHTML='';$('submit').classList.remove('hidden');$('next').classList.add('hidden');$('inputHint').textContent=current.kind==='choice'?'選擇最符合題意的一項。':'請輸入整數或最簡分數；負數請加負號。';$('answerUI').innerHTML='';if(current.kind==='choice'){$('answerUI').innerHTML='<div class="option-grid">'+current.choices.map(c=>`<button type="button" class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';$('answerUI').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selectedChoice=b.dataset.choice;$('answerUI').querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));});}else{$('answerUI').innerHTML='<div id="mathMount"></div><div id="nativeMount"><input class="ans-input" id="numericAnswer" type="text" inputmode="text" autocomplete="off" placeholder="輸入答案，例如 -3 或 1/2"></div>';initWidget();if(!widget){$('numericAnswer').value='';$('numericAnswer').disabled=false;$('numericAnswer').focus()}}resetScratch();window.hideGameScratchpadButton?.();}
function submit(){if(answered)return;const v=readValue();if(v?.error){$('inputHint').textContent=v.error;return}const actual=current.kind==='choice'?v:v.value;const correct=current.kind==='choice'?actual===current.answer:Number.isFinite(rat(actual))&&Math.abs(rat(actual)-rat(current.answer))<1e-10;if(!correct&&current.kind!=='choice'&&!Number.isFinite(rat(actual))){$('inputHint').textContent='答案格式不正確，請輸入整數或最簡分數；等比中項可能有正、負兩解。';return}answered=true;const combo=correct?(records.at(-1)?.combo||0)+1:0;records.push({q:current,actual:String(actual),correct,combo});$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=combo;const f=$('feedback');f.className='feedback'+(correct?'':' wrong');f.innerHTML=`<h3>${correct?'✅ 答對了！':'❌ 再釐清這個觀念'}</h3><div>你的答案：<b>${esc(actual)}</b>　正確答案：<b>${esc(current.answer.trim())}</b></div><ol class="steps">${current.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===count-1?'查看測驗結果 →':'下一題 →';if(widget)widget.setDisabled?.(true);else if($('numericAnswer'))$('numericAnswer').disabled=true;}
function next(){if(!answered)return;if(index===count-1){finish();return}index++;render()}
function startGame(){mode=selected||MODES[0].id;count=10;records=[];index=0;done=false;makeQuestions();startAt=Date.now();clearInterval(clock);clock=setInterval(()=>{$('sTime').textContent=formatClock(Math.floor((Date.now()-startAt)/1000))},500);$('sTime').textContent='00:00';setView('game');render()}
async function finish(){done=true;clearInterval(clock);const seconds=Math.round((Date.now()-startAt)/1000),right=records.filter(r=>r.correct).length,wrong=count-right,score=Math.round(100*right/count),maxCombo=Math.max(0,...records.map(r=>r.combo));$('resultScore').textContent=score+' 分';$('resultSummary').textContent=`${MODES.find(m=>m.id===mode).name}｜${count} 題測驗`;$('resultStats').innerHTML=`<div class="stat"><small>答對</small><strong>${right}</strong></div><div class="stat"><small>答錯</small><strong>${wrong}</strong></div><div class="stat"><small>最高連擊</small><strong>${maxCombo}</strong></div><div class="stat"><small>時間</small><strong>${formatClock(seconds)}</strong></div>`;const wrongs=records.map((r,i)=>({...r,num:i+1})).filter(r=>!r.correct);$('reviewList').innerHTML=wrongs.length?wrongs.map(r=>`<div class="review wrong"><b>第 ${r.num} 題｜${esc(r.q.topic)}</b><div class="math-question">${r.q.html}</div><div class="warn">你的答案：${esc(r.actual)}</div><div>正確答案：<b>${esc(r.q.answer.trim())}</b></div><ol class="steps">${r.q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join(''):'<div class="review correct">🎉 全部答對！本次沒有錯題。</div>';$('saveStatus').textContent='☁️ 正在將成績儲存至共用成績系統……';setView('result');try{const res=await saveGameScore({game:GAME_ID,mode,score,correctCount:right,wrongCount:wrong,maxCombo,playTime:seconds});$('saveStatus').textContent=res?.success?'✅ 成績已儲存，可至我的成績與排行榜查看。':'⚠️ 本次結果已顯示，但雲端儲存未成功；請確認登入及遊戲註冊。'}catch(e){console.error(e);$('saveStatus').textContent='⚠️ 雲端儲存失敗，請檢查登入或網路連線。'}}
MODES.forEach((m,i)=>{$('modeGrid').insertAdjacentHTML('beforeend',`<button type="button" class="mode" data-index="${i}"><b>${i+1}. ${m.name}</b><small>${m.desc}</small></button>`)});$('modeGrid').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)choose(Number(b.dataset.index))});choose(0);$('start').onclick=startGame;$('submit').onclick=submit;$('next').onclick=next;$('restart').onclick=()=>{if(confirmLeave())startGame()};$('reselect').onclick=()=>{if(confirmLeave()){done=true;clearInterval(clock);setView('menu')}};$('again').onclick=startGame;$('backMenu').onclick=()=>setView('menu');$('scratch').onclick=()=>window.openGameScratchpad?.();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('game').classList.contains('hidden')){e.preventDefault();if(answered)next();else submit()}});window.addEventListener('beforeunload',e=>{if(!done&&!$('game').classList.contains('hidden')){e.preventDefault();e.returnValue=''}});
</script></body></html>
