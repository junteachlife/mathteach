<style>
:root{--main:#147d75;--deep:#0d5855;--pale:#e9f7f4;--ink:#193540;--muted:#667989;--line:#c8e2dd;--red:#ad3447}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e8f7f2,#fffdf4 56%,#e9f4ff);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1100px;margin:0 auto;padding:24px 14px 65px}.topnav{display:flex;justify-content:flex-end}.back{border:1px solid #81b9b0;background:white;color:var(--deep);padding:9px 13px;border-radius:12px;text-decoration:none;font-size:14px}.intro{text-align:center;margin:14px auto 22px}.intro h1{font-size:clamp(25px,3.4vw,39px);margin:7px 0 10px;color:var(--deep)}.intro p{color:var(--muted);font-size:14px;line-height:1.8}.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 29px #20444e12;padding:23px;margin-bottom:14px}.hidden{display:none!important}.panel h2{margin:4px 0 18px;color:var(--deep);font-size:21px}.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.mode{background:#f5fbf9;border:1px solid #b9dcd5;border-radius:15px;padding:18px;text-align:left;min-height:110px;color:var(--ink)}.mode:hover,.mode.active{border-color:#178a7c;background:#e9f9f4;box-shadow:0 0 0 2px #2aa99524}.mode b{display:block;font-size:16px;margin-bottom:8px}.mode small{display:block;line-height:1.6;color:#576d78}.settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px;padding:17px;background:var(--pale);border-radius:14px}.settings label{font-weight:700}.settings select{padding:9px 15px;border:1px solid #87c2b8;background:white;border-radius:10px}.primary{background:var(--main);color:white;border:0;border-radius:11px;padding:12px 26px;font-weight:800;box-shadow:0 3px 0 #0a514d}.primary:hover{background:var(--deep)}.secondary{background:#506778;color:white;border:0;padding:11px 17px;border-radius:11px;font-weight:700}.smallbtn{font-size:13px;padding:9px 11px}.status{display:grid;grid-template-columns:2fr repeat(4,1fr) auto auto;gap:8px;margin-bottom:13px;align-items:stretch}.stat{padding:10px 9px;text-align:center;border-radius:12px;background:#e9f7f2;color:var(--deep);min-height:62px}.stat small{display:block;color:#6e8490;font-size:12px;margin-bottom:5px}.stat strong{font-size:17px}.bar{height:10px;border-radius:10px;background:#e8eff3;overflow:hidden;margin:5px 0 15px}.bar>div{height:100%;background:linear-gradient(90deg,#168b80,#62cfc0);width:0;transition:width .2s}.question-card{border:2px solid #a1d7ce;border-radius:20px;min-height:265px;background:#fff;padding:25px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.topic{text-align:center;color:#687c87;font-size:15px}.math-question{text-align:center;font-size:clamp(23px,3vw,34px);line-height:1.8;font-weight:700;overflow-wrap:anywhere}.seq{letter-spacing:1px}.question-footer{display:flex;justify-content:flex-end;align-items:center}.scratch{border:1px solid #d19b2d;color:#7d4e00;background:#fff6d7;border-radius:12px;padding:10px 15px;font-weight:700}.answer-panel{margin-top:14px;background:#f5faf8;border:1px solid #dceae5;border-radius:17px;padding:21px;text-align:center}.answer-panel h3{font-size:16px;color:var(--deep);margin:0 0 13px}.inputrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.ans-input{width:min(100%,340px);padding:15px;font-size:24px;text-align:center;border:2px solid #8bc8bd;border-radius:12px;background:white}.ans-input:focus{outline:3px solid #9fe5d9}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:630px;margin:5px auto}.choice{padding:14px 10px;border-radius:12px;border:2px solid #b6d6d0;background:#fff;font-weight:700;min-height:57px}.choice.selected{background:#d3f3eb;border-color:#0d8f80}.actionrow{display:flex;justify-content:center;margin:19px 0 6px;gap:10px;flex-wrap:wrap}.hint{min-height:24px;font-size:13px;color:#6c7f87}.feedback{margin-top:17px;text-align:left;border-radius:14px;padding:17px 20px;line-height:1.85;border:1px solid #aad8c7;background:#f0fbf6}.feedback.wrong{background:#fff5f5;border-color:#efb8c3}.feedback h3{margin:0 0 8px}.steps{margin:10px 0;padding-left:21px}.steps li{margin:5px 0}.resulttop{text-align:center}.scorebig{font-size:52px;font-weight:900;color:var(--main);margin:9px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:17px 0}.resultgrid .stat{padding:18px 6px}.review{margin:12px 0;border:1px solid #dde5e8;border-radius:14px;padding:15px;background:#fafdfc;line-height:1.75}.review.wrong{border-left:4px solid #cb6070}.review.correct{border-left:4px solid #4da996}.review b{display:block}.review .math-question{font-size:20px;text-align:left}.save{margin:10px;color:var(--muted);font-size:14px}.grade{display:inline-block;border-radius:100px;background:#e0f4ec;color:#0d7068;padding:4px 10px;font-size:12px}.warn{color:#b14848}@media(max-width:800px){.status{grid-template-columns:repeat(4,minmax(0,1fr))}.status .stat:first-child{grid-column:span 2}.status button{grid-column:span 2}.resultgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.shell{padding:10px 10px 44px}.panel{padding:14px;border-radius:16px}.modes{grid-template-columns:1fr}.status{gap:5px}.stat{padding:9px 3px}.stat strong{font-size:14px}.question-card{padding:17px 11px}.option-grid{grid-template-columns:1fr 1fr}.math-question{font-size:24px}}
</style></head><body><main class="shell">
<div class="topnav"><a class="back" href="../../index.html?semester=grade8-second">↩ 返回八年級下學期</a></div>
<header class="intro"><h1>➕ 1-2 等差級數</h1><p>依照八下習作與《基礎 GO》規劃六種模式｜動態出題、詳解、錯題回顧、共用計算紙</p></header>
<section class="panel" id="menu"><h2>選擇練習模式</h2><div class="modes" id="modeGrid"></div><div class="settings"><label for="count">測驗題數</label><select id="count"><option value="10">10 題</option><option value="20">20 題</option></select><label for="difficulty">難度</label><select id="difficulty"><option value="1">基礎</option><option value="2">進階</option><option value="3">精熟</option></select><button class="primary" id="start">開始挑戰</button></div><p class="hint">此版先以 10／20 題為主，保留各模式固定 ID，方便日後擴充成績與排行榜。</p></section>
<section id="game" class="hidden"><div class="status"><div class="stat"><small>模式</small><strong id="sMode"></strong></div><div class="stat"><small>進度</small><strong id="sCount">1/10</strong></div><div class="stat"><small>答對</small><strong id="sRight">0</strong></div><div class="stat"><small>連擊</small><strong id="sCombo">0</strong></div><div class="stat"><small>時間</small><strong id="sTime">00:00</strong></div><button class="primary smallbtn" id="restart">重新測驗</button><button class="secondary smallbtn" id="reselect">重選模式</button></div><div class="bar"><div id="progress"></div></div><article class="question-card"><div class="topic" id="qTopic">請回答問題</div><div class="math-question" id="qText"></div><div class="question-footer"><button type="button" class="scratch" id="scratch">✏️ 開啟計算紙</button></div></article><section class="answer-panel"><h3 id="answerTitle">請作答</h3><div id="answerUI"></div><p class="hint" id="inputHint">請輸入整數、小數或最簡分數。</p></section><div class="actionrow"><button class="primary" id="submit">送出答案（Enter）</button><button class="primary hidden" id="next">下一題 →</button></div><article id="feedback" class="feedback hidden"></article></section>
<section class="panel hidden" id="result"><div class="resulttop"><h2>🏆 本次測驗結果</h2><div class="scorebig" id="resultScore">0 分</div><div id="resultSummary"></div></div><div class="resultgrid" id="resultStats"></div><p class="save" id="saveStatus"></p><h2>📚 錯題回顧與完整詳解</h2><div id="reviewList"></div><div class="actionrow"><button class="primary" id="again">再測驗一次</button><button class="secondary" id="backMenu">重選模式</button></div></section>
</main><script src="../../js/scratchpad.js"></script><script src="../../js/scratchpad-template.js"></script><script src="../../js/math-expression-input.js?v=2.3.0"></script>
<script type="module">
import {saveGameScore} from '../../js/scores.js';
const GAME_ID='arithmetic-series';
const MODES=[
{id:'seriesConcept',name:'級數觀念與高斯配對',desc:'首尾配對、連續數字求和、奇偶項求和'},
{id:'sumFirstLast',name:'首項、末項與項數求和',desc:'已知首項、末項與項數；必要時先求項數'},
{id:'sumFirstDiff',name:'首項、公差與項數求和',desc:'利用首項、公差及項數求前 n 項和'},
{id:'findUnknown',name:'反求項數與公差',desc:'已知和、首末項、項數或公差反推未知'},
{id:'seriesApplication',name:'等差級數應用',desc:'樓梯瓷磚、逐日累積、折扣與生活情境'},
{id:'comprehensive',name:'綜合挑戰',desc:'整合前五模式，交錯出題'}
];
const $=id=>document.getElementById(id);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const show=n=>String(n).replace(/-/g,'−');
const fmt=n=>n<0?`(${show(n)})`:String(n);
const term=(a,d,n)=>a+(n-1)*d;
const sum=(a,d,n)=>n*(2*a+(n-1)*d)/2;
const explain=(...x)=>x;
function question(topic,html,answer,steps,kind='number',choices=null,subtype=''){return{topic,html,answer:String(answer),steps,kind,choices,subtype}}
let mode='seriesConcept',difficulty=1,count=10,questions=[],index=0,records=[],startAt=0,clock=null,done=false,selected=null,widget=null,current=null,answered=false;
const randA=()=>ri(-8*difficulty,18*difficulty);
const randD=()=>{let d=ri(-3*difficulty,5*difficulty);return d===0?ri(1,4):d};
const randN=()=>ri(5,8+difficulty*5);
const math=(x)=>`<div style="font-size:21px;margin-top:9px">${x}</div>`;
const sequence=(a,d,n=4)=>Array.from({length:n},(_,i)=>show(term(a,d,i+1))).join('，');
const level='';
const G={
seriesConcept:[
()=>{const a=ri(1,8),d=ri(1,6),n=ri(7,10+difficulty*5),last=term(a,d,n),ans=sum(a,d,n);return question('高斯首尾配對',`${sequence(a,d)}，……，${last}${math(`把此數列前 ${n} 項全部加起來，總和是多少？`)}`,ans,explain(`首項為 ${a}，末項為 ${last}，一共有 ${n} 項。`,`首尾兩項配對：${a}＋${last}＝${a+last}。`,`S${n}＝${n}×(${a}＋${last})÷2＝${ans}。`),'number',null,'gauss')},
()=>{const a=ri(1,10),n=ri(8,14+difficulty*6),last=a+n-1,ans=sum(a,1,n);return question('連續整數求和',`計算連續整數的總和：${math(`${a}＋${a+1}＋${a+2}＋……＋${last}＝？`)}`,ans,explain(`從 ${a} 到 ${last}，共有 ${last-a+1} 項。`,`首尾和＝${a}＋${last}＝${a+last}。`,`總和＝${n}×${a+last}÷2＝${ans}。`),'number',null,'consecutive')},
()=>{const a=ri(1,7),d=pick([2,4,6]),n=ri(6,11+difficulty*4),last=term(a,d,n),ans=sum(a,d,n);return question('等差級數首尾配對',`${math(`${a}＋${a+d}＋${a+2*d}＋……＋${last}＝？`)}`,ans,explain(`公差為 ${d}。`,`項數＝(${last}−${a})÷${d}＋1＝${n}。`,`S${n}＝${n}×(${a}＋${last})÷2＝${ans}。`),'number',null,'pairFromLast')},
()=>{const a=ri(2,13),d=ri(2,5),n=ri(6,15),last=term(a,d,n);return question('公式觀念判別',`一個等差級數首項 ${a}、末項 ${last}、共有 ${n} 項。${math('下列哪個是正確的求和算式？')}`,`${n}×(${a}＋${last})÷2`,explain('等差級數的總和可以利用首末項平均數乘以項數。','求和公式為 Sₙ＝n(a₁＋aₙ)÷2。',`本題為 ${n}×(${a}＋${last})÷2。`),'choice',[`${n}×(${a}＋${last})÷2`,`${n}×(${a}＋${last})`,`${last}×(${a}＋${n})÷2`,`${n}×(${last}−${a})÷2`],'formulaChoice')}
],
sumFirstLast:[
()=>{const a=randA(),d=randD(),n=randN(),last=term(a,d,n),ans=sum(a,d,n);return question('已知首項、末項、項數求和',`一個等差級數首項為 ${show(a)}、末項為 ${show(last)}，共有 ${n} 項。${math('求這個等差級數的總和。')}`,ans,explain('公式：Sₙ＝n(a₁＋aₙ)÷2。',`S${n}＝${n}×(${fmt(a)}＋${fmt(last)})÷2。`,`＝${show(ans)}。`),'number',null,'firstLast')},
()=>{const a=randA(),d=randD(),n=ri(7,13+difficulty*7),last=term(a,d,n),ans=sum(a,d,n);return question('先求項數再求和',`${math(`${show(a)}＋${show(a+d)}＋${show(a+2*d)}＋……＋${show(last)}＝？`)}`,ans,explain(`首項 ${show(a)}，公差 ${show(d)}，末項 ${show(last)}。`,`由 ${show(last)}＝${fmt(a)}＋(n−1)×${fmt(d)}，得 n＝${n}。`,`S${n}＝${n}×(${fmt(a)}＋${fmt(last)})÷2＝${show(ans)}。`),'number',null,'findNThenSum')},
()=>{const a=randA(),d=randD(),n=randN(),last=term(a,d,n),ans=sum(a,d,n);return question('負數與正數混合的等差級數',`等差級數的前 ${n} 項中，首項為 ${show(a)}，末項為 ${show(last)}。${math(`S<sub>${n}</sub>＝？`)}`,ans,explain('首項和末項可能有正負，代入公式時要保留括號。',`S${n}＝${n}×[${fmt(a)}＋${fmt(last)}]÷2。`,`＝${show(ans)}。`),'number',null,'signedFirstLast')}
],
sumFirstDiff:[
()=>{const a=randA(),d=randD(),n=randN(),ans=sum(a,d,n);return question('已知首項與公差求和',`等差級數首項 a₁＝${show(a)}，公差 d＝${show(d)}。${math(`求前 ${n} 項和 S<sub>${n}</sub>。`)}`,ans,explain('公式：Sₙ＝n[2a₁＋(n−1)d]÷2。',`S${n}＝${n}×[2×${fmt(a)}＋(${n}−1)×${fmt(d)}]÷2。`,`＝${show(ans)}。`),'number',null,'sumDiff')},
()=>{const a=ri(-13,14),d=ri(2,7),n=ri(7,12+difficulty*6),last=term(a,d,n),ans=sum(a,d,n);return question('求和公式中含有負數',`首項為 ${show(a)}、公差為 ${show(d)} 的等差級數，${math(`前 ${n} 項總和是多少？`)}`,ans,explain(`先求第 ${n} 項：a${n}＝${fmt(a)}＋(${n}−1)×${d}＝${show(last)}。`,`S${n}＝${n}×(${fmt(a)}＋${fmt(last)})÷2。`,`＝${show(ans)}。`),'number',null,'negative')},
()=>{const a=ri(3,23),d=ri(1,8),n=ri(6,16),ans=sum(a,d,n);return question('從數列改寫成級數',`已知數列：${sequence(a,d)}，……${math(`求前 ${n} 項全部相加的和。`)}`,ans,explain(`首項 a₁＝${a}，公差 d＝${d}。`,`S${n}＝${n}×[2×${a}＋(${n}−1)×${d}]÷2。`,`總和為 ${ans}。`),'number',null,'sequenceToSeries')}
],
findUnknown:[
()=>{const a=ri(-12,22),d=ri(1,9),n=ri(5,13+difficulty*3),last=term(a,d,n),ans=sum(a,d,n);return question('已知首項、末項和總和求項數',`等差級數首項為 ${show(a)}、末項為 ${show(last)}，總和 Sₙ＝${show(ans)}。${math('求項數 n。')}`,n,explain('由 Sₙ＝n(a₁＋aₙ)÷2。',`${show(ans)}＝n×(${fmt(a)}＋${fmt(last)})÷2。`,`n＝2×${fmt(ans)}÷(${fmt(a)}＋${fmt(last)})＝${n}。`),'number',null,'reverseN')},
()=>{const a=randA(),d=randD(),n=ri(5,14),last=term(a,d,n),ans=sum(a,d,n);return question('已知首末項及項數求公差',`等差級數的首項為 ${show(a)}，末項為 ${show(last)}，共有 ${n} 項，總和為 ${show(ans)}。${math('求公差 d。')}`,d,explain('等差數列的最後一項：aₙ＝a₁＋(n−1)d。',`${show(last)}＝${fmt(a)}＋(${n}−1)d。`,`d＝(${fmt(last)}−${fmt(a)})÷${n-1}＝${show(d)}。`),'number',null,'reverseD')},
()=>{const a=ri(-9,17),d=ri(1,7),n=ri(5,13),ans=sum(a,d,n);return question('已知總和求首項',`一個等差級數共有 ${n} 項，公差為 ${d}，前 ${n} 項和為 ${ans}。${math('求首項 a₁。')}`,a,explain('公式：Sₙ＝n[2a₁＋(n−1)d]÷2。',`${ans}＝${n}×[2a₁＋(${n}−1)×${d}]÷2。`,`2a₁＝2×${ans}÷${n}−(${n}−1)×${d}，所以 a₁＝${show(a)}。`),'number',null,'reverseA')},
()=>{const a=ri(2,14),d=ri(1,6),n=ri(6,14),ans=sum(a,d,n);return question('已知總和求公差',`等差級數共有 ${n} 項，首項為 ${a}，總和為 ${ans}。${math('求公差 d。')}`,d,explain('Sₙ＝n[2a₁＋(n−1)d]÷2。',`${ans}＝${n}×[2×${a}＋(${n}−1)d]÷2。`,`d＝(2×${ans}÷${n}−2×${a})÷(${n}−1)＝${d}。`),'number',null,'reverseDiff')}
],
seriesApplication:[
()=>{const a=ri(2,7),d=ri(1,5),n=ri(6,14+difficulty*2),ans=sum(a,d,n);return question('樓梯瓷磚累積量',`樓梯第一階貼 ${a} 塊瓷磚，每往上一階，都比前一階多 ${d} 塊，共有 ${n} 階。${math('這座樓梯共需要幾塊瓷磚？')}`,ans,explain(`各階瓷磚數形成等差數列，a₁＝${a}，d＝${d}。`,`S${n}＝${n}×[2×${a}＋(${n}−1)×${d}]÷2。`,`共需 ${ans} 塊。`),'number',null,'stairs')},
()=>{const a=ri(2,9),d=ri(1,5),n=ri(5,13),ans=sum(a,d,n);return question('已知瓷磚總數反推階數',`樓梯第一階貼 ${a} 塊瓷磚，每往上一階多 ${d} 塊。共貼了 ${ans} 塊，剛好貼完。${math('這座樓梯共有幾階？')}`,n,explain(`由 Sₙ＝n[2×${a}＋(n−1)×${d}]÷2。`,`令 Sₙ＝${ans}，解 n[${2*a}＋(n−1)×${d}]＝${2*ans}。`,`驗算 n＝${n} 時，總數正好為 ${ans}；因各階為正數，總和隨階數增加，所以正整數解唯一。`),'number',null,'stairsReverse')},
()=>{const a=ri(8,30),d=ri(2,10),n=ri(7,16),ans=sum(a,d,n);return question('每天累積閱讀頁數',`一位學生第 1 天讀 ${a} 頁，以後每天比前一天多讀 ${d} 頁，連續讀 ${n} 天。${math('總共讀了幾頁？')}`,ans,explain(`每天閱讀頁數形成等差數列。`,`S${n}＝${n}×[2×${a}＋(${n}−1)×${d}]÷2。`,`總共閱讀 ${ans} 頁。`),'number',null,'reading')},
()=>{const a=ri(12,20),d=-ri(1,2),n=ri(5,8),total=sum(a,d,n),goal=ri(42,60),after=goal-total;return question('逐月變化的生活應用',`某人原本體重 ${goal} 公斤，接下來 ${n} 個月每月減重依序為 ${a}、${a+d}、${a+2*d}、……（單位：每月 0.1 公斤），即第一月減 ${a/10} 公斤，以後每月少減 ${Math.abs(d)/10} 公斤。${math(`${n} 個月後體重是多少公斤？`)}`,(goal*10-total)/10,explain('為了避免小數誤差，先把減重量都用「0.1 公斤」為單位計算。',`總減重量＝${n}×[2×${a}＋(${n}−1)×${d}]÷2＝${total} 個 0.1 公斤。`,`剩餘體重＝${goal}−${total}/10＝${(goal*10-total)/10} 公斤。`),'number',null,'weight')},
()=>{const rows=ri(2,4),first=ri(2,6),inc=ri(1,3),layers=ri(5,12),a=rows*first+inc*rows*(rows-1)/2,d=rows*inc,ans=sum(a,d,layers);return question('分層排列圖形的總數',`有 ${layers} 層圖案，每層 ${rows} 排。第一層各排依序放 ${Array.from({length:rows},(_,i)=>first+i*inc).join('、')} 張卡片，第二層每排都比第一層對應那排多 ${inc} 張，依此類推。${math(`總共需要幾張卡片？`)}`,ans,explain(`第一層共 ${a} 張。`,`每升一層，每排都多 ${inc} 張，因此每層總數公差＝${rows}×${inc}＝${d}。`,`S${layers}＝${layers}×[2×${a}＋(${layers}−1)×${d}]÷2＝${ans} 張。`),'number',null,'layers')}
]
};
// Avoid reverse n problems where a1+an is zero, which would imply S_n=0 regardless of n.
const originalReverseN=G.findUnknown[0];G.findUnknown[0]=()=>{for(let i=0;i<60;i++){const q=originalReverseN();if(Number(q.answer)>0&&!q.steps[1].includes('＋(−')){const a=Number(q.html.match(/首項為\s*([−\d]+)/)?.[1].replace('−','-'));const b=Number(q.html.match(/末項為\s*([−\d]+)/)?.[1].replace('−','-'));if(Number.isFinite(a)&&Number.isFinite(b)&&a+b!==0)return q;}}return G.findUnknown[1]();};
const used=new Set();let generationCounter=0;
function generate(modeId){const list=modeId==='comprehensive'?Object.values(G).flat():G[modeId];let q;for(let t=0;t<200;t++){const fun=list[(generationCounter+t)%list.length];q=fun();const key=q.topic+'|'+q.html.replace(/<[^>]*>/g,'').replace(/\s+/g,'');if(!used.has(key)){used.add(key);generationCounter+=t+1;return q}}generationCounter++;return q}
function makeQuestions(){used.clear();generationCounter=ri(0,5);questions=Array.from({length:count},()=>generate(mode));}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatClock(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function choose(i){selected=MODES[i].id;document.querySelectorAll('.mode').forEach((e,j)=>e.classList.toggle('active',i===j))}
function setView(id){['menu','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'instant'});if(id!=='game')window.hideGameScratchpadButton?.();}
function confirmLeave(){return done||confirm('目前測驗尚未完成，確定要離開嗎？本次未完成的成績不會儲存。')}
function resetScratch(){try{window.resetGameScratchpad?.()}catch(e){console.warn(e)}}
function initWidget(){widget=null;const mount=$('mathMount'),fallback=$('nativeMount');mount.innerHTML='';fallback.classList.remove('hidden');if(current?.subtype==='weight'||!window.MathExpressionInput)return;try{widget=new window.MathExpressionInput({mountId:'mathMount',placeholder:'輸入整數或分數',allowRadical:false,allowFraction:true,allowPower:false,allowVariable:false,allowPlusMinus:false,validationMode:'numeric-radical',requireSimplifiedFraction:true,requireSimplifiedRadical:false,showPreview:true,autoFocus:false,onChange:()=>{$('inputHint').textContent='請確認答案後按送出。'}});fallback.classList.add('hidden')}catch(e){console.warn('使用一般答案輸入框',e);widget=null;mount.innerHTML=''}}
function readValue(){if(current.kind==='choice')return selectedChoice===null?{error:'請先選擇答案'}:selectedChoice;if(widget){const info=widget.validate?.();if(info&&!info.valid)return {error:info.message||'請輸入有效答案'};let s=(widget.getRawValue?.()??info?.raw??'').trim();if(!s)return {error:'請先輸入答案'};return {value:s}}let s=$('numericAnswer').value.trim();return s?{value:s}:{error:'請先輸入答案'}}
function rat(s){s=String(s).trim().replace(/−/g,'-').replace(/＋/g,'+').replace(/[（）]/g,c=>c==='（'?'(':')').replace(/\s/g,'').replace(/^\((.*)\)$/,'$1');if(/^[-+]?(?:\d+)(?:\.\d+)?$/.test(s))return Number(s);if(/^[-+]?\d+\/\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return b? a/b:NaN}return NaN}
let selectedChoice=null;
function render(){answered=false;selectedChoice=null;current=questions[index];$('sMode').textContent=MODES.find(m=>m.id===mode).name;$('sCount').textContent=`${index+1} / ${count}`;$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=(records.at(-1)?.combo||0);$('progress').style.width=`${Math.round(index/count*100)}%`;$('qTopic').textContent=current.topic;$('qText').innerHTML=current.html;$('feedback').classList.add('hidden');$('feedback').innerHTML='';$('submit').classList.remove('hidden');$('next').classList.add('hidden');$('inputHint').textContent=current.kind==='choice'?'選擇最符合題意的一項。':'請輸入整數、小數或最簡分數，負數請加負號。';$('answerUI').innerHTML='';if(current.kind==='choice'){$('answerUI').innerHTML='<div class="option-grid">'+current.choices.map(c=>`<button type="button" class="choice" data-choice="${esc(c)}">${esc(c)}</button>`).join('')+'</div>';$('answerUI').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selectedChoice=b.dataset.choice;$('answerUI').querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));});}else{$('answerUI').innerHTML='<div id="mathMount"></div><div id="nativeMount"><input class="ans-input" id="numericAnswer" type="text" inputmode="text" autocomplete="off" placeholder="輸入答案，例如 -3 或 1/2"></div>';initWidget();if(!widget){$('numericAnswer').value='';$('numericAnswer').disabled=false;$('numericAnswer').focus()}}resetScratch();window.hideGameScratchpadButton?.();}
function submit(){if(answered)return;const v=readValue();if(v?.error){$('inputHint').textContent=v.error;return}const actual=current.kind==='choice'?v:v.value;const correct=current.kind==='choice'?actual===current.answer:Number.isFinite(rat(actual))&&Math.abs(rat(actual)-rat(current.answer))<1e-10;if(!correct&&current.kind!=='choice'&&!Number.isFinite(rat(actual))){$('inputHint').textContent='答案格式不正確，請輸入整數、小數或最簡分數。';return}answered=true;const combo=correct?(records.at(-1)?.combo||0)+1:0;records.push({q:current,actual:String(actual),correct,combo});$('sRight').textContent=records.filter(r=>r.correct).length;$('sCombo').textContent=combo;const f=$('feedback');f.className='feedback'+(correct?'':' wrong');f.innerHTML=`<h3>${correct?'✅ 答對了！':'❌ 再釐清這個觀念'}</h3><div>你的答案：<b>${esc(actual)}</b>　正確答案：<b>${esc(current.answer.trim())}</b></div><ol class="steps">${current.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=index===count-1?'查看測驗結果 →':'下一題 →';if(widget)widget.setDisabled?.(true);else if($('numericAnswer'))$('numericAnswer').disabled=true;}
function next(){if(!answered)return;if(index===count-1){finish();return}index++;render()}
function startGame(){mode=selected||MODES[0].id;count=Number($('count').value);difficulty=Number($('difficulty').value);records=[];index=0;done=false;makeQuestions();startAt=Date.now();clearInterval(clock);clock=setInterval(()=>{$('sTime').textContent=formatClock(Math.floor((Date.now()-startAt)/1000))},500);$('sTime').textContent='00:00';setView('game');render()}
async function finish(){done=true;clearInterval(clock);const seconds=Math.round((Date.now()-startAt)/1000),right=records.filter(r=>r.correct).length,wrong=count-right,score=Math.round(100*right/count),maxCombo=Math.max(0,...records.map(r=>r.combo));$('resultScore').textContent=score+' 分';$('resultSummary').textContent=`${MODES.find(m=>m.id===mode).name}｜${count} 題測驗`;$('resultStats').innerHTML=`<div class="stat"><small>答對</small><strong>${right}</strong></div><div class="stat"><small>答錯</small><strong>${wrong}</strong></div><div class="stat"><small>最高連擊</small><strong>${maxCombo}</strong></div><div class="stat"><small>時間</small><strong>${formatClock(seconds)}</strong></div>`;const wrongs=records.map((r,i)=>({...r,num:i+1})).filter(r=>!r.correct);$('reviewList').innerHTML=wrongs.length?wrongs.map(r=>`<div class="review wrong"><b>第 ${r.num} 題｜${esc(r.q.topic)}</b><div class="math-question">${r.q.html}</div><div class="warn">你的答案：${esc(r.actual)}</div><div>正確答案：<b>${esc(r.q.answer.trim())}</b></div><ol class="steps">${r.q.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`).join(''):'<div class="review correct">🎉 全部答對！本次沒有錯題。</div>';$('saveStatus').textContent='☁️ 正在將成績儲存至共用成績系統……';setView('result');try{const res=await saveGameScore({game:GAME_ID,mode,score,correctCount:right,wrongCount:wrong,maxCombo,playTime:seconds});$('saveStatus').textContent=res?.success?'✅ 成績已儲存，可至我的成績與排行榜查看。':'⚠️ 本次結果已顯示，但雲端儲存未成功；請確認登入及遊戲註冊。'}catch(e){console.error(e);$('saveStatus').textContent='⚠️ 雲端儲存失敗，請檢查登入或網路連線。'}}
MODES.forEach((m,i)=>{$('modeGrid').insertAdjacentHTML('beforeend',`<button type="button" class="mode" data-index="${i}"><b>${i+1}. ${m.name}</b><small>${m.desc}</small></button>`)});$('modeGrid').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)choose(Number(b.dataset.index))});choose(0);$('start').onclick=startGame;$('submit').onclick=submit;$('next').onclick=next;$('restart').onclick=()=>{if(confirmLeave())startGame()};$('reselect').onclick=()=>{if(confirmLeave()){done=true;clearInterval(clock);setView('menu')}};$('again').onclick=startGame;$('backMenu').onclick=()=>setView('menu');$('scratch').onclick=()=>window.openGameScratchpad?.();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('game').classList.contains('hidden')){e.preventDefault();if(answered)next();else submit()}});window.addEventListener('beforeunload',e=>{if(!done&&!$('game').classList.contains('hidden')){e.preventDefault();e.returnValue=''}});
</script></body></html>
