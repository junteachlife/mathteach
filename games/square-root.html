<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    平方根大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f57c00'/%3E%3Crect x='7' y='7' width='50' height='50' rx='12' fill='%23fff8e1' stroke='%23e65100' stroke-width='3'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='31' font-family='Microsoft JhengHei,Noto Sans TC,sans-serif' font-weight='900' fill='%23bf360c'%3E%E6%A0%B9%3C/text%3E%3C/svg%3E"
  >

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #0288d1;
      --primary-dark: #0277bd;
      --primary-light: #e1f5fe;
      --primary-border: #81d4fa;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e8f7ff,
          #fffbea
        );
    }

    button,
    input,
    select {

      font-family: inherit;
    }

    .hidden {

      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #d5eef9;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          30px,
          5vw,
          42px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {

      padding: 22px;
    }

    /*
    ==================================================
    一般數學式
    ==================================================
    */

    .math-expression {

      display:
        inline-flex;

      justify-content: center;

      align-items: center;

      flex-wrap: nowrap;

      gap: .08em;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      white-space: nowrap;
    }

    .math-expression sup,
    .detail-math sup {

      position: relative;

      top: -.48em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    /*
    ==================================================
    ★ MathML 數學排版
    題目 / 詳解 / 正確答案共用
    ==================================================
    */

    .mathml-inline {

      display: inline-block;

      margin:
        0 .06em;

      color:
        currentColor;

      font-family:
        "STIX Two Math",
        "Cambria Math",
        "Times New Roman",
        serif;

      vertical-align:
        middle;

      line-height: 1;
    }

    .mathml-inline math {

      display: inline-block;

      margin: 0;

      padding: 0;

      color:
        currentColor;

      font-size: 1em;

      line-height: 1;
    }

    .question-content .mathml-inline {

      font-size: 1.05em;
    }

    .detail-math .mathml-inline,
    .explanation .mathml-inline {

      font-size: 1em;
    }

    .feedback .mathml-inline {

      font-size: 1.12em;
    }

    .choice-button .mathml-inline {

      font-size: 1em;
    }

    /*
    ==================================================
    根號顯示｜完全沿用「根式運算大挑戰」的 SVG 根號邏輯

    由同一個 SVG path 同時畫出根號勾、斜線、轉折與上方橫線，
    不再使用「SVG 勾＋CSS border-top」兩段式拼接。
    因此根號轉折與橫線會自然連成同一筆，內容再長也會一起延伸。
    ==================================================
    */

    .display-radical {

      position: relative;

      display:
        inline-flex;

      align-items: center;

      min-width: 1.15em;
      min-height: 1.55em;

      padding:
        .15em .10em .02em .78em;

      margin:
        0 .04em;

      vertical-align: middle;
    }


    .display-radical-svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .display-radical-path {

      fill: none;

      stroke:
        currentColor;

      stroke-width: 3.6;

      stroke-linejoin: round;
      stroke-linecap: round;

      vector-effect:
        non-scaling-stroke;
    }


    .display-radicand {

      position: relative;

      z-index: 2;

      display:
        inline-flex;

      align-items: baseline;

      white-space: nowrap;

      /*
      根號 SVG 本身完全不動。
      只替根號內文字保留安全空間，避免第一個數字、次方
      或乘號靠得太近而被根號斜線遮住。
      */
      padding:
        .035em .12em .02em .12em;

      transform:
        translateY(.02em);
    }


    .display-radicand.display-radicand-complex {

      /*
      含次方、乘除或較長式子的根號內容再多留一些左側安全區。
      只移動內容，不修改根號勾、斜線、轉折或上方橫線。
      */
      padding-left: .34em;
      padding-top: .07em;

      transform:
        translateY(.045em);
    }


    .display-radicand .mathml-inline {

      display: inline-flex;

      align-items: center;

      margin: 0;
      padding: 0;

      vertical-align: middle;

      font-size: 1em;
      line-height: 1;
    }


    .display-radicand .mathml-inline math {

      display: inline-block;

      margin: 0;
      padding: 0;

      overflow: visible;

      font-size: 1em;
      line-height: 1;
    }


    .root-sequence {

      display: inline-flex;

      align-items: baseline;

      gap: .16em;

      white-space: nowrap;
    }

    /*
    ==================================================
    分數
    ==================================================
    */

    .display-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.8em;

      margin:
        0 .12em;

      vertical-align: middle;
    }

    .display-fraction-top,
    .display-fraction-bottom {

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        .08em .20em;
    }

    .display-fraction-top {

      border-bottom:
        2px solid
        currentColor;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 215px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 68px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #29b6f6
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-weight: 900;
    }

    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #0f172a;

      font-size:
        clamp(
          30px,
          5vw,
          45px
        );

      line-height: 1.8;

      overflow-x: auto;
    }

    /*
    ==================================================
    參考數值
    ==================================================
    */

    .reference-box {

      margin-top: 15px;

      padding: 13px;

      border:
        1px dashed
        var(--primary-border);

      border-radius: 13px;

      background:
        #f0f9ff;

      color:
        #334155;

      text-align: center;

      font-size: 16px;

      font-weight: 800;

      line-height: 1.8;
    }

    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 12px;

      color:
        var(--muted);

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.6;
    }

    /*
    ==================================================
    Number / Decimal
    ==================================================
    */

    .number-answer,
    .decimal-answer {

      display: flex;

      justify-content: center;
    }

    .number-answer input,
    .decimal-answer input {

      width:
        min(
          260px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    /*
    ==================================================
    Fraction
    ==================================================
    */

    .fraction-answer {

      display: flex;

      justify-content: center;
    }

    .fraction-input {

      display: flex;

      flex-direction: column;

      width: 120px;
    }

    .fraction-input input {

      width: 100%;

      padding: 10px;

      border:
        2px solid
        #cbd5e1;

      background: white;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .fraction-input
    input:first-child {

      border-radius:
        10px 10px 0 0;

      border-bottom:
        2.5px solid
        #334155;
    }

    .fraction-input
    input:last-child {

      border-radius:
        0 0 10px 10px;

      border-top: 0;
    }

    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;
    }

    .choice-button {

      min-height: 60px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;

      color:
        #263238;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width: 720px;

      min-height: 58px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    .answer-preview-value {

      display:
        inline-flex;

      align-items: center;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 25px;
    }

    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .game-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {

      color:
        var(--success);
    }

    .feedback.wrong {

      color:
        var(--danger);
    }

    .feedback.warning {

      color:
        var(--warning);
    }

    /*
    ==================================================
    詳解｜自學版
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border:
        1px solid
        #bae6fd;

      border-radius: 16px;

      background:
        #f0f9ff;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-heading {

      display: flex;

      align-items: center;

      gap: 8px;

      margin:
        0 0 14px;

      color:
        var(--primary-dark);

      font-size: 21px;

      font-weight: 900;
    }

    .explanation-question {

      margin-bottom: 14px;

      padding:
        15px 14px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;
    }

    .explanation-question-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .explanation-question-math {

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: auto;

      padding:
        8px 4px;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          21px,
          3.2vw,
          29px
        );

      font-weight: 900;

      text-align: center;
    }

    .explanation-method {

      margin-bottom: 14px;

      padding:
        13px 14px;

      border:
        1px solid
        #fed7aa;

      border-radius: 12px;

      background:
        #fff7ed;
    }

    .explanation-method strong {
      color: #c2410c;
    }

    .explanation-step {

      margin:
        11px 0;

      padding:
        13px 14px;

      border-left:
        4px solid
        var(--primary);

      border-radius: 11px;

      background: white;
    }

    .explanation-step strong {
      color: var(--primary-dark);
    }

    .detail-math {

      display:
        inline-flex;

      align-items: center;

      flex-wrap: nowrap;

      white-space: nowrap;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size: 1.08em;
    }

    .detail-block {

      display: block;

      margin-top: 8px;

      padding:
        10px 12px;

      overflow-x: auto;

      border:
        1px solid
        #bae6fd;

      border-radius: 10px;

      background:
        #f8fdff;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size: 1.06em;

      font-weight: 900;

      line-height: 2;
    }

    .explanation-tip {

      margin-top: 14px;

      padding:
        13px 14px;

      border:
        1px solid
        #fecdd3;

      border-radius: 12px;

      background:
        #fff1f2;

      color:
        #9f1239;
    }

    .explanation-tip strong {
      color: #be123c;
    }

    .explanation-summary {

      margin-top: 14px;

      padding:
        13px 14px;

      border:
        1px solid
        #bbf7d0;

      border-radius: 12px;

      background:
        #ecfdf5;

      color:
        #166534;

      font-weight: 900;
    }

    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {

      font-size: 31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding: 16px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin-top: 14px;

      font-weight: 900;
    }

    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }

    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }

    .review-question {

      margin:
        12px 0;

      font-size: 23px;

      text-align: center;
    }

    @media(
      max-width:760px
    ) {

      body {

        padding: 8px;
      }

      .screen {

        padding:
          18px 12px;
      }

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  while (
    b !==
    0
  ) {

    const t =
      a %
      b;


    a =
      b;


    b =
      t;
  }


  return Math.abs(
    a
  );
}


/*
==================================================
MathML 工具
==================================================
*/

function escapeXML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&apos;"
    );
}


function mathToken(
  value
) {

  const text =
    String(
      value
    )
      .trim();


  if (
    /^-?\d+(?:\.\d+)?$/
      .test(
        text
      )
  ) {

    return `
      <mn>
        ${escapeXML(text)}
      </mn>
    `;
  }


  if (
    /^[a-zA-Z]+$/
      .test(
        text
      )
  ) {

    return `
      <mi>
        ${escapeXML(text)}
      </mi>
    `;
  }


  return `
    <mtext>
      ${escapeXML(text)}
    </mtext>
  `;
}


function powerMathML(
  base,
  exponent
) {

  return `
    <msup>

      ${mathToken(base)}

      <mn>
        ${escapeXML(exponent)}
      </mn>

    </msup>
  `;
}


function productMathML(
  items
) {

  return items
    .map(
      item =>
        item
    )
    .join(
      `
        <mo>×</mo>
      `
    );
}


function inlineMath(
  content
) {

  return `

    <span class="mathml-inline">

      <math
        xmlns="http://www.w3.org/1998/Math/MathML"
      >

        <mrow>

          ${content}

        </mrow>

      </math>

    </span>
  `;
}


function sqrtMath(
  content
) {

  /*
  ==================================================
  根號顯示｜完全沿用「根式運算大挑戰」

  注意：這裡不改 SVG 根號設計。
  只依根號內是否含次方、乘除等較複雜內容，
  替「內容」加上安全距離，避免被根號斜線遮住。
  ==================================================
  */

  const source =
    String(
      content ??
      ""
    );


  const plainText =
    source
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        ""
      );


  const isComplex =

    /<msup\b|<mfrac\b|<msub\b|<munderover\b/i
      .test(
        source
      ) ||

    /[×÷＋－+−·]/
      .test(
        plainText
      ) ||

    plainText.length >=
      5;


  const radicandClass =

    isComplex

      ? "display-radicand display-radicand-complex"

      : "display-radicand";


  return `

    <span class="display-radical final-answer-root">

      <svg
        class="display-radical-svg"
        viewBox="0 0 100 62"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >

        <path
          class="display-radical-path"
          d="
            M 1 37
            L 7 37
            L 13 51
            L 18 58
            L 29 8
            L 98 8
          "
        ></path>

      </svg>

      <span class="${radicandClass}">
        ${inlineMath(content)}
      </span>

    </span>
  `;
}


/*
==================================================
一般 HTML 次方
非根號內需要時使用
==================================================
*/

function powerHTML(
  base,
  exponent
) {

  return `

    <span>

      ${base}<sup>${exponent}</sup>

    </span>
  `;
}


/*
==================================================
將舊 HTML 數學內容轉成 MathML
主要供 sqrtDisplay 使用
==================================================
*/

function htmlMathToMathML(
  content
) {

  let text =
    String(
      content
    )
      .trim();


  /*
  <span>2<sup>3</sup></span>
  */
  text =
    text.replace(
      /<span>\s*([^<>]+?)\s*<sup>\s*([^<>]+?)\s*<\/sup>\s*<\/span>/g,
      (
        _,
        base,
        exponent
      ) =>
        powerMathML(
          base.trim(),
          exponent.trim()
        )
    );


  /*
  其他單純 sup
  */
  text =
    text.replace(
      /([^<>\s]+)\s*<sup>\s*([^<>]+?)\s*<\/sup>/g,
      (
        _,
        base,
        exponent
      ) =>
        powerMathML(
          base.trim(),
          exponent.trim()
        )
    );


  /*
  剩餘 span 拿掉
  */
  text =
    text.replace(
      /<\/?span[^>]*>/g,
      ""
    );


  /*
  ×
  */
  text =
    text.replace(
      /\s*×\s*/g,
      "<mo>×</mo>"
    );


  /*
  已經含 MathML 標籤時保留。
  將其餘純文字數字轉成 mn。
  */

  const pieces =
    text.split(
      /(<(?:msup|mn|mi|mo|mrow|mtext)[\s\S]*?<\/(?:msup|mn|mi|mo|mrow|mtext)>)/g
    );


  return pieces
    .map(
      part => {

        const trimmed =
          part.trim();


        if (
          !trimmed
        ) {

          return "";
        }


        if (
          trimmed.startsWith(
            "<"
          )
        ) {

          return trimmed;
        }


        if (
          /^-?\d+(?:\.\d+)?$/
            .test(
              trimmed
            )
        ) {

          return `
            <mn>
              ${escapeXML(trimmed)}
            </mn>
          `;
        }


        return `
          <mtext>
            ${escapeXML(trimmed)}
          </mtext>
        `;
      }
    )
    .join("");
}


/*
==================================================
★ 根號顯示
MathML 原生 msqrt

function sqrtDisplay(

function radicalDisplay(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient

  if (
    radicand ===
    1
  ) {

    return String(
      coefficient

  }


  let coefficientHTML =
    "";


  if (
    coefficient ===
    -1
  ) {

    coefficientHTML =
      "−";

  } else if (
    coefficient !==
    1
  ) {

    coefficientHTML =
      String(
        Math.abs(
          coefficient
        )
      );


    if (
      coefficient <
      0
    ) {

      coefficientHTML =
        `−${coefficientHTML}`;
    }
  }


  return `

    <span class="math-expression">

      ${coefficientHTML}

      ${sqrtMath(
        `<mn>${radicand}</mn>`
      )}

    </span>
  `;
}

/*

function factorHTML(

function factorMathML(

) {

        if (
          exponent ===

    )
  );
}


/*
==================================================
根式化簡
==================================================
*/

function simplifyRadical(
  n
) {

  let outside =
    1;


  let inside =
    n;


  for (
    let square =
      Math.floor(
        Math.sqrt(
          n
        )
      );

    square >=
    2;

    square--
  ) {

    const squareValue =
      square *
      square;


    if (
      n %
      squareValue ===
      0
    ) {

      outside =
        square;

      inside =
        n /
        squareValue;


      break;
    }
  }


  if (
    inside ===
    1
  ) {

    return {

      type:
        "number",

      value:
        outside
    };
  }


  return {

    type:
      "radical",

    coefficient:
      outside,

    radicand:
      inside
  };
}

/*
==================================================
模式一
11²～32²
==================================================
*/

function makeMode1() {

  const numbers =
    shuffle(
      Array.from(
        {
          length:
            22
        },
        (
          _,
          i
        ) =>
          i +
          11
      )
    )
      .slice(
        0,
        12
      );


  return numbers
    .map(
      n => {

        const answer =

function makePrimeSimplifyQuestion() {

  const primes =
    shuffle(
      [
        2,
        3,
        5,
        7
      ]
    )
      .slice(
        0,
        rand(
          2,
          3
        )
      )
      .sort(
        (
          a,
          b
        ) =>
          a -
          b
      );


  const exponents =
    [];


  let hasAtLeastTwo =
    false;


  primes.forEach(
    (
      prime,
      i
    ) => {

      let exponent =
        rand(
          1,
          5
        );


      if (
        i ===
        primes.length -
        1 &&
        !hasAtLeastTwo
      ) {

        exponent =
          rand(
            2,
            5
          );
      }


      if (
        exponent >=
        2
      ) {

        hasAtLeastTwo =
          true;
      }


      exponents.push(
        exponent
      );
    }
  );


  const factors =
    primes.map(
      (
        prime,
        i
      ) => [
        prime,
        exponents[
          i
        ]
      ]
    );


  const evenFactors =
    [];


  const leftoverFactors =
    [];


  let outside =
    1;


  let inside =
    1;


  factors.forEach(
    (
      [
        prime,
        exponent
      ]
    ) => {

      const evenExponent =
        exponent -
        exponent %
        2;


      if (
        evenExponent >
        0
      ) {

        evenFactors.push(
          [
            prime,
            evenExponent
          ]
        );


        outside *=
          prime **
          (
            evenExponent /
            2
          );
      }


      if (
        exponent %
        2 ===
        1
      ) {

        leftoverFactors.push(
          [
            prime,
            1
          ]
        );


        inside *=
          prime;
      }
    }
  );


  const originalHTML =
    factorHTML(
      factors
    );


  const decomposedHTML =
    [
      ...evenFactors,
      ...leftoverFactors
    ]
      .map(
        ([prime, exponent]) =>
          exponent ===
          1

            ? String(prime)

            : powerHTML(
                prime,
                exponent
              )
      )
      .join(
        " × "
      );


  const sqrtPieces =
    [];


  evenFactors.forEach(
    ([prime, exponent]) => {

      sqrtPieces.push(
        sqrtDisplay(
          powerHTML(
            prime,
            exponent
          )
        )
      );
    }
  );


  if (
    leftoverFactors.length
  ) {

    sqrtPieces.push(
      sqrtDisplay(
        leftoverFactors
          .map(
            ([prime]) =>
              String(prime)
          )
          .join(
            " × "
          )
      )
    );
  }


  const outsidePowerParts =
    evenFactors
      .map(
        ([prime, exponent]) => {

          const outExponent =
            exponent /
            2;


          return outExponent ===
            1

            ? String(prime)

            : powerHTML(
                prime,
                outExponent
              );
        }
      );


  const outsidePowerHTML =
    outsidePowerParts.length

      ? outsidePowerParts.join(
          " × "
        )

      : "1";


  const questionHTML =
    sqrtDisplay(
      originalHTML
    );


  const explanation =
    [

      `先把每個奇數次方拆成「最大的偶數次方 × 剩下 1 個質因數」：
      <span class="detail-block">
        ${originalHTML}
        ＝
        ${decomposedHTML}
      </span>`,

      `把根號拆開。偶數次方各自開根號，沒有配成完全平方的質因數留在同一個根號內：
      <span class="detail-block">
        ${sqrtDisplay(
          originalHTML
        )}
        ＝
        ${sqrtPieces.join(
          " × "
        )}
      </span>`,

      `偶數次方開根號時，指數除以 2：
      <span class="detail-block">
        ${sqrtPieces.join(
          " × "
        )}
        ＝
        ${outsidePowerHTML}
        ${
          inside ===
          1

            ? ""

            : ` × ${sqrtDisplay(
                String(inside)
              )}`
        }
      </span>`,

      inside ===
      1

        ? `最後把根號外的數算完：
           <span class="detail-block">
             ${outsidePowerHTML}
             ＝
             ${outside}
           </span>`

        : `最後把根號外的數算完，根號內保留不能再開平方的部分：
           <span class="detail-block">
             ${outsidePowerHTML}
             ×
             ${sqrtDisplay(
               String(inside)
             )}
             ＝
             ${detailRadical(
               outside,
               inside
             )}
           </span>`
    ];


  if (
    inside ===
    1
  ) {

    return numberQuestion(

      questionHTML,

      outside,

      explanation,

      "請利用質因數標準分解式化成最簡形式",

      {

        method:
          "先把每個質因數的指數拆成最大的偶數次方；偶數次方可以直接開根號，指數除以 2。",

        pitfall:
          "奇數次方不能整個直接除以 2。要先拆成『偶數次方 × 1 個同質因數』，那 1 個要留在根號內。",

        summary:
          `最後答案：${outside}`
      }
    );
  }


  return radicalQuestion(

    questionHTML,

    outside,

    inside,

    explanation,

    "請利用質因數標準分解式化成最簡根式",

    {

      method:
        "先把奇數次方拆成『最大的偶數次方 × 1 個同質因數』，再把每個偶數次方分別開根號；最後剩下的質因數乘在同一個根號內。",

      pitfall:
        `例如 ${powerHTML(2, 5)} 應拆成 ${powerHTML(2, 4)}×2；${sqrtDisplay(powerHTML(2, 4))}＝${powerHTML(2, 2)}，而剩下的 2 要留在根號內，不能一起提出。`,

      summary:
        `最後答案：${detailRadical(
          outside,
          inside
        )}`
    }
  );
}

function makePositiveRootApplication() {

  const root =
    rand(
      3,
      12

  const x =
    rand(
      -8,
      12
    );


  const coefficient =
    pick(
      [
        2,
        3,
        4,
        5
      ]
    );


  const constant =
    root *
    root -
    coefficient *
    x;


  const squareValue =
    root *
    root;


  const rightAfterMove =
    squareValue -
    constant;


  const constantText =

    constant >=
    0

      ? `＋${constant}`

      : `－${Math.abs(
          constant
        )}`;


  const moveText =

    constant >=
    0

      ? `${squareValue}－${constant}`

      : `${squareValue}＋${Math.abs(
          constant
        )}`;


  return numberQuestion(

    `

      <span class="math-expression">

        若 ${root} 是
        ${coefficient}x
        ${constantText}
        的正平方根，則 x＝？

      </span>
    `,

    x,

    [

      `「${root} 是 ${coefficient}x${constantText} 的正平方根」表示把 ${root} 平方後，就等於根號內的數：
      <span class="detail-block">

        ${squareValue}
        ＝
        ${coefficient}x${constantText}

      `把常數項移到左邊：
      <span class="detail-block">
        ${moveText}
        ＝
        ${coefficient}x

        ${rightAfterMove}
        ＝
        ${coefficient}x
      </span>`,

      `最後兩邊同除以 ${coefficient}：

        ＝
        ${rightAfterMove}÷${coefficient}

        ${x}
      </span>`
    ],

    "請利用平方根的意義求 x",

    {

      method:
        "關鍵不是把題目加上根號，而是把『是正平方根』翻譯成：正平方根²＝原來的數，再解一元一次方程式。",

      pitfall:
        `不要把負平方根誤認成「−${n}」。${n} 的負平方根是 −${root}，因為 (−${root})²＝${n}。`,

      summary:
        `最後答案：−${root}`
    }
  );
}


function makeBothRootsQuestion() {

  const root =
    rand(
      2,
      15
    );


  const n =
    root *
    root;


  const choices =
    shuffle(
      [

        {
          value:
            "correct",

          text:
            `±${root}`
        },

        {
          value:
            "a",

          text:
            `${root}`
        },

        {
          value:
            "b",

          text:
            `−${root}`
        },

        {
          value:
            "c",

          text:
            `±${n}`
        }
      ]
    );


  return choiceQuestion(

    `

      <span class="math-expression">

        ${n} 的平方根為何？

      </span>
    `,

    "correct",

    choices,

    [

      `「平方根」是指平方後會得到 ${n} 的所有數。`,

      `正的：
      <span class="detail-block">
        ${detailPower(
          root,
          2
        )}
        ＝${n}
      </span>`,

      `負的也要檢查：
      <span class="detail-block">
        ${detailPower(
          `−${root}`,
          2
        )}
        ＝${n}
      </span>`,

      `所以 ${n} 有兩個平方根：
      <span class="detail-block">
        ${root}、−${root}
        <br>
        合寫為 ±${root}
      </span>`
    ],

    "請選出正確答案",

    {

      method:
        `題目只寫「平方根」時，要找正、負兩個；若寫「正平方根」或根號 ${sqrtDisplay("n")}，才只取非負的那一個。`,

      pitfall:
        `平方根是 ±${root}，不是 ±${n}；也不能只寫 ${root}，因為 −${root} 平方後同樣是 ${n}。`,

      summary:
        `最後答案：±${root}`
    }
  );
}


function makeAbsoluteValueRootQuestion() {

  const absolute =
    rand(
      2,
      15
    );


  const a =
    Math.random() <
    .5

      ? absolute

      : -absolute;


  return numberQuestion(

    sqrtMath(
      `
        <msup>

          <mrow>

            <mo>(</mo>

            <mn>
              ${a}
            </mn>

            <mo>)</mo>

          </mrow>

          <mn>
            2
          </mn>

        </msup>
      `
    ),

    Math.abs(
      a
    ),

    [

      `先使用重要性質：
      <span class="detail-block">
        ${sqrtMath(
          powerMathML(
            "a",
            2
          )
        )}
        ＝|a|
      </span>`,

      `本題 a＝${a}，代入後：
      <span class="detail-block">
        ${sqrtMath(
          `
            <msup>
              <mrow>
                <mo>(</mo>
                <mn>${a}</mn>
                <mo>)</mo>
              </mrow>
              <mn>2</mn>
            </msup>
          `
        )}
        ＝|${a}|
      </span>`,

      `絕對值表示到 0 的距離，因此：
      <span class="detail-block">
        |${a}|
        ＝
        ${Math.abs(
          a
        )}
      </span>`,

      `所以答案＝${Math.abs(
        a
      )}。`
    ],

    "請求出根號的值",

    {

      method:
        `${sqrtDisplay(powerHTML("a", 2))}＝|a| 是這一題的核心。即使括號裡是負數，開平方後的主平方根仍然不能是負數。`,

      pitfall:
        a < 0
          ? `本題括號內是負數 ${a}，不能直接寫成 ${a}；一定要先變成 |${a}|。`
          : `根號符號 ${sqrtDisplay("n")} 代表主平方根，所以結果必須是非負數。`,

      summary:
        `最後答案：${Math.abs(
          a
        )}`
    }
  );
}


function makeMode4() {

  return shuffle(
    [

      makePositiveRootApplication(),
      makePositiveRootApplication(),
      makePositiveRootApplication(),

      makeNegativeRootApplication(),
      makeNegativeRootApplication(),

      makeBothRootsQuestion(),
      makeBothRootsQuestion(),

      makeAbsoluteValueRootQuestion(),
      makeAbsoluteValueRootQuestion(),
      makeAbsoluteValueRootQuestion()
    ]
  );
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  if (
    question.type ===
    "decimal"
  ) {

    const raw =
      $("decimal-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?(?:\d+|\d*\.\d+)$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整數值。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把根式答案填寫完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "decimal"
  ) {

    return (
      Math.abs(
        answer.value -
        question.answer
      ) <
      .000001
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "decimal"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return radicalDisplay(
      question.coefficient,
      question.radicand
    );
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          question.answer
      );


  return (
    choice?.text ||
    question.answer
  );
}

/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
        questions.length -
        1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}

      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "平方根成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>

              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);
