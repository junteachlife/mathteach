<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    因式分解大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=6"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #00897b;
      --primary-dark: #00695c;
      --primary-light: #e0f2f1;
      --primary-border: #80cbc4;

      --formula: #7b1fa2;
      --formula-light: #f3e5f5;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #0288d1;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e0f2f1,
          #fff8e8
        );
    }

    button,
    input,
    select {

      font-family: inherit;
    }

    .hidden {

      display:
        none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #d7eeeb;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {

      padding: 22px;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 240px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-card.formula-mode {

      border-color:
        #ce93d8;

      background:
        linear-gradient(
          180deg,
          var(--formula-light),
          white
        );
    }

    .mode-tag {

      display: inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .formula-mode
    .mode-tag,

    .formula-mode h2 {

      color:
        #6a1b9a;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;

      line-height: 1.45;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.75;
    }

    .mode-example {

      margin-top: 12px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.7;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #26a69a
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-weight: 900;
    }

    .question-content {

      min-height: 150px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      padding:
        16px 6px;

      color:
        #0f172a;

      font-size:
        clamp(
          26px,
          4.7vw,
          42px
        );

      font-weight: 900;

      line-height: 1.8;

      -webkit-overflow-scrolling:
        touch;
    }

    .math-expression {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: nowrap;

      gap: .08em;

      min-width:
        max-content;

      white-space:
        nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    .question-content sup,
    .explanation sup,
    .review-question sup,
    .preview-value sup,
    .correct-answer sup,
    .formula-box sup {

      position: relative;

      top: -.46em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    .dot-multiply {

      display:
        inline-block;

      padding:
        0 .12em;

      font-weight: 900;
    }

    /*
    ==================================================
    答案區
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 14px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.7;
    }

    /*
    ==================================================
    因式答案
    ==================================================
    */

    .factor-answer-shell {

      width:
        min(
          100%,
          900px
        );

      margin:
        0 auto;

      padding: 16px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          #edf9f7,
          white
        );
    }

    .factor-answer-grid {

      display: grid;

      grid-template-columns:
        minmax(
          0,
          1fr
        )
        42px
        minmax(
          0,
          1fr
        );

      gap: 10px;

      align-items: center;
    }

    .factor-box {

      min-width: 0;

      padding:
        12px 10px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 15px;

      background: white;
    }

    .factor-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size: 16px;

      font-weight: 900;
    }

    .factor-times {

      text-align: center;

      color:
        #334155;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 900;
    }

    .polynomial-answer-shell {

      width: 100%;

      margin:
        0 auto;
    }

    /*
    ExpressionInput 分數格
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient {

      position:
        relative !important;

      display:
        grid !important;

      grid-template-columns:
        minmax(
          110px,
          150px
        ) !important;

      grid-template-rows:
        1fr 1fr !important;

      gap:
        0 !important;

      width:
        min(
          150px,
          100%
        ) !important;

      min-height:
        106px !important;

      margin:
        0 !important;

      overflow:
        hidden !important;

      border:
        2px solid
        var(--primary-border) !important;

      border-radius:
        12px !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-slash {

      display:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field {

      display:
        flex !important;

      flex-direction:
        column !important;

      align-items:
        center !important;

      justify-content:
        center !important;

      width:
        100% !important;

      height:
        52px !important;

      gap:
        0 !important;

      margin:
        0 !important;

      padding:
        4px 8px !important;

      border:
        0 !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field input {

      width:
        100% !important;

      min-width:
        0 !important;

      height:
        42px !important;

      padding:
        3px !important;

      border:
        0 !important;

      border-radius:
        0 !important;

      outline:
        none !important;

      background:
        transparent !important;

      text-align:
        center !important;

      font-size:
        21px !important;

      font-weight:
        900 !important;

      box-shadow:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-coefficient::after {

      content: "";

      position: absolute;

      left: 12px;

      right: 12px;

      top: 50%;

      z-index: 10;

      border-top:
        2px solid
        #334155;

      pointer-events: none;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__field-label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    small {

      display:
        none !important;
    }

    /*
    ==================================================
    橫向線性雙因式輸入
    ==================================================
    */

    .factor-answer-shell--linear {

      padding: 12px;
    }


    .factor-answer-shell--linear
    .answer-preview {

      margin-top: 12px;
    }


    /*
    ==================================================
    目前答案
    ==================================================
    */

    .answer-preview {

      margin:
        16px auto 0;

      padding: 13px;

      max-width: 780px;

      min-height: 62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .preview-value {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      margin-left: 8px;

      color:
        var(--primary-dark);

      font-size: 27px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    ==================================================
    按鈕
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #01579b;
    }

    .game-button:disabled {

      opacity: .55;

      cursor:
        not-allowed;
    }

    /*
    ==================================================
    回饋
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {

      color:
        var(--success);
    }

    .feedback.wrong {

      color:
        var(--danger);
    }

    .feedback.warning {

      color:
        var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border-radius: 14px;

      background:
        #edf7f6;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-question {

      margin-bottom: 18px;

      padding:
        15px 14px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;
    }

    .explanation-question-title {

      margin-bottom: 9px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .explanation-question-math {

      overflow-x: auto;

      padding:
        8px 4px;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        clamp(
          21px,
          3.2vw,
          29px
        );

      font-weight: 900;

      text-align: center;
    }

    .explanation-step {

      margin:
        11px 0;
    }

    .calculation-box {

      margin:
        12px 0;

      padding:
        13px 15px;

      border:
        1px solid
        var(--primary-border);

      border-radius: 12px;

      background: white;

      overflow-x: auto;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        1.08em;

      line-height: 2;
    }

    .formula-box {

      margin:
        12px auto;

      padding:
        12px 15px;

      width:
        min(
          100%,
          520px
        );

      border:
        2px solid
        #ce93d8;

      border-radius: 12px;

      background:
        #faf3fc;

      color:
        #6a1b9a;

      text-align: center;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 20px;

      font-weight: 900;

      line-height: 1.8;
    }

    /*
    ==================================================
    詳解｜自學強化區塊
    ==================================================
    */

    .explanation-answer-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin:
        0 0 14px;
    }

    .explanation-answer-card {

      padding:
        12px 13px;

      border:
        1px solid
        #cbd5e1;

      border-radius:
        12px;

      background:
        white;
    }

    .explanation-answer-card--correct {

      border-color:
        #86efac;

      background:
        #f0fdf4;
    }

    .explanation-answer-label {

      margin-bottom:
        6px;

      color:
        #64748b;

      font-size:
        13px;

      font-weight:
        900;
    }

    .explanation-answer-value {

      overflow-x:
        auto;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        20px;

      font-weight:
        900;

      line-height:
        1.8;
    }

    .explanation-method,
    .explanation-pitfall,
    .explanation-final {

      margin:
        13px 0;

      padding:
        13px 15px;

      border-radius:
        12px;

      line-height:
        1.9;
    }

    .explanation-method {

      border:
        1px solid
        #93c5fd;

      background:
        #eff6ff;
    }

    .explanation-method strong {

      color:
        #1d4ed8;
    }

    .explanation-pitfall {

      border:
        1px solid
        #fdba74;

      background:
        #fff7ed;
    }

    .explanation-pitfall strong {

      color:
        #c2410c;
    }

    .explanation-final {

      border:
        2px solid
        #86efac;

      background:
        #f0fdf4;

      text-align:
        center;
    }

    .explanation-final strong {

      color:
        #15803d;
    }

    .explanation-final-answer {

      display:
        inline-block;

      margin-left:
        6px;

      color:
        #14532d;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        1.18em;

      font-weight:
        900;
    }

    @media(
      max-width:
        640px
    ) {

      .explanation-answer-grid {

        grid-template-columns:
          1fr;
      }
    }

    /*
    ==================================================
    結果
    ==================================================
    */

    .result-panel {

      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {

      margin-bottom: 10px;

      font-size: 31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }

    /*
    ==================================================
    錯題
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }

    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }

    .review-question {

      margin:
        12px 0;

      overflow-x: auto;

      font-size: 22px;

      text-align: center;
    }

    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:
        820px
    ) {

      .mode-grid {

        grid-template-columns:
          1fr;
      }

    }

    @media(
      max-width:
        760px
    ) {

      body {

        padding: 8px;
      }

      .screen {

        padding:
          18px 12px;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {

        grid-column:
          1 / -1;
      }

      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .answer-panel {

        padding:
          14px 8px;
      }

      .factor-answer-grid {

        grid-template-columns:
          1fr;
      }

      .factor-times {

        font-size: 28px;
      }

      .question-content {

  0;

let factorPairInput =

let elapsed =
  0;

/*
==================================================
基本工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator ===
    0
  ) {

    return {

      numerator: 0,

      denominator: 1
    };
  }


  const divisor =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      divisor,

    denominator:
      denominator /
      divisor
  };
}


function addF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator +

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.numerator *
    b.numerator,

    a.denominator *
    b.denominator
  );
}


function sameF(
  a,
  b
) {

  const first =
    F(
      a.numerator,
      a.denominator
    );


  const second =
    F(
      b.numerator,
      b.denominator
    );


  return (

    first.numerator ===
      second.numerator &&

    first.denominator ===
      second.denominator
  );
}


function isZeroF(
  value
) {

  return (
    value.numerator ===
    0
  );
}


/*
==================================================
數學顯示
==================================================
*/

function fractionHTML(
  fraction
) {

  const value =
    F(
      fraction.numerator,
      fraction.denominator
    );


  if (
    value.denominator ===
    1
  ) {

    return String(
      value.numerator
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    value.numerator <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          value.numerator
        )}

      </span>

      <span class="math-fraction-bottom">

        ${value.denominator}

      </span>

    </span>
  `;
}


function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }


  if (
    exponent ===
    1
  ) {

    return String(
      base
    );
  }


  return `
    ${base}<sup>${exponent}</sup>
  `;
}


function monomialHTML(
  coefficient,
  exponent
) {

  const value =
    F(
      coefficient.numerator,
      coefficient.denominator
    );


  if (
    isZeroF(
      value
    )
  ) {

    return "0";
  }


  const negative =
    value.numerator <
    0;


  const absolute =
    F(
      Math.abs(
        value.numerator
      ),
      value.denominator
    );


  let coefficientText =
    "";


  if (
    exponent ===
    0
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );

  } else if (
    !(
      absolute.numerator ===
      1 &&
      absolute.denominator ===
      1
    )
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );
  }


  return `

    ${
      negative

        ? "−"

        : ""
    }

    ${coefficientText}

    ${
      exponent ===
      0

        ? ""

        : powerHTML(
            "x",
            exponent
          )
    }
  `;
}


/*
==================================================
多項式
==================================================
*/

function normalizePolynomial(
  terms
) {

  const map =
    new Map();


  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );


    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );


    const oldValue =
      map.get(
        exponent
      ) ||
      F(
        0
      );


    map.set(

      exponent,

      addF(
        oldValue,
        coefficient
      )
    );
  }


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        b.exponent -
        a.exponent
    );
}


function polynomialHTML(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  if (
    !normalized.length
  ) {

    return "0";
  }


  let result =
    "";


  normalized.forEach(
    (
      term,
      i
    ) => {

      const coefficient =
        F(
          term.coefficient.numerator,
          term.coefficient.denominator
        );


      const negative =
        coefficient.numerator <
        0;


      const absolute =
        F(
          Math.abs(
            coefficient.numerator
          ),
          coefficient.denominator
        );


      if (
        i ===
        0
      ) {

        result +=
          monomialHTML(
            coefficient,
            term.exponent
          );

      } else {

        result +=

          negative

            ? "－"

            : "＋";


        result +=
          monomialHTML(
            absolute,
            term.exponent
          );
      }
    }
  );


  return result;
}


function bracketPolynomial(
  polynomial
) {

  return `(${polynomialHTML(polynomial)})`;
}


function negatePolynomial(
  polynomial
) {

  return normalizePolynomial(

    polynomial.map(
      term => ({

        exponent:
          term.exponent,

        coefficient:
          F(
            -term.coefficient.numerator,
            term.coefficient.denominator
          )
      }))
  );
}


function multiplyTwoPolynomials(
  first,
  second
) {

  const result =
    [];


  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      result.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  return normalizePolynomial(
    result
  );
}


function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  if (
    a.length !==
    b.length
  ) {

    return false;
  }


  return a.every(
    (
      term,
      i
    ) => {

      return (

        term.exponent ===
          b[
            i
          ].exponent &&

        sameF(
          term.coefficient,
          b[
            i
          ].coefficient
        )
      );
    }
  );
}


/*
==================================================
常用多項式
==================================================
*/

function mono(
  coefficient,
  exponent
) {

  return [

    {

      exponent,

      coefficient:
        F(
          coefficient
        )
    }
  ];
}


function binomial(
  xCoefficient,
  constant
) {

  return normalizePolynomial(
    [

      {

        exponent: 1,

        coefficient:
          F(
            xCoefficient
          )
      },

      {

        exponent: 0,

        coefficient:
          F(
            constant
          )
      }
    ]
  );
}


/*
==================================================
因式答案物件
==================================================
*/

function factorQuestion(
  html,
  factor1,
  factor2,
  explanation,
  label,
  subtype
) {

  return {

    type:
      "factor",

    html:
      `<span class="math-expression">${html}</span>`,

    factor1:
      normalizePolynomial(
        factor1
      ),

    factor2:
      normalizePolynomial(
        factor2
      ),

    explanation,

    label,

    subtype
  };
}


/*
==================================================
模式一
提單項公因式
==================================================
*/


/*
課本型：
ax²＋bx
*/

function makeSimpleMonomialFactor() {

  const common =
    rand(
      2,
      6
    );


  let a;
  let b;


  do {

    a =
      nonZeroRand(
        1,
        7
      );


    b =
      nonZeroRand(
        -9,
        9
      );

  } while (
    gcd(
      Math.abs(
        a
      ),
      Math.abs(
        b
      )
    ) !==
    1
  );


  const firstCoefficient =
    common *
    a;


  const secondCoefficient =
    common *
    b;


  const factor1 =
    mono(
      common,
      1
    );


  const factor2 =
    binomial(
      a,
      b
    );


  const original =
    multiplyTwoPolynomials(
      factor1,
      factor2
    );


  return factorQuestion(

    polynomialHTML(
      original
    ),

    factor1,

    factor2,

    [

      `先觀察各項：
      ${monomialHTML(F(firstCoefficient), 2)}
      和
      ${monomialHTML(F(secondCoefficient), 1)}
      都含有公因式
      ${monomialHTML(F(common), 1)}。`,

      `把公因式拆出來：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${monomialHTML(
          F(common),
          1
        )}

        ‧

        ${monomialHTML(
          F(a),
          1
        )}

        ${
          b >= 0

            ? "＋"

            : "－"
        }

        ${Math.abs(
          b
        )}

        ‧

        x

      </div>`,

      `提出最大的單項公因式：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${monomialHTML(
          F(common),
          1
        )}

        ${bracketPolynomial(
          factor2
        )}

      </div>`,

      `所以答案＝
      ${monomialHTML(
        F(common),
        1
      )}
      ${bracketPolynomial(
        factor2
      )}。`
    ],

    "請提出最大的單項公因式",

    "simple-monomial"
  );
}


/*
課本型：
ax³＋bx²
*/

function makeHigherPowerCommonFactor() {

  const commonCoefficient =
    rand(
      2,
      5
    );


  const commonExponent =
    pick(
      [
        1,
        2
      ]
    );


  let a;
  let b;


  do {

    a =
      nonZeroRand(
        1,
        5
      );


    b =
      nonZeroRand(
        -8,
        8
      );

  } while (
    gcd(
      Math.abs(
        a
      ),
      Math.abs(
        b
      )
    ) !==
    1
  );


  const factor1 =
    mono(
      commonCoefficient,
      commonExponent
    );


  const factor2 =
    binomial(
      a,
      b
    );


  const original =
    multiplyTwoPolynomials(
      factor1,
      factor2
    );


  return factorQuestion(

    polynomialHTML(
      original
    ),

    factor1,

    factor2,

    [

      `先找係數的最大公因數，再找各項共同具有的最低次 x。`,

      `本題最大的單項公因式為
      ${monomialHTML(
        F(commonCoefficient),
        commonExponent
      )}。`,

      `因此：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${monomialHTML(
          F(commonCoefficient),
          commonExponent
        )}

        ${bracketPolynomial(
          factor2
        )}

      </div>`,

      `括號內
      ${polynomialHTML(
        factor2
      )}
      已沒有可以再提出的共同因式，所以完成因式分解。`
    ],

/*

function makeMonomialWithBracketPlus() {

  const outside =

    nonZeroRand(

  /*
  outside*x² + x(x+c)

  */

        〕

      <div class="calculation-box">

        x〔
        ${outside}x
        ＋x＋${insideConstant}
        〕

        ＝

        )

      </div>`,

/*
課本 P118：
x(3x＋1)－x(x＋3)
*/

function makeMonomialWithBracketMinus() {

  let a;
  let b;
  let c;
  let d;


  do {

    a =
      rand(
        2,
        6
      );


    b =
      nonZeroRand(
        -5,
        5
      );


    c =
      rand(
        1,
        a -
        1
      );


    d =
      nonZeroRand(
        -5,
        5
      );

  } while (
    b ===
    d
  );


  /*
  x(ax+b)-x(cx+d)
  = x[(a-c)x+(b-d)]
  */

  const factor1 =
    mono(
      1,
      1
    );


  const factor2 =
    binomial(
      a -
      c,
      b -
      d
    );


  const signB =
    b >=
    0
      ? "＋"
      : "－";


  const signD =
    d >=
    0
      ? "＋"
      : "－";


  const firstBracket =
    `(${a}x${signB}${Math.abs(b)})`;


  const secondBracket =
    `(${c}x${signD}${Math.abs(d)})`;


  const html = `

    x${firstBracket}

    －

    x${secondBracket}
  `;


  return factorQuestion(

    html,

    factor1,

    factor2,

    [

      `兩項都含有單項公因式 x，因此先提出 x。`,

      `

      <div class="calculation-box">

        x${firstBracket}
        －
        x${secondBracket}

        <br>

        ＝

        x〔
        ${firstBracket}
        －
        ${secondBracket}
        〕

      </div>`,

      `去括號並合併同類項：

      <div class="calculation-box">

        ＝x(
        ${a}x
        ${signB}${Math.abs(b)}
        －
        ${c}x
        ${
          d >= 0

            ? `－${Math.abs(d)}`

            : `＋${Math.abs(d)}`
        }
        )

        <br>

        ＝

        x${bracketPolynomial(
          factor2
        )}

      </div>`,

      `所以答案＝
      x${bracketPolynomial(
        factor2
      )}。`
    ],

    "請提出單項公因式並整理",

    "bracket-minus"
  );
}

/*
==================================================
移除分數小標籤
==================================================
*/

function cleanFractionFieldLabels(
  mount
) {

  if (
    !mount
  ) {

    return;
  }


  const clean =
    () => {

      mount
        .querySelectorAll(
          ".expression-input__fraction-field"
        )
        .forEach(
          field => {

            [
              ...field.children
            ]
              .forEach(
                child => {

                  if (
                    child.tagName ===
                    "INPUT"
                  ) {

                    return;
                  }


                  const text =
                    child.textContent
                      ?.trim();


                  if (
                    text ===
                    "分子" ||

                    text ===
                    "分母"
                  ) {

                    child.remove();
                  }
                }
              );
          }
        );
    };


  clean();


  const observer =
    new MutationObserver(
      clean
    );


  observer.observe(
    mount,
    {

      childList: true,

      subtree: true
    }
  );


  setTimeout(
    () => {

      observer.disconnect();

    },
    20000
  );
}

*/

function parseExpressionInput(
  input
) {

  if (
    !input
  ) {

    return {

      valid: false,

      message:
        "答案輸入器尚未準備完成。"
    };
  }


  const result =
    input.validate();


  if (
    !result.valid
  ) {

    return {

      valid: false,

      message:
        result.message ||
        "請把因式輸入完整。"
    };
  }


  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(

              term.coefficient.numerator,

              term.coefficient.denominator
            )
        })
      );


  return {

    valid: true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}

/*
==================================================
判定因式
==================================================
*/

function sameFactorPair(
  user1,
  user2,
  answer1,
  answer2
) {

  /*
  原順序
  */

  const sameOrder =

    samePolynomial(
      user1,
      answer1
    ) &&

    samePolynomial(
      user2,
      answer2
    );


  if (
    sameOrder
  ) {

    return true;
  }


  /*
  交換順序
  */

  const reversed =

    samePolynomial(
      user1,
      answer2
    ) &&

    samePolynomial(
      user2,
      answer1
    );


  if (
    reversed
  ) {

    return true;
  }


  /*
  兩個因式同時變號
  (-A)(-B)=AB
  */

  const negativeAnswer1 =
    negatePolynomial(
      answer1
    );


  const negativeAnswer2 =
    negatePolynomial(
      answer2
    );


  const bothNegativeSameOrder =

    samePolynomial(
      user1,
      negativeAnswer1
    ) &&

    samePolynomial(
      user2,
      negativeAnswer2
    );


  if (
    bothNegativeSameOrder
  ) {

    return true;
  }


  const bothNegativeReversed =

    samePolynomial(
      user1,
      negativeAnswer2
    ) &&

    samePolynomial(
      user2,
      negativeAnswer1
    );


  return bothNegativeReversed;
}


function checkCorrect(
  question,
  answer
) {

  return sameFactorPair(

    answer.value.factor1,

    answer.value.factor2,

    question.factor1,

    question.factor2
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerHTML(
  question
) {

  if (
    samePolynomial(
      question.factor1,
      question.factor2
    )
  ) {

    return `

      ${bracketPolynomial(
        question.factor1
      )}<sup>2</sup>
    `;
  }


  /*
  單項式放前面時不需要括號
  */

  const firstIsMonomial =
    question.factor1.length ===
    1;


  return `

    ${
      firstIsMonomial

        ? polynomialHTML(
            question.factor1
          )

        : bracketPolynomial(
            question.factor1
          )
    }

    ${bracketPolynomial(
      question.factor2
    )}
  `;
}


/*
==================================================
詳解
==================================================
*/

function explanationGuide(
  question
) {

  const guides = {

    "simple-monomial": {
      method:
        "先分成兩件事檢查：係數找最大公因數，文字 x 找所有項共同具有的最低次方。兩者合起來，就是要提出的最大單項公因式。",
      pitfall:
        "不要只提出一部分公因式。例如各項都還能同時再除以同一個數或 x，就代表還沒有提出最大公因式。提出後也要確認括號內已無共同因式。"
    },

    "higher-power": {
      method:
        "係數先找最大公因數；x 的部分則取各項共同出現的最低次方。例如 x³ 與 x² 共同最多只能提出 x²。",
      pitfall:
        "共同的 x 次方要取『較小的次方』，不是較大的次方。若提出太多 x，括號內就會出現負次方，表示做錯了。"
    },

    "bracket-plus": {
      method:
        "先不要急著把括號展開。先看每一大項外面是否都有相同的單項因式；本類題通常先提出 x，再整理括號內。",
      pitfall:
        "提出 x 之後，原本 x(x＋常數) 除以 x 會留下整個 (x＋常數)，不能漏掉括號中的任何一項。"
    },

    "bracket-minus": {
      method:
        "先把共同的 x 提出，再處理括號裡的減法。外面的負號進入第二個括號時，第二個括號內每一項都要變號。",
      pitfall:
        "最常見錯誤是只改第二個括號第一項的符號。記住：減去一個括號，就是括號內每一項都要變號。"
    },

    "common-binomial": {
      method:
        "把重複出現的整個括號當成一個『共同物件』。就像 ab＋cb＝b(a＋c)，只是這裡的 b 換成一整個二項式。",
      pitfall:
        "不要把共同括號拆開後才找公因式；那會把簡單題變複雜。先把完全相同的整個括號提出來。"
    },

    "hidden-one": {
      method:
        "單獨出現的共同括號，其實前面藏著係數 1。先把它看成 1×(共同括號)，兩項的共同因式就會很明顯。",
      pitfall:
        "提出共同括號後，第二項一定要留下 1。若把這個 1 漏掉，乘回去就少了一整項。"
    },

    "two-products": {
      method:
        "乘法前後順序可以交換。先把兩項都改寫成『共同括號 × 另一個括號』，再把共同括號提出。",
      pitfall:
        "提出公因式後，括號內仍可能要去括號、合併同類項。不要看到提出共同括號就立刻停下來。"
    },

    "sign-change": {
      method:
        "先檢查兩個括號是不是互為相反式。若 B＝−A，就先把其中一個改寫成 −A，再把原本的加法一起整理成減法，最後提出 A。",
      pitfall:
        "把相反式改寫時，括號前的負號也會影響原式的運算。只改括號內符號、卻忘記外面的正負號，是這類題最常見的錯誤。"
    },

    "square-common": {
      method:
        "看到 A² 時先想成 A×A。若另一項也含有 A，就能把 A 當作共同因式提出。",
      pitfall:
        "A² 提出一個 A 後，括號裡還要留下另一個 A；不能把 A² 整個拿掉。"
    },

    "difference-basic": {
      method:
        "先確認兩項都能寫成平方，而且中間是減號。辨認成 A²－B² 後，就固定使用 (A＋B)(A－B)。",
      pitfall:
        "平方差一定是『兩個平方相減』。A²＋B² 不能套平方差公式；另外兩個因式必須是一加一減。"
    },

    "difference-application": {
      method:
        "把整個括號視為 A，不必先展開。只要題目是 (某個式子)²－常數平方，就可以直接套 A²－B²。",
      pitfall:
        "不要先把括號平方展開，否則步驟會變長也更容易算錯。套完公式後，最後才整理兩個括號中的常數。"
    },

    "perfect-plus": {
      method:
        "判斷完全平方要檢查三件事：首項是 A²、末項是 B²，而且中間項必須剛好是 ＋2AB。三個條件都符合才可寫成 (A＋B)²。",
      pitfall:
        "只看到首末兩項是平方還不夠；中間項一定要核對 2AB。若中間係數不對，就不是完全平方。"
    },

    "perfect-minus": {
      method:
        "判斷差的平方形式要檢查：首項 A²、末項 B²，中間項剛好是 −2AB。符合後才能寫成 (A－B)²。",
      pitfall:
        "末項仍然是正的 B²；負號是在中間項 −2AB。不要誤寫成 A²－2AB－B²。"
    }
  };


  return (
    guides[
      question.subtype
    ] ||
    {
      method:
        "先辨認題目結構，再選擇提公因式、變號整理或乘法公式。",
      pitfall:
        "完成因式分解後，可以把答案乘回去檢查是否得到原式。"
    }
  );
}


function explanationHTML(
  question,
  userAnswer = "",
  isCorrect = null
) {

  const guide =
    explanationGuide(
      question
    );


  const questionBlock = `

    <div class="explanation-question">

      <div class="explanation-question-title">

        題目｜

      </div>

      <div class="explanation-question-math">

        ${question.html}

      </div>

    </div>
  `;


  const answerBlock =
    userAnswer

      ? `

          <div class="explanation-answer-grid">

            <div class="explanation-answer-card">

              <div class="explanation-answer-label">
                你的答案
              </div>

              <div class="explanation-answer-value">
                ${userAnswer}
              </div>

            </div>

            <div class="explanation-answer-card explanation-answer-card--correct">

              <div class="explanation-answer-label">
                正確答案
              </div>

              <div class="explanation-answer-value">
                ${correctAnswerHTML(question)}
              </div>

            </div>

          </div>
        `

      : "";


  const methodBlock = `

    <div class="explanation-method">

      <strong>
        先想一想｜
      </strong>

      ${guide.method}

    </div>
  `;


  const steps =
    question.explanation
      .map(
        (
          step,
          i
        ) => `

          <div class="explanation-step">

            <strong>

              步驟 ${i + 1}｜

            </strong>

            ${step}

          </div>
        `
      )
      .join("");


  const pitfallBlock = `

    <div class="explanation-pitfall">

      <strong>
        常見錯誤｜
      </strong>

      ${guide.pitfall}

    </div>
  `;


  const finalBlock = `

    <div class="explanation-final">

      <strong>
        最後答案｜
      </strong>

      <span class="explanation-final-answer">
        ${correctAnswerHTML(question)}
      </span>

      ${
        isCorrect === false
          ? "<br><small>把答案乘回去檢查一次，可以確認是否還原成原式。</small>"
          : ""
      }

    </div>
  `;


  return (
    questionBlock +
    answerBlock +
    methodBlock +
    steps +
    pitfallBlock +
    finalBlock
  );
}

/*
==================================================
提交答案
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readFactorAnswer();


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  factorInput1
    ?.setDisabled
    ?.(
      true
    );


  factorInput2
    ?.setDisabled
    ?.(
      true
    );


  factorPairInput
    ?.setDisabled
    ?.(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question,
        answer.display,
        isCorrect
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}

/*

時間
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

        "★★★★★",

      comment:
        "太棒了！你已能熟練辨認並完成這一類因式分解。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再留意最大公因式、變號與公式辨認。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，建議再練習辨認公因式與乘法公式。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從提公因式開始，熟悉後再挑戰變號與乘法公式。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "因式分解成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question,
                      record.userAnswer,
                      false
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );
