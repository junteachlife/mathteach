<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    根式運算大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235126DA'/%3E%3Cstop offset='1' stop-color='%2300897B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='3' width='58' height='58' rx='15' fill='url(%23g)'/%3E%3Cpath d='M12 34h7l5 14L34 17h18' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='44' r='5' fill='%23FFD54F'/%3E%3Cpath d='M46 44h6M49 41v6' stroke='%235126DA' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
  >


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }


    body {

      margin: 0;
      min-height: 100vh;
      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e1
        );
    }


    button,
    input,
    select {

      font-family: inherit;
    }


    .hidden {
      display: none !important;
    }


    .page-shell {

      width: min(100%, 980px);
      margin: 0 auto;
    }


    #commonHeaderMount {
      margin-bottom: 14px;
    }


    .game-card {

      overflow: hidden;

      border:
        1px solid
        #eadcf0;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(15,23,42,.13);
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .concept-strip {

      display: flex;
      justify-content: center;
      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;
      font-weight: 900;
    }


    .screen {
      padding: 22px;
    }


    /*
    ==================================================
    題目數學式
    ==================================================
    */

    .math-expression {

      display:
        inline-flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: .10em;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }


    /*
    ==================================================
    題目根號 SVG
    ==================================================
    */

    .display-radical {

      position: relative;

      display:
        inline-flex;

      align-items: center;

      min-width: 1.15em;
      min-height: 1.55em;

      padding:
        .15em .10em .02em .78em;

      margin:
        0 .04em;

      vertical-align: middle;
    }


    .display-radical-svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .display-radical-path {

      fill: none;

      stroke:
        currentColor;

      stroke-width: 3.6;

      stroke-linejoin: round;
      stroke-linecap: round;

      vector-effect:
        non-scaling-stroke;
    }


    .display-radicand {

      position: relative;

      z-index: 2;

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;

      padding:
        0 .10em 0 .02em;
    }


    /*
    ==================================================
    分數
    ==================================================
    */

    .display-fraction {

      display:
        inline-flex;

      flex-direction: column;

      justify-content: center;
      align-items: stretch;

      min-width: 1.8em;

      margin:
        0 .12em;

      vertical-align: middle;
    }


    .display-fraction-top,
    .display-fraction-bottom {

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        .08em .18em;
    }


    .display-fraction-top {

      border-bottom:
        2.5px solid
        currentColor;
    }


    /*
    ==================================================
    Mode
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 16px;
    }


    .mode-card {

      min-height: 220px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(15,23,42,.11);
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;
      font-weight: 900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;
      font-weight: 900;

      line-height: 1.65;
    }


    /*
    ==================================================
    Status
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(0,1fr)
        );

      gap: 10px;

      margin-bottom: 12px;
    }


    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display: flex;
      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display: flex;
      justify-content: center;

      width: 100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius: 999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ba68c8
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }


    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-weight: 900;
    }


    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        #0f172a;

      font-size:
        clamp(
          27px,
          5vw,
          43px
        );

      line-height: 1.8;

      overflow-x: auto;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }


    /*
    ==================================================
    Number
    ==================================================
    */

    .number-answer {

      display: flex;
      justify-content: center;
    }


    .number-answer input {

      width:
        min(
          250px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;
      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    ★ Expression Answer
    常數 + 根式
    ==================================================
    */

    .expression-editor {

      width:
        min(
          100%,
          850px
        );

      margin:
        0 auto;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      gap: 14px;

      flex-wrap: wrap;
    }


    .expression-piece {

      min-width: 150px;

      padding: 10px;

      border:
        1px solid
        #e5e7eb;

      border-radius: 14px;

      background: white;

      text-align: center;
    }


    .expression-piece-title {

      margin-bottom: 7px;

      color:
        var(--primary-dark);

      font-size: 13px;
      font-weight: 900;
    }


    .constant-piece {

      width: 150px;
    }


    .constant-controls {

      display: flex;

      gap: 6px;
    }


    .constant-sign {

      width: 62px;
      height: 52px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      background: white;

      font-size: 20px;
      font-weight: 900;
    }


    .constant-value {

      width: 76px;
      height: 52px;

      padding: 7px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      font-size: 20px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    ★ 根式作答格
    ==================================================
    */

    .radical-piece {

      width:
        min(
          100%,
          365px
        );
    }


    .radical-piece-controls {

      display: grid;

      grid-template-columns:
        72px 105px minmax(150px,1fr);

      align-items: end;

      gap: 7px;
    }


    .answer-field {

      text-align: center;
    }


    .answer-field label {

      display: block;

      margin-bottom: 5px;

      color:
        var(--muted);

      font-size: 12px;
      font-weight: 900;
    }


    .answer-sign {

      width: 100%;
      height: 52px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      background: white;

      font-size: 20px;
      font-weight: 900;
    }


    .answer-coefficient {

      width: 100%;
      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      font-size: 20px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    SVG answer radical
    ==================================================
    */

    .answer-radical {

      position: relative;

      width: 100%;
      height: 62px;
    }


    .answer-radical svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .answer-radical path {

      fill: none;

      stroke:
        #0f172a;

      stroke-width: 4;

      stroke-linejoin:
        round;

      stroke-linecap:
        round;

      vector-effect:
        non-scaling-stroke;
    }


    .answer-radicand {

      position: absolute;

      left: 43px;
      top: 9px;

      width:
        calc(
          100% - 47px
        );

      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 8px;

      background: white;

      font-size: 20px;
      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    Radical fraction
    ==================================================
    */

    .radical-fraction-stack {

      width:
        min(
          100%,
          560px
        );

      margin:
        0 auto;
    }


    .rf-numerator {

      padding:
        8px 10px 14px;

      border-bottom:
        3px solid
        #334155;
    }


    .rf-numerator-editor {

      display: flex;

      justify-content: center;
      align-items: flex-end;

      gap: 10px;

      flex-wrap: wrap;
    }


    .rf-denominator {

      display: flex;

      flex-direction: column;

      align-items: center;

      padding:
        13px 10px 4px;
    }


    .rf-denominator input {

      width: 130px;
      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 10px;

      font-size: 21px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        15px auto 0;

      padding: 13px;

      max-width: 760px;
      min-height: 60px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;
      font-weight: 900;
    }


    .answer-preview-value {

      display:
        inline-flex;

      align-items: center;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 25px;
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }


    /*
    ==================================================
    詳解專用根號
    不使用 SVG 字串插入，避免 Safari/iPad 把 SVG 屬性顯示成文字
    ==================================================
    */

    .explanation-radical {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      margin: 0 .08em;
      padding: .08em .12em 0 .58em;
      min-height: 1.35em;
      vertical-align: middle;
      font-family: "Cambria Math", "Times New Roman", serif;
    }

    .explanation-radical::before {
      content: "";
      position: absolute;
      left: .08em;
      top: .52em;
      width: .30em;
      height: .52em;
      border-left: 2.4px solid currentColor;
      border-bottom: 2.4px solid currentColor;
      transform: skew(-18deg);
      transform-origin: left bottom;
    }

    .explanation-radical::after {
      content: "";
      position: absolute;
      left: .38em;
      right: 0;
      top: .08em;
      border-top: 2.4px solid currentColor;
    }

    .explanation-radicand {
      position: relative;
      z-index: 1;
      padding: 0 .05em;
      line-height: 1.2;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;
      font-weight: 900;

      line-height: 1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top: 12px;

      padding: 18px;

      border:
        1px solid
        #e4d4ea;

      border-radius: 16px;

      background:
        #faf5fc;

      color:
        #334155;

      line-height: 1.95;
    }


    .explanation-heading {

      display: flex;

      align-items: center;

      gap: 8px;

      margin:
        0 0 14px;

      color:
        var(--primary-dark);

      font-size: 21px;

      font-weight: 900;
    }


    .explanation-question {

      margin-bottom: 14px;

      padding:
        15px 14px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;
    }


    .explanation-question-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }


    .explanation-question-math {

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: auto;

      padding:
        8px 4px;

      color: #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          22px,
          3.4vw,
          30px
        );

      font-weight: 900;

      text-align: center;
    }


    .explanation-answer-compare {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 10px;

      margin-bottom: 14px;
    }


    .answer-compare-card {

      padding:
        12px 13px;

      border-radius: 12px;

      background: white;

      border:
        1px solid
        #e2e8f0;

      text-align: center;
    }


    .answer-compare-card.user-answer {

      border-color:
        #cbd5e1;
    }


    .answer-compare-card.correct-answer {

      border-color:
        #bbf7d0;

      background:
        #f0fdf4;
    }


    .answer-compare-label {

      display: block;

      margin-bottom: 5px;

      color:
        #64748b;

      font-size: 13px;

      font-weight: 900;
    }


    .answer-compare-value {

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size: 20px;

      font-weight: 900;
    }


    .explanation-method {

      margin-bottom: 14px;

      padding:
        13px 14px;

      border:
        1px solid
        #fed7aa;

      border-radius: 12px;

      background:
        #fff7ed;
    }


    .explanation-method strong {
      color: #c2410c;
    }


    .explanation-step {

      margin:
        11px 0;

      padding:
        13px 14px;

      border-left:
        4px solid
        var(--primary);

      border-radius: 11px;

      background: white;
    }


    .explanation-step > strong:first-child {

      color:
        var(--primary-dark);
    }


    .explanation-step-content {

      margin-top: 4px;
    }


    .explanation-math-line {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: .12em;

      margin-top: 5px;

      overflow-x: auto;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 1.08em;
    }


    .explanation-math-line .display-radical {
      flex: 0 0 auto;
    }


    .detail-block {

      display: block;

      width: 100%;

      margin-top: 8px;

      padding:
        10px 12px;

      overflow-x: auto;

      border:
        1px solid
        #d8b4e2;

      border-radius: 10px;

      background:
        #fbf8fc;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size: 1.08em;

      font-weight: 900;

      line-height: 1.9;

      white-space: normal;
    }


    .explanation-tip {

      margin-top: 14px;

      padding:
        13px 14px;

      border:
        1px solid
        #fecdd3;

      border-radius: 12px;

      background:
        #fff1f2;

      color:
        #9f1239;
    }


    .explanation-tip strong {
      color: #be123c;
    }


    .explanation-summary {

      margin-top: 14px;

      padding:
        13px 14px;

      border:

function fallbackGcd(
  a,
  b
) {

  a =
    Math.abs(
      Number(a)
    );


  b =
    Math.abs(
      Number(b)
    );


  while (
    b !==
    0
  ) {

    const temp =
      a % b;


    a = b;

    b = temp;
  }


  return (
    a || 1
  );
}


function fallbackLargestSquareFactor(
  value
) {

  const n =
    Math.abs(
      Number(value)
    );


  if (
    n <=
    1
  ) {

    return 1;
  }


  let largest =
    1;


  for (
    let i = 2;
    i * i <= n;
    i++
  ) {

    const square =
      i * i;


    if (
      n % square ===
      0
    ) {

      largest =
        square;
    }
  }


  return largest;
}


function fallbackSimplifyRadical(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient
    );


  radicand =
    Number(
      radicand
    );


  if (
    radicand ===
    0
  ) {

    return {
      type: "number",
      value: 0
    };
  }


  const largestSquare =
    fallbackLargestSquareFactor(
      radicand
    );


  const outside =
    Math.sqrt(
      largestSquare
    );


  const inside =
    radicand /
    largestSquare;


  const finalCoefficient =
    coefficient *
    outside;


  if (
    inside ===
    1
  ) {

    return {
      type: "number",
      value: finalCoefficient
    };
  }


  return {
    type: "radical",
    coefficient: finalCoefficient,
    radicand: inside
  };
}


const FALLBACK_RADICAL_UTILS = {

  gcd:
    fallbackGcd,

  getLargestSquareFactor:
    fallbackLargestSquareFactor,

  simplifyRadical:
    fallbackSimplifyRadical
};

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  return RU().gcd(
    a,
    b
  );
}

function sqrtDisplay(

) {

  return `

    <span class="display-radical">

      <svg
        class="display-radical-svg"
        viewBox="0 0 100 62"
        preserveAspectRatio="none"

  `;
}


function radicalDisplay(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient
    );


  if (
    radicand ===
    1
  ) {

    return String(
      coefficient
    );
  }


  let prefix =
    "";


  if (
    coefficient ===
    -1
  ) {

    prefix =
      "−";

  } else if (
    coefficient !==
    1
  ) {

    prefix =
      String(
        coefficient
      )
        .replace(
          "-",
          "−"
        );
  }


  return `

    <span class="math-expression">

      ${prefix}

      ${sqrtDisplay(
        String(
          radicand
        )
      )}

    </span>
  `;
}


function fractionDisplay(

  bottom
) {

  return `

  `;
}


function divideDisplay(

  r1,

) {

    radicalDisplay(

}


/*
==================================================
Expression
==================================================
*/

function normalizeRadicalTerms(
  terms
) {

  const map =
    new Map();


  terms.forEach(
    term => {

      if (
        !term.coefficient
      ) {

        return;
      }


      const old =
        map.get(
          term.radicand
        ) ||
        0;


      map.set(
        term.radicand,
        old +
        term.coefficient
      );
    }
  );


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          radicand,
          coefficient
        ]
      ) => ({

        coefficient,

        radicand:
          Number(
            radicand
          )
      })
    )
    .filter(
      term =>
        term.coefficient !==
        0
    )
    .sort(
      (
        a,
        b
      ) =>
        a.radicand -
        b.radicand
    );
}


function expressionDisplay(
  constant,
  radicals
) {

  radicals =
    normalizeRadicalTerms(
      radicals
    );


  const parts =
    [];


  if (
    constant !==
    0
  ) {

    parts.push(
      {

        sign:
          constant < 0
            ? "−"
            : "+",

        html:
          String(
            Math.abs(
              constant
            )
          )
      }
    );
  }


  radicals.forEach(
    term => {

      parts.push(
        {

          sign:
            term.coefficient < 0
              ? "−"
              : "+",

          html:
            radicalDisplay(
              Math.abs(
                term.coefficient
              ),
              term.radicand
            )
        }
      );
    }
  );


  if (
    !parts.length
  ) {

    return "0";
  }


  return `

    <span class="math-expression">

      ${
        parts
          .map(
            (
              part,
              i
            ) => `

              <span>

                ${
                  i === 0 &&
                  part.sign ===
                  "+"

                    ? ""

                    : part.sign
                }

                ${part.html}

              </span>
            `
          )
          .join("")
      }

    </span>
  `;
}

function radicalFractionQuestion(
  html,
  coefficient,
  radicand,
  denominator,
  explanation,
  label,
  options =
    {}
) {

  const divisor =
    gcd(
      Math.abs(
        coefficient
      ),
      Math.abs(
        denominator
      )
    );


  coefficient /=
    divisor;


  denominator /=
    divisor;


  if (
    denominator <
    0
  ) {

    coefficient *=
      -1;

    denominator *=
      -1;
  }


  return applyQuestionOptions(
    {

      type:
        "radicalFraction",

      html,

      coefficient,

      radicand,

      denominator,

      explanation,

      label
    },
    options
  );
}

      simplifyRadicalData(
        coef,
        a * c
      );


    const radicals =
      [];


    let constant =
      0;


    [
      first,
      second
    ]
      .forEach(
        result => {

          if (
            result.type ===
            "number"
          ) {

            constant +=
              result.value;

          } else {

            radicals.push(
              result
            );
          }
        }
      );


    const finalAnswer =
      expressionDisplay(
        constant,
        radicals
      );


    return expressionQuestion(

      `
        <span class="math-expression">
          −${coef}
          ${sqrtDisplay(a)}
          <span>(</span>
          ${sqrtDisplay(b)}
          <span>−</span>
          ${sqrtDisplay(c)}
          <span>)</span>
        </span>
      `,

      constant,

      radicals,

      [

        `先使用分配律。括號外是負的 ${coef}${sqrtDisplay(a)}，所以第二項「負×負」會變成正：
        <span class="detail-block">
          −${coef}${sqrtDisplay(a)}×${sqrtDisplay(b)}
          ＋${coef}${sqrtDisplay(a)}×${sqrtDisplay(c)}
        </span>`,

        `做第一個根式乘法：
        <span class="detail-block">
          −${coef}${sqrtDisplay(a)}×${sqrtDisplay(b)}
          ＝−${coef}${sqrtDisplay(`${a}×${b}`)}
          ＝−${coef}${sqrtDisplay(a*b)}
        </span>`,

        `再做第二個根式乘法：
        <span class="detail-block">
          ${coef}${sqrtDisplay(a)}×${sqrtDisplay(c)}
          ＝${coef}${sqrtDisplay(`${a}×${c}`)}
          ＝${coef}${sqrtDisplay(a*c)}
        </span>`,

        `把兩個根式各自化成最簡形式：
        <span class="detail-block">
          −${coef}${sqrtDisplay(a*b)}
          ＝${simplifiedDataDisplay(first)}
          <br>
          ${coef}${sqrtDisplay(a*c)}
          ＝${simplifiedDataDisplay(second)}
        </span>`,

        `最後再檢查能不能合併同類方根，整理得到：
        <span class="detail-block">
          ${finalAnswer}
        </span>`
      ],

      "請利用分配律計算並化簡",

      {
        method:
          "先做分配律，再把每一個根式乘積化簡；最後才判斷是否出現同類方根可以合併。",
        pitfall:
          "括號外有負號時最容易漏掉變號：−A(B−C)＝−AB＋AC。",
        summary:
          `最後答案：${finalAnswer}`
      }
    );
  }


  /*
  (√a - √b)(√c + 1)
  */

  const [
    a,
    b,
    c
  ] =
    pick(
      [
        [3,2,6],
        [5,2,10],
        [7,3,6],
        [6,2,3]
      ]
    );


  const results =
    [
      simplifyRadicalData(
        1,
        a * c
      ),
      {
        type: "radical",
        coefficient: 1,
        radicand: a
      },
      simplifyRadicalData(
        -1,
        b * c
      ),
      {
        type: "radical",
        coefficient: -1,
        radicand: b
      }
    ];


  let constant =
    0;


  const radicals =
    [];


  results.forEach(
    result => {

      if (
        result.type ===

  const finalAnswer =

  return expressionQuestion(

        ${sqrtDisplay(a)}
        <span>−</span>
        ${sqrtDisplay(b)}
        <span>)</span>
        <span>(</span>
        ${sqrtDisplay(c)}
        <span>＋1)</span>

/*
--------------------------------------------------
B
例10：乘除混合
--------------------------------------------------
*/

function makeMode4B() {

  /*
  ==================================================
  單一根式分母的乘除混合題

  解題方向統一採用課本式：
  1. 分子、分母同乘分母的根式
  2. 先讓分母有理化成整數
  3. 分子再利用分配律做根式乘法
  4. 化成最簡根式
  5. 最後約分整理
  ==================================================
  */

  const [
    r,
    s
  ] =
    pick(
      [
        [2,3],
        [2,5],
        [2,7],
        [3,2],
        [3,5],
        [3,7],
        [5,2],
        [5,3],
        [5,7]
      ]
    );


  const a =
    rand(
      2,
      5
    );


  const rs =
    r * s;


  const originalNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a,
        rs
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

    </span>
  `;


  const originalFraction =
    fractionDisplay(
      originalNumerator,
      sqrtDisplay(s)
    );


  const rationalizingFactor =
    fractionDisplay(
      sqrtDisplay(s),
      sqrtDisplay(s)
    );


  const multipliedNumerator = `

    <span class="math-expression">

      <span>(</span>

      ${radicalDisplay(
        a,
        rs
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

      <span>)</span>

      ${sqrtDisplay(s)}

    </span>
  `;


  const distributedNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a,
        rs
      )}

      <span>×</span>

      ${sqrtDisplay(s)}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

      <span>×</span>

      ${sqrtDisplay(s)}

    </span>
  `;


  const rootProductNumerator = `

    <span class="math-expression">

      ${a}

      ${sqrtDisplay(
        rs * s
      )}

      <span>＋</span>

      ${s}

      ${sqrtDisplay(rs)}

    </span>
  `;


  const simplifiedNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a * s,
        r
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        rs
      )}

    </span>
  `;


  const finalAnswer =
    expressionDisplay(
      0,
      [
        {
          coefficient:
            a,

          radicand:
            r
        },

        {
          coefficient:
            1,

          radicand:
            rs
        }
      ]
    );


  return expressionQuestion(

    originalFraction,

    0,

    [
      {
        coefficient:
          a,

        radicand:
          r
      },

      {
        coefficient:
          1,

        radicand:
          rs
      }
    ],

    [

      `分母是 ${sqrtDisplay(s)}，為了使分母成為整數，分子、分母同乘 ${sqrtDisplay(s)}。`,

      `
        ${originalFraction}
        <span style="margin:0 .35em;">×</span>
        ${rationalizingFactor}
      `,

      `先計算分母：${sqrtDisplay(s)}×${sqrtDisplay(s)}＝${s}。`,

      `分子整體同乘 ${sqrtDisplay(s)}：${multipliedNumerator}。`,

      `利用分配律將分子乘開：${distributedNumerator}。`,

      `做根式乘法：${rootProductNumerator}。`,

      `因為 ${sqrtDisplay(rs * s)}＝${s}${sqrtDisplay(r)}，所以分子化簡為 ${simplifiedNumerator}。`,

      `因此原式＝${fractionDisplay(simplifiedNumerator, String(s))}。`,

      `分子兩項都有公因數 ${s}，與分母 ${s} 約分後，得到 ${finalAnswer}。`,

      `最後檢查：各根式都已是最簡根式；若兩項不是同類方根，就不能再合併。`
    ],

    "請計算並化為最簡根式",

    {
      method:
        "分母只有一個根式時，先用同一個根式把分母有理化，再處理分子的分配律與根式乘法，最後約分。",
      pitfall:
        "不要只乘分母；分子、分母必須同乘。分母有理化後，分子還要完整乘開並化成最簡根式。",
      summary:
        `最後答案：${finalAnswer}`
    }
  );
}

/*

設計兩類：

2. √2/(√6+√5) 型
--------------------------------------------------
*/

function makeMode4E() {

  if (
    Math.random() <
    .5
  ) {

    /*
    d / (√a - b)
    a-b² = d
    */

    const [
      a,
      b
    ] =
      pick(
        [
          [7,2],
          [11,3],
          [13,3],
          [6,2]
        ]
      );


    const d =
      a -
      b * b;


    const conjugate = `
      <span class="math-expression">
        ${sqrtDisplay(a)}
        <span>＋</span>
        ${b}
      </span>
    `;


    const denominatorExpression = `
      <span class="math-expression">
        ${sqrtDisplay(a)}
        <span>−</span>
        ${b}
      </span>
    `;


    const finalAnswer =
      expressionDisplay(
        b,
        [
          {
            coefficient: 1,
            radicand: a
          }
        ]
      );


    return expressionQuestion(

      fractionDisplay(
        String(d),
        denominatorExpression
      ),

      b,

      [
        {
          coefficient: 1,
          radicand: a
        }
      ],

      [

        `分母是「根式－整數」，要利用它的共軛式「根式＋整數」來有理化。共軛式是：
        <span class="detail-block">
          ${conjugate}
        </span>`,

        `分子、分母同乘共軛式，原式的值不變：
        <span class="detail-block">
          ${fractionDisplay(String(d),denominatorExpression)}
          ×
          ${fractionDisplay(conjugate,conjugate)}
        </span>`,

        `先算分母。利用平方差公式：
        <span class="detail-block">
          (${sqrtDisplay(a)}－${b})(${sqrtDisplay(a)}＋${b})
          ＝(${sqrtDisplay(a)})²－${b}²
          ＝${a}－${b*b}
          ＝${d}
        </span>`,

        `再算分子：
        <span class="detail-block">
          ${d}(${sqrtDisplay(a)}＋${b})
          ＝${d}${sqrtDisplay(a)}＋${d*b}
        </span>`,

        `因此原式：
        <span class="detail-block">
          ${fractionDisplay(
            `<span class="math-expression">${d}${sqrtDisplay(a)}<span>＋</span>${d*b}</span>`,
            String(d)
          )}
        </span>`,

        `分子每一項都有公因數 ${d}，和分母 ${d} 約掉後：
        <span class="detail-block">
          ${sqrtDisplay(a)}＋${b}
          ＝${finalAnswer}
        </span>`
      ],

      "請利用平方差公式有理化分母",

      {
        method:
          "分母是 A－B 時，乘以共軛式 A＋B，讓分母變成 A²－B²；這是平方差公式在分母有理化中的應用。",
        pitfall:
          "共軛式只改中間符號，其他部分完全相同；而且必須分子、分母同乘。",
        summary:
          `最後答案：${finalAnswer}`
      }
    );
  }


  /*
  √n/(√a+√b)
  */

  const [
    n,
    a,
    b
  ] =
    pick(
      [
        [2,6,5],
        [3,7,6],
        [2,5,3]
      ]
    );


  const denominator =
    a - b;


  const first =
    simplifyRadicalData(
      1,
      n * a
    );


  const second =
    simplifyRadicalData(
      -1,
      n * b
    );


  let constant =
    0;


  const radicals =
    [];


  [
    first,
    second
  ]
    .forEach(
      result => {

        if (
          result.type ===
          "number"
        ) {

          constant +=
            result.value;

        } else {

          radicals.push(
            {
              coefficient:
                result.coefficient /
                denominator,
              radicand:
                result.radicand
            }
          );
        }
      }
    );


  if (
    denominator !==
    1
  ) {

    return makeMode4E();
  }


  const originalDenominator = `
    <span class="math-expression">
      ${sqrtDisplay(a)}
      <span>＋</span>
      ${sqrtDisplay(b)}
    </span>
  `;


  const conjugate = `
    <span class="math-expression">
      ${sqrtDisplay(a)}
      <span>−</span>
      ${sqrtDisplay(b)}
    </span>
  `;


  const firstAbs =
    first.type ===
    "number"
      ? String(first.value)
      : radicalDisplay(
          first.coefficient,
          first.radicand
        );


  const secondPositive =
    second.type ===
    "number"
      ? String(
          Math.abs(
            second.value
          )
        )
      : radicalDisplay(
          Math.abs(
            second.coefficient
          ),
          second.radicand
        );


  const finalAnswer =
    expressionDisplay(
      constant,
      radicals
    );


  return expressionQuestion(

    fractionDisplay(
      sqrtDisplay(n),
      originalDenominator
    ),

    constant,

    radicals,

    [

      `分母是兩個根式相加，使用共軛式把「＋」改成「－」：
      <span class="detail-block">
        共軛式＝${conjugate}
      </span>`,

      `分子、分母同乘共軛式：
      <span class="detail-block">
        ${fractionDisplay(sqrtDisplay(n),originalDenominator)}
        ×
        ${fractionDisplay(conjugate,conjugate)}
      </span>`,

      `先算分母，直接使用平方差公式：
      <span class="detail-block">
        (${sqrtDisplay(a)}＋${sqrtDisplay(b)})(${sqrtDisplay(a)}－${sqrtDisplay(b)})
        ＝(${sqrtDisplay(a)})²－(${sqrtDisplay(b)})²
        ＝${a}－${b}
        ＝${denominator}
      </span>`,

      `再算分子，先使用分配律：
      <span class="detail-block">
        ${sqrtDisplay(n)}(${sqrtDisplay(a)}－${sqrtDisplay(b)})
        ＝${sqrtDisplay(n*a)}－${sqrtDisplay(n*b)}
      </span>`,

      `把分子中的根式化成最簡根式：
      <span class="detail-block">
        ${sqrtDisplay(n*a)}＝${firstAbs}
        <br>
        ${sqrtDisplay(n*b)}＝${secondPositive}
      </span>`,

      `因為分母 ${denominator}＝1，所以不需要再除；整理分子的正負號後：
      <span class="detail-block">
        ${finalAnswer}
      </span>`
    ],

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}

  stopTimer(

  startTime =
    Date.now();


  elapsed =

  timerId =
    setInterval(
      () => {

          Math.floor(

              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed

      500
    );

/*
==================================================
依照學生填答順序顯示 Expression
判分仍會另外標準化，因此交換根式順序也能判對。
==================================================
*/

function expressionDisplayInInputOrder(
  constant,
  radicals
) {

  const parts = [];

  if (constant !== 0) {
    parts.push({
      sign: constant < 0 ? "−" : "+",
      html: String(Math.abs(constant))
    });
  }

  radicals.forEach(term => {
    if (!term.coefficient) return;
    parts.push({
      sign: term.coefficient < 0 ? "−" : "+",
      html: radicalDisplay(Math.abs(term.coefficient), term.radicand)
    });
  });

  if (!parts.length) return "0";

  return `
    <span class="math-expression">
      ${parts.map((part, i) => `
        <span>
          ${i === 0 && part.sign === "+" ? "" : part.sign}
          ${part.html}
        </span>
      `).join("")}
    </span>
  `;
}


/*
==================================================
讀取 Expression UI
==================================================
*/

function readExpressionInputs(
  question
) {

  let constant =
    0;


  if (
    question.constant !==
    0
  ) {

    const raw =
      $("expr-constant")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        raw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請將整數項填寫完整。"
      };
    }


    constant =
      Number(
        $("expr-constant-sign")
          .value
      ) *
      Number(
        raw
      );
  }


  const radicals =
    [];


  for (
    let i = 0;

    i <
    question.radicals.length;

    i++
  ) {

    const coefficientRaw =
      $(
        `expr-coefficient-${i}`
      )
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $(
        `expr-radicand-${i}`
      )
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把所有根式答案填寫完整。"
      };
    }


    const coefficient =
      Number(
        $(
          `expr-sign-${i}`
        ).value
      ) *
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    if (
      coefficient ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "根號外係數不可為 0。"
      };
    }


    if (
      radicand <=
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號內必須是大於 1 的正整數。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${radicand} 還可以化簡，請先整理成最簡根式。`
      };
    }


    radicals.push(
      {

        coefficient,

        radicand
      }
    );
  }


  /*
  同類方根不能分開輸入
  */

  const roots =
    radicals.map(
      term =>
        term.radicand
    );


  if (
    new Set(
      roots
    ).size !==
    roots.length
  ) {

    return {

      valid:
        false,

      message:
        "⚠️ 還有同類方根尚未合併，請先自行整理答案。"
    };
  }


  return {

    valid:
      true,

    constant,

    // 判分用：標準化後依根號內排序
    radicals:
      normalizeRadicalTerms(
        radicals
      ),

    // 顯示用：保留學生實際填答順序
    display:
      expressionDisplayInInputOrder(
        constant,
        radicals
      )
  };
}

            );


          $(id)
            .addEventListener(
              "change",
              update
            );
        }
      );
  }


  question.radicals
    .forEach(
      (
        term,
        i
      ) => {

        [
          `expr-sign-${i}`,
          `expr-coefficient-${i}`,
          `expr-radicand-${i}`
        ]
          .forEach(
            id => {

              $(id)
                .addEventListener(
                  "input",
                  update
                );


              $(id)
                .addEventListener(
                  "change",
                  update
                );
            }
          );
      }
    );


  setTimeout(
    () => {

      if (
        question.constant !==
        0
      ) {

        $("expr-constant")
          ?.focus();

      } else {

        $("expr-radicand-0")
          ?.focus();
      }

    },
    0
  );
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  /*
  Number
  */

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  Radical
  */

  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把根式答案填寫完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  /*
  Radical Fraction
  */

  if (
    question.type ===
    "radicalFraction"
  ) {

    const coefficientRaw =
      $("rf-coefficient")
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $("rf-radicand")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("rf-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      ) ||
      !/^\d+$/.test(
        denominatorRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子與分母填寫完整。"
      };
    }


    const coefficient =
      Number(
        $("rf-sign")
          .value
      ) *
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${radicand} 還可以化簡。`
      };
    }


    if (
      gcd(
        Math.abs(
          coefficient
        ),
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 分數還可以約分，請先整理成最簡形式。"
      };
    }


    return {

      valid:
        true,

      coefficient,

      radicand,

      denominator,

      display:
        fractionDisplay(

          radicalDisplay(
            coefficient,
            radicand
          ),

          denominator
        )
    };
  }


  /*
  Expression
  */

  return readExpressionInputs(
    question
  );
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return (

      answer.coefficient ===
        question.coefficient &&

      answer.radicand ===
        question.radicand &&

      answer.denominator ===
        question.denominator
    );
  }


  if (
    answer.constant !==
    question.constant
  ) {

    return false;
  }


  if (
    answer.radicals.length !==
    question.radicals.length
  ) {

    return false;
  }


  return answer.radicals
    .every(
      (
        term,
        i
      ) =>

        term.coefficient ===
          question.radicals[
            i
          ].coefficient &&

        term.radicand ===
          question.radicals[
            i
          ].radicand
    );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return radicalDisplay(
      question.coefficient,
      question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return fractionDisplay(

      radicalDisplay(
        question.coefficient,
        question.radicand
      ),

      question.denominator
    );
  }


  return expressionDisplay(
    question.constant,
    question.radicals
  );
}


/*
==================================================
解析
==================================================
*/

function formatExplanationMath(
  step
) {

  const source =
    String(
      step ??
      ""
    );


  if (
    source.includes(
      "<"
    )
  ) {

    return `
      <div class="explanation-step-content">
        ${source}
      </div>
    `;
  }


  let escaped =
    source
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /\s*\n\s*/g,
        " "
      )
      .replace(
        /\s{2,}/g,
        " "
      )
      .trim();


  escaped =
    escaped.replace(
      /√\s*\((\d+)\)/g,
      (
        _,
        n
      ) =>
        sqrtDisplay(
          `(${n})`
        )
    );


  escaped =
    escaped.replace(
      /√\s*(\d+)/g,
      (
        _,
        n
      ) =>
        sqrtDisplay(
          String(n)
        )
    );


  return `
    <div class="explanation-step-content">
      ${escaped}
    </div>
  `;
}


function explanationHTML(
  question,
  userAnswer =
    "",
  isCorrect =
    null
) {

  const questionBlock = `

    <div class="explanation-heading">
      📘 完整詳解
    </div>

    <div class="explanation-question">

      <div class="explanation-question-title">
        題目
      </div>

      <div class="explanation-question-math">
        ${question.html}
      </div>

    </div>
  `;


  const compareBlock =
    userAnswer

      ? `

          <div class="explanation-answer-compare">

            <div class="answer-compare-card user-answer">

              <span class="answer-compare-label">
                你的答案
              </span>

              <span class="answer-compare-value">
                ${userAnswer}
              </span>

            </div>

            <div class="answer-compare-card correct-answer">

              <span class="answer-compare-label">
                ${
                  isCorrect ===
                  true
                    ? "答案確認"
                    : "正確答案"
                }
              </span>

              <span class="answer-compare-value">
                ${correctAnswerText(question)}
              </span>

            </div>

          </div>
        `

      : "";


  const methodBlock =
    question.method

      ? `

          <div class="explanation-method">

            <strong>
              先想一想｜
            </strong>

            ${question.method}

          </div>
        `

      : "";


  const stepsBlock =
    question.explanation
      .map(
        (
          step,
          i
        ) => `

          <div class="explanation-step">

            <strong>
              步驟 ${i + 1}｜
            </strong>

            ${formatExplanationMath(step)}

          </div>
        `
      )
      .join(
        ""
      );


  const pitfallBlock =
    question.pitfall

      ? `

          <div class="explanation-tip">

            <strong>
              ⚠️ 常見錯誤｜
            </strong>

            ${question.pitfall}

          </div>
        `

      : "";


  const summaryContent =
    question.summary ||
    `最後答案：${correctAnswerText(question)}`;


  const summaryBlock = `

    <div class="explanation-summary">
      ✅ ${summaryContent}
    </div>
  `;


  return (
    questionBlock +
    compareBlock +
    methodBlock +
    stepsBlock +
    pitfallBlock +
    summaryBlock
  );
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question,
        answer.display,
        isCorrect
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length - 1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經能靈活處理根式四則運算。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意同類方根與有理化細節。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再加強根式化簡與乘法公式。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從根式乘法、除法與同類方根開始複習。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firebase
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  try {

    const saveGameScore =
      await getSaveGameScore();


    if (
      typeof saveGameScore !==
      "function"
    ) {

      status.textContent =
        "ℹ️ 成績模組目前未載入，遊戲結果仍可正常查看。";


      status.style.color =
        "#b45309";


      return;
    }


    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


  } catch (
    error
  ) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">


                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>


                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question,
                      record.userAnswer,
                      false
                    )}

                  </div>


                </article>

              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

==================================================
事件

*/

  );

  );

  );

    "click",
    () => {

        "start-screen"
      );
    }
  );


$("again-button")

    "click",
    () =>
      startGame(
        mode
      )
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
初始化
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );


    const missingRadicalInput =
      typeof window.RadicalInput !==
      "function" ||
      !window.RadicalInputUtils;


    $("dependency-warning")
      ?.classList
      .toggle(
        "hidden",
        !missingRadicalInput
      );
  }
);


showOnly(
  "start-screen"
);
