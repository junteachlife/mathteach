<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-1 連比｜生活有解．心中有數</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="../css/scratchpad.css"><style>
 :root{--primary:#136a89;--soft:#ecf7fa;--text:#203247;--muted:#62758a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e6f5fc,#fff8e9);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--text);padding:16px;min-height:100vh}button,input{font:inherit}button{cursor:pointer}[hidden]{display:none!important}.shell{max-width:1000px;margin:auto}.hero,.screen{background:white;border:1px solid #dce9ef;border-radius:26px;box-shadow:0 12px 32px #193b561c;margin:16px 0;padding:clamp(20px,4vw,32px)}.hero{border-top:8px solid var(--primary)}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#17609d;font-weight:700}h1{font-size:clamp(27px,5vw,38px);margin:16px 0 8px;color:var(--primary)}.sub,.small{color:var(--muted);line-height:1.7}.heading{font-size:22px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:20px}.mode-card{border:2px solid #dce7ef;border-radius:20px;padding:20px;background:#fff;text-align:left;min-height:190px;transition:transform .15s,border-color .15s}.mode-card:hover,.mode-card:focus-visible{transform:translateY(-3px);border-color:var(--primary)}.mode-card h3{color:var(--primary);font-size:20px;margin:14px 0 8px}.mode-card p{line-height:1.65;color:#40526a;margin:0 0 12px}.mode-tag{display:inline-block;background:#e4f3f8;color:var(--primary);border-radius:99px;padding:6px 11px;font-weight:800;font-size:13px}.example{font-size:14px;color:#5e6e7d;background:#f5f9fd;border-radius:10px;padding:10px}.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stat{padding:12px 16px;background:#f2f7fa;border-radius:12px;color:#365068;font-weight:700}.stat strong{color:var(--primary)}.timer{font-size:22px}.bar{height:10px;background:#e6edf4;border-radius:99px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;background:var(--primary);transition:width .2s}.question-card{border:2px solid #dce9ee;border-radius:20px;padding:clamp(20px,5vw,32px);margin:22px 0;background:#fcfeff}#question{font-size:clamp(22px,4vw,30px);line-height:1.7;min-height:92px}#answer{width:min(100%,480px);border:2px solid #afcbd9;border-radius:12px;padding:14px;font-size:22px}#answer:focus{outline:3px solid #bde6f1}.choice{display:block;width:100%;margin:9px 0;text-align:left;padding:15px;border-radius:12px;background:#eef5fa;color:#234b65;border:1px solid #b5d0e1}.choice.right{background:#d6f5df;border-color:#67c687}.choice.wrong{background:#ffe5e3;border-color:#e99a96}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:12px;background:var(--primary);color:white;font-weight:800;padding:13px 19px}.btn.secondary{background:#edf4f9;color:#23516a}.btn:disabled{opacity:.55}#feedback{font-size:17px;line-height:1.7;min-height:54px}.review{background:#f8fafc;border-left:5px solid #d99065;padding:15px;margin:12px 0;border-radius:8px;line-height:1.65}#finalScore{font-size:54px;font-weight:900;color:var(--primary)}#save{font-weight:700}.result-head{display:flex;align-items:baseline;gap:12px}@media(max-width:600px){body{padding:8px}.hero,.screen{padding:18px}.mode-card{min-height:0}}
 </style></head><body data-game="continued-ratio"><main class="shell"><header class="hero"><nav><a href="../index.html">🏠 回首頁</a><a href="../my-scores.html">📊 我的成績</a><a href="../leaderboard.html">🏆 排行榜</a></nav><h1 id="title">1-1 連比大挑戰</h1><p class="sub">九年級上學期 · 選擇模式 · 10 題挑戰 · 即時解析與錯題回顧</p><p id="status" class="small">正在確認登入狀態…</p><button id="sound" type="button" class="btn secondary">🔊 音效開</button></header><section id="modes" class="screen"><h2 class="heading">🎮 選擇挑戰模式</h2><p class="small">每個模式 10 題。完成後可查看成績和錯題解析。</p><div id="modeList" class="grid"><button type="button" class="mode-card" data-mode="merge"><span class="mode-tag">模式 1 · 10 題</span><h3>連比合併</h3><p>統一共同項，合成三數連比</p><div class="example">例如：甲：乙＝2：3，乙：丙＝6：5</div></button>
<button type="button" class="mode-card" data-mode="parts"><span class="mode-tag">模式 2 · 10 題</span><h3>按比例分配</h3><p>由總量及連比求各部分的量</p><div class="example">例如：依 2：3：4 分配 90 元</div></button>
<button type="button" class="mode-card" data-mode="inverse"><span class="mode-tag">模式 3 · 10 題</span><h3>反比例與幾何</h3><p>處理等面積三角形的底與高</p><div class="example">例如：底比 2：3：4，求高比</div></button>
<button type="button" class="mode-card" data-mode="mixed"><span class="mode-tag">模式 4 · 10 題</span><h3>全節綜合</h3><p>交錯練習上述重點</p><div class="example">例如：10 題綜合測驗</div></button></div></section><section id="playing" class="screen" hidden><div class="topbar"><span class="stat">模式：<strong id="activeMode">—</strong></span><span class="stat" id="progress">第 1／10 題</span><span class="stat timer">⏱️ <strong id="clock">15:00</strong></span></div><div class="bar"><span id="progressBar" style="width:0"></span></div><div class="question-card"><div class="mode-tag">請閱讀題目後作答</div><div id="question"></div></div><form id="form"><div id="choices"></div><input id="answer" type="text" inputmode="text" autocomplete="off" aria-label="你的答案" placeholder="輸入答案，例如 2:3:4 或 3/5"><div class="controls"><button id="submit" class="btn" type="submit">提交答案（Enter）</button><button id="next" class="btn" type="button" hidden>下一題</button></div></form><div id="feedback" aria-live="polite"></div></section><section id="results" class="screen" hidden><h2>🏅 本次挑戰結果</h2><div class="result-head"><span id="finalScore">0</span><strong>分</strong></div><p id="summary"></p><p id="save" aria-live="polite"></p><div class="controls"><button id="again" class="btn" type="button">🔄 再挑戰一次</button><button id="choose" class="btn secondary" type="button">選擇其他模式</button></div><h3>📝 錯題回顧與解析</h3><div id="review"></div></section></main><script src="../js/scratchpad.js"></script><script src="../js/scratchpad-template.js"></script><script src="../js/sound-manager.js"></script><script type="module">
// 九上第一章：每題均由參數計算答案，避免固定題庫背答案。
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const Q=(prompt,answer,explain,choices)=>({prompt,answer:String(answer),explain,choices:choices?.map(String)});
const ratio=(a,b)=>{const d=gcd(a,b);return `${a/d}:${b/d}`};
const grade9={
continuedRatio:{title:'1-1 連比',modes:{merge:'連比合併',parts:'按比例分配',inverse:'反比例與幾何',mixed:'綜合挑戰'},factories:{
    merge:()=>{let a=R(2,7),b=R(2,7),c=R(2,7),k=R(2,5),h=R(2,5);return Q(`若甲：乙＝${a*k}：${b*k}，乙：丙＝${b*h}：${c*h}，求甲：乙：丙。`,`${a}:${b}:${c}`,`先將兩組的「乙」統一；化簡後為 ${a}：${b}：${c}。`)},
    parts:()=>{let a=R(2,6),b=R(2,6),c=R(2,6),d=gcd(gcd(a,b),c),unit=R(3,12);a/=d;b/=d;c/=d;return Q(`三人分得 ${unit*(a+b+c)} 元，分配比例為 ${a}：${b}：${c}，第二人可得幾元？`,b*unit,`每份 ${unit} 元，第二人得 ${b}×${unit}＝${b*unit} 元。`)},
    inverse:()=>{let a=R(2,7),b=R(2,7),c=R(2,7);return Q(`三個等面積三角形的底邊長比為 ${a}：${b}：${c}，高的比為何？`,`${b*c/gcd(gcd(b*c,a*c),a*b)}:${a*c/gcd(gcd(b*c,a*c),a*b)}:${a*b/gcd(gcd(b*c,a*c),a*b)}`,`面積相同時，高與底成反比；先寫 1/${a}：1/${b}：1/${c}，再通分。`)}
  }}
};
import {auth} from '../js/firebase-config.js';
import {saveGameScore} from '../js/scores.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const gameId=document.body.dataset.game,game=grade9[({ 'continued-ratio':'continuedRatio','proportional-segment':'proportionalSegments','similar-polygon':'similarPolygons','similar-triangle':'similarityTrig','point-line-circle':'pointLineCircle','central-inscribed-angle':'centralInscribedAngle' })[gameId]];
if(!game)throw Error('無效的九上遊戲 ID');
window.MathGameSessionMeta={gameId,chapter:game.title.split(' ')[0],title:game.title,modes:Object.fromEntries(Object.entries(game.modes).map(([modeId,name])=>[modeId,{name,count:10}]))};
const $=id=>document.getElementById(id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let modeId='',items=[],position=0,correct=0,wrong=0,combo=0,maxCombo=0,started=0,locked=false,remaining=0,timer=null,mistakes=[],soundOn=true;
function beep(kind){if(!soundOn)return;const manager=window.MathGameSound;const action=kind==='correct'?'playCorrect':kind==='wrong'?'playWrong':'playCountdown';if(manager&&typeof manager[action]==='function'){try{Promise.resolve(manager[action]()).catch(()=>{})}catch{}}}
function makeQuestion(key){let q=game.factories[key]();if(!q||!q.answer)throw Error('題目資料不完整');return q}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function setScreen(s){for(const id of ['modes','playing','results'])$(id).hidden=id!==s;if(s==='playing')window.showGameScratchpadButton?.();else window.hideGameScratchpadButton?.()}
function normalize(s){return String(s).trim().replace(/[：∶]/g,':').replace(/[／]/g,'/').replace(/\s+/g,'').replace(/−/g,'-').toLowerCase()}
function rational(s){let value=normalize(s);if(/^[-+]?\d+(?:\.\d+)?$/.test(value))return Number(value);let m=value.match(/^(-?\d+)\/(-?\d+)$/);return m&&Number(m[2])!==0?Number(m[1])/Number(m[2]):null}
function equal(input,answer){let a=normalize(input),b=normalize(answer);if(a===b)return true;let x=rational(a),y=rational(b);if(x!==null&&y!==null)return Math.abs(x-y)<1e-10;return false}
function render(){locked=false;let q=items[position];$('activeMode').textContent=game.modes[modeId];$('progress').textContent=`第 ${position+1}／${items.length} 題 · 答對 ${correct} · 連擊 ${combo}`;$('progressBar').style.width=`${position/items.length*100}%`;$('question').textContent=q.prompt;$('answer').value='';$('answer').hidden=!!q.choices;$('choices').replaceChildren();$('feedback').textContent='';$('next').hidden=true;$('submit').hidden=false;$('submit').disabled=false;if(q.choices){for(const value of shuffle([...q.choices])){let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.onclick=()=>submit(value);$('choices').append(b)}}else $('answer').focus()}
function submit(value){if(locked)return;let q=items[position],v=value??$('answer').value;if(!normalize(v)){$('feedback').textContent='請先作答。';return}locked=true;let ok=equal(v,q.answer);if(ok){correct++;combo++;maxCombo=Math.max(combo,maxCombo)}else{wrong++;combo=0;mistakes.push({q,answer:String(v)})}beep(ok?'correct':'wrong');$('feedback').innerHTML=`<strong>${ok?'✅ 答對！':'❌ 答錯，正解：'+escape(q.answer)}</strong><p>${escape(q.explain)}</p>`;$('submit').hidden=true;$('next').hidden=false;for(let b of $('choices').querySelectorAll('button')){b.disabled=true;if(equal(b.textContent,q.answer))b.classList.add('right');else if(equal(b.textContent,v)&&!ok)b.classList.add('wrong')}$('next').textContent=position===items.length-1?'查看結果':'下一題'}
async function finish(){clearInterval(timer);let elapsed=Math.max(1,Math.round((Date.now()-started)/1000)),score=Math.round(correct/items.length*100);setScreen('results');$('finalScore').textContent=score;$('summary').textContent=`${game.modes[modeId]} · ${score} 分 · 答對 ${correct}／${items.length} 題 · 最高連擊 ${maxCombo} · ${elapsed} 秒`;$('review').replaceChildren();mistakes.forEach(({q,answer},i)=>{let el=document.createElement('article');el.className='review';el.innerHTML=`<strong>錯題 ${i+1}：${escape(q.prompt)}</strong><p>你答：${escape(answer)}｜正解：${escape(q.answer)}</p><p>${escape(q.explain)}</p>`;$('review').append(el)});$('save').textContent=auth.currentUser?'正在儲存成績…':'訪客成績不會儲存，請回首頁使用 Google 登入。';if(!auth.currentUser)return;try{let r=await saveGameScore({game:gameId,mode:modeId,score,correctCount:correct,wrongCount:wrong,maxCombo,playTime:elapsed});$('save').textContent=r.success?'✅ 成績已儲存，可在我的成績與排行榜查看。':'⚠️ 成績未儲存：'+(r.reason||'請檢查連線及權限')}catch(e){$('save').textContent='⚠️ 成績儲存失敗：'+e.message}}
function start(key){clearInterval(timer);modeId=key;let keys=key==='mixed'?Object.keys(game.factories):[key];items=Array.from({length:10},(_,i)=>makeQuestion(keys[i%keys.length]));position=correct=wrong=combo=maxCombo=0;mistakes=[];started=Date.now();remaining=15*60;setScreen('playing');render();$('clock').textContent='15:00';timer=setInterval(()=>{remaining--;if(remaining<=10&&remaining>0)beep('tick');$('clock').textContent=`${String(Math.floor(Math.max(0,remaining)/60)).padStart(2,'0')}:${String(Math.max(0,remaining)%60).padStart(2,'0')}`;if(remaining<=0)finish()},1000)}
$('title').textContent=game.title;document.title=game.title+'｜數學有解';document.querySelectorAll('[data-mode]').forEach(button=>{button.addEventListener('click',()=>start(button.dataset.mode))});
$('form').onsubmit=e=>{e.preventDefault();if(locked&&!$('next').hidden)$('next').click();else submit()};$('next').onclick=()=>{if(position<items.length-1){position++;render()}else finish()};$('again').onclick=()=>start(modeId);$('choose').onclick=()=>{clearInterval(timer);setScreen('modes')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關'};onAuthStateChanged(auth,u=>{$('status').textContent=u?`玩家：${u.displayName||u.email}`:'訪客可試玩；登入後才會儲存成績'});

</script></body></html>
