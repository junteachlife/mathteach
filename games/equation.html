<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一元一次方程式挑戰賽｜生活有解．心中有數</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%237b1fa2%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-size%3D%2239%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-weight%3D%22bold%22%20fill%3D%22white%22%3E%E6%96%B9%3C%2Ftext%3E%3C%2Fsvg%3E">

<link rel="stylesheet" href="../css/scratchpad.css">
<link rel="stylesheet" href="../css/math-expression-input.css?v=2.3">

<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --green:#16a34a;
  --amber:#d97706;
  --ink:#1f2937;
  --muted:#64748b;
  --line:#dbe3ef;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  color:var(--ink);
}

body{
  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );
  padding:4px;
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:calc(100vh - 8px);
  margin:0 auto;
  background:#fff;
  border:3px solid #bfdbfe;
  border-radius:24px;
  box-shadow:
    0 18px 45px
    #1e3a8a22;
  overflow:hidden;
}

.progress{
  height:10px;
  background:#e5e7eb;
}

.progress>div{
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #2563eb
    );
  transition:width .3s;
}

.inner{
  padding:24px;
}

.hidden{
  display:none!important;
}

.title{
  text-align:center;
  color:var(--blue-dark);
  font-size:
    clamp(
      28px,
      4vw,
      42px
    );
  font-weight:900;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:0 0 24px;
}

.modes{
  display:grid;
  gap:14px;
  max-width:800px;
  margin:0 auto 24px;
}

.mode-card input{
  position:absolute;
  opacity:0;
}

.mode-card span{
  display:block;
  border:2px solid var(--line);
  border-radius:17px;
  padding:17px;
  cursor:pointer;
  transition:.2s;
  background:#fff;
}

.mode-card input:checked+span{
  border-color:#3b82f6;
  background:#eff6ff;
  box-shadow:
    0 0 0 4px
    #3b82f622;
}

.mode-title{
  font-weight:900;
  color:var(--blue-dark);
  font-size:18px;
}

.example{
  font-family:
    "Times New Roman",
    serif;
  font-size:20px;
  margin-top:6px;
  color:#475569;
}

.center{
  text-align:center;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 20px;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.btn:active{
  transform:scale(.98);
}

.btn-primary{
  background:var(--blue);
  color:#fff;
}

.btn-green{
  background:var(--green);
  color:#fff;
}

.btn-light{
  background:#eff6ff;
  color:var(--blue-dark);
  border:2px solid #bfdbfe;
}

.btn-danger-light{
  background:#fff1f2;
  color:#be123c;
  border:2px solid #fecdd3;
}

.btn-neutral{
  background:#f1f5f9;
  color:#334155;
  border:2px solid #cbd5e1;
}

.quiz-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:20px;
  align-items:start;
}

.topbar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:16px;
  text-align:center;
}

.pill{
  padding:9px 14px;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
  box-shadow:
    0 4px 12px
    #0f172a10;
}

.pill-blue{
  background:#dbeafe;
  color:var(--blue-dark);
}

.pill-amber{
  background:#fef3c7;
  color:#92400e;
}

.pill-gray{
  background:#f1f5f9;
  color:#475569;
}

.problem{
  background:#f8fafc;
  border:2px solid #e2e8f0;
  border-radius:20px;
  padding:30px 14px;
  text-align:center;
  font-family:
    "Times New Roman",
    serif;
  font-size:
    clamp(
      28px,
      4.2vw,
      46px
    );
  font-weight:bold;
  margin-bottom:22px;
  white-space:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
}

.answer-wrap{
  max-width:760px;
  margin:auto;
}

.label{
  display:block;
  font-weight:900;
  color:#475569;
  margin-bottom:9px;
  font-size:18px;
}

.answer-entry-row{
  display:flex;
  align-items:center;
  width:100%;
}

.answer-x{
  flex:0 0 auto;
  font-family:
    "Times New Roman",
    serif;
  font-size:38px;
  font-weight:900;
  color:#1f2937;
  white-space:nowrap;
}

.mode4-answer{
  display:flex;
  flex:1 1 auto;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:nowrap;
  padding:14px;
  border:2px solid #dbeafe;
  border-radius:18px;
  background:#f8fbff;
  min-height:132px;
}

.answer-sign-select{
  height:48px;
  min-width:76px;
  padding:0 10px;
  border:2px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  color:#1f2937;
  text-align:center;
  font-family:
    "Times New Roman",
    serif;
  font-size:22px;
  font-weight:900;
  outline:none;
  cursor:pointer;
}

.answer-sign-select:focus{
  border-color:#60a5fa;
  box-shadow:
    0 0 0 4px
    #dbeafe;
}

.frac-input{
  position:relative;
  display:inline-grid;
  grid-template-rows:
    48px
    48px;
  width:82px;
  gap:8px;
  vertical-align:middle;
}

.frac-input input{
  width:100%;
  height:48px;
  border:2px solid #cbd5e1;
  border-radius:10px;
  text-align:center;
  font-size:24px;
  font-weight:900;
  outline:none;
  background:#fff;
}

.frac-input input:focus{
  border-color:#60a5fa;
  box-shadow:
    0 0 0 4px
    #dbeafe;
}

.frac-input input::placeholder{
  font-size:12px;
  font-weight:700;
  color:#94a3b8;
}

.frac-input .frac-line{
  position:absolute;
  left:5px;
  right:5px;
  top:50%;
  height:2px;
  background:#1f2937;
  transform:translateY(-1px);
  z-index:2;
  pointer-events:none;
}

.frac-input.integer-input{
  display:flex;
  width:min(190px,55vw);
}

.frac-input.integer-input input:first-child{
  display:block;
}

.frac-input.integer-input input:last-child,
.frac-input.integer-input .frac-line{
  display:none;
}

.fraction-help{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin:8px 0 12px;
}

.math-frac{
  display:inline-flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  min-width:.78em;
  text-align:center;
  line-height:.92;
  margin:0 .035em;
  vertical-align:middle;
  transform:translateY(.01em);
}

.math-frac .top,
.math-frac .bottom{
  display:block;
  font-size:.64em;
  line-height:.95;
  padding:0 .08em;
}

.math-frac .top{
  border-bottom:
    2px solid currentColor;
  padding-bottom:.07em;
}

.math-frac .bottom{
  padding-top:.07em;
}

.math-frac .bar{
  display:none;
}

.math-expression{
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:max-content;
  line-height:1.15;
}

.mode4-answer.disabled{
  opacity:.65;
  pointer-events:none;
}

.preview{
  min-height:26px;
  text-align:center;
  color:#64748b;
  margin:9px 0 14px;
  font-size:14px;
}

.actions{
  display:grid;
  gap:10px;
}

.feedback{
  min-height:60px;
  margin-top:15px;
  text-align:center;
  font-size:19px;
  font-weight:900;
  line-height:1.55;
}

.solution{
  margin-top:12px;
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
  color:#334155;
  font-family:
    "Times New Roman",
    serif;
  font-size:21px;
  line-height:1.75;
}

.result-box{
  max-width:700px;
  margin:auto;
  text-align:center;
}

.grade-card{
  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );
  border:2px solid #bfdbfe;
  border-radius:22px;
  padding:24px;
  margin:18px 0;
}

.grade-big{
  font-size:54px;
  font-weight:900;
  color:var(--blue-dark);
}

.stars{
  font-size:34px;
  letter-spacing:4px;
  margin:6px 0;
}

.comment{
  font-size:20px;
  font-weight:900;
  color:#334155;
}

.score-grid{
  display:grid;
  grid-template-columns:
    repeat(
      3,
      1fr
    );
  gap:12px;
  margin:18px 0;
}

.score-card{
  background:#f8fafc;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
}

.score-card b{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.save-status{
  min-height:24px;
  margin:10px 0 16px;
  font-size:15px;
  font-weight:900;
  line-height:1.6;
}

.result-actions{
  display:grid;
  grid-template-columns:
    repeat(
      3,
      1fr
    );
  gap:10px;
}

.review-list{
  display:grid;
  gap:14px;
  text-align:left;
  margin-top:18px;
}

.review-card{
  border:2px solid #fecaca;
  background:#fff7f7;
  border-radius:17px;
  padding:16px;
}

.review-title{
  font-weight:900;
  color:#b91c1c;
  margin-bottom:8px;
}

.review-problem{
  font-family:
    "Times New Roman",
    serif;
  font-size:23px;
  font-weight:700;
  margin:8px 0;
}

.review-answer{
  line-height:1.7;
  color:#475569;
}

#scratchpad-mobile-button{
  display:flex;
  align-items:center;
}

#scratchpad-mobile-button
.scratchpad-open-button{
  position:static!important;
  inset:auto!important;
  display:inline-flex!important;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:10px 16px;
  border:2px solid #c7d2fe;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #2563eb
    );
  color:#fff;
  box-shadow:
    0 6px 16px
    #3730a333;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:980px){
  .result-actions{
    grid-template-columns:1fr;
  }
}

@media(max-width:560px){
  .inner{
    padding:14px;
  }

  .btn{
    padding:10px 11px;
    font-size:14px;
  }

  .problem{
    padding:24px 8px;
    font-size:
      clamp(
        24px,
        8vw,
        38px
      );
  }

  .answer-x{
    font-size:30px;
  }

  .mode4-answer{
    gap:8px;
    padding:10px;
  }

  .answer-sign-select{
    min-width:64px;
    height:42px;
    font-size:19px;
  }

  .frac-input{
    width:66px;
    grid-template-rows:
      42px
      42px;
    gap:7px;
  }

  .frac-input.integer-input{
    width:120px;
  }

  .frac-input input{
    height:42px;
    font-size:20px;
  }

  .score-grid{
    grid-template-columns:1fr;
  }
}

/* v2026-10-26 七上一元一次方程式共用元件／詳解統一版 */
.semester-nav{display:flex;justify-content:flex-end;margin-bottom:12px}
.topbar{justify-content:space-between;gap:10px}
.quiz-stats{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.quiz-controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-left:auto}
.quiz-controls .btn{font-size:13px;padding:9px 12px;white-space:nowrap}
.problem-card{position:relative;border:2px solid #bfdbfe;border-radius:18px;margin-bottom:14px;background:#fff;overflow:visible}
.problem{border:0;background:transparent;margin:0;padding:34px 18px 65px;min-height:170px;white-space:normal;overflow-x:auto}
.scratchpad-corner{position:absolute;right:12px;bottom:10px;z-index:5}
.scratchpad-corner .scratchpad-open-button{min-height:36px!important;padding:6px 12px!important;font-size:13px!important}
.unified-row{gap:12px;align-items:center;margin:12px auto}
#equation-answer-mount{flex:1;min-width:0}
#equation-answer-mount .mei-shell{width:100%;max-width:none}
#equation-answer-mount .mei-main-row{align-items:center}
#equation-answer-mount .mei-editor-wrap{min-width:0}
.answer-x{font-size:30px}
.answer-wrap{max-width:900px;padding:18px 18px;background:#f8fafc;border-radius:17px}
.actions{display:flex;align-items:center;justify-content:center;margin-top:16px}
.actions .btn{min-width:180px}
.full-solution{margin:18px auto 0;max-width:960px;text-align:left;display:grid;gap:10px}
.solution-title{text-align:left;font-weight:900;color:#1d4ed8;font-size:19px;margin:10px 0}
.solution-step{padding:15px 17px;background:#fff;border-left:4px solid #2563eb;border-radius:12px;box-shadow:0 2px 10px #1f29370b;line-height:1.7}
.solution-step>b{color:#1d4ed8;font-size:15px}
.solution-math{font-family:'Cambria Math','Times New Roman','Microsoft JhengHei',serif;font-size:21px;margin-top:6px;overflow-x:auto;line-height:1.8}
.review-explanation{margin-top:12px}
.review-explanation .solution-step{background:#fff}
@media(max-width:600px){.topbar{align-items:stretch}.quiz-controls{width:100%}.quiz-controls .btn{flex:1}.answer-wrap{padding:12px 8px}.unified-row{gap:6px}.answer-x{font-size:23px}.problem{font-size:clamp(24px,6vw,34px)}}

/* v2026-10-26 UI aligns visually with grade8 2-2; retains all four question generators */
:root{--blue:#7b1fa2;--blue-dark:#4a148c;--green:#7b1fa2;--amber:#b45309;--line:#dfc6e4}
body{background:linear-gradient(180deg,#f7ecf9 0,#fff 260px);padding:12px 8px 28px}
.app{width:min(100%,1280px);min-height:calc(100vh - 30px);border:0;border-top:6px solid #7b1fa2;border-radius:22px;box-shadow:0 15px 40px #5422641e;overflow:visible}
.inner{padding:18px 24px 38px}
.equation-game-header{position:relative;text-align:center;padding:48px 18px 26px;background:linear-gradient(180deg,#f6eaf7 0%,#fff 100%);border-radius:18px;margin-bottom:10px}
.grade-return{position:absolute;right:15px;top:12px;text-decoration:none;border:1.5px solid #c796d1;background:#fff;color:#57176c;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:850}
.title{color:#57176c;font-size:clamp(26px,3.6vw,39px);margin:4px 0 12px}
.subtitle{margin:0 auto 16px;color:#7d7182;font-size:14px;line-height:1.6}
.concept-strip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.concept-strip span{border:1px solid #c895ce;border-radius:20px;padding:6px 12px;color:#642576;background:white;font-size:12px;font-weight:750}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;max-width:1050px;margin:12px auto 25px}
.mode-card{position:relative;display:block;min-width:0}
.mode-card span{height:100%;min-height:174px;padding:22px 23px;border:1.5px solid #d8a9da;border-radius:18px;background:linear-gradient(160deg,#f4e3f5 0%,#fff 96%);transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 4px 12px #4a14550b}
.mode-card:hover span{transform:translateY(-2px);box-shadow:0 8px 20px #4a14551d}
.mode-card input:checked+span{border-color:#8f3ba3;background:linear-gradient(150deg,#ecd2f0,#fff);box-shadow:0 0 0 2px #aa6cbd30}
.mode-count{display:inline-flex;font-weight:850;font-size:12px;color:#71388d;border-radius:9px;background:#fff;padding:5px 10px;margin-bottom:14px}
.mode-title{font-size:20px;color:#622277}
.example{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-size:14px;line-height:1.7;color:#766a7a;margin-top:10px}
.btn{border-radius:12px}
.btn-primary,.btn-green{background:#7b1fa2;color:white}
.btn-primary:hover,.btn-green:hover{background:#651384}
.btn-light{background:#f5eef9;border:1px solid #dac2e6;color:#5f246e}
.btn-danger-light{background:#f4e9f5;border:1px solid #dac2e6;color:#602371}
.topbar{display:flex;align-items:stretch;flex-wrap:nowrap;gap:8px;margin:0 0 15px}
.quiz-stats{flex:1;min-width:0;display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap}
.pill{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:52px;flex:1 1 0;padding:6px 8px;border-radius:13px;box-shadow:none;background:#f2e4f4;color:#5b2568;text-align:center;font-size:14px}
.pill small{display:block;font-size:11px;font-weight:700;line-height:1.25}
.pill strong{display:block;font-size:15px;font-weight:850;line-height:1.5}
.pill-amber{background:#f5e7f5;color:#5b2568}
.pill-gray{background:#fff6ec;color:#b05c1b}
.quiz-controls{margin:0;display:flex;flex:0 0 auto;gap:6px;align-items:center;flex-wrap:nowrap}
.quiz-controls .btn{min-height:40px;padding:8px 12px;font-size:12px;white-space:nowrap}
.progress{height:0;background:transparent}
.progress>div{height:6px;border-radius:8px;background:linear-gradient(90deg,#a53cbe,#7b1fa2)}
.problem-card{border:1.5px solid #cc9dce;border-radius:18px;background:#fff;margin:0 0 14px;overflow:visible}
.problem{display:flex;align-items:center;justify-content:center;min-height:205px;padding:38px 18px 65px;font-size:clamp(29px,4vw,49px);line-height:1.5;overflow-x:auto;white-space:nowrap;color:#19131d}
.scratchpad-corner{right:15px;bottom:12px}
.scratchpad-corner .scratchpad-open-button{background:linear-gradient(#fffbe0,#f5b740)!important;border:1.5px solid #d28a22!important;color:#643a08!important;box-shadow:0 3px 0 #ba790c!important;border-radius:12px!important}
.answer-wrap{max-width:940px;background:#faf9fc;border-radius:18px;padding:23px 25px;margin:0 auto}
.answer-wrap>.label{text-align:center;color:#622277;font-size:16px;margin-bottom:13px}
.unified-row{max-width:810px;margin:auto;display:flex;align-items:center;justify-content:center;gap:12px}
#equation-answer-mount{flex:1;min-width:0}
#equation-answer-mount .mei-shell{--mei-primary:#7b1fa2;--mei-primary-dark:#4a148c;--mei-primary-light:#f3e5f5;--mei-primary-border:#ce93d8;max-width:100%;margin:0}
#equation-answer-mount .mei-main-row{justify-content:center;align-items:center;gap:8px}
#equation-answer-mount .mei-editor-wrap{flex:1 1 auto;min-width:0}
.answer-x{color:#2b2330;font-size:30px}
.preview{color:#6c5279}
.actions{display:flex;justify-content:center;gap:12px;margin:14px 0}
.actions .btn{min-width:165px}
.feedback{margin-top:10px}
.full-solution{max-width:960px}
.solution-step{border-left-color:#7b1fa2}
.solution-step>b,.solution-title{color:#713189}
.review-card{border-color:#deb6dd}
.grade-card{background:linear-gradient(140deg,#f5e8f8,#fff);border-color:#dcc1e6}
.grade-big{color:#713189}
@media(max-width:760px){
 .inner{padding:10px 11px 22px}
 .equation-game-header{padding:57px 10px 16px}
 .grade-return{right:8px;top:10px;font-size:12px}
 .modes{grid-template-columns:1fr;gap:12px}

<script type="module">

import {
  saveGameScore
} from "../js/scores.js";

"use strict";

const GAME_ID =
  "equation";

const MODE_NAMES = {
  1:"模式一",
  2:"模式二",
  3:"模式三",
  4:"模式四"
};

const $ =
  id =>
    document.getElementById(id);

let mode = 1;
let questions = [];
let index = 0;
let correct = 0;
let wrong = 0;

let startTime = 0;
let timer = null;

let locked = false;
let nextReady = false;
let nextTimer = null;

let records = [];

let scoreSaved = false;
let finalElapsed = 0;

let equationAudioContext =
  null;


/*
==================================================
基本工具
==================================================
*/

function totalQuestions() {
  return (
    mode === 4
      ? 6
      : 10
  );
}

function rand(
  min,
  max
) {
  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}

function nz(
  min,
  max
) {
  let n = 0;

  while (!n) {
    n =
      rand(
        min,
        max
      );
  }

  return n;
}

function shuffle(array) {
  const result = [
    ...array
  ];

  for (
    let i =
      result.length - 1;
    i > 0;
    i--
  ) {
    const j =
      rand(
        0,
        i
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }

  return result;
}

function gcd(
  a,
  b
) {
  a =
    Math.abs(a);

  b =
    Math.abs(b);

  while (b) {
    const temp =
      a % b;

    a = b;

    b = temp;
  }

  return (
    a || 1
  );
}

/*
==================================================
分式題目最簡檢查

用途：
若題目顯示為

(ax + b) / m

則要求 a、b、m 沒有共同因數，
避免出現：

(4x − 6) / 12
5x / 5
4(3x − 5) / 8

這類可以先約分的分式。
==================================================
*/

function linearFractionIsSimplest(
  a,
  b,
  denominator
) {
  const common =
    gcd(
      gcd(
        Math.abs(a),
        Math.abs(b)
      ),
      Math.abs(denominator)
    );

  return common === 1;
}

function factorizedFractionIsSimplest(
  outsideCoefficient,
  denominator
) {
  return (
    gcd(
      Math.abs(
        outsideCoefficient
      ),
      Math.abs(
        denominator
      )
    ) === 1
  );
}


function rat(
  n,
  d = 1
) {
  if (
    d === 0
  ) {
    throw new Error(
      "分母不可為 0"
    );
  }

  if (
    d < 0
  ) {
    n =
      -n;

    d =
      -d;
  }

  const g =
    gcd(
      n,
      d
    );

  return {
    n:
      n / g,

    d:
      d / g
  };
}

function ratEq(
  a,
  b
) {
  return (
    a.n === b.n &&
    a.d === b.d
  );
}

function ratAbs(a) {
  return rat(
    Math.abs(a.n),
    a.d
  );
}

function ratAdd(
  a,
  b
) {
  return rat(
    a.n * b.d +
    b.n * a.d,
    a.d * b.d
  );
}

function ratSub(
  a,
  b
) {
  return rat(
    a.n * b.d -
    b.n * a.d,
    a.d * b.d
  );
}

function ratMul(
  a,
  b
) {
  return rat(
    a.n * b.n,
    a.d * b.d
  );
}

function ratDiv(
  a,
  b
) {
  if (
    b.n === 0
  ) {
    throw new Error(
      "不可除以 0"
    );
  }

  return rat(
    a.n * b.d,
    a.d * b.n
  );
}

function ratIsInteger(a) {
  return (
    a.d === 1
  );
}

function ratWithin(
  a,
  maxAbs = 80,
  maxDen = 12
) {
  return (
    Math.abs(a.n) <=
      maxAbs * a.d &&
    a.d <=
      maxDen
  );
}


/*
==================================================
數學格式
==================================================
*/

function integerText(n) {
  return String(n)
    .replace(
      "-",
      "−"
    );
}

function fx(n) {
  if (
    n === 1
  ) {
    return "x";
  }

  if (
    n === -1
  ) {
    return "−x";
  }

  return (
    (
      n < 0
        ? "−" +
          Math.abs(n)
        : n
    ) +
    "x"
  );
}

function linear(
  a,
  b
) {
  let text = "";

  if (a) {
    text =
      fx(a);
  }

  if (b) {
    if (!text) {
      text =
        integerText(b);
    } else {
      text +=
        b > 0
          ? ` + ${b}`
          : ` − ${Math.abs(b)}`;
    }
  }

  return (
    text || "0"
  );
}

function mathFracHTML(
  value,
  showSign = true
) {
  const negative =
    value.n < 0;

  const absolute =
    Math.abs(
      value.n
    );

  const sign =
    showSign &&
    negative
      ? "−"
      : "";

  if (
    value.d === 1
  ) {
    return (
      sign +
      absolute
    );
  }

  return (
    `${sign}` +
    `<span class="math-frac">` +
      `<span class="top">${absolute}</span>` +
      `<span class="bar"></span>` +
      `<span class="bottom">${value.d}</span>` +
    `</span>`
  );
}

function stackedFractionHTML(
  top,
  bottom
) {
  return (
    `<span class="math-frac">` +
      `<span class="top">${top}</span>` +
      `<span class="bar"></span>` +
      `<span class="bottom">${bottom}</span>` +
    `</span>`
  );
}

function signedHTML(
  value,
  first = false
) {
  const r =
    rat(
      value.n,
      value.d
    );

  if (first) {
    return mathFracHTML(
      r,
      true
    );
  }

  return (
    r.n < 0
      ? ` − ${mathFracHTML(
          ratAbs(r),
          false
        )}`
      : ` + ${mathFracHTML(
          r,
          false
        )}`
  );
}

function coefficientXHTML(
  value
) {
  const r =
    rat(
      value.n,
      value.d
    );

  if (
    r.n === 0
  ) {
    return "";
  }

  const negative =
    r.n < 0;

  const absolute =
    ratAbs(r);

  const sign =
    negative
      ? "−"
      : "";

  if (
    absolute.n ===
    absolute.d
  ) {
    return (
      `${sign}x`
    );
  }

  return (
    `${sign}` +
    `${mathFracHTML(
      absolute,
      false
    )}x`
  );
}

function rationalLinearHTML(
  a,
  b
) {
  let text = "";

  if (
    a.n !== 0
  ) {
    text =
      coefficientXHTML(a);
  }

  if (
    b.n !== 0
  ) {
    text +=
      signedHTML(
        b,
        !text
      );
  }

  return (
    text || "0"
  );
}


/*
==================================================
括號前係數
==================================================
*/

function bracketCoefficientText(
  coefficient,
  inside
) {
  if (
    coefficient === 1
  ) {
    return (
      `(${inside})`
    );
  }

  if (
    coefficient === -1
  ) {
    return (
      `−(${inside})`
    );
  }

  return (
    `${integerText(
      coefficient
    )}(${inside})`
  );
}


/*
==================================================
★ 本次重要修正

專門處理：

第一組括號 − 第二組括號

若第二組係數為：

1
→ − (...)

−1
→ + (...)

3
→ − 3(...)

−3
→ + 3(...)

因此永遠不會再出現：

− −(...)
==================================================
*/

function signedSubtractedBracketText(
  coefficient,
  inside
) {
  if (
    coefficient === 1
  ) {
    return (
      ` − (${inside})`
    );
  }

  if (
    coefficient === -1
  ) {
    return (
      ` + (${inside})`
    );
  }

  if (
    coefficient > 1
  ) {
    return (
      ` − ${coefficient}(${inside})`
    );
  }

  return (
    ` + ${Math.abs(
      coefficient
    )}(${inside})`
  );
}


/*
==================================================
顯示前最後一道保護

即使其他地方意外產生：

− −(...)
也會整理成：
+ (...)

+ −(...)
也會整理成：
− (...)
==================================================
*/

function normalizeUnitBracketCoefficients(
  value
) {
  return String(value)

    .replace(
      /(^|[\s=+−\-])[-−]1(?=\s*\()/g,
      "$1−"
    )

    .replace(
      /(^|[\s=+−\-])1(?=\s*\()/g,
      "$1"
    )

    .replace(
      /\s*−\s*−\s*(?=\()/g,
      " + "
    )

    .replace(
      /\s*\+\s*−\s*(?=\()/g,
      " − "
    );
}

function normalizeSingleTermParentheses(
  value
) {
  let result = String(value);

  /*
  單一正的 x 項不需要括號：
  − (x)  → − x
  + (x)  → + x
  − (2x) → − 2x
  + (2x) → + 2x

  單一負的 x 項仍保留括號：
  − (−x)、+ (−x)、− (−2x)。
  */
  result = result.replace(
    /([+−])\s*\(\s*(x|[2-9]\d*x)\s*\)/g,
    "$1 $2"
  );

  return result;
}

function questionHTML(q) {
  return (
    `<span class="math-expression">` +
      `${normalizeSingleTermParentheses(
        normalizeUnitBracketCoefficients(
          q.qStr
        )
      )}` +
    `</span>`
  );
}


/*
==================================================
答案產生
==================================================
*/

function makeAnswerByRatio() {
  if (
    Math.random() <
    .7
  ) {
    return rat(
      nz(
        -9,
        9
      )
    );
  }

  let n;
  let d;

  do {
    d =
      rand(
        2,
        7
      );

    n =
      nz(
        -15,
        15
      );

  } while (
    gcd(
      n,
      d
    ) !== 1 ||
    Math.abs(n) ===
      d
  );

  return rat(
    n,
    d
  );
}


/*
==================================================
模式四類型
==================================================
*/

function makeMode4TypeSchedule(
  target
) {
  const base = [
    "A",
    "B",
    "C",
    "D",
    "E"
  ];

  const schedule = [
    ...base
  ];

  while (
    schedule.length <
    target
  ) {
    schedule.push(
      base[
        rand(
          0,
          base.length - 1
        )
      ]
    );
  }

  return shuffle(
    schedule
  );
}


/*
==================================================
模式四
==================================================
*/

function makeMode4Question(
  type,
  ansRat
) {
  const x =
    ansRat;

  for (
    let attempt = 0;
    attempt < 800;
    attempt++
  ) {

    if (
      type === "A"
    ) {
      const a =
        rat(
          nz(-5,5),
          rand(2,7)
        );

      const b =
        rat(
          nz(-5,5),
          rand(2,7)
        );

      if (
        ratEq(
          a,
          b
        )
      ) {
        continue;
      }

      const leftB =
        rat(
          nz(-8,8)
        );

      const rightB =
        ratAdd(
          ratMul(
            ratSub(
              a,
              b
            ),
            x
          ),
          leftB
        );

      if (
        !ratWithin(
          rightB,
          35,
          8
        )
      ) {
        continue;
      }

      return {
        qStr:
          `${rationalLinearHTML(
            a,
            leftB
          )} = ` +
          `${rationalLinearHTML(
            b,
            rightB
          )}`,

        ans:
          ansRat
      };
    }


    if (
      type === "B"
    ) {
      const alpha =
        rat(
          nz(-5,5),
          rand(2,6)
        );

      const beta =
        rat(
          nz(1,5),
          rand(2,6)
        );

      // 排除 alpha = beta 造成 x 係數抵消、方程式有無限多解的無效題。
      if (ratEq(alpha, beta)) continue;

      const inside =
        rand(
          -15,
          15
        );

      const rhs =
        ratAdd(
          ratMul(
            ratSub(
              alpha,
              beta
            ),
            x
          ),
          ratMul(
            beta,
            rat(
              inside
            )
          )
        );

      if (
        !ratIsInteger(
          rhs
        )
      ) {
        continue;
      }

      const bracket =
        inside === 0
          ? "x"
          : inside > 0
            ? `x − ${inside}`
            : `x + ${Math.abs(
                inside
              )}`;

      return {
        qStr:
          `${coefficientXHTML(
            alpha
          )} − ` +
          `${mathFracHTML(
            beta,
            false
          )}` +
          `(${bracket}) = ` +
          `${integerText(
            rhs.n
          )}`,

        ans:
          ansRat
      };
    }


    if (
      type === "C"
    ) {
      const m =
        rand(
          2,
          7
        );

      const n =
        rand(
          2,
          7
        );

      // 兩邊分母相同只需合併分子，失去消去不同分母的練習意義。
      if (m === n) continue;

      const a =
        nz(
          -8,
          8
        );

      const b =
        rand(
          -12,
          12
        );

      const c =
        nz(
          -8,
          8
        );

      const leftAtX =
        ratAdd(
          ratMul(
            rat(a),
            x
          ),
          rat(b)
        );

      const d =
        ratSub(
          ratMul(
            rat(
              n,
              m
            ),
            leftAtX
          ),
          ratMul(
            rat(c),
            x
          )
        );

      if (
        !ratIsInteger(
          d
        )
      ) {
        continue;
      }

      /*
      分子／分母必須已是最簡形式。

      避免：
      (4x − 6) / 12
      5x / 5
      */

      if (
        !linearFractionIsSimplest(
          a,
          b,
          m
        ) ||
        !linearFractionIsSimplest(
          c,
          d.n,
          n
        )
      ) {
        continue;
      }

      return {
        qStr:
          `${stackedFractionHTML(
            linear(
              a,
              b
            ),
            m
          )} = ` +
          `${stackedFractionHTML(
            linear(
              c,
              d.n
            ),
            n
          )}`,

        ans:
          ansRat
      };
    }


    if (
      type === "D"
    ) {
      const m =
        rand(
          2,
          8
        );

      const rhs =
        rand(
          -10,
          10
        );

      const A =
        ratSub(
          ratMul(
            rat(
              m + 1
            ),
            x
          ),
          rat(
            m *
            rhs
          )
        );

      if (
        !ratIsInteger(
          A
        )
      ) {
        continue;
      }

      const numerator =
        A.n === 0
          ? "−x"
          : A.n > 0
            ? `${A.n} − x`
            : `−${Math.abs(
                A.n
              )} − x`;

      return {
        qStr:
          `x − ` +
          `${stackedFractionHTML(
            numerator,
            m
          )} = ` +
          `${integerText(
            rhs
          )}`,

        ans:
          ansRat
      };
    }


    const m =
      rand(
        2,
        6
      );

    const n =
      rand(
        2,
        6
      );

    const r =
      rand(
        2,
        6
      );

    // 三個分式的分母須互不相同，確保需要真正找最小公倍數。
    if (m === n || m === r || n === r) continue;

    const a =
      nz(
        -5,
        5
      );

    const b =
      rand(
        -7,
        7
      );

    const c =
      nz(
        -5,
        5
      );

    const d =
      rand(
        -8,
        8
      );

    const e =
      nz(
        -5,
        5
      );

    const operation =
      Math.random() <
      .5
        ? 1
        : -1;

    const left1 =
      ratDiv(
        ratMul(
          rat(a),
          ratAdd(
            x,
            rat(b)
          )
        ),
        rat(m)
      );

    const left2 =
      ratDiv(
        ratAdd(
          ratMul(
            rat(c),
            x
          ),
          rat(d)
        ),
        rat(n)
      );

    const left =
      operation === 1
        ? ratAdd(
            left1,
            left2
          )
        : ratSub(
            left1,
            left2
          );

    const f =
      ratSub(
        ratMul(
          rat(r),
          left
        ),
        ratMul(
          rat(e),
          x
        )
      );

    if (
      !ratIsInteger(
        f
      )
    ) {
      continue;
    }

    /*
    三個分式都必須先是最簡形式。

    第一個：
    a(x ± b) / m
    只要 a 與 m 有公因數，就能先約分，
    因此直接排除。

    第二、三個：
    (cx + d) / n
    (ex + f) / r
    要求分子所有係數與分母沒有共同因數。
    */

    if (
      !factorizedFractionIsSimplest(
        a,
        m
      ) ||
      !linearFractionIsSimplest(
        c,
        d,
        n
      ) ||
      !linearFractionIsSimplest(
        e,
        f.n,
        r
      )
    ) {
      continue;
    }

    const firstTop =
      b === 0
        ? fx(a)
        : `${
            a === 1
              ? ""
              : a === -1
                ? "−"
                : integerText(
                    a
                  )
          }(x ${
            b > 0
              ? "+"
              : "−"
          } ${Math.abs(
            b
          )})`;

    const secondTop =
      linear(
        c,
        d
      );

    return {
      qStr:
        `${stackedFractionHTML(
          firstTop,
          m
        )}` +
        `${
          operation === 1
            ? " + "
            : " − "
        }` +
        `${stackedFractionHTML(
          secondTop,
          n
        )}` +
        ` = ` +
        `${stackedFractionHTML(
          linear(
            e,
            f.n
          ),
          r
        )}`,

      ans:
        ansRat
    };
  }

  throw new Error(
    `模式四 ${type} 類題型產生失敗`
  );
}


/*
==================================================
所有模式題目
==================================================
*/

function makeQuestions(
  selectedMode
) {
  const output = [];

  const used =
    new Set();

  const target =
    selectedMode === 4
      ? 6
      : 10;


  /*
  模式四
  */

  if (
    selectedMode === 4
  ) {
    const schedule =
      makeMode4TypeSchedule(
        target
      );

    schedule.forEach(
      type => {
        for (
          let retry = 0;
          retry < 150;
          retry++
        ) {
          const question =
            makeMode4Question(
              type,
              makeAnswerByRatio()
            );

          // 所有模式四題目都重新由題目本身計算一次，
          // 必須有唯一解，且與產題器給定的答案一致，否則重抽。
          try {
            const {a,b,c,d}=equationCoefficients(question);
            const coefficient=ratSub(a,c);
            if(coefficient.n===0 || !ratEq(ratDiv(ratSub(d,b),coefficient),question.ans)) continue;
          } catch(error) {
            console.warn("忽略無效分式方程式題目", error);
            continue;
          }

          const key =
            question.qStr
              .replace(
                /<[^>]+>/g,
                ""
              );

          if (
            used.has(
              key
            )
          ) {
            continue;
          }

          used.add(
            key
          );

          output.push(
            question
          );

          break;
        }
      }
    );

    if(output.length!==target)throw new Error("模式四有效題目不足，請重新開始測驗");
    return shuffle(
      output
    );
  }


  /*
  模式一
  */

  if (
    selectedMode === 1
  ) {
    while (
      output.length <
      target
    ) {
      const ans =
        makeAnswerByRatio();

      const p =
        ans.n;

      const q =
        ans.d;

      const k =
        nz(
          -5,
          5
        );

      const a =
        k *
        q;

      // 排除 x＝常數、−x＝常數等不需計算的題目；不改答案生成規則。
      if(Math.abs(a)===1) continue;

      const b =
        k *
        p;

      if (
        Math.abs(a) >
          35 ||
        Math.abs(b) >
          60
      ) {
        continue;
      }

      const qStr =
        `${fx(
          a
        )} = ${integerText(
          b
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });
    }

    return shuffle(
      output
    );
  }


  /*
  模式二
  */

  if (
    selectedMode === 2
  ) {
    while (
      output.length <
      target
    ) {
      const ans =
        makeAnswerByRatio();

      const p =
        ans.n;

      const q =
        ans.d;

      const k =
        nz(
          -4,
          4
        );

      const c =
        nz(
          -7,
          7
        );

      const a =
        c +
        k *
        q;

      const b =
        nz(
          -15,
          15
        );

      const d =
        b +
        k *
        p;

      if (
        a === 0 ||
        a === c
      ) {
        continue;
      }

      const qStr =
        `${linear(
          a,
          b
        )} = ` +
        `${linear(
          c,
          d
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });
    }

    return shuffle(
      output
    );
  }


  /*
  ==================================================
  模式三
  ==================================================
  */

  while (
    output.length <
    target
  ) {
    const ans =
      makeAnswerByRatio();


    /*
    題型 A：
    單一括號
    */

    if (
      Math.random() <
      .5
    ) {
      const outer =
        nz(
          -4,
          4
        );

      const innerA =
        nz(
          -5,
          5
        );

      const innerB =
        nz(
          -8,
          8
        );

      const t =
        nz(
          -3,
          3
        );

      const c =
        outer *
        innerA -
        t *
        ans.d;

      const d =
        outer *
        innerB +
        t *
        ans.n;

      if (
        c === 0 ||
        Math.abs(c) >
          32 ||
        Math.abs(d) >
          50
      ) {
        continue;
      }

      const inside =
        linear(
          innerA,
          innerB
        );

      const leftBracket =
        bracketCoefficientText(
          outer,
          inside
        );

      const qStr =
        `${leftBracket} = ` +
        `${linear(
          c,
          d
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });

      continue;
    }


    /*
    ==================================================
    題型 B：
    兩組括號相減

    這裡就是本次修正重點。
    ==================================================
    */

    const firstOuter =
      nz(
        -4,
        4
      );

    const secondOuter =
      nz(
        -4,
        4
      );

    const firstX =
      nz(
        -5,
        5
      );

    const firstConst =
      rand(
        -8,
        8
      );

    const secondX =
      nz(
        -5,
        5
      );

    const secondConst =
      rand(
        -8,
        8
      );

    const leftA =
      firstOuter *
      firstX -
      secondOuter *
      secondX;

    const leftB =
      firstOuter *
      firstConst -
      secondOuter *
      secondConst;

    if (
      leftA === 0
    ) {
      continue;
    }

    const rhs =
      ratAdd(
        ratMul(
          rat(
            leftA
          ),
          ans
        ),
        rat(
          leftB
        )
      );

    if (
      !ratIsInteger(
        rhs
      ) ||
      Math.abs(
        rhs.n
      ) >
      80
    ) {
      continue;
    }

    const firstInside =
      linear(
        firstX,
        firstConst
      );

    const secondInside =
      linear(
        secondX,
        secondConst
      );

    const firstPart =
      bracketCoefficientText(
        firstOuter,
        firstInside
      );


    /*
    ★ 注意：

    不再寫：

    firstPart + " − " + secondPart

    因為這會造成：

    − −(...)

    現在由：
    signedSubtractedBracketText()

    自己決定要顯示 + 或 −。
    */

    const secondPart =
      signedSubtractedBracketText(
        secondOuter,
        secondInside
      );

    const qStr =
      `${firstPart}` +
      `${secondPart}` +
      ` = ` +
      `${integerText(
        rhs.n
      )}`;


    if (
      used.has(
        qStr
      )
    ) {
      continue;
    }

    used.add(
      qStr
    );

    output.push({
      qStr,
      ans
    });
  }

  return shuffle(
    output
  );
}

 let equationInput = null;
 function initEquationInput(){
   if(typeof window.MathExpressionInput!=="function"){
     $("normalized-preview").textContent="⚠️ 共用數學元件未載入，請確認 js/math-expression-input.js";

   }
   if(equationInput){equationInput.destroy();equationInput=null;}
   equationInput=new window.MathExpressionInput({
     mountId:"equation-answer-mount",placeholder:"請輸入 x 的值",
     allowRadical:true,allowFraction:true,allowPower:false,allowVariable:false,
     allowPlusMinus:false,validationMode:"numeric-radical",showPreview:true,
     requireSimplifiedRadical:true,requireSimplifiedFraction:true,
     requireRationalDenominator:true,toolOrder:["fraction","radical"],
     theme:{primary:"#2563eb",dark:"#1d4ed8",light:"#eff6ff",border:"#93c5fd"}
   });
 }
 function readAnswer(){
   if(!equationInput)return null;
   const checked=equationInput.validate();
   if(!checked.valid)return {invalid:true,message:checked.message||"請輸入合法的最簡數值答案。"};
   const terms=checked.terms||[];
   const nonzero=terms.filter(t=>Number(t.numerator)!==0);
   if(nonzero.some(t=>t.radicand!==1))return {invalid:true,message:"這題的 x 應為有理數，請檢查答案。"};
   const t=nonzero.find(t=>t.radicand===1);
   const n=t?Number(t.numerator):0,d=t?Number(t.denominator):1;
   if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d===0)return {invalid:true,message:"請輸入有效的整數或分數。"};
   const value=rat(n,d);
   return {value,simplest:true,raw:equationInput.getRawValue(),displayHTML:mathFracHTML(value)};
 }

音效
==================================================

function getEquationAudioContext() {
  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (
    !AudioContextClass
  ) {
    return null;
  }

  if (
    !equationAudioContext
  ) {
    equationAudioContext =
      new AudioContextClass();
  }

  return equationAudioContext;
}

async function ensureEquationAudio() {
  const context =
    getEquationAudioContext();

  if (
    !context
  ) {
    return null;
  }

  if (
    context.state ===
    "suspended"
  ) {
    try {
      await context.resume();
    } catch (
      error
    ) {
      console.warn(
        "音效系統無法啟用：",
        error
      );
    }
  }

  return (
    context.state ===
    "running"
      ? context
      : null
  );
}

async function playEquationTone({
  frequency = 440,
  duration = .18,
  type = "sine",
  volume = .14,
  delay = 0
} = {}) {
  const context =
    await ensureEquationAudio();

  if (
    !context
  ) {
    return;
  }

  const start =
    context.currentTime +
    Math.max(
      0,
      delay
    );

  const end =
    start +
    Math.max(
      .05,
      duration
    );

  const oscillator =
    context
      .createOscillator();

  const gain =
    context
      .createGain();

  oscillator.type =
    type;

  oscillator
    .frequency
    .setValueAtTime(
      frequency,
      start
    );

  gain
    .gain
    .setValueAtTime(
      .0001,
      start
    );

  gain
    .gain
    .exponentialRampToValueAtTime(
      Math.max(
        .0001,
        volume
      ),
      start +
      .02
    );

  gain
    .gain
    .exponentialRampToValueAtTime(
      .0001,
      end
    );

  oscillator
    .connect(
      gain
    );

  gain
    .connect(
      context.destination
    );

  oscillator.start(
    start
  );

  oscillator.stop(
    end
  );
}

function playGameSound(

/*
  保持原產題演算法完全不變。從已產生的 qStr 讀取等號兩側，
  以精確有理數在 x=0 與 x=1 時計算，還原係數並逐步列式。
*/
function equationHTMLToSource(html){
  const root=document.createElement("div");root.innerHTML=html;
  function recur(node){
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue;
    if(node.nodeType!==Node.ELEMENT_NODE)return "";
    if(node.classList?.contains("math-frac")){
      const top=node.querySelector(":scope > .top");
      const bottom=node.querySelector(":scope > .bottom");
      return "(("+recur(top)+")/("+recur(bottom)+"))";
    }
    return Array.from(node.childNodes).map(recur).join("");
  }
  return recur(root).replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/＝/g,"=");
}
function equationEval(expr,x){
  let s=expr.replace(/\s/g,"").replace(/(\d)(x|\()/gi,"$1*$2").replace(/(x|\))(\()/gi,"$1*$2").replace(/\)(x|\d)/gi,")*$1");
  const tokens=s.match(/\d+|x|[()+*\/-]/g)||[];
  if(tokens.join("")!==s)throw Error("無法辨識方程式格式："+s);
  let k=0;
  function atom(){
    const z=tokens[k++];
    if(z==="+")return atom();
    if(z==="-")return ratMul(rat(-1),atom());
    if(z==="("){const a=add();if(tokens[k++]!==")")throw Error("括號不完整");return a;}
    if(z==="x")return rat(x);
    if(/^\d+$/.test(z||""))return rat(Number(z));
    throw Error("算式項目錯誤："+z);
  }
  function mul(){let v=atom();while(tokens[k]==="*"||tokens[k]==="/"){const op=tokens[k++],b=atom();v=op==="*"?ratMul(v,b):ratDiv(v,b);}return v;}
  function add(){let v=mul();while(tokens[k]==="+"||tokens[k]==="-"){const op=tokens[k++],b=mul();v=op==="+"?ratAdd(v,b):ratSub(v,b);}return v;}
  const result=add();if(k!==tokens.length)throw Error("算式尚有未處理部分");return result;
}
function equationCoefficients(q){
  const source=equationHTMLToSource(q.qStr);
  const parts=source.split("=");if(parts.length!==2)throw Error("缺少等號");
  const left0=equationEval(parts[0],0),left1=equationEval(parts[0],1);
  const right0=equationEval(parts[1],0),right1=equationEval(parts[1],1);
  return {a:ratSub(left1,left0),b:left0,c:ratSub(right1,right0),d:right0};
}
function equationExpr(a,b){
  let html=coefficientXHTML(a);
  if(b.n!==0)html+=signedHTML(b,!html);
  return html||"0";
}
function equationStep(title,detail){return `<div class="solution-step"><b>${title}</b><div class="solution-math">${detail}</div></div>`;}
function equationLCM(a,b){return Math.abs(a*b)/gcd(a,b);}
function ratNeg(v){return rat(-v.n,v.d);}
function xTermHTML(value,first=false){
  const r=rat(value.n,value.d);
  if(r.n===0)return "";
  if(first)return coefficientXHTML(r);
  const abs=ratAbs(r);
  return r.n<0?` − ${coefficientXHTML(abs)}`:` + ${coefficientXHTML(abs)}`;
}
function constTermHTML(value,first=false){
  const r=rat(value.n,value.d);
  if(r.n===0)return "";
  if(first)return mathFracHTML(r,true);
  const abs=ratAbs(r);
  return r.n<0?` − ${mathFracHTML(abs,false)}`:` + ${mathFracHTML(abs,false)}`;
}
function partsToHTML(parts,fallback="0"){
  return parts.filter(Boolean).join("")||fallback;
}
function equationTermParts(expr){
  const result=[];
  let depth=0,begin=0;
  const text=expr.replace(/\s/g,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==="(")depth++;
    else if(ch===")")depth--;
    else if(depth===0&&i>begin&&(ch==="+"||ch==="-")){
      result.push(text.slice(begin,i));
      begin=i;
    }
  }
  result.push(text.slice(begin));
  return result.filter(Boolean);
}
function expressionTerms(expr){
  return equationTermParts(expr).map(source=>({
    source,
    a:ratSub(equationEval(source,1),equationEval(source,0)),
    b:equationEval(source,0)
  }));
}
function equationPrettySource(source){
  let s=source.trim().replace(/\*/g,"×").replace(/-/g,"−");
  // 保留上下分數；完整分式先還原為可閱讀的直式版面。
  s=s.replace(/\(\((.*?)\)\/\((\d+)\)\)/g,(_,numerator,denominator)=>
    stackedFractionHTML(numerator,denominator));
  s=s.replace(/\(([^()]*)\)\/(\d+)/g,(_,numerator,denominator)=>
    stackedFractionHTML(numerator,denominator));
  return s;
}
function mathOuterBracket(content,source=""){
  // 分式解析器的 ((分子)/(分母)) 不是數學題目中的小括號。
  // 是否使用中括號，只檢查學生實際看得到的內層數學括號。
  const shown=String(content).trim();
  const visible=shown.replace(/<[^>]*>/g,"");
  const realInnerBrackets=/[（(][^()（）]*[)）]/.test(visible);
  const isFraction=shown.includes('class="math-frac"');
  const isCompound=/[＋+−-]/.test(visible.slice(1));
  if(!isFraction && !isCompound && !realInnerBrackets)return shown;
  return realInnerBrackets?`[${shown}]`:`(${shown})`;
}
function scaledDenominators(source){
  const den=[];
  for(const m of source.matchAll(/\/(?:\((\d+)\)|(\d+))/g))den.push(Number(m[1]||m[2]));
  return den;
}
function scaledExpressionTerms(terms,multiple){
  const evaluated=terms.map(t=>{
    const a=ratMul(t.a,rat(multiple)),b=ratMul(t.b,rat(multiple));
    return {a,b};
  });
  return evaluated;
}
function formatTermGroup(terms){
  let output="";
  for(const t of terms){
    const expr=equationExpr(t.a,t.b);
    if(expr==="0")continue;
    const neg=expr.startsWith("−");
    const abs=neg?expr.slice(1):expr;
    output+=output?(neg?` − ${abs}`:` + ${abs}`):(neg?`−${abs}`:abs);
  }
  return output||"0";
}
function expandedExpression(terms){
  let output="";
  for(const t of terms){
    for(const item of [{r:t.a,isX:true},{r:t.b,isX:false}]){
      if(item.r.n===0)continue;
      const neg=item.r.n<0;
      const val=item.isX?coefficientXHTML(ratAbs(item.r)):mathFracHTML(ratAbs(item.r));
      output+=output?(neg?` − ${val}`:` + ${val}`):(neg?`−${val}`:val);
    }
  }
  return output||"0";
}
function cancelOneTerm(t,multiple){
  const raw=t.source.replace(/\s/g,"");
  // Original mathematical fraction from the workbook: ((numerator)/(denominator)).
  // Reduce the multiple against the denominator before distributing parentheses.
  const match=raw.match(/^([+-]?)\(\((.*)\)\/\((\d+)\)\)$/);
  if(match){
    const sign=match[1],numerator=match[2],den=Number(match[3]);
    if(multiple%den===0){
      const factor=multiple/den;
      let n=numerator.replace(/\*/g,"").replace(/-/g,"−");
      const bracketed=/[+−]/.test(n.slice(1));
      if(bracketed)n=n.includes("(")?`[${n}]`:`(${n})`;
      const value=factor===1?n:`${factor}${n}`;
      return {sign,value};
    }
  }
  const multiplied={a:ratMul(t.a,rat(multiple)),b:ratMul(t.b,rat(multiple))};
  const value=equationExpr(multiplied.a,multiplied.b);
  if(value.startsWith("−"))return {sign:"-",value:value.slice(1)};
  return {sign:"",value};
}
function cancelledExpression(terms,multiple){
  return terms.map((t,i)=>{
    const v=cancelOneTerm(t,multiple);
    return (i===0?(v.sign?"−":""):(v.sign?" − ":" + "))+v.value;
  }).join("")||"0";
}
function scaledDisplay(terms,multiple){
  return terms.map((t,i)=>{
    const source=equationPrettySource(t.source);
    const neg=t.source[0]==="-";
    const positive=source.replace(/^[＋+−-]/,"").trim();
    // 分式保持直式；第一層小括號，已有數學小括號才使用中括號。
    const item=`${mathOuterBracket(positive,t.source)} × ${multiple}`;
    return (i===0?(neg?"−":""):(neg?" − ":" + "))+item;
  }).join("")||"0";
}
function buildEquationSolution(q){
  const out=[];
  const add=(title,math)=>{
    if(math&&String(math).trim())out.push(equationStep(`步驟${out.length+1}｜${title}`,math));
  };
  const root=`<div class="solution-title">📘 完整詳解</div>`;
  try{
    const {a,b,c,d}=equationCoefficients(q);
    const coef=ratSub(a,c),rhs=ratSub(d,b);
    if(coef.n===0)throw Error('一元一次方程式係數為零');
    const result=ratDiv(rhs,coef);
    if(!ratEq(result,q.ans))throw Error('題目係數與答案不符');
    add('原方程式',questionHTML(q));
    if(mode===1){
      add('兩邊同除以 x 的係數',`x ＝ ${mathFracHTML(d)} ÷ (${mathFracHTML(a)}) ＝ <strong>${mathFracHTML(result)}</strong>`);
      return root+out.join('');
    }
    const source=equationHTMLToSource(q.qStr);
    const sides=source.split('=');
    if(sides.length!==2)throw Error('無法分隔左右式');
    let leftTerms=expressionTerms(sides[0]),rightTerms=expressionTerms(sides[1]);
    const originalLeft=equationExpr(a,b), originalRight=equationExpr(c,d);
    const simplified=`${originalLeft} ＝ ${originalRight}`;
    const stripped=(t)=>t.replace(/<[^>]+>/g,'').replace(/\s+/g,'').replace(/[−－]/g,'-');

    if(mode===4){
      const allDen=[...scaledDenominators(source),...leftTerms.flatMap(t=>[t.a.d,t.b.d]),...rightTerms.flatMap(t=>[t.a.d,t.b.d])];
      const lcm=allDen.reduce((n,x)=>equationLCM(n,x),1);
      if(lcm>1){
        add(`兩邊各項同乘 ${lcm}`,`${scaledDisplay(leftTerms,lcm)} ＝ ${scaledDisplay(rightTerms,lcm)}`);
        leftTerms=scaledExpressionTerms(leftTerms,lcm);
        rightTerms=scaledExpressionTerms(rightTerms,lcm);
        // Distribute and retain individual x and constant terms; only combine in the following step.
        add('消去分母，先整理乘法與括號',`${cancelledExpression(expressionTerms(sides[0]),lcm)} ＝ ${cancelledExpression(expressionTerms(sides[1]),lcm)}`);
        const distributed=`${expandedExpression(leftTerms)} ＝ ${expandedExpression(rightTerms)}`;
        if(stripped(distributed)!==stripped(`${cancelledExpression(expressionTerms(sides[0]),lcm)} ＝ ${cancelledExpression(expressionTerms(sides[1]),lcm)}`)){
          add('利用分配律乘開',distributed);
        }
      }else if(stripped(q.qStr)!==stripped(simplified)){
        add('去括號、分配律乘開',`${expandedExpression(leftTerms)} ＝ ${expandedExpression(rightTerms)}`);
      }
    }else if(mode===3 && stripped(q.qStr)!==stripped(simplified)){
      add('去括號，利用分配律乘開',`${expandedExpression(leftTerms)} ＝ ${expandedExpression(rightTerms)}`);
    }

    const A=leftTerms.reduce((v,t)=>ratAdd(v,t.a),rat(0));
    const B=leftTerms.reduce((v,t)=>ratAdd(v,t.b),rat(0));
    const C=rightTerms.reduce((v,t)=>ratAdd(v,t.a),rat(0));
    const D=rightTerms.reduce((v,t)=>ratAdd(v,t.b),rat(0));
    const arranged=`${equationExpr(A,B)} ＝ ${equationExpr(C,D)}`;
    const last=out[out.length-1]||"";
    if(!last.includes(arranged)&&stripped(arranged)!==stripped(q.qStr)){
      add('整理方程式',arranged);
    }

    const moveLeft=partsToHTML([xTermHTML(A,true),xTermHTML(ratNeg(C),false)]);
    const moveRight=partsToHTML([constTermHTML(D,true),constTermHTML(ratNeg(B),false)]);
    const moved=`${moveLeft} ＝ ${moveRight}`;
    add('移項：一次項移左邊，常數項移右邊',moved);

    const newCoef=ratSub(A,C),newRhs=ratSub(D,B);
    const combined=`${coefficientXHTML(newCoef)} ＝ ${mathFracHTML(newRhs)}`;
    if(stripped(moved)!==stripped(combined))add('合併同類項',combined);

    if(newCoef.n===newCoef.d){
      add('解得',`<strong>x ＝ ${mathFracHTML(result)}</strong>`);
    }else{
      add('兩邊同除以 x 的係數',`x ＝ ${mathFracHTML(newRhs)} ÷ (${mathFracHTML(newCoef)}) ＝ <strong>${mathFracHTML(result)}</strong>`);
    }
    return root+out.join('');
  }catch(err){
    console.warn('詳解計算失敗',err);
        return root+equationStep('原方程式',questionHTML(q))+
      equationStep('檢查提醒','此題詳解無法通過數學一致性檢查，請通知老師檢查題目；系統不應將單一答案當作完整推導。');
  }
}
/*
==================================================
檢查答案
==================================================
*/

function check() {
  if (
    locked
  ) {
    return;
  }

  const q =
    questions[
      index
    ];

  const answer =
    readAnswer();

  if (
    !answer
  ) {
    $("feedback")
      .innerHTML =
        '<span style="color:#d97706">請完整輸入答案。</span>';

    return;
  }

  if(answer.invalid){$("feedback").textContent=answer.message;return;}
  if (
    !answer.simplest
  ) {
    $("feedback")
      .innerHTML =
        '<span style="color:#d97706">分數尚未化成最簡分數。</span>';

    return;
  }

  const ok =
    ratEq(
      answer.value,
      q.ans
    );

  locked =
    true;

  disableAnswerInputs();

  if (
    ok
  ) {
    correct++;

    playGameSound(
      "playCorrect"
    );
  } else {
    wrong++;

    playGameSound(
      "playWrong"
    );
  }

  records.push({
    number:
      index + 1,

    question:
      q,

    userParsed:
      answer.value,

    userRaw:
      answer.raw,

    ok
  });

  const ansHTML =
    mathFracHTML(
      q.ans
    );

  $("feedback")
    .innerHTML =
      (
        ok
          ? '<span style="color:#15803d">✨ 正確！</span>'
          : `<span style="color:#b91c1c">❌ 答案不正確，正確答案是 x ＝ ${ansHTML}</span>`
      ) +
      `<div class="solution">` +
        `方程式之解為：x ＝ ${ansHTML}` +
      `</div>`;

  $("full-solution").innerHTML=buildEquationSolution(q);
  $("full-solution").classList.remove("hidden");
  nextTimer =
    setTimeout(
      () => {
        $("submit-btn")
          .classList
          .add(
            "hidden"
          );

        $("next-btn")
          .classList
          .remove(
            "hidden"
          );

        $("next-btn")
          .textContent =
            index ===
              totalQuestions() - 1
              ? "查看測驗結果（Enter）"
              : "下一題（Enter）";

        nextReady =
          true;

        $("next-btn")
          .focus();
      },
      ok
        ? 850
        : 1200
    );
}

function rating(score) {

    score >= 90
  ) {
    return {
      stars:
        "★★★★★",

      comment:
        "太棒了！你已經完全掌握一元一次方程式的解法。"
    };
  }

  if (
    score >= 80
  ) {
    return {
      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意移項與負號就更完美。"
    };
  }

  if (
    score >= 60
  ) {
    return {
      stars:
        "★★★☆☆",

      comment:
        "已掌握基本概念，繼續練習會更熟練。"
    };
  }

  return {
    stars:
      "★★☆☆☆",

    comment:
      "多加利用計算紙慢慢化簡，再挑戰一次！"
  };
}

async function saveCurrentScore(
  score
) {
  if (
    scoreSaved
  ) {
    return;
  }

  scoreSaved =
    true;

  const status =
    $("save-status");

  status.textContent =
    "☁️ 正在儲存本次成績……";

  try {
    const result =
      await saveGameScore({
        game:
          GAME_ID,

        score,

        correctCount:
          correct,

        wrongCount:
          wrong,

        maxCombo:
          0,

        playTime:
          finalElapsed,

        mode:
          String(
            mode
          )
      });

    if (
      result.success
    ) {
      status.textContent =
        "✅ 本次成績已儲存。";

      status.style.color =
        "#15803d";

      return;
    }

    if (
      result.reason ===
      "not-logged-in"
    ) {
      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";

      status.style.color =
        "#b45309";

      return;
    }

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {
    console.error(
      "成績儲存失敗：",
      error
    );

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";
  }
}

async function showResult() {
  clearInterval(

  playGameSound(

  );

  finalElapsed =

      (
        Date.now() -

  const result =

    );

  $("progress-bar")
    .style
    .width =
      "100%";

  showOnly(

  );

  $("final-score")

      `${score} 分`;

  $("final-stars")
    .textContent =

  $("final-comment")
    .textContent =
      result.comment;

  $("final-correct")
    .textContent =
      correct;

  $("final-wrong")
    .textContent =

  $("final-time")
    .textContent =
      `${String(
        Math.floor(

          60
        )
      ).padStart(
        2,
        "0"
      )}:${String(
        finalElapsed %

      ).padStart(
        2,
        "0"
      )}`;

function showReview() {
  const wrongRecords =
    records.filter(
      record =>
        !record.ok
    );

  const box =
    $("review-list");

  if (
    wrongRecords.length ===
    0
  ) {
    box.innerHTML =
      '<div class="grade-card">全部答對，沒有需要回顧的錯題！</div>';
  } else {
    box.innerHTML =
      wrongRecords
        .map(
          record => {
            return (
              `<article class="review-card">` +

                `<div class="review-title">` +
                  `第 ${record.number} 題 ❌` +
                `</div>` +

                `<div class="review-problem">` +
                  `${normalizeUnitBracketCoefficients(
                    record.question.qStr
                  )}` +
                `</div>` +

                `<div class="review-answer">` +
                  `你的答案：<b>x ＝ ${mathFracHTML(
                    record.userParsed
                  )}</b><br>` +
                  `正確答案：<b>x ＝ ${mathFracHTML(
                    record.question.ans
                  )}</b>` +
                `</div>` +
                `<div class="review-explanation">${buildEquationSolution(record.question)}</div>` +
              `</article>`
            );
          }
        )
        .join("");
  }

  showOnly(
    "review-screen"
  );
}


/*
==================================================
模式選擇
==================================================
*/

function modeSelect() {
  clearInterval(
    timer
  );

  clearTimeout(
    nextTimer
  );

  $("save-status")
    .textContent =
      "";

  $("progress-bar")
    .style
    .width =
      "0%";

  showOnly(
    "start-screen"
  );
}


/*
==================================================
事件
==================================================
*/

// 模式卡片整張都可直接啟動（包含原本預先勾選的第一張）。
document.querySelectorAll("#start-screen .mode-card").forEach(card=>{
  card.setAttribute("tabindex","0");
  card.setAttribute("role","button");
  const openMode=()=>{
    if(!$('start-screen').classList.contains('hidden')){
      const radio=card.querySelector('input[name="mode"]');
      if(radio) radio.checked=true;
      startGame(false);
    }
  };
  card.addEventListener("click",event=>{
    event.preventDefault();
    openMode();
  });
  card.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){
      event.preventDefault();
      openMode();
    }
  });
});

$("start-btn")
  .addEventListener(
    "click",
    () => {
      startGame(
        false
      );
    }
  );

$("change-mode-btn")
  .addEventListener(
    "click",
    () => {if(confirm("確定要重選模式嗎？目前測驗進度將不會保留。"))modeSelect();}
  );

$("result-change-mode-btn")
  .addEventListener(
    "click",
    modeSelect
  );

$("review-mode-btn")
  .addEventListener(
    "click",
    modeSelect
  );

$("submit-btn")
  .addEventListener(
    "click",
    check
  );

$("next-btn")
  .addEventListener(
    "click",
    next
  );

$("reset-btn")
  .addEventListener(
    "click",
    () => {if(confirm("確定重新測驗嗎？目前作答進度將不會保留。"))startGame(true);}
  );

$("again-btn")
  .addEventListener(
    "click",
    () => {
      startGame(
        true
      );
    }
  );

$("review-again-btn")
  .addEventListener(
    "click",
    () => {
      startGame(
        true
      );
    }
  );

$("review-btn")
  .addEventListener(
    "click",
    showReview
  );

$("review-back-btn")
  .addEventListener(
    "click",
    () => {
      showOnly(
        "result-screen"
      );
    }
  );



document.addEventListener(
  "keydown",
  event => {
    if(event.target?.closest?.('.mei-special-editor'))return;
    if (
      event.key !==
        "Enter" ||
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {
      return;
    }

    event.preventDefault();

    if (
      nextReady
    ) {
      next();
    } else if (
      !locked
    ) {
      check();
    }
  }
);

Header + 計算紙

window.addEventListener(
  "DOMContentLoaded",
  () => {
    if (
      window
        .MathGameCommonHeader
    ) {
      window
        .MathGameCommonHeader
        .init({
          mountId:
            "commonHeaderMount",

          basePath:
            "../"
        });
    }

    const buttonMount =
      $("scratchpad-mobile-button");

    const openButton =
      $("scratchpadOpenButton");

    if (
      buttonMount &&
      openButton
    ) {
      buttonMount
        .appendChild(
          openButton
        );
    }
  }
);
