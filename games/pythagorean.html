<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  畢氏定理大挑戰｜數學遊戲樂園
</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='%2317324D'/%3E%3Cpath d='M15 49V15L49 49Z' fill='%23149B92' stroke='%23FFFFFF' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M15 38H26V49' fill='none' stroke='%23F59E0B' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='48' cy='16' r='6' fill='%23FDE68A'/%3E%3C/svg%3E"
  >

<link
  rel="stylesheet"
  href="../css/scratchpad.css"
>

<style>

* {
  box-sizing: border-box;
}

:root {

  --navy: #17324d;
  --navy-dark: #0f2438;

  --teal: #149b92;
  --teal-dark: #0b746e;
  --teal-light: #e7f8f6;

  --blue: #3182ce;
  --blue-dark: #1e5e9b;

  --orange: #f59e0b;
  --orange-dark: #c97900;

  --text: #1f2937;
  --muted: #64748b;

  --success: #15803d;
  --danger: #c62828;
  --warning: #b45309;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 16px;

  font-family:
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;

  color: var(--text);

  background:
    linear-gradient(
      rgba(49,130,206,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(49,130,206,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      135deg,
      #edf8fa,
      #fffaf0
    );

  background-size:
    26px 26px,
    26px 26px,
    auto;
}

button,
input,
select {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

.page-shell {

  width:
    min(
      100%,
      1040px
    );

  margin:
    0 auto;
}

#commonHeaderMount {
  margin-bottom: 14px;
}

.game-shell {

  overflow: hidden;

  border:
    1px solid
    #d7e7e7;

  border-radius: 30px;

  background:
    rgba(
      255,
      255,
      255,
      .98
    );

  box-shadow:
    0 18px 45px
    rgba(
      15,
      36,
      56,
      .13
    );
}


/* ==================================================
Hero
================================================== */

.hero {

  position: relative;

  overflow: hidden;

  padding:
    28px 24px 26px;

  text-align: center;

  color: white;

  background:
    linear-gradient(
      135deg,
      #16324f 0%,
      #1b5067 58%,
      #168d86 100%
    );
}

.hero-icon {

  display: inline-flex;

  justify-content: center;

  align-items: center;

  width: 58px;

  height: 58px;

  margin-bottom: 8px;

  border:
    2px solid
    rgba(
      255,
      255,
      255,
      .48
    );

  border-radius: 18px;

  background:
    rgba(
      255,
      255,
      255,
      .12
    );

  font-size: 34px;
}

.game-title {

  margin: 0;

  font-size:
    clamp(
      31px,
      5vw,
      44px
    );

  font-weight: 900;
}

.game-subtitle {

  max-width: 760px;

  margin:
    10px auto 0;

  color:
    #d8f4f2;

  line-height: 1.8;
}

.concept-strip {

  display: flex;

  justify-content: center;

  gap: 8px;

  margin-top: 16px;

  flex-wrap: wrap;
}

.concept-chip {

  padding:
    7px 12px;

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .42
    );

  border-radius: 999px;

  background:
    rgba(
      255,
      255,
      255,
      .11
    );

  font-size: 13px;

  font-weight: 900;
}

.screen {
  padding: 24px;
}


/* ==================================================
數學符號
================================================== */

math {

  font-family:
    "Cambria Math",
    "Times New Roman",
    serif;

  vertical-align: middle;
}

.math-inline {

  display: inline-block;

  vertical-align: middle;
}


  /* ==================================================
  最新統一根號顯示
  與「根式運算大挑戰」目前確認版本相同
  ================================================== */

  .display-radical {

    position: relative;

    display: inline-flex;

    align-items: center;

    min-width: 1.15em;
    min-height: 1.55em;

    padding:
      .15em .10em .02em .78em;

    margin:
      0 .04em;

    vertical-align: middle;
  }


  .display-radical-svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    pointer-events: none;
  }


  .display-radical-path {

    fill: none;

    stroke: currentColor;

    stroke-width: 3.6;

    stroke-linejoin: round;
    stroke-linecap: round;

    vector-effect: non-scaling-stroke;
  }


  .display-radicand {

    position: relative;

    z-index: 2;

    display: inline-flex;

    align-items: baseline;

    white-space: nowrap;

    padding:
      .035em .12em .02em .12em;

    transform:
      translateY(.02em);
  }


  .display-radicand.display-radicand-complex {

    padding-left: .34em;
    padding-top: .07em;

    transform:
      translateY(.045em);
  }


  .display-fraction {

    display: inline-flex;

    flex-direction: column;

    justify-content: center;
    align-items: stretch;

    min-width: 1.8em;

    margin:
      0 .12em;

    vertical-align: middle;
  }


  .display-fraction-top,
  .display-fraction-bottom {

    display: flex;

    justify-content: center;
    align-items: center;

    padding:
      .08em .18em;
  }


  .display-fraction-top {

    border-bottom:
      2.5px solid
      currentColor;
  }


/*
==================================================
★ 線段 AB 專用符號
不依賴 MathML mover
Safari / iPad 穩定顯示
==================================================
*/

.segment-symbol {

  position: relative;

  display: inline-flex;

  justify-content: center;

  align-items: center;

  min-width: 1.65em;

  padding-top: .18em;

  margin:
    0 .07em;

  line-height: 1;

  font-family:
    "Cambria Math",
    "Times New Roman",
    serif;

  font-style: italic;

  vertical-align: middle;
}

.segment-symbol::before {

  content: "";

  position: absolute;

  left: .04em;

  right: .04em;

  top: 0;

  height: 1.8px;

  border-radius: 999px;

  background:
    currentColor;
}


/* ==================================================
模式
================================================== */

.mode-intro {

  margin-bottom: 18px;

  text-align: center;
}

.mode-intro h2 {

  margin: 0;

  color:
    var(--navy);
}

.mode-grid {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(
        0,
        1fr
      )
    );

  gap: 17px;
}

.mode-card {

  min-height: 245px;

  padding: 22px;

  border:
    2px solid
    #d5e7e6;

  border-radius: 22px;

  background: white;

  text-align: left;

  cursor: pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.mode-card:hover {

  transform:
    translateY(
      -4px
    );

  box-shadow:
    0 12px 26px
    rgba(
      15,
      50,
      77,
      .12
    );
}

.mode-top {

  display: flex;

  align-items: center;

  gap: 11px;

  margin-bottom: 13px;
}

.mode-icon {

  width: 47px;

  height: 47px;

  display: flex;

  justify-content: center;

  align-items: center;

  border-radius: 15px;

  background:
    var(--teal-light);

  font-size: 27px;
}

.mode-number {

  color:
    var(--teal-dark);

  font-size: 13px;

  font-weight: 900;
}

.mode-card h3 {

  margin:
    2px 0 0;

  color:
    var(--navy);

  font-size: 20px;
}

.mode-card p {

  margin: 0;

  color:
    var(--muted);

  line-height: 1.7;
}

.mode-example {

  margin-top: 12px;

  padding:
    10px 12px;

  border-radius: 12px;

  background:
    #f8fafc;

  color:
    #475569;

  font-size: 14px;

  font-weight: 800;

  line-height: 1.65;
}


/* ==================================================
狀態
================================================== */

.quiz-topbar {

  display: grid;

  grid-template-columns:
    1.35fr
    repeat(
      4,
      1fr
    );

  gap: 10px;

  margin-bottom: 12px;
}

.status-box {

  min-height: 68px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  padding: 9px;

  border:
    1px solid
    #dbe8eb;

  border-radius: 15px;

  background:
    #f4fafb;

  color:
    var(--navy);

  text-align: center;

  font-size: 13px;

  font-weight: 900;
}

.status-value {

  margin-top: 4px;

  color:
    var(--teal-dark);

  font-size: 18px;
}

.timer-box {

  background:
    #fff8ea;

  color:
    #b45309;
}


/* ==================================================
計算紙
================================================== */

.scratchpad-row {

  display: flex;

  justify-content: center;

  min-height: 54px;

  margin:
    2px 0 12px;
}

#scratchpad-mobile-button {

  width: 100%;

  display: flex;

  justify-content: center;
}

#scratchpad-mobile-button
#scratchpadOpenButton,

#scratchpad-mobile-button
.scratchpad-open-button {

  position:
    static !important;

  inset:
    auto !important;

  transform:
    none !important;

  margin:
    0 !important;
}


/* ==================================================
進度
================================================== */

.progress-shell {

  height: 9px;

  margin-bottom: 18px;

  overflow: hidden;

  border-radius: 999px;

  background:
    #e2e8f0;
}

.progress-bar {

  width: 0%;

  height: 100%;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      var(--teal),
      #45c5bb
    );

  transition:
    width .2s ease;
}


/* ==================================================
題目
================================================== */

.question-stage {

  display: grid;

  grid-template-columns:
    minmax(
      280px,
      .9fr
    )
    minmax(
      320px,
      1.1fr
    );

  gap: 18px;
}

.diagram-card,
.question-card {

  min-height: 330px;

  border:
    2px solid
    #d7e7e8;

  border-radius: 22px;

  background: white;
}

.diagram-card {

  position: relative;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 18px;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #f7fcfc,
      #ffffff
    );
}

.diagram-card::before {

  content: "";

  position: absolute;

  inset: 0;

  opacity: .38;

  background:
    linear-gradient(
      #d8eeee 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      #d8eeee 1px,
      transparent 1px
    );

  background-size:
    22px 22px;
}

#diagram-content {

  position: relative;

  width: 100%;

  display: flex;

  justify-content: center;

  align-items: center;
}

.geometry-svg {

  width:
    min(
      100%,
      370px
    );

  height: auto;

  overflow: visible;
}

.question-card {

  display: flex;

  flex-direction: column;

  justify-content: center;

  padding: 24px;

  text-align: center;
}

.question-type {

  display: inline-block;

  align-self: center;

  margin-bottom: 15px;

  padding:
    6px 11px;

  border-radius: 999px;

  background:
    var(--teal-light);

  color:
    var(--teal-dark);

  font-size: 13px;

  font-weight: 900;
}

.question-label {

  color:
    var(--muted);

  font-size: 15px;

  font-weight: 800;

  line-height: 1.7;
}

.question-content {

  margin-top: 13px;

  color:
    var(--navy-dark);

  font-size:
    clamp(
      22px,
      4vw,
      33px
    );

  font-weight: 900;

  line-height: 1.7;
}

.formula-hint {

  margin-top: 18px;

  padding: 13px;

  border:
    1px dashed
    #a9ceca;

  border-radius: 14px;

  background:
    #f3fbfa;

  color:
    #466066;

  font-size: 17px;

  font-weight: 800;

  line-height: 1.7;
}

.formula-hint math {

  font-size: 1.12em;
}


/* ==================================================
答案區
================================================== */

.answer-panel {

  margin-top: 18px;

  padding: 20px;

  border:
    1px solid
    #dbe8eb;

  border-radius: 20px;

  background:
    #f8fbfc;
}

.answer-title {

  margin-bottom: 10px;

  color:
    var(--navy);

  text-align: center;

  font-weight: 900;
}

.answer-help {

  margin:
    0 0 13px;

  color:
    var(--muted);

  text-align: center;

  font-size: 14px;

  line-height: 1.65;
}


/* ==================================================
一般答案
================================================== */

.number-answer {

  display: flex;

  justify-content: center;
}

.number-answer input {

  width:
    min(
      260px,
      100%
    );

  padding: 13px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 13px;

  background: white;

  color:
    var(--navy);

  font-size: 24px;

  font-weight: 900;

  text-align: center;

  outline: none;
}


/* ==================================================
一般分數
================================================== */

.fraction-answer-wrap {

  display: flex;

  justify-content: center;
}

.fraction-answer {

  display: flex;

  flex-direction: column;

  width: 125px;
}

.fraction-answer input {

  width: 100%;

  padding:
    9px 7px;

  border:
    2px solid
    #b8d1d4;

  background: white;

  font-size: 21px;

  font-weight: 900;

  text-align: center;

  outline: none;
}

.fraction-answer
input:first-child {

  border-radius:
    11px 11px 0 0;

  border-bottom:
    2px solid
    #334155;
}

.fraction-answer
input:last-child {

  border-radius:
    0 0 11px 11px;

  border-top: 0;
}


/* ==================================================
根號答案格
================================================== */

.radical-editor-row {

  display: flex;

  justify-content: center;

  align-items: flex-end;

  gap: 12px;

  flex-wrap: wrap;
}

.radical-field {

  text-align: center;
}

.radical-field label {

  display: block;

  margin-bottom: 5px;

  color:
    var(--muted);

  font-size: 13px;

  font-weight: 900;
}

.radical-sign {

  width: 78px;

  height: 58px;

  border:
    2px solid
    #9fd9d5;

  border-radius: 11px;

  background: white;

  font-size: 22px;

  font-weight: 900;
}

.radical-coefficient {

  width: 110px;

  height: 58px;

  border:
    2px solid
    #9fd9d5;

  border-radius: 11px;

  background: white;

  font-size: 22px;

  font-weight: 900;

  text-align: center;
}

.root-svg-editor {

  position: relative;

  width: 235px;

  height: 68px;
}

.root-svg-editor svg {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  overflow: visible;

  pointer-events: none;
}

.root-svg-editor path {

  fill: none;

  stroke:
    #172033;

  stroke-width: 3.6;

  stroke-linejoin: round;

  stroke-linecap: round;

  vector-effect:
    non-scaling-stroke;
}

.root-svg-editor input {

  position: absolute;

  left: 48px;

  top: 11px;

  width: 178px;

  height: 54px;

  padding: 8px;

  border:
    2px solid
    #9fd9d5;

  border-radius: 9px;

  background: white;

  color:
    var(--navy);

  font-size: 22px;

  font-weight: 900;

  text-align: center;

  outline: none;
}


/* ==================================================
★ 根式分數重新排版
================================================== */

.radical-fraction-answer {

  display: flex;

  justify-content: center;

  width: 100%;
}


/*
整個分數
*/

.rf-fraction-stack {

  width:
    min(
      100%,
      540px
    );

  display: flex;

  flex-direction: column;

  align-items: stretch;
}


/*
整個分子：
正負號 + 係數 + 根號
*/

.rf-numerator-area {

  display: flex;

  justify-content: center;

  align-items: flex-end;

  gap: 10px;

  width: 100%;

  padding:
    0 8px 8px;
}


/*
★ 分數線
由最左直接到最右
*/

.rf-fraction-line {

  width: 100%;

  height: 2.5px;

  flex-shrink: 0;

  border-radius: 999px;

  background:
    #334155;
}


/*
分母區
*/

.rf-denominator-area {

  display: flex;

  justify-content: center;

  align-items: center;

  width: 100%;

  padding-top: 9px;
}

.rf-denominator {

  width: 130px;

  height: 54px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 10px;

  background: white;

  font-size: 22px;

  font-weight: 900;

  text-align: center;
}


/* ==================================================
選擇題
================================================== */

.choice-grid {

  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap: 10px;

  max-width: 680px;

  margin:
    0 auto;
}

.choice-button {

  min-height: 58px;

  padding: 12px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 13px;

  background: white;

  color:
    var(--navy);

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;
}

.choice-button.selected {

  border-color:
    var(--teal);

  background:
    #e5f8f6;

  color:
    var(--teal-dark);
}


/* ==================================================
目前答案
================================================== */

.answer-preview {

  max-width: 720px;

  min-height: 62px;

  display: flex;

  justify-content: center;

  align-items: center;

  margin:
    14px auto 0;

  padding:
    12px 16px;

  border:
    2px solid
    #bfe7e4;

  border-radius: 14px;

  background:
    #eaf9f7;

  color:
    #3c5660;

  text-align: center;

  font-size: 21px;

  font-weight: 900;

  line-height: 1.5;
}

.answer-preview-value {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  margin-left: 9px;

  color:
    var(--teal);

  font-size: 26px;
}

.answer-preview-value math {

  font-size: 1.15em;
}


/* ==================================================
按鈕
================================================== */

.button-row {

  display: flex;

  justify-content: center;

  gap: 10px;

  margin-top: 17px;

  flex-wrap: wrap;
}

.game-button {

  min-width: 138px;

  padding:
    12px 19px;

  border: 0;

  border-radius: 13px;

  color: white;

  background:
    var(--navy);

  font-size: 16px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 5px 0
    var(--navy-dark);
}

.game-button.primary {

  background:
    var(--teal);

  box-shadow:
    0 5px 0
    var(--teal-dark);
}

.game-button.restart {

  background:
    var(--blue);

  box-shadow:
    0 5px 0
    var(--blue-dark);
}

.game-button.secondary {

  background:
    #64748b;

  box-shadow:
    0 5px 0
    #475569;
}

.game-button.orange {

  background:
    var(--orange);

  box-shadow:
    0 5px 0
    var(--orange-dark);
}


/* ==================================================
Feedback
================================================== */

.feedback {

  min-height: 46px;

  margin-top: 14px;

  text-align: center;

  font-size: 18px;

  font-weight: 900;

  line-height: 1.8;
}

.feedback.correct {
  color: var(--success);
}

.feedback.wrong {
  color: var(--danger);
}

.feedback.warning {
  color: var(--warning);
}


/* ==================================================
詳解
================================================== */

.explanation {

  margin-top: 13px;

  padding: 18px;

  border:
    1px solid
    #cde5e4;

  border-radius: 16px;

  background:
    #edf8f8;

  color:
    #334155;

  line-height: 2;
}

.explanation-heading {

  display: flex;

  align-items: center;

  gap: 8px;

  margin:
    0 0 14px;

  color:
    var(--navy);

  font-size: 21px;

  font-weight: 900;
}

.explanation-question {

  margin-bottom: 14px;

  padding: 14px;

  border:
    1.5px solid
    #b9dddd;

  border-radius: 13px;

  background: white;
}

.explanation-question-title {

  margin-bottom: 8px;

  color:
    var(--teal-dark);

  font-weight: 900;
}

.explanation-question-math {

  color:

/* ==================================================
工具
================================================== */

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length -
      1;

    i >
      0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return a ||
    1;
}


function reduceFraction(
  numerator,
  denominator
) {

  const d =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      d,

    denominator:
      denominator /
      d
  };
}


/* ==================================================
MathML
================================================== */

function mn(
  value
) {

  return `
    <mn>${value}</mn>
  `;
}


function mi(
  value
) {

  return `
    <mi>${value}</mi>
  `;
}


function mo(
  value
) {

  return `
    <mo>${value}</mo>
  `;
}


function msup(
  base,
  exponent
) {

  return `

    <msup>

      ${base}

      ${mn(
        exponent
      )}

    </msup>
  `;
}


function msqrt(
  content
) {

  return `

    <msqrt>

      ${content}

    </msqrt>
  `;
}


function mfrac(
  numerator,
  denominator
) {

  return `

    <mfrac>

      <mrow>

        ${numerator}

      </mrow>

      <mrow>

        ${denominator}

      </mrow>

    </mfrac>
  `;
}


function mathHTML(
  content
) {

  return `

    <math
      class="math-inline"
      xmlns="http://www.w3.org/1998/Math/MathML"
    >

      <mrow>

        ${content}

      </mrow>

    </math>
  `;
}


/*
==================================================
★ 線段 AB
==================================================
*/

function segmentABHTML() {

  return `

    <span class="segment-symbol">
      AB
    </span>
  `;
}


function sqrtDisplay(
  content
) {

  const source =
    String(
      content ??
      ""
    );


  const plainText =
    source
      .replace(
        /<[^>]*>/g,
        ""
      )
      .replace(
        /\s+/g,
        ""
      );


  const isComplex =

    /<sup\b|<span\b|<math\b|<mfrac\b/i
      .test(
        source
      ) ||

    /[×÷＋－+−·]/
      .test(
        plainText
      ) ||

    plainText.length >=
      5;


  const radicandClass =

    isComplex

      ? "display-radicand display-radicand-complex"

      : "display-radicand";


  return `

    <span class="display-radical">

      <svg
        class="display-radical-svg"
        viewBox="0 0 100 62"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <path
          class="display-radical-path"
          d="
            M 1 37
            L 7 37
            L 13 51
            L 18 58
            L 29 8
            L 98 8
          "
        />

      </svg>

      <span class="${radicandClass}">

        ${content}

      </span>

    </span>
  `;
}


function rootHTML(
  n
) {

  return sqrtDisplay(
    String(
      n
    )
  );
}


function radicalHTML(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient
    );


  if (
    radicand ===
    1
  ) {

    return String(
      coefficient
    );
  }


  let prefix =
    "";


  if (
    coefficient ===
    -1
  ) {

    prefix =
      "−";

  } else if (
    coefficient !==
    1
  ) {

    prefix =
      String(
        coefficient
      )
        .replace(
          "-",
          "−"
        );
  }


  return `
    <span class="math-inline">
      ${prefix}${sqrtDisplay(
        String(
          radicand
        )
      )}
    </span>
  `;
}


function fractionHTML(
  numerator,
  denominator
) {

  return mathHTML(

    mfrac(
      mn(
        numerator
      ),
      mn(
        denominator
      )
    )
  );
}


function radicalFractionHTML(
  coefficient,
  radicand,
  denominator
) {

  const sign =
    coefficient <
    0

      ? "−"

      : "";


  const absolute =
    Math.abs(
      coefficient
    );


  const coefficientText =

    absolute ===
    1

      ? ""

      : String(
          absolute
        );


  return `

    <span class="display-fraction">

      <span class="display-fraction-top">

        ${sign}${coefficientText}${sqrtDisplay(
          String(
            radicand
          )
        )}

      </span>

      <span class="display-fraction-bottom">

        ${denominator}

      </span>

    </span>
  `;
}



/*
==================================================
★ 距離公式
AB 橫線使用 CSS
根號使用 MathML
==================================================
*/

function distanceFormulaHTML() {

  const inside = `

    ${msup(
      `

        <mrow>

          ${mo(
            "("
          )}

          <msub>

            ${mi(
              "x"
            )}

            ${mn(
              2
            )}

          </msub>

          ${mo(
            "−"
          )}

          <msub>

            ${mi(
              "x"
            )}

            ${mn(
              1
            )}

          </msub>

          ${mo(
            ")"
          )}

        </mrow>
      `,
      2
    )}

    ${mo(
      "+"
    )}

    ${msup(
      `

        <mrow>

          ${mo(
            "("
          )}

          <msub>

            ${mi(
              "y"
            )}

            ${mn(
              2
            )}

          </msub>

          ${mo(
            "−"
          )}

          <msub>

            ${mi(
              "y"
            )}

            ${mn(
              1
            )}

          </msub>

          ${mo(
            ")"
          )}

        </mrow>
      `,
      2
    )}
  `;


  return `

    💡

    ${segmentABHTML()}

    ＝

    ${sqrtDisplay(
      mathHTML(
        inside
      )
    )}
  `;
}


/* ==================================================
根式化簡
================================================== */

function simplifyRoot(
  n
) {

  const exact =
    Math.sqrt(
      n
    );


  if (
    Number.isInteger(
      exact
    )
  ) {

    return {

      type:
        "number",

      value:
        exact
    };
  }


  for (
    let i =
      Math.floor(
        Math.sqrt(
          n
        )
      );

    i >=
      2;

    i--
  ) {

    const square =
      i *
      i;


    if (
      n %
      square ===
      0
    ) {

      return {

        type:
          "radical",

        coefficient:
          i,

        radicand:
          n /
          square
      };
    }
  }


  return {

    type:
      "radical",

    coefficient:
      1,

    radicand:
      n
  };
}


function isSimplestRadicand(
  n
) {

  if (
    n <=
    0
  ) {

    return false;
  }


  for (
    let i =
      2;

    i *
      i <=
      n;

    i++
  ) {

    if (
      n %
      (
        i *
        i
      ) ===
      0
    ) {

      return false;
    }
  }


  return true;
}

function calculationNumberHTML(
  value
) {

  const number =
    Number(
      value
    );


  return number <
    0

      ? `(−${Math.abs(
          number
        )})`

      : String(
          number
        );
}


function squareHTML(
  value
) {

  return `${calculationNumberHTML(
    value
  )}<sup>2</sup>`;
}


function rootSimplificationHTML(
  value
) {

  const result =
    simplifyRoot(
      value
    );


  if (
    result.type ===
    "number"
  ) {

    return `

      <span class="explanation-math-line">

        ${rootHTML(
          value
        )}

        ＝

        ${result.value}

      </span>

      因為 ${value}＝${result.value}<sup>2</sup>，
      而長度取正值，所以平方根取 ${result.value}。
    `;
  }


  if (
    result.coefficient ===
    1
  ) {

    return `

      <span class="explanation-math-line">

        ${rootHTML(
          value
        )}

      </span>

      ${value} 已沒有大於 1 的完全平方因數，
      所以這已經是最簡根式。
    `;
  }


  const squareFactor =
    result.coefficient *
    result.coefficient;


  return `

    先找出 ${value} 中最大的完全平方因數：

    <span class="explanation-math-line">

      ${value}
      ＝
      ${squareFactor}
      ×
      ${result.radicand}
      ＝
      ${result.coefficient}<sup>2</sup>
      ×
      ${result.radicand}

    </span>

    再把完全平方因數提出根號外：

    <span class="explanation-math-line">

      ${rootHTML(
        value
      )}
      ＝
      ${sqrtDisplay(
        `${result.coefficient}<sup>2</sup> × ${result.radicand}`
      )}
      ＝
      ${radicalHTML(
        result.coefficient,
        result.radicand
      )}

    </span>
  `;
}

function altitudeSVG(
  a,

) {

  const R = {
    x: 185,
    y: 48
  };


  const A = {
    x: 65,
    y: 185
  };


  const B = {
    x: 305,
    y: 215
  };


  const abx =
    B.x -
    A.x;


  const aby =
    B.y -
    A.y;


  const arx =
    R.x -
    A.x;


  const ary =
    R.y -
    A.y;


  const t =
    (
      arx *
      abx +
      ary *
      aby
    ) /
    (
      abx *
      abx +
      aby *
      aby
    );


  const H = {

    x:
      A.x +
      t *
      abx,

    y:
      A.y +
      t *
      aby
  };


  const abLength =
    Math.hypot(
      abx,
      aby
    );


  const tx =
    abx /
    abLength;


  const ty =
    aby /
    abLength;


  const hrx =
    R.x -
    H.x;


  const hry =
    R.y -
    H.y;


  const hrLength =
    Math.hypot(
      hrx,
      hry
    );


  const nx =
    hrx /
    hrLength;


  const ny =
    hry /
    hrLength;


  const hm =
    13;

      hm,

  return `

function coordinateSVG(
  x1,
  y1,
  x2,
  y2
) {

  const width =
    380;


  const height =
    300;


  const originX =
    width /
    2;


  const originY =
    height /
    2;


  const maxValue =
    Math.max(
      4,
      Math.abs(
        x1
      ),
      Math.abs(
        x2
      ),
      Math.abs(
        y1
      ),
      Math.abs(
        y2
      )
    ) +
    1;


  const scale =
    Math.min(
      150 /
      maxValue,
      115 /
      maxValue
    );


  const mapX =
    x =>
      originX +
      x *
      scale;


  const mapY =
    y =>
      originY -
      y *
      scale;


  const ax =
    mapX(
      x1
    );


  const ay =
    mapY(
      y1
    );


  const bx =
    mapX(
      x2
    );


  const by =
    mapY(
      y2
    );


  let grid =
    "";


  for (
    let i =
      -maxValue;

    i <=
      maxValue;

    i++
  ) {

    const gx =
      mapX(
        i
      );


    const gy =
      mapY(
        i
      );


    grid += `

      <line
        x1="${gx}"
        y1="20"
        x2="${gx}"
        y2="${height - 20}"
        stroke="#dcebed"
        stroke-width="1"
      />

      <line
        x1="20"
        y1="${gy}"
        x2="${width - 20}"
        y2="${gy}"
        stroke="#dcebed"
        stroke-width="1"
      />
    `;
  }


  return `

    <svg
      class="geometry-svg"
      viewBox="0 0 ${width} ${height}"
    >

      ${grid}

      <line
        x1="20"
        y1="${originY}"
        x2="${width - 20}"
        y2="${originY}"
        stroke="#64748b"
        stroke-width="3"
      />

      <line
        x1="${originX}"
        y1="20"
        x2="${originX}"
        y2="${height - 20}"
        stroke="#64748b"
        stroke-width="3"
      />


      <line
        x1="${ax}"
        y1="${ay}"
        x2="${bx}"
        y2="${by}"
        stroke="#149b92"
        stroke-width="5"
        stroke-linecap="round"
      />


      <line
        x1="${ax}"
        y1="${ay}"
        x2="${ax}"
        y2="${originY}"
        stroke="#94a3b8"
        stroke-width="2.5"
        stroke-dasharray="7 6"
      />

      <line
        x1="${ax}"
        y1="${ay}"
        x2="${originX}"
        y2="${ay}"
        stroke="#94a3b8"
        stroke-width="2.5"
        stroke-dasharray="7 6"
      />


      <line
        x1="${bx}"
        y1="${by}"
        x2="${bx}"
        y2="${originY}"
        stroke="#94a3b8"
        stroke-width="2.5"
        stroke-dasharray="7 6"
      />

      <line
        x1="${bx}"
        y1="${by}"
        x2="${originX}"
        y2="${by}"
        stroke="#94a3b8"
        stroke-width="2.5"
        stroke-dasharray="7 6"
      />


      <circle
        cx="${ax}"
        cy="${ay}"
        r="8"
        fill="#3182ce"
      />


      <circle
        cx="${bx}"
        cy="${by}"
        r="8"
        fill="#f59e0b"
      />


      <text
        x="${ax - 54}"
        y="${ay + 30}"
        font-size="18"
        font-weight="900"
        fill="#17324d"
      >
        A(${x1}, ${y1})
      </text>


      <text
        x="${bx + 8}"
        y="${by - 15}"
        font-size="18"
        font-weight="900"
        fill="#17324d"
      >
        B(${x2}, ${y2})
      </text>

    </svg>
  `;
}

function makeLegQuestion() {

  let known;
  let hypotenuse;
  let difference;
  let result;


  do {

    known =
      rand(
        3,
        10
      );


    hypotenuse =
      rand(
        known +
        2,
        known +
        10
      );


    difference =

    result =

  const answerHTML =

          result.coefficient,

          x²＝${hypotenuse * hypotenuse}－${known * known}＝${difference}
        </span>`,

        `再算最長邊的平方：
        <span class="explanation-math-line">
          ${c}²＝${longSquare}
        </span>`,

        valid

          ? `因為
            <span class="explanation-math-line">
              ${shortSum}＝${longSquare}
            </span>
            符合畢氏定理的逆敘述，所以這三邊可以構成直角三角形。`

          : `因為
            <span class="explanation-math-line">
              ${shortSum}≠${longSquare}

      ],

    pitfall:

    summary:
      valid
        ? "最後答案：是直角三角形"
        : "最後答案：不是直角三角形"
  });
}

function makeAltitudeQuestion() {

  const triple =
    pick(
      [
        [3,4,5],
        [5,12,13],
        [8,15,17],
        [7,24,25],
        [20,21,29]
      ]
    );


  const [
    a,
    b,
    c
  ] =
    triple;


  const reduced =
    reduceFraction(
      a *
      b,
      c
    );


  const rawNumerator =
    a *
    b;


  const answerHTML =

    reduced.denominator ===
    1

      ? String(
          reduced.numerator
        )

      : fractionHTML(
          reduced.numerator,
          reduced.denominator
        );


  return question({

    typeLabel:
      "斜邊上的高",

    label:
      "利用三角形面積求斜邊上的高",

    html:
      `直角三角形的兩股長為 ${a}、${b}，斜邊長為 ${c}，求斜邊上的高 h。`,

    hint:
      "💡 h＝兩股乘積 ÷ 斜邊",

    diagram:
      altitudeSVG(
        a,
        b,
        c
      ),

    answerType:

      reduced.denominator ===
      1

        ? "number"

        : "fraction",

    answer:

      reduced.denominator ===
      1

        ? reduced.numerator

        : undefined,

    numerator:
      reduced.numerator,

    denominator:
      reduced.denominator,

    method:
      "斜邊上的高不是直接套畢氏定理求出；要把同一個直角三角形的面積，用「兩股」和「斜邊×高」各表示一次。",

    explanation:
      [

        `用兩股當底、高，三角形面積為：
        <span class="explanation-math-line">
          面積＝½×${a}×${b}
        </span>`,

        `改用斜邊 ${c} 當底、斜邊上的高 h 當高：
        <span class="explanation-math-line">
          面積＝½×${c}×h
        </span>`,

        `因為是同一個三角形，所以兩個面積相等：
        <span class="explanation-math-line">
          ½×${a}×${b}＝½×${c}×h
        </span>`,

        `兩邊同除以 ½，可得：
        <span class="explanation-math-line">
          ${a}×${b}＝${c}h
        </span>`,

        `解出 h：
        <span class="explanation-math-line">
          h＝${rawNumerator}/${c}
        </span>`,

        reduced.denominator ===
        1

          ? `計算後：
            <span class="explanation-math-line">
              h＝${reduced.numerator}
            </span>`

          : `把分數約成最簡分數：
            <span class="explanation-math-line">
              h＝${fractionHTML(
                reduced.numerator,
                reduced.denominator
              )}
            </span>`
      ],

    pitfall:
      "斜邊上的高 h 不是兩股中的任何一股。這一題的核心是「同一個三角形面積不變」，最後分數要約成最簡分數。",

    summary:
      `最後答案：h＝${answerHTML}`
  });
}

function makeGeneralDistanceQuestion() {

  let x1;
  let y1;
  let x2;
  let y2;


  do {

    x1 =
      rand(
        -6,
        6
      );


    y1 =
      rand(
        -6,
        6
      );


    x2 =
      rand(
        -6,
        6
      );


    y2 =
      rand(
        -6,
        6
      );

  } while (

    x1 ===
      x2 ||

    y1 ===
      y2
  );


  const dx =
    x2 -
    x1;


  const dy =
    y2 -
    y1;


  const dxSquare =
    dx *
    dx;


  const dySquare =
    dy *
    dy;


  const total =
    dxSquare +
    dySquare;


  const result =
    simplifyRoot(
      total
    );


  const answerHTML =

    result.type ===
    "number"

      ? String(
          result.value
        )

      : radicalHTML(
          result.coefficient,
          result.radicand
        );


  return question({

    typeLabel:
      "平面上兩點的距離",

    label:
      "使用兩點距離公式",

    html:
      `A(${x1}, ${y1})、B(${x2}, ${y2})，求 ${segmentABHTML()}。`,

    hint:
      distanceFormulaHTML(),

    diagram:
      coordinateSVG(
        x1,
        y1,
        x2,
        y2
      ),

    answerType:
      result.type,

    answer:
      result.value,

    coefficient:
      result.coefficient,

    radicand:
      result.radicand,

    method:
      "一般兩點距離可以看成一個直角三角形：水平距離是 x 坐標差，鉛直距離是 y 坐標差，AB 是斜邊。",

    explanation:
      [

        `先算水平距離的差：
        <span class="explanation-math-line">
          Δx＝${calculationNumberHTML(
            x2
          )}－${calculationNumberHTML(
            x1
          )}＝${dx}
        </span>`,

        `再算鉛直距離的差：
        <span class="explanation-math-line">
          Δy＝${calculationNumberHTML(
            y2
          )}－${calculationNumberHTML(
            y1
          )}＝${dy}
        </span>`,

        `利用畢氏定理／兩點距離公式：
        <span class="explanation-math-line">
          ${segmentABHTML()}²＝${squareHTML(
            dx
          )}＋${squareHTML(
            dy
          )}
        </span>`,

        `把平方算出來：
        <span class="explanation-math-line">
          ${segmentABHTML()}²＝${dxSquare}＋${dySquare}＝${total}
        </span>`,

        `因為距離為正，所以取正平方根：
        ${rootSimplificationHTML(
          total
        )}`,

        `因此：
        <span class="explanation-math-line">
          ${segmentABHTML()}＝${answerHTML}
        </span>`
      ],

    pitfall:
      "坐標相減時最容易漏掉負號。負數參與計算時請加括號，例如 3－(−2)；平方前也要保留整個差值的正負號。",

    summary:
      `最後答案：${segmentABHTML()}＝${answerHTML}`
  });
}

          Number(
            radicandRaw
          ),
          Number(
            denominatorRaw
          )
        )}

      </span>
    `;
}

/* ==================================================
讀取答案
================================================== */

function readAnswer(
  q
) {

  if (
    q.answerType ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  if (
    q.answerType ===
    "fraction"
  ) {

    const n =
      Number(
        $("fraction-numerator")
          ?.value
      );


    const d =
      Number(
        $("fraction-denominator")
          ?.value
      );


    if (
      !Number.isInteger(
        n
      ) ||
      !Number.isInteger(
        d
      ) ||
      d ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "請完整填寫正確的分子與分母。"
      };
    }


    if (
      gcd(
        n,
        d
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "這個分數還可以約分，請自行化成最簡分數。"
      };
    }


    return {

      valid:
        true,

      value: {

        numerator:
          n,

        denominator:
          d
      },

      display:
        `${n}/${d}`
    };
  }


  if (
    q.answerType ===
    "radical"
  ) {

    const sign =
      Number(
        $("radical-sign")
          .value
      );


    const coefficient =
      Number(
        $("radical-coefficient")
          .value
      );


    const radicand =
      Number(
        $("radical-radicand")
          .value
      );


    if (
      !Number.isInteger(
        coefficient
      ) ||
      coefficient <=
      0 ||
      !Number.isInteger(
        radicand
      ) ||
      radicand <=
      0
    ) {

      return {

        valid:
          false,

        message:
          "請完整填寫根式答案。"
      };
    }


    if (
      !isSimplestRadicand(
        radicand
      )
    ) {

      return {

        valid:
          false,

        message:
          `根號內的 ${radicand} 還可以化簡，請自行化成最簡根式。`
      };
    }


    return {

      valid:
        true,

      value: {

        coefficient:
          sign *
          coefficient,

        radicand
      },

      display:
        radicalHTML(
          sign *
          coefficient,
          radicand
        )
    };
  }


  if (
    q.answerType ===
    "radicalFraction"
  ) {

    const sign =
      Number(
        $("rf-sign")
          .value
      );


    const coefficient =
      Number(
        $("rf-coefficient")
          .value
      );


    const radicand =
      Number(
        $("rf-radicand")
          .value
      );


    const denominator =
      Number(
        $("rf-denominator")
          .value
      );


    if (
      !Number.isInteger(
        coefficient
      ) ||
      coefficient <=
      0 ||
      !Number.isInteger(
        radicand
      ) ||
      radicand <=
      0 ||
      !Number.isInteger(
        denominator
      ) ||
      denominator <=
      0
    ) {

      return {

        valid:
          false,

        message:
          "請完整填寫根式分數。"
      };
    }


    if (
      !isSimplestRadicand(
        radicand
      )
    ) {

      return {

        valid:
          false,

        message:
          `根號內的 ${radicand} 還可以化簡。`
      };
    }


    if (
      gcd(
        coefficient,
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號外係數與分母還可以約分。"
      };
    }


    return {

      valid:
        true,

      value: {

        coefficient:
          sign *
          coefficient,

        radicand,

        denominator
      },

      display:
        radicalFractionHTML(
          sign *
          coefficient,
          radicand,
          denominator
        )
    };
  }


  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇答案。"
    };
  }


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      q.choices
        .find(
          item =>
            item.value ===
            selectedChoice
        )
        ?.text ||
      selectedChoice
  };
}


/* ==================================================
判定
================================================== */

function checkCorrect(
  q,
  answer
) {

  if (
    q.answerType ===
    "number"
  ) {

    return (
      answer.value ===
      q.answer
    );
  }


  if (
    q.answerType ===
    "fraction"
  ) {

    return (

      answer.value.numerator ===
        q.numerator &&

      answer.value.denominator ===
        q.denominator
    );
  }


  if (
    q.answerType ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        q.coefficient &&

      answer.value.radicand ===
        q.radicand
    );
  }


  if (
    q.answerType ===
    "radicalFraction"
  ) {

    return (

      answer.value.coefficient ===
        q.coefficient &&

      answer.value.radicand ===
        q.radicand &&

      answer.value.denominator ===
        q.denominator
    );
  }


  return (
    answer.value ===
    q.answer
  );
}


/* ==================================================
正確答案
================================================== */

function correctAnswerText(
  q
) {

  if (
    q.answerType ===
    "number"
  ) {

    return String(
      q.answer
    );
  }


  if (
    q.answerType ===
    "fraction"
  ) {

    return fractionHTML(
      q.numerator,
      q.denominator
    );
  }


  if (
    q.answerType ===
    "radical"
  ) {

    return radicalHTML(
      q.coefficient,
      q.radicand
    );
  }


  if (
    q.answerType ===
    "radicalFraction"
  ) {

    return radicalFractionHTML(
      q.coefficient,
      q.radicand,
      q.denominator
    );
  }


  return q.choices
    .find(
      item =>
        item.value ===
        q.answer
    )
    ?.text ||
    q.answer;
}


/* ==================================================
詳解
================================================== */

function explanationHTML(
  q,
  userAnswer =
    "",
  isCorrect =
    true
) {

  const questionBlock = `

    <div class="explanation-heading">
      📘 完整詳解
    </div>

    <div class="explanation-question">

      <div class="explanation-question-title">
        題目
      </div>

      <div class="explanation-question-math">
        ${q.html}
      </div>

    </div>
  `;


  const compareBlock =

    !isCorrect &&
    userAnswer

      ? `

          <div class="answer-compare">

            <div class="answer-compare-box wrong">
              <strong>你的答案</strong><br>
              ${userAnswer}
            </div>

            <div class="answer-compare-box correct">
              <strong>正確答案</strong><br>
              ${correctAnswerText(
                q
              )}
            </div>

          </div>
        `

      : "";


  const methodBlock =

    q.method

      ? `

          <div class="explanation-method">
            <strong>先想一想｜</strong>
            ${q.method}
          </div>
        `

      : "";


  const steps =
    q.explanation
      .map(
        (
          step,
          i
        ) => `

          <div class="explanation-step">

            <strong>
              步驟 ${i + 1}｜
            </strong>

            ${step}

          </div>
        `
      )
      .join("");


  const pitfallBlock =

    q.pitfall

      ? `

          <div class="explanation-tip">
            <strong>⚠️ 常見錯誤｜</strong>
            ${q.pitfall}
          </div>
        `

      : "";


  const summaryBlock =

    q.summary

      ? `

          <div class="explanation-summary">
            ✅ ${q.summary}
          </div>
        `

      : `

          <div class="explanation-summary">
            ✅ 最後答案：${finalAnswerForQuestion(
              q
            )}
          </div>
        `;


  return (
    questionBlock +
    compareBlock +
    methodBlock +
    steps +
    pitfallBlock +
    summaryBlock
  );
}



/* ==================================================
提交
================================================== */

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const q =
    questions[
      index
    ];


  const answer =
    readAnswer(
      q
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  const isCorrect =
    checkCorrect(
      q,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            q
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push({

    number:
      index +
      1,

    question:
      q,

    userAnswer:
      answer.display,

    correct:
      isCorrect
  });


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        q,
        answer.display,
        isCorrect
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}

/* ==================================================
時間
================================================== */

function formatTime(
  seconds
) {

  const minute =
    Math.floor(
      seconds /
      60
    );


  const second =
    seconds %
    60;


  return (
    `${String(minute).padStart(2,"0")}:` +
    `${String(second).padStart(2,"0")}`
  );
}


function stopTimer() {

  if (
    timerId
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  if (
    timerId
  ) {

    clearInterval(
      timerId
    );
  }


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

function showOnly(
  screenId
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      id => {

        $(id)
          .classList
          .toggle(
            "hidden",
            id !==
              screenId
          );
      }
    );


  if (
    screenId ===
    "quiz-screen"
  ) {

    window
      .showGameScratchpadButton
      ?.();


    setTimeout(
      moveScratchpadButtonToTop,
      0
    );


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}

        "★★★★☆",

      comment:
        "表現很好，再加強斜邊上的高與距離公式即可。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再多練習幾次會更熟練。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從模式一熟悉畢氏定理的基本關係。"
  };
}


async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  playGameSound(
    "playComplete"
  );


  await saveCurrentScore(
    score
  );
}


/* ==================================================
Firestore
================================================== */

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  try {

    const result =
      await saveGameScore({

        game:
          GAME_ID,

        mode,

        score,

        correctCount:
          correct,

        wrongCount:
          wrong,

        maxCombo,

        playTime:
          elapsed,

        totalQuestions:
          questions.length
      });


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";

  } catch (
    error
  ) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";
  }
}


/* ==================================================
錯題
================================================== */

function showReview() {

  const wrongRecords =
    records.filter(
      item =>
        !item.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question,
                      record.userAnswer,
                      false
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

        .classList
