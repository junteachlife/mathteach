<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-3 分數的四則運算大挑戰</title>

  <link rel="stylesheet" href="../css/scratchpad.css">
  <link rel="stylesheet" href="../css/expression-input.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #00897b;
      --primary-dark: #00695c;
      --primary-light: #e0f2f1;
      --primary-border: #80cbc4;
      --text: #1f2937;
      --muted: #64748b;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --orange: #f57c00;
      --surface: #ffffff;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.13);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg,#e8f8f5,#fff8e8);
    }

    button, input {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; }

    .page-shell {
      width: min(100%, 1020px);
      margin: 0 auto;
    }

    #commonHeaderMount { margin-bottom: 14px; }

    .game-card {
      overflow: hidden;
      border: 1px solid #d8e7f7;
      border-top: 8px solid var(--primary);
      border-radius: 26px;
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
    }

    .game-header {
      padding: 26px 24px 20px;
      text-align: center;
      background: linear-gradient(180deg, var(--primary-light), #fff);
    }

    .game-title {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.35;
    }

    .game-subtitle {
      max-width: 860px;
      margin: 10px auto 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .screen { padding: 24px; }
    .hidden { display: none !important; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .mode-card {
      min-height: 184px;
      padding: 20px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--primary-light), #fff);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15,23,42,.11);
      border-color: var(--primary);
    }

    .mode-card h2 {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-size: 21px;
      line-height: 1.45;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--primary-border);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .mode-card.speed {
      border-color: #ffcc80;
      background: linear-gradient(180deg, #fff3e0, #fff);
    }

    .mode-card.speed h2 { color: #e65100; }

    .mode-card.comprehensive {
      border-color: #ffe082;
      background: linear-gradient(180deg, #fff8e1, #fff);
    }

    .mode-card.comprehensive h2 { color: #9a6700; }

    .quiz-topbar {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .status-box {
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 8px;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .status-label {
      color: var(--muted);
      font-size: 13px;
    }

    .status-value {
      margin-top: 4px;
      font-size: 18px;
      line-height: 1.35;
    }

    .timer-danger {
      background: #fee2e2 !important;
      color: #991b1b !important;
      animation: pulse .75s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    .progress-shell {
      height: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #42a5f5);
      transition: width .2s ease;
    }

    .question-card {
      padding: 24px 18px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    .question-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: clamp(16px, 2.1vw, 20px);
      font-weight: 900;
      line-height: 1.65;
    }

    .question-content {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: clamp(22px, 3.4vw, 32px);
      font-weight: 900;
      line-height: 1.6;
      overflow-x: auto;
    }

    .math-expression {
      white-space: normal;
      letter-spacing: .02em;
    }

    .math-expression sup {
      font-size: .6em;
      vertical-align: super;
    }

    .mini-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .scratchpad-row {
      display: flex;
      justify-content: center;
      margin: 14px 0 2px;
      min-height: 46px;
    }

    #scratchpad-mobile-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #scratchpad-mobile-button .scratchpad-open-button {
      position: static !important;
      inset: auto !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .22);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    #scratchpad-mobile-button .scratchpad-open-button[hidden] {
      display: none !important;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      background: #f8fbff;
    }

    .answer-title {
      margin-bottom: 12px;
      text-align: center;
      color: var(--primary-dark);
      font-weight: 900;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .choice-button {
      min-height: 68px;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      background: #fff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      cursor: pointer;
      transition: .14s ease;
    }

    .choice-button:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .choice-button.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .choice-button.correct-choice {
      border-color: #22c55e !important;
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .choice-button.wrong-choice {
      border-color: #ef4444 !important;
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .number-wrap {
      display: flex;
      justify-content: center;
    }

    .number-input {
      width: min(100%, 360px);
      min-height: 58px;
      padding: 10px 16px;
      border: 2px solid var(--primary-border);
      border-radius: 15px;
      background: #fff;
      color: #0f172a;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      outline: none;
    }

    .number-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21,101,192,.10);
    }

    .fraction-answer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .fraction-sign {
      min-width: 64px;
      height: 50px;
      padding: 0 10px;
      border: 2px solid #94a3b8;
      border-radius: 14px;
      background: #fff;
      color: #0f172a;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .fraction-entry {
      display: grid;
      grid-template-rows: 48px 3px 48px;
      width: 108px;
      align-items: center;
      justify-items: stretch;
    }

    .fraction-entry input {
      width: 100%;
      height: 48px;
      padding: 4px 8px;
      border: 2px solid #94a3b8;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font-size: 23px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .fraction-entry input:focus,
    .fraction-sign:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21,101,192,.10);
    }

    .fraction-bar {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: #0f172a;
    }

    .fraction-answer-hint {
      width: 100%;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }

    .input-message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--danger);
      text-align: center;
      font-weight: 800;
    }

    .feedback {
      min-height: 48px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.55;
    }

    .feedback:empty {
      min-height: 0;
      padding: 0;
      margin-top: 0;
    }

    .feedback.correct {
      background: #dcfce7;
      color: #166534;
    }

    .feedback.wrong {
      background: #fee2e2;
      color: #991b1b;
    }

    .explanation {
      margin-top: 14px;
      padding: 18px;
      border-left: 6px solid var(--primary);
      border-radius: 14px;
      background: #f8fafc;
      color: #334155;
      line-height: 1.85;
      font-size: 16px;
    }

    .explanation strong {
      color: #0f172a;
    }

    .rule-box,
    .calculation-box,
    .decision-box {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .rule-box {
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
    }

    .calculation-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }

    .decision-box {
      background: #fff7ed;
      border: 1px solid #fdba74;
    }

    .factor-line {
      margin: 6px 0;
      font-weight: 800;
    }

    /*
    ==================================================
    標準分解式比較表
    ==================================================
    */
    .short-division {
      width: min(100%, 660px);
      margin: 12px auto;
      border-collapse: collapse;
      background: #fff;
      font-size: 15px;
    }

    .short-division th,
    .short-division td {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      text-align: center;
    }

    .short-division th {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /*
    ==================================================
    課本式短除法
    左側：共同除數
    右側：被除數／商逐層往下寫
    ==================================================
    */
    .textbook-division-wrap {
      width: 100%;
      margin: 14px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .textbook-division {
      width: max-content;
      min-width: 300px;
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      color: #0f172a;
      font-size: clamp(17px, 2.4vw, 22px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .textbook-division td {
      min-width: 64px;
      padding: 7px 13px;
      text-align: center;
      white-space: nowrap;
    }

    .textbook-division .division-divisor {
      min-width: 46px;
      padding-left: 6px;
      padding-right: 10px;
      color: var(--primary-dark);
      text-align: right;
      border-right: 3px solid #334155;
    }

    .textbook-division .division-divisor.blank {
      color: transparent;
      border-right-color: transparent;
    }

    .textbook-division tr.division-step td.division-number {
      border-bottom: 3px solid #334155;
    }

    .textbook-division tr.division-final td.division-number {
      padding-top: 9px;
      color: #7c2d12;
    }

    .textbook-division-caption {
      margin: 8px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .division-step-list {
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #dbeafe;
    }

    .division-step-item {
      padding: 7px 0;
      border-bottom: 1px dashed #cbd5e1;
      line-height: 1.75;
    }

    .division-step-item:last-child {
      border-bottom: 0;
    }

    .division-step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      margin-right: 7px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 1000;
    }

    .division-carry {
      color: #b45309;
      font-weight: 1000;
    }

    .division-stop {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      color: #166534;
      font-weight: 800;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .textbook-division td {
        min-width: 52px;
        padding: 6px 9px;
      }

      .textbook-division .division-divisor {
        min-width: 40px;
      }
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .game-button {
      min-height: 48px;
      padding: 10px 18px;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(21,101,192,.2);
    }

    .game-button.secondary { background: #64748b; }
    .game-button.orange { background: var(--orange); }
    .game-button.restart { background: #16a34a; }

    .game-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result-card {
      text-align: center;
    }

    .result-card h2 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .result-score {
      margin: 10px 0 4px;
      color: var(--primary-dark);
      font-size: clamp(40px, 8vw, 66px);
      font-weight: 1000;
    }

    .result-stars {
      font-size: 28px;
      letter-spacing: 3px;
    }

    .result-comment {
      max-width: 720px;
      margin: 12px auto;
      color: var(--muted);
      line-height: 1.75;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .result-item {
      padding: 14px 8px;
      border-radius: 14px;
      background: var(--primary-light);
    }

    .result-item .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .result-item .value {
      display: block;
      margin-top: 5px;
      color: var(--primary-dark);
      font-size: 24px;
      font-weight: 1000;
    }

    .save-status {
      min-height: 24px;
      margin: 10px 0 0;
      font-weight: 800;
    }

    .review-list {
      display: grid;
      gap: 16px;
    }

    .review-card {
      padding: 16px;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      background: #fff;
    }

    .review-title {
      margin-bottom: 10px;
      color: var(--danger);
      font-weight: 1000;
    }

    .review-question {
      font-weight: 800;
      line-height: 1.7;
    }

    .review-answer {
      margin: 10px 0;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .screen { padding: 16px; }
      .game-header { padding: 22px 16px 16px; }
      .mode-grid { grid-template-columns: 1fr; }
      .quiz-topbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice-grid { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question-card { padding: 20px 12px; }
    }

    @media (max-width: 420px) {
      .status-value { font-size: 16px; }
      .game-button { width: 100%; }
    }
  
    .math-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .12em;min-width:1.2em}
    .math-frac .top{padding:0 .14em .08em;border-bottom:1.6px solid currentColor}
    .math-frac .bottom{padding:.08em .14em 0}
    .math-expr{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.8;word-break:break-word}
    .math-sup{font-size:.66em;vertical-align:super;margin-left:.04em}
    .step-line{margin:.5rem 0;line-height:1.85}
    .law-chip{display:inline-block;padding:.18rem .55rem;border-radius:999px;background:var(--primary-light);color:var(--primary-dark);font-weight:800;margin:.12rem}
    .answer-hint{color:var(--muted);font-size:.92rem;margin-top:.45rem}

  </style>
</head>

<body>
<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">
      <h1 class="game-title">2-3 分數的四則運算大挑戰</h1>
      <p class="game-subtitle">依 115 課本與習作編排：等值分數 → 正負分數加減 → 乘除與倒數 → 四則混合 → 數線與生活應用。答錯後提供可學習的逐步解析。</p>
    </header>

    <section id="start-screen" class="screen">
      <div class="mode-grid">
        <button class="mode-card" type="button" data-mode="equivalent">
          <h2>🧩 等值分數與大小比較</h2>
          <p>負分數表示、約分與擴分、最簡分數，以及正負分數大小比較。</p>
          <div class="mode-meta"><span class="mode-badge">10 題</span></div>
        </button>
        <button class="mode-card" type="button" data-mode="addSubtract">
          <h2>➕ 正負分數加減</h2>
          <p>同分母、異分母、通分、去括號與加法運算律；每題都有完整通分步驟。</p>
          <div class="mode-meta"><span class="mode-badge">10 題</span></div>
        </button>
        <button class="mode-card" type="button" data-mode="multiplyDivide">
          <h2>✖️ 正負分數乘除與倒數</h2>
          <p>判斷正負號、約分、倒數，以及分數乘法、除法與乘除混合。</p>
          <div class="mode-meta"><span class="mode-badge">10 題</span></div>
        </button>
        <button class="mode-card" type="button" data-mode="mixed">
          <h2>🧮 正負分數四則運算</h2>
          <p>依序處理括號、乘除、加減，避免過度複雜但完整涵蓋課本核心。</p>
          <div class="mode-meta"><span class="mode-badge">10 題</span></div>
        </button>
        <button class="mode-card" type="button" data-mode="application">
          <h2>📍 數線、距離與生活應用</h2>
          <p>練習數線距離、中點與生活情境，將分數運算連結到實際問題。</p>
          <div class="mode-meta"><span class="mode-badge">10 題</span></div>
        </button>
        <button class="mode-card speed" type="button" data-mode="speed">
          <h2>⚡ 分數運算快手</h2>
          <p>60 秒短題快速熟練；最後 10 秒啟動急促倒數提醒。</p>
          <div class="mode-meta"><span class="mode-badge">60 秒</span></div>
        </button>
        <button class="mode-card comprehensive" type="button" data-mode="comprehensive">
          <h2>🏆 2-3 綜合挑戰</h2>
          <p>整合等值分數、加減、乘除、四則混合與應用問題。</p>

/* ---------- 有理數核心：所有等值分數皆可正確判定 ---------- */
function igcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}

}

}
function mixedHTML(x){
  const a=R(x.n,x.d),sg=a.n<0?"−":"",n=Math.abs(a.n);
  if(a.d===1)return `${sg}${n}`;if(n<a.d)return ratHTML(a);

  return `${sg}${w}${ratHTML(R(r,a.d))}`;
}
function operandHTML(x){
  const a=R(x.n,x.d),html=ratHTML(a);
  return a.n<0?`(${html})`:html;
}
function mixedOperandHTML(x){
  const a=R(x.n,x.d),html=mixedHTML(a);
  return a.n<0?`(${html})`:html;
}
function rawOperandFracHTML(n,d){
  const a=R(n,d),html=rawFracHTML(n,d);
  return a.n<0?`(${html})`:html;
}
function parseRational(raw){

  if(m){const w=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(!d)return {ok:false};const sign=w<0?-1:1;const rawN=sign*(Math.abs(w)*d+n);return {ok:true,value:R(rawN,d),simple:igcd(rawN,d)===1}}

  if(m){const n=Number(m[1]),d=Number(m[2]);if(!d)return {ok:false};return {ok:true,value:R(n,d),simple:igcd(n,d)===1}}

function frac(a,b,neg=false){return R(neg?-Math.abs(a):Math.abs(a),b)}

  return R(nzNum(Math.max(1,lim)),d);
}
function calcBox(rule,lines,answer){
  return `<div class="rule-box"><b>觀念：</b>${rule}</div>
  <div class="calculation-box">${lines.map(x=>`<div class="step-line">${x}</div>`).join("")}</div>
  <div class="decision-box"><b>答案：</b>${answer}</div>`;
}
function makeChoiceQ(html,items,correctIndex,explanation,note=""){
  const rows=shuffle(items.map((label,i)=>({label,ok:i===correctIndex})));
  return {kind:"choice",html,choices:rows.map(x=>x.label),answerIndex:rows.findIndex(x=>x.ok),explanation,note};
}
function addSubExplain(a,b,op,ans){

    `${operandHTML(a)} ${symbol} ${operandHTML(b)} ＝ ${rawOperandFracHTML(A,L)} ${symbol} ${rawOperandFracHTML(B,L)}`,

    `${operandHTML(a)} × ${operandHTML(b)}`,
    `＝ ${rawN<0?"−":""}<span class="math-frac"><span class="top">${Math.abs(a.n)}×${Math.abs(b.n)}</span><span class="bottom">${a.d}×${b.d}</span></span>`,
    `＝ ${rawN<0?"−":""}<span class="math-frac"><span class="top">${Math.abs(rawN)}</span><span class="bottom">${rawD}</span></span>${g>1?`，再同除以 ${g}`:""}`,
    `＝ ${ratHTML(ans)}`

    `${operandHTML(a)} ÷ ${operandHTML(b)}`,

    `＝ ${ratHTML(ans)}`

}
function makeEquivalent(){
  const t=ri(0,3);

    const d=pick([4,6,8,9,10,12,15,18,20,24]), g=pick([2,3]), n=nzNum(d-1)*g, den=d*g, ans=R(n,den);
    return {kind:"rational",html:`<div class="math-expr">將 ${rawOperandFracHTML(n,den)} 化為最簡分數。</div>`,answer:ans,requireSimple:true,
      note:"本題指定「最簡分數」，需完成約分。",
      explanation:calcBox("分子與分母同除以最大公因數，分數的值不變。",[
        `分子 ${Math.abs(n)} 與分母 ${den} 的最大公因數為 ${igcd(n,den)}。`,
        `${rawOperandFracHTML(n,den)} ＝ ${operandHTML(ans)}`

  }

    let a=smallRat(),b=smallRat();while(ratEq(a,b))b=smallRat();

    return makeChoiceQ(`<div class="math-expr">比較大小：${operandHTML(a)}　□　${operandHTML(b)}</div>`,signs,correct,
      calcBox("可先通分或比較絕對值；兩個負數比較時，絕對值較大的反而較小。",[
        `通分後比較：${operandHTML(a)} ${c<0?"＜":c>0?"＞":"＝"} ${operandHTML(b)}。`
      ],`${operandHTML(a)} ${signs[correct]} ${operandHTML(b)}`));
  }

    const n=pick([1,2,3,4,5]),d=pick([3,4,5,7,8]);
    const neg=rawFracHTML(-n,d), denNeg=`<span class="math-frac"><span class="top">${n}</span><span class="bottom">−${d}</span></span>`;
    return makeChoiceQ(`<div class="math-expr">下列何者與 ${neg} <b>不相等</b>？</div>`,
      [rawFracHTML(n,d),denNeg,`−(${rawFracHTML(n,d)})`],0,
      calcBox("負號可放在分數前、分子或分母其中一處；只有一個負號時，分數為負。",[
        `${rawFracHTML(-n,d)} ＝ ${denNeg} ＝ −(${rawFracHTML(n,d)})。`,
        `${rawFracHTML(n,d)} 為正分數，所以不相等。`

  return makeChoiceQ(`<div class="math-expr">下列哪一個分數與 ${operandHTML(a)} 等值？</div>`,
    [operandHTML(eq),operandHTML(wrong1),operandHTML(wrong2)],0,
    calcBox("分子、分母同乘或同除以相同的非零數，分數值不變。",[
      `${operandHTML(a)} 的分子與分母同乘 ${k}，得到 ${rawOperandFracHTML(a.n*k,a.d*k)}。`
    ],ratHTML(eq)));
}
function makeAddSubtract(speed=false){
  const ds=speed?[3,4,5,6,8,10]:[2,3,4,5,6,7,8,9,10,12];
  if(!speed&&Math.random()<.22){
    const d=pick([5,7,11]),a=R(nzNum(d-1),d),c=R(nzNum(d-1),d),b=smallRat(),ans=radd(radd(a,c),b),ac=radd(a,c);
    return {kind:"rational",html:`<div class="math-expr">計算：${operandHTML(a)} + ${operandHTML(b)} + ${operandHTML(c)}</div>`,answer:ans,
      explanation:calcBox("加法可利用交換律、結合律，把容易相加的分數先結合。",[
        `交換順序：${operandHTML(a)} + ${operandHTML(c)} + ${operandHTML(b)}`,
        `先算同分母：(${operandHTML(a)} + ${operandHTML(c)}) + ${operandHTML(b)} ＝ ${operandHTML(ac)} + ${operandHTML(b)}`,
        `＝ ${ratHTML(ans)}`
      ],ratHTML(ans))};

      explanation:calcBox("有括號先算括號內；也可用去括號法則把減號分配進去。",[
        `括號內：${operandHTML(b)} + ${operandHTML(c)} ＝ ${operandHTML(inside)}`,
        `${operandHTML(a)} − ${operandHTML(inside)} ＝ ${operandHTML(ans)}`

  const a=R(nzNum(d1*2),d1),b=R(nzNum(d2*2),d2),op=Math.random()<.5?"+":"-",ans=op==="+"?radd(a,b):rsub(a,b);
  const displayA=!speed&&Math.abs(a.n)>a.d&&Math.random()<.35?mixedOperandHTML(a):operandHTML(a);
  const displayB=!speed&&Math.abs(b.n)>b.d&&Math.random()<.35?mixedOperandHTML(b):operandHTML(b);
  return {kind:"rational",html:`<div class="math-expr">計算：${displayA} ${op==="+"?"+":"−"} ${displayB}</div>`,answer:ans,
    note:"若答案為分數，請在上格填分子、下格填分母；等值分數會依數值判定。",

      explanation:calcBox("多個非零分數連乘：負因數有偶數個，積為正；有奇數個，積為負，再進行約分。",[
        `本題共有 ${negatives} 個負因數，所以乘積為${negatives%2?"負":"正"}數。`,
        `${operandHTML(a)} × ${operandHTML(b)} × ${operandHTML(c)} ＝ ${operandHTML(ans)}`

        `＝ ${ratHTML(ans)}`
      ],ratHTML(ans))};
  }
  let a=smallRat(),b=smallRat(),c=smallRat();while(!b.n)b=smallRat();const first=rdiv(a,b),ans=rsub(first,c);
  return {kind:"rational",html:`<div class="math-expr">計算：${operandHTML(a)} ÷ ${operandHTML(b)} − ${operandHTML(c)}</div>`,answer:ans,
    explanation:calcBox("四則混合先乘除、後加減；除法改成乘以倒數。",[
      `先算除法：${operandHTML(a)} ÷ ${operandHTML(b)} ＝ ${operandHTML(first)}`,
      `再算減法：${operandHTML(first)} − ${operandHTML(c)} ＝ ${operandHTML(ans)}`
    ],ratHTML(ans))};
}
function makeApplication(){
  const t=ri(0,2);
  if(t===0){
    const a=smallRat(false),b=smallRat(false),ans=rabs(rsub(a,b));
    return {kind:"rational",html:`<div class="math-expr">數線上 A 點坐標為 ${mixedOperandHTML(a)}，B 點坐標為 ${mixedOperandHTML(b)}。求 AB 的距離。</div>`,answer:ans,
      explanation:calcBox("數線上兩點 a、b 的距離為 |a−b|。",[
        `AB＝|${operandHTML(a)} − ${operandHTML(b)}|`,
        `＝|${operandHTML(rsub(a,b))}|＝${operandHTML(ans)}`
      ],ratHTML(ans))};
  }
  if(t===1){
    const a=smallRat(false),c=smallRat(false),ans=rdiv(radd(a,c),R(2));
    return {kind:"rational",html:`<div class="math-expr">A、C 在數線上的坐標分別為 ${mixedOperandHTML(a)}、${mixedOperandHTML(c)}，B 是 AC 的中點。求 B 的坐標。</div>`,answer:ans,
      explanation:calcBox("中點坐標可用兩端點坐標相加後除以 2。",[
        `B＝(${operandHTML(a)} + ${operandHTML(c)}) ÷ 2`,
        `＝${operandHTML(radd(a,c))} × ${operandHTML(R(1,2))}`,
        `＝${ratHTML(ans)}`
      ],ratHTML(ans))};
  }
  const parts=shuffle([R(1,3),R(1,4),R(1,6)]),sum=radd(radd(parts[0],parts[1]),parts[2]),ans=rsub(R(1),sum);
  return {kind:"rational",html:`<div class="math-expr">一筆財產中，三人分別取得 ${operandHTML(parts[0])}、${operandHTML(parts[1])}、${operandHTML(parts[2])}，其餘捐作公益。公益部分占全部的幾分之幾？</div>`,answer:ans,
    explanation:calcBox("把全部看成 1，先算已分配的比例，再用 1 減去。",[
      `已分配：${operandHTML(parts[0])}+${operandHTML(parts[1])}+${operandHTML(parts[2])}＝${operandHTML(sum)}`,
      `公益：1−${operandHTML(sum)}＝${operandHTML(ans)}`
    ],ratHTML(ans))};
}
function makeQuestion(mode,i=0){
  if(mode==="equivalent")return makeEquivalent();
  if(mode==="addSubtract")return makeAddSubtract();
  if(mode==="multiplyDivide")return Math.random()<.22?makeReciprocal():makeMultiplyDivide();
  if(mode==="mixed")return makeMixed();
  if(mode==="application")return makeApplication();
  if(mode==="speed")return Math.random()<.55?makeAddSubtract(true):makeMultiplyDivide(true);
  if(mode==="comprehensive"){
    const makers=[makeEquivalent,makeAddSubtract,makeMultiplyDivide,makeMixed,makeApplication];
    return makers[i%makers.length]();
  }
  return makeAddSubtract();
}

const $ = id => document.getElementById(id);
const screens = ["start-screen","quiz-screen","result-screen","review-screen"];
function mountScratchpadButton(){
  const mount=$("scratchpad-mobile-button"),button=$("scratchpadOpenButton");
  if(!mount||!button)return false;if(button.parentElement!==mount)mount.appendChild(button);return true;
}
function ensureScratchpadButtonMounted(){
  if(mountScratchpadButton())return;let tries=0;
  const t=setInterval(()=>{tries++;if(mountScratchpadButton()||tries>=50)clearInterval(t)},50);
}
window.addEventListener("DOMContentLoaded",()=>{
  if(window.MathGameCommonHeader)window.MathGameCommonHeader.init({mountId:"commonHeaderMount",basePath:"../"});
  ensureScratchpadButtonMounted();
});
let modeId="", questions=[], index=0, correct=0, wrong=0, combo=0, maxCombo=0;
let records=[], startAt=0, timerHandle=null, speedRemaining=0, speedScore=0, speedAttempts=0;
let selectedChoice=null, locked=false, attemptId="";

function setScratchpadVisible(visible){
  const apply=()=>{
    ensureScratchpadButtonMounted();

    const fn=visible
      ? window.showGameScratchpadButton
      : window.hideGameScratchpadButton;

    if(typeof fn==="function"){
      fn();
      return true;
    }

    if(typeof window.setGameScratchpadButtonVisible==="function"){
      window.setGameScratchpadButtonVisible(visible);
      return true;
    }

    const button=$("scratchpadOpenButton");
    if(button){
      button.hidden=!visible;
      button.style.display=visible?"inline-flex":"none";
      return true;
    }

    return false;
  };

  if(apply())return;

  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(apply()||tries>=60)clearInterval(timer);
  },50);
}
function resetScratchpadForQuestion(){
  try{
    if(typeof window.resetGameScratchpad==="function"){
      window.resetGameScratchpad();
    }else if(typeof window.mathScratchpad?.clear==="function"){
      window.mathScratchpad.clear();
    }
  }catch(e){
    console.warn("計算紙重設失敗：",e);
  }
}
function showScreen(id){
  screens.forEach(x=>$(x).classList.toggle("hidden",x!==id));

}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[ri(0,a.length-1)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function mmss(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function newAttemptId(){return `${GAME_ID}-${Date.now()}-${Math.random().toString(36).slice(2,9)}`}
function playGameSound(method){
  try{
    const sound=window.GameSound||window.MathGameSound, fn=sound?.[method];
    if(typeof fn!=="function") return false;
    const r=fn.call(sound); if(r&&typeof r.catch==="function") r.catch(()=>{}); return true;
  }catch(e){console.warn("音效播放失敗：",e);return false}
}
function playUrgentCountdown(){
  const sound=window.GameSound||window.MathGameSound;
  for(const m of ["playCountdown","playTick","playTimer","playUrgent"]){
    if(typeof sound?.[m]==="function"){try{sound[m]();return}catch(_){}}
  }
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.045;
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.07);o.onended=()=>c.close().catch(()=>{});
  }catch(_){}
}
function setTimer(){
  clearInterval(timerHandle);
  if(modeId==="speed"){
    speedRemaining=MODE_CONFIG.speed.seconds;
    $("time-display").textContent=`${speedRemaining} 秒`;
    timerHandle=setInterval(()=>{
      speedRemaining--;
      $("time-display").textContent=`${Math.max(0,speedRemaining)} 秒`;
      $("time-box").classList.toggle("urgent",speedRemaining<=10&&speedRemaining>0);
      if(speedRemaining<=10&&speedRemaining>0) playUrgentCountdown();
      if(speedRemaining<=0){clearInterval(timerHandle);finishGame()}
    },1000);
  }else{
    $("time-display").textContent="00:00";
    timerHandle=setInterval(()=>$("time-display").textContent=mmss((Date.now()-startAt)/1000),1000);
  }
}
function buildQuestions(mode){
  if(mode==="speed") return [makeQuestion("speed")];
  const n=MODE_CONFIG[mode].count||10, arr=[];
  for(let i=0;i<n;i++) arr.push(makeQuestion(mode,i));
  return arr;
}
function startGame(mode){
  modeId=mode; questions=buildQuestions(mode); index=0; correct=wrong=combo=maxCombo=0;
  records=[];speedScore=speedAttempts=0;selectedChoice=null;locked=false;attemptId=newAttemptId();startAt=Date.now();
  $("mode-display").textContent=MODE_CONFIG[mode].name.replace(/^[^\s]+\s/,"");
  showScreen("quiz-screen"); updateStatus(); setTimer(); 
  mode==="speed"?renderSpeedQuestion():renderQuestion();
}
function updateStatus(){
  $("score-display").textContent=modeId==="speed"?speedScore:(questions.length?Math.round(correct/Math.max(1,index+(locked?1:0))*100):0);
  $("combo-display").textContent=combo;
}
function renderQuestion(){
  locked=false; selectedChoice=null;
  resetScratchpadForQuestion();

}
function renderSpeedQuestion(){
  locked=false; selectedChoice=null; questions[0]=makeQuestion("speed");
  resetScratchpadForQuestion();
  const q=questions[0];
  $("question-label").textContent=`第 ${speedAttempts+1} 題｜60 秒快手`;
  $("question-content").innerHTML=q.html;
  $("question-note").innerHTML=q.note||"";
  $("progress-bar").style.width=`${Math.min(100,speedAttempts*7)}%`;
  resetAnswerUI(); renderAnswerUI(q);
}
function resetAnswerUI(){
  $("choiceMount").innerHTML="";
  $("choiceMount").classList.add("hidden");
  $("numberMountWrap").classList.add("hidden");
  $("fractionMountWrap").classList.add("hidden");
  $("expressionMountWrap").classList.add("hidden");

  $("number-input").value="";
  $("number-input").disabled=false;

  $("fraction-sign").value="1";
  $("fraction-sign").disabled=false;
  $("fraction-numerator").value="";
  $("fraction-denominator").value="";
  $("fraction-numerator").disabled=false;
  $("fraction-denominator").disabled=false;

  $("input-message").textContent="";
  $("feedback").textContent="";
  $("feedback").className="feedback";
  $("explanation").innerHTML="";
  $("explanation").classList.add("hidden");
  $("submit-button").classList.remove("hidden");
  $("next-button").classList.add("hidden");
}
function renderAnswerUI(q){
  if(q.kind==="choice"){
    $("choiceMount").classList.remove("hidden");

    q.choices.forEach((label,i)=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="choice-button";
      b.innerHTML=label;

      b.addEventListener("click",()=>{
        if(locked)return;
        selectedChoice=i;

        [...$("choiceMount").children]
          .forEach((x,j)=>x.classList.toggle("selected",j===i));
      });

      $("choiceMount").appendChild(b);
    });

    return;
  }

  if(q.kind==="rational" && q.answer?.d!==1){
    $("fractionMountWrap").classList.remove("hidden");

    setTimeout(
      ()=>$("fraction-numerator").focus(),
      50
    );

    return;
  }

  $("numberMountWrap").classList.remove("hidden");
  $("number-input").placeholder="請輸入整數";

  setTimeout(
    ()=>$("number-input").focus(),
    50
  );
}
function getAnswer(q){
  if(q.kind==="choice"){
    if(selectedChoice===null){
      return {ok:false,msg:"請先選擇一個答案。"};
    }

    return {
      ok:true,
      correct:selectedChoice===q.answerIndex,
      display:q.choices[selectedChoice].replace(/<[^>]+>/g,"")
    };
  }

  if(q.kind==="rational" && q.answer?.d!==1){
    const sign=$("fraction-sign").value==="-"?-1:Number($("fraction-sign").value);
    const numeratorRaw=$("fraction-numerator").value.trim();
    const denominatorRaw=$("fraction-denominator").value.trim();

    if(!numeratorRaw || !denominatorRaw){
      return {ok:false,msg:"請在上格填分子、下格填分母。"};
    }

    if(!/^\d+$/.test(numeratorRaw) || !/^\d+$/.test(denominatorRaw)){
      return {ok:false,msg:"分子、分母請輸入整數數字；負號請使用左側選單。"};
    }

    const numerator=Number(numeratorRaw);
    const denominator=Number(denominatorRaw);

    if(denominator===0){
      return {ok:false,msg:"分母不能是 0。"};
    }

    const rawNumerator=sign*numerator;

    if(q.requireSimple && igcd(rawNumerator,denominator)!==1){
      return {ok:false,msg:"本題指定最簡分數，請先約分。"};
    }

    const value=R(rawNumerator,denominator);

    return {
      ok:true,
      correct:ratEq(value,q.answer),
      display:ratHTML(value),
      displayHTML:true
    };
  }

  const raw=$("number-input").value.trim();

  if(!raw){
    return {ok:false,msg:"請先輸入答案。"};
  }

  if(!/^[+-]?\d+$/.test(raw)){
    return {ok:false,msg:"請輸入整數。"};
  }

  const value=Number(raw);

  if(q.kind==="integer"){
    return {
      ok:true,
      correct:value===q.answer,
      display:String(value)
    };
  }

  return {
    ok:true,
    correct:ratEq(R(value,1),q.answer),
    display:String(value)
  };
}
function submitAnswer(){
  if(locked)return;
  const q=modeId==="speed"?questions[0]:questions[index], a=getAnswer(q);
  if(!a.ok){$("input-message").textContent=a.msg;return}
  locked=true;
  $("number-input").disabled=true;
  $("fraction-sign").disabled=true;
  $("fraction-numerator").disabled=true;
  $("fraction-denominator").disabled=true;
  if(a.correct){correct++;combo++;maxCombo=Math.max(maxCombo,combo);playGameSound("playCorrect")}
  else{wrong++;combo=0;playGameSound("playWrong")}
  records.push({
    number:modeId==="speed"?speedAttempts+1:index+1,
    question:q,
    userAnswer:a.display,
    userAnswerHTML:!!a.displayHTML,
    correct:a.correct
  });
  if(modeId==="speed"){
    speedAttempts++;if(a.correct)speedScore+=10;
    $("feedback").textContent=a.correct?"✅ 正確！＋10 分":"❌ 答錯了，下一題！";
    $("feedback").className=`feedback ${a.correct?"correct":"wrong"}`;updateStatus();
    setTimeout(()=>{if(modeId==="speed"&&speedRemaining>0&&$("result-screen").classList.contains("hidden"))renderSpeedQuestion()},260);
    return;
  }
  $("feedback").textContent=a.correct?"✅ 回答正確！":"❌ 答案不正確，請看下方完整解析。";
  $("feedback").className=`feedback ${a.correct?"correct":"wrong"}`;
  $("explanation").innerHTML=q.explanation;$("explanation").classList.remove("hidden");
  $("submit-button").classList.add("hidden");$("next-button").classList.remove("hidden");
  $("next-button").textContent=index===questions.length-1?"查看測驗結果":"下一題";updateStatus();
}
function nextQuestion(){if(index>=questions.length-1)finishGame();else{index++;renderQuestion();updateStatus()}}
function currentScore(){
  if(modeId==="speed") return speedScore;
  return questions.length?Math.round(correct/questions.length*100):0;
}
function finishGame(){
  clearInterval(timerHandle);timerHandle=null;
  const elapsed=Math.max(1,Math.round((Date.now()-startAt)/1000));
  const total=modeId==="speed"?speedAttempts:questions.length, score=currentScore();
  const accuracy=total?Math.round(correct/total*1000)/10:0;
  $("result-mode-name").textContent=MODE_CONFIG[modeId].name;
  $("final-score").textContent=modeId==="speed"?`${score} 分`:`${score} 分`;
  $("final-correct").textContent=correct;$("final-wrong").textContent=wrong;$("final-combo").textContent=maxCombo;$("final-time").textContent=mmss(elapsed);
  $("final-stars").textContent=score>=90?"★★★★★":score>=80?"★★★★☆":score>=70?"★★★☆☆":score>=60?"★★☆☆☆":"★☆☆☆☆";
  $("final-comment").textContent=score>=90?"掌握得很完整，繼續保持！":score>=75?"整體穩定，可從錯題解析再補強細節。":score>=60?"核心概念已有基礎，建議把錯題再做一次。":"先依錯題解析逐步複習，再重新挑戰。";
  $("review-button").classList.toggle("hidden",records.every(r=>r.correct));
  showScreen("result-screen"); saveScore({score,total,accuracy,elapsed}); sendRpgBridge({score,total,accuracy,elapsed});
}
async function saveScore({score,total,accuracy,elapsed}){
  const el=$("save-status");el.textContent="正在儲存成績…";
  try{
    const m=await import("../js/scores.js?v=7");
    if(typeof m.saveGameScore!=="function")throw new Error("找不到 saveGameScore");
    await m.saveGameScore({game:GAME_ID,mode:modeId,score,correctCount:correct,wrongCount:wrong,maxCombo,playTime:elapsed,totalQuestions:total,accuracy});
    el.textContent="✅ 成績已儲存，可在排行榜與我的成績查看。";
  }catch(e){console.warn("成績儲存失敗：",e);el.textContent="⚠️ 本次成績已完成，但雲端儲存未成功。";}
}
async function sendRpgBridge({score,total,accuracy,elapsed}){
  const payload={gameId:GAME_ID,modeId,score,correct,total,playTime:elapsed,accuracy,maxCombo,attemptId,difficultyWeight:MODE_CONFIG[modeId]?.difficultyWeight||1};
  window.dispatchEvent(new CustomEvent("mathgame:session-complete",{detail:payload}));
  try{
    if(typeof window.MathGameProgress?.completeLearningSession==="function"){await window.MathGameProgress.completeLearningSession(payload);return}
    const m=await import("../js/progress-system.js?v=1");
    if(typeof m.completeLearningSession==="function")await m.completeLearningSession(payload);
  }catch(e){console.debug("RPG/學習進度尚未啟用：",e?.message||e)}
}

    :"<p>本次沒有錯題，太棒了！</p>";

}
