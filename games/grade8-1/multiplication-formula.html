<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    乘法公式大挑戰｜生活有解．心中有數
  </title>

  <!-- 乘法公式專屬瀏覽器小圖示 -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237B1FA2'/%3E%3Ctext x='31' y='43' text-anchor='middle' font-family='Arial' font-size='36' font-weight='700' fill='white'%3E%C3%97%3C/text%3E%3Ctext x='48' y='22' text-anchor='middle' font-family='Arial' font-size='17' font-weight='700' fill='%23FFF59D'%3E2%3C/text%3E%3C/svg%3E"
  >

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >
  <link rel="stylesheet" href="../css/polynomial-input.css?v=1">

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=5"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #3f51b5;
      --primary-dark: #303f9f;
      --primary-light: #e8eaf6;
      --primary-border: #9fa8da;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
      --restart-dark: #00695c;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #eef0ff,
          #fff8e8
        );
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          940px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    /* ==================================================
       返回目前學期
    ================================================== */

    .semester-return-row {
      display: flex;
      justify-content: flex-end;
      margin: -2px 0 14px;
    }

    .semester-return-button {
      min-height: 44px;
      padding: 9px 16px;
      border: 2px solid var(--primary);
      border-radius: 12px;
      background: #fff;
      color: var(--primary-dark);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary-border);
    }

    .semester-return-button:hover {
      background: var(--primary-light);
    }

    .semester-return-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--primary-border);
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #dfe3f5;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /* ==================================================
       標題
    ================================================== */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .formula-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .formula-chip {

      padding:
        7px 10px;

      border:
        1px solid
        var(--primary-border);

      border-radius: 999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {
      padding: 22px;
    }

    /* ==================================================
       模式
    ================================================== */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 180px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );

      text-align: left;

      cursor: pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.6;
    }

    /* ==================================================
       狀態列
    ================================================== */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 14px;
    }

    .status-box {

      min-height: 64px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /* ==================================================
       計算紙
    ================================================== */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 48px;

      margin:
        2px 0 13px;
    }

    #scratchpad-mobile-button {

      width: 100%;

      display: flex;

      justify-content: center;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /* ==================================================
       進度
    ================================================== */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius: 999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #7986cb
        );

      transition:
        width .2s ease;
    }

    /* ==================================================
       題目
    ================================================== */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-size: 17px;

      font-weight: 900;

      line-height: 1.8;
    }

    .question-label .formula-name {

      display: block;

      margin-bottom: 4px;

      color:
        var(--primary-dark);

      font-size: 18px;
    }

    .question-label .formula-hint {

      display: inline-block;

      margin-top: 3px;

      padding:
        5px 10px;

      border:
        1px solid
        var(--primary-border);

      border-radius: 999px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 16px;
    }

    .question-content {

      min-height: 110px;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          28px,
          6vw,
          45px
        );

      font-weight: 900;

      line-height: 1.65;
    }

    .question-content sup,
    .explanation sup,
    .review-question sup,
    .question-label sup {

      position: relative;

      top: -.58em;

      font-size: .52em;

      vertical-align: baseline;
    }

    /* ==================================================
       答案
    ================================================== */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 12px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .number-answer {

      display: flex;

      justify-content: center;
    }

    .number-answer input {

      width:
        min(
          240px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;
    }

    .coefficient-answer {

      display: flex;

      justify-content: center;

      align-items: end;

      gap: 10px;

      flex-wrap: wrap;
    }

    .coefficient-box {
      text-align: center;
    }

    .coefficient-label {

      display: block;

      margin-bottom: 5px;

      color:
        var(--muted);

      font-size: 13px;

      font-weight: 900;
    }

    .coefficient-input {

      width: 82px;

      padding:
        10px 6px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 10px;

      font-size: 22px;

      font-weight: 900;

      text-align: center;
    }

    .number-answer input:focus,
    .coefficient-input:focus {

      outline: none;

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(
          63,
          81,
          181,
          .12
        );
    }

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;
    }

    .choice-button {

      min-height: 58px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;

      color:
        #263238;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /* ==================================================
       按鈕
    ================================================== */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        var(--restart-dark);
    }

    .game-button:active {

      transform:
        translateY(4px);

      box-shadow:
        0 1px 0
        rgba(
          0,
          0,
          0,
          .25
        );
    }

    .game-button:disabled {

      opacity: .55;

      cursor:
        not-allowed;
    }

    /* ==================================================
       回饋
    ================================================== */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.65;
    }

    .feedback.correct {
      color:
        var(--success);
    }

    .feedback.wrong {
      color:
        var(--danger);
    }

    .feedback.warning {
      color:
        var(--warning);
    }

    .explanation {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background:
        #eef2ff;

      color:
        #334155;

      line-height: 1.9;
    }

    .explanation-step {

      margin:
        7px 0;
    }

    /* ==================================================
       結果
    ================================================== */

    .result-panel {
      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {

      margin-bottom: 10px;

      font-size: 31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }

    /* ==================================================
       錯題回顧
    ================================================== */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }

    .review-title {

      margin-bottom: 8px;

      color:
        var(--danger);

      font-weight: 900;
    }

    .review-question {

      margin-bottom: 8px;

      color:
        #0f172a;

      font-size: 21px;

      font-weight: 900;
    }

    .review-answer {

      color:
        #475569;

      line-height: 1.8;
    }

    /* ==================================================
       手機
    ================================================== */

    @media (
      max-width: 700px
    ) {

      body {
        padding: 8px;
      }

      .semester-return-row {
        justify-content: stretch;
        margin-bottom: 12px;
      }

      .semester-return-button {
        width: 100%;
        min-height: 46px;
        font-size: 15px;
      }

      .screen {

        padding:
          18px 12px;
      }

      .mode-grid {

        grid-template-columns:
          1fr;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {

        grid-column:
          1 / -1;
      }

      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .choice-grid {

        grid-template-columns:
          1fr;
      }

    }


    /* ==================================================
       2026-10 統一遊戲版面修正
    ================================================== */

    .game-card {
      position: relative;
    }

    .game-card-return-row {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px 0;
      background: linear-gradient(180deg, var(--primary-light), #ffffff);
    }

    .game-card-return-row .semester-return-button {
      min-height: 40px;
      padding: 8px 14px;
      box-shadow: none;
    }

    .quiz-topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(300px, auto);
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .quiz-context,
    .quiz-stats {
      display: grid;
      gap: 8px;
    }

    .quiz-context {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .quiz-stats {
      grid-template-columns: repeat(3, minmax(86px, 1fr));
    }

    .quiz-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quiz-actions .game-button {
      min-width: 116px;
      min-height: 46px;
      padding: 10px 14px;
    }

    .question-card {
      position: relative;
      padding: 22px 18px 78px;
      text-align: left;
    }

    .question-label {
      text-align: center;
    }

    .question-content {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
    }

    .question-content .keep-together {
      display: inline-block;
      white-space: nowrap;
    }

    .scratchpad-row {
      position: absolute;
      right: 16px;
      bottom: 14px;
      display: flex;
      justify-content: flex-end;
      min-height: 44px;
      margin: 0;
      z-index: 2;
    }

    #scratchpad-mobile-button {
      width: auto;
      display: flex;
      justify-content: flex-end;
    }

    #scratchpad-mobile-button #scratchpadOpenButton,
    #scratchpad-mobile-button .scratchpad-open-button {
      position: static !important;
      inset: auto !important;
      transform: none !important;
      margin: 0 !important;
      z-index: auto !important;
    }

    .answer-submit-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .polynomial-answer-shell {
      max-width: 760px;
      margin: 0 auto;
    }

    .polynomial-system-preview {
      max-width: 760px;
      margin: 12px auto 0;
      padding: 11px 14px;
      border: 1px solid var(--primary-border);
      border-radius: 12px;
      background: #ffffff;
      color: #334155;
      text-align: center;
      font-weight: 800;
      line-height: 1.7;
    }

    .polynomial-system-preview strong {
      color: var(--primary-dark);
      font-size: 1.08em;
    }

    .answer-help {
      margin: 0 0 12px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .quiz-topbar {
        grid-template-columns: 1fr;
      }

      .quiz-actions {
        order: 2;
      }

      .quiz-stats {
        order: 3;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .game-card-return-row {
        padding: 10px 10px 0;
      }

      .game-card-return-row .semester-return-button {
        width: auto;
        min-height: 40px;
      }

      .quiz-context,
      .quiz-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .quiz-stats .timer-box {
        grid-column: 1 / -1;
      }

      .question-card {
        padding: 18px 12px 74px;
      }

      .question-content {
        font-size: clamp(23px, 7vw, 34px);
      }

      .scratchpad-row {
        right: 10px;
        bottom: 10px;
      }
    }


    /* ==================================================
       v3.2｜八上 1-1 統一操作列、題目排版、詳解與自由多項式輸入
    ================================================== */

    .quiz-topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(300px, auto) auto;
      gap: 12px;
      align-items: center;
    }

    .quiz-actions {
      justify-content: flex-end;
      flex-wrap: nowrap;
    }

    .quiz-actions .game-button {
      min-width: 112px;
    }

    .question-content {
      width: 100%;
      overflow: visible;
      white-space: normal;
    }

    .question-content.is-short {
      justify-content: center;
      text-align: center;
      white-space: nowrap;
    }

    .question-content.is-long {
      justify-content: flex-start;
      text-align: left;
      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }

    .question-content.is-long .keep-together {
      display: inline-block;
      white-space: nowrap;
    }

    .explanation {
      background: #f8fafc;
      border: 1px solid #dbe3f4;
    }

    .explanation-step {
      margin: 12px 0;
      padding: 14px 15px;
      border: 1px solid #dbe3f4;
      border-left: 5px solid var(--primary);
      border-radius: 13px;
      background: #fff;
    }

    .explanation-step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--primary-dark);
      font-weight: 900;
      font-size: 16px;
    }

    .explanation-step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 13px;
    }

    .explanation-step-text {
      color: #475569;
      font-weight: 700;
      line-height: 1.75;
    }

    .explanation-math-chain {
      margin-top: 9px;
      padding: 11px 13px;
      border-radius: 11px;
      background: #eef2ff;
      color: #172554;
      font-family: "Cambria Math", "Times New Roman", "Microsoft JhengHei", serif;
      font-size: clamp(18px, 2.7vw, 23px);
      font-weight: 900;
      line-height: 1.8;
      overflow-wrap: normal;
      word-break: normal;
    }

<script type="module">


    import {

    "use strict";


    /* ==================================================
       基本設定
    ================================================== */


    const GAME_ID =
      "multiplicationFormula";


    const TOTAL_QUESTIONS =
      10;


    const MODE_NAMES = {

      numberBasic:
        "數字乘法公式",

      numberMixed:
        "數字變化計算",

      polynomial:
        "多項式與公式判讀",

      mixed:
        "乘法公式綜合挑戰"

    };


    const $ =
      id =>
        document.getElementById(
          id
        );


    const U =
      () => window.ExpressionInputUtils;


    let mode =
      "numberBasic";


    let questions =
      [];


    let index =
      0;


    let correct =
      0;


    let wrong =
      0;


    let combo =
      0;


    let maxCombo =
      0;


    let records =
      [];


    let answered =
      false;


    let selectedChoice =
      null;


    let startTime =
      0;


    let finalElapsed =
      0;


    let timerId =
      null;


    let scoreSaved =
      false;


    let answerInput = null;
    let freePolynomialInput = null;


    /* ==================================================
       工具
    ================================================== */


    function rand(
      min,
      max
    ) {

      return (
        Math.floor(
          Math.random() *
          (
            max -
            min +
            1
          )
        ) +
        min
      );
    }


    function pick(
      array
    ) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];
    }


    function shuffle(
      array
    ) {

      const result =
        [
          ...array
        ];


      for (
        let i =
          result.length -
          1;

        i >
        0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i +
              1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];
      }


      return result;
    }


    function playGameSound(
      method
    ) {

      try {

        const sound =
          window.GameSound ||
          window.MathGameSound;


        if (
          sound &&
          typeof sound[
            method
          ] ===
          "function"
        ) {

          sound[
            method
          ]();
        }

      } catch (
        error
      ) {

        console.warn(
          "音效播放失敗：",
          error
        );
      }
    }


    /* ==================================================
       時間
    ================================================== */


    function formatElapsed(
      seconds
    ) {

      const safeSeconds =
        Math.max(
          0,
          Math.floor(
            Number(
              seconds
            ) ||
            0
          )
        );


      const minutes =
        Math.floor(
          safeSeconds /
          60
        );


      const remainingSeconds =
        safeSeconds %
        60;


      return (
        `${String(minutes).padStart(2, "0")}:` +
        `${String(remainingSeconds).padStart(2, "0")}`
      );
    }


    function stopTimer(
      updateElapsed =
        true
    ) {

      if (
        timerId !==
        null
      ) {

        clearInterval(
          timerId
        );


        timerId =
          null;
      }


      if (
        updateElapsed &&
        startTime
      ) {

        finalElapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );
      }
    }


    function startTimer() {

      if (
        timerId !==
        null
      ) {

        clearInterval(
          timerId
        );


        timerId =
          null;
      }


      finalElapsed =
        0;


      startTime =
        Date.now();


      $("timer-display")
        .textContent =
          "00:00";


      timerId =
        setInterval(
          () => {

            finalElapsed =
              Math.floor(
                (
                  Date.now() -
                  startTime
                ) /
                1000
              );


            $("timer-display")
              .textContent =
                formatElapsed(
                  finalElapsed
                );

          },
          250
        );
    }


    /* ==================================================
       計算紙
    ================================================== */


    function moveScratchpadButtonToQuestionCard() {

      const mount =
        $("scratchpad-mobile-button");

      const button =
        $("scratchpadOpenButton");

      if (
        mount &&
        button &&
        !mount.contains(button)
      ) {

        mount.appendChild(button);
      }

      if (button) {
        button.style.position = "static";
        button.style.inset = "auto";
        button.style.transform = "none";
        button.style.margin = "0";
      }
    }


    function ensureScratchpadButtonInQuestionCard() {

      moveScratchpadButtonToQuestionCard();

      if ($("scratchpadOpenButton")) {
        window.showGameScratchpadButton?.();
        return;
      }

      const observer =
        new MutationObserver(
          () => {
            moveScratchpadButtonToQuestionCard();

            if ($("scratchpadOpenButton")) {
              window.showGameScratchpadButton?.();
              observer.disconnect();
            }
          }
        );

      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );

      setTimeout(
        () => observer.disconnect(),
        10000
      );
    }


    function showOnly(
      screenId
    ) {

      [
        "start-screen",
        "quiz-screen",
        "result-screen",
        "review-screen"
      ]
        .forEach(
          id => {

            $(id)
              .classList
              .toggle(
                "hidden",
                id !==
                screenId
              );
          }
        );


      if (
        screenId ===
        "quiz-screen"
      ) {

        ensureScratchpadButtonInQuestionCard();


        window
          .showGameScratchpadButton
          ?.();

      } else {

        window
          .hideGameScratchpadButton
          ?.();
      }
    }


    /* ==================================================
       題目物件
    ================================================== */


    function numberQuestion(
      html,
      answer,
      explanation,
      label =
        "請利用乘法公式計算"
    ) {

      return {

        type:
          "number",

        html,

        answer,

        explanation,

        label
      };
    }


    function polynomialQuestion(
      html,
      terms,
      explanation,
      label =
        "請輸入展開後的完整多項式"
    ) {

      return {

        type:
          "polynomial",

        html,

        answer:
          normalizePolynomial(terms),

        explanation,

        label
      };
    }


    function F(n, d = 1) {
      return U().normalizeFraction(n, d);
    }


    function fractionCoefficient(value) {
      return U().coefficientToFraction(value);
    }


    function normalizePolynomial(terms) {
      return U().normalizePolynomialTermsAsFractions(terms);
    }


    function polynomialHTML(terms) {
      const normalized = normalizePolynomial(terms);

      if (!normalized.length) {
        return "0";
      }

      return normalized
        .map((term, index) => {
          const f = fractionCoefficient(term.coefficient);
          const value = Number(f.numerator) / Number(f.denominator);
          const absN = Math.abs(Number(f.numerator));
          const den = Number(f.denominator);
          const negative = value < 0;
          const sign = index === 0 ? (negative ? "−" : "") : (negative ? " − " : " ＋ ");
          const exponent = Number(term.exponent);
          const omitOne = absN === den && exponent !== 0;
          const coefficient = omitOne
            ? ""
            : (den === 1 ? String(absN) : `<span class="keep-together">${absN}/${den}</span>`);
          const variable = exponent === 0
            ? ""
            : exponent === 1
              ? "x"
              : `x<sup>${exponent}</sup>`;
          return `${sign}${coefficient}${variable}`;
        })
        .join("");
    }


    function samePolynomial(first, second) {
      const a = normalizePolynomial(first);
      const b = normalizePolynomial(second);

      if (a.length !== b.length) {
        return false;
      }

      return a.every((term, i) => {
        const x = fractionCoefficient(term.coefficient);
        const y = fractionCoefficient(b[i].coefficient);
        return Number(term.exponent) === Number(b[i].exponent) &&
          Number(x.numerator) === Number(y.numerator) &&
          Number(x.denominator) === Number(y.denominator);
      });
    }


    function exStep(title, text = "", mathLines = []) {
      return { title, text, mathLines };
    }


    /* 多項式自由輸入已改由 ../js/polynomial-input.js 共用元件處理。 */

    function choiceQuestion(
      html,
      answer,
      explanation
    ) {

      return {

        type:
          "choice",

        html,

        answer,

        explanation,

        label:
          "不先做其他代數變形，請判斷此算式直接符合哪一個乘法公式",

        choices: [

          {
            value:
              "plus",

            text:
              "(a＋b)²＝a²＋2ab＋b²"
          },

          {
            value:
              "minus",

            text:
              "(a－b)²＝a²－2ab＋b²"
          },

          {
            value:
              "difference",

            text:
              "(a＋b)(a－b)＝a²－b²"
          }

        ]
      };
    }


    /* ==================================================
       模式一
       直接提示公式
    ================================================== */


    function makeBasicQuestion(kind) {
      const center = pick([50, 100, 200, 500]);
      const d = rand(2, 9);

      if (kind === "plus") {
        const n = center + d;
        const answer = n * n;
        const middle = 2 * center * d;
        return numberQuestion(
          `${n}<sup>2</sup>`,
          answer,
          [
            exStep("改寫成接近的整數", `把 ${n} 看成 ${center}＋${d}。`, [
              `${n}<sup>2</sup>＝(${center}＋${d})<sup>2</sup>`
            ]),
            exStep("套用和的平方公式", "使用 (a＋b)²＝a²＋2ab＋b²。", [
              `(${center}＋${d})<sup>2</sup>＝${center}<sup>2</sup>＋2×${center}×${d}＋${d}<sup>2</sup>`
            ]),
            exStep("依序計算", "保留上一行結果，接著完成數值計算。", [
              `${center}<sup>2</sup>＋2×${center}×${d}＋${d}<sup>2</sup>＝${center*center}＋${middle}＋${d*d}`,
              `＝${answer}`
            ])
          ],
          `<span class="formula-name">請使用「和的平方公式」計算</span><span class="formula-hint">(a＋b)<sup>2</sup>＝a<sup>2</sup>＋2ab＋b<sup>2</sup></span>`
        );
      }

      if (kind === "minus") {
        const n = center - d;
        const answer = n * n;
        const middle = 2 * center * d;
        return numberQuestion(
          `${n}<sup>2</sup>`,
          answer,
          [
            exStep("改寫成接近的整數", `把 ${n} 看成 ${center}－${d}。`, [
              `${n}<sup>2</sup>＝(${center}－${d})<sup>2</sup>`

            exStep("套用差的平方公式", "使用 (a－b)²＝a²－2ab＋b²。", [
              `(${center}－${d})<sup>2</sup>＝${center}<sup>2</sup>－2×${center}×${d}＋${d}<sup>2</sup>`
            ]),
            exStep("依序計算", "保留上一行結果，接著完成數值計算。", [
              `${center}<sup>2</sup>－2×${center}×${d}＋${d}<sup>2</sup>＝${center*center}－${middle}＋${d*d}`,

        );
      }

      const left = center + d;
      const right = center - d;
      const answer = left * right;
      return numberQuestion(
        `${left} × ${right}`,
        answer,
        [
          exStep("找出共同的中間值", `${left} 與 ${right} 都以 ${center} 為中心，相差 ${d}。`, [
            `${left}×${right}＝(${center}＋${d})(${center}－${d})`

      );
    }

    function makeMixedNumberQuestion() {
      const type = pick([
        "squareNearBase", "squareNearBase",
        "product", "product",
        "reverseSquareEasy", "reverseSquareEasy", "reverseSquareEasy",
        "reverseDifferenceEasy"
      ]);

      if (type === "squareNearBase") {
        const center = pick([50,100,200,500,1000]);
        const delta = pick([-7,-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,7]);
        const n = center + delta;
        const d = Math.abs(delta);
        const answer = n*n;

        if (delta > 0) {
          return numberQuestion(`${n}<sup>2</sup>`, answer, [
            exStep("改寫數字", `把 ${n} 改寫成 ${center}＋${d}。`, [
              `${n}<sup>2</sup>＝(${center}＋${d})<sup>2</sup>`
            ]),
            exStep("套用和的平方公式", "直接展開。", [
              `(${center}＋${d})<sup>2</sup>＝${center}<sup>2</sup>＋2×${center}×${d}＋${d}<sup>2</sup>`
            ]),
            exStep("完成計算", "接續上一行計算。", [
              `${center}<sup>2</sup>＋2×${center}×${d}＋${d}<sup>2</sup>＝${center*center}＋${2*center*d}＋${d*d}`,
              `＝${answer}`
            ])
          ], "請觀察最接近哪一個好算的整數，再選擇適合的乘法公式");
        }

        return numberQuestion(`${n}<sup>2</sup>`, answer, [
          exStep("改寫數字", `把 ${n} 改寫成 ${center}－${d}。`, [
            `${n}<sup>2</sup>＝(${center}－${d})<sup>2</sup>`
          ]),
          exStep("套用差的平方公式", "直接展開。", [
            `(${center}－${d})<sup>2</sup>＝${center}<sup>2</sup>－2×${center}×${d}＋${d}<sup>2</sup>`
          ]),
          exStep("完成計算", "接續上一行計算。", [
            `${center}<sup>2</sup>－2×${center}×${d}＋${d}<sup>2</sup>＝${center*center}－${2*center*d}＋${d*d}`,
            `＝${answer}`
          ])
        ], "請觀察最接近哪一個好算的整數，再選擇適合的乘法公式");
      }

      if (type === "product") {
        const center = pick([50,100,200,500]);
        const d = rand(1,7);
        const left = center+d, right=center-d;
        const answer = center*center-d*d;
        return numberQuestion(`${left} × ${right}`, answer, [
          exStep("找中間值", `${left} 與 ${right} 都可寫成 ${center}±${d}。`, [
            `${left}×${right}＝(${center}＋${d})(${center}－${d})`
          ]),
          exStep("套用平方差公式", "兩個因式的前半相同、後半互為相反數。", [
            `(${center}＋${d})(${center}－${d})＝${center}<sup>2</sup>－${d}<sup>2</sup>`
          ]),
          exStep("完成計算", "接續上一行。", [
            `${center}<sup>2</sup>－${d}<sup>2</sup>＝${center*center}－${d*d}`,
            `＝${answer}`
          ])
        ], "請觀察兩個數的中間值，再利用平方差公式計算");
      }

      if (type === "reverseSquareEasy") {
        const easyBase = pick([50,100,200,500]);
        const d = rand(1,Math.min(8,easyBase-1));
        const useMinus = Math.random()<.5;
        const answer = easyBase*easyBase;

        if (useMinus) {
          const a=easyBase+d;
          return numberQuestion(`${a}<sup>2</sup>－2×${a}×${d}＋${d}<sup>2</sup>`, answer, [
            exStep("辨認公式", "原式直接符合差的平方公式。", [
              `a<sup>2</sup>－2ab＋b<sup>2</sup>＝(a－b)<sup>2</sup>`
            ]),
            exStep("代入 a、b", `此題 a＝${a}，b＝${d}。`, [
              `${a}<sup>2</sup>－2×${a}×${d}＋${d}<sup>2</sup>＝(${a}－${d})<sup>2</sup>`
            ]),
            exStep("接續化簡", "括號內先算，再平方。", [
              `(${a}－${d})<sup>2</sup>＝${easyBase}<sup>2</sup>`,
              `＝${answer}`
            ])
          ], "請先看出乘法公式，再把算式化成容易計算的平方");
        }

        const a=easyBase-d;
        return numberQuestion(`${a}<sup>2</sup>＋2×${a}×${d}＋${d}<sup>2</sup>`, answer, [
          exStep("辨認公式", "原式直接符合和的平方公式。", [
            `a<sup>2</sup>＋2ab＋b<sup>2</sup>＝(a＋b)<sup>2</sup>`
          ]),
          exStep("代入 a、b", `此題 a＝${a}，b＝${d}。`, [
            `${a}<sup>2</sup>＋2×${a}×${d}＋${d}<sup>2</sup>＝(${a}＋${d})<sup>2</sup>`
          ]),
          exStep("接續化簡", "括號內先算，再平方。", [
            `(${a}＋${d})<sup>2</sup>＝${easyBase}<sup>2</sup>`,
            `＝${answer}`
          ])
        ], "請先看出乘法公式，再把算式化成容易計算的平方");
      }

      const easyFactor = pick([50,100,200,500]);
      const d=rand(1,8);
      const a=easyFactor-d, b=d;
      const answer=a*a-b*b;
      return numberQuestion(`${a}<sup>2</sup>－${b}<sup>2</sup>`, answer, [
        exStep("辨認公式", "原式是兩個平方相減。", [
          `a<sup>2</sup>－b<sup>2</sup>＝(a＋b)(a－b)`
        ]),
        exStep("代入數值", `令 a＝${a}，b＝${b}。`, [
          `${a}<sup>2</sup>－${b}<sup>2</sup>＝(${a}＋${b})(${a}－${b})`
        ]),
        exStep("接續計算", "先算兩個括號。", [
          `(${a}＋${b})(${a}－${b})＝${a+b}×${a-b}`,
          `＝${answer}`
        ])
      ], "請先看出平方差公式，再把算式改寫成較容易計算的乘法");
    }

    function makeMode2() {

      const result =
        [];


      const used =
        new Set();


      let guard =
        0;


      while (
        result.length <
          TOTAL_QUESTIONS &&
        guard <
          500
      ) {

        guard++;


        const question =
          makeMixedNumberQuestion();


        const key =
          question.html
            .replace(
              /\s+/g,
              ""
            );


        if (
          used.has(
            key
          )
        ) {

          continue;
        }


        used.add(
          key
        );


        result.push(
          question
        );
      }


      while (
        result.length <
        TOTAL_QUESTIONS
      ) {

        result.push(
          makeMixedNumberQuestion()
        );
      }


      return result;
    }

    function makeForwardSquare() {
      const a=rand(1,5), b=rand(2,9), plus=Math.random()<.5;
      const x2=a*a, x=(plus?1:-1)*2*a*b, c=b*b;
      const answer=[
        {exponent:2,coefficient:x2},
        {exponent:1,coefficient:x},
        {exponent:0,coefficient:c}
      ];
      const op=plus?"＋":"－";
      return polynomialQuestion(
        `<span class="keep-together">(${a===1?"":a}x${op}${b})<sup>2</sup></span> ＝？`,
        answer,
        [
          exStep("辨認公式", `這是兩項${plus?"和":"差"}的平方。`, [
            plus
              ? `(A＋B)<sup>2</sup>＝A<sup>2</sup>＋2AB＋B<sup>2</sup>`
              : `(A－B)<sup>2</sup>＝A<sup>2</sup>－2AB＋B<sup>2</sup>`
          ]),
          exStep("代入 A、B", `A＝${a}x，B＝${b}。`, [
            `(${a===1?"":a}x${op}${b})<sup>2</sup>＝(${a}x)<sup>2</sup>${plus?"＋":"－"}2×(${a}x)×${b}＋${b}<sup>2</sup>`
          ]),
          exStep("逐項計算", "把平方與中間項都真正算出來。", [
            `(${a}x)<sup>2</sup>${plus?"＋":"－"}2×(${a}x)×${b}＋${b}<sup>2</sup>＝${x2}x<sup>2</sup>${x>=0?"＋":"－"}${Math.abs(x)}x＋${c}`
          ]),
          exStep("整理答案", "依 x 的降冪排列。", [
            `${polynomialHTML(answer)}`
          ])
        ],
        "請輸入展開後的完整多項式"
      );
    }

    ================================================== */


    function renderPolynomialAnswer(question) {
      freePolynomialInput?.destroy();
      freePolynomialInput = null;

      $("answer-panel").innerHTML = `
        <div class="answer-title">${question.label}</div>
        <div id="polynomial-free-mount"></div>
      `;

      if (typeof window.PolynomialAnswerInput !== "function") {
        $("feedback").className = "feedback warning";
        $("feedback").textContent = "PolynomialAnswerInput 共用元件沒有正常載入。";
        return;
      }

      freePolynomialInput =
        new window.PolynomialAnswerInput({
          mountId: "polynomial-free-mount",
          variable: "x",
          maxExponent: 9,
          allowBareExponent: true,
          placeholder: "例如：6x²－3x＋5",
          primary: "#3f51b5",
          primaryDark: "#303f9f",
          primaryLight: "#e8eaf6",
          primaryBorder: "#9fa8da"
        });
    }


    function renderAnswer(question) {
      freePolynomialInput?.destroy();
      freePolynomialInput=null;
      selectedChoice=null;
      answerInput=null;

      if (question.type==="number") {
        $("answer-panel").innerHTML=`
          <div class="answer-title">請輸入答案</div>
          <div class="number-answer">
            <input id="number-input" type="text" inputmode="numeric" autocomplete="off" placeholder="輸入答案">
          </div>`;
        setTimeout(()=>$("number-input")?.focus(),0);
        return;
      }

      if (question.type==="polynomial") {
        renderPolynomialAnswer(question);
        return;
      }

      $("answer-panel").innerHTML=`
        <div class="answer-title">${question.label}</div>
        <div class="choice-grid">
          ${question.choices.map(choice=>`<button type="button" class="choice-button" data-choice="${choice.value}">${choice.text}</button>`).join("")}
        </div>`;

      document.querySelectorAll(".choice-button").forEach(button=>{
        button.addEventListener("click",()=>{
          if(answered)return;
          selectedChoice=button.dataset.choice;
          document.querySelectorAll(".choice-button").forEach(item=>item.classList.remove("selected"));
          button.classList.add("selected");
        });
      });
    }


    function readAnswer(question) {
      if (question.type==="number") {
        const raw=$("number-input")?.value.trim()??"";
        if(!/^-?\d+$/.test(raw))return{valid:false,message:"請輸入完整的整數答案。"};
        return{valid:true,value:Number(raw),display:raw};
      }

      if (question.type==="polynomial") {
        if (!freePolynomialInput) {
          return {valid:false,message:"多項式輸入元件尚未準備完成。"};
        }

        const result=freePolynomialInput.validate();

        if(!result.valid){
          return{
            valid:false,
            message:result.message||"請將多項式答案輸入完整。"
          };
        }

        return{
          valid:true,
          value:result.value,
          display:result.display
        };
      }

      if(!selectedChoice)return{valid:false,message:"請先選擇答案。"};
      const selected=question.choices.find(choice=>choice.value===selectedChoice);
      return{valid:true,value:selectedChoice,display:selected?.text||selectedChoice};
    }


    function checkCorrect(question, answer) {
      if (question.type === "number") {
        return answer.value === question.answer;
      }

      if (question.type === "polynomial") {
        return samePolynomial(answer.value, question.answer);
      }

      return answer.value === question.answer;
    }


    function correctAnswerText(question) {
      if (question.type === "number") {
        return String(question.answer);
      }

      if (question.type === "polynomial") {
        return polynomialHTML(question.answer);
      }

      const selected = question.choices.find(
        choice => choice.value === question.answer
      );

      return selected?.text || "";
    }


    /* ==================================================
       詳解
    ================================================== */


    function explanationHTML(question) {
      return question.explanation.map((step,i)=>{
        if(typeof step==="string"){
          return `<div class="explanation-step"><div class="explanation-step-head"><span class="explanation-step-badge">步驟 ${i+1}</span><span>解題說明</span></div><div class="explanation-step-text">${step}</div></div>`;
        }
        const title=step.title||"解題說明";
        const text=step.text?`<div class="explanation-step-text">${step.text}</div>`:"";
        const math=(step.mathLines||[]).length
          ? `<div class="explanation-math-chain">${step.mathLines.map(line=>`<span class="explanation-math-line">${line}</span>`).join("")}</div>`
          : "";
        return `<div class="explanation-step"><div class="explanation-step-head"><span class="explanation-step-badge">步驟 ${i+1}</span><span>${title}</span></div>${text}${math}</div>`;
      }).join("");
    }


    /* ==================================================
       顯示題目
    ================================================== */


    function updateQuestionAlignment() {
      const content=$("question-content");
      if(!content)return;

      content.classList.remove("is-short","is-long");
      content.classList.add("is-short");

      requestAnimationFrame(()=>{
        const available=content.clientWidth;
        const needed=content.scrollWidth;
        if(needed<=available+2){
          content.classList.add("is-short");
          content.classList.remove("is-long");
        }else{
          content.classList.remove("is-short");
          content.classList.add("is-long");
        }
      });
    }


    function displayQuestion() {

      answered =
        false;


      selectedChoice =
        null;


      const question =
        questions[
          index
        ];


      $("mode-name")
        .textContent =
          MODE_NAMES[
            mode
          ];


      $("question-number")
        .textContent =
          `${index + 1} / ${TOTAL_QUESTIONS}`;


      $("correct-count")
        .textContent =
          correct;


      $("combo-count")
        .textContent =
          maxCombo;


      $("progress-bar")
        .style
        .width =
          `${
            index /
            TOTAL_QUESTIONS *
            100
          }%`;


      $("question-label")
        .innerHTML =
          question.label;


      $("question-content")
        .innerHTML =
          question.html;

      updateQuestionAlignment();


      $("feedback")
        .textContent =
          "";


      $("feedback")
        .className =
          "feedback";


      $("explanation")
        .innerHTML =
          "";


      $("explanation")
        .classList
        .add(
          "hidden"
        );


      $("submit-button")
        .classList
        .remove(
          "hidden"
        );


      $("next-button")
        .classList
        .add(
          "hidden"
        );


      renderAnswer(
        question
      );


      window
        .resetGameScratchpad
        ?.();
    }


    /* ==================================================
       提交
    ================================================== */


    function submitAnswer() {

      if (
        answered
      ) {

        return;
      }


      const question =
        questions[
          index
        ];


      const answer =
        readAnswer(
          question
        );


      if (
        !answer.valid
      ) {

        $("feedback")
          .className =
            "feedback warning";


        $("feedback")
          .textContent =
            answer.message;


        return;
      }


      answered =
        true;

      freePolynomialInput?.setDisabled(true);

      document.querySelectorAll("#answer-panel input, #answer-panel button").forEach(element => {
        element.disabled = true;
      });


      document
        .querySelectorAll(
          "#answer-panel input, #answer-panel button"
        )
        .forEach(
          element => {

            element.disabled =
              true;
          }
        );


      const isCorrect =
        checkCorrect(
          question,
          answer
        );


      if (
        isCorrect
      ) {

        correct++;


        combo++;


        maxCombo =
          Math.max(
            maxCombo,
            combo
          );


        $("feedback")
          .className =
            "feedback correct";


        $("feedback")
          .textContent =
            "✨ 回答正確！";


        playGameSound(
          "playCorrect"
        );

      } else {

        wrong++;


        combo =
          0;


        $("feedback")
          .className =
            "feedback wrong";


        $("feedback")
          .innerHTML = `

            ❌ 答案不正確。正確答案：

            <strong>

              ${correctAnswerText(
                question
              )}

            </strong>
          `;


        playGameSound(
          "playWrong"
        );
      }


      records.push(
        {

          number:
            index +
            1,

          question,

          userAnswer:
            answer.display,

          correct:
            isCorrect

        }
      );


      $("correct-count")
        .textContent =
          correct;


      $("combo-count")
        .textContent =
          maxCombo;


      $("explanation")
        .innerHTML =
          explanationHTML(
            question
          );


      $("explanation")
        .classList
        .remove(
          "hidden"
        );


      $("submit-button")
        .classList
        .add(
          "hidden"
        );


      $("next-button")
        .classList
        .remove(
          "hidden"
        );


      $("next-button")
        .textContent =

          index ===
          TOTAL_QUESTIONS -
          1

            ? "查看測驗結果（Enter）"

            : "下一題（Enter）";


      $("next-button")
        .focus();
    }


    /* ==================================================
       下一題
    ================================================== */


    function nextQuestion() {

      if (
        !answered
      ) {

        return;
      }


      index++;


      if (
        index <
        TOTAL_QUESTIONS
      ) {

        displayQuestion();

      } else {

        showResult();
      }
    }


    /* ==================================================
       開始／重新測驗
    ================================================== */


    function startGame(
      selectedMode
    ) {

      stopTimer(
        false
      );


      mode =
        selectedMode;


      questions =
        createQuestions();


      index =
        0;


      correct =
        0;


      wrong =
        0;


      combo =
        0;


      maxCombo =
        0;


      records =
        [];


      answered =
        false;


      selectedChoice =
        null;


      scoreSaved =
        false;


      finalElapsed =
        0;


      $("save-status")
        .textContent =
          "";


      $("timer-display")
        .textContent =
          "00:00";


      showOnly(
        "quiz-screen"
      );


      displayQuestion();


      startTimer();


      playGameSound(
        "playStart"
      );
    }


    /* ==================================================
       評價
    ================================================== */


    function rating(
      score
    ) {

      if (
        score >=
        90
      ) {

        return {

          stars:
            "★★★★★",

          comment:
            "太棒了！你已經熟練掌握三個乘法公式。"
        };
      }


      if (
        score >=
        80
      ) {

        return {

          stars:
            "★★★★☆",

          comment:
            "表現很好，再多練習公式判讀就更穩定。"
        };
      }


      if (
        score >=
        60
      ) {

        return {

          stars:
            "★★★☆☆",

          comment:
            "基本觀念已掌握，建議再加強公式展開與逆向判讀。"
        };
      }


      return {

        stars:
          "★★☆☆☆",

        comment:
          "建議先熟悉三個乘法公式，再逐步進入綜合挑戰。"
      };
    }


    /* ==================================================
       儲存成績
    ================================================== */


    async function saveCurrentScore(
      score
    ) {

      if (
        scoreSaved
      ) {

        return;
      }


      scoreSaved =
        true;


      const status =
        $("save-status");


      status.textContent =
        "☁️ 正在儲存本次成績……";


      status.style.color =
        "#1d4ed8";


      try {


        const result =
          await saveGameScore(
            {

              game:
                GAME_ID,

              mode,

              score,

              correctCount:
                correct,

              wrongCount:
                wrong,

              maxCombo,

              playTime:
                finalElapsed

            }
          );


        if (
          result.success
        ) {

          status.textContent =
            `✅ 本次成績已儲存｜完成時間 ${formatElapsed(finalElapsed)}`;


          status.style.color =
            "#15803d";


          return;
        }


        if (
          result.reason ===
          "not-logged-in"
        ) {

          status.textContent =
            "ℹ️ 尚未登入，因此本次成績沒有儲存。";


          status.style.color =
            "#b45309";


          return;
        }


        status.textContent =
          "⚠️ 成績暫時無法儲存。";


        status.style.color =
          "#b91c1c";


      } catch (
        error
      ) {


        console.error(
          "乘法公式成績儲存失敗：",
          error
        );


        status.textContent =
          "⚠️ 成績暫時無法儲存。";


        status.style.color =
          "#b91c1c";

      }
    }


    /* ==================================================
       結果
    ================================================== */


    async function showResult() {


      stopTimer(
        true
      );


      const score =
        Math.round(
          correct /
          TOTAL_QUESTIONS *
          100
        );


      const result =
        rating(
          score
        );


      $("progress-bar")
        .style
        .width =
          "100%";


      showOnly(
        "result-screen"
      );


      $("final-score")
        .textContent =
          `${score} 分`;


      $("final-stars")
        .textContent =
          result.stars;


      $("final-comment")
        .textContent =
          result.comment;


      $("final-correct")
        .textContent =
          correct;


      $("final-wrong")
        .textContent =
          wrong;


      $("final-combo")
        .textContent =
          maxCombo;


      $("final-time")
        .textContent =
          formatElapsed(
            finalElapsed
          );


      $("review-button")
        .disabled =
          wrong ===
          0;


      $("review-button")
        .textContent =

          wrong ===
          0

            ? "全部答對，無錯題"

            : "錯題回顧";


      playGameSound(
        "playComplete"
      );


      await saveCurrentScore(
        score
      );
    }


    /* ==================================================
       錯題回顧
    ================================================== */


    function showReview() {


      const wrongRecords =
        records.filter(
          record =>
            !record.correct
        );


      const list =
        $("review-list");


      if (
        !wrongRecords.length
      ) {

        list.innerHTML = `

          <div class="review-card">

            全部答對，沒有需要回顧的錯題！

          </div>
        `;


      } else {


        list.innerHTML =
          wrongRecords
            .map(
              record => `

                <article class="review-card">


                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <div class="review-answer">

                    你的答案：

                    <strong>
                      ${record.userAnswer}
                    </strong>

                    <br>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </div>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>


                </article>
              `
            )
            .join(
              ""
            );
      }


      showOnly(
        "review-screen"
      );
    }


    /* ==================================================
       重新測驗確認

       桌機、平板、手機皆使用瀏覽器原生確認視窗。
       只有按下「確定」才重新開始目前模式。
    ================================================== */


    function confirmRestartTest() {

      return window.confirm(
        "確定要重新測驗嗎？\n目前的作答進度將會重新開始。"
      );
    }


    function restartCurrentModeWithConfirmation() {

      if (
        !confirmRestartTest()
      ) {

        return;
      }


      startGame(
        mode
      );
    }


    function confirmReselectMode() {

      return window.confirm(
        "確定要重選模式嗎？\n目前這次測驗的作答進度將會結束。"
      );
    }


    function backToModesWithConfirmation() {

      if (!confirmReselectMode()) {
        return;
      }

      stopTimer(true);
      showOnly("start-screen");
    }


    /* ==================================================
       返回八年級上學期

       平常由八上首頁進入遊戲時，使用上一頁即可回到原本已選好的
       「八年級上學期」卡牌介面，也能保留瀏覽器 BFCache 的狀態。
       若沒有可返回的站內來源，則退回網站首頁。
    ================================================== */


    function returnToGrade8FirstSemester() {

      const referrer =
        String(
          document.referrer ||
          ""
        );


      let cameFromHomePage =
        false;


      try {

        if (
          referrer
        ) {

          const referrerURL =
            new URL(
              referrer
            );


          const sameOrigin =
            referrerURL.origin ===
            window.location.origin;


          const path =
            referrerURL.pathname
              .replace(
                /\/+$/,
                ""
              );


          const isHomePath =
            path ===
              "" ||
            path.endsWith(
              "/index.html"
            ) ||
            path.endsWith(
              "/mathteach"
            );


          cameFromHomePage =
            sameOrigin &&
            isHomePath;
        }

      } catch (
        error
      ) {

        cameFromHomePage =
          false;
      }


      if (
        cameFromHomePage &&
        window.history.length >
          1
      ) {

        window.history.back();

        return;
      }


      window.location.href =
        "../index.html";
    }


    /* ==================================================
       模式卡
    ================================================== */


    $("semester-return-button")
      .addEventListener(
        "click",
        returnToGrade8FirstSemester
      );


    document
      .querySelectorAll(
        "[data-mode]"
      )
      .forEach(
        button => {


          button
            .addEventListener(
              "click",
              () => {


                startGame(
                  button.dataset.mode
                );

              }
            );

        }
      );


    /* ==================================================
       作答
    ================================================== */


    $("submit-button")
      .addEventListener(
        "click",
        submitAnswer
      );


    $("next-button")
      .addEventListener(
        "click",
        nextQuestion
      );


    /* ==================================================
       重新測驗
    ================================================== */


    $("restart-button")
      .addEventListener(
        "click",
        restartCurrentModeWithConfirmation
      );


    /* ==================================================
       選擇模式
    ================================================== */


    $("mode-button")
      .addEventListener(
        "click",
        backToModesWithConfirmation
      );


    /* ==================================================
       結果頁
    ================================================== */


    $("again-button")
      .addEventListener(
        "click",
        restartCurrentModeWithConfirmation
      );


    $("review-button")
      .addEventListener(
        "click",
        showReview
      );


    $("result-mode-button")
      .addEventListener(
        "click",
        () => {
          if (!window.confirm("確定要重選模式嗎？")) {
            return;
          }
          showOnly("start-screen");
        }
      );


    /* ==================================================
       錯題回顧
    ================================================== */


    $("review-again-button")
      .addEventListener(
        "click",
        restartCurrentModeWithConfirmation
      );


    $("review-result-button")
      .addEventListener(
        "click",
        () => {


          showOnly(
            "result-screen"
          );

        }
      );


    /* ==================================================
       Enter
    ================================================== */


    document
      .addEventListener(
        "keydown",
        event => {


          if (
            event.key !==
            "Enter"
          ) {

            return;
          }


          if (
            $("quiz-screen")
              .classList
              .contains(
                "hidden"
              )
          ) {

            return;
          }


          event.preventDefault();


          if (
            answered
          ) {

            nextQuestion();

          } else {

            submitAnswer();

          }

        }
      );


    /* ==================================================
       初始化
    ================================================== */


    window
      .addEventListener(
        "DOMContentLoaded",
        () => {


          ensureScratchpadButtonInQuestionCard();


          setTimeout(
            ensureScratchpadButtonInQuestionCard,
            120
          );

        }
      );


    window
      .addEventListener(
        "beforeunload",
        () => {

          if (
            timerId !==
            null
          ) {

            clearInterval(
              timerId
            );
          }

        }
      );


    showOnly(
      "start-screen"
    );


  </script>


</body>
