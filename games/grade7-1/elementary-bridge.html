:root{--blue:#245aa8;--teal:#087e85;--ink:#20304a;--mute:#64748b;--line:#dbe5f4;--bg:#f0f5fb;--green:#167d4d;--red:#b83248}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf5ff,#f9f7ed 85%);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100dvh;padding:104px 16px 32px}.shell{max-width:1050px;margin:auto}.hero,.panel{background:white;border:1px solid #e0e8f3;border-radius:22px;box-shadow:0 12px 30px #244b7d12}.hero{padding:26px 30px;margin-bottom:18px}.hero h1{font-size:clamp(24px,3.5vw,36px);margin:6px 0;color:var(--blue)}.hero p{color:var(--mute);line-height:1.8;margin:6px 0}.eyebrow{color:var(--teal);font-weight:800;font-size:13px;letter-spacing:2px}.panel{padding:24px;margin-bottom:16px}h2{margin:0 0 16px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.skill{padding:18px;text-align:left;border:2px solid var(--line);border-radius:16px;background:#fbfdff;cursor:pointer;min-height:130px;color:inherit}.skill:hover,.skill.selected{border-color:#438be2;background:#eff7ff}.skill .number{font-size:12px;color:var(--teal);font-weight:800}.skill b{display:block;margin:8px 0;font-size:17px}.skill small{color:var(--mute);line-height:1.5;display:block}.pill{border-radius:99px;padding:5px 10px;font-size:12px;color:#18748b;background:#e7f5f8;font-weight:700;display:inline-block}.buttons{display:flex;flex-wrap:wrap;gap:10px}.btn{font:inherit;font-weight:800;border:none;border-radius:13px;background:var(--blue);color:white;padding:13px 19px;cursor:pointer;touch-action:manipulation}.btn.alt{background:#e8f0fb;color:#245286}.btn.green{background:var(--teal)}.btn:disabled{opacity:.48;cursor:not-allowed}.small{font-size:13px;color:var(--mute);line-height:1.8}.hidden{display:none!important}.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.stat{padding:9px 14px;background:#edf5ff;border-radius:10px;font-weight:750;color:#295885}.questionbox{position:relative;border-radius:20px;border:2px solid #d6e5f9;background:linear-gradient(#f8fbff,#fff);padding:32px 18px 55px;min-height:176px}.questionlabel{font-size:13px;color:var(--teal);font-weight:800;text-align:center}.questiontext{text-align:center;font-size:clamp(24px,4.5vw,38px);font-weight:800;margin:16px auto;line-height:1.6;overflow-wrap:anywhere}.questionfoot{position:absolute;bottom:9px;right:10px;min-height:32px}.questionfoot #scratchpadOpenButton{position:static!important;transform:none!important;right:auto!important;bottom:auto!important;display:inline-flex!important}.answerbox{max-width:420px;margin:22px auto 10px;text-align:center}.answerbox label{display:block;font-weight:800;margin-bottom:10px}.answerbox input{width:100%;border:2px solid #9ebfe9;padding:15px;border-radius:13px;font-size:25px;text-align:center;color:var(--ink);background:white}.answerbox input:focus{outline:3px solid #d1e5ff}.hint{text-align:center;color:var(--mute);font-size:13px}.feedback{padding:16px;background:#eff8f3;border:1px solid #b7dec6;border-radius:14px;line-height:1.85;margin-top:17px}.feedback.bad{background:#fff4f3;border-color:#f4c2be}.feedback strong{font-size:19px}.feedback ol{padding-left:25px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result-stat{background:#eef5ff;border-radius:15px;padding:17px;text-align:center}.result-stat b{display:block;font-size:24px;color:#1c5cba}.wrong{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0;line-height:1.8}.wrong .wrongtitle{font-weight:800}.diagrow{display:flex;align-items:center;gap:12px;margin:10px 0}.diagrow>span:first-child{min-width:130px;font-size:14px}.bar{height:12px;border-radius:9px;background:#e4eaf3;overflow:hidden;flex:1}.bar>i{height:100%;display:block;background:#24869b}.warn{color:#b65d10;font-weight:800}.safe{color:#167d4d;font-weight:800}#saveStatus{font-size:13px;line-height:1.6;color:var(--mute)}#mathGameCommonHeader{z-index:1300}.answerbox #mathAnswerMount{width:100%;min-height:65px}.answerbox .math-expression-input-shell{max-width:100%}.input-warning{min-height:22px;text-align:center;font-size:13px;color:#ac541e;font-weight:650;margin-top:7px}.answer-fallback{display:none}.answer-fallback.active{display:block}.save-notice{font-size:12px;color:#8a5c13;background:#fff6e5;padding:9px;border-radius:9px} @media(max-width:700px){body{padding:136px 9px 20px}.hero,.panel{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:repeat(3,1fr)}.skill{padding:14px;min-height:120px}.skill b{font-size:15px}.diagrow>span:first-child{min-width:93px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.buttons .btn{flex:1}.questiontext{font-size:24px}}

<body>
<div class="shell">
<header class="hero"><div class="eyebrow">生活有解．心中有數 · 國小銜接專區</div><h1>🎒 小六升國一｜數學銜接特訓</h1><p>補強最常影響國中數學的六項計算能力。每項可選 10 題、20 題或 60 秒快答；另有 24 題綜合診斷，幫你找出需要優先加強的能力。</p></header>
<section id="menu" class="panel"><h2>選擇練習能力</h2><div class="grid" id="skills"></div><div style="margin-top:20px"><h2>選擇測驗方式</h2><div class="buttons"><button class="btn" data-start="10">10 題基礎練習</button><button class="btn" data-start="20">20 題熟練挑戰</button><button class="btn alt" data-start="60">⏱ 60 秒快答</button><button class="btn green" data-start="diagnostic">🔍 24 題銜接診斷</button></div><p class="small">10 題、20 題與診斷題會顯示逐題詳解及錯題回顧；60 秒快答以速度為主。診斷每項能力各抽 4 題。支援整數及共用分數答案輸入元件。</p></div></section>
<section id="play" class="panel hidden"><div class="buttons" style="justify-content:space-between;align-items:center;margin-bottom:15px"><b id="modeTitle">練習</b><div class="buttons"><button id="restart" class="btn alt">重新測驗</button><button id="back" class="btn alt">重選模式</button></div></div><div class="statrow"><span class="stat" id="progress">第 1 題</span><span class="stat" id="correct">答對 0</span><span class="stat" id="clock">已用 0 秒</span></div><div class="questionbox"><div class="questionlabel" id="skillLabel"></div><div class="questiontext" id="questionText"></div><div class="questionfoot" id="paperMount"></div></div><div class="answerbox"><label>請輸入答案</label><div id="mathAnswerMount"></div><input class="answer-fallback" id="answer" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如：12 或 3/4"/><div class="input-warning" id="inputWarning" aria-live="polite"></div></div><div class="hint">分數請輸入最簡分數；若為整數，請直接輸入整數。Enter 可送出。</div><div class="buttons" style="justify-content:center;margin-top:16px"><button id="submit" class="btn">送出答案</button><button id="next" class="btn green hidden">下一題</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div></section>
<section id="results" class="panel hidden"><h2>🏆 測驗結果</h2><div class="result-grid"><div class="result-stat">成績<b id="rScore"></b></div><div class="result-stat">答對<b id="rCorrect"></b></div><div class="result-stat">答錯<b id="rWrong"></b></div></div><p id="rSummary"></p><div id="diagnosticReport"></div><h2 style="margin-top:24px">📖 錯題回顧</h2><div id="wrongList"></div><p id="saveStatus"></p><div class="buttons"><button class="btn" id="again">再練一次</button><button class="btn alt" id="menuBack">回模式選單</button></div></section>

<script>
'use strict';
const GAME_ID='grade6Bridge';
const SKILLS=[
{id:'lcm',name:'最小公倍數與通分',why:'銜接：正負分數加減與公分母'},
{id:'gcd',name:'最大公因數與約分',why:'銜接：最簡分數與有理數運算'},
{id:'fraction',name:'分數四則運算',why:'銜接：正負分數與一元一次方程式'},
{id:'integer',name:'整數四則運算',why:'銜接：正負數與代數運算'},
{id:'order',name:'運算順序與括號',why:'銜接：代數式與混合運算'},
{id:'factor',name:'因數與質因數分解',why:'銜接：指數記法與平方根'}
];
const $=id=>document.getElementById(id), rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const simp=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return {n:n/g,d:d/g}};
const fmt=(n,d=1)=>{const v=simp(n,d);return v.d===1?String(v.n):`${v.n}/${v.d}`};
const fractionStr=(n,d)=>`<span style="display:inline-block;vertical-align:middle;text-align:center;font-size:.83em;line-height:1.1"><span style="display:block;border-bottom:2px solid;padding:1px 5px">${n}</span><span style="display:block;padding:1px 5px">${d}</span></span>`;
const q=(skill,html,n,d,steps,tip='')=>({skill,html,answer:fmt(n,d),steps,tip,token:html.replace(/<[^>]+>/g,'')});
function makeLCM(){let a=rand(3,15),b=rand(4,18);if(a===b)b++;if(Math.random()<.5){const k=rand(2,4);b=a*k}let m=lcm(a,b),g=gcd(a,b);return Math.random()<.5?q('lcm',`求 ${a} 與 ${b} 的<strong>最小公倍數</strong>`,m,1,[`列出 ${a} 的倍數與 ${b} 的倍數，找最小的共同倍數。`,`也可利用：最小公倍數＝${a} × ${b} ÷ 最大公因數。`,`最大公因數是 ${g}，所以 ${a} × ${b} ÷ ${g}＝${m}。`]):q('lcm',`${fractionStr(1,a)} 與 ${fractionStr(1,b)} 的<strong>最小公分母</strong>是多少？`,m,1,[`分母分別是 ${a} 和 ${b}。`,`求 ${a} 與 ${b} 的最小公倍數。`,`最小公倍數是 ${m}，故最小公分母為 ${m}。`])}
function makeGCD(){let c=rand(2,9),a=c*rand(3,12),b=c*rand(2,12);let g=gcd(a,b);if(Math.random()<.5)return q('gcd',`求 ${a} 與 ${b} 的<strong>最大公因數</strong>`,g,1,[`找出 ${a} 和 ${b} 的共同因數。`,`取其中最大的公因數，得到 ${g}。`]);return q('gcd',`將 ${fractionStr(a,b)} 約成<strong>最簡分數</strong>`,a,b,[`${a} 與 ${b} 的最大公因數為 ${g}。`,`分子分母同除以 ${g}：${a}÷${g}＝${a/g}，${b}÷${g}＝${b/g}。`,`最簡分數為 ${fmt(a,b)}。`])}
function makeFraction(){const d1=rand(2,12),d2=rand(2,12),n1=rand(1,d1-1),n2=rand(1,d2-1),op=pick(['+','−','×','÷']);let n,d,steps;const s1=fmt(n1,d1),s2=fmt(n2,d2);if(op==='+'){n=n1*d2+n2*d1;d=d1*d2;let common=lcm(d1,d2);steps=[`先找分母 ${d1} 與 ${d2} 的最小公倍數 ${common}。`,`通分：${n1} / ${d1}＝${n1*(common/d1)} / ${common}，${n2} / ${d2}＝${n2*(common/d2)} / ${common}。`,`分子相加後約分，得到 ${fmt(n,d)}。`]}else if(op==='−'){n=n1*d2-n2*d1;d=d1*d2;let common=lcm(d1,d2);steps=[`先求最小公分母 ${common}。`,`通分後，分子相減：${n1*(common/d1)}−${n2*(common/d2)}＝${n1*(common/d1)-n2*(common/d2)}。`,`約成最簡分數為 ${fmt(n,d)}。`]}else if(op==='×'){n=n1*n2;d=d1*d2;steps=['分數乘法：分子乘分子，分母乘分母。',`${n1}×${n2}＝${n}，${d1}×${d2}＝${d}。`,`約成最簡分數：${fmt(n,d)}。`]}else{n=n1*d2;d=d1*n2;steps=['除以分數，等於乘以它的倒數。',`${s1} ÷ ${s2}＝${n1}/${d1} × ${d2}/${n2}。`,`分子分母相乘並約分，得到 ${fmt(n,d)}。`]}return q('fraction',`${fractionStr(n1,d1)} ${op} ${fractionStr(n2,d2)} = ?`,n,d,steps)}
function makeInteger(){const op=pick(['+','−','×','÷']);let a,b,ans,steps;if(op==='+'){a=rand(15,99);b=rand(11,78);ans=a+b;steps=[`個位相加、十位相加，注意進位。`,`${a}＋${b}＝${ans}。`]}else if(op==='−'){a=rand(35,150);b=rand(9,a);ans=a-b;steps=[`將 ${b} 從 ${a} 扣除，必要時向高位借位。`,`${a}－${b}＝${ans}。`]}else if(op==='×'){a=rand(3,24);b=rand(4,19);ans=a*b;steps=[`將 ${a} 與 ${b} 依乘法計算。`,`${a}×${b}＝${ans}。`]}else{b=rand(2,16);ans=rand(3,16);a=b*ans;steps=[`想一想 ${b} 乘以多少等於 ${a}。`,`${a}÷${b}＝${ans}。`]}return q('integer',`${a} ${op} ${b} = ?`,ans,1,steps)}
function makeOrder(){let a=rand(3,18),b=rand(2,9),c=rand(2,9),type=rand(0,3);if(type===0){let ans=a+b*c;return q('order',`${a}＋${b}×${c} = ?`,ans,1,[`先乘除、後加減。`,`先算 ${b}×${c}＝${b*c}。`,`再算 ${a}＋${b*c}＝${ans}。`])}if(type===1){let ans=(a+b)*c;return q('order',`(${a}＋${b})×${c} = ?`,ans,1,[`括號內優先計算：${a}＋${b}＝${a+b}。`,`再乘 ${c}：${a+b}×${c}＝${ans}。`])}if(type===2){let product=b*c,top=product+rand(5,35);return q('order',`${top}－${b}×${c} = ?`,top-product,1,[`先算 ${b}×${c}＝${product}。`,`再算 ${top}－${product}＝${top-product}。`])}let k=rand(2,8),total=b*k;return q('order',`(${a}＋${total})÷${b} = ?`,(a+total),b,[`先算括號：${a}＋${total}＝${a+total}。`,`再除以 ${b}，得到 ${fmt(a+total,b)}。`])}
function primeFactors(n){let parts=[],v=n;for(let i=2;i<=v;i++){while(v%i===0){parts.push(i);v/=i}}return parts}
function makeFactor(){let primeList=[2,3,5,7,11,13],kind=rand(0,3);if(kind===0){let a=pick(primeList),b=pick(primeList),c=pick([2,3,5]),value=a*b*c,parts=primeFactors(value);return q('factor',`${value} 的<strong>質因數個數</strong>（重複的也要算）？`,parts.length,1,[`將 ${value} 分解成質數的乘積：${parts.join(' × ')}。`,`含重複計算，共有 ${parts.length} 個質因數。`])}if(kind===1){let value=rand(6,90);let parts=primeFactors(value);return q('factor',`${value} 的<strong>最小質因數</strong>是多少？`,parts[0],1,[`${value} 的質因數分解為 ${parts.join(' × ')}。`,`最小的質因數是 ${parts[0]}。`])}if(kind===2){let n=rand(2,12),k=rand(2,9),value=n*k;return q('factor',`${value} 是 ${n} 的多少倍？`,k,1,[`倍數關係可用除法找出。`,`${value}÷${n}＝${k}。`])}let n=rand(10,75),divs=[];for(let i=1;i<=n;i++)if(n%i===0)divs.push(i);return q('factor',`${n} 有幾個<strong>正因數</strong>？`,divs.length,1,[`依序找出能整除 ${n} 的正整數。`,`正因數有 ${divs.join('、')}。`,`共 ${divs.length} 個。`])}
const MAKE={lcm:makeLCM,gcd:makeGCD,fraction:makeFraction,integer:makeInteger,order:makeOrder,factor:makeFactor};
let chosen='lcm',run=null,timer=null,mathWidget=null;
function initMathWidget(){
  if(typeof window.MathExpressionInput==='function'){
    try{
      mathWidget=new window.MathExpressionInput({
        mountId:'mathAnswerMount',placeholder:'輸入整數或最簡分數',
        allowRadical:false,allowFraction:true,allowPower:false,
        allowVariable:false,allowPlusMinus:false,
        validationMode:'numeric-radical',requireSimplifiedFraction:true,
        requireSimplifiedRadical:false,showPreview:true,autoFocus:false,
        toolOrder:['fraction'],onChange:()=>{$('inputWarning').textContent='';}
      });
    }catch(e){console.warn('共用答案元件初始化失敗，改用原生輸入框',e)}
  }
  if(!mathWidget){$('answer').classList.add('active');$('mathAnswerMount').style.display='none';$('inputWarning').textContent='共用答案元件未載入，暫以一般輸入框作答。'}
}
function answerRaw(){return mathWidget?.getRawValue?.()??$('answer').value}
function resetAnswer(){if(mathWidget){mathWidget.setRawValue('');mathWidget.setDisabled(false)}else $('answer').value='';$('inputWarning').textContent=''}
function lockAnswer(){if(mathWidget)mathWidget.setDisabled(true);else $('answer').disabled=true}
function focusAnswer(){if(mathWidget)mathWidget.focus();else $('answer').focus()}
function normalizeAnswerSource(raw){
  let t=String(raw??'').trim().replace(/[−－]/g,'-').replace(/＋/g,'+').replace(/\s/g,'');
  // 共用分數輸入格式：(3)/(4)、(-3)/(4)，轉為標準 3/4。
  for(let i=0;i<3;i++){let before=t;t=t.replace(/\((-?\d+)\)\/\((-?\d+)\)/g,'$1/$2').replace(/^\((-?\d+)\)$/,'$1');if(t===before)break}
  return t;
}
const skillName=k=>SKILLS.find(s=>s.id===k)?.name||k;
function show(id){['menu','play','results'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}
function renderSkills(){$('skills').innerHTML=SKILLS.map((s,i)=>`<button type="button" class="skill ${chosen===s.id?'selected':''}" data-skill="${s.id}"><span class="number">核心能力 ${String(i+1).padStart(2,'0')}</span><b>${s.name}</b><small>${s.why}</small></button>`).join('');document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{chosen=b.dataset.skill;renderSkills()})}
function sequence(mode){if(mode==='diagnostic')return SKILLS.flatMap(s=>Array(4).fill(s.id)).sort(()=>Math.random()-.5);let n=mode==='60'?120:Number(mode);return Array(n).fill(chosen)}
function build(mode){let types=sequence(mode),seen=new Set();return types.map(type=>{let item;for(let tries=0;tries<60;tries++){item=MAKE[type]();if(!seen.has(item.token))break}seen.add(item.token);return item})}
function start(mode){stopTimer();run={mode,items:build(mode),index:0,correct:0,answers:[],started:Date.now(),seconds:0,locked:false,ended:false,combo:0,maxCombo:0};$('modeTitle').textContent=mode==='diagnostic'?'六大能力混合診斷':`${skillName(chosen)}｜${mode==='60'?'60 秒快答':mode+' 題練習'}`;show('play');renderQuestion();if(mode==='60'){run.left=60;$('clock').textContent='剩餘 60 秒';timer=setInterval(()=>{if(!run||run.ended)return;run.left--;run.seconds=60-run.left;$('clock').textContent=`剩餘 ${Math.max(0,run.left)} 秒`;if(run.left<=0)finish()},1000)}else timer=setInterval(()=>{if(run&&!run.ended){run.seconds=Math.floor((Date.now()-run.started)/1000);$('clock').textContent=`已用 ${run.seconds} 秒`}},1000)}
function renderQuestion(){if(!run||run.ended)return;run.locked=false;let item=run.items[run.index];$('skillLabel').textContent=skillName(item.skill);$('questionText').innerHTML=item.html;resetAnswer();$('feedback').classList.add('hidden');$('submit').classList.remove('hidden');$('next').classList.add('hidden');$('submit').disabled=false;$('progress').textContent=run.mode==='60'?`已作答 ${run.index} 題`:`第 ${run.index+1} / ${run.items.length} 題`;$('correct').textContent=`答對 ${run.correct}`;if(document.getElementById('scratchpadOpenButton')) $('paperMount').appendChild(document.getElementById('scratchpadOpenButton'));window.setGameScratchpadButtonVisible?.(true);window.resetGameScratchpad?.();focusAnswer()}
function parseAnswer(raw){raw=normalizeAnswerSource(raw);if(!/^-?\d+(?:\/-?\d+)?$/.test(raw))return {error:'請輸入整數或 a/b 格式的分數。'};let [a,b=1]=raw.split('/').map(Number);if(b===0)return {error:'分母不能是 0。'};if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b))return {error:'數字過大，請輸入有效整數或分數。'};let v=simp(a,b);if(b!==1 && (Math.abs(gcd(a,b))!==1||v.d===1))return {error:`請化成最簡分數，例如 ${fmt(a,b)}。`};return {value:fmt(a,b)}}
function submit(){if(!run||run.ended||run.locked)return;const value=parseAnswer(answerRaw());if(value.error){$('feedback').classList.remove('hidden');$('feedback').classList.add('bad');$('feedback').textContent=value.error;$('inputWarning').textContent=value.error;return}const item=run.items[run.index],ok=value.value===item.answer;run.answers.push({item,user:value.value,ok});if(ok){run.correct++;run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo)}else run.combo=0;run.locked=true;lockAnswer();$('correct').textContent=`答對 ${run.correct}`;if(run.mode==='60'){run.index++;if(run.index>=run.items.length)run.items.push(MAKE[chosen]());renderQuestion();return}const li=item.steps.map(s=>`<li>${s}</li>`).join('');$('feedback').classList.remove('hidden','bad');if(!ok)$('feedback').classList.add('bad');$('feedback').innerHTML=`<strong>${ok?'✅ 回答正確':'❌ 回答錯誤'}</strong><div>你的答案：${value.value}；正確答案：<b>${item.answer}</b></div><ol>${li}</ol>`;$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').focus()}
function next(){if(!run||run.ended||!run.locked)return;run.index++;if(run.index>=run.items.length)finish();else renderQuestion()}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function finish(){if(!run||run.ended)return;run.ended=true;stopTimer();window.setGameScratchpadButtonVisible?.(false);window.closeGameScratchpad?.();const count=run.answers.length,wrong=run.answers.filter(a=>!a.ok),pct=count?Math.round(run.correct/count*100):0,mode=run.mode,score=mode==='60'?run.correct:pct;show('results');$('rScore').textContent=mode==='60'?`${score} 題`:`${score} 分`;$('rCorrect').textContent=run.correct;$('rWrong').textContent=wrong.length;$('rSummary').textContent=mode==='60'?`60 秒共完成 ${count} 題，最高連擊 ${run.maxCombo}。`:`共完成 ${count} 題，正確率 ${pct}%，用時 ${run.seconds} 秒。`;
$('wrongList').innerHTML=wrong.length?wrong.map((r,i)=>`<div class="wrong"><div class="wrongtitle">錯題 ${i+1}｜${skillName(r.item.skill)}</div><div>${r.item.html}</div><div>你的答案：${r.user}　｜　正確答案：<b>${r.item.answer}</b></div><ol>${r.item.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join(''):'<p class="safe">🎉 本次沒有錯題！</p>';
if(mode==='diagnostic'){let rows=SKILLS.map(s=>{let a=run.answers.filter(x=>x.item.skill===s.id);let ok=a.filter(x=>x.ok).length,per=a.length?Math.round(ok/a.length*100):0;return {...s,ok,total:a.length,per}});$('diagnosticReport').innerHTML=`<h2>🔍 六大能力診斷報告</h2>${rows.map(x=>`<div class="diagrow"><span>${x.name}</span><div class="bar"><i style="width:${x.per}%"></i></div><b>${x.per}%</b></div>`).join('')}<p class="small">${rows.filter(x=>x.per<75).length?'建議優先補強：'+rows.filter(x=>x.per<75).map(x=>x.name).join('、'):'六大能力表現均達 75% 以上，可嘗試 20 題熟練練習。'}（每項只有 4 題，屬初步篩檢，非正式能力評量。）</p>`}else $('diagnosticReport').innerHTML='';$('saveStatus').textContent='正在確認成績是否可儲存…';saveScore({mode,score,correct:run.correct,wrong:wrong.length,combo:run.maxCombo,seconds:run.seconds})}
async function saveScore({mode,score,correct,wrong,combo,seconds}){try{const {saveGameScore}=await import('../../js/scores.js');const modeId=mode==='diagnostic'?'diagnostic':`${chosen}_${mode==='60'?'speed':mode+'q'}`;const result=await saveGameScore({game:GAME_ID,mode:modeId,score,correctCount:correct,wrongCount:wrong,maxCombo:combo,playTime:seconds});$('saveStatus').textContent=result?.success?'✅ 已儲存成績（使用登入的 Google 帳號）':'ℹ️ 目前未儲存雲端成績；請確認是否登入及遊戲設定。'}catch(e){console.warn('成績模組未能載入',e);$('saveStatus').textContent='ℹ️ 本次結果已顯示，但雲端成績尚未儲存。'}}
function leave(){if(run&&!run.ended&&!confirm('測驗尚未結束，確定要離開嗎？'))return;stopTimer();run=null;window.setGameScratchpadButtonVisible?.(false);window.closeGameScratchpad?.();show('menu')}
renderSkills();document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));$('submit').onclick=submit;$('next').onclick=next;$('back').onclick=leave;$('restart').onclick=()=>{if(run&&confirm('確定重新開始測驗？目前進度將清除。'))start(run.mode)};$('menuBack').onclick=leave;$('again').onclick=()=>start(run?.mode||'10');$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run?.locked?next():submit()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.closest?.('#mathAnswerMount')){e.preventDefault();run?.locked?next():submit()}});initMathWidget();window.setGameScratchpadButtonVisible?.(false);
</script>
</body>
