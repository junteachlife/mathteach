.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}.toolbar-left,.toolbar-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #cbdcf3;border-radius:30px;padding:8px 13px;background:#f3f8ff;color:#1e40af;font-weight:800}.btn{border:0;border-radius:12px;background:var(--primary);color:white;font-weight:800;padding:12px 19px}.btn:hover:not(:disabled){background:var(--dark)}.btn.light{color:#1e40af;background:#eaf3ff;border:1px solid #caddf8}.btn.light:hover:not(:disabled){background:#d9eaff}.btn.ghost{color:#b45309;background:#fff7ed;border:1px solid #fed7aa}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.stat{background:#eff6ff;border-radius:12px;padding:10px 7px;text-align:center;font-weight:800;color:#1d4ed8}.stat b{display:block;font-size:22px;color:#0f172a;margin-top:4px}.bar{height:9px;border-radius:20px;background:#e2e8f0;overflow:hidden;margin:4px 0 16px}.bar>div{height:100%;width:0%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .2s}

px;margin:12px 0;line-height:1.85}.review-item h4{margin:0 0 6px;font-size:18px}.review-item .review-answer{color:#b91c1c;font-weight:800}.result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0 6px}.danger-time{color:#b91c1c!important;background:#fee2e2!important;animation:pop .65s infinite alternate}@keyframes pop{to{transform:scale(1.035)}}
@media(max-width:760px){body,body.math-game-has-common-header{padding:148px 7px 18px!important}.app{border-radius:15px}.top{padding:18px}.content{padding:16px}.mode-list{grid-template-columns:1fr}.mode-card{min-height:unset;padding:18px}.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:stretch}.toolbar-left,.toolbar-right{width:100%;justify-content:center}.question-card{padding:15px}.question-expression{min-height:96px}.answer-input{font-size:26px}.result-heading{font-size:26px}}

<body>
<main class="app">
<header class="top"><h1>🎮 正負整數</h1><p>七上 1-1｜正負整數加減法練習 · 選擇模式，挑戰你的運算能力！</p></header>
<div class="content">
<section id="modeScreen">
<h2 class="section-title">選擇遊戲模式</h2>
<div class="mode-list">
<button class="mode-card" type="button" data-mode="tenQuestions"><span class="mode-emoji">🎯</span><strong>10 題練習</strong><span>每題作答後顯示完整詳解；結束後查看成績與錯題回顧。</span></button>
<button class="mode-card" type="button" data-mode="twentyQuestions"><span class="mode-emoji">📘</span><strong>20 題挑戰</strong><span>題數加倍，完整解題步驟與錯題回顧，適合加強熟練度。</span></button>
<button class="mode-card" type="button" data-mode="speed"><span class="mode-emoji">⏱️</span><strong>60 秒快答</strong><span>限時作答、答對累積連擊分數，挑戰反應與計算速度。</span></button>
</div>
<p class="subnote">練習範圍：正負整數加法、減法、括號負數、同號與異號運算。10／20 題以答對比例計分；60 秒保留原本連擊加分方式。</p>
</section>
<section id="playScreen" class="hidden">
<div class="toolbar"><div class="toolbar-left"><span class="pill" id="modeName">🎯 10 題</span><span class="pill" id="questionCount">第 1 / 10 題</span></div><div class="toolbar-right"><button type="button" id="restartBtn" class="btn ghost">↻ 重新測驗</button><button type="button" id="modeBtn" class="btn light">☰ 重選模式</button></div></div>
<div class="stats"><div class="stat">📋 進度<b id="progressText">0 / 10</b></div><div class="stat">✅ 答對<b id="correctText">0</b></div><div class="stat">🔥 連擊<b id="comboText">0</b></div><div class="stat" id="timeStat">⏱️ 計時<b id="timeText">—</b></div></div>
<div class="bar"><div id="progressFill"></div></div>
<div class="question-card"><div class="question-hint">請計算下列算式的值：</div><div id="questionText" class="question-expression"></div><div id="paperMount" class="paper-place"></div></div>
<div class="answer-area"><label for="answerInput">你的答案</label><input id="answerInput" class="answer-input" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入整數（可含負號）" aria-label="整數答案" maxlength="7"></div>
<div id="keyboard" class="keyboard" aria-label="數字鍵盤"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><button type="button" class="function" id="signBtn">＋／－</button><button type="button" data-digit="0">0</button><button type="button" class="function" id="deleteBtn">⌫ 刪除</button></div>
<div class="submit-row"><button class="btn light" id="clearBtn" type="button">清除答案</button><button class="btn" id="submitBtn" type="button">送出答案</button><button class="btn hidden" id="nextBtn" type="button">下一題 →</button></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
</section>
<section id="resultScreen" class="hidden"><h2 class="result-heading">🏆 挑戰結果</h2><div id="finalScore" class="big-score"></div><div id="resultDescription" class="subnote" style="text-align:center"></div><div class="summary"><div>✅ 答對<b id="finalCorrect">0</b></div><div>❌ 答錯<b id="finalWrong">0</b></div><div>🔥 最高連擊<b id="finalCombo">0</b></div><div>⏱️ 用時<b id="finalDuration">0 秒</b></div></div><div id="saveStatus" class="save-status" aria-live="polite"></div><div id="reviewPanel"></div><div class="result-actions"><button type="button" class="btn" id="retryBtn">再玩一次</button><button type="button" class="btn light" id="resultModeBtn">重選模式</button></div></section>
</div></main>
<script src="../../js/scratchpad.js"></script><script src="../../js/scratchpad-template.js"></script><script src="../../js/common-header.js?v=3"></script>
<script type="module">
import {saveGameScore} from "../../js/scores.js";
import {prepareAudio,playCorrectSound,playWrongSound,playCountdownSound} from "../../js/sound.js";
const GAME_ID='integer', $=id=>document.getElementById(id);
const sections={m:$('modeScreen'),p:$('playScreen'),r:$('resultScreen')};
const modes={tenQuestions:{name:'🎯 10 題練習',total:10},twentyQuestions:{name:'📘 20 題挑戰',total:20},speed:{name:'⏱️ 60 秒快答',total:0}};
let mode=null,quiz=[],current=null,index=0,correct=0,wrong=0,combo=0,maxCombo=0,score=0,history=[],answered=false,ended=false,timer=null,seconds=60,startedAt=0,elapsed=0,advanceTimer=null,saveDone=false,lockKeyboard=false;
const fmt=n=>n<0?`(${n})`:String(n);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clean=()=>{clearInterval(timer);clearTimeout(advanceTimer);timer=null;advanceTimer=null};
function show(which){Object.entries(sections).forEach(([k,v])=>v.classList.toggle('hidden',k!==which));}
function makeQuestion(){let a,b,op;do{a=rnd(-20,20);b=rnd(-20,20);op=Math.random()<.5?'+':'−';}while(a===0&&b===0);
// 保留原遊戲的正負整數加減法，加入不同正負號組合，並避免單一型態過多
const value=op==='+'?a+b:a-b;
const display=`${fmt(a)} ${op} ${fmt(b)} = ?`;
let steps=[];
if(op==='+'){
 if(a===0||b===0){steps=[`加上 0 不會改變原來的數。`,`所以 ${a} + ${fmt(b)} = ${value}。`];}
 else if((a>0&&b>0)||(a<0&&b<0)){
  steps=[`兩數同號相加：絕對值相加，再保留共同的正負號。`,`|${a}| + |${b}| = ${Math.abs(a)} + ${Math.abs(b)} = ${Math.abs(a)+Math.abs(b)}。`,`兩數${a<0?'都是負數，結果為負':'都是正數，結果為正'}，所以答案是 ${value}。`];
 }else{
  const bigger=Math.abs(a)>=Math.abs(b)?a:b;
  steps=[`兩數異號相加：較大絕對值減去較小絕對值。`,`|${a}| 與 |${b}| 相減：${Math.max(Math.abs(a),Math.abs(b))} − ${Math.min(Math.abs(a),Math.abs(b))} = ${Math.abs(value)}。`,`結果取絕對值較大的數（${bigger}）的符號，所以答案是 ${value}。`];
 }
}else{
 const opp=-b;
 steps=[`減去一個數，等於加上它的相反數。`,`把 ${fmt(a)} − ${fmt(b)} 改寫為 ${fmt(a)} + ${fmt(opp)}。`];
 if(a===0||opp===0){steps.push(`其中有一個加數是 0，直接得到 ${value}。`)}
 else if((a>0&&opp>0)||(a<0&&opp<0)){
  steps.push(`同號相加：${Math.abs(a)} + ${Math.abs(opp)} = ${Math.abs(value)}，保留共同${a<0?'負':'正'}號。`)
 }else{
  steps.push(`異號相加：${Math.max(Math.abs(a),Math.abs(opp))} − ${Math.min(Math.abs(a),Math.abs(opp))} = ${Math.abs(value)}。`);
  steps.push(`取絕對值較大加數的符號（若剛好相等則為 0）。`);
 }
 steps.push(`所以 ${fmt(a)} − ${fmt(b)} = ${value}。`);
}
return {a,b,op,value,display,steps};}
function buildQuiz(n){const arr=[],used=new Set();let tries=0;while(arr.length<n&&tries<2000){tries++;let q=makeQuestion();const key=`${q.a}|${q.op}|${q.b}`;if(used.has(key))continue;used.add(key);arr.push(q)}return arr;}
function setPaperVisible(on){const b=$('scratchpadOpenButton');if(b){b.hidden=!on;b.style.setProperty('display',on?'inline-flex':'none','important');}}
function mountPaper(){const b=$('scratchpadOpenButton'),mount=$('paperMount');if(b&&mount&&b.parentElement!==mount)mount.appendChild(b);setPaperVisible(!sections.p.classList.contains('hidden'));return !!b;}
function resetPaper(){if(typeof window.resetGameScratchpad==='function'){try{window.resetGameScratchpad()}catch(e){console.warn('計算紙清除失敗',e)}}}
function updateStats(){const count=mode==='speed'?history.length:index;const total=modes[mode].total; $('progressText').textContent=mode==='speed'?`${history.length} 題`:`${Math.min(count,total)} / ${total}`;$('correctText').textContent=String(correct);$('comboText').textContent=String(combo);$('timeText').textContent=mode==='speed'?`${seconds} 秒`:`${Math.floor(elapsed)} 秒`;$('progressFill').style.width=mode==='speed'?`${Math.max(0,(60-seconds)/60)*100}%`:`${Math.min(100,history.length/total*100)}%`;$('timeStat').classList.toggle('danger-time',mode==='speed'&&seconds<=10);$('questionCount').textContent=mode==='speed'?`已答 ${history.length} 題`:`第 ${index+1} / ${total} 題`;}
function resetAnswer(){answered=false;lockKeyboard=false;$('answerInput').value='';$('answerInput').disabled=false;$('submitBtn').classList.remove('hidden');$('submitBtn').disabled=false;$('nextBtn').classList.add('hidden');$('feedback').classList.add('hidden');$('feedback').replaceChildren();$('keyboard').querySelectorAll('button').forEach(b=>b.disabled=false);$('answerInput').focus({preventScroll:true});}
function renderQuestion(){if(ended)return;current=mode==='speed'?makeQuestion():quiz[index];if(!current){finish();return} $('questionText').textContent=current.display;resetAnswer();resetPaper();updateStats();mountPaper();}
function startNew(m){if(!modes[m])return;clean();mode=m;quiz=m==='speed'?[]:buildQuiz(modes[m].total);index=0;correct=0;wrong=0;combo=0;maxCombo=0;score=0;history=[];answered=false;ended=false;seconds=60;elapsed=0;saveDone=false;startedAt=Date.now();$('modeName').textContent=modes[m].name;$('saveStatus').textContent='';$('reviewPanel').replaceChildren();show('p');mountPaper();renderQuestion();if(m==='speed'){timer=setInterval(()=>{seconds--;if(seconds>0&&seconds<=10){try{playCountdownSound(seconds)}catch(e){}}if(seconds<=0){seconds=0;updateStats();finish()}else updateStats()},1000)}else{timer=setInterval(()=>{if(!ended){elapsed=Math.floor((Date.now()-startedAt)/1000);updateStats()}},1000)}}
function explanation(q){const ol=document.createElement('ol');ol.className='steps';q.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li)});return ol;}
function readAnswer(){const v=$('answerInput').value.trim().replace(/[＋﹢]/g,'+').replace(/[−－–]/g,'-');if(!/^[+-]?\d{1,6}$/.test(v))return null;let n=Number(v);return Number.isSafeInteger(n)?n:null;}
function submit(){if(ended||answered||lockKeyboard)return;const val=readAnswer();if(val===null){$('feedback').className='feedback bad';$('feedback').textContent='請輸入完整整數，例如 8、-5 或 0。';return}try{prepareAudio()}catch(e){}answered=true;lockKeyboard=true;const good=val===current.value;if(good){correct++;combo++;maxCombo=Math.max(maxCombo,combo);score+=mode==='speed'?(combo>=5?20:combo>=3?15:10):1;try{playCorrectSound()}catch(e){}}else{wrong++;combo=0;try{playWrongSound()}catch(e){}}
 history.push({q:current,answer:val,good});$('answerInput').disabled=true;$('keyboard').querySelectorAll('button').forEach(b=>b.disabled=true);$('submitBtn').classList.add('hidden');const fb=$('feedback');fb.replaceChildren();fb.className='feedback '+(good?'good':'bad');const h=document.createElement('h3');h.textContent=good?'✅ 答對了！':`❌ 答錯了，正確答案為 ${current.value}`;fb.appendChild(h);if(mode!=='speed'){const info=document.createElement('div');info.textContent='📖 詳解說明';info.style.fontWeight='800';fb.appendChild(info);fb.appendChild(explanation(current));$('nextBtn').textContent=history.length===modes[mode].total?'查看測驗結果 →':'下一題 →';$('nextBtn').classList.remove('hidden')}else{advanceTimer=setTimeout(()=>{if(!ended)renderQuestion()},550)}updateStats();}
function next(){if(ended||!answered||mode==='speed')return;if(history.length>=modes[mode].total){finish();return}index++;renderQuestion();}
function makeReview(){const panel=$('reviewPanel');panel.replaceChildren();if(mode==='speed'){const t=document.createElement('p');t.className='subnote';t.textContent='60 秒快答模式以速度和連擊為主；10 題、20 題模式提供完整逐題詳解及錯題回顧。';panel.appendChild(t);return}const wrongItems=history.filter(item=>!item.good);const heading=document.createElement('h3');heading.className='review-title';heading.textContent=`📝 錯題回顧（${wrongItems.length} 題）`;panel.appendChild(heading);if(!wrongItems.length){const p=document.createElement('p');p.className='feedback good';p.textContent='太棒了！本次題目全部答對，沒有錯題。';panel.appendChild(p);return}wrongItems.forEach((it,i)=>{const box=document.createElement('article');box.className='review-item';const title=document.createElement('h4');title.textContent=`錯題 ${i+1}｜${it.q.display}`;box.appendChild(title);const ans=document.createElement('div');ans.className='review-answer';ans.textContent=`你的答案：${it.answer}　｜　正確答案：${it.q.value}`;box.appendChild(ans);const label=document.createElement('strong');label.textContent='解題步驟：';box.appendChild(label);box.appendChild(explanation(it.q));panel.appendChild(box)});}
async function saveResult(){if(saveDone)return;saveDone=true;const status=$('saveStatus');status.style.color='#475569';status.textContent='☁️ 正在儲存測驗成績……';try{const finalScore=mode==='speed'?score:Math.round(correct/modes[mode].total*100);const result=await saveGameScore({game:GAME_ID,mode:mode==='speed'?'':mode,score:finalScore,correctCount:correct,wrongCount:wrong,maxCombo,playTime:Math.floor(mode==='speed'?60:elapsed)});if(result?.success){status.style.color='#15803d';status.textContent='✅ 成績已儲存，可以在「我的成績」查看。'}else if(result?.reason==='not-logged-in'){status.style.color='#a16207';status.textContent='ℹ️ 尚未登入 Google，本次成績沒有儲存。'}else{status.style.color='#b91c1c';status.textContent='⚠️ 本次成績儲存未完成，請確認登入與網路連線。'}}catch(e){console.error('儲存成績失敗',e);status.style.color='#b91c1c';status.textContent='⚠️ 成績暫時無法儲存，請檢查登入狀態。'}}
function finish(){if(ended)return;ended=true;clean();if(mode!=='speed')elapsed=Math.floor((Date.now()-startedAt)/1000);$('answerInput').disabled=true;setPaperVisible(false);show('r');const finalScore=mode==='speed'?score:Math.round(correct/modes[mode].total*100);$('finalScore').textContent=mode==='speed'?`${finalScore} 分`:`${finalScore} 分`;$('resultDescription').textContent=`${modes[mode].name}｜${correct} 題答對，${wrong} 題答錯${mode==='speed'?'（連擊加分制）':'（正確率換算百分制）'}`;$('finalCorrect').textContent=String(correct);$('finalWrong').textContent=String(wrong);$('finalCombo').textContent=String(maxCombo);$('finalDuration').textContent=`${Math.floor(mode==='speed'?60:elapsed)} 秒`;makeReview();saveResult();}
function goModes(){if(!sections.p.classList.contains('hidden')&&!confirm('確定離開目前測驗並重選模式？尚未結束的成績不會儲存。'))return;clean();ended=true;show('m');setPaperVisible(false);resetPaper();}
function restart(){if(!mode)return;if(!sections.r.classList.contains('hidden')||confirm('確定重新測驗？目前作答進度將清除。')){startNew(mode)}}
function keyUpdate(fn){if(ended||answered||sections.p.classList.contains('hidden'))return;fn();$('feedback').classList.add('hidden');$('answerInput').focus({preventScroll:true})}
for(const card of document.querySelectorAll('[data-mode]'))card.addEventListener('click',()=>startNew(card.dataset.mode));$('modeBtn').addEventListener('click',goModes);$('restartBtn').addEventListener('click',restart);$('retryBtn').addEventListener('click',()=>startNew(mode));$('resultModeBtn').addEventListener('click',()=>{show('m');setPaperVisible(false)});$('submitBtn').addEventListener('click',submit);$('nextBtn').addEventListener('click',next);$('clearBtn').addEventListener('click',()=>keyUpdate(()=>$('answerInput').value=''));$('deleteBtn').addEventListener('click',()=>keyUpdate(()=>$('answerInput').value=$('answerInput').value.slice(0,-1)));$('signBtn').addEventListener('click',()=>keyUpdate(()=>{let v=$('answerInput').value;$('answerInput').value=v.startsWith('-')?v.slice(1):'-'+v}));document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>keyUpdate(()=>{$('answerInput').value+=b.dataset.digit})));$('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(answered&&mode!=='speed')next();else submit()}});$('answerInput').addEventListener('input',()=>{if(!answered)$('feedback').classList.add('hidden')});
// 共用計算紙元件於 DOMContentLoaded 之後建立，掛載到題目框右下角。
let paperTries=0;const paperInterval=setInterval(()=>{paperTries++;if(mountPaper()||paperTries>80)clearInterval(paperInterval)},60);window.addEventListener('beforeunload',clean);
</script>
</body></html>
