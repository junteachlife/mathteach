function validateLiveFraction(){if($("fractionAnswerWrap").classList.contains("hidden")||answered)return;const a=readSharedFraction();const msg=$("input-message");msg.textContent=a.empty?"":a.valid?"✓ 格式正確，已是最簡形式，可以送出。":a.message;msg.classList.toggle("ok",a.valid);$("submit-button").disabled=!a.valid;}
function freezeAnswerWidgets(){answerLocked=true;answerWidgets?.number?.setDisabled(true);}
function parseAnswer(x){x=String(x||"").trim().replaceAll("－","-").replaceAll("−","-").replace(/\s+/g," ");if(!x)return{valid:false,message:"請先輸入答案。"};if(/^[-+]?\d+$/.test(x))return{valid:true,value:rat(+x),display:x,simplest:true};let m=x.match(/^([+-]?)(\d+)\s+(\d+)\/(\d+)$/);if(m){const s=m[1]==="-"?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return{valid:false,message:"分母不能是 0。"};if(n>=d)return{valid:false,message:"帶分數的分數部分要是真分數，例如 -1 2/3。"};return{valid:true,value:rat(s*(w*d+n),d),display:x,simplest:gcd(n,d)===1}}m=x.match(/^([+-]?\d+)\/([+-]?\d+)$/);if(m){const n=+m[1],d=+m[2];if(!d)return{valid:false,message:"分母不能是 0。"};return{valid:true,value:rat(n,d),display:x,simplest:gcd(n,d)===1}}return{valid:false,message:"格式無法辨識。請輸入整數、分數或帶分數，例如 -3、-2/5、-1 2/3。"}}
function cq(o){return{...o,kind:"choice",answer:String(o.answer)}}function fq(o){return{...o,kind:"fraction"}}function choices(correct,wrong){return shuffle([{value:"correct",text:correct},...wrong.map((x,i)=>({value:`wrong${i+1}`,text:x}))])}
function simplifyBox(r){const g=gcd(r.n,r.d),s=rat(r.n,r.d);if(g===1)return `<div class="box rule">分子 ${Math.abs(r.n)} 與分母 ${r.d} 互質，所以 ${fracHTML(r.n,r.d)} 已是最簡分數。</div>`;return `<div class="box calc">分子、分母同除以 ${g}：${fracHTML(r.n,r.d)}＝${fracHTML(r.n/g,r.d/g)}</div><div class="box rule">最簡分數為 <strong>${ratHTML(s)}</strong>。</div>`}
function addSubExplain(a,op,b,ans){const b2=op==="-"?neg(b):b,cd=lcm(a.d,b.d),an=a.n*(cd/a.d),bn=b2.n*(cd/b2.d),rn=an+bn,rr=raw(rn,cd);let h=`<strong>第 1 步｜先處理運算符號</strong>`;if(op==="-")h+=`<div class="box rule">減去一個數，等於加上這個數的相反數。</div><div class="box calc">${ratHTML(a)}－${signed(b)}＝${ratHTML(a)}＋${signed(b2)}</div>`;else h+=`<div class="box rule">本題是加法，直接判斷是否需要通分。</div>`;if(a.d===b.d)h+=`<strong>第 2 步｜同分母，分母保持不變</strong><div class="box calc">${fracHTML(a.n,a.d)}＋${fracHTML(b2.n,b2.d)}＝${fracHTML(rn,cd)}</div>`;else h+=`<strong>第 2 步｜異分母先通分</strong><div class="box rule">教材建議用分母的最小公倍數作為公分母：〔${a.d} , ${b.d}〕＝${cd}</div><div class="box calc">${ratHTML(a)}＝${fracHTML(an,cd)}<br>${ratHTML(b2)}＝${fracHTML(bn,cd)}</div><strong>第 3 步｜分母相同後計算分子</strong><div class="box calc">${fracHTML(an,cd)}＋${fracHTML(bn,cd)}＝${fracHTML(rn,cd)}</div>`;return h+`<strong>最後｜約分成最簡分數</strong>${simplifyBox(rr)}<strong>答案：</strong> ${ratHTML(ans,Math.abs(ans.n)>ans.d)}`}
function mulExplain(fs,ans){const nc=fs.filter(x=>x.n<0).length,sg=nc%2?-1:1,rn=fs.reduce((p,x)=>p*Math.abs(x.n),1),rd=fs.reduce((p,x)=>p*x.d,1),rr=raw(sg*rn,rd);return `<strong>第 1 步｜先判斷乘積正負</strong><div class="box rule">共有 ${nc} 個負數，${nc%2?"負號個數為奇數，所以乘積為負。":"負號個數為偶數，所以乘積為正。"}</div><strong>第 2 步｜分子乘分子、分母乘分母</strong><div class="box calc">${fs.map(x=>ratHTML(x)).join(" × ")}＝${sg<0?"−":""}${rn}/${rd}</div><strong>第 3 步｜約分</strong>${simplifyBox(rr)}<strong>答案：</strong> ${ratHTML(ans,Math.abs(ans.n)>ans.d)}`}
function divExplain(a,b,ans){const r=recip(b);return `<strong>第 1 步｜除法改成乘法</strong><div class="box rule">除以一個不為 0 的數，等於乘以這個數的倒數。</div><div class="box calc">${ratHTML(a)}÷${signed(b)}＝${ratHTML(a)}×${signed(r)}</div><strong>第 2 步｜完成乘法</strong>${mulExplain([a,r],ans)}`}
function compareNegExplain(vals,ordered){const cd=vals.map(x=>x.d).reduce((a,b)=>lcm(a,b));return `<strong>第 1 步｜先比較絕對值</strong><div class="box rule">負數離 0 越遠，數值越小；所以負分數的絕對值越大，原數反而越小。</div><strong>第 2 步｜通分比較</strong><div class="box calc">公分母＝${cd}<br>${vals.map(v=>`｜${ratHTML(v)}｜＝${fracHTML(Math.abs(v.n)*(cd/v.d),cd)}`).join("<br>")}</div><strong>第 3 步｜把大小方向反過來</strong><div class="box calc">${ordered.map(v=>ratHTML(v)).join(" ＜ ")}</div>`}
// 模式一
function qEquivalent(){const b=pick([rat(-2,3),rat(-3,4),rat(5,7),rat(-4,5),rat(7,9)]),k=rand(2,5);return cq({key:`eq-${Date.now()}-${Math.random()}`,label:"下列哪一個分數和題目中的分數等值？",html:`<div>${ratHTML(b)}</div>`,choices:choices(`${b.n*k}/${b.d*k}`,[`${b.n*k}/${b.d}`,`${b.n}/${b.d*k}`,`${-b.n*k}/${b.d*k}`]),answer:"correct",topic:"等值分數",explanation:`<div class="box rule">分子、分母同乘或同除一個不為 0 的整數，分數的值不變。</div><div class="box calc">${ratHTML(b)}＝${fracHTML(b.n*k,b.d*k)}</div>`})}
function qSimplify(){const b=pick([rat(-1,4),rat(-2,5),rat(3,7),rat(-5,8),rat(7,12),rat(-4,9)]),k=rand(2,8),r=raw(b.n*k,b.d*k);return fq({key:`simp-${Date.now()}-${Math.random()}`,label:"將下列分數化為最簡分數",html:`<div>${fracHTML(r.n,r.d)}</div>`,answer:b,topic:"約分與最簡分數",explanation:`<strong>第 1 步｜找最大公因數</strong><div class="box calc">（${Math.abs(r.n)} , ${r.d}）＝${gcd(r.n,r.d)}</div><strong>第 2 步｜分子、分母同除</strong>${simplifyBox(r)}`})}
function qSimplest(){const r=pick([raw(2,7),raw(-6,25),raw(9,15),raw(-14,21),raw(11,18),raw(-15,28)]),yes=gcd(r.n,r.d)===1;return cq({key:`simple-${Date.now()}-${Math.random()}`,label:"這個分數已經是最簡分數嗎？",html:`<div>${fracHTML(r.n,r.d)}</div>`,choices:[{value:"yes",text:"是"},{value:"no",text:"不是"}],answer:yes?"yes":"no",topic:"最簡分數",explanation:`<div class="box rule">分子與分母互質時，才是最簡分數。</div><div class="box calc">（${Math.abs(r.n)} , ${r.d}）＝${gcd(r.n,r.d)}</div>${yes?"所以已是最簡分數。":"所以還可以約分。"}`})}
function qNegativeRep(){const n=rand(2,9),d=rand(n+1,14);return cq({key:`neg-${Date.now()}-${Math.random()}`,label:"哪一個表示和題目完全相同？",html:`<div>−（${n}/${d}）</div>`,choices:choices(`-${n}/${d}`,[`${n}/${d}`,`-${d}/${n}`,`${n}/-${d} 的相反數`]),answer:"correct",topic:"負分數表示",explanation:`<div class="box rule">${fracHTML(-n,d)}＝−${fracHTML(n,d)}。負號通常寫在整個分數前面。</div>`})}
function qCompare2(){const [a,b]=pick([[rat(-2,9),rat(-1,6)],[rat(-1,2),rat(-3,4)],[rat(-3,5),rat(-5,8)],[rat(-7,10),rat(-2,3)],[rat(-4,7),rat(-5,9)]]),c=cmp(a,b),ord=c<0?[a,b]:[b,a];return cq({key:`cmp2-${Date.now()}-${Math.random()}`,label:"比較下列兩個負分數的大小",html:`<div>${ratHTML(a)}　？　${ratHTML(b)}</div>`,choices:[{value:"lt",text:"＜"},{value:"eq",text:"＝"},{value:"gt",text:"＞"}],answer:c<0?"lt":c>0?"gt":"eq",topic:"負分數比較",explanation:compareNegExplain([a,b],ord)})}
function qCompare3(){const v=pick([[rat(-1,3),rat(-3,5),rat(-5,7)],[rat(-1,2),rat(-3,4),rat(-5,8)],[rat(-3,2),rat(-4,3),rat(-7,6)]]),s=[...v].sort(cmp),right=s.map(x=>ratText(x)).join(" < ");return cq({key:`cmp3-${Date.now()}-${Math.random()}`,label:"哪一個排列是由小到大？",html:`<div>${v.map(x=>ratHTML(x)).join("、")}</div>`,choices:choices(right,[[...s].reverse().map(x=>ratText(x)).join(" < "),`${ratText(v[0])} < ${ratText(v[2])} < ${ratText(v[1])}`,`${ratText(v[1])} < ${ratText(v[0])} < ${ratText(v[2])}`]),answer:"correct",topic:"負分數比較",explanation:compareNegExplain(v,s)})}
function qMissing(){const b=pick([rat(-3,4),rat(-2,9),rat(5,6),rat(-7,10)]),k=rand(2,6);if(Math.random()<.5){const den=b.d*k,ans=b.n*k;return cq({key:`missn-${Date.now()}-${Math.random()}`,label:"填入空格，使兩個分數等值",html:`<div>${ratHTML(b)} ＝ □/${den}</div>`,choices:choices(String(ans),[String(b.n),String(-ans),String(ans+1)]),answer:"correct",topic:"擴分",explanation:`<div class="box calc">分母 ${b.d}×${k}＝${den}，所以分子也同乘 ${k}：${b.n}×${k}＝<strong>${ans}</strong>。</div>`})}const num=b.n*k,ans=b.d*k;return cq({key:`missd-${Date.now()}-${Math.random()}`,label:"填入空格，使兩個分數等值",html:`<div>${ratHTML(b)} ＝ ${num}/□</div>`,choices:choices(String(ans),[String(b.d),String(ans-1),String(ans+2)]),answer:"correct",topic:"擴分",explanation:`<div class="box calc">分子 ${b.n}×${k}＝${num}，所以分母也同乘 ${k}：${b.d}×${k}＝<strong>${ans}</strong>。</div>`})}
function conceptSet(){return shuffle([qEquivalent(),qEquivalent(),qSimplify(),qSimplify(),qSimplest(),qNegativeRep(),qCompare2(),qCompare2(),qCompare3(),qMissing()])}
// 模式二 加減
function qSame(){const d=pick([7,11,13,15,17]),a=rat(rand(-16,16)||5,d),b=rat(rand(-16,16)||-7,d),op=Math.random()<.5?"+":"-",ans=op==="+"?add(a,b):sub(a,b);return fq({key:`same-${Date.now()}-${Math.random()}`,label:"計算下列同分母分數",html:`<div>${ratHTML(a)} ${op==="+"?"＋":"－"} ${signed(b)}</div>`,answer:ans,topic:"同分母加減",preferMixed:Math.abs(ans.n)>ans.d,explanation:addSubExplain(a,op,b,ans)})}
function qDiff(){const [d1,d2]=pick([[5,7],[12,9],[15,6],[15,12],[8,9],[6,11]]),a=rat(pick([-7,-5,-3,2,4,7]),d1),b=rat(pick([-8,-5,-2,1,4,7]),d2),op=Math.random()<.5?"+":"-",ans=op==="+"?add(a,b):sub(a,b);return fq({key:`diff-${Date.now()}-${Math.random()}`,label:"計算下列異分母分數",html:`<div>${ratHTML(a)} ${op==="+"?"＋":"－"} ${signed(b)}</div>`,answer:ans,topic:"異分母加減",preferMixed:Math.abs(ans.n)>ans.d,explanation:addSubExplain(a,op,b,ans)})}
function qParen(){const items=[{a:rat(2,3),b:rat(-2,3),c:rat(11,13),t:1},{a:rat(-5,17),b:rat(12,17),c:rat(-5,4),t:2},{a:rat(7,11),b:rat(4,11),c:rat(-3,17),t:1},{a:rat(8,15),b:rat(8,15),c:rat(7,19),t:2}],x=pick(items);if(x.t===1){const ab=add(x.a,x.b),ans=add(ab,x.c);return fq({key:`paren1-${Date.now()}-${Math.random()}`,label:"去括號後計算",html:`<div>${ratHTML(x.a)}＋〔${ratHTML(x.b)}＋${ratHTML(x.c)}〕</div>`,answer:ans,topic:"去括號",explanation:`<div class="box rule">括號前是「＋」，去括號後符號不變。</div><div class="box calc">${ratHTML(x.a)}＋${ratHTML(x.b)}＋${ratHTML(x.c)}</div><strong>先合併同分母：</strong>${addSubExplain(x.a,"+",x.b,ab)}<strong>再計算最後一項：</strong>${addSubExplain(ab,"+",x.c,ans)}`})}const ab=sub(x.a,x.b),ans=add(ab,x.c);return fq({key:`paren2-${Date.now()}-${Math.random()}`,label:"去括號後計算",html:`<div>${ratHTML(x.a)}－〔${ratHTML(x.b)}－${ratHTML(x.c)}〕</div>`,answer:ans,topic:"去括號",explanation:`<div class="box rule">－（a－b）＝－a＋b。</div><div class="box calc">${ratHTML(x.a)}－${ratHTML(x.b)}＋${ratHTML(x.c)}</div><strong>先算前兩項：</strong>${addSubExplain(x.a,"-",x.b,ab)}<strong>再加最後一項：</strong>${addSubExplain(ab,"+",x.c,ans)}`})}
function qAssoc(){const [a,b,c]=pick([[rat(-11,7),rat(-11,6),rat(25,7)],[rat(11,3),rat(-7,16),rat(-17,3)],[rat(-6,13),rat(5,9),rat(-7,13)]]),pair=add(a,c),ans=add(pair,b);return fq({key:`assoc-${Date.now()}-${Math.random()}`,label:"利用交換律與結合律計算",html:`<div>${ratHTML(a)}＋${signed(b)}＋${signed(c)}</div>`,answer:ans,topic:"交換律與結合律",explanation:`<div class="box rule">加法交換律 a＋b＝b＋a；結合律（a＋b）＋c＝a＋（b＋c）。</div><div class="box calc">先算同分母：${ratHTML(a)}＋${signed(c)}＝${ratHTML(pair)}</div>${addSubExplain(pair,"+",b,ans)}`})}
function qMixedAdd(){const [a,op,b]=pick([[improper(3,4,7,-1),"-",improper(2,1,7,-1)],[improper(2,3,7,-1),"+",improper(1,1,7,1)],[improper(2,1,6,-1),"-",improper(2,1,8,1)],[improper(4,2,5,-1),"+",improper(1,2,3,1)]]),ans=op==="+"?add(a,b):sub(a,b);return fq({key:`mixadd-${Date.now()}-${Math.random()}`,label:"計算負帶分數的加減",html:`<div>${ratHTML(a,true)} ${op==="+"?"＋":"－"} ${signed(b,true)}</div>`,answer:ans,topic:"帶分數加減",preferMixed:true,explanation:`<strong>第 1 步｜帶分數化成假分數</strong><div class="box calc">${ratHTML(a,true)}＝${ratHTML(a)}<br>${ratHTML(b,true)}＝${ratHTML(b)}</div>${addSubExplain(a,op,b,ans)}<div class="box tip">教材也允許把整數部分與分數部分分開計算；本解析採先化成假分數，步驟較一致。</div>`})}
function qDistance(){const [a,b]=pick([[improper(5,2,3,1),improper(2,1,6,-1)],[improper(4,2,5,-1),rat(2,5)],[improper(3,1,4,1),improper(1,2,3,-1)]]),ans=abs(sub(a,b));return fq({key:`dist-${Date.now()}-${Math.random()}`,label:"數線上兩點的距離",html:`<div>A 點 ${ratHTML(a,true)}，B 點 ${ratHTML(b,true)}，求兩點距離。</div>`,answer:ans,topic:"加減應用",preferMixed:true,explanation:`<div class="box rule">數線上兩點 a、b 的距離可用 ｜a－b｜。</div><div class="box calc">｜${ratHTML(a)}－${signed(b)}｜＝｜${ratHTML(sub(a,b))}｜＝<strong>${ratHTML(ans,true)}</strong></div>`})}
function addSet(){return shuffle([qSame(),qSame(),qDiff(),qDiff(),qDiff(),qParen(),qAssoc(),qMixedAdd(),qMixedAdd(),qDistance()])}
// 模式三 乘法
function qMul(){const a=pick([rat(-9,5),rat(2,3),rat(-3,8),rat(-8,25),rat(15,14)]),b=pick([rat(7,18),rat(-6,5),rat(-6,9),rat(-35,16),rat(-28,5)]),ans=mul(a,b);return fq({key:`mul-${Date.now()}-${Math.random()}`,label:"計算下列正負分數乘法",html:`<div>${ratHTML(a)} × ${signed(b)}</div>`,answer:ans,topic:"分數乘法",preferMixed:Math.abs(ans.n)>ans.d,explanation:mulExplain([a,b],ans)})}
function qMulMixed(){const [a,b]=pick([[improper(1,1,5,-1),rat(-4,3)],[improper(2,1,7,-1),rat(-7,15)],[improper(3,1,3,-1),improper(2,2,5,1)],[improper(2,1,2,-1),rat(-9,4)]]),ans=mul(a,b);return fq({key:`mulm-${Date.now()}-${Math.random()}`,label:"帶分數先化成假分數，再做乘法",html:`<div>${ratHTML(a,true)} × ${signed(b,true)}</div>`,answer:ans,topic:"帶分數乘法",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<strong>第 1 步｜帶分數化成假分數</strong><div class="box calc">${ratHTML(a,true)}＝${ratHTML(a)}<br>${ratHTML(b,true)}＝${ratHTML(b)}</div>${mulExplain([a,b],ans)}`})}
function qMulChain(){const fs=pick([[rat(2,3),rat(-5,6),rat(-4,7)],[rat(-12),rat(5,6),improper(1,1,3,1)],[rat(14),improper(2,1,7,-1),improper(1,1,5,-1)],[rat(-9,14),improper(1,7,12,-1),rat(-8,19)]]),ans=fs.reduce(mul);return fq({key:`mulc-${Date.now()}-${Math.random()}`,label:"計算分數的連乘",html:`<div>${fs.map(x=>signed(x,Math.abs(x.n)>x.d)).join(" × ")}</div>`,answer:ans,topic:"分數連乘",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<div class="box rule">多個不為 0 的分數連乘：負號個數為奇數，乘積為負；負號個數為偶數，乘積為正。</div>${mulExplain(fs,ans)}`})}
function mulSet(){return shuffle([qMul(),qMul(),qMul(),qMul(),qMulMixed(),qMulMixed(),qMulChain(),qMulChain(),qMulChain(),qMul()])}
// 模式四 除法
function qRecip(){const v=pick([rat(5),rat(-1),rat(-1,7),improper(3,2,5,-1),rat(-6,5),rat(4,9)]),r=recip(v);return cq({key:`rec-${Date.now()}-${Math.random()}`,label:"下列哪一個是題目中數的倒數？",html:`<div>${ratHTML(v,true)}</div>`,choices:choices(ratText(r,Math.abs(r.n)>r.d),[ratText(v),ratText(neg(r)),`${r.n+1}/${r.d}`]),answer:"correct",topic:"倒數",explanation:`<div class="box rule">兩個數的乘積為 1 時，稱兩數互為倒數。</div><div class="box calc">${ratHTML(v)} × ${ratHTML(r)}＝1</div>所以倒數是 <strong>${ratHTML(r)}</strong>。`})}
function qZeroRecip(){return cq({key:`zero-${Date.now()}-${Math.random()}`,label:"0 有倒數嗎？",html:"<div>0 × □ ＝ 1？</div>",choices:[{value:"yes",text:"有"},{value:"no",text:"沒有"}],answer:"no",topic:"倒數",explanation:`<div class="box rule">0 × 任何數都不可能等於 1，所以 <strong>0 沒有倒數</strong>。</div>`})}
function qDiv(){const [a,b]=pick([[rat(4,7),rat(-9,11)],[rat(3,5),improper(1,2,3,-1)],[rat(-5,3),rat(-7,2)],[improper(2,1,4,-1),improper(1,2,5,1)],[rat(-5,13),improper(2,23,26,1)]]),ans=div(a,b);return fq({key:`div-${Date.now()}-${Math.random()}`,label:"計算下列正負分數除法",html:`<div>${ratHTML(a,true)} ÷ ${signed(b,true)}</div>`,answer:ans,topic:"分數除法",preferMixed:Math.abs(ans.n)>ans.d,explanation:divExplain(a,b,ans)})}
function qMulDiv(){const [a,o1,b,o2,c]=pick([[rat(3,5),"÷",rat(-9,14),"×",improper(2,6,7,1)],[improper(4,2,3,-1),"×",improper(2,1,4,1),"÷",rat(-7,2)],[improper(13,1,2,-1),"÷",rat(-9,16),"×",rat(3,4)],[rat(8,5),"×",improper(2,1,7,-1),"÷",improper(3,1,5,1)]]),b2=o1==="÷"?recip(b):b,c2=o2==="÷"?recip(c):c,ans=mul(mul(a,b2),c2);return fq({key:`md-${Date.now()}-${Math.random()}`,label:"計算分數的乘除混合",html:`<div>${ratHTML(a,true)} ${o1} ${signed(b,true)} ${o2} ${signed(c,true)}</div>`,answer:ans,topic:"乘除混合",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<strong>第 1 步｜把所有除法改成乘以倒數</strong><div class="box calc">${ratHTML(a)} × ${signed(b2)} × ${signed(c2)}</div><div class="box tip">教材提醒：連乘除宜先全部化成連乘，再一起約分計算。</div>${mulExplain([a,b2,c2],ans)}`})}
function divSet(){return shuffle([qRecip(),qRecip(),qRecip(),qZeroRecip(),qDiv(),qDiv(),qDiv(),qDiv(),qMulDiv(),qMulDiv()])}
// 模式五 四則與分配律
function qMixedBasic(){const cases=[{a:rat(-2),b:rat(2,5),c:rat(-4,7),d:improper(1,3,4,1),t:1},{a:rat(-2,3),b:rat(2,7),c:rat(-5,3),t:2},{a:improper(3,1,3,-1),b:rat(-3,10),c:rat(-1,4),d:rat(4),t:1}],x=pick(cases);if(x.t===1){const p1=mul(x.a,x.b),p2=mul(x.c,x.d),ans=add(p1,p2);return fq({key:`mix1-${Date.now()}-${Math.random()}`,label:"依四則運算順序計算",html:`<div>${ratHTML(x.a,true)} × ${signed(x.b,true)} ＋ ${signed(x.c,true)} × ${signed(x.d,true)}</div>`,answer:ans,topic:"四則混合",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<div class="box rule">四則混合：先乘除，後加減；同一層級由左而右。</div><strong>第 1 步｜先算乘法</strong><div class="box calc">${ratHTML(x.a)}×${signed(x.b)}＝${ratHTML(p1)}<br>${ratHTML(x.c)}×${signed(x.d)}＝${ratHTML(p2)}</div><strong>第 2 步｜再做加法</strong>${addSubExplain(p1,"+",p2,ans)}`})}const q=div(x.a,x.b),ans=sub(q,x.c);return fq({key:`mix2-${Date.now()}-${Math.random()}`,label:"依四則運算順序計算",html:`<div>${ratHTML(x.a)} ÷ ${ratHTML(x.b)} － ${signed(x.c)}</div>`,answer:ans,topic:"四則混合",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<div class="box rule">先算除法，再算減法。</div>${divExplain(x.a,x.b,q)}<strong>再算減法：</strong>${addSubExplain(q,"-",x.c,ans)}`})}
function qParenMixed(){const x=pick([{k:rat(6),a:rat(2,3),op:"-",b:rat(7,9),type:"÷"},{k:rat(-4),a:rat(-3,5),op:"+",b:rat(1,10),type:"×"}]),inside=x.op==="+"?add(x.a,x.b):sub(x.a,x.b),ans=x.type==="÷"?div(x.k,inside):mul(x.k,inside);return fq({key:`pm-${Date.now()}-${Math.random()}`,label:"有括號時先算括號內",html:`<div>${ratHTML(x.k)} ${x.type}（${ratHTML(x.a)} ${x.op==="+"?"＋":"－"} ${signed(x.b)}）</div>`,answer:ans,topic:"括號與四則",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<div class="box rule">有括號時，優先計算括號內。</div><strong>第 1 步｜括號內</strong>${addSubExplain(x.a,x.op,x.b,inside)}<strong>第 2 步｜外面的${x.type==="÷"?"除法":"乘法"}</strong>${x.type==="÷"?divExplain(x.k,inside,ans):mulExplain([x.k,inside],ans)}`})}
function qDistrib(){const x=pick([{k:rat(7,5),a:rat(-20),op:"+",b:rat(5,7)},{k:rat(34),a:improper(1,1,2,1),op:"-",b:improper(2,2,17,1)},{k:rat(2,5),a:rat(5),op:"+",b:rat(15,2)},{k:rat(8,9),a:rat(-27,4),op:"-",b:rat(3,16)}]),inside=x.op==="+"?add(x.a,x.b):sub(x.a,x.b),ans=mul(x.k,inside),l=mul(x.k,x.a),r=mul(x.k,x.b);return fq({key:`distb-${Date.now()}-${Math.random()}`,label:"利用乘法分配律計算",html:`<div>${ratHTML(x.k)}×〔${ratHTML(x.a,true)} ${x.op==="+"?"＋":"－"} ${ratHTML(x.b,true)}〕</div>`,answer:ans,topic:"分配律",preferMixed:Math.abs(ans.n)>ans.d,explanation:`<div class="box rule">a×（b＋c）＝a×b＋a×c；a×（b－c）＝a×b－a×c。</div><div class="box calc">${ratHTML(x.k)}×${ratHTML(x.a)} ${x.op==="+"?"＋":"－"} ${ratHTML(x.k)}×${ratHTML(x.b)}＝${ratHTML(l)} ${x.op==="+"?"＋":"－"} ${ratHTML(r)}</div>${addSubExplain(l,x.op,r,ans)}`})}
function qEfficient(){const a=rat(9,22),b=rat(11,18),c=rat(23,22),d=rat(7,18),ans=sub(add(a,b),sub(c,d)),p1=sub(a,c),p2=add(b,d);return fq({key:`eff-${Date.now()}-${Math.random()}`,label:"利用去括號、交換律讓計算更簡單",html:`<div>${ratHTML(a)}＋${ratHTML(b)}－（${ratHTML(c)}－${ratHTML(d)}）</div>`,answer:ans,topic:"去括號與交換律",explanation:`<strong>第 1 步｜去括號</strong><div class="box calc">${ratHTML(a)}＋${ratHTML(b)}－${ratHTML(c)}＋${ratHTML(d)}</div><strong>第 2 步｜同分母先合併</strong><div class="box calc">（${ratHTML(a)}－${ratHTML(c)}）＋（${ratHTML(b)}＋${ratHTML(d)}）＝${ratHTML(p1)}＋${ratHTML(p2)}＝<strong>${ratHTML(ans)}</strong></div><div class="box tip">教材強調：若去括號後能把同分母放在一起，計算會更有效率。</div>`})}
function mixedSet(){return shuffle([qMixedBasic(),qMixedBasic(),qMixedBasic(),qParenMixed(),qParenMixed(),qDistrib(),qDistrib(),qDistrib(),qEfficient(),qMixedBasic()])}
// 競速
function quickChoices(ans){const arr=[ans,neg(ans),rat(ans.n+1,ans.d),rat(ans.n,ans.d+1)],seen=new Set(),out=[];arr.forEach((v,i)=>{const k=`${v.n}/${v.d}`;if(!seen.has(k)){seen.add(k);out.push({value:i===0?"correct":`wrong${i}`,text:ratText(v,Math.abs(v.n)>v.d)})}});while(out.length<4){const v=rat(ans.n+rand(-3,3),Math.max(1,ans.d+rand(-2,2))),k=`${v.n}/${v.d}`;if(!seen.has(k)){seen.add(k);out.push({value:`w${out.length}`,text:ratText(v)})}}return shuffle(out)}
function qQuickAdd(){const d=pick([5,7,9,11]),a=rat(rand(-6,6)||2,d),b=rat(rand(-6,6)||-3,d),ans=add(a,b);return cq({key:`qa-${Date.now()}-${Math.random()}`,label:"快速計算",html:`<div>${ratHTML(a)}＋${signed(b)}</div>`,choices:quickChoices(ans),answer:"correct",topic:"快速加減",explanation:addSubExplain(a,"+",b,ans)})}
function qQuickMul(){const a=rat(pick([-3,-2,2,3,4]),pick([4,5,7])),b=rat(pick([-5,-3,2,4]),pick([3,5,6])),ans=mul(a,b);return cq({key:`qm-${Date.now()}-${Math.random()}`,label:"快速計算",html:`<div>${ratHTML(a)}×${signed(b)}</div>`,choices:quickChoices(ans),answer:"correct",topic:"快速乘法",explanation:mulExplain([a,b],ans)})}
function qQuickDiv(){const a=rat(pick([-4,-3,2,3]),pick([5,7,8])),b=rat(pick([-5,-2,2,3]),pick([3,4,6])),ans=div(a,b);return cq({key:`qd-${Date.now()}-${Math.random()}`,label:"快速計算",html:`<div>${ratHTML(a)}÷${signed(b)}</div>`,choices:quickChoices(ans),answer:"correct",topic:"快速除法",explanation:divExplain(a,b,ans)})}
function speedQ(){const n=rand(1,5);return n===1?qQuickAdd():n===2?qQuickMul():n===3?qQuickDiv():n===4?qCompare2():qRecip()}
function comprehensiveSet(){const a=conceptSet(),b=addSet(),c=mulSet(),d=divSet(),e=mixedSet();return shuffle([a[0],a[1],b[0],b[1],c[0],c[1],d[0],d[1],e[0],e[1]])}
function questionSet(m){return m==="concept"?conceptSet():m==="addSubtract"?addSet():m==="multiply"?mulSet():m==="divide"?divSet():m==="mixed"?mixedSet():m==="comprehensive"?comprehensiveSet():[]}

/* 2-3 教材十五頁動態出題：反向生成題目，簽章以題型和實際數值計算 */
const makeRat=()=>{let n=rand(1,12)*(Math.random()<.5?-1:1),d=rand(2,16);return rat(n,d)};
const makeImproper=()=>{let n=rand(2,7),d=rand(2,9);return rat((Math.random()<.5?-1:1)*(rand(1,4)*d+n%d||d+1),d)};
const explainFinish=(a)=>`<div class="box rule">答案需化成最簡分數。</div><div class="box calc">${ratHTML(a)} ${a.d===1?"是整數。":"的分子與分母已互質。"}</div>`;
function generatedQuestion(type){
 const a=makeRat(),b=makeRat(),c=makeRat();let op,answer,html,label,explanation,topic;
 if(type==="compare"){
  let x=makeRat(),y=makeRat();while(eq(x,y))y=makeRat();const cmpValue=cmp(x,y);return cq({key:`compare:${x.n}/${x.d}:${y.n}/${y.d}`,label:"比較兩個分數的大小",html:`<div>${ratHTML(x)}　？　${ratHTML(y)}</div>`,choices:[{value:"lt",text:"＜"},{value:"eq",text:"＝"},{value:"gt",text:"＞"}],answer:cmpValue<0?"lt":cmpValue>0?"gt":"eq",topic:"負分數比較",explanation:`<div class="box rule">先通分；負數比較要注意越靠近零的數越大。</div><div class="box calc">公分母〔${x.d}, ${y.d}〕＝${lcm(x.d,y.d)}，所以 ${ratHTML(x)} ${cmpValue<0?"＜":"＞"} ${ratHTML(y)}。</div>`});
 }else if(type==="simplify"){
  let base=makeRat(),k=rand(2,9),r=raw(base.n*k,base.d*k);answer=base;label="將下列分數約成最簡分數";html=`<div>${fracHTML(r.n,r.d)}</div>`;topic="約分與擴分";
  explanation=`<strong>第一步｜找分子、分母最大公因數</strong><div class="box calc">（${Math.abs(r.n)}, ${r.d}）＝${k}</div><strong>第二步｜同除共同因數</strong><div class="box calc">${fracHTML(r.n,r.d)}＝${fracHTML(r.n/k,r.d/k)}</div>`;
 }else if(type==="equivalent"){
  const base=makeRat(),k=rand(2,8);label="等值分數：計算擴分後的分數值";html=`<div>${ratHTML(base)}＝${fracHTML(base.n*k,base.d*k)}＝？</div>`;answer=rat(base.n*k,base.d*k);topic="擴分";explanation=`<div class="box rule">分子、分母同乘 ${k}，分數值不變。</div><div class="box calc">${fracHTML(base.n*k,base.d*k)}＝${ratHTML(base)}</div>`;
 }else if(type==="add"||type==="subtract"){
  op=type==="add"?"+":"-";const same=Math.random()<.35,bb=same?rat(rand(1,11)*(Math.random()<.5?-1:1),a.d):b;answer=op==="+"?add(a,bb):sub(a,bb);label=same?"計算同分母分數加減":"計算異分母分數加減";html=`<div>${ratHTML(a)} ${op==="+"?"＋":"－"} ${signed(bb)}</div>`;topic="正負分數加減";explanation=addSubExplain(a,op,bb,answer);
 }else if(type==="mixedAdd"){
  const x=makeImproper(),y=makeImproper();op=Math.random()<.5?"+":"-";answer=op==="+"?add(x,y):sub(x,y);label="負帶分數的加減運算";html=`<div>${ratHTML(x,true)} ${op==="+"?"＋":"－"} ${signed(y,true)}</div>`;topic="帶分數加減";explanation=`<strong>第一步｜帶分數化成假分數</strong><div class="box calc">${ratHTML(x,true)}＝${ratHTML(x)}；${ratHTML(y,true)}＝${ratHTML(y)}</div>`+addSubExplain(x,op,y,answer);
 }else if(type==="parenAdd"){
  answer=sub(a,add(b,c));label="去括號後進行分數加減";html=`<div>${ratHTML(a)}－〔${ratHTML(b)}＋${signed(c)}〕</div>`;topic="去括號";explanation=`<div class="box rule">括號前為減號時，去括號後括號內每一項都要變號。</div><div class="box calc">${ratHTML(a)}－${ratHTML(b)}－${signed(c)}</div><strong>分步計算</strong>${addSubExplain(a,"-",b,sub(a,b))}${addSubExplain(sub(a,b),"-",c,answer)}`;
 }else if(type==="multiply"||type==="chain"){
  const fs=type==="chain"?[a,b,c]:[a,b];answer=fs.reduce(mul);label=fs.length===3?"正負分數連乘":"正負分數乘法";html=`<div>${fs.map((v,i)=>i?signed(v,true):ratHTML(v,true)).join(" × ")}</div>`;topic="分數乘法";explanation=mulExplain(fs,answer);
 }else if(type==="reciprocal"){
  const x=makeRat();answer=recip(x);label="求下列數的倒數";html=`<div>${ratHTML(x,true)}</div>`;topic="倒數";explanation=`<div class="box rule">兩數相乘為 1，互為倒數；0 沒有倒數。</div><div class="box calc">${ratHTML(x)} × ${ratHTML(answer)}＝1</div>`;
 }else if(type==="divide"){
  answer=div(a,b);label="正負分數的除法";html=`<div>${ratHTML(a)} ÷ ${signed(b)}</div>`;topic="分數除法";explanation=divExplain(a,b,answer);
 }else if(type==="mulDiv"){
  answer=mul(div(a,b),c);label="分數乘除混合";html=`<div>${ratHTML(a)} ÷ ${signed(b)} × ${signed(c)}</div>`;topic="乘除混合";explanation=`<strong>第一步｜除法改乘倒數</strong><div class="box calc">${ratHTML(a)} × ${signed(recip(b))} × ${signed(c)}</div>`+mulExplain([a,recip(b),c],answer);
 }else if(type==="distribution"){
  const k=rat(rand(2,12)*(Math.random()<.5?-1:1)),x=makeRat(),y=makeRat();op=Math.random()<.5?"+":"-";answer=mul(k,op==="+"?add(x,y):sub(x,y));label="利用分配律計算";html=`<div>${ratHTML(k)} ×〔${ratHTML(x)} ${op==="+"?"＋":"－"} ${signed(y)}〕</div>`;topic="分配律";const p=mul(k,x),q=mul(k,y);explanation=`<div class="box rule">a(b±c)=ab±ac，括號兩項都必須乘。</div><div class="box calc">${ratHTML(k)}×${ratHTML(x)} ${op==="+"?"＋":"－"} ${ratHTML(k)}×${ratHTML(y)}＝${ratHTML(p)} ${op==="+"?"＋":"－"} ${signed(q)}＝${ratHTML(answer)}</div>`;
 }else if(type==="mixed"){
  answer=add(mul(a,b),c);label="四則運算：先乘除，後加減";html=`<div>${ratHTML(a)} × ${signed(b)} ＋ ${signed(c)}</div>`;topic="四則運算";const p=mul(a,b);explanation=`<strong>第一步｜先乘法</strong><div class="box calc">${ratHTML(a)} × ${ratHTML(b)}＝${ratHTML(p)}</div><strong>第二步｜再加法</strong>`+addSubExplain(p,"+",c,answer);
 }else if(type==="investment"){
  const d=pick([6,8,10,12]),n1=rand(1,14),n2=rand(1,12),n3=rand(1,14),x=rat(n1,d),y=rat(-n2,d),z=rat(n3,d);answer=add(add(x,y),z);label="投資收益與虧損的分數應用";html=`<div>某人連續三月的收益依序為 ${ratHTML(x)}、${ratHTML(y)}、${ratHTML(z)} 單位金額，累計淨收益是多少？（負數代表虧損）</div>`;topic="生活應用";explanation=`<div class="box rule">收益為正，虧損為負，將三月的有號數相加。</div><div class="box calc">${ratHTML(x)}＋${signed(y)}＋${signed(z)}＝${ratHTML(answer)}</div>`;
 }else if(type==="distance"){
  const x=makeImproper(),y=makeImproper();answer=abs(sub(x,y));label="數線上兩點距離";html=`<div>A 點坐標為 ${ratHTML(x,true)}，B 點坐標為 ${ratHTML(y,true)}，求 AB 的距離。</div>`;topic="數線應用";explanation=`<div class="box rule">兩點距離＝坐標差的絕對值。</div><div class="box calc">|${ratHTML(x)}－${signed(y)}|＝${ratHTML(answer)}</div>`;
 }else{
  const x=makeRat(),y=makeRat(),z=makeRat();answer=add(sub(x,y),z);label="利用交換律與結合律計算";html=`<div>${ratHTML(x)}－${signed(y)}＋${signed(z)}</div>`;topic="運算規律";explanation=addSubExplain(sub(x,y),"+",z,answer);
 }
 const key=type+":"+html.replace(/<[^>]*>/g,"").replace(/\s+/g,"");
 return fq({key,label,html,answer,topic,explanation:explanation+`<div class="box tip">最後答案：<strong>${ratHTML(answer,Math.abs(answer.n)>answer.d)}</strong></div>`});
}
const GENERATION_PLAN={concept:["simplify","equivalent","compare","equivalent","simplify","compare","simplify","equivalent","compare","simplify"],addSubtract:["add","subtract","add","parenAdd","mixedAdd","distance","subtract","investment","mixedAdd","parenAdd"],multiply:["multiply","chain","multiply","chain","multiply","multiply","chain","multiply","chain","multiply"],divide:["reciprocal","divide","mulDiv","divide","reciprocal","mulDiv","divide","reciprocal","divide","mulDiv"],mixed:["mixed","parenAdd","distribution","mixed","distribution","mulDiv","mixed","distribution","parenAdd","mixed"],comprehensive:["simplify","add","mixedAdd","multiply","divide","mulDiv","parenAdd","distribution","investment","mixed"]};
function uniqueGenerated(types){const seen=new Set();const q=[];for(const t of shuffle(types)){let candidate=null;for(let i=0;i<90;i++){const x=generatedQuestion(t);if(!seen.has(x.key)){candidate=x;seen.add(x.key);break}}if(candidate)q.push(candidate)}return q;}
questionSet=function(m){return uniqueGenerated(GENERATION_PLAN[m]||GENERATION_PLAN.comprehensive)};
let speedSeen=new Set();speedQ=function(){for(let i=0;i<45;i++){const type=pick(["add","subtract","multiply","divide","reciprocal","simplify"]),x=generatedQuestion(type);if(!speedSeen.has(x.key)){speedSeen.add(x.key);return x}}speedSeen.clear();return generatedQuestion("add")};

// 遊戲流程
function startGame(m){
  modeId=m; attemptId=createAttemptId(); index=0; correct=0; wrong=0; combo=0; maxCombo=0; records=[]; selectedChoice=null; answered=false; elapsed=0; speedRemaining=60; speedAttempts=0; speedScore=0; scoreSaved=false; speedSeen.clear();
  $("save-status").textContent=""; $("review-button").disabled=false; $("time-box").classList.remove("danger");
  questions=m==="speed"?[]:questionSet(m); $("mode-display").textContent=MODE_CONFIG[m].name; $("score-display").textContent="0"; $("combo-display").textContent="0";
  showOnly("quiz-screen"); startTime=Date.now(); startTimer(); m==="speed"?renderSpeed():renderQuestion();
}
function resetUI(){
  window.resetGameScratchpad?.(); answered=false; selectedChoice=null; $("feedback").textContent=""; $("feedback").className="feedback"; $("explanation").innerHTML=""; $("explanation").classList.add("hidden"); $("input-message").textContent=""; $("submit-button").classList.remove("hidden"); $("next-button").classList.add("hidden"); answerLocked=false; answerWidgets?.number?.reset();answerWidgets?.number?.setDisabled(false);$("submit-button").disabled=false;
}
function renderQuestion(){
  resetUI(); const q=questions[index]; $("question-label").innerHTML=q.label; $("question-content").innerHTML=q.html; $("question-note").textContent=q.note||"";updateQuestionLayout(); renderAnswer(q); $("progress-bar").style.width=`${index/questions.length*100}%`; updateStatus();
}
function renderSpeed(){
  resetUI(); const q=speedQ(); questions=[q]; $("question-label").innerHTML=q.label; $("question-content").innerHTML=q.html; $("question-note").textContent="競速模式答題後會自動進入下一題；錯題可於測驗結果中回顧完整解析。";updateQuestionLayout(); renderAnswer(q); updateStatus();
}
function renderAnswer(q){
  $("choiceMount").innerHTML=""; $("choiceMount").classList.add("hidden"); $("fractionAnswerWrap").classList.add("hidden");
  if(q.kind==="choice"){
    $("submit-button").disabled=false;
    $("choiceMount").classList.remove("hidden");
    q.choices.forEach(c=>{const b=document.createElement("button"); b.type="button"; b.className="choice"; b.dataset.value=c.value; b.textContent=c.text; b.addEventListener("click",()=>{if(answered)return; selectedChoice=String(c.value); document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x===b)); $("input-message").textContent=""}); $("choiceMount").appendChild(b)});
  }else{
    $("fractionAnswerWrap").classList.remove("hidden");ensureFractionWidget();scheduleFractionValidation();
  }
}
function readAns(q){
  if(q.kind==="choice"){
    if(selectedChoice===null)return{valid:false,message:"請先選擇一個答案。"};
    const item=q.choices.find(c=>String(c.value)===String(selectedChoice)); return{valid:true,value:String(selectedChoice),display:item?.text??selectedChoice,simplest:true};
  }
  return readSharedFraction();
}
function isCorrect(q,a){return q.kind==="choice"?String(a.value)===String(q.answer):eq(a.value,q.answer)}
function correctAnswerHTML(q){if(q.kind==="choice"){const x=q.choices.find(c=>String(c.value)===String(q.answer));return x?.text??q.answer}return ratHTML(q.answer,!!q.preferMixed)}
function markChoices(q,a){
  if(q.kind!=="choice")return;
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;const v=String(b.dataset.value);if(v===String(q.answer))b.classList.add("correct-choice");if(v===String(a.value)&&v!==String(q.answer))b.classList.add("wrong-choice")});
}
function submitAnswer(){
  if(answered)return; const q=modeId==="speed"?questions[0]:questions[index],a=readAns(q); if(!a.valid){$("input-message").textContent=a.message;return} const ok=isCorrect(q,a); answered=true; if(q.kind!=="choice")freezeAnswerWidgets(); markChoices(q,a);
  if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo);sound("playCorrect")}else{wrong++;combo=0;sound("playWrong")}
  records.push({number:modeId==="speed"?speedAttempts+1:index+1,question:q,userAnswer:a.display,correct:ok});
  if(modeId==="speed"){
    speedAttempts++; if(ok)speedScore+=10; $("feedback").textContent=ok?"✅ 正確！＋10 分":"❌ 答錯了，下一題！"; $("feedback").className=`feedback ${ok?"correct":"wrong"}`; updateStatus();
    setTimeout(()=>{if(modeId==="speed"&&speedRemaining>0&&$("result-screen").classList.contains("hidden"))renderSpeed()},320); return;
  }
  let extra="";
  $("feedback").textContent=ok?`✅ 回答正確！${extra}`:"❌ 答案不正確，請看下方完整解析。"; $("feedback").className=`feedback ${ok?"correct":"wrong"}`; $("explanation").innerHTML=q.explanation; $("explanation").classList.remove("hidden"); $("submit-button").classList.add("hidden"); $("next-button").classList.remove("hidden"); $("next-button").textContent=index===questions.length-1?"查看測驗結果":"下一題"; updateStatus();
}
function nextQuestion(){if(!answered)return;index++;if(index>=questions.length){showResult();return}renderQuestion()}
function updateStatus(){
  $("combo-display").textContent=maxCombo;
  if(modeId==="speed"){$("score-display").textContent=speedScore;$("time-display").textContent=formatTime(speedRemaining);$("progress-bar").style.width=`${Math.min(100,(60-speedRemaining)/60*100)}%`;return}
  $("score-display").textContent=questions.length?Math.round(correct/questions.length*100):0; $("time-display").textContent=formatTime(elapsed);
}
function startTimer(){
  stopTimer(); timerId=setInterval(()=>{
    if(modeId==="speed"){
      speedRemaining--; if(speedRemaining<=10&&speedRemaining>0){$("time-box").classList.add("danger");urgent()} if(speedRemaining<=0){speedRemaining=0;updateStatus();stopTimer();setTimeout(showResult,50);return} updateStatus();return;
    }
    elapsed=Math.floor((Date.now()-startTime)/1000);updateStatus();
  },1000)
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function rating(score,accuracy){const v=modeId==="speed"?accuracy:score;if(v>=90)return{stars:"★★★★★",comment:"分數概念與四則運算掌握非常穩定，符號、通分、倒數與運算順序都能正確處理。"};if(v>=80)return{stars:"★★★★☆",comment:"整體掌握很好！再留意負分數大小、帶分數轉換，以及除法改乘倒數的步驟。"};if(v>=60)return{stars:"★★★☆☆",comment:"核心概念已建立，建議利用錯題回顧加強通分、去括號、乘除符號與四則順序。"};return{stars:"★★☆☆☆",comment:"建議依序從等值分數與最簡分數開始，再練加減、乘法、倒數與除法，最後進入四則混合。"}}
async function showResult(){
  if(!$("result-screen").classList.contains("hidden"))return; stopTimer(); elapsed=modeId==="speed"?60-speedRemaining:Math.floor((Date.now()-startTime)/1000); let score,accuracy,total;
  if(modeId==="speed"){total=speedAttempts;accuracy=total?Math.round(correct/total*100):0;score=speedScore}else{total=questions.length;score=Math.round(correct/total*1000)/10;accuracy=score}
  const r=rating(score,accuracy); showOnly("result-screen"); $("result-mode-name").textContent=MODE_CONFIG[modeId].name; $("final-score").textContent=modeId==="speed"?`${score} 分`:`${Number.isInteger(score)?score:score.toFixed(1)} 分`; $("final-stars").textContent=r.stars; $("final-comment").textContent=modeId==="speed"?`${r.comment}　本次 60 秒共作答 ${total} 題，正確率 ${accuracy}%。`:r.comment; $("final-correct").textContent=correct; $("final-wrong").textContent=wrong; $("final-combo").textContent=maxCombo; $("final-time").textContent=formatTime(elapsed); const wc=records.filter(x=>!x.correct).length; $("review-button").disabled=wc===0; $("review-button").textContent=wc===0?"全部答對，無錯題":`錯題回顧（${wc}）`; sound("playComplete"); await saveCompletion({score,accuracy,total});
}
async function saveScoreRecord({score,accuracy,total}){
  const status=$("save-status");
  try{
    const m=await import("../../js/scores.js?v=7"); if(typeof m.saveGameScore!=="function")return{success:false,reason:"module-missing"};
    return await m.saveGameScore({game:GAME_ID,mode:modeId,score,correctCount:correct,wrongCount:wrong,maxCombo,playTime:elapsed,totalQuestions:total,accuracy});
  }catch(e){console.error("2-3 成績儲存失敗：",e);status.textContent="⚠️ 本次遊戲已完成，但成績暫時無法儲存。";status.style.color="#b91c1c";return{success:false,reason:"save-error"}}
}
async function completeRpgBridge({score,accuracy,total}){
  const payload={gameId:GAME_ID,modeId,score,correct,total,playTime:elapsed,accuracy,maxCombo,attemptId,difficultyWeight:MODE_CONFIG[modeId]?.difficultyWeight??1};
  try{window.dispatchEvent(new CustomEvent("mathgame:session-complete",{detail:payload}))}catch{}
  try{const f=window.MathGameProgress?.completeLearningSession;if(typeof f==="function")return await f(payload)}catch(e){console.warn("RPG 全域橋接失敗：",e)}
  try{const m=await import("../../js/progress-system.js?v=1"),f=m.completeLearningSession||m.default?.completeLearningSession;if(typeof f==="function")return await f(payload)}catch{}
  return null;
}
async function saveCompletion({score,accuracy,total}){
  if(scoreSaved)return;scoreSaved=true;const status=$("save-status");status.textContent="☁️ 正在儲存本次成績……";status.style.color="#1d4ed8";const r=await saveScoreRecord({score,accuracy,total});
  if(r?.success){status.textContent="✅ 本次成績已儲存。";status.style.color="#15803d"}else if(r?.reason==="not-logged-in"){status.textContent="ℹ️ 尚未登入，因此本次成績沒有儲存。";status.style.color="#b45309"}else if(r?.reason!=="save-error"){status.textContent="⚠️ 成績暫時無法儲存。";status.style.color="#b91c1c"}
  await completeRpgBridge({score,accuracy,total});
}
function showReview(){
  const wr=records.filter(x=>!x.correct); if(!wr.length)$("review-list").innerHTML='<div class="review-card">全部答對，沒有需要回顧的錯題！</div>';else $("review-list").innerHTML=wr.map(r=>{const q=r.question;return `<article class="review-card"><div class="review-title">第 ${r.number} 題 ❌</div><div class="review-question">${q.label}<br>${q.html}</div><div class="review-answer">你的答案：<strong>${r.userAnswer||"未作答"}</strong><br>正確答案：<strong>${correctAnswerHTML(q)}</strong></div><div class="explain">${q.explanation}</div></article>`}).join(""); showOnly("review-screen");
}
// 事件
 document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));

$("restart-top").addEventListener("click",()=>{if(!confirm("確定重新測驗嗎？目前進度不會保留。"))return;stopTimer();startGame(modeId)});
$("reselect-top").addEventListener("click",()=>{if(!confirm("確定要重選模式嗎？目前進度不會保留。"))return;stopTimer();showOnly("start-screen")});
$("return-grade7").addEventListener("click",()=>{if(!$("quiz-screen").classList.contains("hidden")&&!confirm("測驗尚未完成，確定返回七年級上學期嗎？"))return;stopTimer();window.location.href="../../index.html?semester=grade7-first"});
window.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("quiz-screen").classList.contains("hidden")){if(!$("next-button").classList.contains("hidden"))nextQuestion();else submitAnswer()}});
</script>
