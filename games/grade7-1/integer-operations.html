<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正負數四則運算大挑戰</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='38' font-family='sans-serif' font-weight='700' fill='white'%3E%E9%81%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/scratchpad.css">

<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --amber:#d97706;
  --ink:#1f2937;
  --muted:#64748b;
  --line:#dbe3ef;
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  color:var(--ink)
}

body{
  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );
  padding:8px
}

button,
input,
select{
  font:inherit
}

.hidden{
  display:none!important
}

.app{
  width:100%;
  max-width:1500px;
  min-height:calc(100vh - 16px);
  margin:auto;
  background:#fff;
  border:3px solid #bfdbfe;
  border-radius:24px;
  box-shadow:
    0 18px 45px
    #1e3a8a22;
  overflow:hidden
}

.progress{
  height:10px;
  background:#e5e7eb
}

.progress>div{
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #2563eb
    );
  transition:width .25s
}

.inner{
  padding:24px
}

.title{
  text-align:center;
  color:var(--blue-dark);
  font-size:
    clamp(
      28px,
      4vw,
      42px
    );
  font-weight:900;
  margin:0 0 8px
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:0 0 24px;
  line-height:1.7
}

.modes{
  display:grid;
  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );
  gap:14px;
  max-width:980px;
  margin:0 auto 24px
}

.mode-card input{
  position:absolute;
  opacity:0
}

.mode-card span{
  display:block;
  border:
    2px solid
    var(--line);
  border-radius:17px;
  padding:16px;
  cursor:pointer;
  background:#fff;
  transition:.2s;
  height:100%
}

.mode-card input:checked+span{
  border-color:#3b82f6;
  background:#eff6ff;
  box-shadow:
    0 0 0 4px
    #3b82f622
}

.mode-title{
  font-weight:900;
  color:var(--blue-dark);
  font-size:18px
}

.example{
  font-family:
    "Times New Roman",
    serif;
  font-size:18px;
  margin-top:7px;
  color:#475569
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 20px;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.15s
}

.btn:active{
  transform:scale(.98)
}

.btn-primary{
  background:var(--blue);
  color:#fff
}

.btn-green{
  background:var(--green);
  color:#fff
}

.btn-light{
  background:#eff6ff;
  color:var(--blue-dark);
  border:
    2px solid
    #bfdbfe
}

.btn-danger-light{
  background:#fff1f2;
  color:#be123c;
  border:
    2px solid
    #fecdd3
}

.btn-neutral{
  background:#f1f5f9;
  color:#334155;
  border:
    2px solid
    #cbd5e1
}

.center{
  text-align:center
}

.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px
}

.pill{
  padding:9px 14px;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
  box-shadow:
    0 4px 12px
    #0f172a10
}

.pill-blue{
  background:#dbeafe;
  color:var(--blue-dark)
}

.pill-amber{
  background:#fef3c7;
  color:#92400e
}

.pill-gray{
  background:#f1f5f9;
  color:#475569
}

#scratchpad-mobile-button{
  display:flex;
  align-items:center
}

#scratchpad-mobile-button
.scratchpad-open-button{
  position:static!important;
  inset:auto!important;
  display:inline-flex!important;
  min-height:42px;
  padding:10px 16px;
  border:
    2px solid
    #c7d2fe;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #2563eb
    );
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer
}

.problem{
  background:#f8fafc;
  border:
    2px solid
    #e2e8f0;
  border-radius:20px;
  padding:28px 14px;
  text-align:center;
  font-family:
    "Times New Roman",
    serif;
  font-size:
    clamp(
      30px,
      5vw,
      52px
    );
  font-weight:700;
  margin-bottom:20px;
  white-space:nowrap;
  overflow-x:auto
}

.problem sup{
  font-size:.62em
}

.answer-wrap{
  max-width:760px;
  margin:auto
}

.answer-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-height:118px;
  padding:14px;
  border:
    2px solid
    #dbeafe;
  border-radius:18px;
  background:#f8fbff
}

.answer-card input{
  width:min(
    250px,
    72vw
  );
  min-height:58px;
  border:
    2px solid
    #cbd5e1;
  border-radius:12px;
  text-align:center;
  font-size:28px;
  font-weight:900;
  outline:none
}

.help{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin:9px 0 12px
}

.preview{
  min-height:26px;
  text-align:center;
  color:#64748b;
  margin:8px 0 14px
}

.actions{
  display:grid;
  gap:10px
}

.feedback{
  min-height:58px;
  margin-top:15px;
  text-align:center;
  font-size:19px;
  font-weight:900;
  line-height:1.55
}

.explanation-actions{
  display:flex;
  justify-content:center;
  margin-top:12px
}

.explanation-toggle{
  border:
    2px solid
    #93c5fd;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:12px;
  padding:10px 16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer
}

.explanation-panel{
  margin-top:12px;
  border:
    2px solid
    #bfdbfe;
  border-radius:16px;
  background:#f8fbff;
  padding:16px;
  text-align:left;
  color:#334155;
  line-height:1.7
}

.explanation-title{
  text-align:center;
  font-size:19px;
  font-weight:900;
  color:#1d4ed8;
  margin-bottom:10px
}

.explanation-step{
  border-left:
    4px solid
    #60a5fa;
  background:#fff;
  border-radius:10px;
  padding:10px 12px;
  margin:9px 0
}

.explanation-step-label{
  display:block;
  color:#1e40af;
  font-weight:900;
  margin-bottom:5px
}

.explanation-math{
  text-align:center;
  font-family:
    "Times New Roman",
    serif;
  font-size:24px;
  font-weight:700;
  overflow-x:auto;
  white-space:nowrap;
  padding:4px 0
}

.explanation-final{
  border-color:#22c55e;
  background:#f0fdf4
}

.result-box{
  max-width:760px;
  margin:auto;
  text-align:center
}

.grade-card{
  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );
  border:
    2px solid
    #bfdbfe;
  border-radius:22px;
  padding:24px;
  margin:18px 0
}

.grade-big{
  font-size:54px;
  font-weight:900;
  color:var(--blue-dark)
}

.stars{
  font-size:34px;
  letter-spacing:4px;
  margin:6px 0
}

.comment{
  font-size:20px;
  font-weight:900;
  color:#334155
}

.score-grid{
  display:grid;
  grid-template-columns:
    repeat(
      3,
      1fr
    );
  gap:12px;
  margin:18px 0
}

.score-card{
  background:#f8fafc;
  border:
    2px solid
    #e2e8f0;
  border-radius:16px;
  padding:15px
}

.score-card b{
  display:block;
  font-size:26px;
  margin-top:5px
}

.result-actions{
  display:grid;
  grid-template-columns:
    repeat(
      3,
      1fr
    );
  gap:10px
}

.save-status{
  min-height:24px;
  margin:10px 0 16px;
  font-size:15px;
  font-weight:900
}

.math-frac{
  display:inline-flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  min-width:.9em;
  margin:0 .08em;
  vertical-align:middle;
  text-align:center;
  line-height:.95
}

.math-frac .top,
.math-frac .bottom{
  display:block;
  padding:0 .12em;
  font-size:.68em;
  line-height:1
}

.math-frac .top{
  padding-bottom:.08em;
  border-bottom:
    2px solid
    currentColor
}

.math-frac .bottom{
  padding-top:.08em
}

.sign-select{
  min-width:70px;
  height:52px;
  padding:0 8px;
  border:
    2px solid
    #cbd5e1;
  border-radius:10px;
  background:#fff;
  font-size:22px;
  font-weight:900
}

.whole-input{
  width:88px!important;
  min-height:52px!important;
  border:
    2px solid
    #cbd5e1;
  border-radius:10px;
  text-align:center;
  font-size:22px!important;
  font-weight:900;
  outline:none
}

.fraction-input{
  position:relative;
  display:grid;
  grid-template-rows:
    48px
    48px;
  gap:9px;
  width:92px
}

.fraction-input input{
  width:100%;
  height:48px;
  border:
    2px solid
    #cbd5e1;
  border-radius:10px;
  text-align:center;
  font-size:22px;
  font-weight:900
}

.fraction-line{
  position:absolute;
  left:4px;
  right:4px;
  top:50%;
  height:2px;
  background:#1f2937;
  transform:
    translateY(
      -1px
    );
  pointer-events:none
}

@media(max-width:760px){
  body{
    padding:4px
  }

  .inner{
    padding:14px
  }

  .modes{
    grid-template-columns:1fr
  }

  .topbar{
    gap:8px
  }

  .btn{
    padding:11px 13px;
    font-size:15px
  }

  .score-grid,
  .result-actions{
    grid-template-columns:1fr
  }

  .problem{
    font-size:
      clamp(
        28px,
        8vw,
        40px
      )
  }
}

/* ===== 與七上 2-3、2-4 統一的版面與操作規格 ===== */
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;--primary-border:#bfdbfe}
body{padding:12px;background:linear-gradient(135deg,#e9f3ff,#fff7e9)}
.common-header-mount{width:min(100%,1180px);margin:0 auto 12px}
.app{max-width:1180px;min-height:0;border:1px solid #c7d8f6;border-top:8px solid var(--primary);border-radius:26px}
.inner{padding:28px 24px}
.title{margin-bottom:12px}
.subtitle{max-width:800px;margin:0 auto 22px}
.modes{width:100%;max-width:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mode-card{display:block;min-width:0;min-height:150px;text-align:left;padding:22px;border:2px solid var(--primary-border);border-radius:20px;background:linear-gradient(180deg,var(--primary-light),#fff);cursor:pointer;transition:transform .16s,box-shadow .16s;color:var(--ink);font-family:inherit}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px #1e3a8a20;border-color:var(--primary)}
.mode-card:focus-visible,.topbar-action:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.mode-card .mode-title{font-size:21px;line-height:1.5;margin-bottom:10px}
.mode-card .example{font-family:inherit;font-size:15px;line-height:1.7;margin:0;color:var(--muted)}
.home-return-row{margin:6px 0 10px}
.home-return-row .btn{font-size:15px}
.topbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:stretch;justify-content:stretch;flex-wrap:nowrap;margin-bottom:15px}
.topbar>.status-tile,.topbar>.topbar-action{box-sizing:border-box;min-width:0;width:100%;height:73px;min-height:73px;max-height:73px;padding:8px 5px;margin:0;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center;box-shadow:none}
.topbar>.status-tile{border:1.5px solid var(--primary-border)}
.topbar .status-caption{font-size:12px;font-weight:800;line-height:1.1;color:var(--muted)}
.topbar .status-main{font-size:clamp(12px,1.4vw,17px);line-height:1.32;font-weight:900;color:var(--blue-dark);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.topbar-action{border:1.5px solid var(--primary-border);cursor:pointer;transition:filter .14s,transform .14s;font-family:inherit}
.topbar-action:hover{filter:brightness(.97)}
.topbar-action:active{transform:scale(.98)}
.action-restart{background:#e8f8eb;border-color:#94d2a0;color:#147137}
.action-restart .status-main{color:#147137}
.action-reselect{background:var(--primary-light);color:var(--primary-dark)}
.problem{position:relative;background:#fff;border:2px solid var(--primary-border);border-radius:20px;min-height:206px;padding:18px 18px 70px;margin-bottom:16px;font-family:inherit;font-size:inherit;white-space:normal;overflow:visible}
.question-number{color:var(--muted);font-size:18px;line-height:1.5;font-weight:900;margin-bottom:15px}
.problem-text{font-family:'Cambria Math','Times New Roman',serif;font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.65;white-space:normal;overflow-x:auto;overflow-y:hidden;overflow-wrap:normal;padding:4px 0}
.problem-text sup{font-size:.6em}
#scratchpad-mobile-button.scratchpad-corner{position:absolute;right:12px;bottom:11px;z-index:5;display:flex;justify-content:flex-end;align-items:center;width:auto;min-height:0}
#scratchpad-mobile-button.scratchpad-corner .scratchpad-open-button{position:static!important;inset:auto!important;display:inline-flex!important;width:auto!important;min-height:38px!important;padding:7px 13px!important;border:1.5px solid #d49b26!important;border-radius:12px!important;background:linear-gradient(#fffbdc,#f6b944)!important;color:#70460d!important;box-shadow:0 3px 0 #bd8721!important;font-size:13px!important;font-weight:900!important}
#scratchpad-mobile-button.scratchpad-corner .scratchpad-open-button[hidden]{display:none!important}
.answer-wrap{max-width:100%;margin:0}
.answer-card{max-width:850px;margin:0 auto;min-height:114px;padding:18px;background:#f8fbff;border-color:var(--primary-border)}
.help,.preview{text-align:center}
.actions{display:flex;justify-content:center;align-items:center;gap:12px}
.actions .btn{min-width:210px;max-width:100%}
.feedback{max-width:900px;margin:16px auto 0}
.explanation-panel{max-width:900px;margin:14px auto}
@media(max-width:850px){.topbar{gap:5px}.topbar>.status-tile,.topbar>.topbar-action{height:65px;min-height:65px;max-height:65px;padding:5px 3px}.topbar .status-main{font-size:12px}.topbar .status-caption{font-size:10px}}
@media(max-width:600px){body{padding:7px}.inner{padding:18px 14px}.modes{grid-template-columns:1fr}.mode-card{min-height:124px;padding:18px}.topbar{grid-template-columns:repeat(6,minmax(110px,1fr));overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.topbar>.status-tile,.topbar>.topbar-action{height:65px;min-height:65px;max-height:65px}.topbar .status-main{font-size:13px}.topbar .status-caption{font-size:11px}.problem{padding:17px 12px 67px;min-height:180px}.problem-text{font-size:clamp(24px,6.5vw,34px)}.actions .btn{width:100%}.answer-card{flex-wrap:wrap}.result-actions{grid-template-columns:1fr 1fr}}


/* 首頁返回鍵固定置於標題區右上角 */
.home-heading-bar{display:flex;justify-content:flex-end;align-items:center;margin:0 0 8px}
.home-return-top{font-size:14px;padding:9px 15px;white-space:nowrap}
/* 詳解的文字與算式分開，長算式可橫向滑動 */
.explanation-panel{font-size:16px;line-height:1.9}
.explanation-intro{padding:14px 16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;margin:10px 0;color:#7c2d12}
.explanation-original{padding:12px 14px;background:#fff;border:1px solid #dbeafe;border-radius:12px;margin:10px 0}
.explanation-original .explanation-math{margin-top:6px}
.explanation-step{padding:14px 16px;margin:12px 0}
.explanation-step-reason{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;font-size:15px;font-weight:500;line-height:1.75;color:#475569;margin:5px 0 9px}
.explanation-reminder{padding:12px 15px;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;color:#9f1239;margin-top:13px}
.explanation-math{font-size:clamp(19px,2.6vw,25px);line-height:1.8;white-space:normal;overflow-x:auto;overflow-wrap:normal}
@media(max-width:600px){.home-heading-bar{margin-bottom:14px}.home-return-top{font-size:12px;padding:8px 11px}.explanation-panel{padding:12px}.explanation-step{padding:12px}}

</style>
</head>

<body>

<div id="commonHeaderMount" class="common-header-mount"></div>
<main class="app">

  <div class="progress">
    <div id="progress-bar"></div>
  </div>

  <div class="inner">

    <section id="start-screen">

      <div class="home-heading-bar">
        <a class="btn btn-light home-return-top" href="../index.html?semester=grade7-first">↩ 返回七年級上學期</a>
      </div>
      <h1 class="title">
        正負數四則運算大挑戰
      </h1>

      <p class="subtitle">
        練習正負整數與分數的乘除、絕對值、乘方，以及整數與分數混合的四則運算。
      </p>

      <div class="modes">

        <button class="mode-card" type="button" data-mode="muldiv">
            <div class="mode-title">
              模式一｜正負數的乘除
            </div>

            <div class="example">
              整數與分數的正負乘除運算
            </div>
          </button>


        <button class="mode-card" type="button" data-mode="absolute">
            <div class="mode-title">
              模式二｜絕對值運算
            </div>

            <div class="example">
              例如：|−5| − |−7| − (−5)
            </div>
          </button>


        <button class="mode-card" type="button" data-mode="power">
            <div class="mode-title">
              模式三｜乘方計算
            </div>

            <div class="example">
              例如：−(−2)²
            </div>
          </button>


        <button class="mode-card" type="button" data-mode="mixed">
            <div class="mode-title">
              模式四｜四則運算
            </div>

            <div class="example">
              整數、絕對值與乘方的綜合運算
            </div>
          </button>


        <button class="mode-card" type="button" data-mode="advanced">
            <div class="mode-title">
              模式五｜四則運算進階挑戰
            </div>

            <div class="example">
              整數與分數混合四則運算
            </div>
          </button>

      </div>



    </section>


    <section
      id="quiz-screen"
      class="hidden"
    >

             <div class="topbar" aria-label="測驗資訊與操作">
         <div class="pill pill-blue status-tile"><span class="status-caption">模式</span><span id="mode-badge" class="status-main">模式一</span></div>
         <div class="pill pill-gray status-tile"><span class="status-caption">時間</span><span id="time-display" class="status-main">00:00</span></div>
         <div class="pill pill-blue status-tile"><span class="status-caption">分數</span><span id="live-score" class="status-main">0</span></div>
         <div class="pill pill-amber status-tile"><span class="status-caption">連擊</span><span id="live-combo" class="status-main">0</span></div>
         <button id="reset-btn" type="button" class="topbar-action action-restart"><span class="status-caption">測驗操作</span><span class="status-main">🔄 重新測驗</span></button>
         <button id="change-mode-btn" type="button" class="topbar-action action-reselect"><span class="status-caption">測驗操作</span><span class="status-main">↩ 重選模式</span></button>
       </div>

let operationsAudioContext =
  null;


function getOperationsAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (
    !AudioContextClass
  ) {
    return null;
  }

  if (
    !operationsAudioContext
  ) {
    operationsAudioContext =
      new AudioContextClass();
  }

  return operationsAudioContext;
}


async function ensureOperationsAudio() {

  const context =
    getOperationsAudioContext();

  if (
    !context
  ) {
    return null;
  }

  if (
    context.state ===
    "suspended"
  ) {
    try {
      await context.resume();
    } catch (error) {
      console.warn(
        "音效系統無法啟用：",
        error
      );
    }
  }

  return (
    context.state ===
    "running"
      ? context
      : null
  );
}


async function playOperationsTone({
  frequency = 440,
  duration = 0.18,
  type = "sine",
  volume = 0.14,
  delay = 0
} = {}) {

  const context =
    await ensureOperationsAudio();

  if (
    !context
  ) {
    return;
  }

  const startTime =
    context.currentTime +
    Math.max(
      0,
      delay
    );

  const endTime =
    startTime +
    Math.max(
      0.05,
      duration
    );

  const oscillator =
    context.createOscillator();

  const gain =
    context.createGain();

  oscillator.type =
    type;

  oscillator.frequency
    .setValueAtTime(
      frequency,
      startTime
    );

  gain.gain
    .setValueAtTime(
      0.0001,
      startTime
    );

  gain.gain
    .exponentialRampToValueAtTime(
      Math.max(
        0.0001,
        volume
      ),
      startTime + 0.02
    );

  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      endTime
    );

  oscillator.connect(
    gain
  );

  gain.connect(
    context.destination
  );

  oscillator.start(
    startTime
  );

  oscillator.stop(
    endTime
  );

  oscillator.addEventListener(
    "ended",
    () => {

      oscillator.disconnect();

      gain.disconnect();
    },
    {
      once:true
    }
  );
}

/*
==================================================
數學工具
==================================================
*/

function rand(
  min,
  max
) {
  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  arr
) {
  return arr[
    rand(
      0,
      arr.length - 1
    )
  ];
}


function shuffle(
  arr
) {

  for (
    let i =
      arr.length - 1;

    i > 0;

    i--
  ) {

    const j =
      rand(
        0,
        i
      );

    [
      arr[i],
      arr[j]
    ] = [
      arr[j],
      arr[i]
    ];
  }

  return arr;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );

  b =
    Math.abs(
      b
    );

  while (
    b
  ) {

    const t =
      a % b;

    a =
      b;

    b =
      t;
  }

  return (
    a ||
    1
  );
}


function simplify(
  n,
  d
) {

  if (
    d === 0
  ) {
    throw new Error(
      "分母不可為 0"
    );
  }

  if (
    d < 0
  ) {
    n =
      -n;

    d =
      -d;
  }

  const g =
    gcd(
      n,
      d
    );

  return {
    n:
      n / g,

    d:
      d / g
  };
}


function addR(
  a,
  b
) {
  return simplify(
    a.n * b.d +
    b.n * a.d,

    a.d * b.d
  );
}


function subR(
  a,
  b
) {
  return simplify(
    a.n * b.d -
    b.n * a.d,

    a.d * b.d
  );
}


function mulR(
  a,
  b
) {
  return simplify(
    a.n * b.n,
    a.d * b.d
  );
}


function divR(
  a,
  b
) {
  return simplify(
    a.n * b.d,
    a.d * b.n
  );
}


function intR(
  n
) {
  return {
    n,
    d:1
  };
}


function absR(
  a
) {
  return {
    n:
      Math.abs(
        a.n
      ),

    d:
      a.d
  };
}


function eqR(
  a,
  b
) {
  return (
    a.n === b.n &&
    a.d === b.d
  );
}


function formatNumber(
  n
) {
  return String(
    n
  ).replace(
    "-",
    "−"
  );
}


/*
==================================================
數學符號格式
==================================================

規則：

1. 正整數：
   5

2. 負整數：
   (−5)
   當它是另一個運算元時加括號

3. 減去負數：
   5 − (−3)

4. 乘以負數：
   (−6) × (−1)

5. 正整數乘方：
   6²

6. 負整數乘方：
   (−6)²
==================================================
*/


function signedInteger(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : String(
          n
        )
  );
}


/*
專門用於絕對值內的第二個加減運算元。

例如：

|−4 − (−3)|

而不是：

|−4 − −3|
*/

function signedInnerOperand(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : formatNumber(
          n
        )
  );
}


/*
乘法／除法的整數因數。

負數一定加括號。
*/

function integerFactorHTML(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : String(
          n
        )
  );
}


function powerBaseHTML(
  base
) {

  return (
    base < 0
      ? `(${formatNumber(
          base
        )})`
      : String(
          base
        )
  );
}


function power(
  base,
  exp
) {
  return Math.pow(
    base,
    exp
  );
}


/*
==================================================
分數格式
==================================================
*/

function fracHTML(
  value,
  parens = false
) {

  const r =
    simplify(
      value.n,
      value.d
    );


  if (
    r.d === 1
  ) {

    const s =
      formatNumber(
        r.n
      );

    return (
      parens &&
      r.n < 0
        ? `(${s})`
        : s
    );
  }


  const core =
    `${
      r.n < 0
        ? "−"
        : ""
    }` +
    `<span class="math-frac">` +
      `<span class="top">` +
        `${Math.abs(
          r.n
        )}` +
      `</span>` +
      `<span class="bottom">` +
        `${r.d}` +
      `</span>` +
    `</span>`;


  return (
    parens &&
    r.n < 0
      ? `(${core})`
      : core
  );
}


/*
乘法／除法中的分數。

分數形式加括號；
負整數也加括號；
正整數不加括號。
*/

function factorHTML(
  value
) {

  const r =
    simplify(
      value.n,
      value.d
    );


  if (
    r.d === 1
  ) {

    return integerFactorHTML(
      r.n
    );
  }


  const fraction =
    fracHTML(
      r,
      false
    );

  return (
    `(${fraction})`
  );
}


function rationalText(
  value
) {

  const r =
    simplify(
      value.n,
      value.d
    );

  return (
    r.d === 1
      ? formatNumber(
          r.n
        )
      : `${r.n}/${r.d}`
  );
}


function randomProperFraction({
  positiveOnly = false
} = {}) {

  let n;
  let d;

  do {

    d =
      rand(
        2,
        12
      );

    n =
      rand(
        1,
        d - 1
      );

  } while (
    gcd(
      n,
      d
    ) !== 1
  );


  if (
    !positiveOnly &&
    Math.random() < .5
  ) {
    n =
      -n;
  }


  return {
    n,
    d
  };
}


function randomNonZeroInteger(
  min = -12,
  max = 12,
  positiveOnly = false
) {

  let n;

  do {

    n =
      rand(
        min,
        max
      );

  } while (
    n === 0
  );


  if (
    positiveOnly
  ) {
    n =
      Math.abs(
        n
      );
  }


  return n;
}


/*
==================================================
模式一：乘除
==================================================
*/

function makeMulDivQuestion(
  positivePositive = false
) {

  const kind =
    pick([
      "ii",
      "if",
      "fi",
      "ff"
    ]);

  const op =
    Math.random() < .5
      ? "×"
      : "÷";

  let left;
  let right;
  let answer;


  const makeSign =
    () => {

      if (
        positivePositive
      ) {
        return 1;
      }

      return (
        Math.random() < .5
          ? -1
          : 1
      );
    };


  if (
    kind === "ii"
  ) {

    left =
      intR(
        randomNonZeroInteger(
          2,
          12,
          true
        ) *
        makeSign()
      );

    right =
      intR(
        randomNonZeroInteger(
          2,
          12,
          true
        ) *
        makeSign()
      );

  } else if (
    kind === "if"
  ) {

    left =
      intR(
        randomNonZeroInteger(
          2,
          10,
          true
        ) *
        makeSign()
      );

    right =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

  } else if (
    kind === "fi"
  ) {

    left =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

    right =
      intR(
        randomNonZeroInteger(
          2,
          10,
          true
        ) *
        makeSign()
      );

  } else {

    left =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

    right =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });
  }


  if (
    op === "÷" &&
    right.n === 0
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  answer =
    op === "×"
      ? mulR(
          left,
          right
        )
      : divR(
          left,
          right
        );


  if (
    Math.abs(
      answer.n
    ) > 120 ||
    answer.d > 60
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  const steps =
    [];


  if (
    op === "×"
  ) {

    steps.push([
      "判斷正負號",

      `${
        left.n *
        right.n <
        0
          ? "異號相乘，結果為負"
          : "同號相乘，結果為正"
      }。`
    ]);


    steps.push([
      "分子乘分子、分母乘分母",

      `${factorHTML(
        left
      )} × ${factorHTML(
        right
      )} = ${fracHTML({
        n:
          left.n *
          right.n,

        d:
          left.d *
          right.d
      })}`
    ]);

  } else {

    steps.push([
      "除以一個數等於乘以它的倒數",

      `${factorHTML(
        left
      )} ÷ ${factorHTML(
        right
      )} = ${factorHTML(
        left
      )} × ${factorHTML({
        n:
          right.d,

        d:
          right.n
      })}`
    ]);


    steps.push([
      "進行乘法",

      `${factorHTML(
        left
      )} × ${factorHTML({
        n:
          right.d,

        d:
          right.n
      })} = ${fracHTML(
        answer
      )}`
    ]);
  }


  steps.push([
    "化成最簡分數",

    `${fracHTML(
      answer
    )}`
  ]);


  return {

    html:
      `${factorHTML(
        left
      )} ${op} ${factorHTML(
        right
      )}`,

    answer,

    steps
  };
}


/*
==================================================
模式二：絕對值
==================================================
*/

function makeAbsoluteQuestion() {

  const type =
    rand(
      1,
      4
    );

  let html;
  let answer;
  let steps;


  if (
    type === 1
  ) {

    const a =
      randomNonZeroInteger(
        -20,
        20
      );

    answer =
      intR(
        Math.abs(
          a
        )
      );

    html =
      `|${formatNumber(
        a
      )}|`;

    steps = [
      [
        "絕對值表示與 0 的距離",

        `|${formatNumber(
          a
        )}| = ${Math.abs(
          a
        )}`
      ]
    ];


  } else if (
    type === 2
  ) {

    const a =
      randomNonZeroInteger(
        -15,
        15
      );

    const b =
      randomNonZeroInteger(
        -12,
        12
      );

    answer =
      intR(
        Math.abs(
          a
        ) -
        b
      );

    html =
      `|${formatNumber(
        a
      )}| − ${signedInteger(
        b
      )}`;

    steps = [
      [
        "先算絕對值",

        `|${formatNumber(
          a
        )}| = ${Math.abs(
          a
        )}`
      ],

      [
        "再做減法",

        `${Math.abs(
          a
        )} − ${signedInteger(
          b
        )} = ${formatNumber(
          answer.n
        )}`

/*
==================================================
模式三：乘方
==================================================
*/

function randomPowerBase() {

  if (
    Math.random() <
    0.65
  ) {

    return pick([
      -4,
      -3,
      -2,
      2,
      3,
      4
    ]);
  }


  return pick([
    -8,
    -7,
    -6,
    -5,
    5,
    6,
    7,
    8
  ]);
}


function exponentForBase(
  base
) {

  const absoluteBase =
    Math.abs(
      base
    );


  if (
    absoluteBase ===
    2
  ) {
    return rand(
      2,
      10
    );
  }


  if (
    absoluteBase ===
    3
  ) {
    return rand(
      2,
      6
    );
  }


  if (
    absoluteBase ===
    4
  ) {
    return rand(
      2,
      5
    );
  }


  return rand(
    2,
    3
  );
}


function makePowerQuestion(
  forceConfusing =
    Math.random() < .6
) {

  let base =
    randomPowerBase();

  let exp =
    exponentForBase(
      base
    );

  let html;
  let answer;
  let steps;


  if (
    forceConfusing
  ) {

    const form =
      rand(
        1,
        4
      );


    if (
      form === 1
    ) {

      const absBase =
        Math.abs(
          base
        );

      answer =
        intR(
          -power(
            -absBase,
            exp
          )
        );

      html =
        `−(−${absBase})` +
        `<sup>${exp}</sup>`;

      steps = [
        [
          "先算括號內的乘方",

          `(−${absBase})` +
          `<sup>${exp}</sup>` +
          ` = ${formatNumber(
            power(
              -absBase,
              exp
            )
          )}`
        ],

        [
          "再處理最前面的負號",

          `−(${formatNumber(
            power(
              -absBase,
              exp
            )
          )}) = ${formatNumber(
            answer.n
          )}`
        ]
      ];


    } else if (
      form === 2
    ) {

      base =
        -Math.abs(
          base
        );

      answer =
        intR(
          power(
            base,
            exp
          )
        );

      html =
        `${powerBaseHTML(
          base
        )}` +
        `<sup>${exp}</sup>`;

      steps = [
        [
          "辨認底數",

          `括號表示底數是 ${formatNumber(
            base
          )}。`
        ],

        [
          "判斷奇偶次方",

          `${exp} 是${
            exp % 2 === 0
              ? "偶"
              : "奇"
          }數，因此答案為${
            answer.n < 0
              ? "負"
              : "正"
          }。`
        ],

        [
          "計算",

          `${formatNumber(
            answer.n
          )}`
        ]
      ];


    } else if (
      form === 3
    ) {

      const absBase =
        Math.max(
          5,
          Math.abs(
            base
          )
        );

      exp =
        rand(
          2,
          3
        );

      answer =
        intR(
          -power(
            absBase,
            exp
          )
        );

      html =
        `−${absBase}` +
        `<sup>${exp}</sup>`;

      steps = [
        [
          "先算乘方",

          `${absBase}` +
          `<sup>${exp}</sup>` +
          ` = ${power(
            absBase,
            exp
          )}`
        ],

        [
          "負號不在括號內",

          `−${power(
            absBase,
            exp
          )} = ${formatNumber(
            answer.n
          )}`
        ]
      ];


    } else {

      const absBase =
        Math.max(
          5,
          Math.abs(
            base
          )
        );

      base =
        -absBase;

      exp =
        rand(
          2,
          3
        );

      answer =
        intR(
          power(
            base,
            exp
          )
        );

      html =
        `${powerBaseHTML(
          base
        )}` +
        `<sup>${exp}</sup>`;

      steps = [
        [
          "括號內整體是底數",

          `底數為 ${formatNumber(
            base
          )}。`
        ],

        [
          "判斷奇偶次方",

          `${exp} 是${
            exp % 2 === 0
              ? "偶"
              : "奇"
          }數，因此答案為${
            answer.n < 0
              ? "負"
              : "正"
          }。`
        ],

        [
          "計算",

          `${formatNumber(
            answer.n
          )}`
        ]
      ];
    }


  } else {

    answer =
      intR(
        power(
          base,
          exp
        )
      );

    html =
      `${powerBaseHTML(
        base
      )}` +
      `<sup>${exp}</sup>`;


    steps = [
      [
        "展開乘方",

        `${html} 表示 ` +
        `${Array(
          exp
        ).fill(
          integerFactorHTML(
            base
          )
        ).join(
          " × "
        )}`
      ],

      [
        "計算",

        `${formatNumber(
          answer.n
        )}`
      ]
    ];
  }


  return {
    html,
    answer,
    steps
  };
}


/*
==================================================
模式四、模式五共用乘方
==================================================
*/

function exponentForMixedModes(
  base
) {

  return (
    Math.abs(
      base
    ) <= 3
      ? rand(
          2,
          3
        )
      : 2
  );
}


function makeMixedModePower() {

  const base =
    pick([
      -8,
      -7,
      -6,
      -5,
      -4,
      -3,
      -2,
      2,
      3,
      4,
      5,
      6,
      7,
      8
    ]);


  const exp =
    exponentForMixedModes(
      base
    );


  return {

    base,

    exp,

    value:
      power(
        base,
        exp
      ),

    /*
    關鍵修正：

    正整數：
    6²

    負整數：
    (−6)²
    */

    html:
      `${powerBaseHTML(
        base
      )}` +
      `<sup>${exp}</sup>`
  };
}


/*
==================================================
模式四：四則運算
==================================================
*/

function makeMixedQuestion() {

  const type =
    rand(
      1,
      5
    );

  let html;
  let answer;
  let steps;


  if (
    type === 1
  ) {

    const a =
      randomNonZeroInteger(
        -8,
        8
      );

    const b =
      randomNonZeroInteger(
        -8,
        8
      );

    const p =
      makeMixedModePower();


    answer =
      intR(
        Math.abs(
          a - b
        ) -
        b *
        p.base +
        p.value
      );


    /*
    關鍵修正：

    |−4 − −3|

    改成：

    |−4 − (−3)|
    */

    html =
      `|${formatNumber(
        a
      )} − ${signedInnerOperand(
        b
      )}|` +
      ` − ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        p.base
      )}` +
      ` + ${p.html}`;


    steps = [
      [
        "先算絕對值內與乘方",

        `|${formatNumber(
          a
        )} − ${signedInnerOperand(
          b
        )}|` +
        ` = ${Math.abs(
          a - b
        )}，` +
        `${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )} × ${integerFactorHTML(
          p.base
        )}` +
        ` = ${formatNumber(
          b *
          p.base
        )}`
      ],

      [
        "最後由左到右做加減",

        `${Math.abs(
          a - b
        )}` +
        ` − ${signedInteger(
          b *
          p.base
        )}` +
        ` + ${formatNumber(
          p.value
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 2
  ) {

    const a =
      randomNonZeroInteger(
        -9,
        9
      );

    const b =
      randomNonZeroInteger(
        -5,
        5
      );

    const p =
      makeMixedModePower();


    answer =
      intR(
        Math.abs(
          a
        ) +
        b *
        p.base -
        p.value
      );


    html =
      `|${formatNumber(
        a
      )}|` +
      ` + ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        p.base
      )}` +
      ` − ${p.html}`;


    steps = [
      [
        "先算絕對值與乘方",

        `|${formatNumber(
          a
        )}| = ${Math.abs(
          a
        )}，${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )} × ${integerFactorHTML(
          p.base
        )}` +
        ` = ${formatNumber(
          b *
          p.base
        )}`
      ],

      [
        "最後做加減",

        `${Math.abs(
          a
        )}` +
        ` + ${signedInteger(
          b *
          p.base
        )}` +
        ` − ${formatNumber(
          p.value
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 3
  ) {

    const divisor =
      pick([
        -6,
        -5,
        -4,
        -3,
        3,
        4,
        5,
        6
      ]);

    const quotient =
      randomNonZeroInteger(
        -8,
        8
      );

    const dividend =
      divisor *
      quotient;

    const c =
      randomNonZeroInteger(
        -9,
        9
      );


    answer =
      intR(
        quotient +
        Math.abs(
          c
        )
      );


    html =
      `${integerFactorHTML(
        dividend
      )}` +
      ` ÷ ${integerFactorHTML(
        divisor
      )}` +
      ` + |${formatNumber(
        c
      )}|`;


    steps = [
      [
        "先算除法與絕對值",

        `${integerFactorHTML(
          dividend
        )}` +
        ` ÷ ${integerFactorHTML(
          divisor
        )}` +
        ` = ${formatNumber(
          quotient
        )}，` +
        `|${formatNumber(
          c
        )}| = ${Math.abs(
          c
        )}`
      ],

      [
        "再相加",

        `${formatNumber(
          quotient
        )}` +
        ` + ${Math.abs(
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 4
  ) {

    const p =
      makeMixedModePower();

    const b =
      randomNonZeroInteger(
        -6,
        6
      );

    const c =
      randomNonZeroInteger(
        -5,
        5
      );


    answer =
      intR(
        p.value +
        b *
        c
      );


    /*
    關鍵修正：

    (−6) × −1

    改成：

    (−6) × (−1)
    */

    html =
      `${p.html}` +
      ` + ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        c
      )}`;


    steps = [
      [
        "先算乘方",

        `${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )}` +
        ` × ${integerFactorHTML(
          c
        )}` +
        ` = ${formatNumber(
          b *
          c
        )}`
      ],

      [
        "最後相加",

        `${formatNumber(
          p.value
        )}` +
        ` + ${signedInteger(
          b *
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else {

    const a =
      randomNonZeroInteger(
        -10,
        10
      );

    const b =
      randomNonZeroInteger(
        -8,
        8
      );

    const c =
      randomNonZeroInteger(
        -6,
        6
      );


    answer =
      intR(
        Math.abs(
          a + b
        ) -
        c
      );


    html =
      `|${formatNumber(
        a
      )}` +
      ` + ${signedInnerOperand(
        b
      )}|` +
      ` − ${signedInteger(
        c
      )}`;


    steps = [
      [
        "先算絕對值內",

        `${formatNumber(
          a
        )}` +
        ` + ${signedInnerOperand(
          b
        )}` +
        ` = ${formatNumber(
          a + b
        )}`
      ],

      [
        "取絕對值",

        `|${formatNumber(
          a + b
        )}|` +
        ` = ${Math.abs(
          a + b
        )}`
      ],

      [
        "再做減法",

        `${Math.abs(
          a + b
        )}` +
        ` − ${signedInteger(
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];
  }


  if (
    Math.abs(
      answer.n
    ) > 5000
  ) {

    return makeMixedQuestion();
  }


  return {
    html,
    answer,
    steps
  };
}


/*

*/

function makeAdvancedQuestion() {

    rand(

        ` = ${fracHTML(

  ) {

        ),

          )

        `${factorHTML(

        )}` +

          )

        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];


  } else {

    const f3 =
      randomProperFraction();


    answer =
      subR(
        addR(
          f1,
          mulR(
            f2,
            f3
          )
        ),
        intR(
          i
        )
      );


    html =
      `${fracHTML(
        f1,
        true
      )}` +
      ` + ${factorHTML(
        f2
      )}` +
      ` × ${factorHTML(
        f3
      )}` +
      ` − ${signedInteger(

            f2,

          )
        )}` +
        ` − ${signedInteger(
          i
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];
  }


  if (
    Math.abs(
      answer.n
    ) > 500 ||
    answer.d > 120
  ) {

    return makeAdvancedQuestion();
  }


  return {
    html,
    answer,
    steps
  };
}


/*
==================================================
依模式產生題目
==================================================
*/

function makeQuestionByMode(
  selectedMode,
  positivePositive = false
) {

  if (
    selectedMode ===
    "muldiv"
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  if (
    selectedMode ===
    "absolute"
  ) {

    return makeAbsoluteQuestion();
  }


  if (
    selectedMode ===
    "power"
  ) {

    return makePowerQuestion();
  }


  if (
    selectedMode ===
    "mixed"
  ) {

    return makeMixedQuestion();
  }


  return makeAdvancedQuestion();
}


/*
==================================================
產生十題
==================================================
*/

function makeQuestions() {

  const out =
    [];

  const used =
    new Set();


  if (
    mode ===
    "muldiv"
  ) {

    const positiveQuestion =
      makeMulDivQuestion(
        true
      );

    out.push(
      positiveQuestion
    );

    used.add(
      positiveQuestion.html
        .replace(
          /\s+/g,
          " "
        )
    );


    while (
      out.length <
      TOTAL
    ) {

      const q =
        makeMulDivQuestion(
          false
        );

      const bothPositive =
        !q.html.includes(
          "−"
        );

      if (
        bothPositive
      ) {
        continue;
      }


      const key =
        q.html.replace(
          /\s+/g,
          " "
        );


      if (
        used.has(
          key
        )
      ) {
        continue;
      }


      used.add(
        key
      );

      out.push(
        q
      );
    }


  } else if (
    mode ===
    "power"
  ) {

    const confusingCount =
      6;


    for (
      let i = 0;
      i <
      confusingCount;
      i++
    ) {

      let q;

      do {

        q =
          makePowerQuestion(
            true
          );

      } while (
        used.has(
          q.html
        )
      );


      used.add(
        q.html
      );

      out.push(
        q
      );
    }


    while (
      out.length <
      TOTAL
    ) {

      const q =
        makePowerQuestion(
          false
        );


      if (
        used.has(
          q.html
        )
      ) {
        continue;
      }


      used.add(
        q.html
      );

      out.push(
        q
      );
    }


  } else {

    while (
      out.length <
      TOTAL
    ) {

      const q =
        makeQuestionByMode(
          mode
        );

      const key =
        q.html.replace(
          /\s+/g,
          " "
        );


      if (
        used.has(
          key
        )
      ) {
        continue;
      }


      used.add(
        key
      );

      out.push(
        q
      );
    }
  }


  return shuffle(
    out
  );
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer() {

  const correctAnswer =
    questions[
      index
    ].answer;


  const isInteger =
    correctAnswer.d ===
    1;


  if (
    isInteger
  ) {

    const raw =
      $("answer-input")
        .value
        .trim();


    if (
      !/^-?\d+$/.test(
        raw
      )
    ) {
      return null;
    }


    return {
      value:
        intR(
          Number(
            raw
          )
        ),

      simplest:
        true,

      mixedValid:
        true
    };
  }


  const wholeText =
    $("answer-whole")
      .value
      .trim();


  const numeratorText =
    $("answer-num")
      .value
      .trim();


  const denominatorText =
    $("answer-den")
      .value
      .trim();


  if (
    !/^\d*$/.test(
      wholeText
    ) ||
    !/^\d+$/.test(
      numeratorText
    ) ||
    !/^\d+$/.test(
      denominatorText
    )
  ) {

    return null;
  }


  const whole =
    wholeText === ""
      ? 0
      : Number(
          wholeText
        );


  const numerator =
    Number(
      numeratorText
    );


  const denominator =
    Number(
      denominatorText
    );


  if (
    whole < 0 ||
    numerator < 0 ||
    denominator <= 0
  ) {

    return null;
  }


  const sign =
    Number(
      $("answer-sign")
        .value
    );


  const mixedValid =
    whole === 0 ||
    numerator <
    denominator;


  const improperNumerator =
    whole *
    denominator +
    numerator;


  return {

    value:
      simplify(
        sign *
        improperNumerator,

        denominator
      ),

    simplest:
      gcd(
        numerator,
        denominator
      ) === 1,

    mixedValid
  };
}

  ) {

  }
}


/*
==================================================
解析
==================================================
*/

function explanationConcept(modeValue){
  const messages={
    muldiv:"先判斷正負號：同號得正、異號得負。乘法先約分再相乘；除法先改成乘以倒數，最後化為最簡分數。",
    absolute:"絕對值代表到 0 的距離，結果不會是負數。遇到絕對值與加減混合時，先計算絕對值內的算式，再依原本的加減符號計算。",
    power:"先辨認底數是否包含負號，再計算次方。負數加括號時，奇次方為負、偶次方為正；若負號在次方外，須最後處理。",
    mixed:"先處理括號與絕對值，再計算乘方，接著由左往右做乘除，最後由左往右做加減。每一步都要保留原本的正負號。",
    advanced:"正負分數的四則混合：先括號、乘方與乘除，再加減。加減分數需要通分；乘除分數要先約分或將除法改成乘倒數。"
  };
  return messages[modeValue]||messages.mixed;
}
function explanationStepReason(label,modeValue){
  const t=String(label||"");
  if(/正負號|同號|異號/.test(t))return "先只觀察兩個運算數的正負號，確定最後結果的符號，再計算數值大小。";
  if(/倒數|除法/.test(t))return "被除數不變；把除數的分子與分母交換，再將除號改成乘號，注意負號必須保留。";
  if(/分子乘|進行乘法|再算乘法|分數乘法/.test(t))return "先檢查分子與分母可否交叉約分，再將分子相乘、分母相乘；整數可看成分母是 1 的分數。";
  if(/最簡|約分/.test(t))return "分子、分母同除以最大公因數；若分母已為 1，就直接寫成整數。";
  if(/絕對值內/.test(t))return "依照括號內原本的加減順序計算，得到整個絕對值符號裡面的數。";
  if(/絕對值/.test(t))return "正數的絕對值是本身，負數的絕對值則去掉負號；最後結果一定大於或等於 0。";
  if(/辨認底數|括號內整體/.test(t))return "括號內的負數才是完整底數；沒有括號時，次方只作用在數字上，不會作用在前面的負號。";
  if(/判斷奇偶/.test(t))return "負底數連乘偶數次時負號成對抵消；連乘奇數次時會留下負號。";
  if(/乘方|展開乘方/.test(t))return "指數代表相同底數連乘的次數。請先完成次方，不要把底數與指數直接相乘。";
  if(/加減|再相加|再做減法|最後相加|由左到右/.test(t))return modeValue==="advanced"?"如果遇到分母不同的分數，先找最小公倍數通分，再合併分子；每個負號都必須連同該項保留。":"先把前面已算完的結果代入原式，再依序計算剩餘加減；減去負數相當於加上正數。";
  if(/計算/.test(t))return "依題目指定的先後順序運算，並確認正負號與數值大小。";
  return "將前一步算出的結果代回原式，逐步化簡，不跳過運算優先順序。";
}
function explanationHTML(q){
  const steps=(q.steps||[]).map((step,i)=>`
    <div class="explanation-step">
      <span class="explanation-step-label">步驟 ${i+1}｜${step[0]}</span>
      <div class="explanation-step-reason">${explanationStepReason(step[0],mode)}</div>
      <div class="explanation-math">${step[1]}</div>
    </div>`).join("");
  const conclusion=q.answer.d===1
    ? `分母為 1，因此答案寫成整數 ${fracHTML(q.answer)}。`
    : `分數答案要檢查分母為正數，且分子與分母沒有大於 1 的公因數。`;
  return `
    <div class="explanation-title">📘 完整逐步詳解</div>
    <div class="explanation-original"><strong>原題：</strong><div class="explanation-math">${q.html}</div></div>
    <div class="explanation-intro"><strong>先想一想｜</strong>${explanationConcept(mode)}</div>
    ${steps}
    <div class="explanation-step explanation-final">
      <span class="explanation-step-label">最後答案</span>
      <div class="explanation-math">${fracHTML(q.answer)}</div>
    </div>
    <div class="explanation-reminder"><strong>檢查提醒｜</strong>${conclusion}</div>
  `;
}


/*
==================================================
判斷答案
==================================================
*/

function checkAnswer() {

  if (
    locked
  ) {
    return;
  }


  const answer =
    readAnswer();


  if (
    !answer
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">請完整輸入有效答案。</span>';

    return;
  }


  if (
    questions[
      index
    ].answer.d !== 1 &&
    !answer.mixedValid
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">帶分數的分子必須小於分母。</span>';

    return;
  }


  if (
    questions[
      index
    ].answer.d !== 1 &&
    !answer.simplest
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">分數尚未化成最簡分數，請繼續約分。</span>';

    return;
  }


  locked =
    true;


  const q =
    questions[
      index
    ];


  const isCorrect =
    eqR(
      answer.value,
      q.answer
    );


  if (
    isCorrect
  ) {

    correct++;
    combo++;maxCombo=Math.max(maxCombo,combo);

    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;
    combo=0;

    playGameSound(
      "playWrong"
    );
  }


  refreshOperationsStatus();
  $("feedback").innerHTML =
    `
      <span
        style="
          color:${
            isCorrect
              ? "#15803d"
              : "#b91c1c"
          }
        "
      >
        ${
          isCorrect
            ? "✨ 正確！"
            : "❌ 答案不正確"
        }
      </span>

      <div class="explanation-actions">

        <button
          id="explanation-toggle"
          class="explanation-toggle"
        >
          查看解析
        </button>

      </div>

      <div
        id="explanation-panel"
        class="
          explanation-panel
          hidden
        "
      ></div>
    `;


  $("explanation-toggle")
    .onclick =
    () => {

      const panel =
        $("explanation-panel");


      const opening =
        panel.classList
          .contains(
            "hidden"
          );


      panel.classList
        .toggle(
          "hidden",
          !opening
        );


      $("explanation-toggle")
        .textContent =
        opening
          ? "收起解析"
          : "查看解析";


      if (
        opening
      ) {

        panel.innerHTML =
          explanationHTML(
            q
          );
      }
    };


  setTimeout(
    () => {

      $("submit-btn")
        .classList
        .add(
          "hidden"
        );


      $("next-btn")
        .classList
        .remove(
          "hidden"
        );


      $("next-btn")
        .textContent =
        index ===
        TOTAL - 1
          ? "查看測驗結果（Enter）"
          : "下一題（Enter）";


      nextReady =
        true;


      $("next-btn")
        .focus();

    },

    isCorrect
      ? 650
      : 950
  );
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !nextReady
  ) {
    return;
  }


  index++;


  if (
    index <
    TOTAL
  ) {

    loadQuestion();

  } else {

    showResult();
  }

/*
==================================================
儲存成績
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {
    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore({

        game:
          GAME_ID,

        mode,

        score,

        correctCount:
          correct,

        wrongCount:
          wrong,

        maxCombo:
          maxCombo,

        playTime:
          finalElapsed
      });


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";

      status.style.color =
        "#15803d";


    } else if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";

      status.style.color =
        "#b45309";


    } else {

      status.textContent =
        "⚠️ 成績暫時無法儲存。";

      status.style.color =
        "#b91c1c";
    }


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}
