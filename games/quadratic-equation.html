<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    一元二次方程式大挑戰｜數學遊戲樂園
  </title>

  <!-- 瀏覽器分頁圖示：一元二次方程式 x² -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231565c0'/%3E%3Ctext x='10' y='43' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='white'%3Ex%3C/text%3E%3Ctext x='36' y='24' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='%23ffeb3b'%3E2%3C/text%3E%3C/svg%3E"
  >

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --primary-light: #e3f2fd;
      --primary-border: #90caf9;

      --secondary: #00897b;
      --secondary-dark: #00695c;

      --orange: #f57c00;

      --text: #1e293b;
      --muted: #64748b;

      --success: #15803d;
      --danger: #dc2626;
      --warning: #b45309;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #f3e5f5,
          #fff8e1
        );
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          1020px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #dbeafe;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: #fff;

      box-shadow:
        0 14px 38px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        26px 20px 20px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #fff
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          29px,
          5vw,
          43px
        );
    }

    .game-subtitle {

      margin:
        10px auto 0;

      max-width: 780px;

      color:
        var(--muted);

      line-height: 1.75;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 16px;
    }

    .concept-chip {

      padding:
        7px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius: 999px;

      background: #fff;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {
      padding: 22px;
    }

    /*
    ==================================================
    模式
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 220px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          #eff6ff,
          #fff
        );

      color: inherit;

      text-align: left;

      cursor: pointer;

      transition: .16s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 26px
        rgba(
          15,
          23,
          42,
          .12
        );
    }

    .mode-tag {

      display: inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius: 999px;

      background: #fff;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 11px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.7;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 67px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background: #fff7ed;

      color: #c2410c;
    }

    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius: 999px;

      background: #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #26a69a
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: #fff;

      text-align: center;
    }

    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-size:
        clamp(
          20px,
          2.8vw,
          24px
        );

      font-weight: 900;

      line-height: 1.55;
    }

    .question-content {

      min-height: 150px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 16px;

      overflow-x: auto;

      padding:
        12px 5px;

      color:
        #0f172a;

      font-size:
        clamp(
          25px,
          4.7vw,
          42px
        );

      font-weight: 900;

      line-height: 1.75;

      -webkit-overflow-scrolling:
        touch;
    }

    .math {

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    .math sup,
    .explanation sup,
    .correct-answer sup,
    .preview-value sup,
    .review-question sup {

      position: relative;

      top: -.44em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    /*
    ★ 修正：
    題目下面的中文敘述放大
    */

    .question-note {

      width: 100%;

      margin-top: 4px;

      color:
        #475569;

      font-size:
        clamp(
          21px,
          2.7vw,
          26px
        );

      font-weight: 800;

      line-height: 1.7;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
    }

    .formula-general-form {

      margin:
        0 auto 10px;

      color:
        #334155;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        clamp(
          18px,
          2.7vw,
          24px
        );

      font-weight: 900;

      text-align: center;
    }

    .formula-box {

      padding:
        13px 22px;

      border:
        2px solid
        #bbdefb;

      border-radius: 14px;

      background:
        #f8fbff;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          22px,
          4vw,
          32px
        );
    }

    /*
    ==================================================
    ★ 原生 MathML 根號（全模式共用）
    ==================================================

    不再以「√ 字元 + CSS 橫線」人工拼接。
    直接使用瀏覽器原生 MathML <msqrt>，
    讓根號勾、橫線、粗細與長度自然連成一體。
    題目、詳解、公式、正確答案、目前答案預覽
    全部共用同一套顯示。
    ==================================================
    */

    .mathml-radical {

      display: inline-block;

      margin: 0 .04em;

      color: inherit;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size: 1em;

      line-height: 1;

      vertical-align: -0.16em;
    }

    .mathml-radical math {

      font-size: 1em;
    }

    .sqrt-key-demo {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 2em;

      min-height: 1.35em;

      font-size: 1.04em;

      line-height: 1;
    }

    /*
    ==================================================
    分數
    ==================================================
    */

    .math-fraction {

      display:
        inline-flex;

      flex-direction:
        column;

      align-items:
        stretch;

      justify-content:
        center;

      min-width:
        1.4em;

      margin:
        0 .08em;

      vertical-align:
        middle;

      line-height:
        1.05;
    }

    .math-fraction-top {

      padding:
        0 .15em .07em;

      border-bottom:
        2px solid
        currentColor;

      text-align: center;
    }

    .math-fraction-bottom {

      padding:
        .07em .15em 0;

      text-align: center;
    }

    /*
    ==================================================
    作答區
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding:
        20px 16px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 9px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size:
        clamp(
          20px,
          2.5vw,
          23px
        );

      font-weight: 900;

      line-height: 1.55;
    }

    .answer-help {

      margin:
        0 auto 14px;

      max-width: 780px;

      color:
        #64748b;

      text-align: center;

      font-size: 15px;

      font-weight: 800;

      line-height: 1.7;
    }

    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 11px;

      max-width: 780px;

      margin:
        0 auto;
    }

    .choice-button {

      min-height: 64px;

      padding: 12px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 14px;

      background: #fff;

      color:
        #1e293b;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /*
    ==================================================
    一般數值
    ==================================================
    */

    .single-answer-wrap {

      display: flex;

      justify-content: center;
    }

    .single-answer-input {

      width:
        min(
          100%,
          260px
        );

      height: 62px;

      padding:
        8px 12px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 13px;

      background: #fff;

      font-size: 26px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .single-answer-input:focus,
    .root-input:focus,
    .abc-input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(
          21,
          101,
          192,
          .12
        );
    }

    /*
    ==================================================
    Roots
    ==================================================
    */

    .root-input-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;

      width:
        min(
          100%,
          720px
        );

      margin:
        0 auto;
    }

    .root-box {

      min-width: 0;

      padding: 15px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 15px;

      background: #fff;
    }

    .root-box-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    /*
    ★ 修正：
    x＝_____ 永遠保持同一行
    */

    .root-expression {

      display: flex;

      align-items: center;

      justify-content: flex-start;

      flex-wrap: nowrap;

      gap: 8px;

      width: 100%;

      min-width: 0;

      white-space: nowrap;
    }

    .root-x {

      flex:
        0 0 auto;

      display:
        inline-block;

      white-space:
        nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 27px;

      font-weight: 900;

      line-height: 1;
    }

    .root-input {

      flex:
        1 1 auto;

      min-width: 0;

      width: 100%;

      height: 56px;

      padding:
        7px 10px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background: #fff;

      font-size: 23px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ★ 根的分數輸入模式
    可由一般答案格切換成「分子／分母」上下排列，
    不再要求學生以 / 表示分數。
    */

    .root-entry-body {

      flex:
        1 1 auto;

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: stretch;
    }

    /*
    根號答案格的視覺層：
    真正 input 保留鍵盤輸入與游標，
    畫面用 MathML 顯示完整根號橫線。
    */

    .root-normal-editor {

      position: relative;

      width: 100%;
    }

    .root-normal-editor .root-input {

      position: relative;

      z-index: 1;
    }

    .root-normal-editor.has-radical-render .root-input {

      color: transparent;

      caret-color: #2563eb;
    }

    .root-rich-display {

      position: absolute;

      inset: 0;

      z-index: 2;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 7px 10px;

      pointer-events: none;

      overflow: hidden;

      color: #0f172a;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size: 23px;

      font-weight: 900;

      white-space: nowrap;
    }

    .root-normal-editor.has-radical-render .root-rich-display {

      display: flex;
    }

    .root-fraction-editor {

      display: grid;

      grid-template-rows:
        1fr 1fr;

      width: 100%;

      min-height: 112px;

      overflow: hidden;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background: #fff;
    }

    .root-fraction-editor.hidden {
      display: none !important;
    }

    .root-fraction-field {

      position: relative;

      width: 100%;

      min-width: 0;

      height: 54px;
    }

    .root-fraction-field:first-child {

      border-bottom:
        2px solid
        #334155;
    }

    .root-fraction-input {

      position: relative;

      z-index: 1;

      width: 100%;

      min-width: 0;

      height: 54px;

      padding:
        7px 10px;

      border: 0;

      background: transparent;

      color: #0f172a;

      font-size: 22px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .root-fraction-field.has-radical-render .root-fraction-input {

      color: transparent;

      caret-color: #2563eb;
    }

    .root-fraction-rich {

      position: absolute;

      inset: 0;

      z-index: 2;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 5px 9px;

      pointer-events: none;

      overflow: hidden;

      color: #0f172a;

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;

      font-size: 22px;

      font-weight: 900;

      white-space: nowrap;
    }

    .root-fraction-field.has-radical-render .root-fraction-rich {

      display: flex;
    }

    .root-format-toggle {

      display: block;

      width: 100%;

      margin:
        9px 0 0;

      padding:
        7px 11px;

      border:
        1.5px solid
        #93c5fd;

      border-radius: 9px;

      background:
        #eff6ff;

      color:
        #1d4ed8;

      font-size: 13px;

      font-weight: 900;

      cursor: pointer;
    }

    .root-format-toggle:hover {

      background:
        #dbeafe;
    }

    .root-preview-fraction {

      display:
        inline-grid;

      grid-template-rows:
        auto auto;

      align-items: center;

      justify-items: stretch;

      min-width: 0;

      margin:
        0 .04em;

      vertical-align: middle;

      line-height: 1.03;
    }

    .root-preview-numerator {

      padding:
        0 .06em .025em;

      border-bottom:
        2px solid currentColor;

      text-align: center;

      white-space: nowrap;
    }

    .root-preview-denominator {

      padding:
        .025em .06em 0;

      text-align: center;

      white-space: nowrap;
    }

    .conjugate-preview {

      display: inline-flex;

      align-items: center;

      gap: .04em;

      white-space: nowrap;
    }

    .repeated-root-note {

      color: #b45309;

      font-family: "Microsoft JhengHei", sans-serif;

      font-size: .78em;

      font-weight: 900;

      white-space: nowrap;
    }

    .symbol-toolbar {

      display: flex;

      justify-content: center;

      gap: 7px;

      flex-wrap: wrap;

      margin-top: 12px;
    }

    .symbol-button {

      min-width: 48px;

      min-height: 44px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        7px 10px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 10px;

      background: #fff;

      color:
        var(--primary-dark);

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;
    }

    /*
    ==================================================
    ABC
    ==================================================
    */

    .abc-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      width:
        min(
          100%,
          680px
        );

      margin:
        0 auto;
    }

    .abc-box {

      padding: 14px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 14px;

      background: #fff;

      text-align: center;
    }

    .abc-label {

      display: block;

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      font-size: 22px;

      font-weight: 900;
    }

    .abc-input {

      width: 100%;

      height: 56px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 10px;

      background: #fff;

      font-size: 23px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .standard-preview {

      margin:
        16px auto 0;

      padding: 14px;

      max-width: 720px;

      border:
        2px solid
        #93c5fd;

      border-radius: 13px;

      background: #eff6ff;

      color:
        #1e3a8a;

      text-align: center;

      font-size: 22px;

      font-weight: 900;
    }

    /*
    ==================================================
    Pair
    ==================================================
    */

    .pair-number-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;

      width:
        min(
          100%,
          520px
        );

      margin:
        0 auto;
    }

    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        15px auto 0;

      padding: 13px;

      max-width: 780px;

      min-height: 60px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        #bfdbfe;

      border-radius: 13px;

      background:

/*

工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      Math.round(
        a
      )
    );


  b =
    Math.abs(
      Math.round(
        b
      )
    );


  while (
    b !==
    0
  ) {

    const t =
      a %
      b;


    a =
      b;


    b =
      t;
  }


  return (
    a ||
    1
  );
}


function gcd3(
  a,
  b,
  c
) {

  return gcd(
    gcd(
      a,
      b
    ),
    c
  );
}


function isPerfectSquare(
  number
) {

  if (
    number <
    0
  ) {

    return false;
  }


  const root =
    Math.round(
      Math.sqrt(
        number
      )
    );


  return (
    root *
    root ===
    number
  );
}


/*
==================================================
★ 完整根號 HTML
==================================================
*/

function escapeMathMLText(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    );
}


function rawSqrtMathML(
  innerMathML
) {

  return `

    <span class="mathml-radical">

      <math
        xmlns="http://www.w3.org/1998/Math/MathML"
        display="inline"
        aria-label="根號"
      >

        <msqrt>

          <mrow>
            ${innerMathML}
          </mrow>

        </msqrt>

      </math>

    </span>
  `;
}


function sqrtHTML(
  content
) {

  const raw =
    String(
      content
    )
      .trim();


  /*
  RAW:n 只用在詳解中刻意保留「尚未化簡」的根號，
  例如先顯示 √44，再說明 √44＝2√11。
  */

  if (
    /^RAW:\d+$/
      .test(
        raw
      )
  ) {

    const number =
      Number(
        raw.slice(
          4
        )
      );


    return rawSqrtMathML(
      `<mn>${number}</mn>`
    );
  }


  /*
  數字根號一律先化成最簡根式。
  例如：
  √8 → 2√2
  √12 → 2√3
  √18 → 3√2
  √9 → 3
  */

  if (
    /^\d+$/
      .test(
        raw
      )
  ) {

    const number =
      Number(
        raw
      );


    if (
      number ===
      0
    ) {

      return "0";
    }


    const simplified =
      simplifySqrt(
        number
      );


    if (
      simplified.inside ===
      1
    ) {

      return String(
        simplified.outside
      );
    }


    const radical =
      rawSqrtMathML(
        `<mn>${simplified.inside}</mn>`
      );


    return (

      simplified.outside ===
      1

        ? radical

        : `${simplified.outside}${radical}`
    );
  }


  /*
  公式中的判別式。
  */

  if (
    raw ===
    "b<sup>2</sup>－4ac" ||

    raw ===
    "b<sup>2</sup>-4ac"
  ) {

    return rawSqrtMathML(
      `

        <msup>
          <mi>b</mi>
          <mn>2</mn>
        </msup>

        <mo>−</mo>

        <mn>4</mn>

        <mi>a</mi>

        <mi>c</mi>
      `
    );
  }


  /*
  根號按鈕示意等單一字母。
  */

  if (
    /^[A-Za-z]$/
      .test(
        raw
      )
  ) {

    return rawSqrtMathML(
      `<mi>${escapeMathMLText(raw)}</mi>`
    );
  }


  return rawSqrtMathML(
    `<mtext>${escapeMathMLText(raw)}</mtext>`
  );
}


/*
==================================================
分數
==================================================
*/

function fraction(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator ===
    0
  ) {

    return {

      n: 0,

      d: 1
    };
  }


  const g =
    gcd(
      numerator,
      denominator
    );


  return {

    n:
      numerator /
      g,

    d:
      denominator /
      g
  };
}


function fractionHTML(
  numerator,
  denominator =
    1
) {

  const f =
    fraction(
      numerator,
      denominator
    );


  if (
    f.d ===
    1
  ) {

    return String(
      f.n
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    f.n <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">
        ${Math.abs(f.n)}
      </span>

      <span class="math-fraction-bottom">
        ${f.d}
      </span>

    </span>
  `;
}


/*
==================================================
多項式顯示
==================================================
*/

function coefficientTerm(
  coefficient,
  degree,
  first =
    false
) {

  if (
    coefficient ===
    0
  ) {

    return "";
  }


  const negative =
    coefficient <
    0;


  const absolute =
    Math.abs(
      coefficient
    );


  let sign =
    "";


  if (
    first
  ) {

    sign =
      negative

        ? "−"

        : "";

  } else {

    sign =
      negative

        ? " − "

        : " ＋ ";
  }


  let coefficientHTML =
    "";


  if (
    degree ===
    0 ||

    absolute !==
    1
  ) {

    coefficientHTML =
      String(
        absolute
      );
  }


  let variable =
    "";


  if (
    degree ===
    2
  ) {

    variable =
      "x<sup>2</sup>";

  } else if (
    degree ===
    1
  ) {

    variable =
      "x";
  }


  return (
    sign +
    coefficientHTML +
    variable
  );
}


function polynomialHTML(
  a,
  b,
  c
) {

  const terms =
    [];


  if (
    a !==
    0
  ) {

    terms.push(
      {

        coefficient:
          a,

        degree:
          2
      }
    );
  }


  if (
    b !==
    0
  ) {

    terms.push(
      {

        coefficient:
          b,

        degree:
          1
      }
    );
  }


  if (
    c !==
    0
  ) {

    terms.push(
      {

        coefficient:
          c,

        degree:
          0
      }
    );
  }


  if (
    !terms.length
  ) {

    return "0";
  }


  return terms
    .map(
      (
        term,
        i
      ) =>
        coefficientTerm(
          term.coefficient,
          term.degree,
          i ===
          0
        )
    )
    .join("");
}


function equationHTML(
  a,
  b,
  c
) {

  return `

    <span class="math">

      ${polynomialHTML(
        a,
        b,
        c
      )}

      ＝0

    </span>
  `;
}


/*
==================================================
★ 一次方程式因式 → 無括號顯示
==================================================
*/

function linearEquationFromRootHTML(
  root
) {

  if (
    root >
    0
  ) {

    return `x－${root}＝0`;
  }


  if (
    root <
    0
  ) {

    return `x＋${Math.abs(root)}＝0`;
  }


  return "x＝0";
}


/*
==================================================
根號簡化
==================================================
*/

function simplifySqrt(
  number
) {

  let outside =
    1;


  let inside =
    number;


  for (
    let i =
      Math.floor(
        Math.sqrt(
          number
        )
      );

    i >=
    2;

    i--
  ) {

    const square =
      i *
      i;


    if (
      number %
      square ===
      0
    ) {

      outside =
        i;


      inside =
        number /
        square;


      break;
    }
  }


  return {

    outside,

    inside
  };
}


/*
==================================================
一元二次方程式解
==================================================
*/

function solveQuadratic(
  a,
  b,
  c
) {

  const discriminant =
    b *
    b -
    4 *
    a *
    c;


  if (
    discriminant <
    0
  ) {

    return {

      discriminant,

      nature:
        "none",

      values:
        [],

      html:
        "無實數解"
    };
  }


  if (
    discriminant ===
    0
  ) {

    const root =
      -b /
      (
        2 *
        a
      );


    const f =
      fraction(
        -b,
        2 *
        a
      );


    return {

      discriminant,

      nature:
        "double",

      values:
        [
          root
        ],

      html:
        `x＝${fractionHTML(
          f.n,
          f.d
        )}`
    };
  }


  const numeric1 =
    (
      -b +
      Math.sqrt(
        discriminant
      )
    ) /
    (
      2 *
      a
    );


  const numeric2 =
    (
      -b -
      Math.sqrt(
        discriminant
      )
    ) /
    (
      2 *
      a
    );


  if (
    isPerfectSquare(
      discriminant
    )
  ) {

    const s =
      Math.sqrt(
        discriminant
      );


    const f1 =
      fraction(
        -b +
        s,
        2 *
        a
      );


    const f2 =
      fraction(
        -b -
        s,
        2 *
        a
      );


    return {

      discriminant,

      nature:
        "two",

      values:
        [
          numeric1,
          numeric2
        ],

      html: `

        x＝
        ${fractionHTML(
          f1.n,
          f1.d
        )}

        或

        ${fractionHTML(
          f2.n,
          f2.d
        )}
      `
    };
  }


  const radical =
    simplifySqrt(
      discriminant
    );


  let A =
    -b;


  let B =
    radical.outside;


  let D =
    2 *
    a;


  const g =
    gcd3(
      Math.abs(
        A
      ),
      Math.abs(
        B
      ),
      Math.abs(
        D
      )
    );


  A /=
    g;


  B /=
    g;


  D /=
    g;


  if (
    D <
    0
  ) {

    A =
      -A;


    B =
      -B;


    D =
      -D;
  }


  const radicalHTML =
    sqrtHTML(
      radical.inside
    );


  const radicalPart =
    Math.abs(
      B
    ) ===
    1

      ? radicalHTML

      : `${Math.abs(B)}${radicalHTML}`;


  const numeratorHTML =
    `${A} ± ${radicalPart}`;


  const exactHTML =

    D ===
    1

      ? `x＝${numeratorHTML}`

      : `

        x＝

        <span class="math-fraction">

          <span class="math-fraction-top">

            ${numeratorHTML}

          </span>

          <span class="math-fraction-bottom">

            ${D}

          </span>

        </span>
      `;


  return {

    discriminant,

    nature:
      "two",

    values:
      [
        numeric1,
        numeric2
      ],

    html:
      exactHTML
  };
}


/*
==================================================
Math parser
==================================================
*/

function parseMathExpression(
  text
) {

  if (
    typeof text !==
    "string"
  ) {

    return NaN;
  }


  let expression =
    text
      .trim()
      .replaceAll(
        "−",
        "-"
      )
      .replaceAll(
        "－",
        "-"
      )
      .replaceAll(
        "＋",
        "+"
      )
      .replaceAll(
        "÷",
        "/"
      )
      .replaceAll(
        "×",
        "*"
      )
      .replace(
        /sqrt\s*\(\s*(\d+(?:\.\d+)?)\s*\)/gi,
        "Math.sqrt($1)"
      )
      .replace(
        /sqrt\s*(\d+(?:\.\d+)?)/gi,
        "Math.sqrt($1)"
      )
      .replace(
        /√\s*\(\s*(\d+(?:\.\d+)?)\s*\)/g,
        "Math.sqrt($1)"
      )
      .replace(
        /√\s*(\d+(?:\.\d+)?)/g,
        "Math.sqrt($1)"
      );


  expression =
    expression.replace(
      /(\d|\))(?=Math\.sqrt)/g,
      "$1*"
    );


  const safe =
    expression.replaceAll(
      "Math.sqrt",
      "S"
    );


  if (
    !/^[0-9S+\-*/().\s]+$/
      .test(
        safe
      )
  ) {

    return NaN;
  }


  try {

    const value =
      Function(
        `"use strict";
        const S = Math.sqrt;
        return (${safe});`
      )();


    return Number.isFinite(
      value
    )

      ? value

      : NaN;

  } catch {

    return NaN;
  }
}

function makeRootCheck() {

  const r1 =
    nonZeroRand(
      -6,
      6
    );


  let r2 =
    nonZeroRand(
      -6,
      6
    );


  while (
    r2 ===
    r1
  ) {

    r2 =
      nonZeroRand(
        -6,
        6
      );
  }


  const a =
    1;


  const b =
    -(
      r1 +
      r2
    );


  const c =
    r1 *
    r2;


  const isRoot =
    Math.random() <
    .55;


  let candidate =

    isRoot

      ? pick(
          [
            r1,
            r2
          ]
        )

      : nonZeroRand(
          -7,
          7
        );


  while (
    !isRoot &&
    (
      candidate ===
      r1 ||

      candidate ===
      r2
    )
  ) {

    candidate =
      nonZeroRand(
        -7,
        7
      );
  }


  const substituted =
    a *
    candidate *
    candidate +
    b *
    candidate +
    c;


  /*
  ★ 負數代入一定加括號
  */

  const candidateHTML =
    candidate <
    0

      ? `(${candidate})`

      : `${candidate}`;


  /*
  ★ 數字與數字相乘，
  一律明確寫 ×
  */

  const bProductHTML =
    `(${b}) × ${candidateHTML}`;


  return choiceQuestion({

    label:
      "判斷此數是否為方程式的一個根",

    html: `

      ${equationHTML(
        a,
        b,
        c
      )}

      <div class="question-note">

        x＝${candidate}
        是否為此方程式的一個根？

      </div>
    `,

    choices:
      [

        {

          value:
            "yes",

          text:
            "⭕ 是"
        },

        {

          value:
            "no",

          text:
            "❌ 不是"
        }
      ],

    answer:

      isRoot

        ? "yes"

        : "no",

    explanation:
      [

        `
        將
        x＝${candidate}
        代入原方程式。
        `,

        `

        <div class="calculation-box math single-line-calculation">

          <span>
            ${candidateHTML}<sup>2</sup>
          </span>

          <span>
            ＋
          </span>

          <span>
            ${bProductHTML}
          </span>

          <span>

            ${
              c >=
              0

                ? `＋ ${c}`

                : `－ ${Math.abs(c)}`
            }

          </span>

          <span>
            ＝
          </span>

          <span>
            ${substituted}
          </span>

        </div>
        `,

        substituted ===
        0

          ? `
            代入後等式成立，
            所以 x＝${candidate}
            是方程式的一個根。
            `

          : `
            代入後結果不等於 0，
            所以 x＝${candidate}
            不是方程式的一個根。
            `
      ]
  });
}

function crossFactorDiagramHTML(
  a1,
  p,
  a2,
  q,
  middleCoefficient
) {

  const left1 =
    `${a1 === 1 ? "" : a1}x`;


  const left2 =
    `${a2 === 1 ? "" : a2}x`;


  const right1 =
    p >= 0

      ? `＋${p}`

      : `－${Math.abs(p)}`;


  const right2 =
    q >= 0

      ? `＋${q}`

      : `－${Math.abs(q)}`;


  const crossOne =
    a1 * q;


  const crossTwo =
    a2 * p;


  const signed = value =>
    value >= 0

      ? `＋${value}`

      : `－${Math.abs(value)}`;


  return `

    <div class="cross-factor-box">

      <div class="cross-factor-title">
        十字交乘
      </div>

      <div class="cross-factor-diagram">

        <div>${left1}</div>
        <div>${right1}</div>

        <div>${left2}</div>
        <div>${right2}</div>

        <div class="cross-factor-bottom">
          ${crossOne}x ${signed(crossTwo)}x
          ＝ ${middleCoefficient}x
        </div>

      </div>

    </div>
  `;
}


function makeCrossFactorEquation() {

  let r1;
  let r2;
  let a1;
  let a2;
  let p;
  let q;
  let baseA;
  let baseB;
  let baseC;


  /*
  先製造一個「最簡整數係數」的二次式，
  再視需要把整個方程式同乘 2 或 3。
  這樣詳解就可以先明確示範：
  有共同因數時先約分，再做十字交乘。
  */

  for (
    let attempt = 0;
    attempt < 500;
    attempt++
  ) {

    r1 =
      nonZeroRand(
        -6,
        6
      );


    r2 =
      nonZeroRand(
        -6,
        6
      );


    if (
      r2 ===
      r1
    ) {

      continue;
    }


    a1 =
      pick(
        [
          1,
          1,
          1,
          2,
          3
        ]
      );


    a2 =
      pick(
        [
          1,
          1,
          2
        ]
      );


    p =
      -a1 *
      r1;


    q =
      -a2 *
      r2;


    baseA =
      a1 *
      a2;


    baseB =
      a1 *
      q +
      a2 *
      p;


    baseC =
      p *
      q;


    if (
      gcd3(
        Math.abs(baseA),
        Math.abs(baseB),
        Math.abs(baseC)
      ) ===
      1
    ) {

      break;
    }
  }


  const scale =
    pick(
      [
        1,
        1,
        2,
        2,
        3
      ]
    );


  const A =
    baseA *
    scale;


  const B =
    baseB *
    scale;


  const C =
    baseC *
    scale;


  const factor1 =

    p >=
    0

      ? `(${a1 === 1 ? "" : a1}x＋${p})`

      : `(${a1 === 1 ? "" : a1}x－${Math.abs(p)})`;


  const factor2 =

    q >=
    0

      ? `(${a2 === 1 ? "" : a2}x＋${q})`

      : `(${a2 === 1 ? "" : a2}x－${Math.abs(q)})`;


  const linear1 =

    p >=
    0

      ? `${a1 === 1 ? "" : a1}x＋${p}＝0`

      : `${a1 === 1 ? "" : a1}x－${Math.abs(p)}＝0`;


  const linear2 =

    q >=
    0

      ? `${a2 === 1 ? "" : a2}x＋${q}＝0`

      : `${a2 === 1 ? "" : a2}x－${Math.abs(q)}＝0`;


  const simplifyStep =

    scale >
    1

      ? `
        三項係數都有公因數 ${scale}，
        先將方程式兩邊同除以 ${scale}，
        化成最簡整數係數後再進行因式分解。

        <div class="calculation-box math">

          ${polynomialHTML(A, B, C)}＝0

          <br>

          ÷ ${scale}

          <br>

          ${polynomialHTML(baseA, baseB, baseC)}＝0

        </div>
        `

      : `
        三項係數已沒有共同因數，
        已是最簡整數係數，可直接進行十字交乘。
        `;


  return rootsQuestion({

    label:
      "請利用十字交乘法因式分解並解方程式",

    html:
      equationHTML(
        A,
        B,
        C
      ),

    values:
      [
        r1,
        r2
      ],

    answerHTML:
      `x＝${r1} 或 ${r2}`,

    method:
      "十字交乘法",

    explanation:
      [

        simplifyStep,

        `
        先用十字交乘找出兩個一次因式：

        ${crossFactorDiagramHTML(
          a1,
          p,
          a2,
          q,
          baseB
        )}

        確認交叉相乘後的兩項相加正好等於中間項，
        再寫成橫式因式分解：

        <div class="calculation-box math single-line-calculation">

          <span>
            ${polynomialHTML(baseA, baseB, baseC)}
            ＝
            ${factor1}${factor2}
          </span>

        </div>
        `,

        `
        所以方程式變為：

        <div class="calculation-box math single-line-calculation">

          <span>
            ${factor1}${factor2}＝0
          </span>

        </div>
        `,

        `
        利用零乘積性質，分別令兩個因式等於 0：

        <div class="calculation-box math single-line-calculation">

          <span>
            ${linear1}
          </span>

          <span>
            或
          </span>

          <span>
            ${linear2}
          </span>

        </div>
        `,

        `
        解得：
        x＝${r1}
        或
        x＝${r2}。
        `
      ]
  });
}

function makeFormulaSolve(
  advanced =
    false
) {

  let a;
  let b;
  let c;
  let solution;


  for (
    let attempt =
      0;

    attempt <
    1000;

    attempt++
  ) {

    a =
      advanced

        ? nonZeroRand(
            -4,
            4
          )

        : nonZeroRand(
            1,
            4
          );


    b =
      nonZeroRand(
        -9,
        9
      );


    c =
      nonZeroRand(
        -8,
        8
      );


    solution =
      solveQuadratic(
        a,
        b,
        c
      );


    if (
      solution.discriminant >
      0
    ) {

      break;
    }
  }


  const radicalSimplified =
    solution.discriminant >
    0

      ? simplifySqrt(
          solution.discriminant
        )

      : {

          outside: 1,

          inside:
            solution.discriminant
        };


  const radicalSimplifyStep =

    solution.discriminant >
      0 &&

    !isPerfectSquare(
      solution.discriminant
    ) &&

    radicalSimplified.outside >
      1

      ? `

        將判別式根號化成最簡根式：

        <div class="calculation-box math">

          ${sqrtHTML(
            `RAW:${solution.discriminant}`
          )}

          ＝

          ${radicalSimplified.outside}${sqrtHTML(
            radicalSimplified.inside
          )}

        </div>
      `

      : "";


  return rootsQuestion({

    label:

      advanced

        ? "請使用公式解求解；注意負係數與根號化簡"

        : "請使用一元二次方程式公式求解",

    html: `

      ${formulaBoxHTML()}

      ${equationHTML(
        a,
        b,
        c
      )}
    `,

    values:
      solution.values,

    answerHTML:
      solution.html,

    method:
      "一元二次方程式公式",

    explanation:
      [

        `
        先找出：
        a＝${a}，
        b＝${b}，
        c＝${c}。
        `,

        `

        計算判別式：

        <div class="calculation-box math">

          b<sup>2</sup>－4ac

          ＝

          (${b})<sup>2</sup>

          －

          4 × (${a}) × (${c})

          ＝

          ${solution.discriminant}

        </div>
        `,

        radicalSimplifyStep,

        `

        代入公式：

        <div class="calculation-box math">

          x＝

          <span class="math-fraction">

            <span class="math-fraction-top">

              −(${b})
              ±
              ${sqrtHTML(
                solution.discriminant
              )}

            </span>

            <span class="math-fraction-bottom">

              2 × (${a})

            </span>

          </span>

        </div>
        `,

        `

        化簡後：

        <div class="calculation-box math">

          ${solution.html}

        </div>
        `
      ]
  });
}

function makeFullApplication() {

    );


  const area =

  return numberQuestion({

    label:

    html: `

      side,

    answerHTML:

    method:
      "完整應用問題",

      [

        <div class="calculation-box math">

        `,

          ＋${add}x

        </div>

        這一步使用十字交乘法因式分解。
        先做直式十字交乘，確認交叉相乘後的和為 ${add}x：

        )}

function insertRootSymbol(
  text
) {

  if (
    !activeRootInput
  ) {

    return;
  }


  const input =
    activeRootInput;


  const start =
    input.selectionStart ??
    input.value.length;


  const end =
    input.selectionEnd ??
    input.value.length;


  input.value =
    input.value.slice(
      0,
      start
    ) +
    text +
    input.value.slice(
      end
    );


  const position =
    start +
    text.length;


  input.focus();


  input.setSelectionRange(
    position,
    position
  );


  input.dispatchEvent(
    new Event(
      "input",
      {
        bubbles:
          true
      }
    )
  );
}

function normalizeConjugateRaw(
  raw
) {

  return String(
    raw ??
    ""
  )
    .replace(/\s+/g, "")
    .replaceAll("＋", "+")
    .replaceAll("－", "-")
    .replaceAll("−", "-");
}


function splitConjugateExpression(
  raw
) {

  const text =
    normalizeConjugateRaw(
      raw
    );


  if (
    !text
  ) {

    return null;
  }


  const standard =
    text.match(
      /^(.*?)([+-])((?:\d+(?:\.\d+)?)?√\d+(?:\.\d+)?)$/
    );


  if (
    standard &&
    standard[1] !==
    ""
  ) {

    return {

      center:
        standard[1],

      sign:
        standard[2],

      radical:
        standard[3]
    };
  }


  const pure =
    text.match(
      /^(-?)((?:\d+(?:\.\d+)?)?√\d+(?:\.\d+)?)$/
    );


  if (
    pure
  ) {

    return {

      center:
        "0",

      sign:
        pure[1] ===
        "-"

          ? "-"

          : "+",

      radical:
        pure[2]
    };
  }


  return null;
}


function makeConjugateCoreHTML(
  firstRaw,
  secondRaw
) {

  const first =
    splitConjugateExpression(
      firstRaw
    );


  const second =
    splitConjugateExpression(
      secondRaw
    );


  if (
    !first ||
    !second
  ) {

    return "";
  }


  if (
    normalizeConjugateRaw(
      first.center
    ) !==
    normalizeConjugateRaw(
      second.center
    ) ||

    normalizeConjugateRaw(
      first.radical
    ) !==
    normalizeConjugateRaw(
      second.radical
    ) ||

    first.sign ===
    second.sign
  ) {

    return "";
  }


  const center =
    normalizeConjugateRaw(
      first.center
    );


  const radical =
    first.radical;


  if (
    center ===
    "0"
  ) {

    return `

      <span class="conjugate-preview">

        ±${prettyInputHTML(
          radical
        )}

      </span>
    `;
  }


  return `

    <span class="conjugate-preview">

      ${prettyInputHTML(
        center
      )}

      ±

      ${prettyInputHTML(
        radical
      )}

    </span>
  `;
}

    ) {

function readChoiceAnswer(
  question
) {

  if (
    selectedChoice ===
    null
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ??
      selectedChoice
  };
}


function readNumberAnswer() {

  const raw =
    $("single-answer")
      ?.value
      .trim() ??
    "";


  if (
    !raw
  ) {

    return {

      valid:
        false,

      message:
        "請先輸入答案。"
    };
  }


  const value =
    parseMathExpression(
      raw
    );


  if (
    !Number.isFinite(
      value
    )
  ) {

    return {

      valid:
        false,

      message:
        "答案格式無法辨識，請重新輸入。"
    };
  }


  return {

    valid:
      true,

    value,

    display:
      raw
  };
}


function readRootsAnswer(
  question
) {

  const firstRaw =
    getRootRaw(
      1
    );


  const secondRaw =
    getRootRaw(
      2
    );


  if (
    firstRaw ===
    null
  ) {

    return {

      valid:
        false,

      message:
        "第一個根的分數答案請把分子、分母都填完整。"
    };
  }


  if (
    secondRaw ===
    null
  ) {

    return {

      valid:
        false,

      message:
        "第二個根的分數答案請把分子、分母都填完整。"
    };
  }


  if (
    !firstRaw
  ) {

    return {

      valid:
        false,

      message:
        "請輸入方程式的根。"
    };
  }


  if (
    question.values.length >
    1 &&

    !secondRaw
  ) {

    return {

      valid:
        false,

      message:
        "本題有兩個根，請將兩個根都填寫完整。"
    };
  }


  const first =
    parseMathExpression(
      firstRaw
    );


  if (
    !Number.isFinite(
      first
    )
  ) {

    return {

      valid:
        false,

      message:
        "第一個根的格式無法辨識。"
    };
  }


  const values =
    [
      first
    ];


  if (
    question.values.length >
    1
  ) {

    const second =
      parseMathExpression(
        secondRaw
      );


    if (
      !Number.isFinite(
        second
      )
    ) {

      return {

        valid:
          false,

        message:
          "第二個根的格式無法辨識。"
      };
    }


    values.push(
      second
    );
  }


  const firstDisplay =
    rootEntryPreviewHTML(
      1
    ) ||
    firstRaw;


  const secondDisplay =
    rootEntryPreviewHTML(
      2
    ) ||
    secondRaw;


  const conjugateDisplay =
    values.length ===
    2

      ? conjugateRootPreviewHTML()

      : "";


  return {

    valid:
      true,

    value:
      values,

    display:

      values.length ===
      1

        ? `x＝${firstDisplay}（重根）`

        : conjugateDisplay

          ? `x＝${conjugateDisplay}`

          : `x＝${firstDisplay} 或 ${secondDisplay}`
  };
}

/*
==================================================
判斷答案
==================================================
*/

function approximatelyEqual(
  a,
  b,
  tolerance =
    1e-6
) {

  return (
    Math.abs(
      a -
      b
    ) <
    tolerance
  );
}


function sameNumberSet(
  first,
  second
) {

  if (
    first.length !==
    second.length
  ) {

    return false;
  }


  const used =
    new Array(
      second.length
    )
      .fill(
        false
      );


  for (
    const value of
    first
  ) {

    let found =
      false;


    for (
      let i =
        0;

      i <
      second.length;

      i++
    ) {

      if (
        !used[i] &&

        approximatelyEqual(
          value,
          second[i]
        )
      ) {

        used[i] =
          true;


        found =
          true;


        break;
      }
    }


    if (
      !found
    ) {

      return false;
    }
  }


  return true;
}


function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "choice"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "number"
  ) {

    return approximatelyEqual(
      answer.value,
      question.answer
    );
  }


  if (
    question.type ===
    "roots"
  ) {

    return sameNumberSet(
      answer.value,
      question.values
    );
  }


  if (
    question.type ===
    "abc" ||

    question.type ===
    "standardAbc"
  ) {

    return (

      answer.value.a ===
        question.a &&

      answer.value.b ===
        question.b &&

      answer.value.c ===
        question.c
    );
  }


  if (
    question.type ===
    "pair"
  ) {

    return sameNumberSet(
      answer.value,
      question.values
    );
  }


  return false;
}

/*

詳解
==================================================
*/

function learningGuideForQuestion(
  question
) {

  const method =
    String(
      question.method ??
      ""
    );


  if (
    method.includes(
      "根的定義"
    )
  ) {

    return {

      think:
        "看到「某數是不是方程式的根」或「已知某數是根」，先記住：根的意思就是代入 x 後，等式必須成立。",

      pitfall:
        "負數代入平方時一定要加括號，例如 x＝−3 時，x² 要寫成 (−3)²；不要誤寫成 −3²。",

      check:
        "把求出的數代回原方程式；左式最後等於 0，才真正符合根的定義。"
    };
  }


  if (
    method.includes(
      "零乘積性質"
    ) ||
    method ===
    "因式分解法"
  ) {

    return {

      think:
        "看到「兩個因式的乘積＝0」，就可以使用零乘積性質：至少有一個因式必須等於 0。",

      pitfall:
        "不要把兩個因式直接各取常數當答案；每一個因式都要先令它等於 0，再解出 x。",

      check:
        "把每一個解代回原方程式，或代回因式分解後的式子；只要其中一個因式變成 0，乘積就會是 0。"
    };
  }


  if (
    method.includes(
      "十字交乘"
    )
  ) {

    return {

      think:
        "先確認三項係數是否有共同因數；若有，先約成最簡整數係數。接著同時考慮二次項係數與常數項的拆法，最後用交叉乘積檢查中間項。",

      pitfall:
        "十字交乘不是只看「乘積對不對」；兩條交叉乘積相加還必須剛好等於一次項係數，正負號尤其容易出錯。",

      check:
        "把得到的兩個一次因式乘回去，確認二次項、一次項、常數項三項都與原式完全相同。"
    };
  }


  if (
    method.includes(
      "平方差公式"
    )
  ) {

    return {

      think:
        "先看能不能辨認成 A²－B²。只有「兩個平方相減」才能直接套平方差公式。",

      pitfall:
        "A²＋B² 不能套平方差；而且分解後兩個括號必須是一加一減。",

      check:
        "把 (A＋B)(A－B) 乘回去，中間項會互相抵消，只剩 A²－B²。"
    };
  }


  if (
    method.includes(
      "和的平方公式"
    ) ||
    method.includes(
      "差的平方公式"
    ) ||
    method ===
    "完全平方公式"
  ) {

    return {

      think:
        "先確認首項、末項都是完全平方，再檢查中間項是不是 ±2AB；三個條件都符合才是完全平方式。",

      pitfall:
        "只看到首末兩項能開平方還不夠；中間項若不是 ±2AB，就不能直接寫成 (A±B)²。",

      check:
        "把整理出的 (A±B)² 展開，確認中間項的正負號與係數都和原式一致。"
    };
  }


  if (
    method.includes(
      "平方根解法"
    )
  ) {

    return {

      think:
        "先把方程式整理成「某個式子的平方＝一個數」。開平方時一定同時考慮正、負兩種可能。",

      pitfall:
        "最常見錯誤是漏掉 ±。若 A²＝k 且 k＞0，應該得到 A＝±√k，而不是只有 A＝√k。",

      check:
        "將兩個根分別代回平方形式；平方後都應該得到右邊同一個數。"
    };
  }


  if (
    method.includes(
      "配方法"
    )
  ) {

    return {

      think:
        "配方法的核心是把 x²＋bx 補成完全平方式：先取一次項係數的一半，再平方；若二次項係數不是 1，要先把它化成 1。",

      pitfall:
        "等式左邊補了多少，右邊也必須補一樣多；另外不要直接拿一次項係數平方，必須先除以 2。",

      check:
        "把配好的完全平方式展開，確認 x²、一次項與補上的常數都正確；最後求出的根也可代回原方程式驗算。"
    };
  }


  if (
    method.includes(
      "辨認公式中的"
    ) ||
    method.includes(
      "整理標準式"
    )
  ) {

    return {

      think:
        "先把方程式整理成 ax²＋bx＋c＝0，再逐項對照 a、b、c；缺少某一項時，那一項的係數就是 0。",

      pitfall:
        "係數前面的負號是係數的一部分；如果還沒把等號右邊的項移到左邊，就很容易判錯 b 或 c。",

      check:
        "把找到的 a、b、c 重新代回 ax²＋bx＋c＝0，應能完整還原整理後的方程式。"
    };
  }


  if (
    method ===
    "判別式"
  ) {

    return {

      think:
        "先正確找出 a、b、c，再計算 D＝b²－4ac。根的情形只看 D 的正、零、負，不必先完整求根。",

      pitfall:
        "b 若是負數，平方時要寫成 (b)²；計算 −4ac 時也要把 a、c 的負號一起代入。",

      check:
        "D＞0 有兩個相異實根；D＝0 有重根；D＜0 無實數解。用這三種情形回頭核對判斷。"
    };
  }


  if (
    method.includes(
      "一元二次方程式公式"
    )
  ) {

    return {

      think:
        "公式解的順序是：先整理標準式 → 找 a、b、c → 算判別式 → 代入公式 → 約分與化簡根式。",

      pitfall:
        "公式最容易錯在 −b、b² 與分母 2a。若 b 或 a 是負數，代入時最好先加括號再計算。",

      check:
        "若有兩個解，兩個都應符合原方程式；若根式可以化簡或分數可以約分，最後答案要整理成最簡形式。"
    };
  }


  if (
    method.includes(
      "應用問題"
    ) ||
    method.includes(
      "依題意列方程式"
    ) ||
    method.includes(
      "檢驗解是否符合題意"
    )
  ) {

    return {

      think:
        "先明確寫出 x 代表什麼，再把題目中的數量關係翻成代數式；解出方程式後，還要回到情境檢查答案是否合理。",

      pitfall:
        "方程式的數學解不一定都是題目的答案。長度、數量、價格等通常不能取負值，題目若指定較小或非負解也要照條件篩選。",

      check:
        "把最後選定的答案代回原情境，例如重新計算面積、乘積或營業額，確認真的符合題目給的條件。"
    };
  }


  return {

    think:
      "先辨認題目屬於哪一種一元二次方程式型態，再選最直接的方法，不要一看到二次方程式就固定套同一種解法。",

    pitfall:
      "運算時要特別注意移項變號、負數平方、±、分數約分與根式化簡。",

    check:
      "最後把得到的答案代回原方程式或原題情境，確認等式成立且符合題意。"
  };
}


function explanationHTML(
  question,
  userAnswer = ""
) {

  const guide =
    learningGuideForQuestion(
      question
    );


  const method =

    question.method

      ? `

        <div class="explanation-learning-box explanation-think">

          <strong>
            💡 先想一想｜
          </strong>

          ${guide.think}

          <div
            style="
              margin-top:7px;
              font-weight:900;
            "
          >
            建議解法：${question.method}
          </div>

        </div>
      `

      : `

        <div class="explanation-learning-box explanation-think">

          <strong>
            💡 先想一想｜
          </strong>

          ${guide.think}

        </div>
      `;


  return `

    <div class="explanation-question">

      <div class="explanation-question-title">

        題目｜

      </div>

      <div class="explanation-question-math">

        ${question.html}

      </div>

    </div>

    <div class="explanation-answer-grid">

      <div class="explanation-answer-card">

        <div class="explanation-answer-label">
          你的答案
        </div>

        <div class="explanation-answer-value">
          ${userAnswer || "—"}
        </div>

      </div>

      <div class="explanation-answer-card">

        <div class="explanation-answer-label">
          正確答案
        </div>

        <div class="explanation-answer-value">
          ${correctAnswerHTML(
            question
          )}
        </div>

      </div>

    </div>

    ${method}

    ${
      question.explanation
        .filter(
          step =>
            String(
              step ??
              ""
            )
              .trim()
        )
        .map(
          (
            step,
            i
          ) => `

            <div class="explanation-step">

              <strong>

                步驟 ${i + 1}｜

              </strong>

              ${step}

            </div>
          `
        )
        .join("")
    }

    <div class="explanation-learning-box explanation-pitfall">

      <strong>
        ⚠️ 常見錯誤｜
      </strong>

      ${guide.pitfall}

    </div>

    <div class="explanation-learning-box explanation-check">

      <strong>
        🔎 自我檢查｜
      </strong>

      ${guide.check}

    </div>

    <div class="explanation-final">

      <div class="explanation-final-label">
        ✅ 最後答案
      </div>

      <div class="explanation-final-value">
        ${correctAnswerHTML(
          question
        )}
      </div>

    </div>
  `;
}


/*
==================================================
顯示題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${TOTAL_QUESTIONS}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        TOTAL_QUESTIONS *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderAnswer(
    question
  );


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;


    combo++;


    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;


    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question,
        answer.display
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
Timer
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
Sound
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound?.[
      method
    ]?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
Scratchpad
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
畫面
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  selectedChoice =
    null;


  activeRootInput =
    null;


  elapsed =
    0;


  scoreSaved =
    false;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評語
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理一元二次方程式的各種題型。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意解法選擇、根號化簡及答案檢驗。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，建議加強配方法與公式解。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議從基礎概念與因式分解法開始，再逐步挑戰後面的模式。"
  };
}


/*
==================================================
Result
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "一元二次方程式成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
Review
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question,
                      record.userAnswer
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

          <div class="review-card">

            全部答對，沒有需要回顧的錯題！

          </div>
        `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
模式按鈕
==================================================
*/

document

      button.addEventListener(

/*
==================================================
按鈕
==================================================
*/

$("submit-button")
  .addEventListener(

    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",

  );


$("restart-button")

    "click",
    () => {

      startGame(
        mode

    }
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",

      startGame(

    }
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "start-screen"
      );
    }
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


/*
==================================================
Enter
==================================================
*/

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );


/*
==================================================
初始化
==================================================
*/

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(
  "start-screen"
);

</script>
