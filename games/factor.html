<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-1 質因數分解大挑戰</title>

  <link rel="stylesheet" href="../css/scratchpad.css">
  <link rel="stylesheet" href="../css/expression-input.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #00897b;
      --primary-dark: #00695c;
      --primary-light: #e0f2f1;
      --primary-border: #80cbc4;
      --text: #1f2937;
      --muted: #64748b;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --orange: #f57c00;
      --surface: #ffffff;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.13);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #e8f5f3, #fff8e8);
    }

    button, input {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; }

    .page-shell {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    #commonHeaderMount { margin-bottom: 14px; }

    .game-card {
      overflow: hidden;
      border: 1px solid #dbe7e5;
      border-top: 8px solid var(--primary);
      border-radius: 26px;
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
    }

    .game-header {
      padding: 26px 24px 20px;
      text-align: center;
      background: linear-gradient(180deg, var(--primary-light), #fff);
    }

    .game-title {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.35;
    }

    .game-subtitle {
      max-width: 820px;
      margin: 10px auto 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .screen { padding: 24px; }
    .hidden { display: none !important; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .mode-card {
      min-height: 184px;
      padding: 20px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--primary-light), #fff);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15,23,42,.11);
      border-color: var(--primary);
    }

    .mode-card h2 {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-size: 21px;
      line-height: 1.45;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--primary-border);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .mode-card.speed {
      border-color: #ffcc80;
      background: linear-gradient(180deg, #fff3e0, #fff);
    }

    .mode-card.speed h2 { color: #e65100; }

    .mode-card.comprehensive {
      border-color: #ffe082;
      background: linear-gradient(180deg, #fff8e1, #fff);
    }

    .mode-card.comprehensive h2 { color: #9a6700; }

    .quiz-topbar {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .status-box {
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 8px;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .status-label {
      color: var(--muted);
      font-size: 13px;
    }

    .status-value {
      margin-top: 4px;
      font-size: 18px;
      line-height: 1.35;
    }

    .timer-danger {
      background: #fee2e2 !important;
      color: #991b1b !important;
      animation: pulse .75s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    .progress-shell {
      height: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #26a69a);
      transition: width .2s ease;
    }

    .question-card {
      padding: 24px 18px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    .question-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: clamp(16px, 2.1vw, 20px);
      font-weight: 900;
      line-height: 1.65;
    }

    .question-content {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: clamp(22px, 3.4vw, 32px);
      font-weight: 900;
      line-height: 1.6;
      overflow-x: auto;
    }

    .math-expression {
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .math-expression sup {
      font-size: .6em;
      vertical-align: super;
    }

    .mini-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .scratchpad-row {
      display: flex;
      justify-content: center;
      margin: 14px 0;
    }

    #scratchpad-mobile-button {
      display: flex;
      justify-content: center;
    }

    #scratchpadOpenButton { display: none !important; }

    #scratchpad-mobile-button #scratchpadOpenButton {
      position: static !important;
      inset: auto !important;
      display: inline-flex !important;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 18px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: linear-gradient(180deg, #f0fdfa, #fff);
    }

    .answer-title {
      margin-bottom: 12px;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice-button {
      min-height: 58px;
      padding: 11px 12px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      background: #fff;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.5;
      cursor: pointer;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }

    .choice-button:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .choice-button.selected {
      border-color: var(--primary);
      background: #ccfbf1;
      box-shadow: 0 0 0 3px rgba(0,137,123,.12);
    }

    .choice-button:disabled {
      cursor: default;
      opacity: .82;
    }

    .choice-button.correct-choice {
      border-color: #86efac;
      background: #dcfce7;
      color: #166534;
    }

    .choice-button.wrong-choice {
      border-color: #fca5a5;
      background: #fee2e2;
      color: #991b1b;
    }

    #expressionMountWrap { max-width: 780px; margin: 0 auto; }

    .input-message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--warning);
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .game-button {
      min-width: 136px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--primary-dark);
    }

    .game-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    .game-button.secondary {
      background: #607d8b;
      box-shadow: 0 5px 0 #455a64;
    }

    .game-button.orange {
      background: #f57c00;
      box-shadow: 0 5px 0 #e65100;
    }

    .game-button.restart {
      background: #2563eb;
      box-shadow: 0 5px 0 #1d4ed8;
    }

    .feedback {
      min-height: 32px;
      margin-top: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.55;
    }

    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--danger); }

    .explanation {
      margin-top: 14px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      border-left: 6px solid var(--primary);
      color: #334155;
      line-height: 1.85;
      font-size: 16px;
    }

    .explanation strong { color: #0f172a; }

    .rule-box, .calculation-box, .tip-box {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
    }

    .rule-box {
      background: #ecfeff;
      border: 1px solid #a5f3fc;
    }

    .calculation-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }

    .tip-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .short-division {
      width: min(100%, 420px);
      margin: 12px auto;
      border-collapse: collapse;
      font-weight: 800;
      text-align: center;
    }

    .short-division td {
      padding: 6px 10px;
      border-bottom: 1px solid #cbd5e1;
    }

    .short-division td:first-child {
      width: 34%;
      border-right: 2px solid #475569;
      color: var(--primary-dark);
    }

    .result-card {
      text-align: center;
    }

    .result-score {
      margin: 6px 0;
      color: var(--primary-dark);
      font-size: clamp(46px, 9vw, 72px);
      font-weight: 1000;
    }

    .result-stars {
      margin: 6px 0;
      color: #f59e0b;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 4px;
    }

    .result-comment {
      color: #475569;
      font-size: 18px;
      line-height: 1.7;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
    }

    .result-item {
      padding: 14px 10px;
      border-radius: 14px;
      background: var(--primary-light);
    }

    .result-item .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .result-item .value {
      display: block;
      margin-top: 4px;
      color: var(--primary-dark);
      font-size: 21px;
      font-weight: 1000;
    }

    .save-status {
      min-height: 28px;
      margin-top: 14px;
      font-weight: 900;
      line-height: 1.5;
    }

    .review-list {
      display: grid;
      gap: 14px;
    }

    .review-card {
      padding: 18px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
    }

    .review-title {
      color: var(--danger);
      font-size: 18px;
      font-weight: 1000;
      margin-bottom: 8px;
    }

    .review-question {
      font-weight: 800;
      line-height: 1.7;
    }

    .review-answer {
      margin: 10px 0;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .screen { padding: 16px; }
      .game-header { padding: 22px 16px 16px; }
      .mode-grid { grid-template-columns: 1fr; }
      .quiz-topbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice-grid { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question-card { padding: 20px 12px; }
    }

    @media (max-width: 420px) {
      .status-value { font-size: 16px; }
      .game-button { width: 100%; }
    }
  </style>
</head>

<body>
<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">
      <h1 class="game-title">🧩 2-1 質因數分解大挑戰</h1>
      <p class="game-subtitle">
        對應七年級上學期 2-1：因數與倍數、2／3／4／5／9／11 倍數判別、
        質數與合數、埃拉托賽尼篩法、質因數、質因數分解、標準分解式，
        以及利用標準分解式判斷因數與倍數。
      </p>
    </header>

    <section id="start-screen" class="screen">
      <div class="mode-grid">

        <button class="mode-card" type="button" data-mode="factorMultiple">
          <h2>🔍 因數、倍數與倍數判別</h2>
          <p>練習因數倍數關係，以及 2、3、4、5、9、11 的倍數判別法。</p>
          <div class="mode-meta">
            <span class="mode-badge">10 題</span>
            <span class="mode-badge">modeId：factorMultiple</span>
          </div>
        </button>

        <button class="mode-card" type="button" data-mode="primeComposite">
          <h2>💎 質數、合數與篩法</h2>
          <p>辨認質數、合數與 1，熟悉 100 以內質數及埃拉托賽尼篩法。</p>
          <div class="mode-meta">
            <span class="mode-badge">10 題</span>
            <span class="mode-badge">modeId：primeComposite</span>
          </div>
        </button>

        <button class="mode-card" type="button" data-mode="primeFactor">
          <h2>🧩 因數與質因數</h2>
          <p>列出因數、辨認質因數，理解「因數」與「質因數」的差異。</p>
          <div class="mode-meta">
            <span class="mode-badge">10 題</span>
            <span class="mode-badge">modeId：primeFactor</span>
          </div>
        </button>

        <button class="mode-card" type="button" data-mode="standardForm">
          <h2>🔢 質因數分解與標準分解式</h2>
          <p>用短除法或樹狀圖完成質因數分解，寫出標準分解式與相異質因數。</p>
          <div class="mode-meta">
            <span class="mode-badge">10 題</span>
            <span class="mode-badge">modeId：standardForm</span>
          </div>
        </button>

        <button class="mode-card" type="button" data-mode="standardJudge">
          <h2>⚖️ 標準分解式判別因數倍數</h2>
          <p>比較相同質因數的指數大小，判斷標準分解式間的因數／倍數關係。</p>
          <div class="mode-meta">
            <span class="mode-badge">10 題</span>
            <span class="mode-badge">modeId：standardJudge</span>
          </div>
        </button>

        <button class="mode-card speed" type="button" data-mode="speed">
          <h2>⚡ 質因數快手</h2>
          <p>60 秒短題快速熟練；最後 10 秒啟動急促倒數提醒。</p>
          <div class="mode-meta">
            <span class="mode-badge">60 秒</span>
            <span class="mode-badge">modeId：speed</span>
          </div>
        </button>

        <button class="mode-card comprehensive" type="button" data-mode="comprehensive">
          <h2>🏆 2-1 綜合挑戰</h2>
          <p>整合本節所有核心概念，以 8 題完成一次全單元檢核。</p>
          <div class="mode-meta">
            <span class="mode-badge">8 題</span>
            <span class="mode-badge">modeId：comprehensive</span>
          </div>
        </button>

      </div>
    </section>

    <section id="quiz-screen" class="screen hidden">

      <div class="quiz-topbar">
        <div class="status-box">
          <span class="status-label">模式</span>
          <span id="mode-display" class="status-value">—</span>
        </div>
        <div id="time-box" class="status-box">
          <span class="status-label">時間</span>
          <span id="time-display" class="status-value">00:00</span>
        </div>
        <div class="status-box">
          <span class="status-label">分數</span>
          <span id="score-display" class="status-value">0</span>
        </div>
        <div class="status-box">
          <span class="status-label">連擊</span>
          <span id="combo-display" class="status-value">0</span>
        </div>
      </div>

      <div class="progress-shell">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="question-card">
        <div id="question-label" class="question-label"></div>
        <div id="question-content" class="question-content"></div>
        <div id="question-note" class="mini-note"></div>
      </div>

      <div class="scratchpad-row">
        <div id="scratchpad-mobile-button"></div>
      </div>

      <div class="answer-panel">
        <div class="answer-title">請作答</div>

        <div id="choiceMount" class="choice-grid"></div>

        <div id="expressionMountWrap" class="hidden">
          <div id="answerMount"></div>
        </div>

        <div id="input-message" class="input-message"></div>
      </div>

      <div id="feedback" class="feedback"></div>
      <div id="explanation" class="explanation hidden"></div>

      <div class="button-row">
        <button id="submit-button" class="game-button" type="button">送出答案</button>
        <button id="next-button" class="game-button secondary hidden" type="button">下一題</button>
        <button id="quit-button" class="game-button orange" type="button">選擇模式</button>
      </div>
    </section>

    <section id="result-screen" class="screen hidden result-card">
      <h2 id="result-mode-name">測驗完成</h2>

      <div id="final-score" class="result-score">0 分</div>
      <div id="final-stars" class="result-stars">★★★★★</div>
      <p id="final-comment" class="result-comment"></p>

      <div class="result-grid">
        <div class="result-item">
          <span class="label">答對</span>
          <span id="final-correct" class="value">0</span>
        </div>
        <div class="result-item">
          <span class="label">答錯</span>
          <span id="final-wrong" class="value">0</span>
        </div>
        <div class="result-item">
          <span class="label">最高連擊</span>
          <span id="final-combo" class="value">0</span>
        </div>
        <div class="result-item">
          <span class="label">作答時間</span>
          <span id="final-time" class="value">00:00</span>
        </div>
      </div>

      <div id="save-status" class="save-status" aria-live="polite"></div>

      <div class="button-row">
        <button id="again-button" class="game-button restart" type="button">🔄 重新挑戰</button>
        <button id="review-button" class="game-button orange" type="button">錯題回顧</button>
        <button id="result-mode-button" class="game-button secondary" type="button">選擇模式</button>
      </div>
    </section>

    <section id="review-screen" class="screen hidden">
      <h2>📝 錯題回顧</h2>
      <div id="review-list" class="review-list"></div>

      <div class="button-row">
        <button id="review-again-button" class="game-button restart" type="button">🔄 重新挑戰</button>
        <button id="review-result-button" class="game-button secondary" type="button">回到測驗結果</button>
      </div>
    </section>

  </main>
</div>

<script src="../js/common-header.js"></script>
<script src="../js/scratchpad.js"></script>
<script src="../js/scratchpad-template.js"></script>
<script src="../js/sound-manager.js?v=1"></script>
<script src="../js/expression-input.js?v=7"></script>

<script type="module">
"use strict";

/*
==================================================
2-1 質因數分解大挑戰
現有專案相容：
GAME_ID 仍沿用 factor
每個模式以 modeId 儲存
==================================================
*/

const GAME_ID = "factor";

const MODE_CONFIG = {
  factorMultiple: {
    name: "🔍 因數、倍數與倍數判別",
    count: 10,
    difficultyWeight: 1.00
  },
  primeComposite: {
    name: "💎 質數、合數與篩法",
    count: 10,
    difficultyWeight: 1.00
  },
  primeFactor: {
    name: "🧩 因數與質因數",
    count: 10,
    difficultyWeight: 1.08
  },
  standardForm: {
    name: "🔢 質因數分解與標準分解式",
    count: 10,
    difficultyWeight: 1.22
  },
  standardJudge: {
    name: "⚖️ 標準分解式判別因數倍數",
    count: 10,
    difficultyWeight: 1.25
  },
  speed: {
    name: "⚡ 質因數快手",
    seconds: 60,
    difficultyWeight: 1.12
  },
  comprehensive: {
    name: "🏆 2-1 綜合挑戰",
    count: 8,
    difficultyWeight: 1.35
  }
};

const PRIME_LIST_100 = [

function rand(min, max) {
  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;
}

function pick(array) {
  return array[
    Math.floor(Math.random() * array.length)
  ];
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [result[i], result[j]] =
      [result[j], result[i]];
  }

  return result;
}

function unique(array) {
  return [...new Set(array)];
}

function esc(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatTime(seconds) {
  const safe = Math.max(
    0,
    Math.floor(seconds)
  );

  const min = Math.floor(safe / 60);
  const sec = safe % 60;

  return `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function createAttemptId() {

      window.GameSound ||
      window.MathGameSound;

    if (typeof fn !== "function") {
      return false;
    }

    const result =
      fn.call(sound);

      typeof result.catch === "function"
    ) {
      result.catch(() => {});
    }

    return true;
  } catch (error) {
    console.warn("音效播放失敗：", error);
    return false;
  }
}

function playUrgentCountdown() {
  const sound =
    window.GameSound ||
    window.MathGameSound;

  const possibleMethods = [
    "playCountdown",
    "playTick",
    "playTimer",
    "playUrgent"
  ];

  for (const method of possibleMethods) {
    if (typeof sound?.[method] === "function") {
      try {
        sound[method]();
        return;
      } catch (_) {}
    }
  }

  // 共用音效若尚未提供倒數音，使用極短提示音作為保底。
  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) return;

    const ctx = new AudioCtx();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.frequency.value = 880;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .08
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + .08);

    oscillator.addEventListener("ended", () => {
      ctx.close().catch(() => {});
    });
  } catch (_) {}
}

/*
==================================================
數學工具
==================================================
*/

function isPrime(n) {
  if (n < 2) return false;

  if (n === 2) return true;

  if (n % 2 === 0) return false;

  for (
    let d = 3;
    d * d <= n;
    d += 2
  ) {
    if (n % d === 0) {
      return false;
    }
  }

  return true;
}

function factorsOf(n) {
  const result = [];

  for (let d = 1; d * d <= n; d++) {
    if (n % d === 0) {
      result.push(d);

      if (d * d !== n) {
        result.push(n / d);
      }
    }
  }

  return result.sort((a,b) => a - b);
}

function primeFactorMap(n) {
  let value = n;
  const map = {};

  for (
    let p = 2;
    p * p <= value;
    p++
  ) {
    while (value % p === 0) {
      map[p] = (map[p] || 0) + 1;
      value /= p;
    }
  }

  if (value > 1) {
    map[value] = (map[value] || 0) + 1;
  }

  return map;
}

function factorMapValue(map) {
  return Object.entries(map)
    .reduce(
      (product, [prime, exponent]) =>
        product *
        Math.pow(
          Number(prime),
          Number(exponent)
        ),
      1
    );
}

function mapsEqual(a, b) {
  const keys = new Set([
    ...Object.keys(a || {}),
    ...Object.keys(b || {})
  ]);

  for (const key of keys) {
    if (
      Number(a?.[key] || 0) !==
      Number(b?.[key] || 0)
    ) {
      return false;
    }
  }

  return true;
}

function factorMapToText(map) {
  return Object.keys(map)
    .map(Number)
    .sort((a,b) => a - b)
    .map(prime => {
      const exponent = map[prime];

      return exponent === 1
        ? `${prime}`
        : `${prime}^${exponent}`;
    })
    .join("*");
}

function factorMapToHTML(map) {
  return factorMapToText(map)
    .replaceAll("*", "×")
    .replace(
      /\^(\d+)/g,
      "<sup>$1</sup>"
    );
}

function factorMapToPlain(map) {
  return factorMapToText(map)
    .replaceAll("*", "×")
    .replace(/\^/g, "^");
}

function listText(values) {
  return values.join("、");
}

function digitSum(n) {
  return String(Math.abs(n))
    .split("")
    .reduce(
      (sum, digit) =>
        sum + Number(digit),
      0
    );
}

function lastTwoDigits(n) {
  return Math.abs(n) % 100;
}

function alternating11Data(n) {
  const digits =
    String(Math.abs(n))
      .split("")
      .map(Number)
      .reverse();

  let odd = 0;
  let even = 0;

  digits.forEach((digit, i) => {
    if (i % 2 === 0) {
      odd += digit;
    } else {
      even += digit;
    }
  });

  return {
    odd,
    even,
    diff: Math.abs(odd - even)
  };
}

function divisibilityRule(divisor) {
  const rules = {
    2: "個位數是 0、2、4、6、8，就是 2 的倍數。",
    3: "各位數字和是 3 的倍數，就是 3 的倍數。",
    4: "末兩位所成的數是 4 的倍數，就是 4 的倍數。",
    5: "個位數是 0 或 5，就是 5 的倍數。",
    9: "各位數字和是 9 的倍數，就是 9 的倍數。",
    11: "奇數位數字和與偶數位數字和的差，是 11 的倍數或 0，就是 11 的倍數。"
  };

  return rules[divisor];
}

function divisibilityWork(n, divisor) {
  const digits = String(Math.abs(n)).split("");

  if (divisor === 2) {
    const last = digits.at(-1);

    return `個位數是 ${last}，${Number(last) % 2 === 0 ? "是偶數" : "不是偶數"}。`;
  }

  if (divisor === 3 || divisor === 9) {
    const sum = digitSum(n);

    return `各位數字和：${digits.join("＋")}＝${sum}；${sum} ${sum % divisor === 0 ? "是" : "不是"} ${divisor} 的倍數。`;
  }

  if (divisor === 4) {
    const last2 = lastTwoDigits(n);

    return `末兩位是 ${String(last2).padStart(2,"0")}；${last2} ${last2 % 4 === 0 ? "是" : "不是"} 4 的倍數。`;
  }

  if (divisor === 5) {
    const last = digits.at(-1);

    return `個位數是 ${last}；只有個位數為 0 或 5 才是 5 的倍數。`;
  }

  if (divisor === 11) {
    const data = alternating11Data(n);

    return `由個位數起交錯分組：奇數位數字和＝${data.odd}，偶數位數字和＝${data.even}，差＝${data.diff}；${data.diff} ${data.diff % 11 === 0 ? "是" : "不是"} 11 的倍數。`;
  }

  return "";
}

function shortDivisionHTML(n) {
  const rows = [];
  let value = n;

  while (value > 1) {
    let divisor = 2;

    while (
      divisor <= value &&
      value % divisor !== 0
    ) {
      divisor++;
    }

    const quotient =
      value / divisor;

    rows.push(
      `<tr><td>${divisor}</td><td>${value} → ${quotient}</td></tr>`
    );

    value = quotient;
  }

  return `
    <table class="short-division">
      <tbody>
        ${rows.join("")}
      </tbody>
    </table>
  `;
}

function readExpressionAnswer() {
  initExpressionInput();

  if (!answerInput) {
    return {
      valid: false,
      message: "標準分解式輸入器尚未完成載入，請重新整理頁面。"
    };
  }

  const validation =
    answerInput.validate();

  if (!validation.valid) {
    return {
      valid: false,
      message: "請完成標準分解式後再送出。"
    };
  }

  const terms =
    validation.value.terms;

  const utils =
    window.ExpressionInputUtils;

  if (
    utils?.isStandardPrimeFactorization &&
    !utils.isStandardPrimeFactorization(terms)
  ) {
    return {
      valid: false,
      message: "標準分解式的質因數要由小到大排列，且相同質因數要合併成次方。"
    };
  }

  let map = {};

  if (utils?.termsToFactorMap) {
    map =
      utils.termsToFactorMap(terms);
  } else {
    terms.forEach(term => {
      const base =
        Number(
          term.base ??
          term.value ??
          0
        );

      const exponent =
        Number(
          term.exponent ??
          1
        );

      if (base > 1) {
        map[base] = exponent;
      }
    });
  }

  return {
    valid: true,
    map,
    html:
      validation.value.html ||
      factorMapToHTML(map)
  };
}

function makeDivisibilityQuestion(divisor, force = null) {
  const shouldBe =
    force === null
      ? Math.random() < .5
      : force;

  let n = 0;

  for (let guard = 0; guard < 500; guard++) {
    const candidate =
      rand(100, 99999);

    if (
      (candidate % divisor === 0) ===
      shouldBe
    ) {
      n = candidate;
      break;
    }
  }

  if (!n) {
    n = shouldBe
      ? divisor * rand(20, 500)
      : divisor * rand(20, 500) + 1;
  }

  const correctValue =
    n % divisor === 0
      ? "yes"
      : "no";

  return choiceQuestion({
    key: `div-${divisor}-${n}`,
    label: `判斷 ${n} 是否為 ${divisor} 的倍數`,
    html: `<div class="math-expression">${n}</div>`,
    choices: yesNoChoices(),
    answer: correctValue,
    topic: `${divisor} 的倍數判別`,
    explanation: `
      <strong>第 1 步｜使用 ${divisor} 的倍數判別法</strong>
      <div class="rule-box">${divisibilityRule(divisor)}</div>
      <strong>第 2 步｜代入本題</strong>
      <div class="calculation-box">${divisibilityWork(n, divisor)}</div>
      <strong>結論：</strong>
      ${n} ${n % divisor === 0 ? "是" : "不是"} ${divisor} 的倍數。
    `
  });
}

function makeFactorRelationQuestion() {
  const a = rand(3, 18);
  const b = rand(3, 18);
  const product = a * b;

  const correctText =
    `${a} 是 ${product} 的因數，${product} 是 ${a} 的倍數`;

  const wrongs = [
    `${product} 是 ${a} 的因數，${a} 是 ${product} 的倍數`,
    `${a + b} 一定是 ${product} 的因數`,
    `${product} 不是 ${b} 的倍數`
  ];

  const choices =
    makeChoiceValues(
      correctText,
      wrongs
    );

  return choiceQuestion({
    key: `relation-${a}-${b}`,
    label: "根據乘法關係，選出正確敘述",
    html: `<div class="math-expression">${a} × ${b} ＝ ${product}</div>`,
    choices,
    answer: "correct",
    topic: "因數與倍數關係",
    explanation: `
      <strong>因數與倍數要成對理解。</strong>
      <div class="rule-box">
        若 a × b＝c，則 a、b 都是 c 的因數；c 是 a、b 的倍數。
      </div>
      本題 ${a} × ${b}＝${product}，所以
      <strong>${a}、${b} 都是 ${product} 的因數</strong>，
      而 <strong>${product} 是 ${a}、${b} 的倍數</strong>。
    `
  });
}

function makeFactorCheckQuestion() {
  const base = rand(4, 30);
  const quotient = rand(3, 25);
  const trueNumber = base * quotient;
  const makeTrue = Math.random() < .5;
  const target =
    makeTrue
      ? trueNumber
      : trueNumber + rand(1, base - 1);

  const isFactor =
    target % base === 0;

  return choiceQuestion({
    key: `factor-check-${base}-${target}`,
    label: `判斷 ${base} 是否為 ${target} 的因數`,
    html: `<div class="math-expression">${target} ÷ ${base}</div>`,
    choices: yesNoChoices(),
    answer: isFactor ? "yes" : "no",
    topic: "因數判別",
    explanation: `
      <strong>判斷因數的方法：</strong>
      看 ${target} ÷ ${base} 能不能整除。
      <div class="calculation-box">
        ${target} ÷ ${base}
        ${isFactor
          ? `＝${target / base}，沒有餘數`
          : `不能整除，會有餘數`}
      </div>
      所以 ${base} ${isFactor ? "是" : "不是"} ${target} 的因數。
    `
  });
}

function makeWhichMultipleQuestion() {
  const divisor =
    pick([2,3,4,5,9,11]);

  const correct =
    divisor * rand(21, 300);

  const wrongs = [];

  while (wrongs.length < 3) {
    const n =
      rand(50, 3000);

    if (
      n % divisor !== 0 &&
      !wrongs.includes(n)
    ) {
      wrongs.push(n);
    }
  }

  const choices =
    shuffle([
      { value: "correct", text: String(correct) },
      ...wrongs.map((n,i) => ({
        value: `wrong${i+1}`,
        text: String(n)
      }))
    ]);

  return choiceQuestion({
    key: `which-multiple-${divisor}-${correct}`,
    label: `下列哪一個數是 ${divisor} 的倍數？`,
    html: `<div class="math-expression">請使用倍數判別法</div>`,
    choices,
    answer: "correct",
    topic: `${divisor} 的倍數判別`,
    explanation: `
      <strong>${divisor} 的倍數判別法：</strong>
      <div class="rule-box">${divisibilityRule(divisor)}</div>
      正確選項是 <strong>${correct}</strong>。<br>
      ${divisibilityWork(correct, divisor)}
    `
  });
}

function createFactorMultipleSet() {
  return shuffle([
    makeDivisibilityQuestion(2),
    makeDivisibilityQuestion(3),
    makeDivisibilityQuestion(4),
    makeDivisibilityQuestion(5),
    makeDivisibilityQuestion(9),
    makeDivisibilityQuestion(11),
    makeFactorRelationQuestion(),
    makeFactorRelationQuestion(),
    makeFactorCheckQuestion(),
    makeWhichMultipleQuestion()
  ]);
}

function classificationOf(n) {
  if (n === 1) return "neither";
  return isPrime(n) ? "prime" : "composite";
}

function classificationText(value) {
  return {
    prime: "質數",
    composite: "合數",
    neither: "不是質數也不是合數"
  }[value];
}

function makeClassificationQuestion(n = null) {
  const number =
    n ??
    rand(2, 100);

  const answer =
    classificationOf(number);

  const factors =
    factorsOf(number);

  let detail = "";

  if (number === 1) {
    detail =
      "1 只有一個正因數 1，不符合「恰有 1 和本身兩個因數」的質數定義，也不是合數。";
  } else if (answer === "prime") {
    detail =
      `${number} 的正因數只有 1、${number}，所以是質數。`;
  } else {
    detail =
      `${number} 的正因數包含 ${listText(factors.slice(0, Math.min(factors.length, 8)))}${factors.length > 8 ? "……" : ""}，除了 1 和本身以外還有其他因數，所以是合數。`;
  }

  return choiceQuestion({
    key: `class-${number}`,

      <div class="rule-box">
        大於 1 且只有 1 和本身兩個正因數的是質數；<br>
        大於 1 且還有其他正因數的是合數；<br>
        1 不是質數，也不是合數。
      </div>
      ${detail}
    `
  });
}

function makeChoosePrimeQuestion() {
  const prime =
    pick(PRIME_LIST_100.filter(p => p >= 11));

  const composites = [];

  while (composites.length < 3) {
    const n = rand(10, 99);

    if (
      !isPrime(n) &&
      n !== 1 &&
      !composites.includes(n)
    ) {
      composites.push(n);
    }
  }

  const choices =
    shuffle([
      { value: "correct", text: String(prime) },
      ...composites.map((n,i) => ({
        value: `wrong${i+1}`,
        text: String(n)
      }))
    ]);

  return choiceQuestion({
    key: `choose-prime-${prime}-${composites.join("-")}`,

  return choiceQuestion({

    html: `<div class="math-expression">${n}</div>`,

  });
}

/*
==================================================
模式五：標準分解式判別因數倍數
==================================================
*/

function randomBaseMap() {
  const primes =
    shuffle([2,3,5,7,11])
      .slice(0, rand(2,4))
      .sort((a,b) => a-b);

  const map = {};

  primes.forEach(prime => {
    map[prime] = rand(1,3);
  });

  return map;
}

function makeFactorCandidate(baseMap, shouldBeFactor) {
  const result = {};

  Object.entries(baseMap)
    .forEach(([prime, exponent]) => {
      const exp = Number(exponent);

      if (Math.random() < .78) {
        result[prime] =
          rand(1, exp);
      }
    });

  if (Object.keys(result).length === 0) {
    const prime =
      Object.keys(baseMap)[0];

    result[prime] = 1;
  }

  if (!shouldBeFactor) {
    const keys =
      Object.keys(baseMap);

    if (Math.random() < .65) {
      const prime =
        pick(keys);

      result[prime] =
        Number(baseMap[prime]) + 1;
    } else {
      const newPrime =
        [2,3,5,7,11,13]
          .find(
            p =>
              !baseMap[p]
          );

      result[newPrime] = 1;
    }
  }

  return result;
}

function makeMultipleCandidate(baseMap, shouldBeMultiple) {
  const result = {};

  Object.entries(baseMap)
    .forEach(([prime, exponent]) => {
      result[prime] =
        Number(exponent) +
        rand(0,2);
    });

  if (Math.random() < .45) {
    const extra =
      [2,3,5,7,11,13]
        .find(
          p => !result[p]
        );

    if (extra) {
      result[extra] =
        rand(1,2);
    }
  }

  if (!shouldBeMultiple) {
    const keys =
      Object.keys(baseMap);

    const prime =
      pick(keys);

    const exp =
      Number(baseMap[prime]);

    if (exp === 1) {
      delete result[prime];
    } else {
      result[prime] =
        exp - 1;
    }
  }

  return result;
}

function compareMapExplanation(baseMap, candidateMap, relation) {
  const allPrimes =
    unique([
      ...Object.keys(baseMap).map(Number),
      ...Object.keys(candidateMap).map(Number)
    ]).sort((a,b) => a-b);

  const rows =
    allPrimes.map(prime => {
      const a =
        Number(baseMap[prime] || 0);

      const b =
        Number(candidateMap[prime] || 0);

      return `質因數 ${prime}：原數指數 ${a}，比較數指數 ${b}`;
    });

  const rule =
    relation === "factor"
      ? "要成為原數的因數：比較數不能出現原數沒有的質因數，而且每個質因數的指數都不能大於原數。"
      : "要成為原數的倍數：原數出現的每個質因數都必須保留，而且比較數的對應指數不能小於原數。";

  return `
    <div class="rule-box">${rule}</div>
    <div class="calculation-box">
      ${rows.join("<br>")}
    </div>
  `;
}

function isFactorMap(candidate, base) {
  for (const [prime, exponent] of Object.entries(candidate)) {
    if (
      Number(exponent) >
      Number(base[prime] || 0)
    ) {
      return false;
    }
  }

  return true;
}

function isMultipleMap(candidate, base) {
  for (const [prime, exponent] of Object.entries(base)) {
    if (
      Number(candidate[prime] || 0) <
      Number(exponent)
    ) {
      return false;
    }
  }

  return true;
}

function makeStandardJudgeQuestion(relation = null) {
  const baseMap =
    randomBaseMap();

  const resolvedRelation =
    relation ??
    (Math.random() < .5 ? "factor" : "multiple");

  const should =
    Math.random() < .5;

  const candidateMap =
    resolvedRelation === "factor"
      ? makeFactorCandidate(baseMap, should)
      : makeMultipleCandidate(baseMap, should);

  const actual =
    resolvedRelation === "factor"
      ? isFactorMap(candidateMap, baseMap)
      : isMultipleMap(candidateMap, baseMap);

  const baseHTML =
    factorMapToHTML(baseMap);

  const candidateHTML =
    factorMapToHTML(candidateMap);

  const wording =
    resolvedRelation === "factor"
      ? "因數"
      : "倍數";

  return choiceQuestion({
    key: `judge-${resolvedRelation}-${factorMapToText(baseMap)}-${factorMapToText(candidateMap)}`,
    label: `判斷 B 是否為 A 的${wording}`,
    html: `
      <div class="math-expression">
        A＝${baseHTML}<br>
        B＝${candidateHTML}
      </div>
    `,
    choices: yesNoChoices(),
    answer: actual ? "yes" : "no",
    topic: `標準分解式判斷${wording}`,
    explanation: `
      <strong>比較質因數與指數：</strong>
      ${compareMapExplanation(
        baseMap,
        candidateMap,
        resolvedRelation
      )}
      所以 B <strong>${actual ? "是" : "不是"}</strong> A 的${wording}。
    `
  });
}

  ];

  const choices =
    shuffle([
      {
        value: "correct",
        text: factorMapToPlain(correctMap)
      },
      ...wrongMaps.map((map,i) => ({
        value: `wrong${i+1}`,
        text: factorMapToPlain(map)
      }))
    ]);

  return choiceQuestion({
    key: `choose-multiple-${factorMapToText(baseMap)}`,
    label: "下列哪一個標準分解式一定是 A 的倍數？",
    html: `<div class="math-expression">A＝${factorMapToHTML(baseMap)}</div>`,
    choices,
    answer: "correct",
    topic: "標準分解式判斷倍數",
    explanation: `
      <strong>判斷倍數：原數的質因數都要保留，對應指數不能變小。</strong>
      ${compareMapExplanation(
        baseMap,
        correctMap,
        "multiple"
      )}
      因此正確選項是
      <strong>${factorMapToHTML(correctMap)}</strong>。
    `
  });
}

function createStandardJudgeSet() {
  return shuffle([
    makeStandardJudgeQuestion("factor"),
    makeStandardJudgeQuestion("factor"),
    makeStandardJudgeQuestion("factor"),
    makeStandardJudgeQuestion("multiple"),
    makeStandardJudgeQuestion("multiple"),
    makeStandardJudgeQuestion("multiple"),
    makeChooseFactorByStandardQuestion(),
    makeChooseFactorByStandardQuestion(),
    makeChooseMultipleByStandardQuestion(),
    makeChooseMultipleByStandardQuestion()
  ]);
}

/*
==================================================
競速題
==================================================
*/

function makeQuickStandardChoice() {
  const n =
    pick(STANDARD_POOL);

  const map =
    primeFactorMap(n);

  const correct =
    factorMapToPlain(map);

  const entries =
    Object.entries(map);

  const wrong1 = {...map};
  const firstPrime =
    Number(entries[0][0]);

  wrong1[firstPrime] =
    Number(wrong1[firstPrime]) + 1;

  const wrong2 = {...map};
  const secondPrime =
    Number(
      entries[
        Math.min(
          1,
          entries.length - 1
        )
      ][0]
    );

  if (Number(wrong2[secondPrime]) > 1) {
    wrong2[secondPrime] =
      Number(wrong2[secondPrime]) - 1;
  } else {
    wrong2[secondPrime] = 2;
  }

  const expanded =
    Object.entries(map)
      .flatMap(
        ([prime, exponent]) =>
          Array(Number(exponent))
            .fill(prime)
      )
      .join("×");

  return choiceQuestion({
    key: `quick-standard-${n}-${Date.now()}-${Math.random()}`,
    label: `選出 ${n} 的正確標準分解式`,
    html: `<div class="math-expression">${n}</div>`,
    choices: makeChoiceValues(
      correct,
      [
        factorMapToPlain(wrong1),
        factorMapToPlain(wrong2),
        expanded === correct
          ? `${correct}×1`
          : expanded
      ]
    ),
    answer: "correct",
    topic: "快速標準分解式",
    explanation: `
      ${n} 的質因數分解為
      <strong>${factorMapToHTML(map)}</strong>。
      標準分解式要把相同質因數合併成次方。
    `
  });
}

function makeSpeedQuestion() {
  const type =
    rand(1,5);

  if (type === 1) {
    return makeDivisibilityQuestion(
      pick([2,3,4,5,9,11])
    );
  }

  if (type === 2) {
    return makeClassificationQuestion(
      rand(1,100)
    );
  }

  if (type === 3) {
    return makeIsPrimeFactorQuestion();
  }

  if (type === 4) {
    return makeStandardJudgeQuestion(
      Math.random() < .5
        ? "factor"
        : "multiple"
    );
  }

  return makeQuickStandardChoice();
}

/*
==================================================
綜合挑戰
==================================================
*/

function createComprehensiveSet() {
  const factorMultiple =
    createFactorMultipleSet();

  const primeComposite =
    createPrimeCompositeSet();

  const primeFactor =
    createPrimeFactorSet();

  const standardForm =
    createStandardFormSet();

  const standardJudge =
    createStandardJudgeSet();

  return shuffle([
    factorMultiple[0],
    factorMultiple[1],
    primeComposite[0],
    primeFactor[0],
    standardForm.find(q => q.kind === "primeExpression"),
    standardForm.find(q => q.kind === "choice"),
    standardJudge[0],
    standardJudge[1]
  ]);
}

題組建立

function createQuestionSet(selectedMode) {
  switch (selectedMode) {
    case "factorMultiple":
      return createFactorMultipleSet();

    case "primeComposite":
      return createPrimeCompositeSet();

    case "primeFactor":
      return createPrimeFactorSet();

    case "standardForm":
      return createStandardFormSet();

    case "standardJudge":
      return createStandardJudgeSet();

    case "comprehensive":
      return createComprehensiveSet();

    default:
      return [];
  }
}

畫面與作答

function startGame(selectedMode) {

function renderSpeedQuestion() {

  ) {

  }

  answered = false;
  selectedChoice = null;

function renderAnswer(q) {
  $("choiceMount").innerHTML = "";

  if (q.kind === "choice") {
    $("choiceMount").classList.remove("hidden");
    $("expressionMountWrap").classList.add("hidden");

    q.choices.forEach(choice => {
      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "choice-button";
      button.dataset.value =
        choice.value;
      button.innerHTML =
        choice.text
          .replace(/\^(\d+)/g, "<sup>$1</sup>");

      button.addEventListener("click", () => {
        if (answered) return;

        selectedChoice =
          String(choice.value);

        document
          .querySelectorAll(".choice-button")
          .forEach(item => {
            item.classList.toggle(
              "selected",
              item === button
            );
          });

        $("input-message").textContent = "";
      });

      $("choiceMount")
        .appendChild(button);
    });

    return;
  }

  $("choiceMount").classList.add("hidden");
  $("expressionMountWrap").classList.remove("hidden");

  initExpressionInput();

  if (answerInput) {
    answerInput.reset();
    answerInput.setDisabled(false);
  }
}

function readAnswer(q) {
  if (q.kind === "choice") {
    if (selectedChoice === null) {
      return {
        valid: false,
        message: "請先選擇一個答案。"
      };
    }

    const choice =
      q.choices.find(
        item =>
          String(item.value) ===
          String(selectedChoice)
      );

    return {
      valid: true,
      value: String(selectedChoice),
      display:
        choice?.text ??
        selectedChoice
    };
  }

  const answer =
    readExpressionAnswer();

  if (!answer.valid) {
    return answer;
  }

  return {
    ...answer,
    value: answer.map,
    display:
      answer.html ||
      factorMapToHTML(answer.map)
  };
}

function isAnswerCorrect(q, answer) {
  if (q.kind === "choice") {
    return (
      String(answer.value) ===
      String(q.answer)
    );
  }

  return mapsEqual(
    answer.map,
    q.answerMap
  );
}

function correctAnswerHTML(q) {
  if (q.kind === "choice") {
    const item =
      q.choices.find(
        choice =>
          String(choice.value) ===
          String(q.answer)
      );

    return (
      item?.text ??
      q.answer
    )
      .replace(/\^(\d+)/g, "<sup>$1</sup>");
  }

  return factorMapToHTML(
    q.answerMap
  );
}

function markChoices(q, answer) {
  if (q.kind !== "choice") return;

  document
    .querySelectorAll(".choice-button")
    .forEach(button => {
      button.disabled = true;

      const value =
        String(button.dataset.value);

      if (
        value ===
        String(q.answer)
      ) {
        button.classList.add(
          "correct-choice"
        );
      }

      if (
        value ===
          String(answer.value) &&
        value !==
          String(q.answer)
      ) {
        button.classList.add(
          "wrong-choice"
        );
      }
    });
}

function submitAnswer() {
  if (answered) return;

  const q =
    modeId === "speed"
      ? questions[0]
      : questions[index];

  const answer =
    readAnswer(q);

  if (!answer.valid) {
    $("input-message").textContent =
      answer.message;

    if (
      q.kind === "primeExpression" &&
      answerInput
    ) {
      answerInput.showMessage(
        answer.message
      );
    }

    return;
  }

  const isCorrect =
    isAnswerCorrect(
      q,
      answer
    );

  answered = true;

  if (q.kind === "primeExpression") {
    answerInput?.setDisabled(true);
  }

  markChoices(q, answer);

  if (isCorrect) {
    correct++;
    combo++;
    maxCombo =
      Math.max(
        maxCombo,
        combo
      );

    playGameSound("playCorrect");
  } else {
    wrong++;
    combo = 0;
    playGameSound("playWrong");
  }

  records.push({
    number:
      modeId === "speed"
        ? speedAttempts + 1
        : index + 1,
    question: q,
    userAnswer:
      answer.display,
    correct: isCorrect
  });

  if (modeId === "speed") {
    speedAttempts++;

    if (isCorrect) {
      speedScore += 10;
    }

    $("feedback").textContent =
      isCorrect
        ? "✅ 正確！＋10 分"
        : "❌ 答錯了，下一題！";

    $("feedback").className =
      `feedback ${isCorrect ? "correct" : "wrong"}`;

    updateStatus();

    window.setTimeout(() => {
      if (
        modeId === "speed" &&
        speedRemaining > 0 &&
        !$("result-screen")
          .classList
          .contains("hidden") === false
      ) {
        renderSpeedQuestion();
      } else if (
        modeId === "speed" &&
        speedRemaining > 0
      ) {
        renderSpeedQuestion();
      }
    }, 320);

    return;
  }

  $("feedback").textContent =
    isCorrect
      ? "✅ 回答正確！"
      : "❌ 答案不正確，請看下方完整解析。";

  $("feedback").className =
    `feedback ${isCorrect ? "correct" : "wrong"}`;

  $("explanation").innerHTML =
    q.explanation;

  $("explanation")
    .classList
    .remove("hidden");

  $("submit-button")
    .classList
    .add("hidden");

  $("next-button")
    .classList
    .remove("hidden");

  $("next-button").textContent =
    index === questions.length - 1
      ? "查看測驗結果"
      : "下一題";

  updateStatus();
}

function nextQuestion() {
  if (!answered) return;

  index++;

  if (index >= questions.length) {
    showResult();
    return;
  }

  renderQuestion();
}

function updateStatus() {
  $("combo-display").textContent =
    combo;

  if (modeId === "speed") {
    $("score-display").textContent =
      speedScore;

    $("time-display").textContent =
      formatTime(speedRemaining);

    $("progress-bar").style.width =
      `${Math.min(
        100,
        (60 - speedRemaining) / 60 * 100
      )}%`;

    return;
  }

  const score =
    questions.length
      ? Math.round(
          correct /
          questions.length *
          100
        )
      : 0;

  $("score-display").textContent =
    score;

  $("time-display").textContent =
    formatTime(elapsed);
}

/*
==================================================
計時
==================================================
*/

function startTimer() {
  stopTimer();

  timerId =
    window.setInterval(() => {
      if (modeId === "speed") {
        speedRemaining--;

        if (
          speedRemaining <= 10 &&
          speedRemaining > 0
        ) {
          $("time-box")
            .classList
            .add("timer-danger");

          playUrgentCountdown();
        }

        if (speedRemaining <= 0) {
          speedRemaining = 0;
          updateStatus();
          stopTimer();

          window.setTimeout(
            showResult,
            50
          );

          return;
        }

        updateStatus();
        return;
      }

      elapsed =
        Math.floor(
          (Date.now() - startTime) /
          1000
        );

      updateStatus();
    }, 1000);
}

function stopTimer() {
  if (timerId) {
    window.clearInterval(timerId);
    timerId = null;
  }
}

/*
==================================================
結果
==================================================
*/

function rating(score, accuracy) {
  const value =
    modeId === "speed"
      ? accuracy
      : score;

  if (value >= 90) {
    return {
      stars: "★★★★★",
      comment: "觀念非常穩定！因數、質數、質因數與標準分解式都掌握得很好。"
    };
  }

  if (value >= 80) {
    return {
      stars: "★★★★☆",
      comment: "表現很好！再留意倍數判別規則與標準分解式的指數比較。"
    };
  }

  if (value >= 60) {
    return {
      stars: "★★★☆☆",
      comment: "核心概念已建立，建議利用錯題回顧把容易混淆的規則再練熟。"
    };
  }

  return {
    stars: "★★☆☆☆",
    comment: "建議依序從因數倍數、質數合數、質因數，再進入標準分解式練習。"
  };
}

async function showResult() {
  if (
    !$("result-screen")
      .classList
      .contains("hidden")
  ) {
    return;
  }

  stopTimer();

  if (modeId !== "speed") {
    elapsed =
      Math.floor(
        (Date.now() - startTime) /
        1000
      );
  } else {
    elapsed =
      60 - speedRemaining;
  }

  let score;
  let accuracy;
  let total;

  if (modeId === "speed") {
    total =
      speedAttempts;

    accuracy =
      total
        ? Math.round(
            correct /
            total *
            100
          )
        : 0;

    score =
      speedScore;
  } else {
    total =
      questions.length;

    score =
      Math.round(
        correct /
        total *
        1000
      ) / 10;

    accuracy =
      Math.round(
        correct /
        total *
        1000
      ) / 10;
  }

  const result =
    rating(
      score,
      accuracy
    );

  showOnly("result-screen");

  $("result-mode-name").textContent =
    MODE_CONFIG[modeId].name;

  $("final-score").textContent =
    modeId === "speed"
      ? `${score} 分`
      : `${Number.isInteger(score) ? score : score.toFixed(1)} 分`;

  $("final-stars").textContent =
    result.stars;

  $("final-comment").textContent =
    modeId === "speed"
      ? `${result.comment}　本次 60 秒共作答 ${total} 題，正確率 ${accuracy}%。`
      : result.comment;

  $("final-correct").textContent =
    correct;

  $("final-wrong").textContent =
    wrong;

  $("final-combo").textContent =
    maxCombo;

  $("final-time").textContent =
    formatTime(elapsed);

  const wrongCount =
    records.filter(
      record =>
        !record.correct
    ).length;

  $("review-button").disabled =
    wrongCount === 0;

  $("review-button").textContent =
    wrongCount === 0
      ? "全部答對，無錯題"
      : `錯題回顧（${wrongCount}）`;

  playGameSound("playComplete");

  await saveCompletion({
    score,
    accuracy,
    total
  });
}

現有 scores.js 成績儲存

async function saveScoreRecord({
  score,
  accuracy,
  total
}) {
  const status =
    $("save-status");

  try {
    const scoreModule =
      await import(
        "../js/scores.js?v=7"
      );

    if (
      typeof scoreModule.saveGameScore !==
      "function"
    ) {
      return {
        success: false,
        reason: "module-missing"
      };
    }

    return await scoreModule.saveGameScore({
      game: GAME_ID,
      mode: modeId,
      score,
      correctCount: correct,
      wrongCount: wrong,
      maxCombo,
      playTime: elapsed,
      totalQuestions: total,
      accuracy
    });

  } catch (error) {
    console.error(
      "2-1 成績儲存失敗：",
      error
    );

    status.textContent =
      "⚠️ 本次遊戲已完成，但成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";

    return {
      success: false,
      reason: "save-error"
    };
  }
}

/*
==================================================
RPG 相容橋接
未來 progress-system.js 上線後，
本遊戲檔本身不必重寫。
==================================================
*/

async function completeRpgBridge({
  score,
  accuracy,
  total
}) {
  const payload = {
    gameId: GAME_ID,
    modeId,
    score,
    correct,
    total,
    playTime: elapsed,
    accuracy,
    maxCombo,
    attemptId,
    difficultyWeight:
      MODE_CONFIG[modeId]
        ?.difficultyWeight ??
      1
  };

  // 1. 先廣播統一完成事件，未來 RPG 可直接監聽。
  try {
    window.dispatchEvent(
      new CustomEvent(
        "mathgame:session-complete",
        {
          detail: payload
        }
      )
    );
  } catch (_) {}

  // 2. 若未來已掛載全域 RPG 系統，直接呼叫。
  try {
    const globalHandler =
      window.MathGameProgress
        ?.completeLearningSession;

    if (
      typeof globalHandler === "function"
    ) {
      return await globalHandler(
        payload
      );
    }
  } catch (error) {
    console.warn(
      "RPG 全域橋接失敗：",
      error
    );
  }

  // 3. 嘗試未來規劃的 progress-system.js。
  //    現階段檔案尚未建立時，失敗不影響既有遊戲。
  try {
    const progressModule =
      await import(
        "../js/progress-system.js?v=1"
      );

    const handler =
      progressModule
        .completeLearningSession ||
      progressModule
        .default
        ?.completeLearningSession;

    if (
      typeof handler === "function"
    ) {
      return await handler(
        payload
      );
    }
  } catch (_) {
    // 尚未啟用 RPG 時保持靜默。
  }

  return null;
}

async function saveCompletion({
  score,
  accuracy,
  total
}) {
  if (scoreSaved) return;

  scoreSaved = true;

  const status =
    $("save-status");

  status.textContent =
    "☁️ 正在儲存本次成績……";

  status.style.color =
    "#1d4ed8";

  const scoreResult =
    await saveScoreRecord({
      score,
      accuracy,
      total
    });

  if (scoreResult?.success) {
    status.textContent =
      "✅ 本次成績已儲存。";

    status.style.color =
      "#15803d";
  } else if (
    scoreResult?.reason ===
    "not-logged-in"
  ) {
    status.textContent =
      "ℹ️ 尚未登入，因此本次成績沒有儲存。";

    status.style.color =
      "#b45309";
  } else if (
    scoreResult?.reason !==
    "save-error"
  ) {
    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";
  }

  // RPG 獎勵由中央 progress-system 統一計算，
  // 遊戲端不自行發 XP／寶石，避免重複發放。
  await completeRpgBridge({
    score,
    accuracy,
    total
  });
}

    "click",
    submitAnswer
  );

$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );

$("quit-button")
  .addEventListener(
    "click",
    () => {
      stopTimer();
      showOnly("start-screen");
    }
  );

$("again-button")
  .addEventListener(
    "click",
    () => {
      startGame(modeId);
    }
  );

$("review-button")
  .addEventListener(
    "click",
    showReview
  );

$("result-mode-button")
  .addEventListener(
    "click",
    () => {
      showOnly("start-screen");
    }
  );

$("review-again-button")
  .addEventListener(
    "click",
    () => {
      startGame(modeId);
    }
  );

$("review-result-button")
  .addEventListener(
    "click",
    () => {
      showOnly("result-screen");
    }
  );

window.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Enter" &&
      !$("quiz-screen")
        .classList
        .contains("hidden")
    ) {
      if (
        !$("next-button")
          .classList
          .contains("hidden")
      ) {
        nextQuestion();
      } else {
        submitAnswer();
      }
    }
  }
);

</script>
</body>
</html>
