.button-row{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.game-button{min-width:132px;padding:12px 20px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--primary-dark)}.game-button.secondary{background:#607d8b;box-shadow:0 5px 0 #455a64}.game-button.orange{background:#f57c00;box-shadow:0 5px 0 #d86600}.game-button.restart{background:#7e57c2;box-shadow:0 5px 0 #5e35b1}.game-button:disabled{opacity:.55;cursor:not-allowed}.feedback{min-height:48px;margin-top:14px;text-align:center;font-size:18px;font-weight:900;line-height:1.65}.feedback.correct{color:var(--success)}.feedback.wrong{color:var(--danger)}.feedback.warning{color:var(--warning)}

auto;color:#0f172a;font-size:20px;font-weight:900;line-height:1.8}.review-answer{color:#475569;line-height:1.9}
@media(max-width:760px){body{padding:8px}.screen{padding:18px 12px}.mode-grid{grid-template-columns:1fr}.quiz-topbar{grid-template-columns:repeat(2,minmax(0,1fr))}.timer-box{grid-column:1/-1}.result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-grid{grid-template-columns:1fr}.answer-panel{padding:14px 8px}.question-content{font-size:clamp(21px,6vw,30px)}.polynomial-answer-shell .expression-input__fraction-coefficient{grid-template-columns:115px!important;width:115px!important}.explanation{padding:14px}.explanation-question-math,.explanation-math{font-size:17px}}

<body>
<div class="page-shell">
<div id="commonHeaderMount"></div>
<main class="game-card">
<header class="game-header">
<h1 class="game-title">➕ 多項式加減大挑戰</h1>
<p class="game-subtitle">從同類項開始，逐步挑戰多項式加減、去括號、綜合計算與分數係數。</p>
<div class="concept-strip"><span class="concept-chip">同類項</span><span class="concept-chip">多項式加法</span><span class="concept-chip">多項式減法</span><span class="concept-chip">去括號</span><span class="concept-chip">分數係數</span></div>
</header>
<section id="start-screen" class="screen">
<div class="mode-grid">
<button class="mode-card" type="button" data-mode="likeTerms"><span class="mode-tag">基礎</span><h2>模式一｜同類項加減</h2><p>每題有三項，其中兩項為同類項，請判斷後正確合併。</p><div class="mode-example">例如：3x²－5x＋2x² → 5x²－5x</div></button>
<button class="mode-card" type="button" data-mode="addSubtract"><span class="mode-tag">標準</span><h2>模式二｜多項式加減法</h2><p>混合多項式加法與減法，練習去括號、變號與缺項。</p><div class="mode-example">注意：減號進括號時，每一項都必須變號。</div></button>
<button class="mode-card" type="button" data-mode="mixed"><span class="mode-tag">綜合</span><h2>模式三｜多項式綜合挑戰</h2><p>同類項、兩個多項式、三個多項式與判讀題混合出題。</p><div class="mode-example">同類項題同樣會保留三項，讓你判斷哪兩項可以合併。</div></button>
<button class="mode-card" type="button" data-mode="advanced"><span class="mode-tag">進階</span><h2>模式四｜進階綜合挑戰</h2><p>加入三次項、多個括號、前置負號、四個多項式與分數係數。</p><div class="mode-example">分數係數請自行約成最簡分數。</div></button>
</div>
</section>
<section id="quiz-screen" class="screen hidden">
<div class="quiz-topbar"><div class="status-box">模式<span id="mode-name" class="status-value">—</span></div><div class="status-box">進度<span id="question-number" class="status-value">1 / 10</span></div><div class="status-box">答對<span id="correct-count" class="status-value">0</span></div><div class="status-box">最高連擊<span id="combo-count" class="status-value">0</span></div><div class="status-box timer-box">測驗時間<span id="timer-display" class="status-value">00:00</span></div></div>
<div class="scratchpad-row"><div id="scratchpad-mobile-button"></div></div>
<div class="progress-shell"><div id="progress-bar" class="progress-bar"></div></div>
<div class="question-card"><div id="question-label" class="question-label"></div><div id="question-content" class="question-content"></div></div>
<div id="answer-panel" class="answer-panel"></div>
<div class="button-row"><button id="submit-button" class="game-button" type="button">提交答案（Enter）</button><button id="next-button" class="game-button hidden" type="button">下一題（Enter）</button><button id="restart-button" class="game-button restart" type="button">🔄 重新測驗</button><button id="mode-button" class="game-button secondary" type="button">選擇模式</button></div>
<div id="feedback" class="feedback"></div><div id="explanation" class="explanation hidden"></div>
</section>
<section id="result-screen" class="screen hidden result-panel"><h2>🎉 挑戰完成</h2><div id="final-score" class="result-score">0 分</div><div id="final-stars" class="result-stars">★★★☆☆</div><p id="final-comment"></p><div class="result-grid"><div class="result-stat">答對<br><span id="final-correct">0</span> 題</div><div class="result-stat">答錯<br><span id="final-wrong">0</span> 題</div><div class="result-stat">最高連擊<br><span id="final-combo">0</span></div><div class="result-stat">測驗時間<br><span id="final-time">00:00</span></div></div><div id="save-status" class="save-status"></div><div class="button-row"><button id="again-button" class="game-button restart" type="button">🔄 重新測驗</button><button id="review-button" class="game-button orange" type="button">錯題回顧</button><button id="result-mode-button" class="game-button secondary" type="button">選擇模式</button></div></section>
<section id="review-screen" class="screen hidden"><h2>📝 錯題回顧</h2><div id="review-list" class="review-list"></div><div class="button-row"><button id="review-again-button" class="game-button restart" type="button">🔄 重新測驗</button><button id="review-result-button" class="game-button secondary" type="button">回到測驗結果</button></div></section>
</main>
</div>

<script type="module">
import { saveGameScore } from "../js/scores.js";
"use strict";
const GAME_ID="polynomialAddSubtract",TOTAL_QUESTIONS=10;
const MODE_NAMES={likeTerms:"同類項加減",addSubtract:"多項式加減法",mixed:"多項式綜合挑戰",advanced:"進階綜合挑戰"};
const $=id=>document.getElementById(id),U=()=>window.ExpressionInputUtils;
let mode="likeTerms",questions=[],index=0,correct=0,wrong=0,combo=0,maxCombo=0,records=[],answered=false,selectedChoice=null,answerInput=null,startTime=0,elapsed=0,timerId=null,scoreSaved=false;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function nonZeroRand(min,max){let v=0;while(v===0)v=rand(min,max);return v}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function playGameSound(method){try{const s=window.GameSound||window.MathGameSound;s?.[method]?.()}catch(e){console.warn("音效播放失敗：",e)}}
function moveScratchpadButtonToTop(){const m=$("scratchpad-mobile-button"),b=$("scratchpadOpenButton");if(m&&b&&!m.contains(b))m.appendChild(b)}
function showOnly(screenId){["start-screen","quiz-screen","result-screen","review-screen"].forEach(id=>$(id).classList.toggle("hidden",id!==screenId));if(screenId==="quiz-screen"){moveScratchpadButtonToTop();window.showGameScratchpadButton?.()}else window.hideGameScratchpadButton?.()}
function F(n,d=1){return U().normalizeFraction(n,d)}function fractionCoefficient(v){return U().coefficientToFraction(v)}function multiplyFraction(v,m){return U().multiplyFraction(v,m)}
function randomFraction(){const ds=[2,3,4,5,6];while(true){const d=pick(ds);let n=rand(1,d-1);if(U().gcd(n,d)!==1)continue;if(Math.random()<.5)n=-n;return F(n,d)}}
function normalize(t){return U().normalizePolynomialTermsAsFractions(t)}function add(a,b){return normalize([...a,...b])}function scale(t,m){return normalize(t.map(x=>({exponent:x.exponent,coefficient:multiplyFraction(fractionCoefficient(x.coefficient),m)})))}function subtract(a,b){return add(a,scale(b,-1))}function combine(items){let r=[];items.forEach(item=>r=add(r,scale(item.terms,item.sign)));return r}
function randomIntegerPolynomial(o={}){const maxDegree=o.maxDegree??2,minTerms=o.minTerms??2,maxTerms=Math.min(o.maxTerms??(maxDegree+1),maxDegree+1),min=o.min??-8,max=o.max??8,powers=shuffle(Array.from({length:maxDegree+1},(_,e)=>e)).slice(0,rand(minTerms,maxTerms));return normalize(powers.map(exponent=>({exponent,coefficient:nonZeroRand(min,max)})))}
function randomFractionPolynomial(){const powers=shuffle([2,1,0]).slice(0,rand(2,3));return normalize(powers.map(exponent=>({exponent,coefficient:randomFraction()})))}
function polynomialHTML(t){return U().polynomialTermsToHtml(normalize(t),"x",{omitCoefficientOne:true})}
function rawPolynomialHTML(terms){if(!terms.length)return"0";return terms.map((term,i)=>{const c=Number(term.coefficient),e=Number(term.exponent),neg=c<0,a=Math.abs(c),sign=i===0?(neg?"－":""):(neg?"－":"＋");if(e===0)return`${sign}${a}`;const ct=a===1?"":String(a),et=e===1?"":`<sup>${e}</sup>`;return`${sign}${ct}x${et}`}).join("")}
function bracket(t){return`<span class="math-bracket">(${polynomialHTML(t)})</span>`}function questionExpression(html){return`<span class="question-expression">${html}</span>`}
function coefficientText(v){const f=fractionCoefficient(v);if(f.denominator===1)return String(f.numerator);return`${f.numerator}/${f.denominator}`}
function signedPolynomialHTML(t,sign=1){return polynomialHTML(scale(t,sign))}
function groupsHTML(items,maxDegree=3){const rows=[];for(let e=maxDegree;e>=0;e--){const vals=[];items.forEach(item=>item.terms.forEach(term=>{if(term.exponent===e)vals.push(multiplyFraction(fractionCoefficient(term.coefficient),item.sign))}));if(!vals.length)continue;const name=e===0?"常數項":e===1?"x 項":`x<sup>${e}</sup> 項`;const sum=vals.reduce((acc,v)=>U().addFractions?U().addFractions(acc,v):F(acc.numerator*v.denominator+v.numerator*acc.denominator,acc.denominator*v.denominator),F(0,1));rows.push(`${name}：${vals.map(coefficientText).join(" ＋ ")} ＝ ${coefficientText(sum)}`)}return rows.join("<br>")}
function polynomialQuestion(html,answer,detail,label,fraction=false){return{type:"polynomial",html:questionExpression(html),answer:normalize(answer),detail,label,fraction}}
function choiceQuestion(html,choices,answer,detail,label){return{type:"choice",html:questionExpression(html),choices,answer,detail,label}}
function makeDetail({method,steps,pitfall,summary}){return{method,steps,pitfall,summary}}
function makeLikeQuestion(){while(true){const likeExponent=pick([1,2]),thirdExponent=pick([0,1,2].filter(e=>e!==likeExponent)),c1=nonZeroRand(-8,8),c2=nonZeroRand(-8,8);if(c1+c2===0)continue;const c3=nonZeroRand(-8,8),raw=shuffle([{exponent:likeExponent,coefficient:c1},{exponent:likeExponent,coefficient:c2},{exponent:thirdExponent,coefficient:c3}]),answer=normalize(raw);if(answer.length!==2)continue;const likeName=likeExponent===2?"x² 項":"x 項",thirdName=thirdExponent===2?"x² 項":thirdExponent===1?"x 項":"常數項";return polynomialQuestion(rawPolynomialHTML(raw),answer,makeDetail({method:"先看每一項的『字母部分與次方』，完全相同才是同類項；同類項只加減係數。",steps:[`辨認項目：三項中有兩個是 <strong>${likeName}</strong>，另外一個是 <strong>${thirdName}</strong>。`,`找出同類項：${likeName} 的字母與次方完全相同，所以可以合併；${thirdName} 不同類，必須原樣保留。`,`只算係數：<span class="explanation-math">${c1} ＋ (${c2}) ＝ ${c1+c2}</span>`,`把合併後的 ${likeName} 與保留的 ${thirdName} 重新整理，並依降冪排列。`],pitfall:"不要把 x² 項和 x 項相加；同類項的判斷看的是字母與次方，不是係數大小。",summary:`最後答案：${polynomialHTML(answer)}`}),"請找出哪兩項是同類項，合併後寫出完整多項式")}}
function makeTwoPolynomial(operation,missing=false){while(true){const first=randomIntegerPolynomial({maxDegree:2,minTerms:missing?2:3,maxTerms:3}),second=randomIntegerPolynomial({maxDegree:2,minTerms:missing?1:3,maxTerms:missing?2:3}),answer=operation==="add"?add(first,second):subtract(first,second);if(!answer.length)continue;const symbol=operation==="add"?"＋":"－",sign=operation==="add"?1:-1,after=`${polynomialHTML(first)} ${operation==="add"?"＋":"＋"} (${signedPolynomialHTML(second,sign)})`;return polynomialQuestion(`${bracket(first)}<span class="outer-operator">${symbol}</span>${bracket(second)}`,answer,makeDetail({method:operation==="add"?"先去括號，再把 x²、x、常數項分組；括號前是加號，括號內符號全部不變。":"先處理減號進括號：第二個括號內『每一項』都要變號，再合併同類項。",steps:[operation==="add"?`去括號：第二個括號前是加號，所以各項符號不變。<span class="explanation-math">${polynomialHTML(first)} ＋ ${polynomialHTML(second)}</span>`:`去括號：第二個括號前是減號，所以第二個多項式全部變號。<span class="explanation-math">${polynomialHTML(first)} ＋ (${signedPolynomialHTML(second,-1)})</span>`,`依 x²、x、常數項分類。<span class="explanation-math">${groupsHTML([{sign:1,terms:first},{sign,terms:second}],2)}</span>`,`把每一類係數算完，省略係數 1，並依降冪排列。`],pitfall:operation==="add"?"括號前是加號時，不需要改符號；不要因為看到括號就自行變號。":"最常見錯誤是只改第二個括號的第一項。減號進括號時，每一項都要變號。",summary:`最後答案：${polynomialHTML(answer)}`}),operation==="add"?"請計算多項式的和":"請計算多項式的差")}}
function makeTriple(){while(true){const first=randomIntegerPolynomial({maxDegree:2,minTerms:2,maxTerms:3}),second=randomIntegerPolynomial({maxDegree:2,minTerms:2,maxTerms:3}),third=randomIntegerPolynomial({maxDegree:2,minTerms:2,maxTerms:3}),sign2=pick([1,-1]),sign3=pick([1,-1]),items=[{sign:1,terms:first},{sign:sign2,terms:second},{sign:sign3,terms:third}],answer=combine(items);if(!answer.length)continue;return polynomialQuestion(`${bracket(first)}<span class="outer-operator">${sign2===1?"＋":"－"}</span>${bracket(second)}<span class="outer-operator">${sign3===1?"＋":"－"}</span>${bracket(third)}`,answer,makeDetail({method:"三個多項式不要急著直接算；先逐一處理括號前的正負號，再統一分類同類項。",steps:[`第一個括號直接保留；第二個括號前是 ${sign2===1?"加號，所以符號不變":"減號，所以每一項變號"}；第三個括號前是 ${sign3===1?"加號，所以符號不變":"減號，所以每一項變號"}。`,`去括號後：<span class="explanation-math">${signedPolynomialHTML(first,1)} ＋ (${signedPolynomialHTML(second,sign2)}) ＋ (${signedPolynomialHTML(third,sign3)})</span>`,`依 x²、x、常數項分類後計算：<span class="explanation-math">${groupsHTML(items,2)}</span>`,`完成係數計算後，按照 x²、x、常數項的順序整理。`],pitfall:"每個括號都要看『括號前』的符號；不要把前一個括號的符號錯套到下一個括號。",summary:`最後答案：${polynomialHTML(answer)}`}),"請完成三個多項式的綜合加減")}}
function makeChoice(){while(true){const first=randomIntegerPolynomial({maxDegree:2,minTerms:3,maxTerms:3}),second=randomIntegerPolynomial({maxDegree:2,minTerms:3,maxTerms:3}),correctAnswer=subtract(first,second),wrong1=add(first,second),sw2=second.map((t,i)=>({exponent:t.exponent,coefficient:i===0?multiplyFraction(fractionCoefficient(t.coefficient),-1):t.coefficient})),wrong2=add(first,sw2),sw3=second.map((t,i)=>({exponent:t.exponent,coefficient:i===second.length-1?multiplyFraction(fractionCoefficient(t.coefficient),-1):t.coefficient})),wrong3=add(first,sw3),texts=[polynomialHTML(correctAnswer),polynomialHTML(wrong1),polynomialHTML(wrong2),polynomialHTML(wrong3)];if(new Set(texts).size!==4)continue;return choiceQuestion(`${bracket(first)}<span class="outer-operator">－</span>${bracket(second)}<span class="outer-operator">＝？</span>`,shuffle([{value:"correct",text:texts[0]},{value:"wrong1",text:texts[1]},{value:"wrong2",text:texts[2]},{value:"wrong3",text:texts[3]}]),"correct",makeDetail({method:"看到『前式－後式』時，先把後式每一項全部變號，再和前式合併。",steps:[`第二個括號前是減號，所以整個第二個多項式變號。<span class="explanation-math">${polynomialHTML(first)} ＋ (${signedPolynomialHTML(second,-1)})</span>`,`依 x²、x、常數項分類：<span class="explanation-math">${groupsHTML([{sign:1,terms:first},{sign:-1,terms:second}],2)}</span>`,`比較選項，只有完整做到『每一項都變號』且合併正確的結果才是答案。`],pitfall:"錯誤選項通常故意設計成：完全沒變號、只變第一項、或只變最後一項。",summary:`正確答案：${texts[0]}`}),"請選出正確的計算結果")}}
function makeAdvancedInteger(){while(true){const first=randomIntegerPolynomial({maxDegree:3,minTerms:3,maxTerms:4,min:-9,max:9}),second=randomIntegerPolynomial({maxDegree:3,minTerms:2,maxTerms:4,min:-9,max:9}),third=randomIntegerPolynomial({maxDegree:3,minTerms:2,maxTerms:4,min:-9,max:9}),sign2=pick([1,-1]),sign3=pick([1,-1]),items=[{sign:1,terms:first},{sign:sign2,terms:second},{sign:sign3,terms:third}],answer=combine(items);if(!answer.length)continue;return polynomialQuestion(`${bracket(first)}<span class="outer-operator">${sign2===1?"＋":"－"}</span>${bracket(second)}<span class="outer-operator">${sign3===1?"＋":"－"}</span>${bracket(third)}`,answer,makeDetail({method:"進階題只是次方提高到 x³；核心仍然只有兩件事：正確去括號、正確合併同類項。",steps:[`依序處理括號前符號：第二個括號 ${sign2===1?"不變號":"全部變號"}，第三個括號 ${sign3===1?"不變號":"全部變號"}。`,`去括號後：<span class="explanation-math">${signedPolynomialHTML(first,1)} ＋ (${signedPolynomialHTML(second,sign2)}) ＋ (${signedPolynomialHTML(third,sign3)})</span>`,`依 x³、x²、x、常數項分類：<span class="explanation-math">${groupsHTML(items,3)}</span>`,`算完各類係數，再依降冪排列。`],pitfall:"x³、x²、x 是三種不同類的項，不能互相合併。",summary:`最後答案：${polynomialHTML(answer)}`}),"請完成進階多項式加減")}}
function makeLeadingNegative(){while(true){const first=randomIntegerPolynomial({maxDegree:3,minTerms:3,maxTerms:4}),second=randomIntegerPolynomial({maxDegree:3,minTerms:2,maxTerms:4}),third=randomIntegerPolynomial({maxDegree:3,minTerms:2,maxTerms:4}),items=[{sign:-1,terms:first},{sign:1,terms:second},{sign:-1,terms:third}],answer=combine(items);if(!answer.length)continue;return polynomialQuestion(`<span class="outer-operator">－</span>${bracket(first)}<span class="outer-operator">＋</span>${bracket(second)}<span class="outer-operator">－</span>${bracket(third)}`,answer,makeDetail({method:"式子的最前面也可以有負號。把它視為『－1 × 第一個括號』，因此第一個括號每一項都要變號。",steps:[`第一個括號前有負號：<span class="explanation-math">－(${polynomialHTML(first)}) ＝ ${signedPolynomialHTML(first,-1)}</span>`,`第二個括號前是加號，符號不變；第三個括號前是減號，全部變號。<span class="explanation-math">${signedPolynomialHTML(first,-1)} ＋ ${signedPolynomialHTML(second,1)} ＋ (${signedPolynomialHTML(third,-1)})</span>`,`依次方分類：<span class="explanation-math">${groupsHTML(items,3)}</span>`,`最後依降冪排列。`],pitfall:"最前面的『－』不能漏掉；它會作用在第一個括號的每一項。",summary:`最後答案：${polynomialHTML(answer)}`}),"請正確處理括號前的負號")}}
function makeFractionQuestion(){while(true){const first=randomFractionPolynomial(),second=randomFractionPolynomial(),operation=pick(["add","subtract"]),sign=operation==="add"?1:-1,answer=operation==="add"?add(first,second):subtract(first,second);if(!answer.length||!answer.some(t=>fractionCoefficient(t.coefficient).denominator!==1))continue;return polynomialQuestion(`${bracket(first)}<span class="outer-operator">${operation==="add"?"＋":"－"}</span>${bracket(second)}`,answer,makeDetail({method:"分數係數題和整數題完全同一套流程，只是『係數運算』要先通分，最後再約分。",steps:[operation==="subtract"?`先把第二個多項式每一項變號。<span class="explanation-math">${polynomialHTML(first)} ＋ (${signedPolynomialHTML(second,-1)})</span>`:`括號前是加號，第二個多項式符號不變。<span class="explanation-math">${polynomialHTML(first)} ＋ ${polynomialHTML(second)}</span>`,`依 x²、x、常數項分類。<span class="explanation-math">${groupsHTML([{sign:1,terms:first},{sign,terms:second}],2)}</span>`,`同類項的分數係數先找公分母，再做加減；計算後一定約成最簡分數。`,`整理為降冪排列的完整多項式。`],pitfall:"分數相加減不能直接『分子加分子、分母加分母』；一定要先通分。",summary:`最後答案：${polynomialHTML(answer)}`}),"請計算，分數係數最後要化成最簡分數",true)}}
function makeFour(){while(true){const items=[];for(let i=0;i<4;i++)items.push({sign:i===0?1:pick([1,-1]),terms:randomIntegerPolynomial({maxDegree:3,minTerms:2,maxTerms:3,min:-5,max:5})});const answer=combine(items);if(!answer.length)continue;const html=items.map((item,i)=>i===0?bracket(item.terms):`<span class="outer-operator">${item.sign===1?"＋":"－"}</span>${bracket(item.terms)}`).join("");return polynomialQuestion(html,answer,makeDetail({method:"四個多項式看起來長，但不要同時處理。照順序先處理每個括號前的符號，再一次分類。",steps:[`逐一去括號：<span class="explanation-math">${items.map(item=>`(${signedPolynomialHTML(item.terms,item.sign)})`).join(" ＋ ")}</span>`,`依 x³、x²、x、常數項分類：<span class="explanation-math">${groupsHTML(items,3)}</span>`,`逐類完成係數加減，不同次方絕對不要混在一起。`,`最後按 x³、x²、x、常數項的順序整理。`],pitfall:"式子越長越容易漏掉某一項；建議去括號後逐項核對，再開始合併。",summary:`最後答案：${polynomialHTML(answer)}`}),"請完成四個多項式的綜合加減")}}
function makeMode1(){return Array.from({length:TOTAL_QUESTIONS},()=>makeLikeQuestion())}
function makeMode2(){return shuffle(["add","add","add","add","subtract","subtract","subtract","subtract","missingAdd","missingSubtract"]).map(t=>t==="add"?makeTwoPolynomial("add"):t==="subtract"?makeTwoPolynomial("subtract"):t==="missingAdd"?makeTwoPolynomial("add",true):makeTwoPolynomial("subtract",true))}

function makeMode4(){return shuffle([makeAdvancedInteger(),makeAdvancedInteger(),makeLeadingNegative(),makeLeadingNegative(),makeFractionQuestion(),makeFractionQuestion(),makeFractionQuestion(),makeFour(),makeFour(),makeChoice()])}
function createQuestions(){if(mode==="likeTerms")return makeMode1();if(mode==="addSubtract")return makeMode2();if(mode==="mixed")return makeMode3();return makeMode4()}
function formatTime(seconds){const m=Math.floor(seconds/60),s=seconds%60;return`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}function stopTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}if(startTime)elapsed=Math.floor((Date.now()-startTime)/1000)}function startTimer(){if(timerId!==null)clearInterval(timerId);startTime=Date.now();elapsed=0;$("timer-display").textContent="00:00";timerId=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);$("timer-display").textContent=formatTime(elapsed)},500)}
function renderAnswer(question){selectedChoice=null;answerInput=null;const panel=$("answer-panel");if(question.type==="polynomial"){panel.innerHTML=`<div class="answer-title">${question.label}</div><p class="answer-help">請像紙本作答一樣，將最後答案整理成降冪排列的完整多項式。${question.fraction?"<br>分數係數請以上下分子、分母的格式輸入，並自行約成最簡分數。":""}</p><div class="polynomial-answer-shell"><div id="polynomial-answer-mount"></div></div>`;if(typeof window.ExpressionInput!=="function"){$("feedback").className="feedback warning";$("feedback").textContent="ExpressionInput 共用元件沒有正常載入。";return}answerInput=new window.ExpressionInput({mountId:"polynomial-answer-mount",allowNumber:false,allowExpression:false,allowPolynomial:true,defaultMode:"polynomial",polynomialVariable:"x",polynomialExponentOptions:[3,2,1,0],maxPolynomialTerms:4,allowNegativePolynomialCoefficient:true,allowZeroPolynomialCoefficient:false,allowFractionPolynomialCoefficient:Boolean(question.fraction),requireSimplifiedFraction:true,requireDescendingPowers:true,disallowDuplicatePowers:true,omitPolynomialCoefficientOne:true,theme:{primary:"#00897b",light:"#e0f2f1",border:"#80cbc4"},labels:{polynomialLabel:question.fraction?"請輸入含分數係數的多項式":"請輸入最後整理後的多項式",polynomialCoefficientLabel:question.fraction?"輸入這一項的分數係數":"輸入這一項的係數",polynomialExponentLabel:"選擇這一項",polynomialSignLabel:"正負號",polynomialEditLabel:"編輯答案",numeratorLabel:"分子",denominatorLabel:"分母"}});setTimeout(()=>answerInput?.focus(),0);return}panel.innerHTML=`<div class="answer-title">${question.label}</div><div class="choice-grid">${question.choices.map(c=>`<button type="button" class="choice-button" data-choice="${c.value}">${c.text}</button>`).join("")}</div>`;panel.querySelectorAll(".choice-button").forEach(button=>button.addEventListener("click",()=>{selectedChoice=button.dataset.choice;panel.querySelectorAll(".choice-button").forEach(i=>i.classList.remove("selected"));button.classList.add("selected")}))}
function displayQuestion(){answered=false;const q=questions[index];$("mode-name").textContent=MODE_NAMES[mode];$("question-number").textContent=`${index+1} / ${TOTAL_QUESTIONS}`;$("correct-count").textContent=correct;$("combo-count").textContent=maxCombo;$("progress-bar").style.width=`${index/TOTAL_QUESTIONS*100}%`;$("question-label").textContent=q.label;$("question-content").innerHTML=q.html;$("feedback").textContent="";$("feedback").className="feedback";$("explanation").innerHTML="";$("explanation").classList.add("hidden");$("submit-button").classList.remove("hidden");$("next-button").classList.add("hidden");renderAnswer(q);window.resetGameScratchpad?.()}
function readAnswer(q){if(q.type==="polynomial"){if(!answerInput)return{valid:false,message:"多項式輸入器尚未準備完成。"};const r=answerInput.validate();if(!r.valid)return{valid:false,message:r.message||"請將多項式答案輸入完整。"};return{valid:true,value:r.value.fractionTerms,display:r.value.html}}if(!selectedChoice)return{valid:false,message:"請先選擇一個答案。"};const c=q.choices.find(i=>i.value===selectedChoice);return{valid:true,value:selectedChoice,display:c?.text||selectedChoice}}
function samePolynomial(first,second){const a=normalize(first),b=normalize(second);if(a.length!==b.length)return false;return a.every((t,i)=>{const o=b[i],f1=fractionCoefficient(t.coefficient),f2=fractionCoefficient(o.coefficient);return t.exponent===o.exponent&&f1.numerator===f2.numerator&&f1.denominator===f2.denominator})}
function checkCorrect(q,a){return q.type==="polynomial"?samePolynomial(a.value,q.answer):a.value===q.answer}
function correctAnswerHTML(q){if(q.type==="polynomial")return polynomialHTML(q.answer);return q.choices.find(i=>i.value===q.answer)?.text||""}
function explanationHTML(q){const d=q.detail||{};return`<div class="explanation-heading">📘 完整詳解</div><div class="explanation-question"><div class="explanation-question-title">題目</div><div class="explanation-question-math">${q.html}</div></div>${d.method?`<div class="explanation-method"><strong>先想一想｜</strong>${d.method}</div>`:""}${(d.steps||[]).map((step,i)=>`<div class="explanation-step"><span class="explanation-step-title">步驟 ${i+1}｜</span>${step}</div>`).join("")}${d.pitfall?`<div class="explanation-tip"><strong>⚠️ 常見錯誤｜</strong>${d.pitfall}</div>`:""}${d.summary?`<div class="explanation-summary">✅ ${d.summary}</div>`:""}`}
function submitAnswer(){if(answered)return;const q=questions[index],a=readAnswer(q);if(!a.valid){$("feedback").className="feedback warning";$("feedback").textContent=a.message;return}answered=true;answerInput?.setDisabled(true);const ok=checkCorrect(q,a);if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo);$("feedback").className="feedback correct";$("feedback").textContent="✨ 回答正確！";playGameSound("playCorrect")}else{wrong++;combo=0;$("feedback").className="feedback wrong";$("feedback").innerHTML=`❌ 答案不正確。正確答案：<strong>${correctAnswerHTML(q)}</strong>`;playGameSound("playWrong")}records.push({number:index+1,question:q,userAnswer:a.display,correct:ok});$("correct-count").textContent=correct;$("combo-count").textContent=maxCombo;$("explanation").innerHTML=explanationHTML(q);$("explanation").classList.remove("hidden");$("submit-button").classList.add("hidden");$("next-button").classList.remove("hidden");$("next-button").textContent=index===TOTAL_QUESTIONS-1?"查看測驗結果（Enter）":"下一題（Enter）";$("next-button").focus()}
function nextQuestion(){if(!answered)return;index++;if(index<TOTAL_QUESTIONS)displayQuestion();else showResult()}
function startGame(selectedMode){stopTimer();mode=selectedMode;questions=createQuestions();index=correct=wrong=combo=maxCombo=0;records=[];answered=false;selectedChoice=null;answerInput=null;scoreSaved=false;elapsed=0;$("timer-display").textContent="00:00";$("save-status").textContent="";showOnly("quiz-screen");displayQuestion();startTimer();playGameSound("playStart")}
function rating(score){if(score>=90)return{stars:"★★★★★",comment:"太棒了！你已能熟練處理多項式的加減與同類項。"};if(score>=80)return{stars:"★★★★☆",comment:"表現很好，再注意減號進括號與同類項的符號。"};if(score>=60)return{stars:"★★★☆☆",comment:"基本概念已掌握，再加強同類項合併與去括號。"};return{stars:"★★☆☆☆",comment:"建議先從模式一重新練習同類項，再進入多項式加減。"}}
async function showResult(){stopTimer();const score=Math.round(correct/TOTAL_QUESTIONS*100),r=rating(score);showOnly("result-screen");$("final-score").textContent=`${score} 分`;$("final-stars").textContent=r.stars;$("final-comment").textContent=r.comment;$("final-correct").textContent=correct;$("final-wrong").textContent=wrong;$("final-combo").textContent=maxCombo;$("final-time").textContent=formatTime(elapsed);$("review-button").disabled=wrong===0;$("review-button").textContent=wrong===0?"全部答對，無錯題":"錯題回顧";await saveCurrentScore(score)}
async function saveCurrentScore(score){if(scoreSaved)return;scoreSaved=true;const s=$("save-status");s.textContent="☁️ 正在儲存本次成績……";s.style.color="#1d4ed8";try{const r=await saveGameScore({game:GAME_ID,mode,score,correctCount:correct,wrongCount:wrong,maxCombo,playTime:elapsed,totalQuestions:TOTAL_QUESTIONS});if(r.success){s.textContent="✅ 本次成績已儲存。";s.style.color="#15803d";return}if(r.reason==="not-logged-in"){s.textContent="ℹ️ 尚未登入，因此本次成績沒有儲存。";s.style.color="#b45309";return}s.textContent="⚠️ 成績暫時無法儲存。";s.style.color="#b91c1c"}catch(e){console.error("多項式加減成績儲存失敗：",e);s.textContent="⚠️ 成績暫時無法儲存。";s.style.color="#b91c1c"}}
function showReview(){const wrongRecords=records.filter(r=>!r.correct);$("review-list").innerHTML=wrongRecords.length?wrongRecords.map(r=>`<article class="review-card"><div class="review-title">第 ${r.number} 題 ❌</div><div class="review-question">${r.question.html}</div><div class="review-answer">你的答案：<strong>${r.userAnswer}</strong></div><div class="review-answer">正確答案：<strong>${correctAnswerHTML(r.question)}</strong></div><div class="explanation">${explanationHTML(r.question)}</div></article>`).join(""):`<div class="review-card">全部答對，沒有需要回顧的錯題！</div>`;showOnly("review-screen")}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));$("submit-button").addEventListener("click",submitAnswer);$("next-button").addEventListener("click",nextQuestion);$("restart-button").addEventListener("click",()=>startGame(mode));$("mode-button").addEventListener("click",()=>{stopTimer();showOnly("start-screen")});$("again-button").addEventListener("click",()=>startGame(mode));$("result-mode-button").addEventListener("click",()=>showOnly("start-screen"));$("review-button").addEventListener("click",showReview);$("review-again-button").addEventListener("click",()=>startGame(mode));$("review-result-button").addEventListener("click",()=>showOnly("result-screen"));document.addEventListener("keydown",e=>{if(e.key!=="Enter"||$("quiz-screen").classList.contains("hidden"))return;e.preventDefault();answered?nextQuestion():submitAnswer()});window.addEventListener("DOMContentLoaded",()=>{moveScratchpadButtonToTop();setTimeout(moveScratchpadButtonToTop,100)});showOnly("start-screen");
</script>
