<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多項式加減大挑戰｜數學遊戲樂園</title>

<link rel="stylesheet" href="../css/scratchpad.css">
<link rel="stylesheet" href="../css/expression-input.css?v=5">

<style>
*{
  box-sizing:border-box;
}

:root{
  --primary:#00897b;
  --primary-dark:#00695c;
  --primary-light:#e0f2f1;
  --primary-border:#80cbc4;
  --text:#1f2937;
  --muted:#64748b;
  --success:#15803d;
  --danger:#b91c1c;
  --warning:#b45309;
}

body{
  margin:0;
  min-height:100vh;
  padding:16px;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#e8f7f5,#fff8e8);
}

button,
input,
select{
  font-family:inherit;
}

.hidden{
  display:none!important;
}

.page-shell{
  width:min(100%,960px);
  margin:0 auto;
}

#commonHeaderMount{
  margin-bottom:14px;
}

.game-card{
  overflow:hidden;
  border:1px solid #d8eeeb;
  border-top:8px solid var(--primary);
  border-radius:26px;
  background:#fff;
  box-shadow:0 14px 34px rgba(15,23,42,.13);
}

.game-header{
  padding:24px 20px 18px;
  text-align:center;
  background:linear-gradient(180deg,var(--primary-light),#fff);
}

.game-title{
  margin:0;
  color:var(--primary-dark);
  font-size:clamp(28px,5vw,40px);
}

.game-subtitle{
  margin:10px 0 0;
  color:var(--muted);
  line-height:1.7;
}

.concept-strip{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.concept-chip{
  padding:7px 11px;
  border:1px solid var(--primary-border);
  border-radius:999px;
  background:#fff;
  color:var(--primary-dark);
  font-size:14px;
  font-weight:900;
}

.screen{
  padding:22px;
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.mode-card{
  min-height:190px;
  padding:21px;
  border:2px solid var(--primary-border);
  border-radius:20px;
  background:linear-gradient(180deg,var(--primary-light),#fff);
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.mode-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(15,23,42,.11);
}

.mode-tag{
  display:inline-block;
  margin-bottom:10px;
  padding:4px 9px;
  border-radius:999px;
  background:#fff;
  color:var(--primary-dark);
  font-size:12px;
  font-weight:900;
}

.mode-card h2{
  margin:0 0 9px;
  color:var(--primary-dark);
  font-size:21px;
}

.mode-card p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}

.mode-example{
  margin-top:10px;
  color:#475569;
  font-size:14px;
  font-weight:900;
  line-height:1.6;
}

.quiz-topbar{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}

.status-box{
  min-height:64px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8px;
  border-radius:14px;
  background:var(--primary-light);
  color:var(--primary-dark);
  text-align:center;
  font-weight:900;
}

.status-value{
  margin-top:3px;
  font-size:18px;
}

.timer-box{
  background:#fff7ed;
  color:#c2410c;
}

.scratchpad-row{
  display:flex;
  justify-content:center;
  min-height:46px;
  margin:4px 0 12px;
}

#scratchpad-mobile-button{
  display:flex;
  justify-content:center;
  width:100%;
}

#scratchpad-mobile-button #scratchpadOpenButton,
#scratchpad-mobile-button .scratchpad-open-button{
  position:static!important;
  inset:auto!important;
  transform:none!important;
  margin:0!important;
  z-index:auto!important;
}

.progress-shell{
  height:10px;
  margin-bottom:16px;
  overflow:hidden;
  border-radius:999px;
  background:#e2e8f0;
}

.progress-bar{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--primary),#4db6ac);
  transition:width .2s ease;
}

.question-card{
  padding:22px 18px;
  border:2px solid var(--primary-border);
  border-radius:20px;
  background:#fff;
  text-align:center;
}

.question-label{
  margin-bottom:10px;
  color:var(--muted);
  font-weight:900;
}

.question-content{
  min-height:135px;
  display:flex;
  align-items:center;
  overflow-x:auto;
  overflow-y:hidden;
  padding:10px 4px;
  color:#0f172a;
  font-size:clamp(23px,4.6vw,39px);
  font-weight:900;
  -webkit-overflow-scrolling:touch;
}

.question-expression{
  display:inline-block;
  min-width:max-content;
  margin:auto;
  padding:.12em .30em;
  white-space:nowrap;
  line-height:1.55;
  text-align:center;
  font-family:"Cambria Math","Times New Roman","Microsoft JhengHei",serif;
}

.question-expression *{
  white-space:nowrap;
}

.question-expression sup,
.explanation sup,
.review-question sup,
.review-answer sup{
  position:relative;
  top:-.48em;
  margin-left:1px;
  font-size:.58em;
  line-height:1;
  vertical-align:baseline;
}

.math-fraction,
.expression-input__inline-fraction{
  display:inline-flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  min-width:1.4em;
  margin:0 .12em;
  vertical-align:middle;
  line-height:1.05;
}

.math-fraction-top,
.expression-input__inline-fraction>span:first-child{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:100%;
  padding:0 .15em .08em;
  border-bottom:1.8px solid currentColor;
  text-align:center;
}

.math-fraction-bottom,
.expression-input__inline-fraction>span:last-child{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:100%;
  padding:.08em .15em 0;
  text-align:center;
}

.polynomial-answer-shell .expression-input__fraction-coefficient{
  display:grid!important;
  grid-template-columns:minmax(105px,150px)!important;
  grid-template-rows:auto auto!important;
  align-items:stretch!important;
  justify-items:stretch!important;
  gap:0!important;
  width:min(150px,100%)!important;
  margin:0!important;
  padding:0!important;
  border:2px solid var(--primary-border);
  border-radius:13px;
  overflow:hidden;
  background:#fff;
}

.polynomial-answer-shell .expression-input__fraction-slash{
  display:none!important;
}

.polynomial-answer-shell .expression-input__fraction-field{
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  gap:4px!important;
  width:100%!important;
  margin:0!important;
  padding:7px 8px!important;
  background:#fff;
}

.polynomial-answer-shell .expression-input__fraction-field:first-child{
  border-bottom:2px solid #334155;
}

.polynomial-answer-shell .expression-input__fraction-field>span{
  color:#64748b!important;
  font-size:12px!important;
  font-weight:900!important;
  line-height:1!important;
}

.polynomial-answer-shell .expression-input__fraction-field input{
  width:100%!important;
  min-width:0!important;
  height:40px!important;
  padding:5px!important;
  border:0!important;
  border-radius:0!important;
  outline:none!important;
  background:transparent!important;
  color:#0f172a!important;
  font-size:21px!important;
  font-weight:900!important;
  text-align:center!important;
  box-shadow:none!important;
}

.answer-panel{
  margin-top:16px;
  padding:18px;
  border-radius:18px;
  background:#f8fafc;
}

.answer-title{
  margin-bottom:10px;
  color:var(--primary-dark);
  text-align:center;
  font-weight:900;
  line-height:1.6;
}

.answer-help{
  margin:0 0 12px;
  color:#64748b;
  text-align:center;
  font-size:14px;
  font-weight:800;
  line-height:1.6;
}

.polynomial-answer-shell{
  width:min(100%,820px);
  margin:0 auto;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.choice-button{
  min-height:66px;
  padding:11px;
  border:2px solid var(--primary-border);
  border-radius:13px;
  background:#fff;
  color:#263238;
  font-size:16px;
  font-weight:900;
  line-height:1.65;
  cursor:pointer;
}

.choice-button.selected{
  border-color:var(--primary);
  background:var(--primary-light);
  color:var(--primary-dark);
}

.button-row{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}

.game-button{
  min-width:132px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 var(--primary-dark);
}

.game-button.secondary{
  background:#607d8b;
  box-shadow:0 5px 0 #455a64;
}

.game-button.orange{
  background:#f57c00;
  box-shadow:0 5px 0 #d86600;
}

.game-button.restart{
  background:#7e57c2;
  box-shadow:0 5px 0 #5e35b1;
}

.game-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.feedback{
  min-height:48px;
  margin-top:14px;
  text-align:center;
  font-size:18px;
  font-weight:900;
  line-height:1.65;
}

.feedback.correct{
  color:var(--success);
}

.feedback.wrong{
  color:var(--danger);
}

.feedback.warning{
  color:var(--warning);
}

.explanation{
  margin-top:12px;
  padding:18px;
  border-radius:16px;
  background:#f7fbfa;
  color:#334155;
  line-height:1.9;
  border:1px solid #cfe8e4;
}

.explanation-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  color:var(--primary-dark);
  font-size:20px;
  font-weight:900;
}

.explanation-question{
  padding:12px 14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #dbece9;
  margin-bottom:12px;
}

.explanation-question-title{
  font-weight:900;
  color:#475569;
  margin-bottom:6px;
}

.explanation-question-math{
  overflow-x:auto;
  color:#0f172a;
  font-size:21px;
  font-weight:900;
}

.explanation-method{
  padding:12px 14px;
  border-radius:12px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  margin-bottom:12px;
}

.explanation-method strong{
  color:#c2410c;
}

.explanation-step{
  margin:10px 0;
  padding:12px 14px;
  border-radius:12px;
  background:#fff;
  border-left:4px solid var(--primary);
}

.explanation-step-title{
  display:block;
  margin-bottom:5px;
  color:var(--primary-dark);
  font-weight:900;
}

.explanation-math{
  display:block;
  margin-top:6px;
  overflow-x:auto;
  color:#0f172a;
  font-size:18px;
  font-weight:900;
}

.explanation-tip{
  margin-top:12px;
  padding:12px 14px;
  border-radius:12px;
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#9f1239;
}

.explanation-tip strong{
  color:#be123c;
}

.explanation-summary{
  margin-top:12px;
  padding:13px 14px;
  border-radius:12px;
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  color:#166534;
  font-weight:900;
}

.result-panel{
  text-align:center;
}

.result-score{
  margin:16px 0;
  color:#f57c00;
  font-size:56px;
  font-weight:900;
}

.result-stars{
  margin-bottom:10px;
  font-size:31px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin:20px 0;
}

.result-stat{
  padding:16px 10px;
  border-radius:16px;
  background:var(--primary-light);
  color:var(--primary-dark);
  font-weight:900;
}

.save-status{
  min-height:28px;
  margin:14px 0 0;
  font-weight:900;
}

.review-list{
  display:grid;
  gap:14px;
}

.review-card{
  padding:18px;
  border:1px solid #e2e8f0;
  border-radius:16px;
  background:#fff;
}

.review-title{
  color:var(--danger);
  font-weight:900;
}

.review-question{
  margin:8px 0;
  overflow-x:auto;
  color:#0f172a;
  font-size:20px;
  font-weight:900;
  line-height:1.8;
}

.review-answer{
  color:#475569;
  line-height:1.9;
}

@media(max-width:760px){
  body{
    padding:8px;
  }

  .screen{
    padding:18px 12px;
  }

  .mode-grid{
    grid-template-columns:1fr;
  }

  .quiz-topbar{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .timer-box{
    grid-column:1/-1;
  }

  .result-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .choice-grid{
    grid-template-columns:1fr;
  }

  .answer-panel{
    padding:14px 8px;
  }

  .question-content{
    font-size:clamp(21px,6vw,30px);
  }

  .polynomial-answer-shell .expression-input__fraction-coefficient{
    grid-template-columns:115px!important;
    width:115px!important;
  }

  .explanation{
    padding:14px;
  }

  .explanation-question-math,
  .explanation-math{
    font-size:17px;
  }
}

@media(max-width:520px){
  .polynomial-answer-shell .expression-input__fraction-coefficient{
    grid-template-columns:105px!important;
    width:105px!important;
  }
}

#polynomial-answer-mount .expression-input__fraction-coefficient{
  flex-direction:column!important;
}
</style>
</head>

<body>

<div class="page-shell">

<div id="commonHeaderMount"></div>

<main class="game-card">

<header class="game-header">

<h1 class="game-title">
➕ 多項式加減大挑戰
</h1>

<p class="game-subtitle">
從同類項開始，逐步挑戰多項式加減、去括號、綜合計算與分數係數。
</p>

<div class="concept-strip">
<span class="concept-chip">同類項</span>
<span class="concept-chip">多項式加法</span>
<span class="concept-chip">多項式減法</span>
<span class="concept-chip">去括號</span>
<span class="concept-chip">分數係數</span>
</div>

</header>

<section
  id="start-screen"
  class="screen"
>

<div class="mode-grid">

<button
  class="mode-card"
  type="button"
  data-mode="likeTerms"
>
<span class="mode-tag">基礎</span>
<h2>模式一｜同類項加減</h2>
<p>
每題有三項，其中兩項為同類項，請判斷後正確合併。
</p>
<div class="mode-example">
例如：3x²－5x＋2x² → 5x²－5x
</div>
</button>

<button
  class="mode-card"
  type="button"
  data-mode="addSubtract"
>
<span class="mode-tag">標準</span>
<h2>模式二｜多項式加減法</h2>
<p>
混合多項式加法與減法，練習去括號、變號與缺項。
</p>
<div class="mode-example">
注意：減號進括號時，每一項都必須變號。
</div>
</button>

<button
  class="mode-card"
  type="button"
  data-mode="mixed"
>
<span class="mode-tag">綜合</span>
<h2>模式三｜多項式綜合挑戰</h2>
<p>
同類項、兩個多項式、三個多項式與判讀題混合出題。
</p>
<div class="mode-example">
同類項題同樣會保留三項，讓你判斷哪兩項可以合併。
</div>
</button>

<button
  class="mode-card"
  type="button"
  data-mode="advanced"
>
<span class="mode-tag">進階</span>
<h2>模式四｜進階綜合挑戰</h2>
<p>
加入三次項、多個括號、前置負號、四個多項式與分數係數。
</p>
<div class="mode-example">
分數係數請自行約成最簡分數。
</div>
</button>

</div>

</section>

<section
  id="quiz-screen"
  class="screen hidden"
>

<div class="quiz-topbar">

<div class="status-box">
模式
<span
  id="mode-name"
  class="status-value"
>
—
</span>
</div>

<div class="status-box">
進度
<span
  id="question-number"
  class="status-value"
>
1 / 10
</span>
</div>

<div class="status-box">
答對
<span
  id="correct-count"
  class="status-value"
>
0
</span>
</div>

<div class="status-box">
最高連擊
<span
  id="combo-count"
  class="status-value"
>
0
</span>
</div>

<div class="status-box timer-box">
測驗時間
<span
  id="timer-display"
  class="status-value"
>
00:00
</span>
</div>

</div>

<div class="scratchpad-row">
<div id="scratchpad-mobile-button"></div>
</div>

<div class="progress-shell">
<div
  id="progress-bar"
  class="progress-bar"
></div>
</div>

<div class="question-card">

<div
  id="question-label"
  class="question-label"
></div>

<div
  id="question-content"
  class="question-content"
></div>

</div>

<div
  id="answer-panel"
  class="answer-panel"
></div>

<div class="button-row">

<button
  id="submit-button"
  class="game-button"
  type="button"
>
提交答案（Enter）
</button>

<button
  id="next-button"
  class="game-button hidden"
  type="button"
>
下一題（Enter）
</button>

<button
  id="restart-button"
  class="game-button restart"
  type="button"
>
🔄 重新測驗
</button>

<button
  id="mode-button"
  class="game-button secondary"
  type="button"
>
選擇模式
</button>

</div>

<div
  id="feedback"
  class="feedback"
></div>

<div
  id="explanation"
  class="explanation hidden"
></div>

</section>

<section
  id="result-screen"
  class="screen hidden result-panel"
>

<h2>
🎉 挑戰完成
</h2>

<div
  id="final-score"
  class="result-score"
>
0 分
</div>

<div
  id="final-stars"
  class="result-stars"
>
★★★☆☆
</div>

<p id="final-comment"></p>

<div class="result-grid">

<div class="result-stat">
答對
<br>
<span id="final-correct">0</span>
題
</div>

<div class="result-stat">
答錯
<br>
<span id="final-wrong">0</span>
題
</div>

<div class="result-stat">
最高連擊
<br>
<span id="final-combo">0</span>
</div>

<div class="result-stat">
測驗時間
<br>
<span id="final-time">00:00</span>
</div>

</div>

<div
  id="save-status"
  class="save-status"
></div>

<div class="button-row">

<button
  id="again-button"
  class="game-button restart"
  type="button"
>
🔄 重新測驗
</button>

<button
  id="review-button"
  class="game-button orange"
  type="button"
>
錯題回顧
</button>

<button
  id="result-mode-button"
  class="game-button secondary"
  type="button"
>
選擇模式
</button>

</div>

</section>

<section
  id="review-screen"
  class="screen hidden"
>

<h2>
📝 錯題回顧
</h2>

<div
  id="review-list"
  class="review-list"
></div>

<div class="button-row">

<button
  id="review-again-button"
  class="game-button restart"
  type="button"
>
🔄 重新測驗
</button>

<button
  id="review-result-button"
  class="game-button secondary"
  type="button"
>
回到測驗結果
</button>

</div>

</section>

</main>

</div>

<script src="../js/common-header.js"></script>
<script src="../js/scratchpad.js"></script>
<script src="../js/scratchpad-template.js"></script>
<script src="../js/sound-manager.js?v=1"></script>
<script src="../js/expression-input.js?v=5"></script>

<script type="module">

import {
  saveGameScore

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}

function nonZeroRand(
  min,
  max
) {

  let value =
    0;

  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }

  return value;
}

function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}

function shuffle(
  array
) {

  const result =
    [
      ...array
    ];

  for (
    let i =
      result.length -
      1;
    i >
      0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );

    [
      result[i],
      result[j]
    ] =
      [
        result[j],
        result[i]
      ];
  }

  return result;
}

function F(
  numerator,
  denominator =
    1
) {

  return U()
    .normalizeFraction(
      numerator,
      denominator
    );
}

function fractionCoefficient(
  value
) {

  return U()
    .coefficientToFraction(
      value
    );
}

function multiplyFraction(
  value,
  multiplier
) {

  return U()
    .multiplyFraction(
      value,
      multiplier
    );
}

function randomFraction() {

  const denominators =
    [
      2,
      3,
      4,
      5,
      6
    ];

  while (
    true
  ) {

    const denominator =
      pick(
        denominators
      );

    let numerator =
      rand(
        1,
        denominator -
        1
      );

    if (
      U().gcd(
        numerator,
        denominator
      ) !==
      1
    ) {

      continue;
    }

    if (
      Math.random() <
      .5
    ) {

      numerator =
        -numerator;
    }

    return F(
      numerator,
      denominator
    );
  }
}

function normalize(
  terms
) {

  return U()
    .normalizePolynomialTermsAsFractions(
      terms
    );
}

function add(
  first,
  second
) {

  return normalize(
    [
      ...first,
      ...second
    ]
  );
}

function scale(
  terms,
  multiplier
) {

  return normalize(

    terms.map(
      term => ({

        exponent:
          term.exponent,

        coefficient:
          multiplyFraction(
            fractionCoefficient(
              term.coefficient
            ),
            multiplier
          )
      })
    )
  );
}

function subtract(
  first,
  second
) {

  return add(
    first,
    scale(
      second,
      -1
    )
  );
}

function combine(
  items
) {

  let result =
    [];

  items.forEach(
    item => {

      result =
        add(
          result,
          scale(
            item.terms,
            item.sign
          )
        );
    }
  );

  return result;
}

function randomIntegerPolynomial(
  options =
    {}
) {

  const maxDegree =
    options.maxDegree ??
    2;

  const minTerms =
    options.minTerms ??
    2;

  const maxTerms =
    Math.min(

      options.maxTerms ??
      (
        maxDegree +
        1
      ),

      maxDegree +
      1
    );

  const coefficientMin =
    options.min ??
    -8;

  const coefficientMax =
    options.max ??
    8;

  const powers =
    shuffle(

      Array.from(
        {
          length:
            maxDegree +
            1
        },
        (
          _,
          exponent
        ) =>
          exponent
      )
    )
      .slice(
        0,
        rand(
          minTerms,
          maxTerms
        )
      );

  return normalize(

    powers.map(
      exponent => ({

        exponent,

        coefficient:
          nonZeroRand(
            coefficientMin,
            coefficientMax
          )
      })
    )
  );
}

function randomFractionPolynomial() {

  const powers =
    shuffle(
      [
        2,
        1,
        0
      ]
    )
      .slice(
        0,
        rand(
          2,
          3
        )
      );

  return normalize(

    powers.map(
      exponent => ({

        exponent,

        coefficient:
          randomFraction()
      })
    )
  );
}

function polynomialHTML(
  terms
) {

  return U()
    .polynomialTermsToHtml(
      normalize(
        terms
      ),
      "x",
      {
        omitCoefficientOne:
          true
      }
    );
}

function rawPolynomialHTML(
  terms
) {

  if (
    !terms.length
  ) {

    return "0";
  }

  return terms
    .map(
      (
        term,
        termIndex
      ) => {

        const coefficient =
          Number(
            term.coefficient
          );

        const exponent =
          Number(
            term.exponent
          );

        const negative =
          coefficient <
          0;

        const absolute =
          Math.abs(
            coefficient
          );

        let sign;

        if (
          termIndex ===
          0
        ) {

          sign =
            negative
              ? "－"
              : "";

        } else {

          sign =
            negative
              ? "－"
              : "＋";
        }

        if (
          exponent ===
          0
        ) {

          return (
            `${sign}${absolute}`
          );
        }

        const coefficientText =
          absolute ===
          1
            ? ""
            : String(
                absolute
              );

        const exponentText =
          exponent ===
          1
            ? ""
            : `<sup>${exponent}</sup>`;

        return (
          `${sign}` +
          `${coefficientText}` +
          `x` +
          `${exponentText}`
        );
      }
    )
    .join("");
}

function bracket(
  terms
) {

  return (
    `<span class="math-bracket">(` +
    `${polynomialHTML(
      terms
    )}` +
    `)</span>`
  );
}

function questionExpression(

}

/*
==================================================
詳解數值顯示

*/

function coefficientText(
  value
) {

  const fraction =
    fractionCoefficient(
      value
    );

  if (
    fraction.denominator ===
    1
  ) {

    return String(
      fraction.numerator
    );
  }

  return (
    `${fraction.numerator}` +
    `/` +
    `${fraction.denominator}`
  );
}

/*
計算過程中的負數一定加括號：
(-3)＋5
(-3)＋(-7)

但等號右邊的結果不加括號：
(-3)＋5＝2
2＋(-5)＝-3
*/
function calculationCoefficientText(
  value
) {

  const fraction =
    fractionCoefficient(
      value
    );

  const text =
    coefficientText(
      fraction
    );

  return (
    fraction.numerator <
    0
  )
    ? `(${text})`
    : text;
}

function signedPolynomialHTML(
  terms,
  sign =
    1
) {

  return polynomialHTML(
    scale(
      terms,
      sign
    )
  );
}

/*
拆括號、變號完成後直接移除括號。
*/
function expandedPolynomialsHTML(
  items
) {

  return items
    .map(
      (
        item,
        itemIndex
      ) => {

        const html =
          signedPolynomialHTML(
            item.terms,
            item.sign
          );

        if (
          itemIndex ===
          0
        ) {

          return html;
        }

        if (
          html
            .trim()
            .startsWith(
              "－"
            )
        ) {

          return ` ${html}`;
        }

        return ` ＋ ${html}`;
      }
    )
    .join("");
}

/*
同類項分類與係數計算。

左邊運算中的負數：
加括號。

右邊最後計算結果：
不加括號。
*/
function groupsHTML(
  items,
  maxDegree =
    3
) {

  const rows =
    [];

  for (
    let exponent =
      maxDegree;
    exponent >=
      0;
    exponent--
  ) {

    const values =
      [];

    items.forEach(
      item => {

        item.terms
          .forEach(
            term => {

              if (
                term.exponent ===
                exponent
              ) {

                values.push(
                  multiplyFraction(
                    fractionCoefficient(
                      term.coefficient
                    ),
                    item.sign
                  )
                );
              }
            }
          );
      }
    );

    if (
      !values.length
    ) {

      continue;
    }

    const name =
      exponent ===
      0
        ? "常數項"
        : exponent ===
          1
          ? "x 項"
          : `x<sup>${exponent}</sup> 項`;

    const sum =
      values.reduce(
        (
          accumulator,
          value
        ) => {

          if (
            U().addFractions
          ) {

            return U()
              .addFractions(
                accumulator,
                value
              );
          }

          return F(

            accumulator.numerator *
              value.denominator +
            value.numerator *
              accumulator.denominator,

            accumulator.denominator *
              value.denominator
          );
        },
        F(
          0,
          1
        )
      );

    rows.push(
      `${name}：` +
      `${values
        .map(
          calculationCoefficientText
        )
        .join(
          " ＋ "
        )}` +
      ` ＝ ` +
      `${coefficientText(
        sum
      )}`
    );
  }

  return rows
    .join(
      "<br>"
    );
}

/*
==================================================
模式一｜同類項
==================================================
*/

function makeLikeQuestion() {

  while (
    true
  ) {

    const likeExponent =
      pick(
        [
          1,
          2
        ]
      );

    const thirdExponent =
      pick(

        [
          0,
          1,
          2
        ]
          .filter(
            exponent =>
              exponent !==
              likeExponent
          )
      );

    const coefficient1 =
      nonZeroRand(
        -8,
        8
      );

    const coefficient2 =
      nonZeroRand(
        -8,
        8
      );

    if (
      coefficient1 +
      coefficient2 ===
      0
    ) {

      continue;
    }

    const coefficient3 =
      nonZeroRand(
        -8,
        8
      );

    const rawTerms =
      shuffle(
        [
          {
            exponent:
              likeExponent,

            coefficient:
              coefficient1
          },

          {
            exponent:
              likeExponent,

            coefficient:
              coefficient2
          },

          {
            exponent:
              thirdExponent,

            coefficient:
              coefficient3
          }
        ]
      );

    const answer =
      normalize(
        rawTerms
      );

    if (
      answer.length !==
      2
    ) {

      continue;
    }

    const likeName =
      likeExponent ===
      2
        ? "x² 項"
        : "x 項";

    const thirdName =
      thirdExponent ===
      2
        ? "x² 項"
        : thirdExponent ===
          1
          ? "x 項"
          : "常數項";

    return polynomialQuestion(

      rawPolynomialHTML(
        rawTerms
      ),

      answer,

      makeDetail({

        method:
          "先看每一項的「字母部分與次方」，完全相同才是同類項；同類項只加減係數。",

        steps:
          [

            `辨認項目：三項中有兩個是 <strong>${likeName}</strong>，另外一個是 <strong>${thirdName}</strong>。`,

            `找出同類項：${likeName} 的字母與次方完全相同，所以可以合併；${thirdName} 不同類，必須原樣保留。`,

            `只算係數：
             <span class="explanation-math">
               ${
                 calculationCoefficientText(
                   F(
                     coefficient1,
                     1
                   )
                 )
               }
               ＋
               ${
                 calculationCoefficientText(
                   F(
                     coefficient2,
                     1
                   )
                 )
               }
               ＝
               ${
                 coefficientText(
                   F(
                     coefficient1 +
                     coefficient2,
                     1
                   )
                 )
               }
             </span>`,

            `把合併後的 ${likeName} 與保留的 ${thirdName} 重新整理，並依降冪排列。`
          ],

        pitfall:
          "不要把 x² 項和 x 項相加；同類項的判斷看的是字母與次方，不是係數大小。",

        summary:
          `最後答案：${polynomialHTML(
            answer
          )}`
      }),

      "請找出哪兩項是同類項，合併後寫出完整多項式"
    );
  }
}

/*
==================================================
模式二｜兩個多項式
==================================================
*/

function makeTwoPolynomial(
  operation,
  missing =
    false
) {

  while (
    true
  ) {

    const first =
      randomIntegerPolynomial(
        {
          maxDegree:
            2,

          minTerms:
            missing
              ? 2
              : 3,

          maxTerms:
            3
        }
      );

    const second =
      randomIntegerPolynomial(
        {
          maxDegree:
            2,

          minTerms:
            missing
              ? 1
              : 3,

          maxTerms:
            missing
              ? 2
              : 3
        }
      );

    const answer =
      operation ===
      "add"
        ? add(
            first,
            second
          )
        : subtract(
            first,
            second
          );

    if (
      !answer.length
    ) {

      continue;
    }

    const symbol =
      operation ===
      "add"
        ? "＋"
        : "－";

    const sign =
      operation ===
      "add"
        ? 1
        : -1;

    const items =
      [
        {
          sign:
            1,

          terms:
            first
        },

        {
          sign,

          terms:
            second
        }
      ];

    return polynomialQuestion(

      `${bracket(
        first
      )}` +

      `<span class="outer-operator">
         ${symbol}
       </span>` +

      `${bracket(
        second
      )}`,

      answer,

      makeDetail({

        method:
          operation ===
          "add"

            ? "先去括號，再把 x²、x、常數項分組；括號前是加號，括號內符號全部不變。"

            : "先處理減號進括號：第二個括號內「每一項」都要變號，再合併同類項。",

        steps:
          [

            operation ===
            "add"

              ? `去括號：第二個括號前是加號，所以各項符號不變；去掉括號後直接寫成：
                 <span class="explanation-math">
                   ${
                     expandedPolynomialsHTML(
                       items
                     )
                   }
                 </span>`

              : `去括號：第二個括號前是減號，所以第二個多項式每一項都變號；變號完成後括號移除：
                 <span class="explanation-math">
                   ${
                     expandedPolynomialsHTML(
                       items
                     )
                   }
                 </span>`,

            `依 x²、x、常數項分類。
             <span class="explanation-math">
               ${
                 groupsHTML(
                   items,
                   2
                 )
               }
             </span>`,

            `把每一類係數算完，省略係數 1，並依降冪排列。`
          ],

        pitfall:
          operation ===
          "add"

            ? "括號前是加號時，不需要改符號；不要因為看到括號就自行變號。"

            : "最常見錯誤是只改第二個括號的第一項。減號進括號時，每一項都要變號。",

        summary:
          `最後答案：${polynomialHTML(
            answer
          )}`
      }),

      operation ===
      "add"

        ? "請計算多項式的和"

        : "請計算多項式的差"
    );
  }
}

function makeTriple() {

  while (
    true
  ) {

    const first =
      randomIntegerPolynomial(
        {
          maxDegree:
            2,

          minTerms:
            2,

          maxTerms:
            3
        }
      );

    const second =
      randomIntegerPolynomial(
        {
          maxDegree:
            2,

          minTerms:
            2,

          maxTerms:
            3
        }
      );

    const third =
      randomIntegerPolynomial(
        {
          maxDegree:
            2,

          minTerms:
            2,

          maxTerms:
            3
        }
      );

    const sign2 =
      pick(
        [
          1,
          -1
        ]
      );

    const sign3 =
      pick(
        [
          1,
          -1
        ]
      );

    const items =
      [
        {
          sign:
            1,

          terms:
            first
        },

        {
          sign:
            sign2,

          terms:
            second
        },

        {
          sign:
            sign3,

          terms:
            third
        }
      ];

    const answer =
      combine(
        items
      );

    if (
      !answer.length
    ) {

      continue;
    }

    return polynomialQuestion(

      `${bracket(
        first
      )}` +

      `<span class="outer-operator">
         ${
           sign2 ===
           1
             ? "＋"
             : "－"
         }
       </span>` +

      `${bracket(
        second
      )}` +

      `<span class="outer-operator">
         ${
           sign3 ===
           1
             ? "＋"
             : "－"
         }
       </span>` +

      `${bracket(
        third
      )}`,

      answer,

      makeDetail({

        method:
          "三個多項式不要急著直接算；先逐一處理括號前的正負號，再統一分類同類項。",

        steps:
          [

            `第一個括號直接保留；第二個括號前是 ${
              sign2 ===
              1
                ? "加號，所以符號不變"
                : "減號，所以每一項變號"
            }；第三個括號前是 ${
              sign3 ===
              1
                ? "加號，所以符號不變"
                : "減號，所以每一項變號"
            }。`,

            `去括號後，已完成變號的括號全部移除：
             <span class="explanation-math">
               ${
                 expandedPolynomialsHTML(
                   items
                 )
               }
             </span>`,

            `依 x²、x、常數項分類後計算：
             <span class="explanation-math">
               ${
                 groupsHTML(
                   items,
                   2
                 )
               }
             </span>`,

            `完成係數計算後，按照 x²、x、常數項的順序整理。`
          ],

        pitfall:
          "每個括號都要看「括號前」的符號；不要把前一個括號的符號錯套到下一個括號。",

        summary:
          `最後答案：${polynomialHTML(
            answer
          )}`
      }),

      "請完成三個多項式的綜合加減"
    );
  }
}

function makeChoice() {

      randomIntegerPolynomial(

          maxDegree:
            2,

          minTerms:
            3,

          maxTerms:
            3
        }
      );

    const correctAnswer =
      subtract(
        first,
        second
      );

    const wrong1 =
      add(
        first,
        second
      );

    const secondWrong2 =
      second.map(
        (
          term,
          termIndex
        ) => ({

          exponent:
            term.exponent,

          coefficient:
            termIndex ===
            0

              ? multiplyFraction(
                  fractionCoefficient(
                    term.coefficient
                  ),
                  -1
                )

              : term.coefficient
        })
      );

    const wrong2 =
      add(
        first,
        secondWrong2
      );

    const secondWrong3 =
      second.map(
        (
          term,
          termIndex
        ) => ({

          exponent:
            term.exponent,

          coefficient:
            termIndex ===
            second.length -
            1

              ? multiplyFraction(
                  fractionCoefficient(
                    term.coefficient
                  ),
                  -1
                )

              : term.coefficient
        })
      );

    const wrong3 =
      add(
        first,
        secondWrong3
      );

    const texts =
      [
        polynomialHTML(
          correctAnswer
        ),

        polynomialHTML(
          wrong1
        ),

        polynomialHTML(
          wrong2
        ),

        polynomialHTML(
          wrong3
        )
      ];

    if (
      new Set(
        texts
      ).size !==
      4
    ) {

      continue;
    }

    const items =
      [
        {
          sign:
            1,

          terms:
            first
        },

        {
          sign:
            -1,

          terms:
            second
        }
      ];

    return choiceQuestion(

      `${bracket(
        first
      )}` +

      `<span class="outer-operator">
         －
       </span>` +

      `${bracket(
        second
      )}` +

      `<span class="outer-operator">
         ＝？
       </span>`,

      shuffle(
        [
          {
            value:
              "correct",

            text:
              texts[
                0
              ]
          },

          {
            value:
              "wrong1",

            text:
              texts[
                1
              ]
          },

          {
            value:
              "wrong2",

            text:
              texts[
                2
              ]
          },

          {
            value:
              "wrong3",

            text:
              texts[
                3
              ]
          }
        ]
      ),

      "correct",

      makeDetail({

        method:
          "看到「前式－後式」時，先把後式每一項全部變號，再和前式合併。",

        steps:
          [

            `第二個括號前是減號，所以整個第二個多項式每一項都變號；變號後移除括號：
             <span class="explanation-math">
               ${
                 expandedPolynomialsHTML(
                   items
                 )
               }
             </span>`,

            `依 x²、x、常數項分類：
             <span class="explanation-math">
               ${
                 groupsHTML(
                   items,
                   2
                 )
               }
             </span>`,

            `比較選項，只有完整做到「每一項都變號」且合併正確的結果才是答案。`
          ],

        pitfall:
          "錯誤選項通常故意設計成：完全沒變號、只變第一項、或只變最後一項。",

        summary:
          `正確答案：${texts[0]}`
      }),

      "請選出正確的計算結果"
    );
  }
}

/*
==================================================
模式四｜分數係數
==================================================
*/

function makeFractionQuestion() {

  while (
    true
  ) {

    const first =
      randomFractionPolynomial();

    const second =
      randomFractionPolynomial();

    const operation =
      pick(
        [
          "add",
          "subtract"
        ]
      );

    const sign =
      operation ===
      "add"
        ? 1
        : -1;

    const answer =
      operation ===
      "add"

        ? add(
            first,
            second
          )

        : subtract(
            first,
            second
          );

    if (
      !answer.length ||
      !answer.some(
        term =>
          fractionCoefficient(
            term.coefficient
          )
            .denominator !==
          1
      )
    ) {

      continue;
    }

    const items =
      [
        {
          sign:
            1,

          terms:
            first
        },

        {
          sign,

          terms:
            second
        }
      ];

    return polynomialQuestion(

      `${bracket(
        first
      )}` +

      `<span class="outer-operator">
         ${
           operation ===
           "add"
             ? "＋"
             : "－"
         }
       </span>` +

      `${bracket(
        second
      )}`,

      answer,

      makeDetail({

        method:
          "分數係數題和整數題完全同一套流程，只是「係數運算」要先通分，最後再約分。",

        steps:
          [

            operation ===
            "subtract"

              ? `先把第二個多項式每一項變號；變號後括號移除：
                 <span class="explanation-math">
                   ${
                     expandedPolynomialsHTML(
                       items
                     )
                   }
                 </span>`

              : `括號前是加號，第二個多項式符號不變；去掉括號後：
                 <span class="explanation-math">
                   ${
                     expandedPolynomialsHTML(
                       items
                     )
                   }
                 </span>`,

            `依 x²、x、常數項分類。
             <span class="explanation-math">
               ${
                 groupsHTML(
                   items,
                   2
                 )
               }
             </span>`,

            `同類項的分數係數先找公分母，再做加減；計算後一定約成最簡分數。`,

            `整理為降冪排列的完整多項式。`
          ],

        pitfall:
          "分數相加減不能直接「分子加分子、分母加分母」；一定要先通分。",

        summary:
          `最後答案：${polynomialHTML(
            answer
          )}`
      }),

      "請計算，分數係數最後要化成最簡分數",

      true
    );
  }
}

/*
==================================================
模式四｜四個多項式
==================================================
*/

function makeFour() {

  while (
    true
  ) {

    const items =
      [];

    for (
      let i =
        0;
      i <
        4;
      i++
    ) {

      items.push(
        {

          sign:
            i ===
            0

              ? 1

              : pick(
                  [
                    1,
                    -1
                  ]
                ),

          terms:
            randomIntegerPolynomial(
              {

                maxDegree:
                  3,

                minTerms:
                  2,

                maxTerms:
                  3,

                min:
                  -5,

                max:
                  5
              }
            )
        }
      );
    }

    const answer =
      combine(
        items
      );

    if (
      !answer.length
    ) {

      continue;
    }

    const html =
      items
        .map(
          (
            item,
            itemIndex
          ) => {

            if (
              itemIndex ===
              0
            ) {

              return bracket(
                item.terms
              );
            }

            return (

              `<span class="outer-operator">
                 ${
                   item.sign ===
                   1
                     ? "＋"
                     : "－"
                 }
               </span>` +

              `${bracket(
                item.terms
              )}`
            );
          }
        )
        .join("");

    return polynomialQuestion(

      html,

      answer,

      makeDetail({

        method:
          "四個多項式看起來長，但不要同時處理。照順序先處理每個括號前的符號，再一次分類。",

        steps:
          [

            `逐一處理每個括號前的符號，變號完成後移除所有括號：
             <span class="explanation-math">
               ${
                 expandedPolynomialsHTML(
                   items
                 )
               }
             </span>`,

            `依 x³、x²、x、常數項分類：
             <span class="explanation-math">
               ${
                 groupsHTML(
                   items,
                   3
                 )
               }
             </span>`,

            `逐類完成係數加減，不同次方絕對不要混在一起。`,

            `最後按 x³、x²、x、常數項的順序整理。`
          ],

        pitfall:
          "式子越長越容易漏掉某一項；建議去括號後逐項核對，再開始合併。",

        summary:
          `最後答案：${polynomialHTML(
            answer
          )}`
      }),

      "請完成四個多項式的綜合加減"
    );
  }
}

四個模式
==================================================
*/

function makeMode1() {

  return Array.from(
    {
      length:
        TOTAL_QUESTIONS
    },
    () =>
      makeLikeQuestion()
  );
}

function makeMode2() {

  return shuffle(
    [
      "add",
      "add",
      "add",
      "add",

      "subtract",
      "subtract",
      "subtract",
      "subtract",

      "missingAdd",
      "missingSubtract"
    ]
  )
    .map(
      type => {

        if (
          type ===
          "add"
        ) {

          return makeTwoPolynomial(
            "add"
          );
        }

        if (
          type ===
          "subtract"
        ) {

          return makeTwoPolynomial(
            "subtract"
          );
        }

        if (
          type ===
          "missingAdd"
        ) {

          return makeTwoPolynomial(
            "add",
            true
          );
        }

        return makeTwoPolynomial(
          "subtract",
          true
        );
      }
    );
}

function makeMode3() {

  return shuffle(
    [
      makeLikeQuestion(),
      makeLikeQuestion(),

      makeTwoPolynomial(
        "add"
      ),

      makeTwoPolynomial(
        "add"
      ),

      makeTwoPolynomial(
        "subtract"
      ),

      makeTwoPolynomial(
        "subtract"
      ),

      makeTriple(),
      makeTriple(),
      makeTriple(),

      makeChoice()
    ]
  );
}

function makeMode4() {

  return shuffle(
    [
      makeAdvancedInteger(),
      makeAdvancedInteger(),

      makeLeadingNegative(),
      makeLeadingNegative(),

      makeFractionQuestion(),
      makeFractionQuestion(),
      makeFractionQuestion(),

      makeFour(),
      makeFour(),

      makeChoice()
    ]
  );
}

function createQuestions() {

  if (
    mode ===
    "likeTerms"
  ) {

    return makeMode1();
  }

  if (
    mode ===
    "addSubtract"
  ) {

    return makeMode2();
  }

  if (
    mode ===
    "mixed"
  ) {

    return makeMode3();
  }

  return makeMode4();
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );

  const remain =
    seconds %
    60;

  return (
    `${String(
      minutes
    )
      .padStart(
        2,
        "0"
      )}:` +

    `${String(
      remain
    )
      .padStart(
        2,
        "0"
      )}`
  );
}

function stopTimer() {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );

    timerId =
      null;
  }

  if (
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}

function startTimer() {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );
  }

  startTime =
    Date.now();

  elapsed =
    0;

  $(
    "timer-display"
  )
    .textContent =
      "00:00";

  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );

        $(
          "timer-display"
        )
          .textContent =
            formatTime(
              elapsed
            );
      },
      500
    );
}

function renderAnswer(
  question
) {

  selectedChoice =
    null;

  answerInput =
    null;

  const panel =
    $(
      "answer-panel"
    );

  if (
    question.type ===
    "polynomial"
  ) {

    panel.innerHTML = `

      <div class="answer-title">
        ${question.label}
      </div>

      <p class="answer-help">
        請像紙本作答一樣，
        將最後答案整理成降冪排列的完整多項式。

        ${
          question.fraction
            ? "<br>分數係數請以上下分子、分母的格式輸入，並自行約成最簡分數。"
            : ""
        }
      </p>

      <div class="polynomial-answer-shell">

        <div
          id="polynomial-answer-mount"
        ></div>

      </div>
    `;

    if (
      typeof window.ExpressionInput !==
      "function"
    ) {

      $(
        "feedback"
      )
        .className =
          "feedback warning";

      $(
        "feedback"
      )
        .textContent =
          "ExpressionInput 共用元件沒有正常載入。";

      return;
    }

    answerInput =
      new window.ExpressionInput(
        {

          mountId:
            "polynomial-answer-mount",

          allowNumber:
            false,

          allowExpression:
            false,

          allowPolynomial:
            true,

          defaultMode:
            "polynomial",

          polynomialVariable:
            "x",

          polynomialExponentOptions:
            [
              3,
              2,
              1,
              0
            ],

          maxPolynomialTerms:
            4,

          allowNegativePolynomialCoefficient:
            true,

          allowZeroPolynomialCoefficient:
            false,

          allowFractionPolynomialCoefficient:
            Boolean(
              question.fraction
            ),

          requireSimplifiedFraction:
            true,

          requireDescendingPowers:
            true,

          disallowDuplicatePowers:
            true,

          omitPolynomialCoefficientOne:
            true,

          theme: {

            primary:
              "#00897b",

            light:
              "#e0f2f1",

            border:
              "#80cbc4"
          },

          labels: {

            polynomialLabel:
              question.fraction
                ? "請輸入含分數係數的多項式"
                : "請輸入最後整理後的多項式",

            polynomialCoefficientLabel:
              question.fraction
                ? "輸入這一項的分數係數"
                : "輸入這一項的係數",

            polynomialExponentLabel:
              "選擇這一項",

            polynomialSignLabel:
              "正負號",

            polynomialEditLabel:
              "編輯答案",

            numeratorLabel:
              "分子",

            denominatorLabel:
              "分母"
          }
        }
      );

    setTimeout(
      () =>
        answerInput
          ?.focus(),
      0
    );

    return;
  }

  panel.innerHTML = `

    <div class="answer-title">
      ${question.label}
    </div>

    <div class="choice-grid">

      ${
        question.choices
          .map(
            choice => `

              <button
                type="button"
                class="choice-button"
                data-choice="${choice.value}"
              >

                ${choice.text}

              </button>
            `
          )
          .join("")
      }

    </div>
  `;

  panel
    .querySelectorAll(
      ".choice-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectedChoice =
              button.dataset.choice;

            panel
              .querySelectorAll(
                ".choice-button"
              )
              .forEach(
                item =>
                  item
                    .classList
                    .remove(
                      "selected"
                    )
              );

            button
              .classList
              .add(
                "selected"
              );
          }
        );
      }
    );
}

  $(
    "explanation"
  )
    .innerHTML =
      "";

  $(
    "explanation"
  )
    .classList
    .add(
      "hidden"
    );

  $(
    "submit-button"
  )
    .classList
    .remove(
      "hidden"
    );

  $(
    "next-button"
  )
    .classList
    .add(
      "hidden"
    );

  renderAnswer(
    question
  );

  window
    .resetGameScratchpad
    ?.();
}

function readAnswer(
  question
) {

  if (
    question.type ===
    "polynomial"
  ) {

    if (
      !answerInput
    ) {

      return {

        valid:
          false,

        message:
          "多項式輸入器尚未準備完成。"
      };
    }

    const result =
      answerInput.validate();

    if (
      !result.valid
    ) {

      return {

        valid:
          false,

        message:
          result.message ||
          "請將多項式答案輸入完整。"
      };
    }

    return {

      valid:
        true,

      value:
        result.value.fractionTerms,

      display:
        result.value.html
    };
  }

  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }

  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );

  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}

function samePolynomial(
  first,
  second
) {

  const a =
    normalize(
      first
    );

  const b =
    normalize(
      second
    );

  if (
    a.length !==
    b.length
  ) {

    return false;
  }

  return a.every(
    (
      term,
      termIndex
    ) => {

      const other =
        b[
          termIndex
        ];

      const firstFraction =
        fractionCoefficient(
          term.coefficient
        );

      const secondFraction =
        fractionCoefficient(
          other.coefficient
        );

      return (

        term.exponent ===
          other.exponent &&

        firstFraction.numerator ===
          secondFraction.numerator &&

        firstFraction.denominator ===
          secondFraction.denominator
      );
    }
  );
}

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "polynomial"
  ) {

    return samePolynomial(
      answer.value,
      question.answer
    );
  }

  return (
    answer.value ===
    question.answer
  );
}

function correctAnswerHTML(
  question
) {

  if (
    question.type ===
    "polynomial"
  ) {

    return polynomialHTML(
      question.answer
    );
  }

  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          question.answer
      );

  return (
    choice?.text ||
    ""
  );
}

function explanationHTML(
  question
) {

  const detail =
    question.detail ||
    {};

  return `

    <div class="explanation-heading">
      📘 完整詳解
    </div>

    <div class="explanation-question">

      <div class="explanation-question-title">
        題目
      </div>

      <div class="explanation-question-math">
        ${question.html}
      </div>

    </div>

    ${
      detail.method

        ? `
          <div class="explanation-method">

            <strong>
              先想一想｜
            </strong>

            ${detail.method}

          </div>
        `

        : ""
    }

    ${
      (
        detail.steps ||
        []
      )
        .map(
          (
            step,
            stepIndex
          ) => `

            <div class="explanation-step">

              <span class="explanation-step-title">

                步驟 ${stepIndex + 1}｜

              </span>

              ${step}

            </div>
          `
        )
        .join("")
    }

    ${
      detail.pitfall

        ? `
          <div class="explanation-tip">

            <strong>
              ⚠️ 常見錯誤｜
            </strong>

            ${detail.pitfall}

          </div>
        `

        : ""
    }

    ${
      detail.summary

        ? `
          <div class="explanation-summary">
            ✅ ${detail.summary}
          </div>
        `

        : ""
    }
  `;
}

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }

  const question =
    questions[
      index
    ];

  const answer =
    readAnswer(
      question
    );

  if (
    !answer.valid
  ) {

    $(
      "feedback"
    )
      .className =
        "feedback warning";

    $(
      "feedback"
    )
      .textContent =
        answer.message;

    return;
  }

  answered =
    true;

  answerInput
    ?.setDisabled(
      true
    );

  const isCorrect =
    checkCorrect(
      question,
      answer
    );

  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );

    $(
      "feedback"
    )
      .className =
        "feedback correct";

    $(
      "feedback"
    )
      .textContent =
        "✨ 回答正確！";

    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;

    $(
      "feedback"
    )
      .className =
        "feedback wrong";

    $(
      "feedback"
    )
      .innerHTML = `
        ❌ 答案不正確。正確答案：
        <strong>
          ${correctAnswerHTML(
            question
          )}
        </strong>
      `;

    playGameSound(
      "playWrong"
    );
  }

  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );

  $(
    "correct-count"
  )
    .textContent =
      correct;

  $(
    "combo-count"
  )
    .textContent =
      maxCombo;

  $(
    "explanation"
  )
    .innerHTML =
      explanationHTML(
        question
      );

  $(
    "explanation"
  )
    .classList
    .remove(
      "hidden"
    );

  $(
    "submit-button"
  )
    .classList
    .add(
      "hidden"
    );

  $(
    "next-button"
  )
    .classList
    .remove(
      "hidden"
    );

  $(
    "next-button"
  )
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";

  $(
    "next-button"
  )
    .focus();
}

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }

  index++;

  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}

function startGame(
  selectedMode
) {

  stopTimer();

  mode =
    selectedMode;

  questions =
    createQuestions();

  index =
    0;

  correct =
    0;

  wrong =
    0;

  combo =
    0;

  maxCombo =
    0;

  records =
    [];

  answered =
    false;

  selectedChoice =
    null;

  answerInput =
    null;

  scoreSaved =
    false;

  elapsed =
    0;

  $(
    "timer-display"
  )
    .textContent =
      "00:00";

  $(
    "save-status"
  )
    .textContent =
      "";

  showOnly(
    "quiz-screen"
  );

  displayQuestion();

  startTimer();

  playGameSound(
    "playStart"
  );
}

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理多項式的加減與同類項。"
    };
  }

  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意減號進括號與同類項的符號。"
    };
  }

  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再加強同類項合併與去括號。"
    };
  }

  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從模式一重新練習同類項，再進入多項式加減。"
  };
}

async function showResult() {

  stopTimer();

  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );

  const result =
    rating(
      score
    );

  showOnly(
    "result-screen"
  );

  $(
    "final-score"
  )
    .textContent =
      `${score} 分`;

  $(
    "final-stars"
  )
    .textContent =
      result.stars;

  $(
    "final-comment"
  )
    .textContent =
      result.comment;

  $(
    "final-correct"
  )
    .textContent =
      correct;

  $(
    "final-wrong"
  )
    .textContent =
      wrong;

  $(
    "final-combo"
  )
    .textContent =
      maxCombo;

  $(
    "final-time"
  )
    .textContent =
      formatTime(
        elapsed
      );

  $(
    "review-button"
  )
    .disabled =
      wrong ===
      0;

  $(
    "review-button"
  )
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";

  await saveCurrentScore(
    score
  );
}

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }

  scoreSaved =
    true;

  const status =
    $(
      "save-status"
    );

  status.textContent =
    "☁️ 正在儲存本次成績……";

  status.style.color =
    "#1d4ed8";

  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );

    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";

      status.style.color =
        "#15803d";

      return;
    }

    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";

      status.style.color =
        "#b45309";

      return;
    }

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "多項式加減成績儲存失敗：",
      error
    );

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";
  }
}

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );

  $(
    "review-list"
  )
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">
                    第 ${record.number} 題 ❌
                  </div>

                  <div class="review-question">
                    ${record.question.html}
                  </div>

                  <div class="review-answer">
                    你的答案：
                    <strong>
                      ${record.userAnswer}
                    </strong>
                  </div>

                  <div class="review-answer">
                    正確答案：
                    <strong>
                      ${correctAnswerHTML(
                        record.question
                      )}
                    </strong>
                  </div>

                  <div class="explanation">
                    ${explanationHTML(
                      record.question
                    )}
                  </div>

                </article>
              `
            )
            .join("")

        : `
            <div class="review-card">
              全部答對，沒有需要回顧的錯題！
            </div>
          `;

  showOnly(
    "review-screen"
  );
}

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          startGame(
            button.dataset.mode
          );
        }
      );
    }
  );

$(
  "submit-button"
)
  .addEventListener(
    "click",
    submitAnswer
  );

$(
  "next-button"
)
  .addEventListener(
    "click",
    nextQuestion
  );

$(
  "restart-button"
)
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$(
  "mode-button"
)
  .addEventListener(
    "click",
    () => {

      stopTimer();

      showOnly(
        "start-screen"
      );
    }
  );

$(
  "again-button"
)
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$(
  "result-mode-button"
)
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );

$(
  "review-button"
)
  .addEventListener(
    "click",
    showReview
  );

$(
  "review-again-button"
)
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$(
  "review-result-button"
)
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }

      if (
        $(
          "quiz-screen"
        )
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }

      event.preventDefault();

      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();

      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );

showOnly(
  "start-screen"
);

</script>

</body>
</html>
