<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-4 指數律大挑戰</title>

  <!-- 瀏覽器分頁小圖示：指 -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c3aed'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='38' font-family='sans-serif' font-weight='700' fill='white'%3E%E6%8C%87%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="../css/scratchpad.css">
  <link rel="stylesheet" href="../css/expression-input.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #7e57c2;
      --primary-dark: #5e35b1;
      --primary-light: #ede7f6;
      --primary-border: #b39ddb;
      --text: #1f2937;
      --muted: #64748b;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --orange: #f57c00;
      --surface: #ffffff;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.13);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg,#f2edff,#fff8e8);
    }

    button, input {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button { touch-action: manipulation; }

    .page-shell {
      width: min(100%, 1020px);
      margin: 0 auto;
    }

    #commonHeaderMount { margin-bottom: 14px; }

    .game-card {
      overflow: hidden;
      border: 1px solid #d8e7f7;
      border-top: 8px solid var(--primary);
      border-radius: 26px;
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
    }

    .game-header {
      padding: 26px 24px 20px;
      text-align: center;
      background: linear-gradient(180deg, var(--primary-light), #fff);
    }

    .game-title {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.35;
    }

    .game-subtitle {
      max-width: 860px;
      margin: 10px auto 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .screen { padding: 24px; }
    .hidden { display: none !important; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .mode-card {
      min-height: 184px;
      padding: 20px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: linear-gradient(180deg, var(--primary-light), #fff);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15,23,42,.11);
      border-color: var(--primary);
    }

    .mode-card h2 {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-size: 21px;
      line-height: 1.45;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--primary-border);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .mode-card.speed {
      border-color: #ffcc80;
      background: linear-gradient(180deg, #fff3e0, #fff);
    }

    .mode-card.speed h2 { color: #e65100; }

    .mode-card.comprehensive {
      border-color: #ffe082;
      background: linear-gradient(180deg, #fff8e1, #fff);
    }

    .mode-card.comprehensive h2 { color: #9a6700; }

    .quiz-topbar {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .status-box {
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 8px;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .status-label {
      color: var(--muted);
      font-size: 13px;
    }

    .status-value {
      margin-top: 4px;
      font-size: 18px;
      line-height: 1.35;
    }

    .timer-danger {
      background: #fee2e2 !important;
      color: #991b1b !important;
      animation: pulse .75s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    .progress-shell {
      height: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #42a5f5);
      transition: width .2s ease;
    }

    .question-card {
      padding: 24px 18px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    .question-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: clamp(16px, 2.1vw, 20px);
      font-weight: 900;
      line-height: 1.65;
    }

    .question-content {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: clamp(22px, 3.4vw, 32px);
      font-weight: 900;
      line-height: 1.6;
      overflow-x: auto;
    }

    .math-expression {
      white-space: normal;
      letter-spacing: .02em;
    }

    .math-expression sup {
      font-size: .6em;
      vertical-align: super;
    }

    .mini-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .scratchpad-row {
      display: flex;
      justify-content: center;
      margin: 14px 0 2px;
      min-height: 46px;
    }


    #scratchpad-mobile-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #scratchpad-mobile-button .scratchpad-open-button {
      position: static !important;
      inset: auto !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .22);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    #scratchpad-mobile-button .scratchpad-open-button[hidden] {
      display: none !important;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      background: #f8fbff;
    }

    .answer-title {
      margin-bottom: 12px;
      text-align: center;
      color: var(--primary-dark);
      font-weight: 900;
    }

    .choice-grid {
      display: grid;
      grid-template-columns:
        repeat(
          var(--choice-count, 3),
          minmax(0, 1fr)
        );
      gap: 12px;
      width: 100%;
      align-items: stretch;
    }

    .choice-button {
      min-width: 0;
      min-height: 68px;
      padding: 12px 8px;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      background: #fff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: .14s ease;
    }

    .choice-button:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .choice-button.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .choice-button.correct-choice {
      border-color: #22c55e !important;
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .choice-button.wrong-choice {
      border-color: #ef4444 !important;
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .number-wrap {
      display: flex;
      justify-content: center;
    }

    .number-input {
      width: min(100%, 360px);
      min-height: 58px;
      padding: 10px 16px;
      border: 2px solid var(--primary-border);
      border-radius: 15px;
      background: #fff;
      color: #0f172a;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      outline: none;
    }

    .number-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21,101,192,.10);
    }


    .fraction-answer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .fraction-sign {
      min-width: 64px;
      height: 50px;
      padding: 0 10px;
      border: 2px solid #94a3b8;
      border-radius: 14px;
      background: #fff;
      color: #0f172a;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .fraction-entry {
      display: grid;
      grid-template-rows: 48px 3px 48px;
      width: 108px;
      align-items: center;
      justify-items: stretch;
    }

    .fraction-entry input {
      width: 100%;
      height: 48px;
      padding: 4px 8px;
      border: 2px solid #94a3b8;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font-size: 23px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .fraction-entry input:focus,
    .fraction-sign:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21,101,192,.10);
    }

    .fraction-bar {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: #0f172a;
    }

    .fraction-answer-hint {
      width: 100%;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }

    .input-message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--danger);
      text-align: center;
      font-weight: 800;
    }


    .system-read-row {
      margin-top: 10px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      color: #64748b;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.55;
      text-align: center;
    }

    .system-read-row.hidden {
      display: none !important;
    }

    .system-read-label {
      color: #64748b;
      font-weight: 800;
    }

    .system-read-value {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      color: #475569;
      font-size: 17px;
      font-weight: 900;
    }

    .system-read-row.warning .system-read-value {
      color: #b45309;
      font-size: 14px;
    }

    .feedback {
      min-height: 48px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.55;
    }

    .feedback:empty {
      min-height: 0;
      padding: 0;
      margin-top: 0;
    }

    .feedback.correct {
      background: #dcfce7;
      color: #166534;
    }

    .feedback.wrong {
      background: #fee2e2;
      color: #991b1b;
    }

    .explanation {
      margin-top: 14px;
      padding: 18px;
      border-left: 6px solid var(--primary);
      border-radius: 14px;
      background: #f8fafc;
      color: #334155;
      line-height: 1.85;
      font-size: 16px;
    }

    .explanation strong {
      color: #0f172a;
    }

    .rule-box,
    .calculation-box,
    .decision-box {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .rule-box {
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
    }

    .calculation-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }

    .decision-box {
      background: #fff7ed;
      border: 1px solid #fdba74;
    }

    /* ==================================================
       初學者完整詳解
       版面比照既有多項式遊戲：
       題目 → 先想一想 → 步驟 → 常見提醒 → 最後答案
       ================================================== */
    .explanation-heading{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 12px;
      color:var(--primary-dark);
      font-size:20px;
      font-weight:900;
    }

    .explanation-question{
      margin-bottom:12px;
      padding:12px 14px;
      border:1px solid #dbeafe;
      border-radius:12px;
      background:#fff;
    }

    .explanation-question-title{
      margin-bottom:6px;
      color:#475569;
      font-weight:900;
    }

    .explanation-question-math{
      overflow-x:auto;
      color:#0f172a;
      font-size:20px;
      font-weight:900;
      line-height:1.8;
    }

    .explanation-method{
      margin-bottom:12px;
      padding:12px 14px;
      border:1px solid #fed7aa;
      border-radius:12px;
      background:#fff7ed;
      line-height:1.8;
    }

    .explanation-method strong{
      color:#c2410c;
    }

    .explanation-step{
      margin:10px 0;
      padding:12px 14px;
      border-left:4px solid var(--primary);
      border-radius:12px;
      background:#fff;
      line-height:1.9;
    }

    .explanation-step-title{
      display:block;
      margin-bottom:5px;
      color:var(--primary-dark);
      font-weight:900;
    }

    .explanation-tip{
      margin-top:12px;
      padding:12px 14px;
      border:1px solid #fecdd3;
      border-radius:12px;
      background:#fff1f2;
      color:#9f1239;
      line-height:1.8;
    }

    .explanation-tip strong{
      color:#be123c;
    }

    .explanation-summary{
      margin-top:12px;
      padding:13px 14px;
      border:1px solid #bbf7d0;
      border-radius:12px;
      background:#ecfdf5;
      color:#166534;
      font-weight:900;
      line-height:1.8;
    }

    .reduction-work{
      display:inline-flex;
      align-items:center;
      gap:.28em;
      flex-wrap:wrap;
      vertical-align:middle;
    }

    .simplest-warning{
      font-weight:900;
      color:#b45309;
    }

    .factor-line {
      margin: 6px 0;
      font-weight: 800;
    }

    /*
    ==================================================
    標準分解式比較表
    ==================================================
    */
    .short-division {
      width: min(100%, 660px);
      margin: 12px auto;
      border-collapse: collapse;
      background: #fff;
      font-size: 15px;
    }

    .short-division th,
    .short-division td {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      text-align: center;
    }

    .short-division th {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    /*
    ==================================================
    課本式短除法
    左側：共同除數
    右側：被除數／商逐層往下寫
    ==================================================
    */
    .textbook-division-wrap {
      width: 100%;
      margin: 14px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .textbook-division {
      width: max-content;
      min-width: 300px;
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      color: #0f172a;
      font-size: clamp(17px, 2.4vw, 22px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .textbook-division td {
      min-width: 64px;
      padding: 7px 13px;
      text-align: center;
      white-space: nowrap;
    }

    .textbook-division .division-divisor {
      min-width: 46px;
      padding-left: 6px;
      padding-right: 10px;
      color: var(--primary-dark);
      text-align: right;
      border-right: 3px solid #334155;
    }

    .textbook-division .division-divisor.blank {
      color: transparent;
      border-right-color: transparent;
    }

    .textbook-division tr.division-step td.division-number {
      border-bottom: 3px solid #334155;
    }

    .textbook-division tr.division-final td.division-number {
      padding-top: 9px;
      color: #7c2d12;
    }

    .textbook-division-caption {
      margin: 8px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .division-step-list {
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #dbeafe;
    }

    .division-step-item {
      padding: 7px 0;
      border-bottom: 1px dashed #cbd5e1;
      line-height: 1.75;
    }

    .division-step-item:last-child {
      border-bottom: 0;
    }

    .division-step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      margin-right: 7px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 1000;
    }

    .division-carry {
      color: #b45309;
      font-weight: 1000;
    }

    .division-stop {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      color: #166534;
      font-weight: 800;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .textbook-division td {
        min-width: 52px;
        padding: 6px 9px;
      }

      .textbook-division .division-divisor {
        min-width: 40px;
      }
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .game-button {
      min-height: 48px;
      padding: 10px 18px;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(21,101,192,.2);
    }

    .game-button.secondary { background: #64748b; }
    .game-button.orange { background: var(--orange); }
    .game-button.restart { background: #16a34a; }

    .game-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result-card {
      text-align: center;
    }

    .result-card h2 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .result-score {
      margin: 10px 0 4px;
      color: var(--primary-dark);
      font-size: clamp(40px, 8vw, 66px);
      font-weight: 1000;
    }

    .result-stars {
      font-size: 28px;
      letter-spacing: 3px;
    }

    .result-comment {
      max-width: 720px;
      margin: 12px auto;
      color: var(--muted);
      line-height: 1.75;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .result-item {
      padding: 14px 8px;
      border-radius: 14px;
      background: var(--primary-light);
    }

    .result-item .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .result-item .value {
      display: block;
      margin-top: 5px;
      color: var(--primary-dark);
      font-size: 24px;
      font-weight: 1000;
    }

    .save-status {
      min-height: 24px;
      margin: 10px 0 0;
      font-weight: 800;
    }

    .review-list {
      display: grid;
      gap: 16px;
    }

    .review-card {
      padding: 16px;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      background: #fff;
    }

    .review-title {
      margin-bottom: 10px;
      color: var(--danger);
      font-weight: 1000;
    }

    .review-question {
      font-weight: 800;
      line-height: 1.7;
    }

    .review-answer {
      margin: 10px 0;
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .screen { padding: 16px; }
      .game-header { padding: 22px 16px 16px; }
      .mode-grid { grid-template-columns: 1fr; }
      .quiz-topbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .choice-grid {
        gap: 8px;
      }
      .choice-button {
        min-height: 60px;
        padding: 10px 5px;
        font-size: 15px;
      }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question-card { padding: 20px 12px; }
    }

    @media (max-width: 420px) {
      .status-value { font-size: 16px; }

<script type="module">

"use strict";
/* 2-4 指數律｜同步修正版
   GAME_ID 保留 exponent，直接升級既有七上指數遊戲。
   題目只用具體數字，不出負整數指數；0 次方僅使用非 0 底數。
   共通規格：計算紙、負數以括號呈現、分數使用分子／分母答案格、重新測驗、系統判定。 */
const GAME_ID="exponent";
const CHAPTER="2-4";
const GAME_TITLE="2-4 指數律大挑戰";
const MODE_CONFIG={
  fractionPower:{name:"🔢 分數次方與正負號",count:10,difficultyWeight:1.02},
  sameBaseMultiply:{name:"✖️ 同底數相乘",count:10,difficultyWeight:1.08},
  sameBaseDivide:{name:"➗ 同底數相除與零次方",count:10,difficultyWeight:1.12},
  powerOfPower:{name:"🔁 冪的乘方",count:10,difficultyWeight:1.16},
  powerOfProduct:{name:"🧩 積的乘方與分數次方",count:10,difficultyWeight:1.22},
  speed:{name:"⚡ 指數律快手",seconds:60,difficultyWeight:1.12},
  comprehensive:{name:"🏆 2-4 綜合挑戰",count:10,difficultyWeight:1.34}
};

function igcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function R(n,d=1){if(!d)throw new Error("分母不可為 0");if(d<0){n=-n;d=-d}const g=igcd(n,d);return {n:n/g,d:d/g}}
function ratEq(a,b){return !!a&&!!b&&a.n===b.n&&a.d===b.d}
function ratHTML(x){
  const a=R(x.n,x.d);if(a.d===1)return String(a.n).replace("-","−");
  const sign=a.n<0?"−":"",n=Math.abs(a.n);
  return `${sign}<span class="math-frac"><span class="top">${n}</span><span class="bottom">${a.d}</span></span>`;
}

/*
==================================================
保留學生原始分子／分母的分數顯示

用途：
1. 系統判讀顯示學生實際輸入的答案
2. 送出答案前不先自動約分
3. 與 2-3 共用相同規則
==================================================
*/
function rawFracHTML(n,d){
  if(d<0){
    n=-n;
    d=-d;
  }

  if(d===1){
    return String(n).replace("-","−");
  }

  const sign=
    n<0
      ? "−"
      : "";

  return `${sign}<span class="math-frac"><span class="top">${Math.abs(n)}</span><span class="bottom">${d}</span></span>`;
}
function mathGroupHTML(content,level=1){
  if(level<=1)return `(${content})`;
  if(level===2)return `[${content}]`;
  return `{${content}}`;
}
function operandRatHTML(x){
  const a=R(x.n,x.d),html=ratHTML(a);
  return a.n<0?mathGroupHTML(html,1):html;
}
function signedIntHTML(n){
  const html=String(n).replace("-","−");
  return Number(n)<0?`(${html})`:html;
}
function parseRational(raw){
  let s=String(raw).trim().replace(/[−–—]/g,"-").replace(/\s+/g," ");
  let m=s.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){const w=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(!d)return {ok:false};const sg=w<0?-1:1,rawN=sg*(Math.abs(w)*d+n);return {ok:true,value:R(rawN,d),simple:igcd(rawN,d)===1}}
  m=s.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
  if(m){const n=Number(m[1]),d=Number(m[2]);if(!d)return {ok:false};return {ok:true,value:R(n,d),simple:igcd(n,d)===1}}
  if(/^[+-]?\d+$/.test(s))return {ok:true,value:R(Number(s),1),simple:true};
  return {ok:false};
}
function ipow(a,n){let v=1;for(let i=0;i<n;i++)v*=a;return v}
function rpow(a,n){return R(ipow(a.n,n),ipow(a.d,n))}
function sup(n){return `<span class="math-sup">${n}</span>`}
function intBaseHTML(b){return b<0?mathGroupHTML(String(b).replace("-","−"),1):String(b)}
function pInt(b,e){
  return `${intBaseHTML(b)}${sup(e)}`;
}

/*
==================================================
題目專用指數顯示

1 次方在題目中省略：
10¹ → 10
(-2)¹ → (-2)

詳解仍使用 pInt() 明確寫出 1 次方。
==================================================
*/
function pIntQuestion(b,e){
  return e===1
    ? intBaseHTML(b)
    : pInt(b,e);
}

/*
==================================================
題目中的「冪的乘方」括號層級

若底數本身因負數已使用 ( )，
外層群組就使用 [ ]。

例：
[(-2)³]⁴
==================================================
*/
function groupedPowerQuestionHTML(b,e){
  const content=
    pIntQuestion(
      b,
      e
    );

  const level=
    b<0
      ? 2
      : 1;

  return mathGroupHTML(
    content,
    level
  );
}

function groupedPowerHTML(b,e){
  const level=b<0?2:1;
  return mathGroupHTML(
    pInt(b,e),
    level
  );
}

/*
==================================================
1 次方提示

題目中省略 ^1，
詳解要讓學生知道省略的指數就是 1。
==================================================
*/
function implicitExponentOneNote(terms){
  const seen=
    new Set();

  const notes=[];

  terms.forEach(
    ([base,exponent])=>{
      if(exponent!==1){
        return;
      }

      const key=
        String(base);

      if(seen.has(key)){
        return;
      }

      seen.add(key);

      notes.push(
        `${intBaseHTML(base)} 沒有標出指數時，表示 ${pInt(base,1)}（1 次方）`
      );
    }
  );

  return notes.length
    ? `題目中 ${notes.join("；")}。`
    : "";
}
function pRat(a,e){return `${mathGroupHTML(ratHTML(a),1)}${sup(e)}`}
function calcBox(rule,lines,answer,pitfall=""){
  return `
    <div class="explanation-method">
      <strong>先想一想｜</strong>
      ${rule}
    </div>

    ${lines.map((line,index)=>`
      <div class="explanation-step">
        <span class="explanation-step-title">
          步驟 ${index+1}｜
        </span>
        ${line}
      </div>
    `).join("")}

    ${pitfall?`
      <div class="explanation-tip">
        <strong>⚠️ 常見提醒｜</strong>
        ${pitfall}
      </div>
    `:""}

    <div class="explanation-summary">
      ✅ 最後答案：${answer}
    </div>
  `;
}

function explanationHTML(q){
  return `
    <div class="explanation-heading">
      📘 完整詳解
    </div>

    <div class="explanation-question">
      <div class="explanation-question-title">
        題目
      </div>
      <div class="explanation-question-math">
        ${q.html}
      </div>
    </div>

    ${q.explanation}
  `;
}

function reductionWorkHTML(rawN,rawD,g){
  if(rawD<0){
    rawN=-rawN;
    rawD=-rawD;
  }

  const sign=rawN<0?"−":"";

  return `
    <span class="reduction-work">
      ${rawFracHTML(rawN,rawD)}
      ＝
      ${sign}<span class="math-frac">
        <span class="top">${Math.abs(rawN)} ÷ ${g}</span>
        <span class="bottom">${rawD} ÷ ${g}</span>
      </span>
      ＝
      ${rawFracHTML(rawN/g,rawD/g)}
    </span>
  `;
}

function reductionDetailLines(rawN,rawD){
  if(rawD<0){
    rawN=-rawN;
    rawD=-rawD;
  }

  const g=igcd(rawN,rawD);

  if(g<=1){
    return [
      `檢查是否還能約分：分子 ${Math.abs(rawN)} 與分母 ${rawD} 的最大公因數是 1，所以 ${rawFracHTML(rawN,rawD)} 已經是最簡分數。`
    ];
  }

  return [
    `檢查是否可以約分：分子 ${Math.abs(rawN)} 與分母 ${rawD} 的最大公因數是 <b>${g}</b>。`,
    `分子、分母同除以 ${g}：${reductionWorkHTML(rawN,rawD,g)}`,
    `因此 ${rawFracHTML(rawN,rawD)} 化成最簡分數後是 <b>${rawFracHTML(rawN/g,rawD/g)}</b>。`
  ];
}
function makeChoiceQ(html,items,correctIndex,explanation,note=""){
  const rows=shuffle(items.map((label,i)=>({label,ok:i===correctIndex})));
  return {kind:"choice",html,choices:rows.map(x=>x.label),answerIndex:rows.findIndex(x=>x.ok),explanation,note};
}
function nonzeroBase(){return pick([-5,-4,-3,-2,2,3,4,5,6,7,10,11])}
function makeFractionPower(){
  const d=pick([3,4,5,6,7]);
  const n=ri(1,d-1);
  const neg=Math.random()<.55;
  const a=R(neg?-n:n,d);
  const e=ri(2,4);
  const ans=rpow(a,e);
  const expanded=
    Array.from(
      {length:e},
      ()=>operandRatHTML(a)
    ).join(" × ");

  const rawN=ipow(a.n,e);
  const rawD=ipow(a.d,e);

  return {
    kind:"rational",
    html:`<div class="math-expr">計算：${pRat(a,e)}</div>`,
    answer:ans,
    explanation:calcBox(
      "分數的次方，就是把同一個分數連乘。先看負號，再分別計算分子的次方與分母的次方，最後檢查是否需要約分。",
      [
        `${pRat(a,e)} 表示 ${expanded}。`,
        a.n<0
          ? `底數是負數，而且指數 ${e} 是${e%2?"奇":"偶"}數，所以結果是${e%2?"負":"正"}數。`
          : `底數是正數，所以結果是正數。`,
        `分子計算：${Math.abs(a.n)}${sup(e)} ＝ ${Math.abs(rawN)}。`,
        `分母計算：${a.d}${sup(e)} ＝ ${rawD}。`,
        `因此先得到 ${rawFracHTML(rawN,rawD)}。`,
        ...reductionDetailLines(rawN,rawD)
      ],
      operandRatHTML(ans),
      "次方要同時作用在分子和分母；若底數是負數，還要先判斷指數的奇偶性。"
    )
  };
}
function makeSignParity(){
  const b=-pick([2,3,4,5,7]),e=ri(2,7),positive=e%2===0;
  return makeChoiceQ(`<div class="math-expr">${pInt(b,e)} 的正負號為何？</div>`,
    ["正數","負數"],positive?0:1,
    calcBox("負數的偶數次方為正數；負數的奇數次方為負數。",[
      `指數 ${e} 是${e%2===0?"偶":"奇"}數，因此 ${pInt(b,e)} 為${positive?"正":"負"}數。`
    ],positive?"正數":"負數"));
}
function makeIndexFirst(){
  const d=pick([2,3,4,5]),n=ri(1,d-1),neg=Math.random()<.35,a=R(neg?-n:n,d),e=ri(2,3),factor=ipow(d,e),p=rpow(a,e),ans=p.n;
  return {kind:"integer",html:`<div class="math-expr">計算：${pRat(a,e)} × ${factor}</div>`,answer:ans,
    explanation:calcBox("算式含有指數時，要先完成次方，再做乘除。",[
      `先算次方：${pRat(a,e)} ＝ ${operandRatHTML(p)}`,
      `${operandRatHTML(p)} × ${factor} ＝ ${signedIntHTML(ans)}`
    ],signedIntHTML(ans))};
}
function makeSameBaseMultiply(){
  const b=
    nonzeroBase();

  const m=
    ri(
      1,
      5
    );

  const n=
    ri(
      1,
      5
    );

  const ans=
    m+n;

  const oneNote=
    implicitExponentOneNote(
      [
        [b,m],
        [b,n]
      ]
    );

  return {
    kind:"integer",
    html:
      `<div class="math-expr">${pIntQuestion(b,m)} × ${pIntQuestion(b,n)} ＝ ${intBaseHTML(b)}<span class="math-sup">□</span><br>□＝？</div>`,
    answer:ans,
    explanation:calcBox(
      "同底數相乘，底數不變，指數相加。",
      [
        oneNote,
        `${pInt(b,m)} × ${pInt(b,n)} ＝ ${intBaseHTML(b)}${sup(`${m}+${n}`)} ＝ ${pInt(b,ans)}。`
      ].filter(Boolean),
      String(ans),
      "同底數相乘是指數相加，不是把底數或指數相乘。"
    )
  };
}
function makeZeroExponent(){
  const b=nonzeroBase();
  return {kind:"integer",html:`<div class="math-expr">計算：${pInt(b,0)}</div>`,answer:1,
    explanation:calcBox("任何非 0 的數的 0 次方都等於 1。",[
      `${intBaseHTML(b)} ≠ 0，所以 ${pInt(b,0)} ＝ 1。`
    ],"1")};
}
function makeSameBaseDivide(){
  if(
    Math.random()<.22
  ){
    return makeZeroExponent();
  }

  const b=
    nonzeroBase();

  const n=
    ri(
      1,
      4
    );

  const m=
    ri(
      n,
      7
    );

  const ans=
    m-n;

  const oneNote=
    implicitExponentOneNote(
      [
        [b,m],
        [b,n]
      ]
    );

  return {
    kind:"integer",
    html:
      `<div class="math-expr">${pIntQuestion(b,m)} ÷ ${pIntQuestion(b,n)} ＝ ${intBaseHTML(b)}<span class="math-sup">□</span><br>□＝？</div>`,
    answer:ans,
    explanation:calcBox(
      "同底數相除，底數不變，前面的指數減後面的指數。",
      [
        oneNote,
        `${pInt(b,m)} ÷ ${pInt(b,n)} ＝ ${intBaseHTML(b)}${sup(`${m}−${n}`)}。`,
        ans===0
          ? `${m} − ${n} ＝ 0，所以 ${pInt(b,0)} ＝ 1。`
          : `${m} − ${n} ＝ ${ans}，所以原式化成 ${pInt(b,ans)}。`
      ].filter(Boolean),
      String(ans),
      "非零底數的 0 次方等於 1。"
    )
  };
}
function makePowerOfPower(){
  const b=
    nonzeroBase();

  /*
  內層從 2 次方開始，
  才能清楚保留「冪的乘方」結構。
  */
  const m=
    ri(
      2,
      4
    );

  const n=
    ri(
      2,
      5
    );

  const ans=
    m*n;

  return {
    kind:"integer",
    html:
      `<div class="math-expr">${groupedPowerQuestionHTML(b,m)}${sup(n)} ＝ ${intBaseHTML(b)}<span class="math-sup">□</span><br>□＝？</div>`,
    answer:ans,
    explanation:calcBox(
      "冪的乘方，底數不變，內外兩個指數相乘。",
      [
        `${groupedPowerHTML(b,m)}${sup(n)} ＝ ${intBaseHTML(b)}${sup(`${m}×${n}`)}。`,
        `${m} × ${n} ＝ ${ans}，所以原式化成 ${pInt(b,ans)}。`
      ],
      String(ans),
      "冪的乘方是指數相乘，不是指數相加。"
    )
  };
}
function makePowerOfProduct(){
  const t=ri(0,2);
  if(t===0){
    const a=pick([2,3,4,5]),b=pick([2,3,5,7]),e=ri(2,4);
    const correct=`${pInt(a,e)} × ${pInt(b,e)}`;
    const items=[correct,`${pInt(a,e+1)} × ${pInt(b,e)}`,`${pInt(a,e)} × ${b}`];
    return makeChoiceQ(`<div class="math-expr">(${a} × ${b})${sup(e)} 與下列何者相等？</div>`,items,0,
      calcBox("積的乘方：括號內每一個因數都要取相同次方。",[
        `(${a} × ${b})${sup(e)} ＝ ${pInt(a,e)} × ${pInt(b,e)}`
      ],correct));
  }
  if(t===1){
    const a=R(pick([2,3,4]),pick([3,5,7])),e=ri(2,4),ans=rpow(a,e);
    const rawN=ipow(a.n,e);
    const rawD=ipow(a.d,e);

    return {
      kind:"rational",
      html:`<div class="math-expr">計算：${pRat(a,e)}</div>`,
      answer:ans,
      explanation:calcBox(
        "分數的次方，要把分子和分母分別取相同次方，再檢查結果是否能約分。",
        [
          `${pRat(a,e)} ＝ <span class="math-frac"><span class="top">${Math.abs(a.n)}${sup(e)}</span><span class="bottom">${a.d}${sup(e)}</span></span>。`,
          `分子：${Math.abs(a.n)}${sup(e)} ＝ ${Math.abs(rawN)}；分母：${a.d}${sup(e)} ＝ ${rawD}。`,
          `所以先得到 ${rawFracHTML(rawN,rawD)}。`,
          ...reductionDetailLines(rawN,rawD)
        ],
        operandRatHTML(ans),
        "不要只把次方套在分子或只套在分母；分數線上下都要取相同次方。"
      )
    };
  }
  const a=pick([2,3,5]),b=pick([2,3,4]),e=ri(2,3),ans=ipow(a*b,e);
  return {kind:"integer",html:`<div class="math-expr">利用指數律計算：${pInt(a,e)} × ${pInt(b,e)}</div>`,answer:ans,
    explanation:calcBox("兩個因數的指數相同時，可以先合併底數再取次方。",[
      `${pInt(a,e)} × ${pInt(b,e)} ＝ (${a}×${b})${sup(e)}`,
      `＝ ${a*b}${sup(e)} ＝ ${ans}`
    ],String(ans))};
}
function makeCombined(){
  const t=
    ri(
      0,
      2
    );

  if(
    t===0
  ){
    const c=
      ri(
        1,
        3
      );

    const n=
      ri(
        1,
        3
      );

    const m=
      n+c;

    const b=
      pick(
        [
          2,3,5
        ]
      );

    const d=
      pick(
        [
          2,3,4
        ]
      );

    const ans=
      ipow(
        b*d,
        c
      );

    const oneNote=
      implicitExponentOneNote(
        [
          [b,m],
          [b,n],
          [d,c]
        ]
      );

    return {
      kind:"integer",
      html:
        `<div class="math-expr">利用指數律計算：${pIntQuestion(b,m)} ÷ ${pIntQuestion(b,n)} × ${pIntQuestion(d,c)}</div>`,
      answer:ans,
      explanation:calcBox(
        "先做同底數相除，再利用相同指數合併底數。",
        [
          oneNote,
          `${pInt(b,m)} ÷ ${pInt(b,n)} ＝ ${pInt(b,c)}。`,
          `${pInt(b,c)} × ${pInt(d,c)} ＝ ${mathGroupHTML(`${b}×${d}`,1)}${sup(c)} ＝ ${pInt(b*d,c)} ＝ ${ans}。`
        ].filter(Boolean),
        String(ans)
      )
    };
  }

  if(
    t===1
  ){
    const b=
      pick(
        [
          -3,-2,2,3
        ]
      );

    const m=
      ri(
        1,
        3
      );

    const n=
      ri(
        1,
        3
      );

    const ans=
      ipow(
        b,
        m+n
      );

    const oneNote=
      implicitExponentOneNote(
        [
          [b,m],
          [b,n]
        ]
      );

    return {
      kind:"integer",
      html:
        `<div class="math-expr">計算：${pIntQuestion(b,m)} × ${pIntQuestion(b,n)}</div>`,
      answer:ans,
      explanation:calcBox(
        "同底數相乘先把指數相加，再計算次方。",
        [
          oneNote,
          `${pInt(b,m)} × ${pInt(b,n)} ＝ ${pInt(b,m+n)} ＝ ${signedIntHTML(ans)}。`
        ].filter(Boolean),
        String(ans).replace("-","−")
      )
    };
  }

  const b=
    pick(
      [
        2,3,5
      ]
    );

  /*
  冪的乘方內層固定至少 2 次方。
  */
  const m=
    ri(
      2,
      3
    );

  const n=
    ri(
      2,
      3
    );

  const k=
    ri(
      1,
      m*n
    );

  const ans=
    ipow(
      b,
      m*n-k
    );

  const oneNote=
    implicitExponentOneNote(
      [
        [b,k]
      ]
    );

  return {
    kind:"integer",
    html:
      `<div class="math-expr">計算：${groupedPowerQuestionHTML(b,m)}${sup(n)} ÷ ${pIntQuestion(b,k)}</div>`,
    answer:ans,
    explanation:calcBox(
      "先做冪的乘方，再做同底數相除。",
      [
        oneNote,
        `${groupedPowerHTML(b,m)}${sup(n)} ＝ ${pInt(b,m*n)}。`,
        `${pInt(b,m*n)} ÷ ${pInt(b,k)} ＝ ${pInt(b,m*n-k)} ＝ ${ans}。`
      ].filter(Boolean),
      String(ans)
    )
  };
}
function makeQuestion(mode,i=0){
  if(mode==="fractionPower"){const r=Math.random();return r<.20?makeSignParity():r<.45?makeIndexFirst():makeFractionPower();}
  if(mode==="sameBaseMultiply")return makeSameBaseMultiply();
  if(mode==="sameBaseDivide")return makeSameBaseDivide();
  if(mode==="powerOfPower")return makePowerOfPower();
  if(mode==="powerOfProduct")return makePowerOfProduct();
  if(mode==="speed")return pick([makeSameBaseMultiply,makeSameBaseDivide,makePowerOfPower])();
  if(mode==="comprehensive"){
    const makers=[makeFractionPower,makeIndexFirst,makeSameBaseMultiply,makeSameBaseDivide,makePowerOfPower,makePowerOfProduct,makeCombined];
    return makers[i%makers.length]();
  }
  return makeSameBaseMultiply();
}

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}

    const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.045;
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.07);o.onended=()=>c.close().catch(()=>{});

}

function escapeSystemText(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getAnswer(q){
  if(q.kind==="choice"){
    if(selectedChoice===null){
      return {ok:false,msg:"請先選擇一個答案。"};
    }

    const display=q.choices[selectedChoice].replace(/<[^>]+>/g,"");

    return {
      ok:true,
      correct:selectedChoice===q.answerIndex,
      display,
      systemDisplay:display
    };
  }

  if(q.kind==="rational" && q.answer?.d!==1){
    const selectedSign=Number($("fraction-sign").value);
    const numeratorRaw=$("fraction-numerator").value.trim();
    const denominatorRaw=$("fraction-denominator").value.trim();

    if(!numeratorRaw || !denominatorRaw){
      return {
        ok:false,
        msg:"請在上格填分子、下格填分母。"
      };
    }

    /*
    分子接受：
    5
    -5

    若分子本身直接輸入負號，
    系統以分子負號為準；
    否則使用左側正負號選單。
    */
    if(!/^-?\d+$/.test(numeratorRaw) || !/^\d+$/.test(denominatorRaw)){
      return {
        ok:false,
        msg:"分子、分母必須是整數格式；例如負五分之三可填分子 -5、分母 3，或使用左側負號。"
      };
    }

    const typedNumerator=Number(numeratorRaw);
    const denominator=Number(denominatorRaw);

    if(denominator===0){
      return {
        ok:false,
        msg:"分母不能是 0。"
      };
    }

    const hasExplicitNegative=
      numeratorRaw.startsWith("-") &&
      typedNumerator!==0;

    const rawNumerator=
      hasExplicitNegative
        ? -Math.abs(typedNumerator)
        : selectedSign*Math.abs(typedNumerator);

    /*
    systemDisplay 保留學生實際輸入的分子、分母，
    不先約分，讓學生清楚看到系統到底讀到了什麼。
    */
    const systemDisplay=rawFracHTML(
      rawNumerator,
      denominator
    );

    const commonDivisor=
      igcd(
        rawNumerator,
        denominator
      );

    if(commonDivisor!==1){
      return {
        ok:false,
        formatOk:true,
        display:systemDisplay,
        displayHTML:true,
        systemDisplay,
        systemDisplayHTML:true,
        msg:"這個答案還不是最簡分數，請修正。",
        msgHTML:
          `<span class="simplest-warning">⚠️ 這個答案還不是最簡分數，請修正。</span>`
      };
    }

    const value=R(rawNumerator,denominator);

    return {
      ok:true,
      correct:ratEq(value,q.answer),
      display:ratHTML(value),
      displayHTML:true,
      systemDisplay,
      systemDisplayHTML:true
    };
  }

  const raw=$("number-input").value.trim();

  if(!raw){
    return {ok:false,msg:"請先輸入答案。"};
  }

  if(!/^[+-]?\d+$/.test(raw)){
    return {
      ok:false,
      msg:"答案必須是整數格式，例如 -5、0、12。"
    };
  }

  const value=Number(raw);
  const display=String(value).replace("-","−");

  if(q.kind==="integer"){
    return {
      ok:true,
      correct:value===q.answer,
      display,
      systemDisplay:display
    };
  }

  return {
    ok:true,
    correct:ratEq(R(value,1),q.answer),
    display,
    systemDisplay:display
  };
}

/*
==================================================
系統判讀

設計原則：
1. 只在「需要解讀輸入格式」的分數答案顯示。
2. 選擇題完全不顯示。
3. 一般整數輸入不顯示，避免畫面過度重複。
4. 分子、分母都完成且格式正確時，
   顯示系統實際讀到的分數。
5. 兩格都有內容但格式不合法時，
   顯示「目前格式無法判讀」。
6. 此功能只負責顯示系統讀到的答案，
   不提前透露正確／錯誤。
==================================================
*/
function updateSystemRead(){
  if(locked){
    return;
  }

  const q=
    modeId==="speed"
      ? questions[0]
      : questions[index];

  if(!q || q.kind==="choice"){
    clearSystemRead();
    return;
  }

  /*
  只有真正需要分子／分母輸入的題目才顯示。
  */
  if(!(q.kind==="rational" && q.answer?.d!==1)){
    clearSystemRead();
    return;
  }

  const numeratorRaw=
    $("fraction-numerator").value.trim();

  const denominatorRaw=
    $("fraction-denominator").value.trim();

  /*
  尚未填完整時先不顯示，
  與範例畫面一致，不增加干擾。
  */
  if(!numeratorRaw || !denominatorRaw){
    clearSystemRead();
    return;
  }

  /*
  分子可接受：
  5
  -5

  分母必須是正整數格式，
  且不可為 0。
  */
  if(
    !/^-?\d+$/.test(numeratorRaw) ||
    !/^\d+$/.test(denominatorRaw)
  ){
    showSystemReadWarning(
      "目前格式無法判讀"
    );
    return;
  }

  const typedNumerator=
    Number(numeratorRaw);

  const denominator=
    Number(denominatorRaw);

  if(
    !Number.isFinite(typedNumerator) ||
    !Number.isFinite(denominator) ||
    denominator===0
  ){
    showSystemReadWarning(
      "目前格式無法判讀"
    );
    return;
  }

  const selectedSign=
    Number(
      $("fraction-sign").value
    );

  /*
  若學生直接在分子輸入 -5，
  以輸入的負號為準；
  否則才套用左側正負號選單。
  */
  const hasExplicitNegative=
    numeratorRaw.startsWith("-") &&
    typedNumerator!==0;

  const rawNumerator=
    hasExplicitNegative
      ? -Math.abs(typedNumerator)
      : selectedSign*Math.abs(typedNumerator);

  /*
  使用 rawFracHTML，
  保留學生實際輸入的分子、分母，
  不先自動約分。
  例如輸入 -10 / 6，
  系統判讀就顯示 -10/6。
  */
  showSystemReadHTML(
    rawFracHTML(
      rawNumerator,
      denominator
    )
  );
}

function submitAnswer(){
  if(
    locked
  ){
    return;
  }

  const submitButton=
    $("submit-button");

  try{
    /*
    防止快速連點重複送出。
    若答案格式有問題，下面會立刻重新啟用。
    */
    submitButton.disabled=
      true;

    const q=
      modeId==="speed"
        ? questions[0]
        : questions[index];

    const a=
      getAnswer(
        q
      );

    if(
      !a.ok
    ){
      if(
        a.msgHTML
      ){
        $("input-message").innerHTML=
          a.msgHTML;
      }else{
        $("input-message").textContent=
          a.msg;
      }

      submitButton.disabled=
        false;

      return;
    }

    locked=
      true;

    $("number-input").disabled=
      true;

    $("fraction-sign").disabled=
      true;

    $("fraction-numerator").disabled=
      true;

    $("fraction-denominator").disabled=
      true;

    if(
      a.correct
    ){
      correct++;
      combo++;
      maxCombo=
        Math.max(
          maxCombo,
          combo
        );
      playGameSound(
        "playCorrect"
      );
    }else{
      wrong++;
      combo=0;
      playGameSound(
        "playWrong"
      );
    }

    records.push(
      {
        number:
          modeId==="speed"
            ? speedAttempts+1
            : index+1,
        question:q,
        userAnswer:a.display,
        userAnswerHTML:
          !!a.displayHTML,
        correct:
          a.correct
      }
    );

    if(
      modeId==="speed"
    ){
      speedAttempts++;

      if(
        a.correct
      ){
        speedScore+=10;
      }

      $("feedback").textContent=
        a.correct
          ? "✅ 正確！＋10 分"
          : "❌ 答錯了，下一題！";

      $("feedback").className=
        `feedback ${a.correct?"correct":"wrong"}`;

      updateStatus();

      setTimeout(
        ()=>{
          if(
            modeId==="speed" &&
            speedRemaining>0 &&
            $("result-screen").classList.contains("hidden")
          ){
            renderSpeedQuestion();
          }
        },
        260
      );

      return;
    }

    $("feedback").textContent=
      a.correct
        ? "✅ 回答正確！"
        : "❌ 答案不正確，請看下方完整解析。";

    $("feedback").className=
      `feedback ${a.correct?"correct":"wrong"}`;

    $("explanation").innerHTML=
      explanationHTML(
        q
      );

    $("explanation").classList.remove(
      "hidden"
    );

    submitButton.classList.add(
      "hidden"
    );

    $("next-button").classList.remove(
      "hidden"
    );

    $("next-button").textContent=
      index===questions.length-1
        ? "查看測驗結果"
        : "下一題";

    updateStatus();

  }catch(error){
    /*
    即使單一題型發生例外，
    也不讓「送出答案」永久失效。
    */
    console.error(
      "送出答案失敗：",
      error
    );

    locked=
      false;

    submitButton.disabled=
      false;

    $("number-input").disabled=
      false;

    $("fraction-sign").disabled=
      false;

    $("fraction-numerator").disabled=
      false;

    $("fraction-denominator").disabled=
      false;

    $("input-message").textContent=
      "答案送出時發生暫時性錯誤，請再按一次「送出答案」。";
  }
}
function nextQuestion(){if(index>=questions.length-1)finishGame();else{index++;renderQuestion();updateStatus()}}
function currentScore(){
  if(modeId==="speed") return speedScore;
  return questions.length?Math.round(correct/questions.length*100):0;
}
function finishGame(){
  clearInterval(timerHandle);timerHandle=null;
  const elapsed=Math.max(1,Math.round((Date.now()-startAt)/1000));
  const total=modeId==="speed"?speedAttempts:questions.length, score=currentScore();
  const accuracy=total?Math.round(correct/total*1000)/10:0;
  $("result-mode-name").textContent=MODE_CONFIG[modeId].name;
  $("final-score").textContent=modeId==="speed"?`${score} 分`:`${score} 分`;
  $("final-correct").textContent=correct;$("final-wrong").textContent=wrong;$("final-combo").textContent=maxCombo;$("final-time").textContent=mmss(elapsed);
  $("final-stars").textContent=score>=90?"★★★★★":score>=80?"★★★★☆":score>=70?"★★★☆☆":score>=60?"★★☆☆☆":"★☆☆☆☆";
  $("final-comment").textContent=score>=90?"掌握得很完整，繼續保持！":score>=75?"整體穩定，可從錯題解析再補強細節。":score>=60?"核心概念已有基礎，建議把錯題再做一次。":"先依錯題解析逐步複習，再重新挑戰。";
  $("review-button").classList.toggle("hidden",records.every(r=>r.correct));
  showScreen("result-screen"); saveScore({score,total,accuracy,elapsed}); sendRpgBridge({score,total,accuracy,elapsed});
}
async function saveScore({score,total,accuracy,elapsed}){
  const el=$("save-status");el.textContent="正在儲存成績…";
  try{
    const m=await import("../js/scores.js?v=7");
    if(typeof m.saveGameScore!=="function")throw new Error("找不到 saveGameScore");
    await m.saveGameScore({game:GAME_ID,mode:modeId,score,correctCount:correct,wrongCount:wrong,maxCombo,playTime:elapsed,totalQuestions:total,accuracy});
    el.textContent="✅ 成績已儲存，可在排行榜與我的成績查看。";
  }catch(e){console.warn("成績儲存失敗：",e);el.textContent="⚠️ 本次成績已完成，但雲端儲存未成功。";}
}
async function sendRpgBridge({score,total,accuracy,elapsed}){
  const payload={gameId:GAME_ID,modeId,score,correct,total,playTime:elapsed,accuracy,maxCombo,attemptId,difficultyWeight:MODE_CONFIG[modeId]?.difficultyWeight||1};
  window.dispatchEvent(new CustomEvent("mathgame:session-complete",{detail:payload}));
  try{
    if(typeof window.MathGameProgress?.completeLearningSession==="function"){await window.MathGameProgress.completeLearningSession(payload);return}
    const m=await import("../js/progress-system.js?v=1");
    if(typeof m.completeLearningSession==="function")await m.completeLearningSession(payload);
  }catch(e){console.debug("RPG/學習進度尚未啟用：",e?.message||e)}
}
function renderReview(){
  const list=$("review-list"), bad=records.filter(r=>!r.correct);
  list.innerHTML=bad.length?bad.map(r=>`<article class="review-item"><h3>第 ${r.number} 題</h3><div class="review-question">${r.question.html}</div><p><b>你的答案：</b>${r.userAnswerHTML?r.userAnswer:esc(r.userAnswer)}</p><p><b>正確答案：</b>${answerHTML(r.question)}</p><div class="review-explanation">${explanationHTML(r.question)}</div></article>`).join(""):"<p>本次沒有錯題，太棒了！</p>";
  showScreen("review-screen");
}
function answerHTML(q){return q.kind==="choice"?q.choices[q.answerIndex]:(q.kind==="integer"?esc(q.answer):ratHTML(q.answer))}
document.querySelectorAll(".mode-card").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));
$("submit-button").addEventListener("click",submitAnswer);$("next-button").addEventListener("click",nextQuestion);
$("restart-button").addEventListener("click",()=>startGame(modeId));
$("quit-button").addEventListener("click",()=>{clearInterval(timerHandle);showScreen("start-screen")});
$("again-button").addEventListener("click",()=>startGame(modeId));$("review-button").addEventListener("click",renderReview);
$("result-mode-button").addEventListener("click",()=>showScreen("start-screen"));
$("review-again-button").addEventListener("click",()=>startGame(modeId));$("review-result-button").addEventListener("click",()=>showScreen("result-screen"));
$("number-input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!locked)submitAnswer()});
$("fraction-numerator").addEventListener("keydown",e=>{if(e.key==="Enter"&&!locked)$("fraction-denominator").focus()});
$("fraction-denominator").addEventListener("keydown",e=>{if(e.key==="Enter"&&!locked)submitAnswer()});
["fraction-numerator","fraction-denominator"].forEach(id=>{
  $(id)?.addEventListener("input",()=>{
    if(!locked)updateSystemRead();
  });
});

$("fraction-sign")?.addEventListener("change",()=>{
  if(!locked)updateSystemRead();
});

window.MathGameSessionMeta={gameId:GAME_ID,chapter:CHAPTER,title:GAME_TITLE,modes:MODE_CONFIG};

</script>
