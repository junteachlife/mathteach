<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
我的成績｜生活有解．心中有數
</title>


<style>

*{
  box-sizing:border-box;
}


:root{

  --primary:#1565c0;
  --primary-light:#eef5ff;

  --orange:#f57c00;

  --text:#334155;
  --muted:#64748b;

  --border:#e2e8f0;

  --shadow:
    0 10px 25px
    rgba(15,23,42,.09);
}


body{

  margin:0;

  min-height:100vh;

  padding:20px;

  font-family:
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;

  color:
    var(--text);

  background:
    linear-gradient(
      135deg,
      #e3f2fd,
      #fff8e1
    );
}


button,
a{
  font-family:inherit;
}


button{
  touch-action:manipulation;
}


[hidden]{
  display:none!important;
}


.container{

  width:100%;

  max-width:980px;

  margin:0 auto;
}


/*
==================================================
頁首
==================================================
*/

.header{

  margin-bottom:18px;

  padding:
    28px
    22px;

  border-radius:24px;

  background:white;

  text-align:center;

  box-shadow:
    var(--shadow);
}


h1{

  margin:
    0 0 10px;

  color:
    var(--primary);

  font-size:
    36px;
}


.subtitle{

  margin:0;

  color:#666;

  line-height:1.7;
}


.user-box{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  margin-top:18px;

  padding:13px;

  border-radius:14px;

  background:
    var(--primary-light);

  color:#174a7e;

  font-weight:bold;
}


.user-photo{

  width:42px;

  height:42px;

  border-radius:50%;

  object-fit:cover;

  background:white;
}


/*
==================================================
導覽
==================================================
*/

.top-actions{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:12px;

  flex-wrap:wrap;

  margin:
    0 0 20px;

  padding:
    14px 16px;

  border-radius:18px;

  background:
    rgba(255,255,255,.82);

  box-shadow:
    0 8px 22px
    rgba(15,23,42,.08);
}


.top-action-link{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  min-height:46px;

  padding:
    11px 20px;

  border-radius:13px;

  color:white;

  text-decoration:none;

  font-size:16px;

  font-weight:bold;
}


.top-action-link.home{
  background:#607d8b;
}


.top-action-link.ranking{
  background:var(--orange);
}


/*
==================================================
系統訊息
==================================================
*/

.loading,
.error-message,
.empty-message{

  padding:
    38px 20px;

  border-radius:22px;

  background:white;

  text-align:center;

  font-size:18px;

  line-height:1.8;

  box-shadow:
    var(--shadow);
}


.loading{
  color:var(--primary);
}


.error-message{
  color:#c62828;
}


.empty-message{
  color:#666;
}


/*
==================================================
學期篩選
==================================================
*/

.semester-filter-section{

  margin-bottom:20px;

  padding:20px;

  border-radius:22px;

  background:white;

  box-shadow:
    var(--shadow);
}


.filter-heading{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}


.filter-title{

  margin:0;

  color:var(--primary);

  font-size:21px;
}


.filter-note{

  color:
    var(--muted);

  font-size:13px;
}


.semester-filter-box{

  display:grid;

  grid-template-columns:
    repeat(
      7,
      minmax(0,1fr)
    );

  gap:8px;
}


.semester-filter-button{

  min-height:48px;

  padding:
    8px 6px;

  border:
    2px solid
    #d7e0ea;

  border-radius:13px;

  background:white;

  color:#475569;

  cursor:pointer;

  font-size:14px;

  font-weight:900;

  transition:.15s ease;
}


.semester-filter-button:hover{

  border-color:
    #64a5e8;
}


.semester-filter-button.active{

  border-color:
    var(--primary);

  background:
    var(--primary);

  color:white;

  box-shadow:
    0 5px 12px
    rgba(21,101,192,.20);
}


.semester-filter-count{

  display:block;

  margin-top:3px;

  font-size:11px;

  opacity:.82;
}


/*
==================================================
統計
==================================================
*/

.stats-section{
  display:none;
}


.stats-heading-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  margin:
    0 0 12px;
}


.stats-scope-title{

  margin:0;

  color:#174f8f;

  font-size:18px;
}


.stats-grid{

  display:grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap:16px;

  margin-bottom:22px;
}


.stat-card{

  min-height:135px;

  padding:
    22px 14px;

  border-radius:20px;

  background:white;

  text-align:center;

  box-shadow:
    var(--shadow);
}


.stat-icon{

  margin-bottom:8px;

  font-size:30px;
}


.stat-value{

  color:
    var(--primary);

  font-size:30px;

  font-weight:bold;
}


.stat-label{

  margin-top:7px;

  color:#666;

  font-size:15px;
}


.semester-empty-message{

  margin-bottom:20px;

  padding:17px;

  border:
    2px dashed
    #cbd5e1;

  border-radius:16px;

  background:
    rgba(255,255,255,.75);

  color:
    var(--muted);

  text-align:center;

  font-weight:800;
}


/*
==================================================
共用區塊
==================================================
*/

.game-summary,
.history-card{

  margin-bottom:22px;

  padding:22px;

  border-radius:22px;

  background:white;

  box-shadow:
    var(--shadow);
}


.section-title{

  margin:
    0 0 18px;

  color:
    var(--primary);

  font-size:24px;
}


.section-empty{

  padding:24px;

  border-radius:14px;

  background:#f8fafc;

  color:
    var(--muted);

  text-align:center;

  font-weight:700;

  list-style:none;
}


/*
==================================================
學期群組
==================================================
*/

.semester-group{

  margin-bottom:15px;

  overflow:hidden;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  background:#fff;
}


.semester-group:last-child{
  margin-bottom:0;
}


.semester-group-header{

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    15px 17px;

  background:
    linear-gradient(
      90deg,
      #f8fbff,
      #fff
    );

  cursor:pointer;

  user-select:none;
}


.semester-group-header::marker{
  color:#64748b;
}


.semester-group-title{

  flex:1;

  color:#1e3a5f;

  font-size:17px;

  font-weight:900;
}


.semester-group-count{

  color:
    var(--muted);

  font-size:13px;

  font-weight:700;
}


.semester-group-body{

  padding:
    0 16px 4px;
}


/*
==================================================
學期 Badge
==================================================
*/

.semester-badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

  min-width:44px;

  min-height:26px;

  padding:
    4px 8px;

  border-radius:999px;

  font-size:12px;

  font-weight:900;
}


.semester-grade7-first,
.semester-grade7-second{

  background:#e0f2fe;

  color:#0369a1;
}


.semester-grade8-first,
.semester-grade8-second{

  background:#ecfdf5;

  color:#047857;
}


.semester-grade9-first,
.semester-grade9-second{

  background:#fef3c7;

  color:#92400e;
}


.semester-unknown{

  background:#f1f5f9;

  color:#64748b;
}


/*
==================================================
遊戲表現
==================================================
*/

.game-performance-card{

  padding:
    16px 0;

  border-bottom:
    1px solid
    #edf0f3;
}


.game-performance-card:last-child{
  border-bottom:none;
}


.game-performance-main{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    repeat(
      3,
      105px
    );

  gap:12px;

  align-items:center;
}


.game-performance-title-area{

  min-width:0;
}


.game-title{

  margin-top:7px;

  color:#1e293b;

  font-size:17px;

  font-weight:900;

  line-height:1.5;
}


.game-stat{
  text-align:center;
}


.game-stat-value{

  color:
    var(--orange);

  font-size:20px;

  font-weight:bold;
}


.game-stat-label{

  margin-top:3px;

  color:#888;

  font-size:12px;
}


/*
==================================================
模式統計
==================================================
*/

.mode-details{

  margin:
    13px 0 0;

  border-radius:13px;

  background:#f8fafc;
}


.mode-details > summary{

  padding:
    11px 13px;

  color:#475569;

  cursor:pointer;

  font-size:13px;

  font-weight:900;

  user-select:none;
}


.mode-stat-list{

  display:grid;

  gap:1px;

  padding:
    0 10px 10px;
}


.mode-stat-row{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap:12px;

  align-items:center;

  padding:
    10px;

  border-radius:10px;

  background:white;
}


.mode-stat-name{

  min-width:0;

  color:#334155;

  font-size:14px;

  font-weight:800;
}


.mode-stat-data{

  display:flex;

  gap:13px;

  color:
    var(--muted);

  font-size:12px;

  white-space:nowrap;
}


.mode-stat-data strong{
  color:var(--orange);
}


/*
==================================================
最近紀錄
==================================================
*/

.history-list{

  margin:0;

  padding:0;

  list-style:none;
}


.history-item{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    90px;

  gap:12px;

  align-items:center;

  padding:
    16px 4px;

  border-bottom:
    1px solid
    #eeeeee;
}


.history-item:last-child{
  border-bottom:none;
}


.history-info{
  min-width:0;
}


.history-title-row{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:6px;
}


.history-game{

  min-width:0;

  overflow:hidden;color:#1e293b;

  font-size:16px;

  font-weight:900;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.history-detail{

  color:#777;

  font-size:13px;

  line-height:1.65;
}


.history-mode{

  color:#475569;

  font-weight:800;
}


.history-time{
  color:#0288d1;
}


.history-score{

  text-align:right;

  color:
    var(--orange);

  font-size:24px;

  font-weight:bold;
}


.history-score-label{

  color:#888;

  font-size:12px;

  font-weight:normal;
}


/*
==================================================
底部
==================================================
*/

.footer-actions{

  display:flex;

  justify-content:center;

  gap:12px;

  margin-top:24px;

  flex-wrap:wrap;
}


.action-link{

  display:inline-block;

  padding:
    12px 22px;

  border-radius:12px;

  background:
    var(--primary);

  color:white;

  text-decoration:none;

  font-weight:bold;
}


.action-link.secondary{
  background:#607d8b;
}


.action-link.ranking{
  background:var(--orange);
}


/*
==================================================
平板
==================================================
*/

@media(max-width:760px){

  body{
    padding:12px;
  }


  .semester-filter-box{

    grid-template-columns:
      repeat(
        4,
        1fr
      );
  }


  .stats-grid{

    grid-template-columns:
      repeat(
        2,
        1fr
      );

    gap:10px;
  }


  .game-performance-main{

    grid-template-columns:
      minmax(0,1fr)
      72px
      72px
      72px;

    gap:6px;
  }


  .game-stat-value{
    font-size:17px;
  }


  .mode-stat-data{

    gap:8px;

    font-size:11px;
  }

}


/*
==================================================
手機
==================================================
*/

@media(max-width:520px){

  body{
    padding:8px;
  }


  .header{

    padding:
      22px 14px;

    border-radius:18px;
  }


  h1{
    font-size:28px;
  }


  .top-actions{

    display:grid;

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:8px;

    padding:10px;
  }


  .top-action-link{

    min-width:0;

    padding:
      10px 8px;

    font-size:14px;
  }


  .filter-heading{

    display:block;
  }


  .filter-note{

    display:block;

    margin-top:5px;
  }


  .semester-filter-box{

    grid-template-columns:
      repeat(
        4,
        1fr
      );

    gap:6px;
  }


  .semester-filter-button{

    min-height:44px;

    font-size:13px;
  }


  .stats-grid{

    grid-template-columns:
      1fr 1fr;
  }


  .stat-card{

    min-height:116px;

    padding:
      15px 7px;
  }


  .stat-value{
    font-size:24px;
  }


  .game-summary,
  .history-card,
  .semester-filter-section{

    padding:
      16px 12px;
  }


  .semester-group-body{

    padding:
      0 10px 3px;
  }


  .game-performance-main{

    grid-template-columns:
      1fr;

    gap:10px;

    padding:
      3px 0;
  }


  .game-performance-title-area{

    display:flex;

    align-items:center;

    gap:8px;
  }


  .game-title{
    margin-top:0;
  }


  .game-stat{

    display:flex;

    justify-content:space-between;

    padding:
      5px 8px;

    border-radius:8px;

    background:#f8fafc;

    text-align:left;
  }


  .game-stat-label{

    order:-1;

    margin:0;
  }


  .mode-stat-row{

    grid-template-columns:
      1fr;

    gap:6px;
  }


  .mode-stat-data{

    justify-content:space-between;

    white-space:normal;
  }


  .history-item{

    grid-template-columns:
      minmax(0,1fr)
      62px;

    gap:8px;

    padding:
      14px 2px;
  }


  .history-title-row{

    align-items:flex-start;
  }


  .history-game{

    white-space:normal;

    font-size:15px;
  }


  .history-score{
    font-size:21px;
  }


  .footer-actions{

    display:grid;

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:8px;
  }


  .action-link{

    padding:
      11px 8px;

    text-align:center;

    font-size:14px;
  }

}



/*
==================================================
v3.12｜頁首導覽＋學期整合精簡版
==================================================
*/
.header.compact-header{
  padding:18px 20px;
  text-align:left;
}

.header-title-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  min-width:0;
  margin-bottom:10px;
}

.header-title-row h1{
  flex:0 0 auto;
  margin:0;
  font-size:32px;
  white-space:nowrap;
}

.header-title-row .subtitle{
  min-width:0;
  margin:0;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header.compact-header .user-box{
  justify-content:flex-start;
  margin-top:0;
  padding:10px 12px;
}

.header-controls-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:12px;
  min-width:0;
}

.header.compact-header .top-actions{
  flex:0 0 auto;
  justify-content:flex-start;
  gap:8px;
  margin:0;
  padding:0;
  background:transparent;
  box-shadow:none;
}

.header.compact-header .top-action-link{
  min-height:42px;
  padding:9px 14px;
  font-size:15px;
}

.header.compact-header .semester-filter-section{
  flex:1 1 auto;
  min-width:0;
  margin:0;
  padding:0;
  background:transparent;
  box-shadow:none;
}

.header.compact-header .filter-heading{
  display:none;
}

.header.compact-header .semester-filter-box{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  min-width:0;
}

.header.compact-header .semester-filter-button{
  min-height:42px;
  padding:7px 9px;
  font-size:13px;
  white-space:nowrap;
}

.header.compact-header .semester-filter-count{
  display:inline;
  margin-left:3px;
  font-size:10px;
}

@media (max-width:900px){
  .header.compact-header{padding:16px;}
  .header-title-row{gap:10px;}
  .header-title-row h1{font-size:28px;}
  .header-title-row .subtitle{font-size:14px;}
  .header-controls-row{align-items:stretch;flex-wrap:wrap;}
  .header.compact-header .semester-filter-section{flex:1 1 100%;}
  .header.compact-header .semester-filter-box{
    justify-content:flex-start;
    flex-wrap:wrap;
  }
}

@media (max-width:600px){
  .header-title-row{
    align-items:flex-start;
    flex-direction:column;
    gap:4px;
  }
  .header-title-row .subtitle{
    width:100%;
    white-space:normal;
  }
  .header.compact-header .user-box{font-size:14px;}
  .header.compact-header .top-actions{width:100%;}
  .header.compact-header .top-action-link{
    flex:1 1 0;
    padding:9px 8px;
  }
  .header.compact-header .semester-filter-box{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .header.compact-header .semester-filter-button{width:100%;}
}

</style>

</head>


<body>


<main class="container">


<!--
==================================================
頁首
==================================================
-->

<header class="header compact-header">

<div class="header-title-row">
  <h1>👤 我的成績</h1>
  <p class="subtitle">查看各學期遊戲表現與練習紀錄</p>
</div>

<div id="userStatus" class="user-box">
  正在確認登入狀態……
</div>

<div class="header-controls-row">

  <nav class="top-actions" aria-label="快速導覽">
    <a class="top-action-link home" href="index.html">🏠 回到首頁</a>
    <a class="top-action-link ranking" href="leaderboard.html">🏆 排行榜</a>
  </nav>

  <section id="semesterFilterSection" class="semester-filter-section" hidden>
    <div class="filter-heading">
      <h2 class="filter-title">📚 學期</h2>
    </div>
    <div id="semesterFilterBox" class="semester-filter-box"></div>
  </section>

</div>

</header>


<!--
==================================================
載入
==================================================
--><!--
==================================================
載入
==================================================
-->

<div
  id="loadingMessage"
  class="loading"
>
成績資料載入中……
</div>


<div
  id="errorMessage"
  class="error-message"
  hidden
></div>


<div
  id="emptyMessage"
  class="empty-message"
  hidden
>

目前還沒有任何遊戲成績。

<br>

完成一局遊戲後，
成績就會出現在這裡。

</div>


<!--
==================================================
我的成績
==================================================
--><!--
==================================================
我的成績
==================================================
-->

<section
  id="statsSection"
  class="stats-section"
>


<div class="stats-heading-row">

<h2
  id="statsScopeTitle"
  class="stats-scope-title"
>
全部學期統計
</h2>

</div>


<div
  id="semesterEmptyMessage"
  class="semester-empty-message"
  hidden
>
本學期目前尚無成績紀錄。
</div>


<!--
==================================================
六項統計
==================================================
-->

<div class="stats-grid">


<article class="stat-card">

<div class="stat-icon">
🎮
</div>

<div
  id="totalGames"
  class="stat-value"
>
0
</div>

<div class="stat-label">
遊玩次數
</div>

</article>


<article class="stat-card">

<div class="stat-icon">
🏆
</div>

<div
  id="highestScore"
  class="stat-value"
>
0
</div>

<div class="stat-label">
最高分
</div>

</article>


<article class="stat-card">

<div class="stat-icon">
📊
</div>

<div
  id="averageScore"
  class="stat-value"
>
0
</div>

<div class="stat-label">
平均分數
</div>

</article>


<article class="stat-card">

<div class="stat-icon">
🔥
</div>

<div
