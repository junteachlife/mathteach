<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RPG Registry 健檢</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: #1e293b;

      background:
        #f8fafc;
    }

    .page {
      width: min(
        100%,
        1100px
      );

      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      margin-bottom: 20px;

      color: #64748b;

      line-height: 1.7;
    }

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            180px,
            1fr
          )
        );

      gap: 12px;

      margin-bottom: 20px;
    }

    .summary-card {
      padding: 16px;

      border:
        1px solid
        #cbd5e1;

      border-radius: 14px;

      background: #ffffff;
    }

    .summary-label {
      color: #64748b;

      font-size: 14px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 6px;

      font-size: 28px;
      font-weight: 900;
    }

    .status-box {
      margin-bottom: 20px;
      padding: 16px;

      border-radius: 14px;

      font-weight: 800;
      line-height: 1.7;
    }

    .status-loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .section {
      margin-top: 20px;

      padding: 18px;

      border:
        1px solid
        #dbe3ee;

      border-radius: 16px;

      background: #ffffff;
    }

    .section h2 {
      margin-top: 0;
    }

    .test-list {
      display: grid;

      gap: 8px;
    }

    .test-item {
      padding: 10px 12px;

      border-radius: 10px;

      background: #f8fafc;

      line-height: 1.6;
    }

    .pass {
      color: #15803d;
      font-weight: 800;
    }

    .fail {
      color: #b91c1c;
      font-weight: 800;
    }

    .game-list {
      display: grid;

      gap: 14px;
    }

    .game-card {
      padding: 14px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 12px;
    }

    .game-title {
      margin-bottom: 8px;

      font-size: 18px;
      font-weight: 900;
    }

    .game-id {
      margin-bottom: 8px;

      color: #475569;

      font-family:
        Consolas,
        monospace;

      font-size: 13px;
    }

    table {
      width: 100%;

      border-collapse:
        collapse;

      font-size: 14px;
    }

    th,
    td {
      padding: 8px;

      border-bottom:
        1px solid
        #e2e8f0;

      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
    }

    code {
      padding: 2px 5px;

      border-radius: 5px;

      background: #f1f5f9;

      font-family:
        Consolas,
        monospace;
    }

    .error-detail {
      margin-top: 12px;

      white-space: pre-wrap;

      font-family:
        Consolas,
        monospace;

      font-size: 13px;
    }

    @media (
      max-width: 700px
    ) {

      body {
        padding: 10px;
      }

      .section {
        padding: 12px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        min-width: 650px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <h1>
      🧪 RPG Registry 健檢
    </h1>

    <div class="subtitle">

      這個頁面只做測試，
      不寫入 Firebase，
      不增加 XP，
      也不會修改學生任何資料。

    </div>


    <div
      id="statusBox"
      class="
        status-box
        status-loading
      "
    >
      ⏳ 正在載入 Registry……
    </div>


    <div class="summary-grid">

      <div class="summary-card">

        <div class="summary-label">
          已登錄遊戲
        </div>

        <div
          id="gameCount"
          class="summary-value"
        >
          —
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          已登錄模式
        </div>

        <div
          id="modeCount"
          class="summary-value"
        >
          —
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          競速模式
        </div>

        <div
          id="speedCount"
          class="summary-value"
        >
          —
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          Registry 驗證
        </div>

        <div
          id="validResult"
          class="summary-value"
        >
          —
        </div>

      </div>

    </div>


    <section class="section">

      <h2>
        ✅ 自動測試
      </h2>

      <div
        id="testList"
        class="test-list"
      ></div>

    </section>


    <section class="section">

      <h2>
        🎮 遊戲與模式清單
      </h2>

      <div
        id="gameList"
        class="game-list"
      ></div>

    </section>


    <section
      id="errorSection"
      class="section"
      style="display:none;"
    >

      <h2>
        ❌ 錯誤詳細資料
      </h2>

      <div
        id="errorDetail"
        class="error-detail"
      ></div>

    </section>

  </main>


  <script type="module">

    const EXPECTED_GAME_COUNT =
      20;

    const EXPECTED_MODE_COUNT =
      87;


    const statusBox =
      document.getElementById(
        "statusBox"
      );

    const gameCountBox =
      document.getElementById(
        "gameCount"
      );

    const modeCountBox =
      document.getElementById(
        "modeCount"
      );

    const speedCountBox =
      document.getElementById(
        "speedCount"
      );

    const validResultBox =
      document.getElementById(
        "validResult"
      );

    const testList =
      document.getElementById(
        "testList"
      );

    const gameList =
      document.getElementById(
        "gameList"
      );

    const errorSection =
      document.getElementById(
        "errorSection"
      );

    const errorDetail =
      document.getElementById(
        "errorDetail"
      );


    function addTest(
      label,
      passed,
      detail = ""
    ) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "test-item";


      const resultText =
        passed
          ? "✅ 通過"
          : "❌ 失敗";


      item.innerHTML = `

        <span
          class="${
            passed
              ? "pass"
              : "fail"
          }"
        >
          ${resultText}
        </span>

        ｜

        ${label}

        ${
          detail
            ? `<div>${detail}</div>`
            : ""
        }

      `;


      testList.appendChild(
        item
      );

    }


    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    try {

      const registryModule =
        await import(
          "./js/rpg/game-registry.js"
        );


      const {

        RPG_MODE_TYPES,

        GAME_REGISTRY,

        getActiveGames,

        getModeConfig,

        resolveModeId,

        isRegisteredGame,

        isRegisteredMode,

        isSpeedMode,

        validateGameRegistry

      } =
        registryModule;


      /*
      ==============================================
      Registry 基本驗證
      ==============================================
      */

      const validation =
        validateGameRegistry();


      const games =
        getActiveGames();


      const gameCount =
        games.length;


      const allModes =
        games.flatMap(
          game =>
            Object.values(
              game.modes
            )
              .map(
                mode => ({

                  game,

                  mode

                })
              )
        );


      const modeCount =
        allModes.length;


      const speedModes =
        allModes.filter(
          item =>
            item.mode.modeType ===
            RPG_MODE_TYPES.SPEED
        );


      gameCountBox.textContent =
        gameCount;


      modeCountBox.textContent =
        modeCount;


      speedCountBox.textContent =
        speedModes.length;


      validResultBox.textContent =
        validation.valid
          ? "通過"
          : "失敗";


      /*
      ==============================================
      測試 1
      Registry 本身
      ==============================================
      */

      addTest(

        "Registry 自我檢查",

        validation.valid,

        validation.valid
          ? "沒有發現 gameId、modeId、難度或模式類型錯誤。"
          : validation.errors.join(
              "<br>"
            )

      );


      /*
      ==============================================
      測試 2
      遊戲數
      ==============================================
      */

      addTest(

        `遊戲數應為 ${EXPECTED_GAME_COUNT}`,

        gameCount ===
          EXPECTED_GAME_COUNT,

        `目前讀到：${gameCount}`

      );


      /*
      ==============================================
      測試 3
      模式數
      ==============================================
      */

      addTest(

        `模式總數應為 ${EXPECTED_MODE_COUNT}`,

        modeCount ===
          EXPECTED_MODE_COUNT,

        `目前讀到：${modeCount}`

      );


      /*
      ==============================================
      測試 4
      新版七上
      ==============================================
      */

      const newGrade7Checks = [

        [
          "positiveNegative115",
          [
            "context",
            "numberline",
            "compare",
            "opposite",
            "absolute",
            "mixed"
          ]
        ],

        [
          "positiveNegativeAddSubtract",
          [
            "addition",
            "subtraction",
            "mixed",
            "smart",
            "distance",
            "speed",
            "comprehensive"
          ]
        ],

        [
          "positiveNegativeMultiplyDivide",
          [
            "multiplication",
            "chain",
            "division",
            "operations",
            "distributive",
            "speed",
            "comprehensive"
          ]
        ],

        [
          "exponentScientificNotation",
          [
            "notation",
            "negativePower",
            "operations",
            "tenPower",
            "scientific",
            "scientificCompare",
            "speed",
            "comprehensive"
          ]
        ]

      ];


      let newGrade7Passed =
        true;


      const newGrade7Errors =
        [];


      newGrade7Checks.forEach(

        ([
          gameId,
          modeIds
        ]) => {


          if (
            !isRegisteredGame(
              gameId
            )
          ) {

            newGrade7Passed =
              false;

            newGrade7Errors.push(
              `找不到 ${gameId}`
            );

            return;

          }


          modeIds.forEach(
            modeId => {

              if (
                !isRegisteredMode(
                  gameId,
                  modeId
                )
              ) {

                newGrade7Passed =
                  false;

                newGrade7Errors.push(

                  `找不到 ` +
                  `${gameId}/${modeId}`

                );

              }

            }
          );

        }

      );


      addTest(

        "新版七上 1-1 ～ 1-4 gameId / modeId",

        newGrade7Passed,

        newGrade7Passed
          ? "四支新版遊戲與所有模式均已找到。"
          : newGrade7Errors.join(
              "<br>"
            )

      );


      /*
      ==============================================
      測試 5
      舊版 integer 空白 mode
      ==============================================
      */

      const integerResolved =
        resolveModeId(
          "integer",
          ""
        );


      addTest(

        "舊版 integer 空白 mode 自動轉 default",

        integerResolved ===
          "default",

        `結果：${
          integerResolved ??
          "null"
        }`

      );


      /*
      ==============================================
      測試 6
      不可亂補 default
      ==============================================
      */

      const invalidBlankMode =
        resolveModeId(
          "positiveNegativeAddSubtract",
          ""
        );


      addTest(

        "多模式遊戲空白 mode 不可偷偷變成 default",

        invalidBlankMode ===
          null,

        `結果：${
          invalidBlankMode ??
          "null"
        }`

      );


      /*
      ==============================================
      測試 7
      speed 判斷
      ==============================================
      */

      const speedChecks = [

        [
          "positiveNegativeAddSubtract",
          "speed"
        ],

        [
          "positiveNegativeMultiplyDivide",
          "speed"
        ],

        [
          "exponentScientificNotation",
          "speed"
        ]

      ];


      const speedPassed =
        speedChecks.every(

          ([
            gameId,
            modeId
          ]) =>

            isSpeedMode(
              gameId,
              modeId
            )

        );


      addTest(

        "新版七上競速模式辨識",

        speedPassed,

        speedPassed
          ? "1-2、1-3、1-4 的 speed 都被正確標成競速模式。"
          : "至少有一個 speed 模式未被正確辨識。"

      );


      /*
      ==============================================
      測試 8
      一般模式不能誤判 speed
      ==============================================
      */

      const normalModeIsNotSpeed =
        !isSpeedMode(
          "positiveNegativeAddSubtract",
          "addition"
        );


      addTest(

        "一般學習模式不會被誤判為競速",

        normalModeIsNotSpeed

      );


      /*
      ==============================================
      列出全部遊戲
      ==============================================
      */

      games.forEach(
        game => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "game-card";


          const modes =
            Object.values(
              game.modes
            );


          const rows =
            modes
              .map(
                mode => `

                  <tr>

                    <td>
                      <code>
                        ${escapeHTML(
                          mode.modeId
                        )}
                      </code>
                    </td>

                    <td>
                      ${escapeHTML(
                        mode.name
                      )}
                    </td>

                    <td>
                      ${escapeHTML(
                        mode.modeType
                      )}
                    </td>

                    <td>
                      ${escapeHTML(
                        mode.difficultyLevel
                      )}
                    </td>

                    <td>
                      ${
                        mode.countsForCompletion
                          ? "✅"
                          : "—"
                      }
                    </td>

                  </tr>

                `
              )
              .join("");


          card.innerHTML = `

            <div class="game-title">

              ${escapeHTML(
                game.name
              )}

            </div>

            <div class="game-id">

              gameId：
              <code>
                ${escapeHTML(
                  game.gameId
                )}
              </code>

              ｜模式數：
              ${modes.length}

            </div>

            <div class="table-wrap">

              <table>

                <thead>

                  <tr>

                    <th>
                      modeId
                    </th>

                    <th>
                      模式名稱
                    </th>

                    <th>
                      類型
                    </th>

                    <th>
                      難度
                    </th>

                    <th>
                      核心完成
                    </th>

                  </tr>

                </thead>

                <tbody>

                  ${rows}

                </tbody>

              </table>

            </div>

          `;


          gameList.appendChild(
            card
          );

        }
      );


      /*
      ==============================================
      最終狀態
      ==============================================
      */

      const allPassed =

        validation.valid &&

        gameCount ===
          EXPECTED_GAME_COUNT &&

        modeCount ===
          EXPECTED_MODE_COUNT &&

        newGrade7Passed &&

        integerResolved ===
          "default" &&

        invalidBlankMode ===
          null &&

        speedPassed &&

        normalModeIsNotSpeed;


      if (
        allPassed
      ) {

        statusBox.className =
          "status-box status-success";

        statusBox.textContent =

          "✅ Registry 健檢全部通過！" +
          "目前可以進入下一階段。";

      }

      else {

        statusBox.className =
          "status-box status-error";

        statusBox.textContent =

          "⚠️ Registry 可以載入，" +
          "但仍有測試項目沒有通過。";

      }


      if (
        !validation.valid
      ) {

        errorSection.style.display =
          "block";

        errorDetail.textContent =
          validation.errors.join(
            "\n"
          );

      }

    }

    catch (
      error
    ) {

      console.error(
        error
      );


      statusBox.className =
        "status-box status-error";


      statusBox.textContent =

        "❌ Registry 無法載入。" +
        "請先不要進行下一階段。";


      validResultBox.textContent =
        "錯誤";


      errorSection.style.display =
        "block";


      errorDetail.textContent =

        error?.stack ||
        error?.message ||
        String(
          error
        );

    }

  </script>

</body>

</html>
