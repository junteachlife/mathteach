<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
遊戲排行榜｜生活有解．心中有數
</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --blue:#1565c0;
  --blue-dark:#0d47a1;
  --blue-light:#eef5ff;
  --orange:#f57c00;
  --orange-dark:#e65100;
  --gray:#607d8b;
  --gray-dark:#455a64;
  --text:#334155;
  --muted:#64748b;
  --border:#dbe4ee;
  --shadow:0 12px 30px rgba(15,23,42,.10);
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#e3f2fd,#fff8e1);
}

button,
select,
a{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{
  touch-action:manipulation;
}

[hidden]{
  display:none!important;
}

.container{
  width:100%;
  max-width:980px;
  margin:0 auto;
}

.header{
  margin-bottom:18px;
  padding:30px 22px;
  border-radius:24px;
  background:white;
  text-align:center;
  box-shadow:var(--shadow);
}

.header h1{
  margin:0 0 12px;
  color:var(--blue);
  font-size:clamp(31px,5vw,42px);
}

.subtitle{
  margin:0;
  color:#666;
  font-size:17px;
  line-height:1.75;
}

.ranking-rule{
  display:inline-block;
  margin-top:18px;
  padding:10px 15px;
  border-radius:12px;
  background:#f8fafc;
  color:#475569;
  font-size:14px;
  font-weight:bold;
  line-height:1.65;
}

.user-box{
  margin-top:18px;
  padding:13px 16px;
  border-radius:13px;
  background:var(--blue-light);
  color:#174a7e;
  font-size:17px;
  font-weight:bold;
}

.top-actions,
.footer-actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.top-actions{
  margin-bottom:18px;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.82);
  box-shadow:0 8px 22px rgba(15,23,42,.08);
}

.top-action-link,
.action-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:150px;
  min-height:46px;
  padding:11px 20px;
  border-radius:13px;
  color:white;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}

.top-action-link.home,
.action-link{
  background:var(--gray);
}

.top-action-link.scores,
.action-link.scores{
  background:var(--orange);
}

.semester-card{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
  padding:18px 20px;
  border-radius:20px;
  background:white;
  box-shadow:var(--shadow);
}

.semester-label{
  font-size:17px;
  font-weight:bold;
}

.semester-select{
  width:min(270px,100%);
  min-height:48px;
  padding:9px 14px;
  border:2px solid #90caf9;
  border-radius:12px;
  background:white;
  color:#174a7e;
  font-size:16px;
  font-weight:bold;
}

.leaderboard-card{
  overflow:hidden;
  padding:20px;
  border-radius:24px;
  background:white;
  box-shadow:var(--shadow);
}

.filter-title{
  margin:2px 0 18px;
  text-align:center;
  font-size:21px;
}

.filter-box{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-bottom:22px;
}

.filter-button{
  min-height:50px;
  padding:10px 14px;
  border:2px solid #cbd5e1;
  border-radius:12px;
  background:white;
  color:#475569;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.filter-button.active{
  border-color:var(--blue);
  background:var(--blue);
  color:white;
}

.filter-button.all-button{
  grid-column:1/-1;
}

.loading,
.empty-message,
.error-message{
  padding:38px 20px;
  text-align:center;
  font-size:17px;
  line-height:1.8;
}

.loading{
  color:var(--blue);
}

.empty-message{
  color:var(--muted);
}

.error-message{
  color:#c62828;
}

.leaderboard-list{
  display:grid;
  gap:20px;
  margin:0;
  padding:0;
  list-style:none;
}

.leaderboard-game-section{
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:white;
}

.leaderboard-game-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  padding:17px 18px;
  background:var(--blue-light);
  color:var(--blue);
  font-size:20px;
}

.leaderboard-game-icon{
  font-size:23px;
}

.leaderboard-mode-tabs{
  display:flex;
  gap:8px;
  padding:14px 14px 4px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.leaderboard-mode-tab{
  flex-shrink:0;
  min-height:42px;
  padding:8px 15px;
  border:2px solid #cbd5e1;
  border-radius:11px;
  background:white;
  color:#475569;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.leaderboard-mode-tab.active{
  border-color:var(--blue);
  background:var(--blue);
  color:white;
}

.leaderboard-single-title,
.leaderboard-mode-heading{
  margin:16px 18px 9px;
  font-size:17px;
}

.leaderboard-mode-empty{
  padding:30px 20px;
  color:#64748b;
  text-align:center;
}

.leaderboard-ranking-list{
  margin:0;
  padding:0;
  list-style:none;
}

.leaderboard-item{
  display:grid;
  grid-template-columns:70px minmax(0,1fr) 100px;
  gap:12px;
  align-items:center;
  padding:17px 18px;
  border-top:1px solid #eee;
}

.leaderboard-item.current-user{
  background:#fff8e1;
  border-left:6px solid #ffb300;
}

.rank{
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.player-info{
  min-width:0;
}

.player-name{
  margin-bottom:5px;
  overflow:hidden;
  font-size:18px;
  font-weight:bold;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.record-detail{
  color:#64748b;
  font-size:13px;
  line-height:1.7;
}

.leaderboard-play-duration{
  color:#0288d1;
  font-weight:bold;
}

.record-date{
  margin-top:3px;
  color:#94a3b8;
  font-size:12px;
}

.score{
  text-align:center;
  color:var(--orange);
  font-size:25px;
  font-weight:bold;
}

.score-label{
  color:#888;
  font-size:12px;
  font-weight:normal;
}

.footer-actions{
  margin-top:22px;
}

@media(max-width:760px){

  body{
    padding:12px;
  }

  .filter-box{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .leaderboard-item{
    grid-template-columns:52px minmax(0,1fr) 76px;
    gap:8px;
    padding:15px 10px;
  }
}

@media(max-width:480px){

  body{
    padding:8px;
  }

  .top-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .top-action-link{
    min-width:0;
    padding:10px 8px;
  }

  .semester-card{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    text-align:center;
  }

  .semester-select{
    width:100%;
  }

  .filter-box{
    grid-template-columns:1fr;
  }

  .filter-button.all-button{
    grid-column:auto;
  }

  .leaderboard-item{
    grid-template-columns:42px minmax(0,1fr) 60px;
    gap:6px;
    padding:13px 7px;
  }

  .record-detail{
    font-size:11px;
  }

  .record-date{
    display:none;
  }
}
</style>
</head>

<body>

<main class="container">

<header class="header">

<h1>
🏆 遊戲排行榜
</h1>

<p class="subtitle">
查看各學期、各遊戲的高手排行。<br>
每一個排行榜最多顯示前 20 名。
</p>

<div class="ranking-rule">
固定題數遊戲：分數較高優先，同分時完成時間較短者優先。
</div>

<div
  id="userStatus"
  class="user-box"
>
正在確認登入狀態……
</div>

</header>


<nav
  class="top-actions"
  aria-label="排行榜快速導覽"
>

<a
  class="top-action-link home"
  href="index.html"
>
🏠 回到首頁
</a>

<a
  class="top-action-link scores"
  href="my-scores.html"
>
📊 我的成績
</a>

</nav>


<section class="semester-card">

<label
  class="semester-label"
  for="semesterSelect"
>
📚 選擇學期
</label>

<select
  id="semesterSelect"
  class="semester-select"
>

<option value="grade7-first">
七年級上學期
</option>

<option value="grade7-second">
七年級下學期
</option>

<option value="grade8-first">
八年級上學期
</option>

<option value="grade8-second">
八年級下學期
</option>

<option value="grade9-first">
九年級上學期
</option>

<option value="grade9-second">
九年級下學期
</option>

</select>

</section>


<section class="leaderboard-card">

<h2
  id="filterTitle"
  class="filter-title"
>
七年級上學期排行榜
</h2>

<nav
  id="filterBox"
  class="filter-box"
  aria-label="排行榜遊戲篩選"
></nav>

<div
  id="loadingMessage"
  class="loading"
>
排行榜載入中……
</div>

<div
  id="errorMessage"
  class="error-message"
  hidden
></div>

<div
  id="emptyMessage"
  class="empty-message"
  hidden
>
目前尚無排行榜紀錄。
</div>

<ol
  id="leaderboardList"
  class="leaderboard-list"
></ol>

</section>


<nav
  class="footer-actions"
  aria-label="排行榜底部導覽"
>

<a
  class="action-link"
  href="index.html"
>
🏠 回到首頁
</a>

<a
  class="action-link scores"
  href="my-scores.html"
>
📊 我的成績
</a>

</nav>

</main>


<script
  type="module"
  src="js/leaderboard.js?v=8.4"
></script>

</body>
</html>
