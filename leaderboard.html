<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    遊戲排行榜｜數學遊戲樂園
  </title>


  <style>

    /*
    ==================================================
    基本設定
    ==================================================
    */

    * {
      box-sizing: border-box;
    }


    :root {

      --blue:
        #1565c0;

      --blue-dark:
        #0d47a1;

      --blue-light:
        #eef5ff;

      --orange:
        #f57c00;

      --orange-dark:
        #e65100;

      --gray:
        #607d8b;

      --gray-dark:
        #455a64;

      --text:
        #334155;

      --muted:
        #64748b;

      --border:
        #dbe4ee;

      --shadow:
        0 12px 30px
        rgba(
          15,
          23,
          42,
          0.10
        );
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #fff8e1
        );
    }


    button,
    select,
    a {

      font-family: inherit;

      -webkit-tap-highlight-color:
        transparent;
    }


    button {

      touch-action:
        manipulation;
    }


    [hidden] {

      display:
        none !important;
    }


    /*
    ==================================================
    主容器
    ==================================================
    */

    .container {

      width: 100%;

      max-width:
        980px;

      margin:
        0 auto;
    }


    /*
    ==================================================
    頁首
    ==================================================
    */

    .header {

      margin-bottom:
        18px;

      padding:
        30px 22px;

      border-radius:
        24px;

      background:
        white;

      text-align:
        center;

      box-shadow:
        var(--shadow);
    }


    .header h1 {

      margin:
        0 0 12px;

      color:
        var(--blue);

      font-size:
        clamp(
          31px,
          5vw,
          42px
        );
    }


    .subtitle {

      margin: 0;

      color:
        #666;

      font-size:
        17px;

      line-height:
        1.75;
    }


    .ranking-rule {

      display:
        inline-block;

      margin-top:
        18px;

      padding:
        10px 15px;

      border-radius:
        12px;

      background:
        #f8fafc;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        bold;

      line-height:
        1.65;
    }


    /*
    ==================================================
    使用者
    ==================================================
    */

    .user-box {

      margin-top:
        18px;

      padding:
        13px 16px;

      border-radius:
        13px;

      background:
        var(--blue-light);

      color:
        #174a7e;

      font-size:
        17px;

      font-weight:
        bold;
    }


    /*
    ==================================================
    ★ 上方快速導覽
    ==================================================
    */

    .top-actions {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        12px;

      margin-bottom:
        18px;

      padding:
        14px 16px;

      border-radius:
        18px;

      background:
        rgba(
          255,
          255,
          255,
          0.82
        );

      box-shadow:
        0 8px 22px
        rgba(
          15,
          23,
          42,
          0.08
        );
    }


    .top-action-link {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        6px;

      min-width:
        150px;

      min-height:
        46px;

      padding:
        11px 20px;

      border-radius:
        13px;

      color:
        white;

      text-decoration:
        none;

      font-size:
        16px;

      font-weight:
        bold;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }


    .top-action-link.home {

      background:
        var(--gray);

      box-shadow:
        0 4px 0
        var(--gray-dark);
    }


    .top-action-link.scores {

      background:
        var(--orange);

      box-shadow:
        0 4px 0
        var(--orange-dark);
    }


    .top-action-link:hover {

      transform:
        translateY(-1px);

      opacity:
        .92;
    }


    .top-action-link:active {

      transform:
        translateY(1px);
    }


    /*
    ==================================================
    學期選擇
    ==================================================
    */

    .semester-card {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        14px;

      margin-bottom:
        18px;

      padding:
        18px 20px;

      border-radius:
        20px;

      background:
        white;

      box-shadow:
        var(--shadow);
    }


    .semester-label {

      color:
        #334155;

      font-size:
        17px;

      font-weight:
        bold;
    }


    .semester-select {

      width:
        min(
          270px,
          100%
        );

      min-height:
        48px;

      padding:
        9px 14px;

      border:
        2px solid
        #90caf9;

      border-radius:
        12px;

      background:
        white;

      color:
        #174a7e;

      font-size:
        16px;

      font-weight:
        bold;

      outline:
        none;
    }


    .semester-select:focus {

      border-color:
        var(--blue);

      box-shadow:
        0 0 0 3px
        rgba(
          21,
          101,
          192,
          0.12
        );
    }


    /*
    ==================================================
    排行榜主卡片
    ==================================================
    */

    .leaderboard-card {

      overflow:
        hidden;

      padding:
        20px;

      border-radius:
        24px;

      background:
        white;

      box-shadow:
        var(--shadow);
    }


    .filter-title {

      margin:
        2px 0 18px;

      color:
        #334155;

      text-align:
        center;

      font-size:
        21px;
    }


    /*
    ==================================================
    遊戲篩選
    ==================================================
    */

    .filter-box {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;

      margin-bottom:
        22px;
    }


    .filter-button {

      min-height:
        50px;

      padding:
        10px 14px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        12px;

      background:
        white;

      color:
        #475569;

      font-size:
        15px;

      font-weight:
        bold;

      cursor:
        pointer;

      transition:
        .15s ease;
    }


    .filter-button:hover {

      border-color:
        var(--blue);

      color:
        var(--blue);

      transform:
        translateY(-1px);
    }


    .filter-button.active {

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    /*
    全部遊戲
    */


    .filter-button.all-button {

      grid-column:
        1 / -1;

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    /*
    如果使用者點別的遊戲，
    JS 會把 active 拿掉，
    所以 all-button 也必須能回到一般狀態
    */

    .filter-button.all-button:not(.active) {

      background:
        white;

      color:
        var(--blue);
    }


    /*
    ==================================================
    載入 / 錯誤 / 無資料
    ==================================================
    */

    .loading,
    .empty-message,
    .error-message {

      padding:
        38px 20px;

      text-align:
        center;

      font-size:
        17px;

      line-height:
        1.8;
    }


    .loading {

      color:
        var(--blue);
    }


    .empty-message {

      color:
        var(--muted);
    }


    .error-message {

      color:
        #c62828;
    }


    /*
    ==================================================
    遊戲排行榜清單
    ==================================================
    */

    .leaderboard-list {

      display:
        grid;

      gap:
        20px;

      margin: 0;

      padding: 0;

      list-style:
        none;
    }


    /*
    ==================================================
    單一遊戲
    ==================================================
    */

    .leaderboard-game-section {

      overflow:
        hidden;

      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      background:
        white;
    }


    .leaderboard-game-title {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      margin: 0;

      padding:
        17px 18px;

      background:
        var(--blue-light);

      color:
        var(--blue);

      font-size:
        20px;

      font-weight:
        bold;
    }


    .leaderboard-game-icon {

      font-size:
        23px;
    }


    /*
    ==================================================
    模式頁籤
    ==================================================
    */

    .leaderboard-mode-tabs {

      display:
        flex;

      gap:
        8px;

      padding:
        14px 14px 4px;

      overflow-x:
        auto;

      -webkit-overflow-scrolling:
        touch;
    }


    .leaderboard-mode-tab {

      flex-shrink:
        0;

      min-height:
        42px;

      padding:
        8px 15px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        11px;

      background:
        white;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        bold;

      cursor:
        pointer;
    }


    .leaderboard-mode-tab.active {

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    .leaderboard-single-title,
    .leaderboard-mode-heading {

      margin:
        16px 18px 9px;

      color:
        #334155;

      font-size:
        17px;

      font-weight:
        bold;
    }


    .leaderboard-mode-empty {

      padding:
        30px 20px;

      color:
        #64748b;

      text-align:
        center;

      line-height:
        1.7;
    }


    /*
    ==================================================
    排行卡
    ==================================================
    */

    .leaderboard-ranking-list {

      margin: 0;

      padding: 0;

      list-style:
        none;
    }


    .leaderboard-item {

      display:
        grid;

      grid-template-columns:
        70px
        minmax(
          0,
          1fr
        )
        100px;

      gap:
        12px;

      align-items:
        center;

      padding:
        17px 18px;

      border-top:
        1px solid
        #eeeeee;
    }


    .leaderboard-item.current-user {

      background:
        #fff8e1;

      border-left:
        6px solid
        #ffb300;
    }


    /*
    ==================================================
    名次
    ==================================================
    */

    .rank {

      text-align:
        center;

      font-size:
        24px;

      font-weight:
        bold;
    }


    /*
    ==================================================
    玩家
    ==================================================
    */

    .player-info {

      min-width: 0;
    }


    .player-name {

      margin-bottom:
        5px;

      overflow:
        hidden;

      color:
        #333;

      font-size:
        18px;

      font-weight:
        bold;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }


    .record-detail {

      color:
        #64748b;

      font-size:
        13px;

      line-height:
        1.7;
    }


    .leaderboard-play-duration {

      color:
        #0288d1;

      font-weight:
        bold;
    }


    .record-date {

      margin-top:
        3px;

      color:
        #94a3b8;

      font-size:
        12px;
    }


    /*
    ==================================================
    分數
    ==================================================
    */

    .score {

      text-align:
        center;

      color:
        var(--orange);

      font-size:
        25px;

      font-weight:
        bold;
    }


    .score-label {

      margin-top:
        2px;

      color:
        #888;

      font-size:
        12px;

      font-weight:
        normal;
    }


    /*
    ==================================================
    底部導覽
    ==================================================
    */

    .footer-actions {

      display:
        flex;

      justify-content:
        center;

      gap:
        12px;

      margin-top:
        22px;

      flex-wrap:
        wrap;
    }


    .action-link {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        150px;

      min-height:
        46px;

      padding:
        11px 20px;

      border-radius:
        12px;

      background:
        var(--gray);

      color:
        white;

      text-decoration:
        none;

      font-size:
        15px;

      font-weight:
        bold;
    }


    .action-link.scores {

      background:
        var(--orange);
    }


    .action-link:hover {

      opacity:
        .9;
    }


    /*
    ==================================================
    平板
    ==================================================
    */

    @media (
      max-width:
        760px
    ) {

      body {

        padding:
          12px;
      }


      .header {

        padding:
          24px 16px;
      }


      .top-actions {

        padding:
          12px;
      }


      .semester-card {

        padding:
          16px;
      }


      .leaderboard-card {

        padding:
          16px 12px;
      }


      .filter-box {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .leaderboard-item {

        grid-template-columns:
          52px
          minmax(
            0,
            1fr
          )
          76px;

        gap:
          8px;

        padding:
          15px 10px;
      }


      .rank {

        font-size:
          21px;
      }


      .player-name {

        font-size:
          16px;
      }


      .score {

        font-size:
          21px;
      }
    }


    /*
    ==================================================
    手機
    ==================================================
    */

    @media (
      max-width:
        480px
    ) {

      body {

        padding:
          8px;
      }


      .header {

        border-radius:
          18px;
      }


      .header h1 {

        font-size:
          28px;
      }


      .subtitle {

        font-size:
          14px;
      }


      .ranking-rule {

        font-size:
          12px;
      }


      /*
      上方兩個按鈕仍同一排
      */

      .top-actions {

        display:
          grid;

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );

        gap:
          8px;
      }


      .top-action-link {

        min-width: 0;

        padding:
          10px 8px;

        font-size:
          14px;
      }


      /*
      學期
      */

      .semester-card {

        display:
          grid;

        grid-template-columns:
          1fr;

        gap:
          8px;

        text-align:
          center;
      }


      .semester-select {

        width: 100%;
      }


      /*
      遊戲按鈕
      */

      .filter-box {

        grid-template-columns:
          1fr;
      }


      .filter-button.all-button {

        grid-column:
          auto;
      }


      /*
      排行卡
      */

      .leaderboard-item {

        grid-template-columns:
          42px
          minmax(
            0,
            1fr
          )
          60px;

        gap:
          6px;

        padding:
          13px 7px;
      }


      .rank {

        font-size:
          18px;
      }


      .player-name {

        font-size:
          15px;
      }


      .record-detail {

        font-size:
          11px;
      }


      .record-date {

        display:
          none;
      }


      .score {

        font-size:
          19px;
      }


      /*
      底部
      */

      .footer-actions {

        display:
          grid;

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .action-link {

        min-width: 0;

        padding:
          10px 8px;

        font-size:
          14px;
      }
    }

  </style>

</head>


<body>


  <main class="container">


    <!--
    ==================================================
    頁首
    ==================================================
    -->

    <header class="header">


      <h1>
        🏆 遊戲排行榜
      </h1>


      <p class="subtitle">

        查看各學期、各遊戲的高手排行。<br>

        每一個排行榜最多顯示前 20 名。

      </p>


      <div class="ranking-rule">

        固定題數遊戲：
        分數較高優先，同分時完成時間較短者優先。

      </div>


      <div
        id="userStatus"
        class="user-box"
      >

        正在確認登入狀態……

      </div>


    </header>


    <!--
    ==================================================
    ★ 上方快速導覽
    跟「我的成績」相同邏輯
    ==================================================
    -->

    <nav
      class="top-actions"
      aria-label="排行榜快速導覽"
    >


      <a
        class="top-action-link home"
        href="index.html"
      >

        🏠 回到首頁

      </a>


      <a
        class="top-action-link scores"
        href="my-scores.html"
      >

        📊 我的成績

      </a>


    </nav>


    <!--
    ==================================================
    學期選擇
    ==================================================
    -->

    <section class="semester-card">


      <label
        class="semester-label"
        for="semesterSelect"
      >

        📚 選擇學期

      </label>


      <select
        id="semesterSelect"
        class="semester-select"
      >


        <option
          value="grade7-first"
        >

          七年級上學期

        </option>


        <option
          value="grade7-second"
        >

          七年級下學期

        </option>


        <option
          value="grade8-first"
        >

          八年級上學期

        </option>
        <option value="grade8-second">八年級下學期</option>
        <option value="grade9-first">九年級上學期</option>
        <option value="grade9-second">九年級下學期</option>


      </select>


    </section>


    <!--
    ==================================================
    排行榜主區
    ==================================================
    -->

    <section class="leaderboard-card">


      <h2
        id="filterTitle"
        class="filter-title"
      >

        七年級上學期排行榜

      </h2>


      <!--
      ==================================================
      JS 自動建立遊戲篩選按鈕
      ==================================================
      -->

      <nav
        id="filterBox"
        class="filter-box"
        aria-label="排行榜遊戲篩選"
      ></nav>


      <!--
      ==================================================
      載入中
      ==================================================
      -->

      <div
        id="loadingMessage"
        class="loading"
      >

        排行榜載入中……

      </div>


      <!--
      ==================================================
      錯誤
      ==================================================
      -->

      <div
        id="errorMessage"
        class="error-message"
        hidden
      ></div>


      <!--
      ==================================================
      無資料
      ==================================================
      -->

      <div
        id="emptyMessage"
        class="empty-message"
        hidden
      >

        目前尚無排行榜紀錄。

      </div>


      <!--
      ==================================================
      排行榜
      leaderboard.js 會建立內容
      ==================================================
      -->

      <ol
        id="leaderboardList"
        class="leaderboard-list"
      ></ol>


    </section>


    <!--
    ==================================================
    底部仍保留快速導覽
    ==================================================
    -->

    <nav
      class="footer-actions"
      aria-label="排行榜底部導覽"
    >


      <a
        class="action-link"
        href="index.html"
      >

        🏠 回到首頁

      </a>


      <a
        class="action-link scores"
        href="my-scores.html"
      >

        📊 我的成績

      </a>


    </nav>


  </main>


  <!--
  ==================================================
  排行榜程式

  使用 leaderboard.js v8.8｜七下 1-1／1-2／1-3 同步版
  ==================================================
  -->

  <script
    type="module"
    src="js/leaderboard.js?v=8.8"
  ></script>


</body>

</html>
