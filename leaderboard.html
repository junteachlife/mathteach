<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    遊戲排行榜｜數學遊戲樂園
  </title>


  <style>

    /*
    ==================================================
    基本設定
    ==================================================
    */

    * {
      box-sizing: border-box;
    }


    :root {

      --blue:
        #1565c0;

      --blue-dark:
        #0d47a1;

      --blue-light:
        #eef5ff;

      --orange:
        #f57c00;

      --orange-dark:
        #e65100;

      --gray:
        #607d8b;

      --gray-dark:
        #455a64;

      --text:
        #334155;

      --muted:
        #64748b;

      --border:
        #dbe4ee;

      --shadow:
        0 12px 30px
        rgba(
          15,
          23,
          42,
          0.10
        );
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #fff8e1
        );
    }


    button,
    select,
    a {

      font-family: inherit;

      -webkit-tap-highlight-color:
        transparent;
    }


    button {

      touch-action:
        manipulation;
    }


    [hidden] {

      display:
        none !important;
    }


    /*
    ==================================================
    主容器
    ==================================================
    */

    .container {

      width: 100%;

      max-width:
        980px;

      margin:
        0 auto;
    }


    /*
    ==================================================
    頁首
    ==================================================
    */

    .header {

      margin-bottom:
        18px;

      padding:
        30px 22px;

      border-radius:
        24px;

      background:
        white;

      text-align:
        center;

      box-shadow:
        var(--shadow);
    }


    .header h1 {

      margin:
        0 0 12px;

      color:
        var(--blue);

      font-size:
        clamp(
          31px,
          5vw,
          42px
        );
    }


    .subtitle {

      margin: 0;

      color:
        #666;

      font-size:
        17px;

      line-height:
        1.75;
    }


    .ranking-rule {

      display:
        inline-block;

      margin-top:
        18px;

      padding:
        10px 15px;

      border-radius:
        12px;

      background:
        #f8fafc;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        bold;

      line-height:
        1.65;
    }


    /*
    ==================================================
    使用者
    ==================================================
    */

    .user-box {

      margin-top:
        18px;

      padding:
        13px 16px;

      border-radius:
        13px;

      background:
        var(--blue-light);

      color:
        #174a7e;

      font-size:
        17px;

      font-weight:
        bold;
    }


    /*
    ==================================================
    ★ 上方快速導覽
    ==================================================
    */

    .top-actions {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        12px;

      margin-bottom:
        18px;

      padding:
        14px 16px;

      border-radius:
        18px;

      background:
        rgba(
          255,
          255,
          255,
          0.82
        );

      box-shadow:
        0 8px 22px
        rgba(
          15,
          23,
          42,
          0.08
        );
    }


    .top-action-link {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        6px;

      min-width:
        150px;

      min-height:
        46px;

      padding:
        11px 20px;

      border-radius:
        13px;

      color:
        white;

      text-decoration:
        none;

      font-size:
        16px;

      font-weight:
        bold;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }


    .top-action-link.home {

      background:
        var(--gray);

      box-shadow:
        0 4px 0
        var(--gray-dark);
    }


    .top-action-link.scores {

      background:
        var(--orange);

      box-shadow:
        0 4px 0
        var(--orange-dark);
    }


    .top-action-link:hover {

      transform:
        translateY(-1px);

      opacity:
        .92;
    }


    .top-action-link:active {

      transform:
        translateY(1px);
    }


    /*
    ==================================================
    學期選擇
    ==================================================
    */

    .semester-card {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        14px;

      margin-bottom:
        18px;

      padding:
        18px 20px;

      border-radius:
        20px;

      background:
        white;

      box-shadow:
        var(--shadow);
    }


    .semester-label {

      color:
        #334155;

      font-size:
        17px;

      font-weight:
        bold;
    }


    .semester-select {

      width:
        min(
          270px,
          100%
        );

      min-height:
        48px;

      padding:
        9px 14px;

      border:
        2px solid
        #90caf9;

      border-radius:
        12px;

      background:
        white;

      color:
        #174a7e;

      font-size:
        16px;

      font-weight:
        bold;

      outline:
        none;
    }


    .semester-select:focus {

      border-color:
        var(--blue);

      box-shadow:
        0 0 0 3px
        rgba(
          21,
          101,
          192,
          0.12
        );
    }


    /*
    ==================================================
    排行榜主卡片
    ==================================================
    */

    .leaderboard-card {

      overflow:
        hidden;

      padding:
        20px;

      border-radius:
        24px;

      background:
        white;

      box-shadow:
        var(--shadow);
    }


    .filter-title {

      margin:
        2px 0 18px;

      color:
        #334155;

      text-align:
        center;

      font-size:
        21px;
    }


    /*
    ==================================================
    遊戲篩選
    ==================================================
    */

    .filter-box {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;

      margin-bottom:
        22px;
    }


    .filter-button {

      min-height:
        50px;

      padding:
        10px 14px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        12px;

      background:
        white;

      color:
        #475569;

      font-size:
        15px;

      font-weight:
        bold;

      cursor:
        pointer;

      transition:
        .15s ease;
    }


    .filter-button:hover {

      border-color:
        var(--blue);

      color:
        var(--blue);

      transform:
        translateY(-1px);
    }


    .filter-button.active {

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    /*
    全部遊戲
    */


    .filter-button.all-button {

      grid-column:
        1 / -1;

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    /*
    如果使用者點別的遊戲，
    JS 會把 active 拿掉，
    所以 all-button 也必須能回到一般狀態
    */

    .filter-button.all-button:not(.active) {

      background:
        white;

      color:
        var(--blue);
    }


    /*
    ==================================================
    載入 / 錯誤 / 無資料
    ==================================================
    */

    .loading,
    .empty-message,
    .error-message {

      padding:
        38px 20px;

      text-align:
        center;

      font-size:
        17px;

      line-height:
        1.8;
    }


    .loading {

      color:
        var(--blue);
    }


    .empty-message {

      color:
        var(--muted);
    }


    .error-message {

      color:
        #c62828;
    }


    /*
    ==================================================
    遊戲排行榜清單
    ==================================================
    */

    .leaderboard-list {

      display:
        grid;

      gap:
        20px;

      margin: 0;

      padding: 0;

      list-style:
        none;
    }


    /*
    ==================================================
    單一遊戲
    ==================================================
    */

    .leaderboard-game-section {

      overflow:
        hidden;

      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      background:
        white;
    }


    .leaderboard-game-title {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      margin: 0;

      padding:
        17px 18px;

      background:
        var(--blue-light);

      color:
        var(--blue);

      font-size:
        20px;

      font-weight:
        bold;
    }


    .leaderboard-game-icon {

      font-size:
        23px;
    }


    /*
    ==================================================
    模式頁籤
    ==================================================
    */

    .leaderboard-mode-tabs {

      display:
        flex;

      gap:
        8px;

      padding:
        14px 14px 4px;

      overflow-x:
        auto;

      -webkit-overflow-scrolling:
        touch;
    }


    .leaderboard-mode-tab {

      flex-shrink:
        0;

      min-height:
        42px;

      padding:
        8px 15px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        11px;

      background:
        white;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        bold;

      cursor:
        pointer;
    }


    .leaderboard-mode-tab.active {

      border-color:
        var(--blue);

      background:
        var(--blue);

      color:
        white;
    }


    .leaderboard-single-title,
    .leaderboard-mode-heading {

      margin:
        16px 18px 9px;

      color:
        #334155;

      font-size:
        17px;

      font-weight:
        bold;
    }


    .leaderboard-mode-empty {

      padding:
        30px 20px;

      color:
        #64748b;

      text-align:
        center;

      line-height:
        1.7;
    }


    /*
    ==================================================
    排行卡
    ==================================================
    */

    .leaderboard-ranking-list {

      margin: 0;

      padding: 0;

      list-style:
        none;
    }


    .leaderboard-item {

      display:
        grid;

      grid-template-columns:
        70px
        minmax(
          0,
          1fr
        )
        100px;

      gap:
        12px;

      align-items:
        center;

      padding:
        17px 18px;

      border-top:
        1px solid
        #eeeeee;
    }


    .leaderboard-item.current-user {

      background:
        #fff8e1;

      border-left:
        6px solid
        #ffb300;
    }


    /*
    ==================================================
    名次
    ==================================================
    */

    .rank {

      text-align:
        center;

      font-size:
        24px;

      font-weight:
        bold;
    }


    /*
    ==================================================
    玩家
    ==================================================
    */

    .player-info {

      min-width: 0;
    }


    .player-name {

      margin-bottom:
        5px;

      overflow:
        hidden;

      color:
        #333;

      font-size:
        18px;
