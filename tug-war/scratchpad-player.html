<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/scratchpad.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}#scratchpadComponent{position:static!important}#scratchpadPanel{inset:0!important;width:100%!important;height:100%!important;max-height:100%!important;border-radius:0!important;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}</style>

<style id="tug-transparent-paper">
/* 僅影響競賽橋接頁，不修改主網站的共用計算紙 */
html,body {background:transparent!important;}
#scratchpadPanel,.scratchpad-panel,.scratchpad-panel--open,.scratchpad-panel--fullscreen {
 background:transparent!important;
 backdrop-filter:none!important;
 -webkit-backdrop-filter:none!important;
 box-shadow:none!important;
}
.scratchpad-canvas-container {background:transparent!important;}
#scratchpadCanvas,.scratchpad-canvas {
 background:transparent!important;
 background-color:transparent!important;
 background-image:none!important;
 border-color:rgba(80,110,150,.18)!important;
}
/* 操作工具保留清晰底色，只有畫布透明 */
/* 小尺寸隊伍卡片的工具列允許捲動／換行，不讓高度擠掉書寫區 */
.scratchpad-header{min-height:42px!important;padding:5px 8px!important;}
.scratchpad-header__title-area{gap:5px!important;}
.scratchpad-toolbar{padding:5px!important;}
.scratchpad-canvas-container{padding:3px!important;}
#scratchpadPanel{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;}
</style>
</head><body>
<script src="../js/scratchpad.js"></script>
<script src="../js/scratchpad-template.js"></script>
<script>
window.addEventListener('message',function(e){
 if(e.origin!==location.origin||!e.data?.tugPaperAction)return;
 const cmd=e.data.tugPaperAction;
 if(cmd==='open' && typeof window.openGameScratchpad==='function')window.openGameScratchpad();
 if(cmd==='reset' && typeof window.resetGameScratchpad==='function')window.resetGameScratchpad();
 if(cmd==='close' && typeof window.closeGameScratchpad==='function')window.closeGameScratchpad();
});
// 原始共用計算紙自帶的「關閉計算紙」按鈕也通知競賽頁解除遮罩。
document.addEventListener('click', function(e){
 const closeButton=e.target.closest?.('#scratchpadCloseButton');
 if(closeButton) parent.postMessage({tugPaperAction:'close'},location.origin);
}, true);
// 避免其餘工具的事件或焦點影響競賽頁；關閉只能由這個明確訊息觸發。
// 通知父頁：元件已準備，可安全開啟
window.addEventListener('load',()=>parent.postMessage({tugPaperAction:'ready'},location.origin));
</script>
</body></html>
