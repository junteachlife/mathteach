<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/scratchpad.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#scratchpadComponent{position:static!important}
#scratchpadPanel{inset:0!important;width:100%!important;height:100%!important;max-height:100%!important;border-radius:0!important;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
/* 僅影響競賽橋接頁，不修改主網站的共用計算紙 */
.scratchpad-panel,.scratchpad-panel--open,.scratchpad-panel--fullscreen{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.scratchpad-header{min-height:38px!important;padding:4px 8px!important}
.scratchpad-header__title-area{gap:4px!important}
.scratchpad-toolbar{padding:5px 6px!important;overflow-x:auto!important;white-space:nowrap!important}
.scratchpad-toolbar > *{flex-shrink:0}
.scratchpad-canvas-container{padding:0!important;background:transparent!important;flex:1 1 auto!important;min-height:0!important}
#scratchpadCanvas,.scratchpad-canvas{background:transparent!important;background-color:transparent!important;background-image:none!important;border-color:rgba(80,110,150,.15)!important}
#scratchpadPanel{display:flex!important;flex-direction:column!important}
</style>
</head><body>
<script src="../js/scratchpad.js"></script>
<script src="../js/scratchpad-template.js"></script>
<script>
window.addEventListener('message',function(e){
 if(e.origin!==location.origin||!e.data?.tugPaperAction)return;
 const cmd=e.data.tugPaperAction;
 if(cmd==='open' && typeof window.openGameScratchpad==='function')window.openGameScratchpad();
 if(cmd==='reset' && typeof window.resetGameScratchpad==='function')window.resetGameScratchpad();
 if(cmd==='close' && typeof window.closeGameScratchpad==='function')window.closeGameScratchpad();
});
document.addEventListener('click', function(e){
 const closeButton=e.target.closest?.('#scratchpadCloseButton');
 if(closeButton) parent.postMessage({tugPaperAction:'close'},location.origin);
}, true);
window.addEventListener('load',()=>parent.postMessage({tugPaperAction:'ready'},location.origin));
</script>
</body></html>
