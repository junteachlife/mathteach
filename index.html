<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 網站分頁圖示 -->
  <link
    rel="icon"
    type="image/png"
    href="./favicon.png?v=20260825"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="./favicon.png?v=20260825"
  >

  <link
    rel="apple-touch-icon"
    href="./favicon.png?v=20260825"
  >

  <meta
    name="theme-color"
    content="#083770"
  >

  <title>
    生活有解．心中有數
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #1976d2;
      --primary-dark: #125ca6;

      --secondary: #f57c00;
      --secondary-dark: #d86600;

      --success: #2e7d32;
      --danger: #e53935;

      --text: #1f2937;
      --muted: #64748b;

      --border: #dce7f5;

    }


    body {

      min-height: 100vh;

      margin: 0;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e8f2ff,
          #fff8e8
        );

    }


    button,
    select {
      font-family: inherit;
    }


    a {
      color: inherit;
    }


    /*
    ==================================================
    整體寬度
    ==================================================
    */


    .page-container {

      width: 100%;

      max-width: 1500px;

      margin:
        0 auto;

      padding:
        28px 26px 60px;

    }


    /*
    ==================================================
    ★ 新版首頁左右配置

    左側：40% 資訊區
    右側：60% 遊戲區
    ==================================================
    */


    .home-layout {

      display: grid;

      grid-template-columns:
        minmax(330px, 40fr)
        minmax(0, 60fr);

      align-items: start;

      gap: 26px;

    }


    .info-column,
    .game-column {

      min-width: 0;

    }


    /*
    左側資訊欄固定在畫面上方附近。

    電腦長頁面瀏覽遊戲時，
    左側資訊不會一下就完全消失。
    */


    .info-column {

      position: sticky;

      top: 18px;

      align-self: start;

    }


    /*
    ==================================================
    共用按鈕
    ==================================================
    */


    .button {

      display: inline-block;

      min-width: 132px;

      padding:
        12px 22px;

      border: 0;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      text-align: center;

      text-decoration: none;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);

    }


    .button:active {

      transform:
        translateY(4px);

      box-shadow:
        0 1px 0
        var(--primary-dark);

    }


    /*
    ==================================================
    左側資訊總卡
    ==================================================
    */


    .info-stack {

      display: grid;

      gap: 18px;

    }


    /*
    ==================================================
    網站資訊
    ==================================================
    */


    .dashboard {

      display: grid;

      grid-template-columns: 1fr;

      gap: 16px;

      padding: 20px;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          .94
        );

      box-shadow:
        0 12px 30px
        rgba(
          15,
          23,
          42,
          .10
        );

    }


    .dashboard-brand {

      display: flex;

      flex-direction: column;

      justify-content: center;

      min-width: 0;

    }


    .dashboard-title-row {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 8px;

    }


    .dashboard-logo {

      width: 48px;

      height: 48px;

      flex:
        0 0 48px;

    }


    .dashboard-logo img {

      display: block;

      width: 48px;

      height: 48px;

      object-fit: contain;

      border-radius: 10px;

    }


    .dashboard-title {

      margin: 0;

      color: #174f8f;

      font-size:
        clamp(
          25px,
          2.2vw,
          34px
        );

      font-weight: 900;

      letter-spacing: 1px;

    }


    .dashboard-subtitle {

      margin:
        0 0 14px;

      color:
        #64748b;

      font-size: 14px;

      line-height: 1.65;

    }


    /*
    ==================================================
    登入狀態
    ==================================================
    */


    .compact-user-box {

      min-height: 68px;

      display: flex;

      align-items: center;

      gap: 12px;

      padding:
        12px 14px;

      border:
        1px solid
        #cfe0f7;

      border-radius: 16px;

      background:
        #f4f8ff;

      color:
        #174a7e;

    }


    .compact-user-box img {

      width: 44px;

      height: 44px;

      flex:
        0 0 44px;

      border:
        2px solid
        #dbeafe;

      border-radius: 50%;

      object-fit: cover;

    }


    .compact-user-text {

      min-width: 0;

    }


    .compact-user-name {

      color:
        #174f8f;

      font-size: 16px;

      font-weight: 900;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .compact-user-email {

      margin-top: 3px;

      color:
        #64748b;

      font-size: 13px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .compact-auth-actions {

      display: flex;

      justify-content: center;

      margin-top: 10px;

    }


    .compact-auth-button {

      min-width: 112px;

      padding:
        10px 18px;

      border: 0;

      border-radius: 12px;

      color: white;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 4px 0
        rgba(
          0,
          0,
          0,
          .16
        );

    }


    .compact-login-button {
      background: #1976d2;
    }


    .compact-logout-button {
      background: #ef4444;
    }


    /*
    ==================================================
    排行榜／我的成績
    ==================================================
    */


    .dashboard-links {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

    }


    .dashboard-link-card {

      display: grid;

      grid-template-columns:
        48px 1fr;

      gap: 10px;

      align-items: center;

      min-height: 82px;

      padding:
        12px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 18px;

      background: white;

      text-decoration: none;

      transition:
        transform .15s ease,
        box-shadow .15s ease;

    }


    .dashboard-link-card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 20px
        rgba(
          15,
          23,
          42,
          .08
        );

    }


    .dashboard-link-icon {

      width: 48px;

      height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      font-size: 25px;

    }


    .dashboard-link-icon.rank {
      background: #fff3db;
    }


    .dashboard-link-icon.scores {
      background: #eaf7ec;
    }


    .dashboard-link-title {

      margin-bottom: 3px;

      color:
        #174f8f;

      font-size: 16px;

      font-weight: 900;

    }


    .dashboard-link-text {

      color:
        #64748b;

      font-size: 12px;

      line-height: 1.45;

    }


    /*
    ==================================================
    公告欄
    ==================================================
    */


    .news-area {

      display: grid;

      gap: 18px;

    }


    .announcement-board {

      position: relative;

      overflow: hidden;

      padding:
        20px 20px;

      border:
        2px solid
        #f7c66a;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #fff8df,
          #fffdf6
        );

      box-shadow:
        0 10px 26px
        rgba(
          120,
          72,
          0,
          .10
        );

    }


    .announcement-board::before {

      content: "";

      position: absolute;

      top: 0;

      left: 0;

      width: 8px;

      height: 100%;

      background:
        #f59e0b;

    }


    .announcement-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;

    }


    .announcement-heading {

      margin: 0;

      color:
        #92400e;

      font-size: 20px;

      font-weight: 900;

    }


    .announcement-date {

      color:
        #9a6b24;

      font-size: 12px;

      font-weight: 800;

      white-space: nowrap;

    }


    .announcement-badge {

      display: inline-flex;

      padding:
        5px 10px;

      margin-bottom: 10px;

      border:
        1px solid
        #fdba74;

      border-radius: 999px;

      background:
        #fff7ed;

      color:
        #c2410c;

      font-size: 12px;

      font-weight: 900;

    }


    .announcement-title {

      margin:
        0 0 8px;

      color:
        #7c2d12;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.5;

    }


    .announcement-content {

      margin: 0;

      color:
        #6b4f2b;

      font-size: 14px;

      line-height: 1.7;

    }


    /*
    ==================================================
    最新消息
    ==================================================
    */


    .latest-news-box {

      margin-top: 0;

      padding: 18px;

      border:
        1px solid
        #dbe7f5;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          .94
        );

      box-shadow:
        0 10px 26px
        rgba(
          15,
          23,
          42,
          .08
        );

    }


    .latest-news-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 12px;

    }


    .latest-news-title {

      margin: 0;

      color:
        #174f8f;

      font-size: 19px;

      font-weight: 900;

    }


    .latest-news-subtitle {

      color:
        #64748b;

      font-size: 11px;

      font-weight: 700;

    }


    .latest-news-list {

      display: grid;

      gap: 9px;

    }


    .news-item {

      display: grid;

      grid-template-columns:
        38px
        1fr;

      gap: 10px;

      align-items: center;

      padding:
        11px 12px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      background: white;

    }


    .news-icon {

      width: 38px;

      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 11px;

      background:
        #f1f5f9;

      font-size: 20px;

    }


    .news-item-title {

      color:
        #1f2937;

      font-size: 14px;

      font-weight: 900;

    }


    .news-item-content {

      margin-top: 3px;

      color:
        #64748b;

      font-size: 12px;

      line-height: 1.5;

    }


    .news-date {

      grid-column: 2;

      color:
        #94a3b8;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;

    }


    .news-type {

      display: inline-flex;

      padding:
        3px 7px;

      margin-bottom: 4px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 900;

    }


    .news-type.new-game {

      background:
        #ecfdf5;

      color:
        #047857;

    }


    .news-type.system {

      background:
        #eff6ff;

      color:
        #1d4ed8;

    }


    .news-type.game-update {

      background:
        #f5f3ff;

      color:
        #6d28d9;

    }


    .news-type.notice {

      background:
        #fff7ed;

      color:
        #c2410c;

    }


    .news-empty {

      padding: 20px;

      color:
        #64748b;

      text-align: center;

      font-weight: 700;

    }


    /*
    ==================================================
    右側：選擇遊戲
    ==================================================
    */


    .section {

      margin-top: 0;

    }


    .section-header {

      display: flex;

      align-items: end;

      justify-content: space-between;

      gap: 16px;

      margin-bottom: 20px;

    }


    .section-title {

      margin: 0;

      font-size: 28px;

    }


    .section-description {

      margin: 0;

      color:
        var(--muted);

      font-size: 14px;

      text-align: right;

    }


    /*
    ==================================================
    學期選擇
    ==================================================
    */


    .semester-control {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin-bottom: 24px;

      padding: 18px;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          .82
        );

      box-shadow:
        0 8px 22px
        rgba(
          31,
          41,
          55,
          .08
        );

    }


    .semester-control label {

      color:
        #174f8f;

      font-size: 17px;

      font-weight: 900;

    }


    .semester-select {

      min-width: 240px;

      padding:
        12px 16px;

      border:
        2px solid
        #bfdbfe;

      border-radius: 12px;

      background: white;

      color:
        var(--text);

      font-size: 17px;

      font-weight: 800;

      outline: none;

    }


    .semester-select:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(
          25,
          118,
          210,
          .14
        );

    }


    .semester-panel {
      display: none;
    }


    .semester-panel.active {
      display: block;
    }


    .semester-title {

      margin:
        0 0 18px;

      color:
        #174f8f;

      font-size: 24px;

      text-align: center;

    }


    /*
    ==================================================
    遊戲卡牌
    ==================================================
    */


    .games-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 20px;

    }


    .game-card {

      position: relative;

      min-height: 220px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding:
        24px 18px 20px;

      overflow: hidden;

      border:
        2px solid
        var(
          --game-border,
          #dce7f5
        );

      border-top:
        8px solid
        var(
          --game-primary,
          #1976d2
        );

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          var(
            --game-light,
            #ffffff
          ),
          #ffffff 75%
        );

      box-shadow:
        0 10px 28px
        rgba(
          31,
          41,
          55,
          .12
        );

      text-align: center;

    }


    .game-heading {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin-bottom: 10px;

    }


    .game-icon {

      width: 54px;

      height: 54px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex:
        0 0 54px;

      border:
        2px solid
        var(
          --game-border,
          #dce7f5
        );

      border-radius: 17px;

      background:
        var(
          --game-light,
          #eef5ff
        );

      color:
        var(
          --game-primary,
          #1976d2
        );

      font-size: 27px;

    }


    .game-card h2 {

      margin: 0;

      font-size: 20px;

    }


    .game-card p {

      min-height: 46px;

      margin:
        0 0 13px;

      color:
        var(--muted);

      font-size: 14px;

      line-height: 1.65;

    }


    .game-meta {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      min-height: 30px;

      margin-bottom: 14px;

      flex-wrap: wrap;

    }


    .game-meta-badge {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 28px;

      padding:
        5px 10px;

      border:
        1px solid
        var(
          --game-border,
          #dce7f5
        );

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          .92
        );

      color:
        var(
          --game-primary,
          #1976d2
        );

      font-size: 13px;

      font-weight: 900;

    }


    .game-meta-badge.recommended {

      border-color:
        #fdba74;

      background:
        #fff7ed;

      color:
        #c2410c;

    }


    .game-meta-badge.new {

      border-color:
        #86efac;

      background:
        #f0fdf4;

      color:
        #15803d;

    }


    .status-badge {

      display: inline-block;

      margin-bottom: 12px;

      padding:
        6px 11px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 900;

    }


    .status-soon {

      background:
        #f1f5f9;

      color:
        #64748b;

    }


    .start-button {

      background:
        var(
          --game-primary,
          #1976d2
        );

      box-shadow:
        0 5px 0
        var(
          --game-dark,
          #125ca6
        );

    }


    .waiting-button {

      background:
        #7b8794;

      box-shadow:
        0 5px 0
        #56616d;

      opacity: .72;

      cursor: not-allowed;

    }


    /*
    ==================================================
    Footer
    ==================================================
    */


    .page-footer {

      margin-top: 48px;

      padding:
        26px 18px 8px;

      border-top:
        1px solid
        rgba(
          100,
          116,
          139,
          .22
        );

      color:
        #748094;

      text-align: center;

    }


    .footer-brand {

      color:
        #174f8f;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    .footer-author {

      margin-top: 8px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 800;

    }


    .footer-copyright {

      margin-top: 6px;

      color:
        #94a3b8;

      font-size: 12px;

      line-height: 1.6;

    }


    /*
    ==================================================
    ★ 平板

    平板開始恢復上下排列。
    ==================================================
    */


    @media (
      max-width: 1100px
    ) {

      .page-container {

        max-width: 980px;

      }


      .home-layout {

        grid-template-columns: 1fr;

        gap: 30px;

      }


      .info-column {

        position: static;

      }


      /*
      上方資訊區恢復較寬配置
      */


      .dashboard {

        grid-template-columns:
          minmax(0, 1.05fr)
          minmax(300px, .95fr);

        gap: 18px;

      }


      .dashboard-links {

        grid-template-columns: 1fr;

      }


      .dashboard-subtitle {

        margin-left: 60px;

      }


      .news-area {

        grid-template-columns:
          1fr 1fr;

        align-items: start;

      }


      .latest-news-box {

        height: 100%;

      }


      .games-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );

      }

    }


    /*
    ==================================================
    手機／窄平板
    ==================================================
    */


    @media (
      max-width: 760px
    ) {

      .page-container {

        padding:
          18px 12px 45px;

      }


      .home-layout {

        display: block;

      }


      .game-column {

        margin-top: 32px;

      }


      .dashboard {

        grid-template-columns: 1fr;

        padding: 16px;

      }


      .dashboard-subtitle {

        margin-left: 0;

        text-align: center;

      }


      .dashboard-title-row {

        justify-content: center;

      }


      .dashboard-links {

        grid-template-columns:
          1fr 1fr;

      }


      .dashboard-link-card {

        grid-template-columns:
          46px 1fr;

        padding: 12px;

      }


      .dashboard-link-icon {

        width: 46px;

        height: 46px;

        font-size: 24px;

      }


      .dashboard-link-title {

        font-size: 16px;

      }


      .dashboard-link-text {

        font-size: 12px;

      }


      .news-area {

        grid-template-columns: 1fr;

      }


      .announcement-top,
      .latest-news-header {

        align-items: flex-start;

        flex-direction: column;

      }


      .news-item {

        grid-template-columns:
          40px
          1fr;

      }


      .news-date {

        grid-column: 2;

      }


      .section-header {

        display: block;

      }


      .section-description {

        margin-top: 7px;

        text-align: left;

      }


      .semester-control {

        flex-direction: column;

        align-items: stretch;

      }


      .semester-control label {

        text-align: center;

      }


      .semester-select {

        width: 100%;

        min-width: 0;

      }


      .games-grid {

        grid-template-columns: 1fr;

      }


      .game-card {

        min-height: 190px;

        padding:
          20px 16px;

      }


      .game-card p {

        min-height: auto;

      }

    }


  </style>

</head>


<body>


  <main class="page-container">


    <!--
    ==================================================
    ★ 首頁左右雙欄
    ==================================================
    -->


    <div class="home-layout">

    /*
    ==================================================
    日期
    ==================================================
    */


    function formatDate(
      text
    ) {

      const parts =
        String(
          text ||
          ""
        )
          .split(
            "-"
          );


      if (
        parts.length !==
        3
      ) {

        return (
          text ||
          ""
        );
      }


      return (
        `${parts[0]} / ${parts[1]} / ${parts[2]}`
      );

    }


    /*
    ==================================================
    公告安全載入
    ==================================================
    */


    async function loadAnnouncements() {


      const board =
        document.getElementById(
          "announcementBoard"
        );


      const dateElement =
        document.getElementById(
          "announcementDate"
        );


      const badgeElement =
        document.getElementById(
          "announcementBadge"
        );


      const titleElement =
        document.getElementById(
          "announcementTitle"
        );


      const contentElement =
        document.getElementById(
          "announcementContent"
        );


      const newsList =
        document.getElementById(
          "latestNewsList"
        );


      try {


        const module =
          await import(
            "./js/announcements.js?v=2"
          );


        const getImportantAnnouncement =
          module.getImportantAnnouncement;


        const getLatestAnnouncements =
          module.getLatestAnnouncements;


        if (
          typeof getImportantAnnouncement !==
            "function" ||

          typeof getLatestAnnouncements !==
            "function"
        ) {

          throw new Error(
            "announcements.js 匯出格式不正確"
          );

        }


        const important =
          getImportantAnnouncement();


        if (
          important
        ) {


          board.hidden =
            false;


          dateElement.textContent =
            formatDate(
              important.date
            );


          badgeElement.textContent =
            `${important.icon || "📌"} ${
              important.typeName ||
              "最新公告"
            }`;


          titleElement.textContent =
            important.title ||
            "最新公告";


          contentElement.textContent =
            important.content ||
            "";


        } else {


          board.hidden =
            true;

        }


        const latest =
          getLatestAnnouncements(
            4
          );


        if (
          !latest ||
          latest.length ===
          0
        ) {


          newsList.innerHTML = `

            <div class="news-empty">
              目前沒有最新消息。
            </div>

          `;


          return;

        }


        newsList.innerHTML =
          latest
            .map(
              item => `

                <article class="news-item">


                  <div class="news-icon">
                    ${item.icon || "📌"}
                  </div>


                  <div>


                    <span
                      class="news-type ${item.type || "notice"}"
                    >
                      ${
                        item.typeName ||
                        "網站公告"
                      }
                    </span>


                    <div class="news-item-title">
                      ${item.title || ""}
                    </div>


                    <div class="news-item-content">
                      ${item.content || ""}
                    </div>


                  </div>


                  <div class="news-date">

                    ${formatDate(
                      item.date
                    )}

                  </div>


                </article>

              `
            )
            .join(
              ""
            );


      } catch (
        error
      ) {


        console.error(
          "公告載入失敗：",
          error
        );


        board.hidden =
          false;


        dateElement.textContent =
          "";


        badgeElement.textContent =
          "📌 網站公告";


        titleElement.textContent =
          "生活有解．心中有數";


        contentElement.textContent =
          "公告系統暫時無法載入，但數學遊戲仍可正常使用。";


        newsList.innerHTML = `

          <div class="news-empty">
            最新消息暫時無法載入。
          </div>

        `;

      }

    }


    loadAnnouncements();

    /*

    function createGameCard(
      game
    ) {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "game-card";


      const gameTheme =
        game.theme ||
        {};


      card.style.setProperty(
        "--game-primary",
        gameTheme.primary ||
        "#1976D2"
      );


      card.style.setProperty(
        "--game-dark",
        gameTheme.dark ||
        "#125CA6"
      );


      card.style.setProperty(
        "--game-light",
        gameTheme.light ||
        "#E3F2FD"
      );


      card.style.setProperty(
        "--game-border",
        gameTheme.border ||
        "#90CAF9"
      );


      if (
        !game.finished
      ) {


        const status =
          document.createElement(
            "span"
          );


        status.className =
          "status-badge status-soon";


        status.textContent =
          "開發中";


        card.appendChild(
          status
        );

      }


      const heading =
        document.createElement(
          "div"
        );


      heading.className =
        "game-heading";


      const icon =
        document.createElement(
          "div"
        );


      icon.className =
        "game-icon";


      icon.textContent =
        game.icon ||
        "🎮";


      const title =
        document.createElement(
          "h2"
        );


      title.textContent =
        game.name ||
        "數學遊戲";


      heading.append(
        icon,
        title
      );


      const description =
        document.createElement(
          "p"
        );


      description.textContent =
        game.description ||
        "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "game-meta";


      const difficulty =
        Math.min(
          3,
          Math.max(
            1,
            Number(
              game.difficulty
            ) ||
            1
          )
        );


      const difficultyBadge =
        document.createElement(
          "span"
        );


      difficultyBadge.className =
        "game-meta-badge";


      difficultyBadge.textContent =
        "⭐".repeat(
          difficulty
        );


      meta.appendChild(
        difficultyBadge
      );


      if (
        game.recommended
      ) {


        const recommended =
          document.createElement(
            "span"
          );


        recommended.className =
          "game-meta-badge recommended";


        recommended.textContent =
          "🔥 推薦";


        meta.appendChild(
          recommended
        );

      }


      if (
        game.isNew
      ) {


        const newBadge =
          document.createElement(
            "span"
          );


        newBadge.className =
          "game-meta-badge new";


        newBadge.textContent =
          "🆕 NEW";


        meta.appendChild(
          newBadge
        );

      }


      card.append(
        heading,
        description,
        meta
      );


      if (
        game.finished
      ) {


        const link =
          document.createElement(
            "a"
          );


        link.className =
          "button start-button";


        link.href =
          game.file;


        link.textContent =
          "開始挑戰";


        card.appendChild(
          link
        );


      } else {


        const waiting =
          document.createElement(
            "button"
          );


        waiting.className =
          "button waiting-button";


        waiting.type =
          "button";


        waiting.disabled =
          true;


        waiting.textContent =
          "敬請期待";


        card.appendChild(
          waiting
        );

      }


      return card;

    }


    /*
    ==================================================
    依學期取得卡牌
    ==================================================

    function getSemesterGames(
      semester
    ) {


      if (
        semester ===
        "grade8-second"
      ) {

        return GRADE8_SECOND_GAMES;

      }


      if (
        semester ===
        "grade9-first"
      ) {

        return GRADE9_FIRST_GAMES;

      }


      if (
        semester ===
        "grade9-second"
      ) {

        return GRADE9_SECOND_GAMES;

      }


      try {


        return (
          getGamesBySemester(
            semester
          ) ||
          []
        );


      } catch (
        error
      ) {


        console.error(
          `讀取 ${semester} 遊戲失敗：`,
          error
        );


        return [];

      }

    }


    /*
    ==================================================
    顯示單一學期
    ==================================================
    */


    function renderSemesterGames(
      semester,
      mount
    ) {


      if (
        !mount
      ) {

        return;

      }


      mount.innerHTML =
        "";


      const games =
        getSemesterGames(
          semester
        );


      if (
        !games.length
      ) {


        mount.innerHTML = `

          <div
            style="
              grid-column:1/-1;
              padding:24px;
              border:2px dashed #cbd5e1;
              border-radius:18px;
              background:#f8fafc;
              color:#64748b;
              text-align:center;
              font-weight:800;
            "
          >
            這個學期目前尚未設定遊戲。
          </div>

        `;


        return;

      }


      games
        .sort(
          (
            a,
            b
          ) =>
            Number(
              a.order ||
              999
            ) -
            Number(
              b.order ||
              999
            )
        )
        .forEach(
          game => {


            mount.appendChild(
              createGameCard(
                game
              )
            );

          }
        );

    }

    /*

    ==================================================

    function renderLoggedIn(
      user

      compactUserBox.innerHTML =
        "";


      if (
        user.photoURL

        const image =
          document.createElement(
            "img"
          );


        image.src =
          user.photoURL;


        image.alt =
          "玩家頭像";


        compactUserBox.appendChild(
          image

      }


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "compact-user-text";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "compact-user-name";


      name.textContent =
        user.displayName ||
        "玩家";


      const email =
        document.createElement(
          "div"
        );


      email.className =
        "compact-user-email";


      email.textContent =
        user.email ||
        "";


      text.append(
        name,
        email
      );


      compactUserBox.appendChild(
        text
      );


      compactLoginButton.hidden =
        true;


      compactLogoutButton.hidden =
        false;

    }


    /*
    ==================================================
    Firebase 登入狀態
    ==================================================
    */


    onAuthStateChanged(
      auth,
      async user => {


        if (
          !user
        ) {


          renderLoggedOut();


          return;

        }


        renderLoggedIn(
          user
        );


        try {


          if (
            typeof createOrUpdatePlayer ===
            "function"
          ) {


            await createOrUpdatePlayer(
              user
            );

          }


        } catch (
          error
        ) {


          console.warn(
            "玩家資料同步失敗：",
            error
          );

        }


      },
      error => {


        console.error(
          "登入狀態確認失敗：",
          error
        );


        renderLoggedOut();

      }
