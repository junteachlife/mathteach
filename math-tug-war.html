/* Short screens: preserve usable key targets and allow scrolling instead of clipping. */
@media (min-width:1000px) and (max-height:619px) and (orientation:landscape) {
 .app{height:auto;min-height:100dvh;overflow:visible;}
 .rope-stage{height:90px}.top{min-height:70px}
 .scratch{flex:none;height:100px;min-height:100px}
 .pad button{min-height:38px}.side{overflow:visible}
}


/* V2.3 題庫選擇 */
.catalog-hint{grid-column:1/-1;font-size:12px;line-height:1.5;color:#52647b;background:#eef5ff;border:1px solid #d6e5fc;border-radius:10px;padding:8px 12px}
.options .option select{max-width:100%;min-width:0}
@media(max-width:700px){.catalog-hint{font-size:11px}}

/* V2.4: unmistakable team-specific answer feedback without disturbing layout */
.side{position:relative;isolation:isolate}
.answer-feedback{
  position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.9);
  z-index:6;opacity:0;visibility:hidden;pointer-events:none;
  min-width:min(78%,270px);max-width:94%;text-align:center;
  padding:17px 22px;border-radius:22px;border:4px solid white;
  box-shadow:0 9px 28px #14223855;font-size:clamp(25px,2.7vw,38px);
  line-height:1.2;font-weight:1000;text-shadow:0 2px 0 #0000000c;
  transition:opacity .15s ease,transform .15s ease,visibility .15s;
}
.answer-feedback.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.answer-feedback.correct{background:#e5f9ee;color:#087b44;outline:3px solid #27b875}
.answer-feedback.wrong{background:#fff0f0;color:#c02139;outline:3px solid #ef5268}
.answer-feedback small{display:block;font-size:clamp(13px,1.3vw,17px);margin-top:7px;font-weight:800}
.status{font-weight:900}
.side .status.good{color:#087b44}
.side .status.bad{color:#c02139}
@media(max-width:700px){.answer-feedback{font-size:26px;min-width:70%;padding:12px 14px}}
@media(prefers-reduced-motion:reduce){.answer-feedback{transition:none}}

/* 原始方程式題庫：直式分式及模式一選擇題 */
.question.choice-question{height:auto;min-height:clamp(90px,15vh,165px);max-height:27vh;overflow-y:auto;display:block;font-size:clamp(13px,1.2vw,17px);text-align:left;padding:8px}
.question-stem{width:100%;text-align:center}
.tug-options{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.tug-option{border:1.5px solid #a8bdd4;background:#fff;border-radius:8px;padding:7px 5px;line-height:1.3;font-size:clamp(12px,1vw,15px);font-weight:700;color:#243b58;text-align:left;min-height:38px;touch-action:manipulation}
.tug-option.selected{background:#f9eab5;border-color:#ce961e;box-shadow:inset 0 0 0 1px #ce961e}
.math-frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;align-items:stretch;line-height:1.05;font-size:.87em;margin:0 3px}
.math-frac .top,.math-frac .bottom{display:block;padding:1px 4px}
.math-frac .bar{display:block;height:1.5px;background:currentColor;width:100%}
.concept-statement{font-weight:700;color:#274c7c;margin:4px 0}
@media(max-width:700px){.tug-options{grid-template-columns:1fr}.question.choice-question{max-height:35vh}}


/* V2.7：競賽頁返回網站首頁（不影響雙隊作答） */
.tug-home-nav{display:flex;align-items:center;justify-content:flex-start;min-height:36px;flex:none}
.tug-home-link{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 13px;border:1.5px solid #b9cceb;border-radius:12px;background:linear-gradient(120deg,#fff,#edf5ff);color:#174f8f;text-decoration:none;font-size:clamp(12px,1.1vw,15px);font-weight:900;line-height:1.15;box-shadow:0 2px 7px #31558216;transition:background .15s,transform .15s}
.tug-home-link:hover{background:#e4f0ff;transform:translateY(-1px)}
.tug-home-link:active{transform:translateY(1px)}
.tug-home-link:focus-visible{outline:3px solid #f4b93e;outline-offset:2px}
@media(max-height:800px) and (min-width:701px){.tug-home-nav{min-height:29px}.tug-home-link{padding:5px 10px;font-size:12px}.app{gap:6px}}
@media(max-width:700px){.tug-home-nav{min-height:32px}.tug-home-link{padding:7px 10px}}


/* V3.1：原始題庫分式／長題自適應修正。
   取消桌機固定 65px 題目高度；讓內容完整佔有空間，不再覆蓋計算紙。 */
.question {
  box-sizing: border-box;
  height: auto;
  max-height: min(35vh, 260px);
  min-height: 76px;
  overflow-x: auto;
  overflow-y: auto;
  flex: 0 0 auto;
  align-content: center;
  line-height: 1.5;
  scrollbar-width: thin;
}
.question-stem { display:block; width:100%; line-height:1.6; overflow-wrap:normal; }
.question.has-fraction { min-height:118px; padding:12px 10px; font-size:clamp(20px,1.8vw,29px); }
.question .math-expression { display:inline-block; max-width:100%; line-height:1.55; }
.question .math-frac { line-height:1.15; vertical-align:middle; font-size:.85em; white-space:nowrap; }
.question .math-frac .top,.question .math-frac .bottom { padding:3px 5px; }
.question .math-frac .bar { height:2px; min-height:2px; }
.question.choice-question { max-height:min(37vh, 280px); min-height:110px; }
/* 若題目很長，應優先壓縮計算紙；絕不把題目畫到計算紙背後。 */
.side { min-height:0; }
.scratch { flex:1 1 70px; min-height:48px; }
@media (min-width:1000px) and (min-height:620px) and (orientation:landscape) {
  .app { overflow-y:auto; }
  .arena { overflow:visible; }
  .side { overflow-y:auto; scrollbar-width:thin; }
  .question { height:auto; min-height:76px; max-height:min(32vh,215px); flex:0 0 auto; font-size:clamp(19px,1.9vw,29px); }
  .question.has-fraction { min-height:120px; max-height:min(34vh,225px); }
  .question.choice-question { height:auto; min-height:120px; max-height:min(34vh,250px); }
  .scratch { flex:1 1 55px; min-height:48px; }
}
@media(max-width:700px) {
  .question { height:auto; min-height:80px; max-height:40vh; font-size:19px; }
  .question.has-fraction { min-height:118px; font-size:19px; }
  .question.choice-question { max-height:42vh; }
  .side { overflow:visible; }
}


/* V3.1：題目與分式不受計分板 .top / 進度條 .bar 樣式干擾 */
.question{height:auto!important; min-height:105px!important; max-height:none!important; overflow-x:auto!important; overflow-y:visible!important; flex:0 0 auto!important; display:flex!important; align-items:center!important; justify-content:center!important; padding:15px 12px!important; line-height:1.65!important; font-size:clamp(19px,1.8vw,29px)!important;}
.question.choice-question{display:block!important; max-height:min(42vh,350px)!important; overflow-y:auto!important; font-size:clamp(15px,1.2vw,20px)!important;}
.question-stem{width:max-content; min-width:100%; text-align:center; white-space:nowrap; line-height:1.55;}
.question .math-expression{display:inline-block; max-width:none; white-space:nowrap; vertical-align:middle; line-height:1.6;}
.question .math-frac{display:inline-flex!important; flex-direction:column!important; align-items:stretch!important; vertical-align:middle!important; width:auto!important; min-width:20px; height:auto!important; flex:none!important; margin:0 5px!important; line-height:1.1!important; white-space:nowrap!important; background:none!important; border:0!important; box-shadow:none!important; overflow:visible!important;}
.question .math-frac > .top{all:unset!important; display:block!important; text-align:center!important; white-space:nowrap!important; padding:2px 6px 4px!important; color:inherit!important; font:inherit!important; line-height:1.25!important;}
.question .math-frac > .bar{all:unset!important; display:block!important; height:2px!important; min-height:2px!important; width:100%!important; background:currentColor!important; border:0!important; border-radius:0!important; box-shadow:none!important; flex:none!important;}
.question .math-frac > .bottom{all:unset!important; display:block!important; text-align:center!important; white-space:nowrap!important; padding:4px 6px 2px!important; color:inherit!important; font:inherit!important; line-height:1.25!important;}
/* 使用原本的共用計算紙，不再以縮小的內嵌 canvas 佔據題目空間 */
.scratch-launch{flex:0 0 auto; min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px dashed #adc6e3; background:#f8fbff; border-radius:12px; padding:8px 12px;}
.scratch-launch-note{font-size:13px;color:#657790;font-weight:700;}
.open-paper{border:1px solid #95b9e9;border-radius:11px;background:#eaf4ff;color:#1558a1;font-weight:900;padding:10px 16px;min-height:42px;white-space:nowrap;}
.red .open-paper{background:#fff0f4;color:#aa3150;border-color:#efb2c3;}
.open-paper:focus-visible,.team-paper-exit:focus-visible{outline:3px solid #f5b927;outline-offset:2px;}
.team-paper-overlay[hidden]{display:none!important;}
.team-paper-overlay{position:fixed;z-index:100000;top:0;bottom:0;width:50vw;background:transparent;display:flex;flex-direction:column;box-shadow:0 0 12px #12264c18;overflow:hidden;}
.team-paper-overlay[data-side="blue"]{left:0;border-right:3px solid #2685de;}
.team-paper-overlay[data-side="red"]{right:0;border-left:3px solid #e55071;}
.team-paper-top{flex:0 0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 10px;background:#e8f2ff;color:#174878;}
.team-paper-overlay[data-side="red"] .team-paper-top{background:#fff0f4;color:#a72e50;}
.team-paper-exit{border:1px solid #b5c7dd;border-radius:9px;background:white;color:#2c476c;padding:8px 12px;font-size:13px;font-weight:900;}
.team-paper-frame{display:block;min-height:0;flex:1;width:100%;border:0;background:transparent;}
/* 遇到長題請讓單隊垂直捲動，不犧牲方程式的可讀性 */
@media (min-width:1000px) and (min-height:620px) and (orientation:landscape){
 .side{overflow-y:auto!important; min-height:0!important;}
 .arena{overflow:hidden!important;}
 .question{min-height:105px!important;}
}
@media(max-width:700px){
 .scratch-launch{flex-wrap:wrap;justify-content:center;text-align:center;}
 .team-paper-overlay{width:100vw!important;left:0!important;right:0!important;border:0!important;}
 .question{font-size:18px!important;}
}

/* V3.4｜隊伍內嵌透明計算紙：工具列在上，書寫區只覆蓋答題工作區 */
.workzone{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;}
.team-paper-overlay{position:absolute!important;inset:0!important;z-index:50!important;display:none;pointer-events:none;
  border:2px solid #86baf1!important;border-radius:14px!important;overflow:hidden!important;
  background:rgba(255,255,255,.02)!important;box-shadow:0 8px 24px #19314d18!important;}
.side.red .team-paper-overlay{border-color:#f4a0b0!important;}
.team-paper-overlay.is-open{display:block!important;pointer-events:auto!important;visibility:visible!important;}
.team-paper-overlay[hidden],.team-paper-overlay:not(.is-open){display:none!important;pointer-events:none!important;visibility:hidden!important;}
.team-paper-frame{display:block!important;width:100%!important;height:100%!important;border:0!important;background:transparent!important;pointer-events:auto!important;}
/* overlay 只佔用題目/計算紙說明/答案區，保留數字鍵盤在下方 */
.scratch-launch{flex:0 0 auto; min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px dashed #adc6e3; background:#f8fbff; border-radius:12px; padding:8px 12px;}
.scratch-launch-note{font-size:13px;color:#657790;font-weight:700;}
.open-paper{border:1px solid #95b9e9;border-radius:11px;background:#eaf4ff;color:#1558a1;font-weight:900;padding:10px 16px;min-height:42px;white-space:nowrap;}
.red .open-paper{background:#fff0f4;color:#aa3150;border-color:#efb2c3;}
.open-paper:focus-visible{outline:3px solid #f5b927;outline-offset:2px;}
@media(max-width:700px){
 .scratch-launch{flex-wrap:wrap;justify-content:center;text-align:center;}
 .question{font-size:18px!important;}
}

<div class="dialog-wrap" id="modal"><div class="dialog"><h2 id="modalTitle">數學拔河王</h2><p id="modalDesc">左右雙方獨立解題，答對拉繩子一格。先拉滿 5 格或時間結束領先者獲勝。</p><div id="settings" class="options"><label class="option">學期 <select id="semesterSelect" aria-label="選擇學期"></select></label><label class="option">數學單元 <select id="gameSelect" aria-label="選擇數學單元"></select></label><label class="option">練習模式 <select id="modeSelect" aria-label="選擇練習模式"></select></label><div class="catalog-hint" id="catalogHint">目前使用示範題庫；原有遊戲不會被修改。</div><label class="option">比賽時間 <select id="duration"><option value="180" selected>180 秒（3 分鐘）</option><option value="120">120 秒</option><option value="300">300 秒</option></select></label><label class="option">勝利進度 <select id="winSteps"><option value="5" selected>5 格</option><option value="3">3 格</option><option value="7">7 格</option></select></label><label class="option">答錯冷卻 <select id="cooldown"><option value="3" selected>3 秒</option><option value="0">不冷卻</option><option value="5">5 秒</option></select></label><label class="option">題目模式 <span>同難度不同題目</span></label></div><p><button class="btn" id="modalButton">開始競賽</button></p></div></div>
<script>
'use strict';
// 獨立競賽引擎：不載入、不改寫任何原有遊戲檔案。接入正式題庫時，替換 questionProvider 即可。
const $=id=>document.getElementById(id);
const settings={duration:180,steps:5,cooldown:3};
const state={running:false,paused:false,ended:false,remain:180,pull:0,blue:{score:0,index:0,answer:'',question:null,lockedUntil:0,timer:null,pool:[]},red:{score:0,index:0,answer:'',question:null,lockedUntil:0,timer:null,pool:[]}};
const sides=['blue','red'];let interval=null;
// 題庫轉接中心：僅此處登錄的遊戲會顯示在選單。
// 後續新增遊戲時，在新的 .js 模組中呼叫 window.TugWar.register(adapter)。
const adapters = new Map();
window.TugWar = {
 register(adapter){
  if(!adapter || typeof adapter.id!=='string' || typeof adapter.generatePair!=='function' || typeof adapter.validate!=='function' || !Array.isArray(adapter.modes))throw Error('題庫轉接器格式錯誤');
  adapters.set(adapter.id,adapter);
  // 轉接器在頁面底部載入時，document.readyState 仍可能是 loading。
  // 此時選單元素已建立，因此應直接更新，而非略過初始化。
  refreshCatalog();
 },
 list(){return [...adapters.values()].map(a=>({id:a.id,semester:a.semester,title:a.title,modes:a.modes}))}
};
let activeAdapter=null, activeMode=null;
function choice(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a;}
function numericAnswer(txt){
 const x=String(txt).replace(/\s/g,'').replace(/−/g,'-');
 if(/^[-+]?\d+(?:\.\d+)?$/.test(x))return Number(x);
 const m=x.match(/^([-+]?\d+)\/([1-9]\d*)$/);
 return m?Number(m[1])/Number(m[2]):NaN;
}
// V2.3 隨附「七上 3-2」示範轉接器（不是原遊戲正式題庫）。
const exampleEquation={
 id:'demo-g7-equation',semester:'七上',title:'3-2 一元一次方程式（示範題庫）',
 modes:[{id:'integer',name:'整數解練習（示範）'},{id:'fraction',name:'分數解練習（示範）'},{id:'mixed',name:'整數與分數綜合（示範）'}],
 generatePair(mode,level){
  function one(){
   const useFraction=mode==='fraction'||(mode==='mixed'&&level%3===2);
   let x,p,q,display;
   if(useFraction){
    const den=choice(2,5);let num=choice(-9,9);
    while(num===0||gcd(Math.abs(num),den)!==1)num=choice(-9,9);
    x=num/den;p=choice(1,5)*den;display=`${num}/${den}`;
   }else{x=choice(-9,12);p=choice(2,9);display=String(x);}
   q=choice(-18,18);
   const rhs=Math.round((p*x+q)*1e9)/1e9;
   return {question:`${p}x ${q>=0?'+':'−'} ${Math.abs(q)} = ${rhs}`,numeric:x,display,level,inputType:'number'};
  }
  let a=one(),b=one(),attempts=0;
  while(a.question===b.question && ++attempts<50)b=one();
  return [a,b];
 },
 validate(question,answer){const n=numericAnswer(answer);return Number.isFinite(n)&&Math.abs(n-question.numeric)<1e-8;}
};
// 示範轉接器保留於原始碼，但不顯示；優先載入真實的七上 3-2。
function refreshCatalog(){
 const sem=$('semesterSelect'),game=$('gameSelect'),mode=$('modeSelect');
 const prevSem=sem.value,prevGame=game.value,prevMode=mode.value;
 const all=[...adapters.values()];
 const semesters=[...new Set(all.map(a=>a.semester))];
 sem.replaceChildren(...semesters.map(x=>new Option(x,x)));
 sem.value=semesters.includes(prevSem)?prevSem:semesters[0];
 const filtered=all.filter(a=>a.semester===sem.value);
 game.replaceChildren(...filtered.map(a=>new Option(a.title,a.id)));
 game.value=filtered.some(a=>a.id===prevGame)?prevGame:filtered[0]?.id||'';
 const selected=adapters.get(game.value);
 mode.replaceChildren(...(selected?.modes||[]).map(m=>new Option(m.name,m.id)));
 mode.value=selected?.modes.some(m=>m.id===prevMode)?prevMode:selected?.modes[0]?.id||'';
 $('catalogHint').textContent=selected?.description||'正在載入原始遊戲題庫…';
}
$('semesterSelect').addEventListener('change',()=>{ $('gameSelect').value='';refreshCatalog();});
$('gameSelect').addEventListener('change',()=>{ $('modeSelect').value='';refreshCatalog();});
refreshCatalog();
function createPools(){
 const b=[],r=[];
 for(let i=0;i<36;i++){
  const pair=activeAdapter.generatePair(activeMode,i%6);
  if(!Array.isArray(pair)||pair.length!==2 || !pair.every(q=>q&&typeof q.question==='string'))throw Error('轉接器必須回傳兩道題目');
  if(pair[0].question===pair[1].question)throw Error('同一輪抽到相同題目，請調整轉接器');
  b.push(pair[0]);r.push(pair[1]);
 }
 state.blue.pool=b;state.red.pool=r;
}
function nextQuestion(side){const s=state[side];s.question=s.pool[s.index%s.pool.length];s.index++;s.answer='';s.lockedUntil=0;const qbox=$(side+'Question');qbox.replaceChildren();qbox.classList.toggle('choice-question',s.question.inputType==='choice');qbox.classList.remove('has-fraction');
if(s.question.questionHTML){const stem=document.createElement('div');stem.className='question-stem';stem.innerHTML=s.question.questionHTML;qbox.appendChild(stem);}else{qbox.textContent=s.question.question;}
if(s.question.inputType==='choice'){
 const choices=document.createElement('div');choices.className='tug-options';
 for(const option of s.question.options){const btn=document.createElement('button');btn.type='button';btn.className='tug-option';btn.textContent=option.label+'．'+option.text;btn.addEventListener('click',()=>{if(!state.running||state.paused||state.ended||Date.now()<s.lockedUntil)return;s.answer=option.label;renderSide(side);});choices.appendChild(btn);}
 qbox.appendChild(choices);
}qbox.classList.toggle('has-fraction',!!qbox.querySelector('.math-frac'));$(side+'Count').textContent=`第 ${s.index} 題`;$(side+'Status').textContent='';$(side+'Status').className='status';renderSide(side);clearPaper(side);}
function renderSide(side){const s=state[side];$(side+'Score').textContent=s.score;$(side+'Answer').textContent=(s.question?.inputType==='choice'?'選項：':'x = ')+(s.answer||'？');
const isChoice=s.question?.inputType==='choice';$(side+'Pad').style.display=isChoice?'none':'';
$(side+'Question').querySelectorAll('.tug-option').forEach(btn=>btn.classList.toggle('selected',btn.textContent.startsWith(s.answer+'．')&&!!s.answer));$(side+'Submit').disabled=!state.running||state.paused||state.ended||Date.now()<s.lockedUntil;}
function drawRope(){const ratio=state.pull/settings.steps;$('ropeGroup').style.left=`${50-ratio*33}%`;$('ropeGroup').dataset.leading=state.pull>0?'blue':state.pull<0?'red':'tie';$('barfill').style.width=`${50+ratio*50}%`;}
function renderTime(){const m=Math.floor(state.remain/60),sec=state.remain%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function begin(){clearInterval(interval);activeAdapter=adapters.get($('gameSelect').value);activeMode=$('modeSelect').value;if(!activeAdapter){alert('請先選擇可用題庫');return;} $('unitText').textContent=activeAdapter.semester+'｜'+activeAdapter.title+'｜'+activeAdapter.modes.find(m=>m.id===activeMode)?.name; $('modeNote').textContent='雙人共用觸控螢幕｜同難度不同題｜答錯冷卻 '+$('cooldown').value+' 秒｜'+activeAdapter.title;settings.duration=+$('duration').value;settings.steps=+$('winSteps').value;settings.cooldown=+$('cooldown').value;state.running=true;state.paused=false;state.ended=false;state.remain=settings.duration;state.pull=0;createPools();for(const side of sides){let s=state[side];s.score=0;s.index=0;s.lockedUntil=0;clearTimeout(s.timer);hideFeedback(side);nextQuestion(side);$(side+'Status').className='status';}renderTime();drawRope();$('pauseBtn').textContent='暫停';$('modal').classList.add('hidden');interval=setInterval(tick,1000);}
function tick(){if(!state.running||state.paused||state.ended)return;state.remain=Math.max(0,state.remain-1);renderTime();if(state.remain===0)finish();}
function finish(){if(state.ended)return;state.running=false;state.ended=true;clearInterval(interval);sides.forEach(renderSide);let who=state.pull>0?'藍隊獲勝！':state.pull<0?'紅隊獲勝！':'平手！';$('modalTitle').textContent='競賽結束｜'+who;$('modalDesc').textContent=`藍隊答對 ${state.blue.score} 題，紅隊答對 ${state.red.score} 題；最終拔河位移 ${Math.abs(state.pull)} 格。`;$('settings').classList.add('hidden');$('modalButton').textContent='重新比賽';$('modal').classList.remove('hidden');}
function type(side,key){const s=state[side];if(!state.running||state.paused||state.ended||Date.now()<s.lockedUntil)return;if(key==='⌫')s.answer=s.answer.slice(0,-1);else if(key==='清除')s.answer='';else if(s.answer.length<20)s.answer+=key;renderSide(side);}

const feedbackTimers={blue:null,red:null};
function hideFeedback(side){
 clearTimeout(feedbackTimers[side]);
 const el=$(side+'Feedback');el.className='answer-feedback';el.replaceChildren();
}
function showFeedback(side,correct,subtext){
 const el=$(side+'Feedback');clearTimeout(feedbackTimers[side]);
 el.className='answer-feedback '+(correct?'correct':'wrong');
 const title=document.createElement('div');title.textContent=correct?'✅ 答對！':'❌ 答錯！';
 const smaller=document.createElement('small');smaller.textContent=subtext;
 el.replaceChildren(title,smaller);
 // Force a frame before transition, ensuring repeated taps animate anew.
 void el.offsetWidth;el.classList.add('show');
 feedbackTimers[side]=setTimeout(()=>hideFeedback(side),1150);
}
function submit(side){
 const s=state[side];
 if(!state.running||state.paused||state.ended||Date.now()<s.lockedUntil||!s.answer)return;
 // Each actual submitted answer clears ONLY its own scratchpad, regardless of correctness.
 clearPaper(side);
 if(activeAdapter.validate(s.question,s.answer)){
  s.score++;state.pull+=side==='blue'?1:-1;
  renderSide(side);drawRope();
  nextQuestion(side);
  $(side+'Status').textContent='✅ 答對！繩子前進一格';
  $(side+'Status').className='status good';
  showFeedback(side,true,'拉動繩子 +1 格');
  if(Math.abs(state.pull)>=settings.steps){finish();return;}
 }else{
  const seconds=settings.cooldown;
  s.lockedUntil=Date.now()+seconds*1000;
  $(side+'Status').textContent=seconds?`❌ 答錯！冷卻 ${seconds} 秒`:'❌ 答錯！請再試一次';
  $(side+'Status').className='status bad';
  showFeedback(side,false,seconds?`暫停作答 ${seconds} 秒`:'再試一次');
  renderSide(side);
  if(seconds){clearTimeout(s.timer);s.timer=setTimeout(()=>{
   s.lockedUntil=0;
   if(!state.ended){$(side+'Status').textContent='可以重新作答';$(side+'Status').className='status';renderSide(side);}
  },seconds*1000);}
 }
}

for(const side of sides){const pad=$(side+'Pad');for(const key of ['7','8','9','⌫','4','5','6','−','1','2','3','/','清除','0','.','送出']){const b=document.createElement('button');b.textContent=key;b.type='button';b.addEventListener('click',()=>key==='送出'?submit(side):type(side,key));pad.appendChild(b);}$(side+'Submit').addEventListener('click',()=>submit(side));}
$('pauseBtn').addEventListener('click',()=>{if(!state.running||state.ended)return;state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'繼續':'暫停';sides.forEach(renderSide);});
$('resetBtn').addEventListener('click',()=>{state.running=false;state.paused=false;clearInterval(interval);$('settings').classList.remove('hidden');$('modalTitle').textContent='競賽設定';$('modalDesc').textContent='按下開始即可進行雙人觸控競賽。';$('modalButton').textContent='開始競賽';$('modal').classList.remove('hidden');sides.forEach(side=>{hideFeedback(side);renderSide(side);});});
$('modalButton').addEventListener('click',()=>{if($('settings').classList.contains('hidden'))$('settings').classList.remove('hidden');try{begin();}catch(error){console.error('產題失敗',error);state.running=false;clearInterval(interval);$('settings').classList.remove('hidden');$('catalogHint').textContent='❌ 無法開始競賽：'+(error?.message||String(error));$('catalogHint').style.color='#b91c1c';$('catalogHint').style.background='#fff1f2';$('modal').classList.remove('hidden');}});
// V3.4：共用透明計算紙嵌入各隊 workzone；工具列位於上方，書寫區覆蓋題目與答案區，不壓縮數字鍵盤。
const paperFrames = {};
function paperFrame(side) {
  if (paperFrames[side]) return paperFrames[side];
  const host = $(side+'Workzone');
  const wrap = document.createElement('div');
  wrap.className = 'team-paper-overlay';
  wrap.dataset.side = side;
  wrap.hidden = true;
  wrap.setAttribute('aria-label', (side==='blue'?'藍隊':'紅隊')+'計算紙');
  const frame = document.createElement('iframe');
  frame.className='team-paper-frame';
  frame.title=(side==='blue'?'藍隊':'紅隊')+'計算紙';
  frame.setAttribute('allowtransparency','true');
  frame.src='./tug-war/scratchpad-player.html?team='+side+'&v=3.4';
  wrap.appendChild(frame);
  host.appendChild(wrap);
  const record={wrap,frame,ready:false,pendingClear:false};
  paperFrames[side]=record;
  frame.addEventListener('load',()=>{
    record.ready=true;
    if(record.pendingClear){record.pendingClear=false;sendPaper(side,'reset');}
    if(!wrap.hidden)sendPaper(side,'open');
  });
  return record;
}
function sendPaper(side,action){
  const p=paperFrames[side];
  if(!p||!p.frame.contentWindow)return;
  p.frame.contentWindow.postMessage({tugPaperAction:action},location.origin);
}
function openPaper(side){
  if(!state.running||state.paused||state.ended)return;
  const p=paperFrame(side);
  p.wrap.hidden=false;
  p.wrap.classList.add('is-open');
  p.wrap.style.pointerEvents='auto';
  if(p.ready)sendPaper(side,'open');
}
function closePaper(side){
  const p=paperFrames[side];
  if(!p)return;
  p.wrap.classList.remove('is-open');
  p.wrap.hidden=true;
  p.wrap.style.pointerEvents='none';

  if(kind===0){statement=`x 加 ${b} 是 ${x+b}。`;correctEquation=`x + ${b} = ${x+b}`;wrong=[`x − ${b} = ${x+b}`,`${b}x = ${x+b}`,`x + ${x+b} = ${b}`];}
  else if(kind===1){statement=`x 減 ${b} 等於 ${x-b}。`;correctEquation=`x − ${b} = ${x-b}`;wrong=[`x + ${b} = ${x-b}`,`${b} − x = ${x-b}`,`x ÷ ${b} = ${x-b}`];}
  else if(kind===2){statement=`x 的 ${a} 倍再加 ${b} 是 ${a*x+b}。`;correctEquation=`${a}x + ${b} = ${a*x+b}`;wrong=[`${a}(x + ${b}) = ${a*x+b}`,`${a}x − ${b} = ${a*x+b}`,`x + ${a} + ${b} = ${a*x+b}`];}
  else if(kind===3){statement=`${a*x-b} 等於 x 的 ${a} 倍少 ${b}。`;correctEquation=`${a*x-b} = ${a}x − ${b}`;wrong=[`${a*x-b} = ${a}x + ${b}`,`${a*x-b} = ${a}(x − ${b})`,`${a*x-b} = x − ${a*b}`];}
  else if(kind===4){statement=`把 x 平均分成 ${a} 等分，每一等分等於 ${t}。`;correctEquation=`x ÷ ${a} = ${t}`;wrong=[`x × ${a} = ${t}`,`x − ${a} = ${t}`,`${a} ÷ x = ${t}`];}
  else if(kind===5){statement=`x 加 ${b} 之後的 ${a} 倍是 ${a*(x+b)}。`;correctEquation=`${a}(x + ${b}) = ${a*(x+b)}`;wrong=[`${a}x + ${b} = ${a*(x+b)}`,`${a}(x − ${b}) = ${a*(x+b)}`,`x + ${a*b} = ${a*(x+b)}`];}
  else if(kind===6){statement=`x 減 ${b} 之後的 ${a} 倍是 ${a*(x-b)}。`;correctEquation=`${a}(x − ${b}) = ${a*(x-b)}`;wrong=[`${a}x − ${b} = ${a*(x-b)}`,`${a}(x + ${b}) = ${a*(x-b)}`,`x − ${a*b} = ${a*(x-b)}`];}
  else{statement=`x 的三分之二等於 ${2*t}。`;correctEquation=`2x ÷ 3 = ${2*t}`;wrong=[`3x ÷ 2 = ${2*t}`,`2x − 3 = ${2*t}`,`x + 2 ÷ 3 = ${2*t}`];}
  const options=shuffle([correctEquation,...wrong]);
  return {kind:'choice',subtype:'word',prompt:`依照下列文字敘述，選出正確的一元一次方程式：<div class="concept-statement">${statement}</div>`,options,correctIndex:options.indexOf(correctEquation),answerLabel:correctEquation,solutionNotes:[['找出未知數','用 x 表示題目中不知道的數。'],['將文字逐段翻譯成算式',`「${statement}」表示 ${correctEquation}。要注意「之後的倍數」應將整個括號一起相乘。`],['核對等號兩邊','等號代表兩個數量相等；請檢查倍數、加減順序與括號範圍。']]};
}
function makeVerificationQuestion(){
  const root=rand(-9,9),a=rand(2,7),c=rand(-5,5),b=rand(-15,15);
  if(a===c)return makeVerificationQuestion();
  const d=(a-c)*root+b;
  const eq=`${linear(a,b)} = ${linear(c,d)}`;
  const choices=shuffle([root,root+rand(1,4),root-rand(1,4),root+rand(5,9)]);
  const options=choices.map(v=>`x = ${integerText(v)}`);
  const steps=choices.map(v=>{
    const l=a*v+b,r=c*v+d;
    return `將 x = ${integerText(v)} 代入：左邊 = ${integerText(a)} × (${integerText(v)}) ${b<0?'−':'+'} ${Math.abs(b)} = ${integerText(l)}；右邊 = ${integerText(c)} × (${integerText(v)}) ${d<0?'−':'+'} ${Math.abs(d)} = ${integerText(r)}；${l===r?'左右相等，是方程式的解。':'左右不相等，不是方程式的解。'}`;
  });
  return {kind:'choice',subtype:'verify',prompt:`下列哪一個數是方程式 <strong>${eq}</strong> 的解？<div class="concept-statement">請將候選值代入等號左右兩邊比較。</div>`,options,correctIndex:options.indexOf(`x = ${integerText(root)}`),answerLabel:`x = ${integerText(root)}`,solutionNotes:[['解的意義','只有代入後讓等號左邊與右邊數值相同的 x，才是方程式的解。'],['逐一代入檢查',steps.join('<hr style="border:0;border-top:1px solid #e5e7eb;margin:9px 0">')],['最後判定',`只有 x = ${integerText(root)} 使兩邊相等，所以選這個答案。`]]};
}
function makeConceptQuestions(){
  const out=[],used=new Set();
  for(let i=0;i<10;i++){
    for(let attempt=0;attempt<200;attempt++){
      const q=i<5?makeWordingQuestion():makeVerificationQuestion();
      const key=q.prompt;
      if(used.has(key))continue;
      used.add(key);out.push(q);break;
    }
  }
  if(out.length!==10)throw Error('概念題目不足');
  return shuffle(out);
}
function makeQuestions(selectedMode){
  if(selectedMode===1)return makeConceptQuestions();
  return makeLegacyQuestions(selectedMode-1);
}

function equationHTMLToSource(html){
  const root=document.createElement("div");root.innerHTML=html;
  function recur(node){
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue;
    if(node.nodeType!==Node.ELEMENT_NODE)return "";
    if(node.classList?.contains("math-frac")){
      const top=node.querySelector(":scope > .top");
      const bottom=node.querySelector(":scope > .bottom");
      return "(("+recur(top)+")/("+recur(bottom)+"))";
    }
    return Array.from(node.childNodes).map(recur).join("");
  }
  return recur(root).replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/＝/g,"=");
}

function equationEval(expr,x){
  let s=expr.replace(/\s/g,"").replace(/(\d)(x|\()/gi,"$1*$2").replace(/(x|\))(\()/gi,"$1*$2").replace(/\)(x|\d)/gi,")*$1");
  const tokens=s.match(/\d+|x|[()+*\/-]/g)||[];
  if(tokens.join("")!==s)throw Error("無法辨識方程式格式："+s);
  let k=0;
  function atom(){
    const z=tokens[k++];
    if(z==="+")return atom();
    if(z==="-")return ratMul(rat(-1),atom());
    if(z==="("){const a=add();if(tokens[k++]!==")")throw Error("括號不完整");return a;}
    if(z==="x")return rat(x);
    if(/^\d+$/.test(z||""))return rat(Number(z));
    throw Error("算式項目錯誤："+z);
  }
  function mul(){let v=atom();while(tokens[k]==="*"||tokens[k]==="/"){const op=tokens[k++],b=atom();v=op==="*"?ratMul(v,b):ratDiv(v,b);}return v;}
  function add(){let v=mul();while(tokens[k]==="+"||tokens[k]==="-"){const op=tokens[k++],b=mul();v=op==="+"?ratAdd(v,b):ratSub(v,b);}return v;}
  const result=add();if(k!==tokens.length)throw Error("算式尚有未處理部分");return result;
}

function equationCoefficients(q){
  const source=equationHTMLToSource(q.qStr);
  const parts=source.split("=");if(parts.length!==2)throw Error("缺少等號");
  const left0=equationEval(parts[0],0),left1=equationEval(parts[0],1);
  const right0=equationEval(parts[1],0),right1=equationEval(parts[1],1);
  return {a:ratSub(left1,left0),b:left0,c:ratSub(right1,right0),d:right0};
}

function makeLegacyQuestions(
  selectedMode
) {
  const output = [];

  const used =
    new Set();

  const target =
    selectedMode === 4
      ? 6
      : 10;


  /*
  模式四
  */

  if (
    selectedMode === 4
  ) {
    const schedule =
      makeMode4TypeSchedule(
        target
      );

    schedule.forEach(
      type => {
        for (
          let retry = 0;
          retry < 150;
          retry++
        ) {
          const question =
            makeMode4Question(
              type,
              makeAnswerByRatio()
            );

          // 所有模式四題目都重新由題目本身計算一次，
          // 必須有唯一解，且與產題器給定的答案一致，否則重抽。
          try {
            const {a,b,c,d}=equationCoefficients(question);
            const coefficient=ratSub(a,c);
            if(coefficient.n===0 || !ratEq(ratDiv(ratSub(d,b),coefficient),question.ans)) continue;
          } catch(error) {
            console.warn("忽略無效分式方程式題目", error);
            continue;
          }

          const key =
            question.qStr
              .replace(
                /<[^>]+>/g,
                ""
              );

          if (
            used.has(
              key
            )
          ) {
            continue;
          }

          used.add(
            key
          );

          output.push(
            question
          );

          break;
        }
      }
    );

    if(output.length!==target)throw new Error("模式四有效題目不足，請重新開始測驗");
    return shuffle(
      output
    );
  }


  /*
  模式一
  */

  if (
    selectedMode === 1
  ) {
    while (
      output.length <
      target
    ) {
      const ans =
        makeAnswerByRatio();

      const p =
        ans.n;

      const q =
        ans.d;

      const k =
        nz(
          -5,
          5
        );

      const a =
        k *
        q;

      // 排除 x＝常數、−x＝常數等不需計算的題目；不改答案生成規則。
      if(Math.abs(a)===1) continue;

      const b =
        k *
        p;

      if (
        Math.abs(a) >
          35 ||
        Math.abs(b) >
          60
      ) {
        continue;
      }

      const qStr =
        `${fx(
          a
        )} = ${integerText(
          b
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });
    }

    return shuffle(
      output
    );
  }


  /*
  模式二
  */

  if (
    selectedMode === 2
  ) {
    while (
      output.length <
      target
    ) {
      const ans =
        makeAnswerByRatio();

      const p =
        ans.n;

      const q =
        ans.d;

      const k =
        nz(
          -4,
          4
        );

      const c =
        nz(
          -7,
          7
        );

      const a =
        c +
        k *
        q;

      const b =
        nz(
          -15,
          15
        );

      const d =
        b +
        k *
        p;

      if (
        a === 0 ||
        a === c
      ) {
        continue;
      }

      const qStr =
        `${linear(
          a,
          b
        )} = ` +
        `${linear(
          c,
          d
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });
    }

    return shuffle(
      output
    );
  }


  /*
  ==================================================
  模式三
  ==================================================
  */

  while (
    output.length <
    target
  ) {
    const ans =
      makeAnswerByRatio();


    /*
    題型 A：
    單一括號
    */

    if (
      Math.random() <
      .5
    ) {
      const outer =
        nz(
          -4,
          4
        );

      const innerA =
        nz(
          -5,
          5
        );

      const innerB =
        nz(
          -8,
          8
        );

      const t =
        nz(
          -3,
          3
        );

      const c =
        outer *
        innerA -
        t *
        ans.d;

      const d =
        outer *
        innerB +
        t *
        ans.n;

      if (
        c === 0 ||
        Math.abs(c) >
          32 ||
        Math.abs(d) >
          50
      ) {
        continue;
      }

      const inside =
        linear(
          innerA,
          innerB
        );

      const leftBracket =
        bracketCoefficientText(
          outer,
          inside
        );

      const qStr =
        `${leftBracket} = ` +
        `${linear(
          c,
          d
        )}`;

      if (
        used.has(
          qStr
        )
      ) {
        continue;
      }

      used.add(
        qStr
      );

      output.push({
        qStr,
        ans
      });

      continue;
    }


    /*
    ==================================================
    題型 B：
    兩組括號相減

    這裡就是本次修正重點。
    ==================================================
    */

    const firstOuter =
      nz(
        -4,
        4
      );

    const secondOuter =
      nz(
        -4,
        4
      );

    const firstX =
      nz(
        -5,
        5
      );

    const firstConst =
      rand(
        -8,
        8
      );

    const secondX =
      nz(
        -5,
        5
      );

    const secondConst =
      rand(
        -8,
        8
      );

    const leftA =
      firstOuter *
      firstX -
      secondOuter *
      secondX;

    const leftB =
      firstOuter *
      firstConst -
      secondOuter *
      secondConst;

    if (
      leftA === 0
    ) {
      continue;
    }

    const rhs =
      ratAdd(
        ratMul(
          rat(
            leftA
          ),
          ans
        ),
        rat(
          leftB
        )
      );

    if (
      !ratIsInteger(
        rhs
      ) ||
      Math.abs(
        rhs.n
      ) >
      80
    ) {
      continue;
    }

    const firstInside =
      linear(
        firstX,
        firstConst
      );

    const secondInside =
      linear(
        secondX,
        secondConst
      );

    const firstPart =
      bracketCoefficientText(
        firstOuter,
        firstInside
      );


    /*
    ★ 注意：

    不再寫：

    firstPart + " − " + secondPart

    因為這會造成：

    − −(...)

    現在由：
    signedSubtractedBracketText()

    自己決定要顯示 + 或 −。
    */

    const secondPart =
      signedSubtractedBracketText(
        secondOuter,
        secondInside
      );

    const qStr =
      `${firstPart}` +
      `${secondPart}` +
      ` = ` +
      `${integerText(
        rhs.n
      )}`;


    if (
      used.has(
        qStr
      )
    ) {
      continue;
    }

    used.add(
      qStr
    );

    output.push({
      qStr,
      ans
    });
  }

  return shuffle(
    output
  );
}

function rawNext(modeId){
 if(queueMode!==modeId){queue=[];queueMode=modeId;}
 if(!queue.length) queue=makeQuestions(Number(modeId));

function describe(q){
 if(q.kind==='choice'){
  const options=q.options.map((opt,i)=>({label:String.fromCharCode(65+i),text:opt}));
  return {question:q.prompt,questionHTML:q.prompt,kind:'choice',options,correct:String.fromCharCode(65+q.correctIndex),inputType:'choice',difficulty: q.subtype||'choice'};
 }
 const html=normalizeSingleTermParentheses(normalizeUnitBracketCoefficients(q.qStr));
 return {question:q.qStr.replace(/<[^>]+>/g,''),questionHTML:html,kind:'number',numerator:q.ans.n,denominator:q.ans.d,inputType:'number',difficulty:Math.min(9,Math.floor(q.qStr.length/18))};
}
const adapter={
 id:'original-g7-equation',semester:'七上',title:'3-2 一元一次方程式（原遊戲題型）',
 description:'已接入 games/grade7-1/equation.html 的原始五種模式出題函式；原遊戲檔案保持不變。',

 },
 validate(q,answer){

  const m=raw.match(/^([+-]?\d+)(?:\/([1-9]\d*))?$/);
  if(!m)return false;
  const n=Number(m[1]),d=m[2]?Number(m[2]):1;
  return n*q.denominator===q.numerator*d;
 }
};
