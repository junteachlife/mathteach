<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>數學拔河王｜雙人觸控測試版</title>
<style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;color:#1f2a44;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;touch-action:manipulation}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px}.top{display:grid;grid-template-columns:1fr minmax(280px,2.3fr) 1fr;align-items:center;gap:12px;background:white;border-radius:16px;padding:10px 16px;box-shadow:0 3px 16px #22344b10}.score{text-align:center;font-weight:900;font-size:clamp(20px,3vw,38px)}.score.blue{color:#2872c6}.score.red{color:#cd4854}.center{text-align:center}.center h1{font-size:clamp(18px,2vw,28px);margin:0}.sub{font-size:12px;color:#66748a}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}.rope-stage{position:relative;height:105px;overflow:hidden;border-radius:14px;background:linear-gradient(90deg,#dceaff 0 50%,#ffe5e7 50%);border:1px solid #dbe2eb}.centerline{position:absolute;left:50%;height:100%;border-left:2px dashed #8190a1}.rope{position:absolute;top:47%;height:8px;left:7%;right:7%;background:repeating-linear-gradient(90deg,#a87648 0 10px,#be9869 10px 20px);border-radius:10px}.rope-group{position:absolute;top:20px;left:50%;transform:translateX(-50%);transition:left .5s ease;width:100%;height:78px;pointer-events:none}.flag{position:absolute;left:50%;top:0;transform:translateX(-50%);height:69px;border-left:5px solid #fbba3a}.flag:after{content:'⚑';color:#e0aa0f;position:absolute;left:3px;top:-13px;font-size:34px}.players{position:absolute;font-size:35px;top:22px;white-space:nowrap;text-shadow:1px 2px #fff}.players.left{right:54%}.players.right{left:54%}.track{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:13px}.bar{height:12px;background:#f6ccd0;border-radius:20px;flex:1;overflow:hidden}.barfill{width:50%;height:100%;background:#4490e4;transition:width .5s}.arena{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}.side{display:flex;flex-direction:column;gap:8px;padding:12px;min-width:0;background:white;border-radius:17px;border-top:6px solid}.side.blue{border-color:#2d80d8}.side.red{border-color:#d85b66}.side-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.side-title{font-size:21px;font-weight:900}.blue .side-title{color:#2673c8}.red .side-title{color:#c84b55}.question{background:#f2f6fa;border-radius:12px;display:grid;place-items:center;text-align:center;min-height:70px;padding:12px;font-weight:800;font-size:clamp(20px,2.5vw,33px)}.scratch{position:relative;flex:1;min-height:110px;border:1px solid #cdd6e2;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(#fff 0 26px,#e6eef6 27px 28px)}.scratch canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.scratch-label{position:absolute;top:4px;left:8px;font-size:11px;color:#8090a0;pointer-events:none}.clear{position:absolute;right:5px;top:5px;border:1px solid #cfd9e3;background:#fff;border-radius:6px;font-size:12px;padding:4px 7px}.answer{display:grid;grid-template-columns:1fr auto;gap:8px}.answer-display{border:2px solid #cbd7e6;background:#fff;border-radius:10px;padding:10px;font-size:25px;min-height:50px;word-break:break-all}.submit{border:0;border-radius:10px;color:#fff;font-weight:bold;padding:8px 16px;background:#2d80d8}.red .submit{background:#d85b66}.submit:disabled{opacity:.5}.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.pad button{min-height:43px;border:1px solid #d3dde9;background:#f8fbff;border-radius:9px;font-weight:800;font-size:clamp(16px,1.5vw,23px)}.pad button:active{background:#c4e1ff}.status{height:23px;color:#56677e;font-size:14px;font-weight:bold;text-align:center}.footer{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;background:#334e72;color:#fff;padding:9px 14px;border-radius:8px;font-weight:bold}.btn.alt{background:#fff;color:#34425c;border:1px solid #b7c4d6}.mode-note{font-size:12px;color:#69788a}.dialog-wrap{position:fixed;inset:0;background:#142238aa;display:grid;place-items:center;z-index:10;padding:16px}.dialog{background:white;max-width:560px;width:100%;padding:25px;border-radius:20px;text-align:center;box-shadow:0 12px 42px #16253855}.dialog h2{margin-top:0}.options{display:grid;gap:10px;text-align:left}.option{border:1px solid #d9e1ea;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}.option select{border:0;min-width:130px}.hidden{display:none!important}@media (max-width:700px){.top{grid-template-columns:1fr 2fr 1fr;padding:8px}.arena{gap:5px}.side{padding:6px}.side-title{font-size:16px}.question{font-size:18px;min-height:65px}.answer{grid-template-columns:1fr}.answer-display{font-size:21px}.pad{gap:3px}.pad button{min-height:40px}.players{font-size:27px}.rope-stage{height:90px}.scratch{min-height:85px}.app{padding:5px}}@media (max-height:800px) and (min-width:800px){.scratch{min-height:85px}.pad button{min-height:36px}.question{min-height:55px}.rope-stage{height:83px}.top{padding:5px 12px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="score blue">🔵 <span id="blueScore">0</span></div><div class="center"><h1>數學拔河王</h1><div class="sub" id="unitText">七上 3-2｜一元一次方程式（測試題庫）</div><div class="timer" id="timer">03:00</div></div><div class="score red">🔴 <span id="redScore">0</span></div></header>
<div class="rope-stage"><div class="centerline"></div><div class="rope"></div><div class="rope-group" id="ropeGroup"><div class="players left">🧍‍♂️🧍‍♂️🧍‍♂️</div><div class="flag"></div><div class="players right">🧍‍♀️🧍‍♀️🧍‍♀️</div></div></div><div class="track"><span>藍隊</span><div class="bar"><div id="barfill" class="barfill"></div></div><span>紅隊</span></div>
<main class="arena">
<section class="side blue" id="blue"><div class="side-head"><div class="side-title">藍隊</div><small id="blueCount">第 1 題</small></div><div class="question" id="blueQuestion">準備開始</div><div class="scratch"><span class="scratch-label">✎ 計算紙（直接用觸控筆或手指書寫）</span><canvas id="blueCanvas"></canvas><button class="clear" data-clear="blue">清除筆跡</button></div><div class="answer"><div class="answer-display" id="blueAnswer">x = ？</div><button class="submit" id="blueSubmit" data-submit="blue">送出</button></div><div class="pad" id="bluePad"></div><div class="status" id="blueStatus"></div></section>
<section class="side red" id="red"><div class="side-head"><div class="side-title">紅隊</div><small id="redCount">第 1 題</small></div><div class="question" id="redQuestion">準備開始</div><div class="scratch"><span class="scratch-label">✎ 計算紙（直接用觸控筆或手指書寫）</span><canvas id="redCanvas"></canvas><button class="clear" data-clear="red">清除筆跡</button></div><div class="answer"><div class="answer-display" id="redAnswer">x = ？</div><button class="submit" id="redSubmit" data-submit="red">送出</button></div><div class="pad" id="redPad"></div><div class="status" id="redStatus"></div></section>
</main><footer class="footer"><button class="btn alt" id="pauseBtn">暫停</button><button class="btn" id="resetBtn">重新開始／設定</button><span class="mode-note">雙人共用觸控螢幕｜同難度不同題｜答錯冷卻 3 秒｜測試版（未連接既有遊戲）</span></footer></div>
<div class="dialog-wrap" id="modal"><div class="dialog"><h2 id="modalTitle">數學拔河王</h2><p id="modalDesc">左右雙方獨立解題，答對拉繩子一格。先拉滿 5 格或時間結束領先者獲勝。</p><div id="settings" class="options"><label class="option">比賽時間 <select id="duration"><option value="180" selected>180 秒（3 分鐘）</option><option value="120">120 秒</option><option value="300">300 秒</option></select></label><label class="option">勝利進度 <select id="winSteps"><option value="5" selected>5 格</option><option value="3">3 格</option><option value="7">7 格</option></select></label><label class="option">答錯冷卻 <select id="cooldown"><option value="3" selected>3 秒</option><option value="0">不冷卻</option><option value="5">5 秒</option></select></label><label class="option">題目模式 <span>同難度不同題目</span></label></div><p><button class="btn" id="modalButton">開始競賽</button></p></div></div>
<script>
'use strict';
// 獨立競賽引擎：不載入、不改寫任何原有遊戲檔案。接入正式題庫時，替換 questionProvider 即可。
const $=id=>document.getElementById(id);
const settings={duration:180,steps:5,cooldown:3};
const state={running:false,paused:false,ended:false,remain:180,pull:0,blue:{score:0,index:0,answer:'',question:null,lockedUntil:0,timer:null,pool:[]},red:{score:0,index:0,answer:'',question:null,lockedUntil:0,timer:null,pool:[]}};
const sides=['blue','red'];let interval=null;
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function generatePair(level){ // 每輪雙方同一難度級距；係數與答案獨立抽樣
 const useFraction=level%3===2; const choice=(m,n)=>m+Math.floor(Math.random()*(n-m+1));
 function make(){let p,q,x,num,den,question,answer;
  if(useFraction){den=choice(2,5);num=choice(-9,9);if(num===0)num=1;while(gcd(Math.abs(num),den)!==1)num=choice(1,9)*(Math.random()<.5?-1:1);p=choice(1,5)*den;q=choice(-12,12);x=num/den;answer=String(x);question=`${p}x ${q>=0?'+':'−'} ${Math.abs(q)} = ${p*x+q}`;return{question,answer,display:den===1?String(num):`${num}/${den}`,numeric:x,level};}
  x=choice(-9,12);p=choice(2,9);q=choice(-18,18);let rhs=p*x+q;question=`${p}x ${q>=0?'+':'−'} ${Math.abs(q)} = ${rhs}`;return{question,answer:String(x),display:String(x),numeric:x,level};}
 return [make(),make()];}
// 預先產生「配對題」，避免雙方抽到同一題；同輪相同難度分層。
function createPools(){let b=[],r=[];for(let i=0;i<80;i++){let pair,tries=0;do{pair=generatePair(i%6);tries++}while(pair[0].question===pair[1].question&&tries<15);b.push(pair[0]);r.push(pair[1]);}state.blue.pool=b;state.red.pool=r;}
function nextQuestion(side){const s=state[side];s.question=s.pool[s.index%s.pool.length];s.index++;s.answer='';s.lockedUntil=0;$(side+'Question').textContent=s.question.question;$(side+'Count').textContent=`第 ${s.index} 題`;$(side+'Status').textContent='';renderSide(side);clearPaper(side);}
function renderSide(side){const s=state[side];$(side+'Score').textContent=s.score;$(side+'Answer').textContent='x = '+(s.answer||'？');$(side+'Submit').disabled=!state.running||state.paused||state.ended||Date.now()<s.lockedUntil;}
function drawRope(){const ratio=state.pull/settings.steps;$('ropeGroup').style.left=`${50-ratio*33}%`;$('barfill').style.width=`${50+ratio*50}%`;}
function renderTime(){const m=Math.floor(state.remain/60),sec=state.remain%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function begin(){clearInterval(interval);settings.duration=+$('duration').value;settings.steps=+$('winSteps').value;settings.cooldown=+$('cooldown').value;state.running=true;state.paused=false;state.ended=false;state.remain=settings.duration;state.pull=0;createPools();for(const side of sides){let s=state[side];s.score=0;s.index=0;s.lockedUntil=0;clearTimeout(s.timer);nextQuestion(side);}renderTime();drawRope();$('pauseBtn').textContent='暫停';$('modal').classList.add('hidden');interval=setInterval(tick,1000);}
function tick(){if(!state.running||state.paused||state.ended)return;state.remain=Math.max(0,state.remain-1);renderTime();if(state.remain===0)finish();}
function finish(){if(state.ended)return;state.running=false;state.ended=true;clearInterval(interval);sides.forEach(renderSide);let who=state.pull>0?'藍隊獲勝！':state.pull<0?'紅隊獲勝！':'平手！';$('modalTitle').textContent='競賽結束｜'+who;$('modalDesc').textContent=`藍隊答對 ${state.blue.score} 題，紅隊答對 ${state.red.score} 題；最終拔河位移 ${Math.abs(state.pull)} 格。`;$('settings').classList.add('hidden');$('modalButton').textContent='重新比賽';$('modal').classList.remove('hidden');}
function type(side,key){const s=state[side];if(!state.running||state.paused||state.ended||Date.now()<s.lockedUntil)return;if(key==='⌫')s.answer=s.answer.slice(0,-1);else if(key==='清除')s.answer='';else if(s.answer.length<20)s.answer+=key;renderSide(side);}
function parseAnswer(txt){let x=txt.replace(/\s/g,'').replace('−','-');if(!x)return NaN;if(/^[-+]?\d+(?:\.\d+)?$/.test(x))return Number(x);const m=x.match(/^([-+]?\d+)\/([1-9]\d*)$/);if(m)return Number(m[1])/Number(m[2]);return NaN;}
function submit(side){const s=state[side];if(!state.running||state.paused||state.ended||Date.now()<s.lockedUntil||!s.answer)return;const value=parseAnswer(s.answer);if(Number.isFinite(value)&&Math.abs(value-s.question.numeric)<1e-8){s.score++;state.pull+=side==='blue'?1:-1;renderSide(side);drawRope();$(side+'Status').textContent='✅ 答對！拉動一格';if(Math.abs(state.pull)>=settings.steps){finish();return;}nextQuestion(side);}else{const seconds=settings.cooldown;s.lockedUntil=Date.now()+seconds*1000;$(side+'Status').textContent=seconds?`❌ 答錯，冷卻 ${seconds} 秒`:'❌ 答錯，請再試一次';renderSide(side);if(seconds){clearTimeout(s.timer);s.timer=setTimeout(()=>{s.lockedUntil=0;if(!state.ended){$(side+'Status').textContent='可重新作答';renderSide(side);}},seconds*1000);}}}
for(const side of sides){const pad=$(side+'Pad');for(const key of ['7','8','9','⌫','4','5','6','−','1','2','3','/','清除','0','.','送出']){const b=document.createElement('button');b.textContent=key;b.type='button';b.addEventListener('click',()=>key==='送出'?submit(side):type(side,key));pad.appendChild(b);}$(side+'Submit').addEventListener('click',()=>submit(side));document.querySelector(`[data-clear="${side}"]`).addEventListener('click',()=>clearPaper(side));}
$('pauseBtn').addEventListener('click',()=>{if(!state.running||state.ended)return;state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'繼續':'暫停';sides.forEach(renderSide);});
$('resetBtn').addEventListener('click',()=>{state.running=false;state.paused=false;clearInterval(interval);$('settings').classList.remove('hidden');$('modalTitle').textContent='競賽設定';$('modalDesc').textContent='按下開始即可進行雙人觸控競賽。';$('modalButton').textContent='開始競賽';$('modal').classList.remove('hidden');sides.forEach(renderSide);});
$('modalButton').addEventListener('click',()=>{if($('settings').classList.contains('hidden'))$('settings').classList.remove('hidden');begin();});
// 每隊各自保存 Pointer ID，可同時在兩個 canvas 寫字。
const pens={blue:new Map(),red:new Map()};function fitCanvas(side){const canvas=$(side+'Canvas'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const old=document.createElement('canvas');if(canvas.width&&canvas.height){old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);}canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);if(old.width){ctx.drawImage(old,0,0,rect.width,rect.height);}ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2b425e';}
function clearPaper(side){const canvas=$(side+'Canvas');const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);}
for(const side of sides){const canvas=$(side+'Canvas');const pts=pens[side];function loc(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}canvas.addEventListener('pointerdown',e=>{if(!state.running||state.paused||state.ended)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,loc(e));});canvas.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;e.preventDefault();const p=pts.get(e.pointerId),n=loc(e),ctx=canvas.getContext('2d');ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(n.x,n.y);ctx.stroke();pts.set(e.pointerId,n);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>pts.delete(e.pointerId));}
window.addEventListener('resize',()=>sides.forEach(fitCanvas));requestAnimationFrame(()=>sides.forEach(fitCanvas));
</script></body></html>
